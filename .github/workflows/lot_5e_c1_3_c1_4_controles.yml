name: Contrôles LOT pilote 5e C1.3-C1.4

on:
  push:
    branches:
      - draft/lot-5e-c1-3-c1-4-sequence-qcm
    paths:
      - .github/workflows/lot_5e_c1_3_c1_4_controles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corriger-et-tester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/lot-5e-c1-3-c1-4-sequence-qcm

      - name: Nettoyer le HTML hérité
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('theme-1-objets-systemes-usages-interactions/C1-decrire-les-liens-entre-usages-et-evolutions/5e/5e_C1.3/sequence_C1.3-C1.4_SI_gestion_donnees.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("\n \n \n <style>\n  /* Lisibilité des liens sur fond sombre */","\n\n  /* Lisibilité des liens sur fond sombre */",1)
          s=s.replace("\n \n \n \n </style>\n  <link rel=\"stylesheet\" href=\"../../../../_assets/codelab-techno.css\">","\n  <link rel=\"stylesheet\" href=\"../../../../_assets/codelab-techno.css\">",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Vérifier la syntaxe JavaScript
        shell: bash
        run: |
          node --check _assets/codelab-techno.js
          node --check _assets/qcm-eleve.js
          node --check _assets/sequence-eleve.js

      - name: Vérifier les éléments essentiels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          base=Path('theme-1-objets-systemes-usages-interactions/C1-decrire-les-liens-entre-usages-et-evolutions/5e/5e_C1.3')
          seq=(base/'sequence_C1.3-C1.4_SI_gestion_donnees.html').read_text(encoding='utf-8')
          qcm=(base/'qcm_systemes_information_donnees.html').read_text(encoding='utf-8')
          checks={
            'viewport séquence':'name="viewport"' in seq,
            'éditeur CodeLab':'class="codelab-techno"' in seq,
            'lien vers QCM':'href="qcm_systemes_information_donnees.html"' in seq,
            'retour vers séquence':'qcm-eleve.js' in qcm,
            'classe 5e':'Classe (ex. 5eB)' in qcm,
            '24 questions':len(re.findall(r'<section class="card"',qcm))==24,
            'script progression':'../../../../_assets/qcm-eleve.js' in qcm,
            'CSS progression':'../../../../_assets/qcm-eleve.css' in qcm,
            'matrice couverture':(base/'couverture_sequence_qcm.json').exists(),
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('OK  ' if v else 'ECHEC ')+k)
          if failed: sys.exit('Contrôles échoués: '+', '.join(failed))
          PY

      - name: Enregistrer le nettoyage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-1-objets-systemes-usages-interactions/C1-decrire-les-liens-entre-usages-et-evolutions/5e/5e_C1.3/sequence_C1.3-C1.4_SI_gestion_donnees.html
          if ! git diff --cached --quiet; then
            git commit -m "[lot-auto] nettoyer le HTML et valider les composants du lot pilote"
            git push origin HEAD:draft/lot-5e-c1-3-c1-4-sequence-qcm
          fi
