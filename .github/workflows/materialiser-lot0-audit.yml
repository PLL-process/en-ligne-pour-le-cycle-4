name: Materialiser les sorties du LOT 0

on:
  push:
    branches:
      - draft/agent-sequences

permissions:
  contents: write

jobs:
  generer-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: draft/agent-sequences

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Régénérer CSV et JSON
        run: python3 _outils/build_audit.py

      - name: Enregistrer uniquement les sorties générées
        shell: bash
        run: |
          git add audit_couverture.csv audit_couverture.json
          if git diff --cached --quiet; then
            echo "Les sorties sont déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(audit): matérialiser les sorties CSV et JSON"
          git push origin HEAD:draft/agent-sequences
