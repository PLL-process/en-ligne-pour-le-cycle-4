name: LOT pilote 5e C1.3-C1.4 — passe 3

on:
  push:
    branches:
      - draft/lot-5e-c1-3-c1-4-sequence-qcm
    paths:
      - .github/workflows/lot_5e_c1_3_c1_4_passe3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tactile-et-progressivite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/lot-5e-c1-3-c1-4-sequence-qcm

      - name: Créer le mode tactile et la progressivité
        shell: bash
        run: |
          cat > _assets/tactile-classement.css <<'EOF'
          .drag-item.tactile-selected{outline:3px solid #61dafb;outline-offset:2px;box-shadow:0 0 0 4px rgba(97,218,251,.2)}
          .drop-zone.tactile-target,.mini-zone.tactile-target{outline:3px dashed #81fba1;outline-offset:2px}
          .tactile-help{margin:.5rem 0;padding:.65rem .8rem;border-left:4px solid #61dafb;background:#0e2137;border-radius:8px;color:#dceaff}
          .tactile-live{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
          .progressive-note{margin:.7rem 0;padding:.7rem .9rem;border-left:4px solid #ffd66b;background:#2d2614;border-radius:8px;color:#fff3c4}
          details.approfondissement{margin:.8rem 0;border:1px solid #4178be;border-radius:10px;background:#0d2a4e;padding:.6rem .8rem}
          details.approfondissement summary{cursor:pointer;font-weight:700;color:#9bbefc}
          @media(max-width:700px){.drag-item{min-height:44px;display:flex;align-items:center;justify-content:center}.drop-zone,.mini-zone{min-height:72px}}
          EOF

          cat > _assets/tactile-classement.js <<'EOF'
          (()=>{document.addEventListener('DOMContentLoaded',()=>{
            const items=[...document.querySelectorAll('.drag-item')], zones=[...document.querySelectorAll('.drop-zone,.mini-zone')];if(!items.length||!zones.length)return;
            const key=`classement:${location.pathname}`, live=document.createElement('div');live.className='tactile-live';live.setAttribute('aria-live','polite');document.body.appendChild(live);
            let selected=null;
            const label=e=>(e.innerText||e.textContent||'élément').trim().replace(/\s+/g,' ');
            const clear=()=>{items.forEach(i=>{i.classList.remove('tactile-selected');i.setAttribute('aria-pressed','false')});zones.forEach(z=>z.classList.remove('tactile-target'));selected=null};
            const choose=item=>{clear();selected=item;item.classList.add('tactile-selected');item.setAttribute('aria-pressed','true');zones.forEach(z=>z.classList.add('tactile-target'));live.textContent=`${label(item)} sélectionné. Touchez maintenant une catégorie.`};
            const place=zone=>{if(!selected)return;const target=zone.querySelector('ul')||zone;target.appendChild(selected);live.textContent=`${label(selected)} placé dans ${label(zone.querySelector('h4')||zone)}.`;clear();save()};
            items.forEach((item,index)=>{item.tabIndex=0;item.setAttribute('role','button');item.setAttribute('aria-pressed','false');item.dataset.tactileId=item.dataset.tactileId||`item-${index}`;item.addEventListener('click',e=>{e.stopPropagation();selected===item?clear():choose(item)});item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected===item?clear():choose(item)}});item.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',item.dataset.tactileId))});
            zones.forEach((zone,index)=>{zone.tabIndex=0;zone.dataset.tactileZone=zone.id||`zone-${index}`;zone.addEventListener('click',()=>place(zone));zone.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selected){e.preventDefault();place(zone)}});zone.addEventListener('dragover',e=>e.preventDefault());zone.addEventListener('drop',e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain'),item=items.find(i=>i.dataset.tactileId===id);if(item){selected=item;place(zone)}})});
            function save(){const data={};items.forEach(i=>{const z=i.closest('.drop-zone,.mini-zone');data[i.dataset.tactileId]=z?.dataset.tactileZone||null});localStorage.setItem(key,JSON.stringify(data))}
            try{const data=JSON.parse(localStorage.getItem(key)||'{}');items.forEach(i=>{const zid=data[i.dataset.tactileId];if(!zid)return;const z=zones.find(x=>x.dataset.tactileZone===zid);if(z)(z.querySelector('ul')||z).appendChild(i)})}catch(e){console.warn('Classement tactile non restauré',e)}
            document.querySelectorAll('.drag-container').forEach(c=>{const n=document.createElement('p');n.className='tactile-help';n.textContent='Sur tablette : touchez un élément, puis touchez la catégorie choisie. Sur ordinateur, le glisser-déposer reste disponible.';c.before(n)});
          })})();
          EOF

          cat > _assets/sequence-progressive.js <<'EOF'
          (()=>{document.addEventListener('DOMContentLoaded',()=>{
            const first=document.getElementById('conv1');if(first){const table=first.closest('table'),rows=[...table.querySelectorAll('tr')].filter(r=>{const i=r.querySelector('input[id^="conv"]');return i&&Number(i.id.replace('conv',''))>10});if(rows.length){const note=document.createElement('p');note.className='progressive-note';note.innerHTML='<strong>Parcours essentiel :</strong> commence par les 10 premières conversions. Les 20 suivantes sont proposées en approfondissement.';table.before(note);const details=document.createElement('details');details.className='approfondissement';details.innerHTML='<summary>Approfondissement — 20 conversions supplémentaires</summary>';const t=document.createElement('table');t.className='info';rows.forEach(r=>t.appendChild(r));details.appendChild(t);table.after(details)}}
            const h=[...document.querySelectorAll('h3')].find(x=>x.textContent.includes('Associer préfixes'));if(h){const n=document.createElement('p');n.className='progressive-note';n.innerHTML='<strong>Repère 5e :</strong> kilo, méga, giga et téra sont essentiels pour le stockage. Milli, micro, nano et pico constituent un approfondissement scientifique.';h.after(n)}
          })})();
          EOF

      - name: Nettoyer la séquence et ajouter les scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('theme-1-objets-systemes-usages-interactions/C1-decrire-les-liens-entre-usages-et-evolutions/5e/5e_C1.3/sequence_C1.3-C1.4_SI_gestion_donnees.html')
          s=p.read_text(encoding='utf-8')
          duplicate='''    </div>\n      <div class="drag-item" draggable="true">Disque dur externe 1 To</div>\n      <div class="drag-item" draggable="true">Blu‑ray 50 Go</div>\n      <div class="drag-item" draggable="true">CD 700 Mo</div>\n      <div class="drag-item" draggable="true">Carte SD 64 Go</div>\n      <div class="drag-item" draggable="true">Smartphone 256 Go</div>\n      <div class="drag-item" draggable="true">Serveur cloud 10 To</div>\n    </div>'''
          if duplicate in s:s=s.replace(duplicate,'    </div>',1)
          s=s.replace('<div class="drop-zone"><h4>Plus de 1 To</h4><ul id="cat4"></ul></div>','<div class="drop-zone"><h4>1 To et plus</h4><ul id="cat4"></ul></div>')
          s=s.replace('• Plus de 1 To : Disque dur externe 1 To, Serveur cloud 10 To.','• 1 To et plus : Disque dur externe 1 To, Serveur cloud 10 To.')
          if '_assets/tactile-classement.css' not in s:s=s.replace('</head>','  <link rel="stylesheet" href="../../../../_assets/tactile-classement.css">\n</head>',1)
          if '_assets/tactile-classement.js' not in s:s=s.replace('</body>','  <script src="../../../../_assets/tactile-classement.js"></script>\n  <script src="../../../../_assets/sequence-progressive.js"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Tester
        shell: bash
        run: |
          node --check _assets/tactile-classement.js
          node --check _assets/sequence-progressive.js
          python - <<'PY'
          from pathlib import Path
          p=Path('theme-1-objets-systemes-usages-interactions/C1-decrire-les-liens-entre-usages-et-evolutions/5e/5e_C1.3/sequence_C1.3-C1.4_SI_gestion_donnees.html')
          s=p.read_text(encoding='utf-8')
          assert s.count('Disque dur externe 1 To</div>')==1
          assert '1 To et plus' in s
          assert 'tactile-classement.js' in s and 'sequence-progressive.js' in s
          print('OK : duplication supprimée, tactile et progressivité intégrés')
          PY

      - name: Enregistrer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _assets theme-1-objets-systemes-usages-interactions/C1-decrire-les-liens-entre-usages-et-evolutions/5e/5e_C1.3/sequence_C1.3-C1.4_SI_gestion_donnees.html
          git commit -m "[lot-auto] ajouter le tactile et un parcours progressif de conversions"
          git push origin HEAD:draft/lot-5e-c1-3-c1-4-sequence-qcm
