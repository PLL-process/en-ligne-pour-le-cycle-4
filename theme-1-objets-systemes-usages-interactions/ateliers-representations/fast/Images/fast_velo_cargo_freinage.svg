<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 398" width="820" height="398" class="schema" id="fa-velo" role="img" aria-labelledby="fa-velo-t fa-velo-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="fa-velo-t">Extrait du diagramme FAST du vélo-cargo : deux principes pour ralentir la roue</title><desc id="fa-velo-d">Diagramme FAST en trois colonnes, avec les flèches « Pourquoi ? » vers la gauche et « Comment ? » vers la droite. Fonction d&#x27;usage : transporter les enfants et les courses de Léa. Trois fonctions techniques. Transmettre l&#x27;effort de Léa à la roue : le pédalier et la chaîne. Ralentir la roue : deux cases reliées par le mot « ou » — frein à patins, frottement sur la jante, ou frein à disque, frottement sur un disque. Porter les enfants et les courses : le bac à rebords hauts.</desc><rect x="0" y="0" width="820" height="398" fill="#fbfcff"/><defs><marker id="fa-velo-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#1b2438"/></marker></defs><line x1="300" y1="30" x2="40" y2="30" stroke="#5b6b86" stroke-width="2.2" marker-end="url(#fa-velo-pt)"/><text x="170.0" y="48.0" font-size="13" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="170.0" dy="-0.00em">POURQUOI ?</tspan></text><line x1="520" y1="30" x2="780" y2="30" stroke="#5b6b86" stroke-width="2.2" marker-end="url(#fa-velo-pt)"/><text x="650.0" y="48.0" font-size="13" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="650.0" dy="-0.00em">COMMENT ?</tspan></text><text x="115.0" y="78.0" font-size="12.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="115.0" dy="-0.00em">Fonction d&#x27;usage</tspan></text><text x="400.0" y="78.0" font-size="12.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="400.0" dy="-0.00em">Fonctions techniques</tspan></text><text x="690.0" y="78.0" font-size="12.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="690.0" dy="-0.00em">Solutions techniques</tspan></text><rect x="20" y="212.0" width="190" height="64" rx="8" fill="#fff8e6" stroke="#a06a00" stroke-width="2.6"/><text x="115.0" y="244.0" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="115.0" dy="-1.15em">Transporter les</tspan><tspan x="115.0" dy="1.15em">enfants et les</tspan><tspan x="115.0" dy="1.15em">courses de Léa</tspan></text><line x1="210" y1="244.0" x2="240" y2="244.0" stroke="#1b2438" stroke-width="2.2"/><line x1="240" y1="136.0" x2="240" y2="352.0" stroke="#1b2438" stroke-width="2.2"/><line x1="240" y1="136.0" x2="270" y2="136.0" stroke="#1b2438" stroke-width="2.2"/><rect x="270" y="109.0" width="260" height="54" rx="6" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="400.0" y="136.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.57em">transmettre l&#x27;effort de Léa à</tspan><tspan x="400.0" dy="1.15em">la roue</tspan></text><path d="M530,136.0 H555 V136.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="109.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="136.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="695.0" dy="-0.00em">le pédalier et la chaîne</tspan></text><line x1="240" y1="244.0" x2="270" y2="244.0" stroke="#1b2438" stroke-width="2.2"/><rect x="270" y="217.0" width="260" height="54" rx="6" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="400.0" y="244.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.00em">ralentir la roue</tspan></text><path d="M530,244.0 H555 V208.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="181.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="208.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="695.0" dy="-0.57em">frein à patins :</tspan><tspan x="695.0" dy="1.15em">frottement sur la jante</tspan></text><text x="570.0" y="244.0" font-size="12.5" fill="#16753a" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="570.0" dy="-0.00em">ou</tspan></text><path d="M530,244.0 H555 V280.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="253.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="280.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="695.0" dy="-0.57em">frein à disque :</tspan><tspan x="695.0" dy="1.15em">frottement sur un disque</tspan></text><line x1="240" y1="352.0" x2="270" y2="352.0" stroke="#1b2438" stroke-width="2.2"/><rect x="270" y="325.0" width="260" height="54" rx="6" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="400.0" y="352.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.57em">porter les enfants et les</tspan><tspan x="400.0" dy="1.15em">courses</tspan></text><path d="M530,352.0 H555 V352.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="325.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="352.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="695.0" dy="-0.00em">le bac à rebords hauts</tspan></text></svg>
