<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 614" width="820" height="614" class="schema" id="fa-stat2" role="img" aria-labelledby="fa-stat2-t fa-stat2-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="fa-stat2-t">Le diagramme FAST de la station d&#x27;alerte cyclonique, corrigé</title><desc id="fa-stat2-d">Diagramme FAST en trois colonnes, avec les flèches « Pourquoi ? » vers la gauche et « Comment ? » vers la droite. Fonction d&#x27;usage : prévenir les habitants quand un cyclone approche. Cinq branches, de haut en bas. Mesurer la vitesse du vent : l&#x27;anémomètre. Décider du niveau d&#x27;alerte : la carte programmable. Diffuser l&#x27;alerte aux habitants : trois solutions reliées par « ou » — la sirène, ou un message sur les téléphones, ou un panneau lumineux à LED. Stocker l&#x27;énergie pour la nuit : la batterie 12 V. Capter l&#x27;énergie du soleil : le panneau solaire.</desc><rect x="0" y="0" width="820" height="614" fill="#fbfcff"/><defs><marker id="fa-stat2-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#1b2438"/></marker></defs><line x1="300" y1="30" x2="40" y2="30" stroke="#5b6b86" stroke-width="2.2" marker-end="url(#fa-stat2-pt)"/><text x="170.0" y="48.0" font-size="13" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="170.0" dy="-0.00em">POURQUOI ?</tspan></text><line x1="520" y1="30" x2="780" y2="30" stroke="#5b6b86" stroke-width="2.2" marker-end="url(#fa-stat2-pt)"/><text x="650.0" y="48.0" font-size="13" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="650.0" dy="-0.00em">COMMENT ?</tspan></text><text x="115.0" y="78.0" font-size="12.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="115.0" dy="-0.00em">Fonction d&#x27;usage</tspan></text><text x="400.0" y="78.0" font-size="12.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="400.0" dy="-0.00em">Fonctions techniques</tspan></text><text x="690.0" y="78.0" font-size="12.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="690.0" dy="-0.00em">Solutions techniques</tspan></text><rect x="20" y="320.0" width="190" height="64" rx="8" fill="#fff8e6" stroke="#a06a00" stroke-width="2.6"/><text x="115.0" y="352.0" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="115.0" dy="-1.15em">Prévenir les</tspan><tspan x="115.0" dy="1.15em">habitants quand un</tspan><tspan x="115.0" dy="1.15em">cyclone approche</tspan></text><line x1="210" y1="352.0" x2="240" y2="352.0" stroke="#1b2438" stroke-width="2.2"/><line x1="240" y1="136.0" x2="240" y2="568.0" stroke="#1b2438" stroke-width="2.2"/><line x1="240" y1="136.0" x2="270" y2="136.0" stroke="#1b2438" stroke-width="2.2"/><rect x="270" y="109.0" width="260" height="54" rx="6" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="400.0" y="136.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.00em">mesurer la vitesse du vent</tspan></text><path d="M530,136.0 H555 V136.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="109.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="136.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="695.0" dy="-0.00em">l&#x27;anémomètre</tspan></text><line x1="240" y1="208.0" x2="270" y2="208.0" stroke="#1b2438" stroke-width="2.2"/><rect x="270" y="181.0" width="260" height="54" rx="6" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="400.0" y="208.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.00em">décider du niveau d&#x27;alerte</tspan></text><path d="M530,208.0 H555 V208.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="181.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="208.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="695.0" dy="-0.00em">la carte programmable</tspan></text><line x1="240" y1="352.0" x2="270" y2="352.0" stroke="#1b2438" stroke-width="2.2"/><rect x="270" y="325.0" width="260" height="54" rx="6" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="400.0" y="352.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.57em">diffuser l&#x27;alerte aux</tspan><tspan x="400.0" dy="1.15em">habitants</tspan></text><path d="M530,352.0 H555 V280.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="253.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="280.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="695.0" dy="-0.00em">la sirène</tspan></text><text x="570.0" y="316.0" font-size="12.5" fill="#16753a" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="570.0" dy="-0.00em">ou</tspan></text><path d="M530,352.0 H555 V352.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="325.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="352.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="695.0" dy="-0.57em">un message sur les</tspan><tspan x="695.0" dy="1.15em">téléphones</tspan></text><text x="570.0" y="388.0" font-size="12.5" fill="#16753a" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="570.0" dy="-0.00em">ou</tsp