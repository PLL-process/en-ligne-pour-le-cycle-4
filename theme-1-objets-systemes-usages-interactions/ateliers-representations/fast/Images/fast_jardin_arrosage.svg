<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 542" width="820" height="542" class="schema" id="fa-jard2" role="img" aria-labelledby="fa-jard2-t fa-jard2-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="fa-jard2-t">Diagramme FAST du système d&#x27;arrosage, complet</title><desc id="fa-jard2-d">Diagramme FAST en trois colonnes, avec les flèches « Pourquoi ? » vers la gauche et « Comment ? » vers la droite. Fonction d&#x27;usage : arroser les plantes quand la terre est sèche. Six fonctions techniques, de haut en bas : mesurer l&#x27;humidité du sol ; décider quand arroser ; envoyer l&#x27;état au smartphone ; laisser passer l&#x27;eau ou la bloquer ; faire circuler l&#x27;eau jusqu&#x27;aux bacs ; stocker l&#x27;eau de pluie. Les solutions, dans le même ordre : le capteur d&#x27;humidité du sol ; la carte programmable ; le module Wi-Fi ; l&#x27;électrovanne ; la pompe et les tuyaux ; la cuve.</desc><rect x="0" y="0" width="820" height="542" fill="#fbfcff"/><defs><marker id="fa-jard2-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#1b2438"/></marker></defs><line x1="300" y1="30" x2="40" y2="30" stroke="#5b6b86" stroke-width="2.2" marker-end="url(#fa-jard2-pt)"/><text x="170.0" y="48.0" font-size="13" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="170.0" dy="-0.00em">POURQUOI ?</tspan></text><line x1="520" y1="30" x2="780" y2="30" stroke="#5b6b86" stroke-width="2.2" marker-end="url(#fa-jard2-pt)"/><text x="650.0" y="48.0" font-size="13" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="650.0" dy="-0.00em">COMMENT ?</tspan></text><text x="115.0" y="78.0" font-size="12.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="115.0" dy="-0.00em">Fonction d&#x27;usage</tspan></text><text x="400.0" y="78.0" font-size="12.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="400.0" dy="-0.00em">Fonctions techniques</tspan></text><text x="690.0" y="78.0" font-size="12.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="690.0" dy="-0.00em">Solutions techniques</tspan></text><rect x="20" y="284.0" width="190" height="64" rx="8" fill="#fff8e6" stroke="#a06a00" stroke-width="2.6"/><text x="115.0" y="316.0" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="115.0" dy="-1.15em">Arroser les plantes</tspan><tspan x="115.0" dy="1.15em">quand la terre est</tspan><tspan x="115.0" dy="1.15em">sèche</tspan></text><line x1="210" y1="316.0" x2="240" y2="316.0" stroke="#1b2438" stroke-width="2.2"/><line x1="240" y1="136.0" x2="240" y2="496.0" stroke="#1b2438" stroke-width="2.2"/><line x1="240" y1="136.0" x2="270" y2="136.0" stroke="#1b2438" stroke-width="2.2"/><rect x="270" y="109.0" width="260" height="54" rx="6" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="400.0" y="136.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.00em">mesurer l&#x27;humidité du sol</tspan></text><path d="M530,136.0 H555 V136.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="109.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="136.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="695.0" dy="-0.57em">le capteur d&#x27;humidité du</tspan><tspan x="695.0" dy="1.15em">sol</tspan></text><line x1="240" y1="208.0" x2="270" y2="208.0" stroke="#1b2438" stroke-width="2.2"/><rect x="270" y="181.0" width="260" height="54" rx="6" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="400.0" y="208.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.00em">décider quand arroser</tspan></text><path d="M530,208.0 H555 V208.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="181.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="208.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="695.0" dy="-0.00em">la carte programmable</tspan></text><line x1="240" y1="280.0" x2="270" y2="280.0" stroke="#1b2438" stroke-width="2.2"/><rect x="270" y="253.0" width="260" height="54" rx="6" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="400.0" y="280.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.00em">envoyer l&#x27;état au smartphone</tspan></text><path d="M530,280.0 H555 V280.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="253.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="280.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="695.0" dy="-0.00em">le module Wi-Fi</tspan></text><line x1="240" y1="352.0" x2="270" y2="352.0" stroke="#1b2438" stroke-width="2.2"/><rect x="270" y="325.0" width="260" height="54" rx="6" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="400.0" y="352.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.57em">laisser passer l&#x27;eau ou la</tspan><tspan x="400.0" dy="1.15em">bloquer</tspan></text><path d="M530,352.0 H555 V352.0 H585" fill="none" stroke="#1b2438" stroke-width="2.2"/><rect x="585" y="325.0" width="220" height="54" rx="6" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="695.0" y="352.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="7