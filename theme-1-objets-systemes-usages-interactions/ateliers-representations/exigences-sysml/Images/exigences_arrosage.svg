<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" class="schema" id="ex-arrosage" role="img" aria-labelledby="ex-arrosage-t ex-arrosage-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="ex-arrosage-t">Diagramme des exigences du système d&#x27;arrosage du jardin</title><desc id="ex-arrosage-d">En haut, au centre, le bloc d&#x27;exigence Id 1, nommé Arrosage autonome : le système doit arroser les plantes du jardin en l&#x27;absence de la gardienne. De son bord inférieur, un petit cercle à croix part vers quatre blocs placés en dessous, de gauche à droite : Id 1.1, Étanchéité, le boîtier doit résister aux projections d&#x27;eau, IPX4 au moins ; Id 1.2, Sobriété, au plus 10 L d&#x27;eau par jour ; Id 1.3, Réglage, l&#x27;heure d&#x27;arrosage doit se changer sans outil, en 2 min au plus ; Id 1.4, Sécurité électrique, très basse tension, 12 V. Chaque bloc porte en haut le mot requirement.</desc><rect x="0" y="0" width="820" height="340" fill="#fbfcff"/><defs><marker id="ex-arrosage-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#5b6b86"/></marker></defs><line x1="410.0" y1="145.0" x2="109.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="145.0" x2="311.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="145.0" x2="513.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="145.0" x2="715.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><rect x="250.0" y="18.0" width="320" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="250.0" y1="60.0" x2="570.0" y2="60.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="410.0" y="31.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="-0.00em">«requirement»</tspan></text><text x="410.0" y="48.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Arrosage autonome</tspan></text><text x="260.0" y="74.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="260.0" dy="-0.00em">Id = 1</tspan></text><text x="410.0" y="104.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="-0.57em">Le système doit arroser les plantes du</tspan><tspan x="410.0" dy="1.15em">jardin en l&#x27;absence de la gardienne.</tspan></text><rect x="14.0" y="200.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="14.0" y1="242.0" x2="204.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="109.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="109.0" dy="-0.00em">«requirement»</tspan></text><text x="109.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="109.0" dy="-0.00em">Étanchéité</tspan></text><text x="24.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="24.0" dy="-0.00em">Id = 1.1</tspan></text><text x="109.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="109.0" dy="-1.15em">Le boîtier doit résister</tspan><tspan x="109.0" dy="1.15em">aux projections d&#x27;eau :</tspan><tspan x="109.0" dy="1.15em">IPX4 au moins.</tspan></text><rect x="216.0" y="200.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="216.0" y1="242.0" x2="406.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="311.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="311.0" dy="-0.00em">«requirement»</tspan></text><text x="311.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="311.0" dy="-0.00em">Sobriété</tspan></text><text x="226.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="226.0" dy="-0.00em">Id = 1.2</tspan></text><text x="311.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="311.0" dy="-1.15em">Le système doit utiliser</tspan><tspan x="311.0" dy="1.15em">au plus 10 L d&#x27;eau par</tspan><tspan x="311.0" dy="1.15em">jour.</tspan></text><rect x="418.0" y="200.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="418.0" y1="242.0" x2="608.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="513.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="513.0" dy="-0.00em">«requirement»</tspan></text><text x="513.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="513.0" dy="-0.00em">Réglage</tspan></text><text x="428.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="428.0" dy="-0.00em">Id = 1.3</tspan></text><text x="513.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="513.0" dy="-1.15em">L&#x27;heure d&#x27;arrosage doit se</tspan><tspan x="513.0" dy="1.15em">changer sans outil, en 2</tspan><tspan x="513.0" dy="1.15em">min au plus.</tspan></text><rect x="620.0" y="200.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="620.0" y1="242.0" x2="810.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="715.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="715.0" dy="-0.00em">«requirement»</tspan></text><text x="715.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="715.0" dy="-0.00em">Sécurité électrique</tspan></text><text x="630.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="630.0" dy="-0.00em">Id = 1.4</tspan></text><text x="715.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="715.0" dy="-1.15em">Le système doit être</tspan><tspan x="715.0" dy="1.15em">alimenté en très basse</tspan><tspan x="715.0" dy="1.15em">tension : 12 V.</tspan></text></svg>
