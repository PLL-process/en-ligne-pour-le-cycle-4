<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 575.5" width="820" height="575.5" class="schema" id="ex-arrosage-tests" role="img" aria-labelledby="ex-arrosage-tests-t ex-arrosage-tests-d" font-family="'Segoe UI',system-ui,Arial,sans-serif" data-legende-unites="27.5"><title id="ex-arrosage-tests-t">Diagramme des exigences du système d&#x27;arrosage, avec le test qui vérifie chaque exigence</title><desc id="ex-arrosage-tests-d">En haut, au centre, le bloc d&#x27;exigence Id 1, nommé Arrosage autonome : le système doit arroser les plantes du jardin en l&#x27;absence de la gardienne. De son bord inférieur, un petit cercle à croix part vers quatre blocs placés en dessous, de gauche à droite : Id 1.1, Étanchéité, le boîtier doit résister aux projections d&#x27;eau, IPX4 au moins ; Id 1.2, Sobriété, au plus 10 L d&#x27;eau par jour ; Id 1.3, Réglage, l&#x27;heure d&#x27;arrosage doit se changer sans outil, en 2 min au plus ; Id 1.4, Sécurité électrique, très basse tension, 12 V. Chaque bloc porte en haut le mot requirement. Sous chacun des quatre blocs, un bloc vert marqué testCase, relié à lui par une flèche en tirets nommée verify, qui monte du test vers l&#x27;exigence : sous 1.1, T3, essai à l&#x27;arroseur, 10 minutes de tous côtés, aucune goutte dedans ; sous 1.2, T1, relevé du compteur d&#x27;eau sur 24 heures, 10 litres au plus ; sous 1.3, T4, réglage chronométré, aucun outil, 2 minutes au plus ; sous 1.4, T2, mesure de la tension au multimètre, 12 volts. Unités : V (volts).</desc><rect x="0" y="0" width="820" height="575.5" fill="#fbfcff" data-legende-unites-fond="548"/><defs><marker id="ex-arrosage-tests-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#5b6b86"/></marker></defs><line x1="410.0" y1="145.0" x2="109.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="145.0" x2="311.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="145.0" x2="513.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="145.0" x2="715.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="109.0" y1="410.0" x2="109.0" y2="318.0" stroke="#5b6b86" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ex-arrosage-tests-pt)"/><text x="143.2" y="364.0" font-size="12" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="143.2" dy="-0.00em">«verify»</tspan></text><line x1="311.0" y1="410.0" x2="311.0" y2="318.0" stroke="#5b6b86" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ex-arrosage-tests-pt)"/><text x="345.2" y="364.0" font-size="12" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="345.2" dy="-0.00em">«verify»</tspan></text><line x1="513.0" y1="410.0" x2="513.0" y2="318.0" stroke="#5b6b86" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ex-arrosage-tests-pt)"/><text x="547.2" y="364.0" font-size="12" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="547.2" dy="-0.00em">«verify»</tspan></text><line x1="715.0" y1="410.0" x2="715.0" y2="318.0" stroke="#5b6b86" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ex-arrosage-tests-pt)"/><text x="749.2" y="364.0" font-size="12" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="749.2" dy="-0.00em">«verify»</tspan></text><rect x="250.0" y="18.0" width="320" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="250.0" y1="60.0" x2="570.0" y2="60.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="410.0" y="31.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="-0.00em">«requirement»</tspan></text><text x="410.0" y="48.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Arrosage autonome</tspan></text><text x="260.0" y="74.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="260.0" dy="-0.00em">Id = 1</tspan></text><text x="410.0" y="104.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="-0.57em">Le système doit arroser les plantes du</tspan><tspan x="410.0" dy="1.15em">jardin en l&#x27;absence de la gardienne.</tspan></text><rect x="14.0" y="200.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="14.0" y1="242.0" x2="204.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="109.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="109.0" dy="-0.00em">«requirement»</tspan></text><text x="109.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="109.0" dy="-0.00em">Étanchéité</tspan></text><text x="24.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="24.0" dy="-0.00em">Id = 1.1</tspan></text><text x="109.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="109.0" dy="-1.15em">Le boîtier doit résister</tspan><tspan x="109.0" dy="1.15em">aux projections d&#x27;eau :</tspan><tspan x="109.0" dy="1.15em">IPX4 au moins.</tspan></text><rect x="216.0" y="200.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="216.0" y1="242.0" x2="406.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="311.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="311.0" dy="-0.00em">«requirement»</tspan></text><text x="311.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="311.0" dy="-0.00em">Sobriété</tspan></text><text x="226.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="226.0" dy="-0.00em">Id = 1.2</tspan></text><text x="311.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="311.0" dy="-1.15em">Le système doit utiliser</tspan><tspan x="311.0" dy="1.15em">au plus 10 L d&#x27;eau par</tspan><tspan x="311.0" dy="1.15em">jour.</tspan></text><rect x="418.0" y="200.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="418.0" y1="242.0" x2="608.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="513.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="513.0" dy="-0.00em">«requirement»</tspan></text><text x="513.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="513.0" dy="-0.00em">Réglage</tspan></text><text x="428.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="428.0" dy="-0.00em">Id = 1.3</tspan></text><text x="513.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="513.0" dy="-1.15em">L&#x27;heure d&#x27;arrosage doit se</tspan><tspan x="513.0" dy="1.15em">changer sans outil, en 2</tspan><tspan x="513.0" dy="1.15em">min au plus.</tspan></text><rect x="620.0" y="200.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="620.0" y1="242.0" x2="810.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="715.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="715.0" dy="-0.00em">«requirement»</tspan></text><text x="715.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="715.0" dy="-0.00em">Sécurité électrique</tspan></text><text x="630.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="630.0" dy="-0.00em">Id = 1.4</tspan></text><text x="715.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="715.0" dy="-1.15em">Le système doit être</tspan><tspan x="715.0" dy="1.15em">alimenté en très basse</tspan><tspan x="715.0" dy="1.15em">tension : 12 V.</tspan></text><rect x="14.0" y="410.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#16753a" stroke-width="2.2"/><line x1="14.0" y1="452.0" x2="204.0" y2="452.0" stroke="#16753a" stroke-width="1.6"/><text x="109.0" y="423.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="109.0" dy="-0.00em">«testCase»</tspan></text><text x="109.0" y="440.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="109.0" dy="-0.00em">Essai à l&#x27;arroseur</tspan></text><text x="24.0" y="466.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="24.0" dy="-0.00em">Id = T3</tspan></text><text x="109.0" y="496.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="109.0" dy="-1.15em">Arroser le boîtier fermé</tspan><tspan x="109.0" dy="1.15em">10 min de tous côtés :</tspan><tspan x="109.0" dy="1.15em">aucune goutte dedans.</tspan></text><rect x="216.0" y="410.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#16753a" stroke-width="2.2"/><line x1="216.0" y1="452.0" x2="406.0" y2="452.0" stroke="#16753a" stroke-width="1.6"/><text x="311.0" y="423.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="311.0" dy="-0.00em">«testCase»</tspan></text><text x="311.0" y="440.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="311.0" dy="-0.00em">Relevé du compteur</tspan></text><text x="226.0" y="466.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="226.0" dy="-0.00em">Id = T1</tspan></text><text x="311.0" y="496.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="311.0" dy="-0.57em">Relever le compteur d&#x27;eau</tspan><tspan x="311.0" dy="1.15em">sur 24 h : 10 L au plus.</tspan></text><rect x="418.0" y="410.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#16753a" stroke-width="2.2"/><line x1="418.0" y1="452.0" x2="608.0" y2="452.0" stroke="#16753a" stroke-width="1.6"/><text x="513.0" y="423.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="513.0" dy="-0.00em">«testCase»</tspan></text><text x="513.0" y="440.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="513.0" dy="-0.00em">Réglage chronométré</tspan></text><text x="428.0" y="466.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="428.0" dy="-0.00em">Id = T4</tspan></text><text x="513.0" y="496.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="513.0" dy="-1.15em">Chronométrer le réglage,</tspan><tspan x="513.0" dy="1.15em">noter les outils : aucun</tspan><tspan x="513.0" dy="1.15em">outil, 2 min au plus.</tspan></text><rect x="620.0" y="410.0" width="190" height="118" rx="4" fill="#ffffff" stroke="#16753a" stroke-width="2.2"/><line x1="620.0" y1="452.0" x2="810.0" y2="452.0" stroke="#16753a" stroke-width="1.6"/><text x="715.0" y="423.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="715.0" dy="-0.00em">«testCase»</tspan></text><text x="715.0" y="440.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="715.0" dy="-0.00em">Mesure au multimètre</tspan></text><text x="630.0" y="466.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="630.0" dy="-0.00em">Id = T2</tspan></text><text x="715.0" y="496.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="715.0" dy="-1.15em">Mesurer la tension</tspan><tspan x="715.0" dy="1.15em">d&#x27;alimentation au</tspan><tspan x="715.0" dy="1.15em">multimètre : 12 V.</tspan></text><text data-legende-unites="ligne" x="410" y="565" text-anchor="middle" font-size="12.5" fill="#5b6b86" font-family="'Segoe UI',system-ui,Arial,sans-serif">Unités : V (volts)</text></svg>
