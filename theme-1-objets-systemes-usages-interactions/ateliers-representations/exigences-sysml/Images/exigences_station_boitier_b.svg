<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 558" width="820" height="558" class="schema" id="ex-station-b" role="img" aria-labelledby="ex-station-b-t ex-station-b-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="ex-station-b-t">Ce que le boîtier B satisfait : les flèches satisfy</title><desc id="ex-station-b-d">En haut, au centre, le bloc d&#x27;exigence Id 1, Alerte cyclonique : la station doit alerter les habitants du quartier à l&#x27;approche d&#x27;un cyclone. De son petit cercle à croix partent cinq traits vers cinq blocs, de gauche à droite : Id 1.1, Étanchéité, le boîtier doit être IP65 au moins ; Id 1.2, Autonomie, la station doit tenir 72 heures au moins sur batterie ; Id 1.3, Alerte audible, l&#x27;alerte doit s&#x27;entendre à 100 mètres au moins ; Id 1.4, Réparabilité, l&#x27;indice de réparabilité doit valoir 6 sur 10 au moins ; Id 1.5, Coût, le boîtier doit coûter 300 euros au plus. En bas, au centre, un bloc orange marqué block : le boîtier B, déclaré IP54, 72 heures, 150 mètres, réparabilité 9 sur 10, 240 euros. Quatre flèches en tirets nommées satisfy montent de lui vers les exigences 1.2, 1.3, 1.4 et 1.5. Aucune flèche ne va vers 1.1, l&#x27;étanchéité.</desc><rect x="0" y="0" width="820" height="558" fill="#fbfcff"/><defs><marker id="ex-station-b-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#5b6b86"/></marker></defs><line x1="410.0" y1="145.0" x2="86.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="145.0" x2="249.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="145.0" x2="412.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="145.0" x2="575.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="145.0" x2="738.0" y2="200.0" stroke="#1b2438" stroke-width="2"/><circle cx="410.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="404.0" y1="145.0" x2="416.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="410.0" y1="139.0" x2="410.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="335.0" y1="420.0" x2="249.0" y2="318.0" stroke="#5b6b86" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ex-station-b-pt)"/><text x="319.2" y="346.1" font-size="12" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="319.2" dy="-0.00em">«satisfy»</tspan></text><line x1="385.0" y1="420.0" x2="412.0" y2="318.0" stroke="#5b6b86" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ex-station-b-pt)"/><text x="439.9" y="363.6" font-size="12" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="439.9" dy="-0.00em">«satisfy»</tspan></text><line x1="435.0" y1="420.0" x2="575.0" y2="318.0" stroke="#5b6b86" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ex-station-b-pt)"/><text x="493.5" y="338.5" font-size="12" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="493.5" dy="-0.00em">«satisfy»</tspan></text><line x1="485.0" y1="420.0" x2="738.0" y2="318.0" stroke="#5b6b86" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ex-station-b-pt)"/><text x="621.2" y="393.0" font-size="12" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="621.2" dy="-0.00em">«satisfy»</tspan></text><rect x="230.0" y="18.0" width="360" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="230.0" y1="60.0" x2="590.0" y2="60.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="410.0" y="31.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="-0.00em">«requirement»</tspan></text><text x="410.0" y="48.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Alerte cyclonique</tspan></text><text x="240.0" y="74.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="240.0" dy="-0.00em">Id = 1</tspan></text><text x="410.0" y="104.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="-0.57em">La station doit alerter les habitants du quartier</tspan><tspan x="410.0" dy="1.15em">à l&#x27;approche d&#x27;un cyclone.</tspan></text><rect x="9.0" y="200.0" width="154" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="9.0" y1="242.0" x2="163.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="86.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="86.0" dy="-0.00em">«requirement»</tspan></text><text x="86.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="86.0" dy="-0.00em">Étanchéité</tspan></text><text x="19.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="19.0" dy="-0.00em">Id = 1.1</tspan></text><text x="86.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="86.0" dy="-0.57em">Le boîtier doit être</tspan><tspan x="86.0" dy="1.15em">IP65 au moins.</tspan></text><rect x="172.0" y="200.0" width="154" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="172.0" y1="242.0" x2="326.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="249.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="249.0" dy="-0.00em">«requirement»</tspan></text><text x="249.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="249.0" dy="-0.00em">Autonomie</tspan></text><text x="182.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="182.0" dy="-0.00em">Id = 1.2</tspan></text><text x="249.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="249.0" dy="-1.15em">La station doit tenir</tspan><tspan x="249.0" dy="1.15em">72 h au moins sur</tspan><tspan x="249.0" dy="1.15em">batterie.</tspan></text><rect x="335.0" y="200.0" width="154" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="335.0" y1="242.0" x2="489.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="412.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="412.0" dy="-0.00em">«requirement»</tspan></text><text x="412.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="412.0" dy="-0.00em">Alerte audible</tspan></text><text x="345.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="345.0" dy="-0.00em">Id = 1.3</tspan></text><text x="412.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="412.0" dy="-1.15em">L&#x27;alerte doit</tspan><tspan x="412.0" dy="1.15em">s&#x27;entendre à 100 m au</tspan><tspan x="412.0" dy="1.15em">moins.</tspan></text><rect x="498.0" y="200.0" width="154" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="498.0" y1="242.0" x2="652.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="575.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="575.0" dy="-0.00em">«requirement»</tspan></text><text x="575.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="575.0" dy="-0.00em">Réparabilité</tspan></text><text x="508.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="508.0" dy="-0.00em">Id = 1.4</tspan></text><text x="575.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="575.0" dy="-1.15em">L&#x27;indice de</tspan><tspan x="575.0" dy="1.15em">réparabilité doit</tspan><tspan x="575.0" dy="1.15em">valoir 6/10 au moins.</tspan></text><rect x="661.0" y="200.0" width="154" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="661.0" y1="242.0" x2="815.0" y2="242.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="738.0" y="213.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="738.0" dy="-0.00em">«requirement»</tspan></text><text x="738.0" y="230.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="738.0" dy="-0.00em">Coût</tspan></text><text x="671.0" y="256.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="671.0" dy="-0.00em">Id = 1.5</tspan></text><text x="738.0" y="286.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="738.0" dy="-0.57em">Le boîtier doit</tspan><tspan x="738.0" dy="1.15em">coûter 300 € au plus.</tspan></text><rect x="285.0" y="420.0" width="250" height="118" rx="4" fill="#ffffff" stroke="#b35c00" stroke-width="2.2"/><line x1="285.0" y1="462.0" x2="535.0" y2="462.0" stroke="#b35c00" stroke-width="1.6"/><text x="410.0" y="433.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="-0.00em">«block»</tspan></text><text x="410.0" y="450.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Boîtier B</tspan></text><text x="295.0" y="476.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="295.0" dy="-0.00em">Id = B</tspan></text><text x="410.0" y="506.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="-0.57em">Déclaré : IP54, 72 h, 150 m,</tspan><tspan x="410.0" dy="1.15em">réparabilité 9/10, 240 €.</tspan></text></svg>
