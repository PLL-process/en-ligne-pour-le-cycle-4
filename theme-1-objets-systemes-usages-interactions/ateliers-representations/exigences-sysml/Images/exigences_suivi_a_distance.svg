<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" width="820" height="372" class="schema" id="ex-suivi-c" role="img" aria-labelledby="ex-suivi-c-t ex-suivi-c-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="ex-suivi-c-t">Diagramme des exigences du suivi à distance, corrigé</title><desc id="ex-suivi-c-d">En haut, deux blocs d&#x27;exigence côte à côte. À gauche, Id 1, Arrosage autonome : le système doit arroser les plantes en l&#x27;absence de la gardienne. À droite, Id 2, Suivi à distance : la gardienne doit pouvoir suivre l&#x27;arrosage sur son smartphone, où qu&#x27;elle soit. En bas, deux blocs reliés au bloc Id 2 par des traits qui partent de son petit cercle à croix : Id 2.1, Compte rendu, le compte rendu doit arriver sur le smartphone 5 minutes au plus après chaque arrosage ; Id 2.2, Alerte cuve, une alerte doit partir sur le smartphone dès qu&#x27;il reste 50 litres dans la cuve. Aucun trait ne relie ces deux blocs au bloc Id 1.</desc><rect x="0" y="0" width="820" height="372" fill="#fbfcff"/><defs><marker id="ex-suivi-c-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#5b6b86"/></marker></defs><line x1="635.0" y1="145.0" x2="245.0" y2="232.0" stroke="#1b2438" stroke-width="2"/><circle cx="635.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="629.0" y1="145.0" x2="641.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="635.0" y1="139.0" x2="635.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><line x1="635.0" y1="145.0" x2="575.0" y2="232.0" stroke="#1b2438" stroke-width="2"/><circle cx="635.0" cy="145.0" r="9" fill="#ffffff" stroke="#1b2438" stroke-width="2"/><line x1="629.0" y1="145.0" x2="641.0" y2="145.0" stroke="#1b2438" stroke-width="2"/><line x1="635.0" y1="139.0" x2="635.0" y2="151.0" stroke="#1b2438" stroke-width="2"/><rect x="20.0" y="18.0" width="330" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="20.0" y1="60.0" x2="350.0" y2="60.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="185.0" y="31.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="185.0" dy="-0.00em">«requirement»</tspan></text><text x="185.0" y="48.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="185.0" dy="-0.00em">Arrosage autonome</tspan></text><text x="30.0" y="74.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" dy="-0.00em">Id = 1</tspan></text><text x="185.0" y="104.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="185.0" dy="-0.57em">Le système doit arroser les plantes du jardin</tspan><tspan x="185.0" dy="1.15em">en l&#x27;absence de la gardienne.</tspan></text><rect x="470.0" y="18.0" width="330" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="470.0" y1="60.0" x2="800.0" y2="60.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="635.0" y="31.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="635.0" dy="-0.00em">«requirement»</tspan></text><text x="635.0" y="48.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="635.0" dy="-0.00em">Suivi à distance</tspan></text><text x="480.0" y="74.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="480.0" dy="-0.00em">Id = 2</tspan></text><text x="635.0" y="104.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="635.0" dy="-0.57em">La gardienne doit pouvoir suivre l&#x27;arrosage</tspan><tspan x="635.0" dy="1.15em">sur son smartphone, où qu&#x27;elle soit.</tspan></text><rect x="110.0" y="232.0" width="270" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="110.0" y1="274.0" x2="380.0" y2="274.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="245.0" y="245.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="245.0" dy="-0.00em">«requirement»</tspan></text><text x="245.0" y="262.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="245.0" dy="-0.00em">Compte rendu</tspan></text><text x="120.0" y="288.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="120.0" dy="-0.00em">Id = 2.1</tspan></text><text x="245.0" y="318.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="245.0" dy="-1.15em">Le compte rendu doit arriver sur le</tspan><tspan x="245.0" dy="1.15em">smartphone 5 min au plus après chaque</tspan><tspan x="245.0" dy="1.15em">arrosage.</tspan></text><rect x="440.0" y="232.0" width="270" height="118" rx="4" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="440.0" y1="274.0" x2="710.0" y2="274.0" stroke="#1f5fbf" stroke-width="1.6"/><text x="575.0" y="245.0" font-size="11.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle"><tspan x="575.0" dy="-0.00em">«requirement»</tspan></text><text x="575.0" y="262.0" font-size="14" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="575.0" dy="-0.00em">Alerte cuve</tspan></text><text x="450.0" y="288.0" font-size="12.5" fill="#5b6b86" text-anchor="start" dominant-baseline="middle"><tspan x="450.0" dy="-0.00em">Id = 2.2</tspan></text><text x="575.0" y="318.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="575.0" dy="-1.15em">Une alerte doit partir sur le</tspan><tspan x="575.0" dy="1.15em">smartphone dès qu&#x27;il reste 50 L dans</tspan><tspan x="575.0" dy="1.15em">la cuve.</tspan></text></svg>
