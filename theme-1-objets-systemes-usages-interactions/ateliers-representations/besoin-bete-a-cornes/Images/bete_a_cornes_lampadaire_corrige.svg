<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 150 960 570" width="960" height="570" class="schema" id="bc-lampe-c" role="img" aria-labelledby="bc-lampe-c-t bc-lampe-c-d" font-family="Calibri, Carlito, &#x27;Segoe UI&#x27;, Arial, sans-serif"><title id="bc-lampe-c-t">La bête à cornes du lampadaire intelligent, corrigée</title><desc id="bc-lampe-c-d">À qui le produit rend-il service : les piétons. Sur quoi agit-il : la rue du parking. Au centre, le lampadaire intelligent. Dans quel but : éclairer la rue du parking la nuit, pour que les piétons y marchent en sécurité.</desc><rect x="50" y="150" width="960" height="570" fill="#fff"/><defs><marker id="bc-lampe-c-pb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2e75b6"/></marker></defs><text x="318" y="191" text-anchor="middle" font-size="38" font-style="italic" fill="#2b2b2b">À qui le produit rend-il service ?</text><text x="845" y="191" text-anchor="middle" font-size="38" font-style="italic" fill="#2b2b2b">Sur quoi agit-il ?</text><ellipse cx="350" cy="284.5" rx="134" ry="59.5" fill="#fff" stroke="#1f3864" stroke-width="3"/><text x="350" y="284.5" font-size="30" fill="#2b2b2b" text-anchor="middle" dominant-baseline="middle"><tspan x="350" dy="-0.00em">les piétons</tspan></text><ellipse cx="825.5" cy="284.5" rx="133.5" ry="59.5" fill="#fff" stroke="#1f3864" stroke-width="3"/><text x="825.5" y="284.5" font-size="30" fill="#2b2b2b" text-anchor="middle" dominant-baseline="middle"><tspan x="825.5" dy="-0.60em">la rue du</tspan><tspan x="825.5" dy="1.20em">parking</tspan></text><ellipse cx="583" cy="476" rx="122" ry="73" fill="#fff" stroke="#1f3864" stroke-width="3"/><text x="583" y="476" font-size="28.5" fill="#2b2b2b" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="583" dy="-0.60em">Le lampadaire</tspan><tspan x="583" dy="1.20em">intelligent</tspan></text><path d="M388,341 C440,398 520,424 590,421 C660,418 742,392 795,342" fill="none" stroke="#2e75b6" stroke-width="3"/><path d="M792,344 C764,366 750,388 750,414 L750,568" fill="none" stroke="#2e75b6" stroke-width="3" marker-end="url(#bc-lampe-c-pb)"/><text x="222" y="560" font-size="38" font-style="italic" fill="#2b2b2b">Dans quel but ?</text><rect x="250" y="573" width="732" height="132" fill="#fff" stroke="#1f3864" stroke-width="3"/><text x="616" y="639" font-size="30" fill="#2b2b2b" text-anchor="middle" dominant-baseline="middle"><tspan x="616" dy="-0.60em">éclairer la rue du parking la nuit, pour</tspan><tspan x="616" dy="1.20em">que les piétons y marchent en sécurité</tspan></text></svg>
