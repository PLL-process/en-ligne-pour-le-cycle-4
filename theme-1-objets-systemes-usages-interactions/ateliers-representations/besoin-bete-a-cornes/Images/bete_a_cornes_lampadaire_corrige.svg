<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 391" width="780" height="391" class="schema" id="bc-lampe-c" role="img" aria-labelledby="bc-lampe-c-t bc-lampe-c-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="bc-lampe-c-t">La bête à cornes du lampadaire intelligent, corrigée</title><desc id="bc-lampe-c-d">À qui le produit rend-il service : les piétons. Sur quoi agit-il : la rue du parking. Au centre, le lampadaire intelligent. Dans quel but : éclairer la rue du parking la nuit, pour que les piétons y marchent en sécurité.</desc><rect x="0" y="0" width="780" height="391" fill="#fbfcff"/><defs><marker id="bc-lampe-c-pb" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#1e3a6e"/></marker></defs><text x="195.0" y="26.0" font-size="15" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="195.0" dy="-0.00em">À qui le produit rend-il service ?</tspan></text><ellipse cx="195.0" cy="91.5" rx="140.0" ry="42.0" fill="#ffffff" stroke="#1e3a6e" stroke-width="2.4"/><text x="195.0" y="91.5" font-size="16" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="195.0" dy="-0.00em">les piétons</tspan></text><text x="585.0" y="26.0" font-size="15" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="585.0" dy="-0.00em">Sur quoi le produit agit-il ?</tspan></text><ellipse cx="585.0" cy="91.5" rx="140.0" ry="42.0" fill="#ffffff" stroke="#1e3a6e" stroke-width="2.4"/><text x="585.0" y="91.5" font-size="16" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="585.0" dy="-0.00em">la rue du parking</tspan></text><ellipse cx="390.0" cy="228.5" rx="104.0" ry="36.0" fill="#eef4ff" stroke="#1e3a6e" stroke-width="2.6"/><text x="390.0" y="228.5" font-size="17" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="390.0" dy="-0.57em">Le lampadaire</tspan><tspan x="390.0" dy="1.15em">intelligent</tspan></text><path d="M225.8,132.5 Q390.0,252.5 554.2,132.5" fill="none" stroke="#1e3a6e" stroke-width="3" stroke-linecap="round"/><text x="111.2" y="290.0" font-size="15" fill="#5b6b86" text-anchor="start" dominant-baseline="middle" font-style="italic"><tspan x="111.2" dy="-0.00em">Dans quel but ?</tspan></text><rect x="109.2" y="307.5" width="561.6" height="64.8" rx="10" fill="#fff8e6" stroke="#1e3a6e" stroke-width="2.4"/><text x="390.0" y="339.9" font-size="16" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="390.0" dy="-0.57em">éclairer la rue du parking la nuit, pour que les</tspan><tspan x="390.0" dy="1.15em">piétons y marchent en sécurité</tspan></text><line x1="554.2" y1="132.5" x2="554.2" y2="307.5" stroke="#1e3a6e" stroke-width="2.6" marker-end="url(#bc-lampe-c-pb)"/></svg>
