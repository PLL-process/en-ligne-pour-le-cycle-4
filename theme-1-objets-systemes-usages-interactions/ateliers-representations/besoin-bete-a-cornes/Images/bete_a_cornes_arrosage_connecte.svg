<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 150 960 570" width="960" height="570" class="schema" id="bc-arrosage-c" role="img" aria-labelledby="bc-arrosage-c-t bc-arrosage-c-d" font-family="Calibri, Carlito, &#x27;Segoe UI&#x27;, Arial, sans-serif"><title id="bc-arrosage-c-t">Après : la bête à cornes du système d&#x27;arrosage connecté, corrigée</title><desc id="bc-arrosage-c-d">À qui le produit rend-il service : la gardienne du jardin. Sur quoi agit-il : les plantes du jardin. Au centre, le système d&#x27;arrosage connecté. Dans quel but : arroser les plantes du jardin, même en l&#x27;absence de la gardienne, sans gaspiller l&#x27;eau.</desc><rect x="50" y="150" width="960" height="570" fill="#fff"/><defs><marker id="bc-arrosage-c-pb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2e75b6"/></marker></defs><text x="318" y="191" text-anchor="middle" font-size="38" font-style="italic" fill="#2b2b2b">À qui le produit rend-il service ?</text><text x="845" y="191" text-anchor="middle" font-size="38" font-style="italic" fill="#2b2b2b">Sur quoi agit-il ?</text><ellipse cx="350" cy="284.5" rx="134" ry="59.5" fill="#fff" stroke="#1f3864" stroke-width="3"/><text x="350" y="284.5" font-size="30" fill="#2b2b2b" text-anchor="middle" dominant-baseline="middle"><tspan x="350" dy="-0.60em">la gardienne</tspan><tspan x="350" dy="1.20em">du jardin</tspan></text><ellipse cx="825.5" cy="284.5" rx="133.5" ry="59.5" fill="#fff" stroke="#1f3864" stroke-width="3"/><text x="825.5" y="284.5" font-size="30" fill="#2b2b2b" text-anchor="middle" dominant-baseline="middle"><tspan x="825.5" dy="-0.60em">les plantes</tspan><tspan x="825.5" dy="1.20em">du jardin</tspan></text><ellipse cx="583" cy="476" rx="122" ry="73" fill="#fff" stroke="#1f3864" stroke-width="3"/><text x="583" y="476" font-size="21.5" fill="#2b2b2b" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="583" dy="-0.60em">Le système</tspan><tspan x="583" dy="1.20em">d&#x27;arrosage connecté</tspan></text><path d="M388,341 C440,398 520,424 590,421 C660,418 742,392 795,342" fill="none" stroke="#2e75b6" stroke-width="3"/><path d="M792,344 C764,366 750,388 750,414 L750,568" fill="none" stroke="#2e75b6" stroke-width="3" marker-end="url(#bc-arrosage-c-pb)"/><text x="222" y="560" font-size="38" font-style="italic" fill="#2b2b2b">Dans quel but ?</text><rect x="250" y="573" width="732" height="132" fill="#fff" stroke="#1f3864" stroke-width="3"/><text x="616" y="639" font-size="30" fill="#2b2b2b" text-anchor="middle" dominant-baseline="middle"><tspan x="616" dy="-0.60em">arroser les plantes du jardin, même en</tspan><tspan x="616" dy="1.20em">l&#x27;absence de la gardienne, sans gaspiller l&#x27;eau</tspan></text></svg>
