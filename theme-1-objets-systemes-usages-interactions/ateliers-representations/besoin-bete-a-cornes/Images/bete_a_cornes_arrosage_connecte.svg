<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 391" width="780" height="391" class="schema" id="bc-arrosage-c" role="img" aria-labelledby="bc-arrosage-c-t bc-arrosage-c-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="bc-arrosage-c-t">Après : la bête à cornes du système d&#x27;arrosage connecté, corrigée</title><desc id="bc-arrosage-c-d">À qui le produit rend-il service : la gardienne du jardin. Sur quoi agit-il : les plantes du jardin. Au centre, le système d&#x27;arrosage connecté. Dans quel but : arroser les plantes du jardin, même en l&#x27;absence de la gardienne, sans gaspiller l&#x27;eau.</desc><rect x="0" y="0" width="780" height="391" fill="#fbfcff"/><defs><marker id="bc-arrosage-c-pb" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#1e3a6e"/></marker></defs><text x="195.0" y="26.0" font-size="15" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="195.0" dy="-0.00em">À qui le produit rend-il service ?</tspan></text><ellipse cx="195.0" cy="91.5" rx="140.0" ry="42.0" fill="#ffffff" stroke="#1e3a6e" stroke-width="2.4"/><text x="195.0" y="91.5" font-size="16" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="195.0" dy="-0.57em">la gardienne du</tspan><tspan x="195.0" dy="1.15em">jardin</tspan></text><text x="585.0" y="26.0" font-size="15" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="585.0" dy="-0.00em">Sur quoi le produit agit-il ?</tspan></text><ellipse cx="585.0" cy="91.5" rx="140.0" ry="42.0" fill="#ffffff" stroke="#1e3a6e" stroke-width="2.4"/><text x="585.0" y="91.5" font-size="16" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="585.0" dy="-0.57em">les plantes du</tspan><tspan x="585.0" dy="1.15em">jardin</tspan></text><ellipse cx="390.0" cy="228.5" rx="122.1" ry="36.0" fill="#eef4ff" stroke="#1e3a6e" stroke-width="2.6"/><text x="390.0" y="228.5" font-size="17" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="390.0" dy="-0.57em">Le système</tspan><tspan x="390.0" dy="1.15em">d&#x27;arrosage connecté</tspan></text><path d="M225.8,132.5 Q390.0,252.5 554.2,132.5" fill="none" stroke="#1e3a6e" stroke-width="3" stroke-linecap="round"/><text x="111.2" y="290.0" font-size="15" fill="#5b6b86" text-anchor="start" dominant-baseline="middle" font-style="italic"><tspan x="111.2" dy="-0.00em">Dans quel but ?</tspan></text><rect x="109.2" y="307.5" width="561.6" height="64.8" rx="10" fill="#fff8e6" stroke="#1e3a6e" stroke-width="2.4"/><text x="390.0" y="339.9" font-size="16" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="390.0" dy="-0.57em">arroser les plantes du jardin, même en l&#x27;absence de</tspan><tspan x="390.0" dy="1.15em">la gardienne, sans gaspiller l&#x27;eau</tspan></text><line x1="554.2" y1="132.5" x2="554.2" y2="307.5" stroke="#1e3a6e" stroke-width="2.6" marker-end="url(#bc-arrosage-c-pb)"/></svg>
