<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" class="schema" id="bc-velo" role="img" aria-labelledby="bc-velo-t bc-velo-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="bc-velo-t">La bête à cornes du vélo-cargo de Léa</title><desc id="bc-velo-d">En haut à gauche, sous la question « À qui le produit rend-il service ? », la case dit : Léa. En haut à droite, sous la question « Sur quoi le produit agit-il ? », la case dit : ses deux enfants et ses courses. Une grande courbe part des deux cases et passe sous le vélo-cargo, écrit au centre. Une flèche descend vers la case « Dans quel but ? » : transporter ses deux enfants et ses courses en ville.</desc><rect x="0" y="0" width="780" height="470" fill="#fbfcff"/><defs><marker id="bc-velo-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#1b2438"/></marker></defs><text x="175.0" y="34.0" font-size="13.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="175.0" dy="-0.00em">À qui le produit rend-il service ?</tspan></text><text x="605.0" y="34.0" font-size="13.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="605.0" dy="-0.00em">Sur quoi le produit agit-il ?</tspan></text><rect x="40" y="52" width="270" height="74" rx="12" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><text x="175.0" y="89.0" font-size="16" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="175.0" dy="-0.00em">Léa</tspan></text><rect x="470" y="52" width="270" height="74" rx="12" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><text x="605.0" y="89.0" font-size="16" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="605.0" dy="-0.57em">ses deux enfants et ses</tspan><tspan x="605.0" dy="1.15em">courses</tspan></text><path d="M175,126 C175,330 605,330 605,126" fill="none" stroke="#1b2438" stroke-width="5" stroke-linecap="round"/><ellipse cx="390" cy="200" rx="130" ry="40" fill="#eef4ff" stroke="#1b2438" stroke-width="3"/><text x="390.0" y="200.0" font-size="18" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="390.0" dy="-0.00em">Le vélo-cargo</tspan></text><line x1="390" y1="279" x2="390" y2="340" stroke="#1b2438" stroke-width="3" marker-end="url(#bc-velo-pt)"/><text x="390.0" y="356.0" font-size="13.5" fill="#5b6b86" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="390.0" dy="-0.00em">Dans quel but ?</tspan></text><rect x="120" y="372" width="540" height="80" rx="12" fill="#fff8e6" stroke="#a06a00" stroke-width="2.4"/><text x="390.0" y="412.0" font-size="16" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="390.0" dy="-0.00em">transporter ses deux enfants et ses courses en ville</tspan></text></svg>
