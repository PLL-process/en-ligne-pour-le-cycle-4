<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" class="schema" id="cq-support" role="img" aria-labelledby="cq-support-t cq-support-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cq-support-t">Un croquis possible : le crochet qui tient le capteur</title><desc id="cq-support-d">Croquis coté, en coupe, cotes en millimètres. Le bord du bac est une planche ; à sa droite, la terre. Un crochet en PLA, imprimé en 3D, s&#x27;enfile sur le haut de la planche : son ouverture mesure 24, pour une planche de 22. Il se prolonge par un bras au-dessus de la terre, long de 55 depuis la planche, qui se termine par un fourreau percé d&#x27;une fente de 21 sur 9. Le capteur d&#x27;humidité est glissé dans cette fente : sa tête reste dans le fourreau, ses pointes sont dans la terre. Deux flèches rouges de montage : 1, on enfile le crochet sur le bord, vers le bas ; 2, puis le capteur glisse dans la fente.</desc><rect x="0" y="0" width="640" height="400" fill="#fbfcff"/><rect x="3" y="3" width="634" height="394" rx="8" fill="#fffdf7" stroke="#d9d2c0" stroke-width="1.5"/><path d="M184.5,250.0 Q213.6,250.3 227.4,250.6 Q241.2,250.9 255.1,250.9 Q268.9,250.9 282.7,251.5 Q296.5,252.2 310.3,251.7 Q324.1,251.2 337.9,251.7 Q351.8,252.2 365.6,252.7 Q379.4,253.2 391.2,253.3 Q403.0,253.4 405.0,253.0 Q407.0,252.6 420.8,252.3 Q434.6,252.1 448.4,251.7 Q462.2,251.4 476.0,250.9 Q489.9,250.4 503.7,250.0 Q517.5,249.7 531.3,249.8 Q545.1,249.9 558.9,249.4 Q572.7,248.8 586.6,248.8 Q600.4,248.8 612.2,248.7 Q624.0,248.6 627.5,248.0 L631.0,247.4" fill="none" stroke="#8a6a45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M189.8,389.9 Q215.3,364.7 217.5,362.6 L219.6,360.4" fill="none" stroke="#8a6a45" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M194.6,328.9 Q211.3,309.9 213.0,308.2 L214.8,306.5" fill="none" stroke="#8a6a45" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d