<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338.2" width="760" height="338.2" class="schema" id="cq-quatre" role="img" aria-labelledby="cq-quatre-t cq-quatre-d" font-family="'Segoe UI',system-ui,Arial,sans-serif" data-legende-unites="28.2"><title id="cq-quatre-t">La station d&#x27;alerte, montrée de quatre façons</title><desc id="cq-quatre-d">Quatre dessins numérotés de 1 à 4, côte à côte, sans leur nom. Dessin 1 : à main levée, le poteau, la sirène fixée par un collier, une flèche rouge marquée vent, une légende « sirène » et une cote « diamètre 60 ». Dessin 2 : des traits droits et des symboles reliés en boucle — une batterie de 12 volts, un interrupteur ouvert, une sirène. Dessin 3 : un boîtier en volume, aux arêtes nettes et aux faces ombrées, dans une fenêtre d&#x27;ordinateur, avec trois petits axes notés x, y et z. Dessin 4 : deux axes ; en vertical, le vent en kilomètres par heure ; en horizontal, l&#x27;heure de la nuit, de 18 heures à 6 heures ; une courbe qui monte et dépasse une ligne pointillée marquée 90. Unités : V (volts).</desc><rect x="0" y="0" width="760" height="338.2" fill="#fbfcff" data-legende-unites-fond="310"/><rect x="3" y="3" width="754" height="304" rx="8" fill="#fffdf7" stroke="#d9d2c0" stroke-width="1.5"/><path d="M190.3,12.3 Q189.3,42.2 190.2,56.3 Q191.1,70.4 190.8,84.5 Q190.6,98.6 190.4,112.7 Q190.3,126.8 189.6,140.9 Q189.0,155.0 189.7,169.1 Q190.4,183.2 190.1,197.3 Q189.8,211.4 190.4,225.5 Q191.0,239.6 190.9,253.7 Q190.9,267.8 190.3,279.9 Q189.7,292.0 190.1,294.5 L190.4,296.9" fill="none" stroke="#b9b2a0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M380.3,13.1 Q381.2,42.2 381.0,56.3 Q380.9,70.4 380.5,84.5 Q380.1,98.6 379.9,112.7 Q379.8,126.8 379.6,140.9 Q379.4,155.0 379.5,169.1 Q379.6,183.2 379.4,197.3 Q379.2,211.4 379.3,225.5 Q379.4,239.6 380.3,253.7 Q381.3,267.8 380.4,279.9 Q379.5,292.0 379.7,294.1 L380.0,296.1" fill="none" stroke="#b9b2a0" stroke-width="1.4" strok