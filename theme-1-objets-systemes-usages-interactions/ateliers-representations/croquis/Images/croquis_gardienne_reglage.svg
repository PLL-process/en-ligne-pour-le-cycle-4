<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" class="schema" id="cq-gardienne" role="img" aria-labelledby="cq-gardienne-t cq-gardienne-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cq-gardienne-t">Un croquis possible : la gardienne règle l&#x27;heure d&#x27;arrosage</title><desc id="cq-gardienne-d">Croquis à main levée, en gros plan. À gauche, le boîtier du jardin sur son piquet : un écran qui affiche 18:00 et trois boutons, moins, plus et OK. La main de la gardienne appuie sur le bouton plus ; une flèche rouge marquée « fois 24 » montre l&#x27;appui répété. À droite, la tête de la gardienne, une main en visière au-dessus des yeux, et une bulle : « Le soleil sur l&#x27;écran : je ne vois presque rien ! ». En haut à gauche, le soleil, dont les rayons se reflètent sur l&#x27;écran. Légendes : l&#x27;écran passe de 6:00 à 18:00 ; le bouton plus, une demi-heure par appui.</desc><rect x="0" y="0" width="640" height="430" fill="#fbfcff"/><rect x="3" y="3" width="634" height="424" rx="8" fill="#fffdf7" stroke="#d9d2c0" stroke-width="1.5"/><ellipse cx="55.0" cy="55.0" rx="22.0" ry="22.0" fill="#ffe27a"/><path d="M75.5,60.6 Q70.0,71.1 64.8,74.2 Q59.5,77.3 53.5,76.3 Q47.5,75.3 42.3,72.2 Q37.1,69.1 35.0,63.3 Q32.9,57.6 33.7,51.5 Q34.5,45.5 38.9,41.3 Q43.3,37.2 48.8,34.9 Q54.3,32.6 60.1,34.3 Q66.0,35.9 70.2,40.2 Q74.5,44.4 75.6,50.3 Q76.8,56.2 75.2,62.1 L73.7,67.9" fill="none" stroke="#26324a" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M42.5,36.5 Q54.1,32.9 60.1,34.2 Q66.0,35.4 70.2,39.9 Q74.4,44.3 75.7,50.2 Q77.1,56.1 74.9,61.6 Q72.6,67.2 68.3,71.2 Q63.9,75.2 57.9,75.7 Q52.0,76.3 46.4,74.1 Q40.8,72.0 37.5,67.0 Q34.2,61.9 33.7,55.9 Q33.2,49.8 36.3,44.6 Q39.4,39.3 44.7,36.6 L50.0,33.8" fill="none" stroke="#26324a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/><path d="M82.0,59.6 L97.4,63.3" fill="none" stroke="#b98a00" stroke-width="2.6" stroke-lineca