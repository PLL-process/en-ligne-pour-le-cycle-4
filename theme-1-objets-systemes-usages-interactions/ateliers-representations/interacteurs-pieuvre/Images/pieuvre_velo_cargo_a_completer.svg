<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" class="schema" id="pv-pieuvre" role="img" aria-labelledby="pv-pieuvre-t pv-pieuvre-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="pv-pieuvre-t">Diagramme des interacteurs extérieurs du vélo-cargo, à compléter</title><desc id="pv-pieuvre-d">Au centre, le vélo-cargo. Sept traits le relient à sept bulles. Quatre sont remplies : Léa, le téléphone, la pluie, l&#x27;itinéraire. Trois sont vides et annoncent seulement la famille attendue : bulle 1, un usager ; bulle 2, un autre objet ; bulle 3, un élément de l&#x27;environnement.</desc><rect x="0" y="0" width="800" height="500" fill="#fbfcff"/><defs><marker id="pv-pieuvre-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#1b2438"/></marker></defs><line x1="400.0" y1="76.0" x2="400.0" y2="256.0" stroke="#9aa8c2" stroke-width="2"/><line x1="625.2" y1="143.8" x2="400.0" y2="256.0" stroke="#9aa8c2" stroke-width="2"/><line x1="680.8" y1="296.1" x2="400.0" y2="256.0" stroke="#9aa8c2" stroke-width="2"/><line x1="525.0" y1="418.2" x2="400.0" y2="256.0" stroke="#9aa8c2" stroke-width="2"/><line x1="275.0" y1="418.2" x2="400.0" y2="256.0" stroke="#9aa8c2" stroke-width="2"/><line x1="119.2" y1="296.1" x2="400.0" y2="256.0" stroke="#9aa8c2" stroke-width="2"/><line x1="174.8" y1="143.8" x2="400.0" y2="256.0" stroke="#9aa8c2" stroke-width="2"/><ellipse cx="400.0" cy="256.0" rx="98" ry="46" fill="#ffffff" stroke="#1b2438" stroke-width="3"/><text x="400.0" y="256.0" font-size="19" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.00em">Le vélo-cargo</tspan></text><rect x="307.0" y="44.0" width="186" height="64" rx="30" fill="#ffffff" stroke="#3d4b66" stroke-width="2.4"/><text x="400.0" y="76.0" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.00em">Léa</tspan></text><rect x="532.2" y="111.8" width="186" height="64" rx="30" fill="#f4f6fb" stroke="#8a97ad" stroke-width="2.4" stroke-dasharray="7 5"/><text x="625.2" y="143.8" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700" id="pv-b1" data-car="19" data-lignes="2" data-vide="① un usager ?" data-interligne="1.15" data-prefixe="①"><tspan x="625.2" dy="-0.00em">① un usager ?</tspan></text><rect x="587.8" y="264.1" width="186" height="64" rx="30" fill="#ffffff" stroke="#3d4b66" stroke-width="2.4"/><text x="680.8" y="296.1" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="680.8" dy="-0.00em">le téléphone</tspan></text><rect x="432.0" y="386.2" width="186" height="64" rx="30" fill="#f4f6fb" stroke="#8a97ad" stroke-width="2.4" stroke-dasharray="7 5"/><text x="525.0" y="418.2" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700" id="pv-b2" data-car="19" data-lignes="2" data-vide="② un autre objet ?" data-interligne="1.15" data-prefixe="②"><tspan x="525.0" dy="-0.00em">② un autre objet ?</tspan></text><rect x="182.0" y="386.2" width="186" height="64" rx="30" fill="#ffffff" stroke="#3d4b66" stroke-width="2.4"/><text x="275.0" y="418.2" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="275.0" dy="-0.00em">la pluie</tspan></text><rect x="26.2" y="264.1" width="186" height="64" rx="30" fill="#f4f6fb" stroke="#8a97ad" stroke-width="2.4" stroke-dasharray="7 5"/><text x="119.2" y="296.1" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700" id="pv-b3" data-car="19" data-lignes="2" data-vide="③ un élément de l&#x27;environnement ?" data-interligne="1.15" data-prefixe="③"><tspan x="119.2" dy="-0.57em">③ un élément de</tspan><tspan x="119.2" dy="1.15em">l&#x27;environnement ?