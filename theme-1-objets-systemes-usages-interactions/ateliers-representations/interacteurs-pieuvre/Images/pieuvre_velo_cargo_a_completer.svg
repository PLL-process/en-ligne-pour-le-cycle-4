<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" class="schema" id="pv-pieuvre" role="img" aria-labelledby="pv-pieuvre-t pv-pieuvre-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="pv-pieuvre-t">Diagramme des interacteurs extérieurs du vélo-cargo, à compléter</title><desc id="pv-pieuvre-d">Au centre, le vélo-cargo. Sept bulles autour. Quatre sont remplies : Léa, le téléphone, la pluie, l&#x27;itinéraire. Trois sont vides et annoncent seulement la famille attendue : bulle 1, un usager ; bulle 2, un autre objet ; bulle 3, un élément de l&#x27;environnement. Deux courbes partent de Léa et passent par le vélo-cargo : FP1 arrive à la bulle 1, FP2 à la bulle 2. Cinq traits droits relient le vélo-cargo à un seul élément : FC1 à la bulle 1, FC2 à la pluie, FC3 à la bulle 3, FC4 au téléphone, FC5 à l&#x27;itinéraire.</desc><rect x="0" y="0" width="800" height="500" fill="#fbfcff"/><defs><marker id="pv-pieuvre-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#1b2438"/></marker></defs><line x1="188.6" y1="116.1" x2="411.6" y2="232.7" stroke="#b3261e" stroke-width="3.2"/><line x1="119.2" y1="296.1" x2="400.0" y2="256.0" stroke="#b3261e" stroke-width="3.2"/><line x1="275.0" y1="418.2" x2="400.0" y2="256.0" stroke="#b3261e" stroke-width="3.2"/><line x1="680.8" y1="296.1" x2="400.0" y2="256.0" stroke="#b3261e" stroke-width="3.2"/><line x1="525.0" y1="418.2" x2="400.0" y2="256.0" stroke="#b3261e" stroke-width="3.2"/><ellipse cx="400.0" cy="256.0" rx="106" ry="52" fill="#ffffff" stroke="#1b2438" stroke-width="3"/><path d="M354.0,89.8 Q488.0,346.4 174.8,143.8" fill="none" stroke="#1f5fbf" stroke-width="3.2" stroke-linecap="round"/><path d="M446.0,89.8 Q312.0,346.4 625.2,143.8" fill="none" stroke="#1f5fbf" stroke-width="3.2" stroke-linecap="round"/><text x="400.0" y="269.0" font-size="19" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.00em">Le vélo-cargo</tspan></text><ellipse cx="400.0" cy="76.0" rx="100" ry="35" fill="#ffffff" stroke="#3d4b66" stroke-width="2.4"/><text x="400.0" y="76.0" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.00em">Léa</tspan></text><ellipse cx="625.2" cy="143.8" rx="100" ry="35" fill="#f4f6fb" stroke="#8a97ad" stroke-width="2.4" stroke-dasharray="7 5"/><text x="625.2" y="143.8" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700" id="pv-b2" data-car="19" data-lignes="2" data-vide="② un autre objet ?" data-interligne="1.15" data-prefixe="②"><tspan x="625.2" dy="-0.00em">② un autre objet ?</tspan></text><ellipse cx="680.8" cy="296.1" rx="100" ry="35" fill="#ffffff" stroke="#3d4b66" stroke-width="2.4"/><text x="680.8" y="296.1" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="680.8" dy="-0.00em">le téléphone</tspan></text><ellipse cx="525.0" cy="418.2" rx="100" ry="35" fill="#ffffff" stroke="#3d4b66" stroke-width="2.4"/><text x="525.0" y="418.2" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="525.0" dy="-0.00em">l&#x27;itinéraire</tspan></text><ellipse cx="275.0" cy="418.2" rx="100" ry="35" fill="#f4f6fb" stroke="#8a97ad" stroke-width="2.4" stroke-dasharray="7 5"/><text x="275.0" y="418.2" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700" id="pv-b3" data-car="19" data-lignes="2" data-vide="③ un élément de l&#x27;environnement ?" data-interligne="1.15" data-prefixe="③"><tspan x="275.0" dy="-0.57em">③ un élément de</tspan><tspan x="275.0" dy="1.15em">l&#x27;environnement ?</tspan></text><ellipse cx="119.2" cy="296.1" rx="100" ry="35" fill="#ffffff" stroke="#3d4b66" stroke-width="2.4"/><text x="119.2" y="296.1" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="119.2" dy="-0.00em">la pluie</tspan></text><ellipse cx="174.8" cy="143.8" rx="100" ry="35" fill="#f4f6fb" stroke="#8a97ad" stroke-width="2.4" stroke-dasharray="7 5"/><text x="174.8" y="143.8" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700" id="pv-b1" data-car="19" data-lignes="2" data-vide="① un usager ?" data-interligne="1.15" data-prefixe="①"><tspan x="174.8" dy="-0.00em">① un usager ?</tspan></text><rect x="292.1" y="170.2" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="315.1" y="182.2" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="315.1" dy="-0.00em">FC1</tspan></text><rect x="232.0" y="264.7" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="255.0" y="276.7" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="255.0" dy="-0.00em">FC2</tspan></text><rect x="308.8" y="332.5" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="331.8" y="344.5" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="331.8" dy="-0.00em">FC3</tspan></text><rect x="522.0" y="264.7" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="545.0" y="276.7" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="545.0" dy="-0.00em">FC4</tspan></text><rect x="445.2" y="332.5" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="468.2" y="344.5" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="468.2" dy="-0.00em">FC5</tspan></text><rect x="230.8" y="179.5" width="46" height="24" rx="6" fill="#ffffff" stroke="#1f5fbf"/><text x="253.8" y="191.5" font-size="13" fill="#1f5fbf