<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" class="schema" id="pv-pieuvre-c" role="img" aria-labelledby="pv-pieuvre-c-t pv-pieuvre-c-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="pv-pieuvre-c-t">Diagramme des interacteurs extérieurs du vélo-cargo, corrigé</title><desc id="pv-pieuvre-c-d">Au centre, le vélo-cargo. Sept bulles, chacune avec sa famille écrite dessous. Léa : un usager. Bulle 1, les enfants : un usager. Le téléphone : un autre objet. Bulle 2, les courses : un autre objet. La pluie : l&#x27;environnement. Bulle 3, la route en pente : l&#x27;environnement. L&#x27;itinéraire : une donnée. Les fonctions FP1 et FP2 passent par le vélo-cargo, de Léa aux enfants et aux courses ; FC1 à FC4 le relient à la pluie, à la route en pente, au téléphone et à l&#x27;itinéraire.</desc><rect x="0" y="0" width="800" height="500" fill="#fbfcff"/><defs><marker id="pv-pieuvre-c-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#1b2438"/></marker></defs><line x1="680.8" y1="296.1" x2="400.0" y2="256.0" stroke="#b3261e" stroke-width="3.2"/><line x1="275.0" y1="418.2" x2="400.0" y2="256.0" stroke="#b3261e" stroke-width="3.2"/><line x1="400.0" y1="76.0" x2="400.0" y2="256.0" stroke="#b3261e" stroke-width="3.2"/><line x1="174.8" y1="143.8" x2="400.0" y2="256.0" stroke="#b3261e" stroke-width="3.2"/><path d="M119.2,296.1 Q427.8,292.1 625.2,143.8" fill="none" stroke="#1f5fbf" stroke-width="3.2"/><path d="M119.2,296.1 Q477.9,154.9 525.0,418.2" fill="none" stroke="#1f5fbf" stroke-width="3.2"/><ellipse cx="400.0" cy="256.0" rx="98" ry="46" fill="#ffffff" stroke="#1b2438" stroke-width="3"/><text x="400.0" y="256.0" font-size="19" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="400.0" dy="-0.00em">Le vélo-cargo</tspan></text><rect x="307.0" y="37.0" width="186" height