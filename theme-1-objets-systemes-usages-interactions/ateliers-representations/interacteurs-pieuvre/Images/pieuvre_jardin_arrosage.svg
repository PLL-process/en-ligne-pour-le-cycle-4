x="114.8" cy="266.0" rx="100" ry="44" fill="#f2eaff" stroke="#7a3fc7" stroke-width="2.4"/><text x="114.8" y="256.0" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="114.8" dy="-0.57em">l&#x27;heure d&#x27;arrosage</tspan><tspan x="114.8" dy="1.15em">choisie</tspan></text><text x="114.8" y="288.0" font-size="12" fill="#7a3fc7" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="114.8" dy="-0.00em">une donnée</tspan></text><ellipse cx="262.4" cy="103.9" rx="100" ry="44" fill="#e7f0ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="262.4" y="93.9" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="262.4" dy="-0.00em">la gardienne</tspan></text><text x="262.4" y="125.9" font-size="12" fill="#1f5fbf" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="262.4" dy="-0.00em">un usager</tspan></text><rect x="468.2" y="343.2" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="491.2" y="355.2" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="491.2" dy="-0.00em">2</tspan></text><rect x="549.4" y="254.0" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="572.4" y="266.0" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="572.4" dy="-0.00em">3</tspan></text><rect x="305.8" y="343.2" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="328.8" y="355.2" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="328.8" dy="-0.00em">4</tspan></text><rect x="351.8" y="161.5" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="374.8" y="173.5" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="374.8" dy="-0.00em">5</tspan></text><rec