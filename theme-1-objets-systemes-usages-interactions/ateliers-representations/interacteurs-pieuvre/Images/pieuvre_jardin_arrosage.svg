<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" class="schema" id="pv-jardin" role="img" aria-labelledby="pv-jardin-t pv-jardin-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="pv-jardin-t">Diagramme des interacteurs extérieurs du système d&#x27;arrosage du jardin, avec six traits numérotés</title><desc id="pv-jardin-d">Au centre, le système d&#x27;arrosage. Six bulles autour : la gardienne, les plantes, la cuve d&#x27;eau de pluie, la pluie et le soleil, le smartphone, l&#x27;heure d&#x27;arrosage choisie. Le trait 1 est une courbe qui part de la gardienne, passe par le système et arrive aux plantes. Les traits 2 à 6 sont droits et relient le système à un seul interacteur : 2 à la pluie et au soleil, 3 à la cuve, 4 au smartphone, 5 à la gardienne, 6 à l&#x27;heure d&#x27;arrosage choisie.</desc><rect x="0" y="0" width="820" height="520" fill="#fbfcff"/><defs><marker id="pv-jardin-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#1b2438"/></marker></defs><line x1="410.0" y1="453.2" x2="410.0" y2="266.0" stroke="#b3261e" stroke-width="3.2"/><line x1="665.7" y1="359.6" x2="410.0" y2="266.0" stroke="#b3261e" stroke-width="3.2"/><line x1="154.3" y1="359.6" x2="410.0" y2="266.0" stroke="#b3261e" stroke-width="3.2"/><line x1="175.7" y1="139.4" x2="418.9" y2="241.6" stroke="#b3261e" stroke-width="3.2"/><line x1="410.0" y1="78.8" x2="410.0" y2="266.0" stroke="#b3261e" stroke-width="3.2"/><path d="M154.3,172.4 Q410.0,359.6 665.7,172.4" fill="none" stroke="#1f5fbf" stroke-width="3.2"/><ellipse cx="410.0" cy="266.0" rx="98" ry="46" fill="#ffffff" stroke="#1b2438" stroke-width="3"/><text x="410.0" y="266.0" font-size="19" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.57em">Le système</tspan><tspan x="410.0" dy="1.15em">d&#x27;arrosage</tspan></text><rect x="317.0" y="39.8" width="186" height="78" rx="30" fill="#f2eaff" stroke="#7a3fc7" stroke-width="2.4"/><text x="410.0" y="68.8" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.57em">l&#x27;heure d&#x27;arrosage</tspan><tspan x="410.0" dy="1.15em">choisie</tspan></text><text x="410.0" y="100.8" font-size="12" fill="#7a3fc7" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="410.0" dy="-0.00em">une donnée</tspan></text><rect x="572.7" y="133.4" width="186" height="78" rx="30" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="665.7" y="162.4" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.7" dy="-0.00em">les plantes</tspan></text><text x="665.7" y="194.4" font-size="12" fill="#16753a" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="665.7" dy="-0.00em">l&#x27;environnement</tspan></text><rect x="572.7" y="320.6" width="186" height="78" rx="30" fill="#fff1df" stroke="#b35c00" stroke-width="2.4"/><text x="665.7" y="349.6" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.7" dy="-0.57em">la cuve d&#x27;eau de</tspan><tspan x="665.7" dy="1.15em">pluie</tspan></text><text x="665.7" y="381.6" font-size="12" fill="#b35c00" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="665.7" dy="-0.00em">un autre objet</tspan></text><rect x="317.0" y="414.2" width="186" height="78" rx="30" fill="#e3f6e9" stroke="#16753a" stroke-width="2.4"/><text x="410.0" y="443.2" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.57em">la pluie et le</tspan><tspan x="410.0" dy="1.15em">soleil</tspan></text><text x="410.0" y="475.2" font-size="12" fill="#16753a" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="410.0" dy="-0.00em">l&#x27;environnement</tspan></text><rect x="61.3" y="320.6" width="186" height="78" rx="30" fill="#fff1df" stroke="#b35c00" stroke-width="2.4"/><text x="154.3" y="349.6" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="154.3" dy="-0.00em">le smartphone</tspan></text><text x="154.3" y="381.6" font-size="12" fill="#b35c00" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="154.3" dy="-0.00em">un autre objet</tspan></text><rect x="61.3" y="133.4" width="186" height="78" rx="30" fill="#e7f0ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="154.3" y="162.4" font-size="14.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="154.3" dy="-0.00em">la gardienne</tspan></text><text x="154.3" y="194.4" font-size="12" fill="#1f5fbf" text-anchor="middle" dominant-baseline="middle" font-style="italic"><tspan x="154.3" dy="-0.00em">un usager</tspan></text><rect x="387.0" y="357.0" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="410.0" y="369.0" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">2</tspan></text><rect x="527.6" y="305.5" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="550.6" y="317.5" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="550.6" dy="-0.00em">3</tspan></text><rect x="246.4" y="305.5" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="269.4" y="317.5" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="269.4" dy="-0.00em">4</tspan></text><rect x="293.8" y="186.7" width="46" height="24" rx="6" fill="#ffffff" stroke="#b3261e"/><text x="316.8" y="198.7" font-size="13" fill="#b3261e" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="316.8"