<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" class="schema" id="pv-jardin" role="img" aria-labelledby="pv-jardin-t pv-jardin-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="pv-jardin-t">Diagramme des interacteurs extérieurs du système d&#x27;arrosage du jardin, avec six traits numérotés</title><desc id="pv-jardin-d">Au centre, le système d&#x27;arrosage. Six bulles autour : la gardienne, les plantes, la cuve d&#x27;eau de pluie, la pluie et le soleil, le smartphone, l&#x27;heure d&#x27;arrosage choisie. Le trait 1 est une courbe qui part de la gardienne, passe par le système et arrive aux plantes. Les traits 2 à 6 sont droits et relient le système à un seul interacteur : 2 à la pluie et au soleil, 3 à la cuve, 4 au smartphone, 5 à la gardienne, 6 à l&#x27;heure d&#x27;arrosage choisie.</desc><rect x="0" y="0" width="820" height="520" fill="#fbfcff"/><defs><marker id="pv-jardin-pt" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="#1b2438"/></marker></defs><line x1="557.6" y1="428.1" x2="410.0" y2="266.0" stroke="#b3261e" stroke-width="3.2"/><line x1="705.2" y1="266.0" x2="410.0" y2="266.0" stroke="#b3261e" stroke-width="3.2"/><line x1="262.4" y1="428.1" x2="410.0" y2="266.0" stroke="#b3261e" stroke-width="3.2"/><line x1="299.6" y1="70.0" x2="429.2" y2="248.5" stroke="#b3261e" stroke-width="3.2"/><line x1="114.8" y1="266.0" x2="410.0" y2="266.0" stroke="#b3261e" stroke-width="3.2"/><ellipse cx="410.0" cy="266.0" rx="106" ry="52" fill="#ffffff" stroke="#1b2438" stroke-width="3"/><path d="M262.4,103.9 Q410.0,374.0 557.6,103.9" fill="none" stroke="#1f5fbf" stroke-width="3.2" stroke-linecap="round"/><text x="410.0" y="279.0" font-size="19" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.57em">Le système</tspan><tspan x="410.0" dy="1.15em">d&#