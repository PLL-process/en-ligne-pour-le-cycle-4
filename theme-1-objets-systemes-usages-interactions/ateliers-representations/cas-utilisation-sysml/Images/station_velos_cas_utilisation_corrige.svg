<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" class="schema" id="cu-station-c" role="img" aria-labelledby="cu-station-c-t cu-station-c-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cu-station-c-t">Diagramme de cas d&#x27;utilisation de la station de vélos, corrigé</title><desc id="cu-station-c-d">Le cadre Station de vélos en libre-service et ses quatre ellipses. À gauche, en haut, l&#x27;usager, relié à Louer un vélo, Rendre un vélo et Payer la location. À gauche, en bas, le technicien de maintenance, relié à Réparer une borne. À droite, le serveur de paiement, relié à Payer la location. Ni la pluie ni le vélo n&#x27;ont de bonhomme.</desc><rect x="0" y="0" width="820" height="500" fill="#fbfcff"/><rect x="240" y="30" width="340" height="450" rx="6" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><text x="410.0" y="52.0" font-size="15" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Station de vélos en libre-service</tspan></text><line x1="136.0" y1="182.0" x2="298.0" y2="100.0" stroke="#1b2438" stroke-width="2"/><line x1="136.0" y1="182.0" x2="298.0" y2="213.3" stroke="#1b2438" stroke-width="2"/><line x1="136.0" y1="182.0" x2="298.0" y2="326.7" stroke="#1b2438" stroke-width="2"/><line x1="684.0" y1="252.0" x2="522.0" y2="326.7" stroke="#1b2438" stroke-width="2"/><line x1="136.0" y1="322.0" x2="298.0" y2="440.0" stroke="#1b2438" stroke-width="2"/><ellipse cx="410.0" cy="100.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="410.0" y="100.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Louer un vélo</tspan></text><ellipse cx="410.0" cy="213.3" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="410.0" y="213.3" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="70