<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" class="schema" id="cu-erreurs" role="img" aria-labelledby="cu-erreurs-t cu-erreurs-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cu-erreurs-t">Le diagramme de cas d&#x27;utilisation du système d&#x27;arrosage dessiné par Noah, avec des erreurs</title><desc id="cu-erreurs-d">Un grand cadre nommé Système d&#x27;arrosage du jardin. Dedans, quatre ellipses, de haut en bas : Programmer l&#x27;heure d&#x27;arrosage, La pompe, L&#x27;arrosage, Consulter le niveau de la cuve. Un bonhomme, la gardienne, est dessiné à l&#x27;intérieur du cadre, à gauche des ellipses ; il est relié à Programmer l&#x27;heure d&#x27;arrosage, à La pompe et à Consulter le niveau de la cuve. À droite, hors du cadre, deux bonshommes : la pluie, reliée à L&#x27;arrosage, et le technicien, relié à aucune ellipse.</desc><rect x="0" y="0" width="1000" height="520" fill="#fbfcff"/><rect x="240" y="30" width="520" height="470" rx="6" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><text x="500.0" y="52.0" font-size="15" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="500.0" dy="-0.00em">Système d&#x27;arrosage du jardin</tspan></text><line x1="336.0" y1="262.0" x2="388.0" y2="100.0" stroke="#1b2438" stroke-width="2"/><line x1="336.0" y1="262.0" x2="388.0" y2="220.0" stroke="#1b2438" stroke-width="2"/><line x1="336.0" y1="262.0" x2="388.0" y2="460.0" stroke="#1b2438" stroke-width="2"/><line x1="864.0" y1="188.7" x2="612.0" y2="340.0" stroke="#1b2438" stroke-width="2"/><ellipse cx="500.0" cy="100.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="500.0" y="100.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="500.0" dy="-0.57em">Programmer l&#x27;heure</tspan><tspan x="500.0" dy="1.15em">d&#x27;arrosage</tspan></text><ellipse cx="500.0" cy="220.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="500.0" y="220.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="500.0" dy="-0.00em">La pompe</tspan></text><ellipse cx="500.0" cy="340.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="500.0" y="340.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="500.0" dy="-0.00em">L&#x27;arrosage</tspan></text><ellipse cx="500.0" cy="460.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="500.0" y="460.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="500.0" dy="-0.57em">Consulter le niveau de</tspan><tspan x="500.0" dy="1.15em">la cuve</tspan></text><circle cx="310.0" cy="236.0" r="13" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><line x1="310.0" y1="249.0" x2="310.0" y2="286.0" stroke="#1b2438" stroke-width="2.4"/><line x1="290.0" y1="262.0" x2="330.0" y2="262.0" stroke="#1b2438" stroke-width="2.4"/><line x1="310.0" y1="286.0" x2="294.0" y2="310.0" stroke="#1b2438" stroke-width="2.4"/><line x1="310.0" y1="286.0" x2="326.0" y2="310.0" stroke="#1b2438" stroke-width="2.4"/><text x="310.0" y="330.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="310.0" dy="-0.00em">la gardienne</tspan></text><circle cx="890.0" cy="162.7" r="13" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><line x1="890.0" y1="175.7" x2="890.0" y2="212.7" stroke="#1b2438" stroke-width="2.4"/><line x1="870.0" y1="188.7" x2="910.0" y2="188.7" stroke="#1b2438" stroke-width="2.4"/><line x1="890.0" y1="212.7" x2="874.0" y2="236.7" stroke="#1b2438" stroke-width="2.4"/><line x1="890.0" y1="212.7" x2="906.0" y2="236.7" stroke="#1b2438" stroke-width="2.4"/><text x="890.0" y="256.7" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="890.0" dy="-0.00em">la pluie</tspan></text><circle cx="890.0" cy="309.3" r="13" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><line x1="890.0" y1="322.3" x2="890.0" y2="359.3" stroke="#1b2438" stroke-width="2.4"/><line x1="870.0" y1="335.3" x2="910.0" y2="335.3" stroke="#1b2438" stroke-width="2.4"/><line x1="890.0" y1="359.3" x2="874.0" y2="383.3" stroke="#1b2438" stroke-width="2.4"/><line x1="890.0" y1="359.3" x2="906.0" y2="383.3" stroke="#1b2438" stroke-width="2.4"/><text x="890.0" y="403.3" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="890.0" dy="-0.00em">le technicien</tspan></text></svg>
