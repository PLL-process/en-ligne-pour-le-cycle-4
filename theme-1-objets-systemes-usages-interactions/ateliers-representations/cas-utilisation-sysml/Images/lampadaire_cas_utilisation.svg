<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" class="schema" id="cu-lampadaire" role="img" aria-labelledby="cu-lampadaire-t cu-lampadaire-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cu-lampadaire-t">Diagramme de cas d&#x27;utilisation du lampadaire solaire du parking</title><desc id="cu-lampadaire-d">Un grand cadre nommé Lampadaire solaire du parking. Dedans, quatre ellipses, de haut en bas : Voir son chemin la nuit, Régler les heures d&#x27;allumage, Suivre la charge de la batterie, Remplacer la lampe. À gauche, hors du cadre, le piéton, relié à Voir son chemin la nuit. À droite, en haut, l&#x27;agent de la mairie, relié à Régler les heures d&#x27;allumage et à Suivre la charge de la batterie. À droite, en bas, le technicien, relié à Suivre la charge de la batterie et à Remplacer la lampe.</desc><rect x="0" y="0" width="820" height="500" fill="#fbfcff"/><rect x="240" y="30" width="340" height="450" rx="6" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><text x="410.0" y="52.0" font-size="15" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Lampadaire solaire du parking</tspan></text><line x1="136.0" y1="252.0" x2="298.0" y2="100.0" stroke="#1b2438" stroke-width="2"/><line x1="684.0" y1="182.0" x2="522.0" y2="213.3" stroke="#1b2438" stroke-width="2"/><line x1="684.0" y1="182.0" x2="522.0" y2="326.7" stroke="#1b2438" stroke-width="2"/><line x1="684.0" y1="322.0" x2="522.0" y2="326.7" stroke="#1b2438" stroke-width="2"/><line x1="684.0" y1="322.0" x2="522.0" y2="440.0" stroke="#1b2438" stroke-width="2"/><ellipse cx="410.0" cy="100.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="410.0" y="100.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Voir son chemin la nuit</tspan></text><ellipse cx="410.0" cy="213.3" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="410.0" y="213.3" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.57em">Régler les heures</tspan><tspan x="410.0" dy="1.15em">d&#x27;allumage</tspan></text><ellipse cx="410.0" cy="326.7" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="410.0" y="326.7" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.57em">Suivre la charge de la</tspan><tspan x="410.0" dy="1.15em">batterie</tspan></text><ellipse cx="410.0" cy="440.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="410.0" y="440.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Remplacer la lampe</tspan></text><circle cx="110.0" cy="226.0" r="13" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><line x1="110.0" y1="239.0" x2="110.0" y2="276.0" stroke="#1b2438" stroke-width="2.4"/><line x1="90.0" y1="252.0" x2="130.0" y2="252.0" stroke="#1b2438" stroke-width="2.4"/><line x1="110.0" y1="276.0" x2="94.0" y2="300.0" stroke="#1b2438" stroke-width="2.4"/><line x1="110.0" y1="276.0" x2="126.0" y2="300.0" stroke="#1b2438" stroke-width="2.4"/><text x="110.0" y="320.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="110.0" dy="-0.00em">le piéton</tspan></text><circle cx="710.0" cy="156.0" r="13" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><line x1="710.0" y1="169.0" x2="710.0" y2="206.0" stroke="#1b2438" stroke-width="2.4"/><line x1="690.0" y1="182.0" x2="730.0" y2="182.0" stroke="#1b2438" stroke-width="2.4"/><line x1="710.0" y1="206.0" x2="694.0" y2="230.0" stroke="#1b2438" stroke-width="2.4"/><line x1="710.0" y1="206.0" x2="726.0" y2="230.0" stroke="#1b2438" stroke-width="2.4"/><text x="710.0" y="250.0" font-size="13.5"