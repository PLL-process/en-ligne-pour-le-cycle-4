<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" class="schema" id="cu-borne-c" role="img" aria-labelledby="cu-borne-c-t cu-borne-c-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cu-borne-c-t">Diagramme de cas d&#x27;utilisation de la borne, corrigé</title><desc id="cu-borne-c-d">Le cadre Borne de la station de vélos. Cinq ellipses, de haut en bas : Louer un vélo, Rendre un vélo, Payer la location, Signaler une panne, Réparer la borne. L&#x27;usager, à gauche en haut, est relié aux quatre premières. Le technicien, à gauche en bas, est relié à Signaler une panne et à Réparer la borne. Le serveur de paiement, à droite, est relié à Payer la location.</desc><rect x="0" y="0" width="820" height="520" fill="#fbfcff"/><rect x="240" y="30" width="340" height="470" rx="6" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><text x="410.0" y="52.0" font-size="15" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Borne de la station de vélos</tspan></text><line x1="136.0" y1="188.7" x2="298.0" y2="100.0" stroke="#1b2438" stroke-width="2"/><line x1="136.0" y1="188.7" x2="298.0" y2="190.0" stroke="#1b2438" stroke-width="2"/><line x1="136.0" y1="188.7" x2="298.0" y2="280.0" stroke="#1b2438" stroke-width="2"/><line x1="136.0" y1="188.7" x2="298.0" y2="370.0" stroke="#1b2438" stroke-width="2"/><line x1="136.0" y1="335.3" x2="298.0" y2="370.0" stroke="#1b2438" stroke-width="2"/><line x1="136.0" y1="335.3" x2="298.0" y2="460.0" stroke="#1b2438" stroke-width="2"/><line x1="684.0" y1="262.0" x2="522.0" y2="280.0" stroke="#1b2438" stroke-width="2"/><ellipse cx="410.0" cy="100.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="410.0" y="100.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Louer un vélo</tspan></text><ellipse cx="410.0" cy="190.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="410.0" y="190.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Rendre un vélo</tspan></text><ellipse cx="410.0" cy="280.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="410.0" y="280.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Payer la location</tspan></text><ellipse cx="410.0" cy="370.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="410.0" y="370.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Signaler une panne</tspan></text><ellipse cx="410.0" cy="460.0" rx="112" ry="29" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.4"/><text x="410.0" y="460.0" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="410.0" dy="-0.00em">Réparer la borne</tspan></text><circle cx="110.0" cy="162.7" r="13" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><line x1="110.0" y1="175.7" x2="110.0" y2="212.7" stroke="#1b2438" stroke-width="2.4"/><line x1="90.0" y1="188.7" x2="130.0" y2="188.7" stroke="#1b2438" stroke-width="2.4"/><line x1="110.0" y1="212.7" x2="94.0" y2="236.7" stroke="#1b2438" stroke-width="2.4"/><line x1="110.0" y1="212.7" x2="126.0" y2="236.7" stroke="#1b2438" stroke-width="2.4"/><text x="110.0" y="256.7" font-size="13.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="110.0" dy="-0.00em">l&#x27;usager</tspan></text><circle cx="110.0" cy="309.3" r="13" fill="#ffffff" stroke="#1b2438" stroke-width="2.4"/><line x1="110.0" y1="322.3" x2="110.0" y2="359.3" stroke="#1b2438" stroke-width="2.4"/><line x1="90.0" y1="335.3" x2="130.0" y2="335.3" stroke="#1b2438" stroke-width="2.4"/><line x1="110.0" y1="359.3