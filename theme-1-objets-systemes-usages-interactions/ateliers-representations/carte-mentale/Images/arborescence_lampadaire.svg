<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 472" width="400" height="472" class="schema etroit" id="cm-arbo-a" role="img" aria-labelledby="cm-arbo-a-t cm-arbo-a-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cm-arbo-a-t">Arborescence A : Documents, 5e, Lampadaire, puis un dossier par branche</title><desc id="cm-arbo-a-d">Arborescence A. Le dossier Documents contient le dossier 5e, qui contient le dossier Lampadaire. Dans Lampadaire, cinq dossiers : Photos (avec les fichiers lampadaire_nuit.jpg et capteur_de_pres.jpg), Mesures (avec releves_lundi.csv et releves_mardi.csv), Programmes, Comptes rendus et Croquis. Une icône de chemise désigne un dossier, une icône de page un fichier.</desc><rect x="0" y="0" width="400" height="472" fill="#fbfcff"/><circle cx="34" cy="26" r="15" fill="#1f5fbf"/><text x="34.0" y="26.0" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="34.0" dy="-0.00em">A</tspan></text><text x="60.0" y="26.0" font-size="16" fill="#1b2438" text-anchor="start" dominant-baseline="middle" font-weight="700"><tspan x="60.0" dy="-0.00em">Arborescence A</tspan></text><path d="M32.0,76.0 V96.0 H45.0" fill="none" stroke="#5b6b86" stroke-width="1.6"/><path d="M58.0,106.0 V126.0 H71.0" fill="none" stroke="#5b6b86" stroke-width="1.6"/><path d="M84.0,136.0 V156.0 H97.0" fill="none" stroke="#5b6b86" stroke-width="1.6"/><path d="M110.0,166.0 V186.0 H123.0" fill="none" stroke="#5b6b86" stroke-width="1.6"/><path d="M110.0,166.0 V216.0 H123.0" fill="none" stroke="#5b6b86" stroke-width="1.6"/><path d="M84.0,136.0 V246.0 H97.0" fill="none" stroke="#5b6b86" stroke-width="1.6"/><path d="M110.0,256.0 V276.0 H123.0" fill="none" stroke="#5b6b86" stroke-width="1.6"/><path d="M110.0,256.0 V306.0 H123.0" fill="none" stroke="#5b6b86" stroke-width="1.6"/><path d="M84.0,136.0 V336.0 H97.0" fill="none" stroke="#5b6b86" stroke-width="1.6"/><path d="M84.0,136.0 V366.0 H97.0" fill="none" stroke="#5b6b86"