<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="schema" id="cm-arrosage-c" role="img" aria-labelledby="cm-arrosage-c-t cm-arrosage-c-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cm-arrosage-c-t">Carte mentale de l&#x27;arrosage connecté du jardin, complétée</title><desc id="cm-arrosage-c-d">Carte mentale. Au centre : « L&#x27;arrosage connecté du jardin ». Quatre branches. À droite, en haut : Avantages ; en dessous : Ce qui change, avec « avant : l&#x27;arrosoir, à la main » et « maintenant : capteur et pompe ». À gauche, en haut : Inconvénients ; en dessous : Pour qui ?, avec « la gardienne, Mme Joseph », « les élèves du club jardin » et « les plantes du potager ». Avantages : « arrose même pendant les vacances », « n&#x27;arrose que si la terre est sèche », « Mme Joseph suit tout sur son téléphone ». Inconvénients : « coûte cher à l&#x27;achat », « la pompe a besoin d&#x27;électricité », « s&#x27;arrête si le réseau wifi est coupé », « les capteurs s&#x27;usent, à changer ».</desc><rect x="0" y="0" width="960" height="500" fill="#fbfcff"/><path d="M560.0,250.0 C620.0,250.0 545.0,182.0 587.0,182.0" fill="none" stroke="#1f5fbf" stroke-width="7" stroke-linecap="round"/><path d="M743.0,182.0 C765.0,182.0 755.0,109.0 777.0,109.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="90.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="109.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">arrose même pendant</tspan><tspan x="855.0" dy="1.15em">les vacances</tspan></text><path d="M743.0,182.0 C765.0,182.0 755.0,165.0 777.0,165.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="146.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="165.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">n&#x27;arrose que si la</tspan><tspan x="855.0" dy="1.15em">terre est sèche</tspan></text><path d="M743.0,182.0 C765.0,182.0 755.0,221.0 777.0,221.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="202.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="221.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">Mme Joseph suit tout</tspan><tspan x="855.0" dy="1.15em">sur son téléphone</tspan></text><rect x="587.0" y="160.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.6"/><text x="665.0" y="182.0" font-size="14.5" fill="#1f5fbf" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.0" dy="-0.00em">Avantages</tspan></text><path d="M560.0,250.0 C620.0,250.0 545.0,346.0 587.0,346.0" fill="none" stroke="#b35c00" stroke-width="7" stroke-linecap="round"/><path d="M743.0,346.0 C765.0,346.0 755.0,301.0 777.0,301.0" fill="none" stroke="#b35c00" stroke-width="2.4"/><rect x="777.0" y="282.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#b35c00" stroke-width="1.8"/><text x="855.0" y="301.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">avant : l&#x27;arrosoir, à</tspan><tspan x="855.0" dy="1.15em">la main</tspan></text><path d="M743.0,346.0 C765.0,346.0 755.0,357.0 777.0,357.0" fill="none" stroke="#b35c00" stroke-width="2.4"/><rect x="777.0" y="338.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#b35c00" stroke-width="1.8"/><text x="855.0" y="357.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">maintenant : capteur</tspan><tspan x="855.0" dy="1.15em">et pompe</tspan></text><rect x="587.0" y="324.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#b35c00" stroke-width="2.6"/><text x="665.0" y="346.0" font-size="14.5" fill="#b35c00" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.0" dy="-0.00em">Ce qui change</tspan></text><path d="M400.0,250.0 C340.0,250.0 415.0,154.0 373.0,154.0" fill="none" stroke="#16753a" stroke-width="7" stroke-linecap="round"/><path d="M217.0,154.0 C195.0,154.0 205.0,53.0 183.0,53.0" fill="none" stroke="#16753a" stroke-width="2.4"/><rect x="27.0" y="34.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#16753a" stroke-width="1.8"/><text x="105.0" y="53.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.00em">coûte cher à l&#x27;achat</tspan></text><path d="M217.0,154.0 C195.0,154.0 205.0,109.0 183.0,109.0" fill="none" stroke="#16753a" stroke-width="2.4"/><rect x="27.0" y="90.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#16753a" stroke-width="1.8"/><text x="105.0" y="109.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.57em">la pompe a besoin</tspan><tspan x="105.0" dy="1.15em">d&#x27;électricité</tspan></text><path d="M217.0,154.0 C195.0,154.0 205.0,165.0 183.0,165.0" fill="none" stroke="#16753a" stroke-width="2.4"/><rect x="27.0" y="146.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#16753a" stroke-width="1.8"/><text x="105.0" y="165.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.57em">s&#x27;arrête si le réseau</tspan><tspan x="105.0" dy="1.15em">wifi est coupé</tspan></text><path d="M217.0,154.0 C195.0,154.0 205.0,221.0 183.0,221.0" fill="none" stroke="#16753a" stroke-width="2.4"/><rect x="27.0" y="202.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#16753a" stroke-width="1.8"/><text x="105.0" y="221.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.57em">les capteurs s&#x27;usent,</tspan><tspan x="105.0" dy="1.15em">à changer</t