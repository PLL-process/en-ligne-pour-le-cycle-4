<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" class="schema" id="cm-projet-c" role="img" aria-labelledby="cm-projet-c-t cm-projet-c-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cm-projet-c-t">Carte mentale des données du projet lampadaire, complétée</title><desc id="cm-projet-c-d">Carte mentale. Au centre, une ellipse : « Notre projet : le lampadaire ». Cinq branches en partent, chacune avec un nom et une couleur. À droite : Photos, Mesures, Programmes. À gauche : Comptes rendus, Croquis. Photos : « le lampadaire allumé, la nuit » et « le capteur de lumière, vu de près ». Mesures : « luminosité de lundi, en lux » et « 820, 640, 310 et 95 lux, mardi soir ». Programmes : « allumage automatique, version 1 » et « si moins de 200 lux, allumer la LED ». Comptes rendus : « compte rendu de la séance 1 » et « ce qu&#x27;on a fait et conclu, séance 2 ». Croquis : « le mât et son support, avec cotes » et « le boîtier dessiné à main levée ».</desc><rect x="0" y="0" width="960" height="420" fill="#fbfcff"/><path d="M560.0,210.0 C620.0,210.0 545.0,94.0 587.0,94.0" fill="none" stroke="#1f5fbf" stroke-width="7" stroke-linecap="round"/><path d="M743.0,94.0 C765.0,94.0 755.0,59.0 777.0,59.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="40.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="59.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">le lampadaire allumé,</tspan><tspan x="855.0" dy="1.15em">la nuit</tspan></text><path d="M743.0,94.0 C765.0,94.0 755.0,105.0 777.0,105.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="86.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="105.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">le capteur de lumière,</tspan><tspan x="855.0" dy="1.15em">vu de près</tspan></text><rect x="587.0" y="72.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.6"/><text x="665.0" y="94.0" font-size="14.5" fill="#1f5fbf" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.0" dy="-0.00em">Photos</tspan></text><path d="M560.0,210.0 C620.0,210.0 545.0,210.0 587.0,210.0" fill="none" stroke="#b35c00" stroke-width="7" stroke-linecap="round"/><path d="M743.0,210.0 C765.0,210.0 755.0,175.0 777.0,175.0" fill="none" stroke="#b35c00" stroke-width="2.4"/><rect x="777.0" y="156.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#b35c00" stroke-width="1.8"/><text x="855.0" y="175.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">luminosité de lundi,</tspan><tspan x="855.0" dy="1.15em">en lux</tspan></text><path d="M743.0,210.0 C765.0,210.0 755.0,221.0 777.0,221.0" fill="none" stroke="#b35c00" stroke-width="2.4"/><rect x="777.0" y="202.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#b35c00" stroke-width="1.8"/><text x="855.0" y="221.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">820, 640, 310 et 95</tspan><tspan x="855.0" dy="1.15em">lux, mardi soir</tspan></text><rect x="587.0" y="188.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#b35c00" stroke-width="2.6"/><text x="665.0" y="210.0" font-size="14.5" fill="#b35c00" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.0" dy="-0.00em">Mesures</tspan></text><path d="M560.0,210.0 C620.0,210.0 545.0,326.0 587.0,326.0" fill="none" stroke="#16753a" stroke-width="7" stroke-linecap="round"/><path d="M743.0,326.0 C765.0,326.0 755.0,291.0 777.0,291.0" fill="none" stroke="#16753a" stroke-width="2.4"/><rect x="777.0" y="272.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#16753a" stroke-width="1.8"/><text x="855.0