<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" class="schema" id="cm-fautive" role="img" aria-labelledby="cm-fautive-t cm-fautive-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cm-fautive-t">Carte mentale de l&#x27;arrosage connecté, faite par un élève : à corriger</title><desc id="cm-fautive-d">Carte mentale à corriger. Au centre : « 4e B — mardi ». Quatre branches. À droite, Avantages : « moins d&#x27;eau gaspillée » et « On n&#x27;a plus besoin de venir arroser. ». En dessous, Inconvénients : « coûte cher à l&#x27;achat » et « arrose même pendant les vacances ». À gauche, en haut, Divers : « le réseau wifi », « la facture d&#x27;électricité », « le jardin créé en 2019 ». En dessous, une branche sans aucun mot, reconnaissable seulement à sa couleur : « la pompe », « le capteur d&#x27;humidité », « la cuve d&#x27;eau de pluie ».</desc><rect x="0" y="0" width="960" height="420" fill="#fbfcff"/><path d="M560.0,210.0 C620.0,210.0 545.0,152.0 587.0,152.0" fill="none" stroke="#1f5fbf" stroke-width="7" stroke-linecap="round"/><path d="M743.0,152.0 C765.0,152.0 755.0,117.0 777.0,117.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="98.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="117.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.00em">moins d&#x27;eau gaspillée</tspan></text><path d="M743.0,152.0 C765.0,152.0 755.0,163.0 777.0,163.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="144.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="163.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">On n&#x27;a plus besoin de</tspan><tspan x="855.0" dy="1.15em">venir arroser.</tspan></text><rect x="587.0" y="130.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.6"/><text x="665.0" y="152.0" font-size="14.5" fill="#1f5fbf" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.0" dy="-0.00em">Avantages</tspan></text><path d="M560.0,210.0 C620.0,210.0 545.0,268.0 587.0,268.0" fill="none" stroke="#b35c00" stroke-width="7" stroke-linecap="round"/><path d="M743.0,268.0 C765.0,268.0 755.0,233.0 777.0,233.0" fill="none" stroke="#b35c00" stroke-width="2.4"/><rect x="777.0" y="214.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#b35c00" stroke-width="1.8"/><text x="855.0" y="233.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.00em">coûte cher à l&#x27;achat</tspan></text><path d="M743.0,268.0 C765.0,268.0 755.0,279.0 777.0,279.0" fill="none" stroke="#b35c00" stroke-width="2.4"/><rect x="777.0" y="260.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#b35c00" stroke-width="1.8"/><text x="855.0" y="279.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">arrose même pendant</tspan><tspan x="855.0" dy="1.15em">les vacances</tspan></text><rect x="587.0" y="246.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#b35c00" stroke-width="2.6"/><text x="665.0" y="268.0" font-size="14.5" fill="#b35c00" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.0" dy="-0.00em">Inconvénients</tspan></text><path d="M400.0,210.0 C340.0,210.0 415.0,129.0 373.0,129.0" fill="none" stroke="#16753a" stroke-width="7" stroke-linecap="round"/><path d="M217.0,129.0 C195.0,129.0 205.0,71.0 183.0,71.0" fill="none" stroke="#16753a" stroke-width="2.4"/><rect x="27.0" y="52.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#16753a" stroke-width="1.8"/><text x="105.0" y="71.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.00em">le réseau wifi</tspan></text><path d="M217.0,129.0 C195.0,129.0 205.0,117.0 183.0,117.0" fill="none" stroke="#16753a" stroke-width="2.4"/><rect x="27.0" y="98.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#16753a" stroke-width="1.8"/><text x="105.0" y="117.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.57em">la facture</tspan><tspan x="105.0" dy="1.15em">d&#x27;électricité</tspan></text><path d="M217.0,129.0 C195.0,129.0 205.0,163.0 183.0,163.0" fill="none" stroke="#16753a" stroke-width="2.4"/><rect x="27.0" y="144.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#16753a" stroke-width="1.8"/><text x="105.0" y="163.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.00em">le jardin créé en 2019</tspan></text><rect x="217.0" y="107.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#16753a" stroke-width="2.6"/><text x="295.0" y="129.0" font-size="14.5" fill="#16753a" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="295.0" dy="-0.00em">Divers</tspan></text><path d="M400.0,210.0 C340.0,210.0 415.0,291.0 373.0,291.0" fill="none" stroke="#7a3fc7" stroke-width="7" stroke-linecap="round"/><path d="M217.0,291.0 C195.0,291.0 205.0,233.0 183.0,233.0" fill="none" stroke="#7a3fc7" stroke-width="2.4"/><rect x="27.0" y="214.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#7a3fc7" stroke-width="1.8"/><text x="105.0" y="233.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.00em">la pompe</tspan></text><path d="M217.0,291.0 C195.0,291.0 205.0,279.0 183.0,279.0" fill="none" stroke="#7a3fc7" stroke-width="2.4"/><rect x="27.0" y="260.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#7a3fc7" stroke-width="1.8"/><text x="105.0" y="279.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.00em">le capteur d&#x27;humidité</tspan></text