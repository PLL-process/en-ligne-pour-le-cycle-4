<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" class="schema" id="cm-fautive" role="img" aria-labelledby="cm-fautive-t cm-fautive-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cm-fautive-t">Carte mentale de l&#x27;arrosage connecté, faite par un élève : à corriger</title><desc id="cm-fautive-d">Carte mentale à corriger. Au centre : « 4e B — mardi ». Quatre branches. À droite, Avantages : « moins d&#x27;eau gaspillée » et « On n&#x27;a plus besoin de venir arroser. ». En dessous, Inconvénients : « coûte cher à l&#x27;achat » et « arrose même pendant les vacances ». À gauche, en haut, Divers : « le réseau wifi », « la facture d&#x27;électricité », « le jardin créé en 2019 ». En dessous, une branche sans aucun mot, reconnaissable seulement à sa couleur : « la pompe », « le capteur d&#x27;humidité », « la cuve d&#x27;eau de pluie ».</desc><rect x="0" y="0" width="960" height="444" fill="#fbfcff"/><path d="M560.0,222.0 C620.0,222.0 545.0,154.0 587.0,154.0" fill="none" stroke="#1f5fbf" stroke-width="7" stroke-linecap="round"/><path d="M743.0,154.0 C765.0,154.0 755.0,109.0 777.0,109.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="90.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="109.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.00em">moins d&#x27;eau gaspillée</tspan></text><path d="M743.0,154.0 C765.0,154.0 755.0,165.0 777.0,165.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="146.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="165.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">On n&#x27;a plus besoin de</tspan><tspan x="855.0" dy="1.15em">venir arroser.</tspan></text><rect x="587.0" y="132.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.6"/><text x="665.0" y="154.0" font-size="14.5" fill="#1f5fbf" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.0" dy="-0.00em">Avantages</tspan></text><path d="M560.0,222.0 C620.0,222.0 545.0,290.0 587.0,290.0" fill="none" stroke="#b35c00" stroke-width="7" stroke-linecap="round"/><path d="M743.0,290.0 C765.0,290.0 755.0,245.0 777.0,245.0" fill="none" stroke="#b35c00" stroke-width="2.4"/><rect x="777.0" y="226.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#b35c00" stroke-width="1.8"/><text x="855.0" y="245.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.00em">coûte cher à l&#x27;achat</tspan></text><path d="M743.0,290.0 C765.0,290.0 755.0,301.0 777.0,301.0" fill="none" stroke="#b35c00" stroke-width="2.4"/><rect x="777.0" y="282.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#b35c00" stroke-width="1.8"/><text x="855.0" y="301.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">arrose même pendant</tspan><tspan x="855.0" dy="1.15em">les vacances</tspan></text><rect x="587.0" y="268.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#b35c00" stroke-width="2.6"/><text x="665.0" y="290.0" font-size="14.5" fill="#b35c00" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.0" dy="-0.00em">Inconvénients</tspan></text><path d="M400.0,222.0 C340.0,222.0 415.0,126.0 373.0,126.0" fill="none" stroke="#16753a" stroke-width="7" stroke-linecap="round"/><path d="M217.0,126.0 C195.0,126.0 205.0,53.0 183.0,53.0" fill="none" stroke="#16753a" stroke-width="2.4"/><rect x="27.0" y="34.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#16753a" stroke-width="1.8"/><text x="105.0" y="53.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.00em">le réseau wifi</tspan></text><path d="M217.0,126.0 C195.0,126.0 205.0,109.0 183.0,109.0" fill="none" stroke="#16753a" stroke-width="2.4"/><rect x="27.0" y="90.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#16753a" stroke-width="1.8"/><text x="105.0" y="109.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.57em">la facture</tspan><tspan x="105.0" dy="1.15em">d&#x27;électricité</tspan></text><path d="M217.0,126.0 C195.0,126.0 205.0,165.0 183.0,165.0" fill="none" stroke="#16753a" stroke-width="2.4"/><rect x="27.0" y="146.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#16753a" stroke-width="1.8"/><text x="105.0" y="165.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.00em">le jardin créé en 2019</tspan></text><rect x="217.0" y="104.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#16753a" stroke-width="2.6"/><text x="295.0" y="126.0" font-size="14.5" fill="#16753a" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="295.0" dy="-0.00em">Divers</tspan></text><path d="M400.0,222.0 C340.0,222.0 415.0,318.0 373.0,318.0" fill="none" stroke="#7a3fc7" stroke-width="7" stroke-linecap="round"/><path d="M217.0,318.0 C195.0,318.0 205.0,245.0 183.0,245.0" fill="none" stroke="#7a3fc7" stroke-width="2.4"/><rect x="27.0" y="226.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#7a3fc7" stroke-width="1.8"/><text x="105.0" y="245.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.00em">la pompe</tspan></text><path d="M217.0,318.0 C195.0,318.0 205.0,301.0 183.0,301.0" fill="none" stroke="#7a3fc7" stroke-width="2.4"/><rect x="27.0" y="282.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#7a3fc7" stroke-width="1.8"/><text x="105.0" y="301.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-0.00em">le capteur d&#x27;humidité</tspan></text