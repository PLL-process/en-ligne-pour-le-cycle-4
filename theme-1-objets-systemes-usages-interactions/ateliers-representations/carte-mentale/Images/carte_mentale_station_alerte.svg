<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" class="schema" id="cm-station" role="img" aria-labelledby="cm-station-t cm-station-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cm-station-t">Carte mentale : la station d&#x27;alerte cyclonique et la société</title><desc id="cm-station-d">Carte mentale. Au centre : « La station d&#x27;alerte cyclonique ». Cinq branches. À droite : Sécurité (« l&#x27;alerte arrive plus tôt », « évacuer les quartiers bas », « rentrer les bateaux à temps ») ; Coût pour la commune (« achat et pose », « entretien chaque année ») ; Ce qu&#x27;elle mesure (« vent, pluie, pression »). À gauche : Fausses alertes (« on n&#x27;y croit plus », « écoles fermées pour rien ») ; Sans téléphone (« personnes âgées isolées », « une sirène en plus des messages »).</desc><rect x="0" y="0" width="960" height="420" fill="#fbfcff"/><path d="M560.0,210.0 C620.0,210.0 545.0,117.0 587.0,117.0" fill="none" stroke="#1f5fbf" stroke-width="7" stroke-linecap="round"/><path d="M743.0,117.0 C765.0,117.0 755.0,59.0 777.0,59.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="40.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="59.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">l&#x27;alerte arrive plus</tspan><tspan x="855.0" dy="1.15em">tôt</tspan></text><path d="M743.0,117.0 C765.0,117.0 755.0,105.0 777.0,105.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="86.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="105.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">évacuer les quartiers</tspan><tspan x="855.0" dy="1.15em">bas</tspan></text><path d="M743.0,117.0 C765.0,117.0 755.0,151.0 777.0,151.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="132.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="151.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">rentrer les bateaux à</tspan><tspan x="855.0" dy="1.15em">temps</tspan></text><rect x="587.0" y="95.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.6"/><text x="665.0" y="117.0" font-size="14.5" fill="#1f5fbf" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.0" dy="-0.00em">Sécurité</tspan></text><path d="M560.0,210.0 C620.0,210.0 545.0,256.0 587.0,256.0" fill="none" stroke="#b35c00" stroke-width="7" stroke-linecap="round"/><path d="M743.0,256.0 C765.0,256.0 755.0,221.0 777.0,221.0" fill="none" stroke="#b35c00" stroke-width="2.4"/><rect x="777.0" y="202.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#b35c00" stroke-width="1.8"/><text x="855.0" y="221.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.00em">achat et pose</tspan></text><path d="M743.0,256.0 C765.0,256.0 755.0,267.0 777.0,267.0" fill="none" stroke="#b35c00" stroke-width="2.4"/><rect x="777.0" y="248.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#b35c00" stroke-width="1.8"/><text x="855.0" y="267.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.00em">entretien chaque année</tspan></text><rect x="587.0" y="234.0" width="156" height="44" rx="10" fill="#ffffff" stroke="#b35c00" stroke-width="2.6"/><text x="665.0" y="256.0" font-size="14.5" fill="#b35c00" text-anchor="middle" dominant-baseline="middle" font-weight="700"><tspan x="665.0" dy="-0.57em">Coût pour la</tspan><tspan x="665.0" dy="1.15em">commune</tspan></text><path d="M560.0,210.0 C620.0,210.0 545.0,349.0 587.0,349.0" fill="none" stroke="#16753a" stroke-width="7" stroke-linecap="round"/><path d="