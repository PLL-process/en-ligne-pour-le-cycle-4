<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 468" width="960" height="468" class="schema" id="cm-station" role="img" aria-labelledby="cm-station-t cm-station-d" font-family="'Segoe UI',system-ui,Arial,sans-serif"><title id="cm-station-t">Carte mentale : la station d&#x27;alerte cyclonique et la société</title><desc id="cm-station-d">Carte mentale. Au centre : « La station d&#x27;alerte cyclonique ». Cinq branches. À droite : Sécurité (« l&#x27;alerte arrive plus tôt », « évacuer les quartiers bas », « rentrer les bateaux à temps ») ; Coût pour la commune (« achat et pose », « entretien chaque année ») ; Ce qu&#x27;elle mesure (« vent, pluie, pression »). À gauche : Fausses alertes (« on n&#x27;y croit plus », « écoles fermées pour rien ») ; Sans téléphone (« personnes âgées isolées », « une sirène en plus des messages »).</desc><rect x="0" y="0" width="960" height="468" fill="#fbfcff"/><path d="M560.0,234.0 C620.0,234.0 545.0,126.0 587.0,126.0" fill="none" stroke="#1f5fbf" stroke-width="7" stroke-linecap="round"/><path d="M743.0,126.0 C765.0,126.0 755.0,53.0 777.0,53.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="34.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="53.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">l&#x27;alerte arrive plus</tspan><tspan x="855.0" dy="1.15em">tôt</tspan></text><path d="M743.0,126.0 C765.0,126.0 755.0,109.0 777.0,109.0" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><rect x="777.0" y="90.0" width="156" height="38" rx="19" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/><text x="855.0" y="109.0" font-size="12.5" fill="#1b2438" text-anchor="middle" dominant-baseline="middle"><tspan x="855.0" dy="-0.57em">évacuer les quartiers</tspan><tspan x="855.0" dy="1.15em">bas</tspan></text><path d="M743.0,126.0 C765.0,126.0 755.0,165.0 777.0,165.0" fill="none" stroke="#1f5fbf" stroke-wi