<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 415" width="350" height="415" role="img" aria-labelledby="t_releves_journee_juin d_releves_journee_juin" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_releves_journee_juin">La température du local, un jour de juin</title>
<desc id="d_releves_journee_juin">Cinq barres, une par relevé. À 8 heures : 29 degrés. À 11 heures : 33 degrés. À 14 heures : 38 degrés. À 17 heures : 41 degrés. À 20 heures : 35 degrés.</desc>
<rect width="350" height="415" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">La température du</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">local, un jour de juin</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Cinq relevés au même endroit — données simulées.</text>
<text x="14.0" y="112.1" font-size="15" fill="#e4eaf5">8 h</text>
<rect x="14" y="120.1" width="166.9" height="16" rx="5" fill="#61dafb"/>
<text x="188.9" y="133.6" font-size="15" fill="#e4eaf5" font-weight="700">29 °C</text>
<text x="14.0" y="166.1" font-size="15" fill="#e4eaf5">11 h</text>
<rect x="14" y="174.1" width="190.0" height="16" rx="5" fill="#61dafb"/>
<text x="212.0" y="187.6" font-size="15" fill="#e4eaf5" font-weight="700">33 °C</text>
<text x="14.0" y="220.1" font-size="15" fill="#e4eaf5">14 h</text>
<rect x="14" y="228.1" width="218.7" height="16" rx="5" fill="#61dafb"/>
<text x="240.7" y="241.6" font-size="15" fill="#e4eaf5" font-weight="700">38 °C</text>
<text x="14.0" y="274.1" font-size="15" fill="#e4eaf5">17 h</text>
<rect x="14" y="282.1" width="236.0" height="16" rx="5" fill="#61dafb"/>
<text x="258.0" y="295.6" font-size="15" fill="#e4eaf5" font-weight="700">41 °C</text>
<text x="14.0" y="328.1" font-size="15" fill="#e4eaf5">20 h</text>
<rect x="14" y="336.1" width="201.5" height="16" rx="5" fill="#61dafb"/>
<text x="223.5" y="349.6" font-size="15" fill="#e4eaf5" font-weight="700">35 °C</text>
<text x="14.0" y="376.3" font-size="13.5" fill="#9bbefc">Unité : °C (degrés Celsius). Moyenne des cinq</text>
<text x="14.0" y="394.5" font-size="13.5" fill="#9bbefc">relevés : environ 35 °C.</text>
</svg>
