<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 414" width="350" height="414" role="img" aria-labelledby="t_cases_vides d_cases_vides" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_cases_vides">Deux solutions dans le tableau de comparaison</title>
<desc id="d_cases_vides">Deux fiches. Climatiseur : installation 2 400 euros, baisse de température 9 degrés, durée de vie 10 ans, réparabilité 5 sur 10. Réduire le nombre de machines : installation 0 euro, baisse de température 5 degrés, durée de vie : case vide, réparabilité : case vide.</desc>
<rect width="350" height="414" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Deux solutions dans le</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">tableau de comparaison</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Un tiret : la case est vide — données simulées.</text>
<rect x="14.0" y="92.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="122.1" font-size="16" fill="#61dafb" font-weight="700">Climatiseur</text>
<text x="26.0" y="150.1" font-size="13.5" fill="#9bbefc">Installation</text>
<text x="26.0" y="169.1" font-size="16" fill="#e4eaf5" font-weight="700">2 400 €</text>
<text x="175.0" y="150.1" font-size="13.5" fill="#9bbefc">Baisse de température</text>
<text x="175.0" y="169.1" font-size="16" fill="#e4eaf5" font-weight="700">9 °C</text>
<text x="26.0" y="190.1" font-size="13.5" fill="#9bbefc">Durée de vie</text>
<text x="26.0" y="209.1" font-size="16" fill="#e4eaf5" font-weight="700">10 ans</text>
<text x="175.0" y="190.1" font-size="13.5" fill="#9bbefc">Réparabilité</text>
<text x="175.0" y="209.1" font-size="16" fill="#e4eaf5" font-weight="700">5 sur 10</text>
<rect x="14.0" y="236.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="266.1" font-size="16" fill="#61dafb" font-weight="700">Réduire le nombre de machines</text>
<text x="26.0" y="294.1" font-size="13.5" fill="#9bbefc">Installation</text>
<text x="26.0" y="313.1" font-size="16" fill="#e4eaf5" font-weight="700">0 €</text>
<text x="175.0" y="294.1" font-size="13.5" fill="#9bbefc">Baisse de température</text>
<text x="175.0" y="313.1" font-size="16" fill="#e4eaf5" font-weight="700">5 °C</text>
<text x="26.0" y="334.1" font-size="13.5" fill="#9bbefc">Durée de vie</text>
<text x="26.0" y="353.1" font-size="16" fill="#e4eaf5" font-weight="700">—</text>
<text x="175.0" y="334.1" font-size="13.5" fill="#9bbefc">Réparabilité</text>
<text x="175.0" y="353.1" font-size="16" fill="#e4eaf5" font-weight="700">—</text>
<text x="14.0" y="394.3" font-size="13.5" fill="#9bbefc">Unités : € (euros), °C (degrés Celsius).</text>
</svg>
