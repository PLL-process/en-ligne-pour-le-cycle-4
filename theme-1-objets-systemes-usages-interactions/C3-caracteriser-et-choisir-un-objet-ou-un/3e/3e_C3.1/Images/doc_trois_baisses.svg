<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 466" width="350" height="466" role="img" aria-labelledby="t_trois_baisses d_trois_baisses" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_trois_baisses">Trois solutions, mesurées une par une</title>
<desc id="d_trois_baisses">Quatre fiches. À combler : il faut gagner 9 degrés au moment le plus chaud. Ventilation naturelle, seule : baisse de 2,5 degrés. Extracteur d'air, seul : baisse de 4 degrés. Réduire le nombre de machines, seule : baisse de 5 degrés.</desc>
<rect width="350" height="466" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Trois solutions,</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">mesurées une par une</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Données simulées.</text>
<rect x="14.0" y="92.1" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="122.1" font-size="16" fill="#ffb454" font-weight="700">À combler</text>
<text x="26.0" y="149.1" font-size="15" fill="#e4eaf5">Gagner 9 °C au moment le plus chaud.</text>
<rect x="14.0" y="177.1" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="207.1" font-size="16" fill="#61dafb" font-weight="700">Ventilation naturelle, seule</text>
<text x="26.0" y="234.1" font-size="15" fill="#e4eaf5">Baisse mesurée : 2,5 °C.</text>
<rect x="14.0" y="262.1" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="292.1" font-size="16" fill="#61dafb" font-weight="700">Extracteur d'air, seul</text>
<text x="26.0" y="319.1" font-size="15" fill="#e4eaf5">Baisse mesurée : 4 °C.</text>
<rect x="14.0" y="347.1" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="377.1" font-size="16" fill="#61dafb" font-weight="700">Réduire le nombre de machines, seule</text>
<text x="26.0" y="404.1" font-size="15" fill="#e4eaf5">Baisse mesurée : 5 °C.</text>
<text x="14.0" y="446.3" font-size="13.5" fill="#9bbefc">Unité : °C (degrés Celsius).</text>
</svg>
