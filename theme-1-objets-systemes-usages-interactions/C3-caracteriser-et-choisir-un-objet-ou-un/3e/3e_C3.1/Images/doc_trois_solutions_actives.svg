<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 577" width="350" height="577" role="img" aria-labelledby="t_trois_solutions_actives d_trois_solutions_actives" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_trois_solutions_actives">Trois solutions qui consomment de l'électricité</title>
<desc id="d_trois_solutions_actives">Trois fiches. Extracteur d'air : baisse de température 4 degrés, consommation 310 kilowattheures par an, durée de vie 12 ans, réparabilité 8 sur 10. Climatiseur : baisse 9 degrés, consommation 1 850 kilowattheures par an, durée de vie 10 ans, réparabilité 5 sur 10. Refroidissement par eau : baisse 7 degrés, consommation 540 kilowattheures par an, durée de vie 15 ans, réparabilité 6 sur 10.</desc>
<rect width="350" height="577" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Trois solutions qui</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">consomment de l'électricité</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Données simulées.</text>
<rect x="14.0" y="92.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="122.1" font-size="16" fill="#61dafb" font-weight="700">Extracteur d'air</text>
<text x="26.0" y="150.1" font-size="13.5" fill="#9bbefc">Baisse de température</text>
<text x="26.0" y="169.1" font-size="16" fill="#e4eaf5" font-weight="700">4 °C</text>
<text x="175.0" y="150.1" font-size="13.5" fill="#9bbefc">Consommation</text>
<text x="175.0" y="169.1" font-size="16" fill="#e4eaf5" font-weight="700">310 kWh par an</text>
<text x="26.0" y="190.1" font-size="13.5" fill="#9bbefc">Durée de vie</text>
<text x="26.0" y="209.1" font-size="16" fill="#e4eaf5" font-weight="700">12 ans</text>
<text x="175.0" y="190.1" font-size="13.5" fill="#9bbefc">Réparabilité</text>
<text x="175.0" y="209.1" font-size="16" fill="#e4eaf5" font-weight="700">8 sur 10</text>
<rect x="14.0" y="236.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="266.1" font-size="16" fill="#61dafb" font-weight="700">Climatiseur</text>
<text x="26.0" y="294.1" font-size="13.5" fill="#9bbefc">Baisse de température</text>
<text x="26.0" y="313.1" font-size="16" fill="#e4eaf5" font-weight="700">9 °C</text>
<text x="175.0" y="294.1" font-size="13.5" fill="#9bbefc">Consommation</text>
<text x="175.0" y="313.1" font-size="16" fill="#e4eaf5" font-weight="700">1 850 kWh par an</text>
<text x="26.0" y="334.1" font-size="13.5" fill="#9bbefc">Durée de vie</text>
<text x="26.0" y="353.1" font-size="16" fill="#e4eaf5" font-weight="700">10 ans</text>
<text x="175.0" y="334.1" font-size="13.5" fill="#9bbefc">Réparabilité</text>
<text x="175.0" y="353.1" font-size="16" fill="#e4eaf5" font-weight="700">5 sur 10</text>
<rect x="14.0" y="380.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="410.1" font-size="16" fill="#61dafb" font-weight="700">Refroidissement par eau</text>
<text x="26.0" y="438.1" font-size="13.5" fill="#9bbefc">Baisse de température</text>
<text x="26.0" y="457.1" font-size="16" fill="#e4eaf5" font-weight="700">7 °C</text>
<text x="175.0" y="438.1" font-size="13.5" fill="#9bbefc">Consommation</text>
<text x="175.0" y="457.1" font-size="16" fill="#e4eaf5" font-weight="700">540 kWh par an</text>
<text x="26.0" y="478.1" font-size="13.5" fill="#9bbefc">Durée de vie</text>
<text x="26.0" y="497.1" font-size="16" fill="#e4eaf5" font-weight="700">15 ans</text>
<text x="175.0" y="478.1" font-size="13.5" fill="#9bbefc">Réparabilité</text>
<text x="175.0" y="497.1" font-size="16" fill="#e4eaf5" font-weight="700">6 sur 10</text>
<text x="14.0" y="538.3" font-size="13.5" fill="#9bbefc">Unités : °C (degrés Celsius), kWh</text>
<text x="14.0" y="556.5" font-size="13.5" fill="#9bbefc">(kilowattheures).</text>
</svg>
