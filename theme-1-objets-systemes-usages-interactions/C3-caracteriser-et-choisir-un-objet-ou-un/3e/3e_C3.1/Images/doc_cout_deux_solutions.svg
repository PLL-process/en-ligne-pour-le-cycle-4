<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 414" width="350" height="414" role="img" aria-labelledby="t_cout_deux_solutions d_cout_deux_solutions" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_cout_deux_solutions">Deux solutions pour refroidir le local des serveurs</title>
<desc id="d_cout_deux_solutions">Deux fiches. Climatiseur : installation 2 400 euros, fonctionnement 340 euros par an, durée de vie 10 ans. Refroidissement par eau : installation 3 100 euros, fonctionnement 210 euros par an, durée de vie 15 ans.</desc>
<rect width="350" height="414" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Deux solutions pour refroidir</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">le local des serveurs</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Données simulées.</text>
<rect x="14.0" y="92.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="122.1" font-size="16" fill="#61dafb" font-weight="700">Climatiseur</text>
<text x="26.0" y="150.1" font-size="13.5" fill="#9bbefc">Installation</text>
<text x="26.0" y="169.1" font-size="16" fill="#e4eaf5" font-weight="700">2 400 €</text>
<text x="175.0" y="150.1" font-size="13.5" fill="#9bbefc">Fonctionnement</text>
<text x="175.0" y="169.1" font-size="16" fill="#e4eaf5" font-weight="700">340 € par an</text>
<text x="26.0" y="190.1" font-size="13.5" fill="#9bbefc">Durée de vie</text>
<text x="26.0" y="209.1" font-size="16" fill="#e4eaf5" font-weight="700">10 ans</text>
<rect x="14.0" y="236.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="266.1" font-size="16" fill="#61dafb" font-weight="700">Refroidissement par eau</text>
<text x="26.0" y="294.1" font-size="13.5" fill="#9bbefc">Installation</text>
<text x="26.0" y="313.1" font-size="16" fill="#e4eaf5" font-weight="700">3 100 €</text>
<text x="175.0" y="294.1" font-size="13.5" fill="#9bbefc">Fonctionnement</text>
<text x="175.0" y="313.1" font-size="16" fill="#e4eaf5" font-weight="700">210 € par an</text>
<text x="26.0" y="334.1" font-size="13.5" fill="#9bbefc">Durée de vie</text>
<text x="26.0" y="353.1" font-size="16" fill="#e4eaf5" font-weight="700">15 ans</text>
<text x="14.0" y="394.3" font-size="13.5" fill="#9bbefc">Unité : € (euros).</text>
</svg>
