<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 247" width="350" height="247" role="img" aria-labelledby="t_fiche_flotte_composite d_fiche_flotte_composite" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_fiche_flotte_composite">Fiche d'une autre flotte</title>
<desc id="d_fiche_flotte_composite">Une fiche : vélo en composite carbone. Masse 9,8 kg. Confort 5 sur 5. Pannes par mois : 21 pour 100 vélos. Après un choc : non réparable.</desc>
<rect width="350" height="247" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Fiche d'une autre flotte</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Données simulées.</text>
<rect x="14.0" y="69.2" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="99.2" font-size="16" fill="#61dafb" font-weight="700">Vélo en composite carbone</text>
<text x="26.0" y="127.2" font-size="13.5" fill="#9bbefc">Masse</text>
<text x="26.0" y="146.2" font-size="16" fill="#e4eaf5" font-weight="700">9,8 kg</text>
<text x="175.0" y="127.2" font-size="13.5" fill="#9bbefc">Confort</text>
<text x="175.0" y="146.2" font-size="16" fill="#e4eaf5" font-weight="700">5 sur 5</text>
<text x="26.0" y="167.2" font-size="13.5" fill="#9bbefc">Pannes par mois</text>
<text x="26.0" y="186.2" font-size="16" fill="#e4eaf5" font-weight="700">21 pour 100 vélos</text>
<text x="175.0" y="167.2" font-size="13.5" fill="#9bbefc">Après un choc</text>
<text x="175.0" y="186.2" font-size="16" fill="#e4eaf5" font-weight="700">non réparable</text>
<text x="14.0" y="227.3" font-size="13.5" fill="#9bbefc">Unité : kg (kilogrammes).</text>
</svg>
