<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 624" width="350" height="624" role="img" aria-labelledby="t_co2_fabrication_et_par_k d_co2_fabrication_et_par_k" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_co2_fabrication_et_par_k">Deux façons de compter le CO₂ de quatre flottes</title>
<desc id="d_co2_fabrication_et_par_k">Deux séries de barres pour quatre flottes. CO₂ à la fabrication, par vélo : acier recyclé 58 kg, acier robuste 96 kg, aluminium léger 134 kg, composite 210 kg. CO₂ par kilomètre parcouru, sur toute la vie : acier recyclé 5,6 g, acier robuste 6,3 g, aluminium léger 8,3 g, composite 13,1 g.</desc>
<rect width="350" height="624" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Deux façons de compter</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">le CO₂ de quatre flottes</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">CO₂ : dioxyde de carbone — données simulées.</text>
<text x="14.0" y="118.4" font-size="15.5" fill="#61dafb" font-weight="700">À la fabrication, par vélo</text>
<text x="14.0" y="145.1" font-size="15" fill="#e4eaf5">Acier recyclé</text>
<rect x="14" y="153.1" width="65.2" height="16" rx="5" fill="#61dafb"/>
<text x="87.2" y="166.6" font-size="15" fill="#e4eaf5" font-weight="700">58 kg</text>
<text x="14.0" y="199.1" font-size="15" fill="#e4eaf5">Acier robuste</text>
<rect x="14" y="207.1" width="107.9" height="16" rx="5" fill="#61dafb"/>
<text x="129.9" y="220.6" font-size="15" fill="#e4eaf5" font-weight="700">96 kg</text>
<text x="14.0" y="253.1" font-size="15" fill="#e4eaf5">Aluminium léger</text>
<rect x="14" y="261.1" width="150.6" height="16" rx="5" fill="#61dafb"/>
<text x="172.6" y="274.6" font-size="15" fill="#e4eaf5" font-weight="700">134 kg</text>
<text x="14.0" y="307.1" font-size="15" fill="#e4eaf5">Composite</text>
<rect x="14" y="315.1" width="236.0" height="16" rx="5" fill="#61dafb"/>
<text x="258.0" y="328.6" font-size="15" fill="#e4eaf5" font-weight="700">210 kg</text>
<text x="14.0" y="367.3" font-size="15.5" fill="#61dafb" font-weight="700">Par kilomètre parcouru, sur toute la vie</text>
<text x="14.0" y="394.0" font-size="15" fill="#e4eaf5">Acier recyclé</text>
<rect x="14" y="402.0" width="100.9" height="16" rx="5" fill="#61dafb"/>
<text x="122.9" y="415.5" font-size="15" fill="#e4eaf5" font-weight="700">5,6 g</text>
<text x="14.0" y="448.0" font-size="15" fill="#e4eaf5">Acier robuste</text>
<rect x="14" y="456.0" width="113.5" height="16" rx="5" fill="#61dafb"/>
<text x="135.5" y="469.5" font-size="15" fill="#e4eaf5" font-weight="700">6,3 g</text>
<text x="14.0" y="502.0" font-size="15" fill="#e4eaf5">Aluminium léger</text>
<rect x="14" y="510.0" width="149.5" height="16" rx="5" fill="#61dafb"/>
<text x="171.5" y="523.5" font-size="15" fill="#e4eaf5" font-weight="700">8,3 g</text>
<text x="14.0" y="556.0" font-size="15" fill="#e4eaf5">Composite</text>
<rect x="14" y="564.0" width="236.0" height="16" rx="5" fill="#61dafb"/>
<text x="258.0" y="577.5" font-size="15" fill="#e4eaf5" font-weight="700">13,1 g</text>
<text x="14.0" y="604.2" font-size="13.5" fill="#9bbefc">Unités : kg (kilogrammes), g (grammes).</text>
</svg>
