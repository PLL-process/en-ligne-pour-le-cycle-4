<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="tb db"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="tb">Du besoin exprimé en mots aux caractéristiques mesurables</title>
  <desc id="db">Trois colonnes reliées par des flèches. À gauche, ce que dit le commanditaire, en
  langage ordinaire : « qu'ils durent », « qu'ils ne coûtent pas un bras », « qu'on puisse les
  réparer », « qu'on ne les retrouve pas au fond du canal ». Au centre, la caractéristique
  technique que l'on en tire : la durée de vie estimée, le coût total sur la durée de vie, la
  disponibilité des pièces détachées et le temps de réparation, la résistance au vol. À droite, ce
  qui rend la caractéristique vérifiable : une grandeur, une unité et un seuil — durée de vie en
  années avec un minimum de huit ans ; coût en euros par vélo et par an ; pièces disponibles en
  oui ou non, et temps de réparation en minutes avec un maximum de quarante ; note d'antivol sur
  cinq avec un minimum de quatre. Une phrase en bas rappelle qu'un besoin sans grandeur, sans
  unité et sans seuil ne se vérifie pas : il se discute.</desc>
  <rect width="900" height="430" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:13px}
    .ti{font-size:14.5px;font-weight:600}
    .lb{fill:#9bbefc;font-size:12px}
    .c1{fill:#2b1a3f;stroke:#c68ef2;stroke-width:2}
    .c2{fill:#0d2347;stroke:#274a8a;stroke-width:2}
    .c3{fill:#0d3320;stroke:#4fae7a;stroke-width:2}
    .fl{stroke:#61dafb;stroke-width:2;fill:none;marker-end:url(#fb2)}
  </style>
  <defs><marker id="fb2" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#61dafb"/></marker></defs>
  <text x="26" y="30" font-size="17" font-weight="600">Du besoin exprimé en mots à la caractéristique vérifiable</text>

  <text class="ti" x="30" y="66" fill="#c68ef2">Ce que dit le commanditaire</text>
  <text class="ti" x="330" y="66">La caractéristique technique</text>
  <text class="ti" x="632" y="66" fill="#81fba1">Grandeur · unité · seuil</text>

  <rect class="c1" x="26" y="80" width="270" height="58" rx="9"/>
  <text x="40" y="106">« qu'ils durent »</text>
  <rect class="c2" x="326" y="80" width="270" height="58" rx="9"/>
  <text x="340" y="106">durée de vie estimée</text>
  <rect class="c3" x="626" y="80" width="248" height="58" rx="9"/>
  <text x="640" y="106">en années · au moins 8</text>

  <rect class="c1" x="26" y="152" width="270" height="58" rx="9"/>
  <text x="40" y="178">« pas un bras »</text>
  <rect class="c2" x="326" y="152" width="270" height="58" rx="9"/>
  <text x="340" y="171">coût total ramené</text><text x="340" y="192">à la durée de vie</text>
  <rect class="c3" x="626" y="152" width="248" height="58" rx="9"/>
  <text x="640" y="178">en € par vélo et par an</text>

  <rect class="c1" x="26" y="224" width="270" height="58" rx="9"/>
  <text x="40" y="243">« qu'on puisse</text><text x="40" y="264">les réparer »</text>
  <rect class="c2" x="326" y="224" width="270" height="58" rx="9"/>
  <text x="340" y="243">pièces disponibles</text><text x="340" y="264">et temps de réparation</text>
  <rect class="c3" x="626" y="224" width="248" height="58" rx="9"/>
  <text x="640" y="243">oui/non · minutes</text><text x="640" y="264">au plus 40 min</text>

  <rect class="c1" x="26" y="296" width="270" height="58" rx="9"/>
  <text x="40" y="315">« pas au fond</text><text x="40" y="336">du canal »</text>
  <rect class="c2" x="326" y="296" width="270" height="58" rx="9"/>
  <text x="340" y="322">résistance au vol</text>
  <rect class="c3" x="626" y="296" width="248" height="58" rx="9"/>
  <text x="640" y="322">note sur 5 · au moins 4</text>

  <path class="fl" d="M296 109 H 322"/><path class="fl" d="M596 109 H 622"/>
  <path class="fl" d="M296 181 H 322"/><path class="fl" d="M596 181 H 622"/>
  <path class="fl" d="M296 253 H 322"/><path class="fl" d="M596 253 H 622"/>
  <path class="fl" d="M296 325 H 322"/><path class="fl" d="M596 325 H 622"/>

  <text class="lb" x="26" y="394">Un besoin sans grandeur, sans unité et sans seuil ne se vérifie pas&#160;: il se discute.</text>
  <text class="lb" x="26" y="414">En 5e, cette liste était fournie. En 4e, c'est vous qui l'écrivez.</text>
</svg>
