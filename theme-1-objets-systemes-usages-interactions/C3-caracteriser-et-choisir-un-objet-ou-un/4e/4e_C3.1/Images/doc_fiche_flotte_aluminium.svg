<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 270" width="350" height="270" role="img" aria-labelledby="t_fiche_flotte_aluminium d_fiche_flotte_aluminium" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_fiche_flotte_aluminium">Fiche d'une flotte de vélos en libre-service</title>
<desc id="d_fiche_flotte_aluminium">Une fiche : vélo en aluminium léger. Masse 13,1 kg. Durée de vie estimée 8 ans. Prix d'achat 520 euros. Confort 5 sur 5.</desc>
<rect width="350" height="270" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Fiche d'une flotte de</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">vélos en libre-service</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Données simulées.</text>
<rect x="14.0" y="92.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="122.1" font-size="16" fill="#61dafb" font-weight="700">Vélo en aluminium léger</text>
<text x="26.0" y="150.1" font-size="13.5" fill="#9bbefc">Masse</text>
<text x="26.0" y="169.1" font-size="16" fill="#e4eaf5" font-weight="700">13,1 kg</text>
<text x="175.0" y="150.1" font-size="13.5" fill="#9bbefc">Durée de vie estimée</text>
<text x="175.0" y="169.1" font-size="16" fill="#e4eaf5" font-weight="700">8 ans</text>
<text x="26.0" y="190.1" font-size="13.5" fill="#9bbefc">Prix d'achat</text>
<text x="26.0" y="209.1" font-size="16" fill="#e4eaf5" font-weight="700">520 €</text>
<text x="175.0" y="190.1" font-size="13.5" fill="#9bbefc">Confort</text>
<text x="175.0" y="209.1" font-size="16" fill="#e4eaf5" font-weight="700">5 sur 5</text>
<text x="14.0" y="250.3" font-size="13.5" fill="#9bbefc">Unités : kg (kilogrammes), € (euros).</text>
</svg>
