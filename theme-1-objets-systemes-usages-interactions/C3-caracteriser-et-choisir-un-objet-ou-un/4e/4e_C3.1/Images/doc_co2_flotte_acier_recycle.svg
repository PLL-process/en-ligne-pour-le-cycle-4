<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 247" width="350" height="247" role="img" aria-labelledby="t_co2_flotte_acier_recycle d_co2_flotte_acier_recycle" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_co2_flotte_acier_recycle">Le CO₂ d'une flotte, sur toute sa vie</title>
<desc id="d_co2_flotte_acier_recycle">Une fiche : vélo en acier recyclé. CO₂ à la fabrication : 58 kg. CO₂ d'entretien : 6 kg par an. Durée de vie estimée : 10 ans. Distance parcourue : 2 100 km par an.</desc>
<rect width="350" height="247" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le CO₂ d'une flotte, sur toute sa vie</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">CO₂ : dioxyde de carbone — données simulées.</text>
<rect x="14.0" y="69.2" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="99.2" font-size="16" fill="#61dafb" font-weight="700">Vélo en acier recyclé</text>
<text x="26.0" y="127.2" font-size="13.5" fill="#9bbefc">CO₂ à la fabrication</text>
<text x="26.0" y="146.2" font-size="16" fill="#e4eaf5" font-weight="700">58 kg</text>
<text x="175.0" y="127.2" font-size="13.5" fill="#9bbefc">CO₂ d'entretien</text>
<text x="175.0" y="146.2" font-size="16" fill="#e4eaf5" font-weight="700">6 kg par an</text>
<text x="26.0" y="167.2" font-size="13.5" fill="#9bbefc">Durée de vie estimée</text>
<text x="26.0" y="186.2" font-size="16" fill="#e4eaf5" font-weight="700">10 ans</text>
<text x="175.0" y="167.2" font-size="13.5" fill="#9bbefc">Distance parcourue</text>
<text x="175.0" y="186.2" font-size="16" fill="#e4eaf5" font-weight="700">2 100 km par an</text>
<text x="14.0" y="227.3" font-size="13.5" fill="#9bbefc">Unités : kg (kilogrammes), km (kilomètres).</text>
</svg>
