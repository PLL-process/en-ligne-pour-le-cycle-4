<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 572" width="350" height="572" role="img" aria-labelledby="t_mesures_trois_vehicules d_mesures_trois_vehicules" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_mesures_trois_vehicules">Trois véhicules, quatre mesures</title>
<desc id="d_mesures_trois_vehicules">Trois fiches. Vélo-cargo électrique : masse 48 kg, freinage à 15 km/h sur 3,2 m, rayon de braquage 2,1 m, bruit 54 décibels. Fourgonnette électrique : masse 1350 kg, freinage sur 5,8 m, rayon de braquage 5,4 m, bruit 62 décibels. Robot de livraison : masse 95 kg, freinage sur 1,6 m, rayon de braquage 1,2 m, bruit 49 décibels.</desc>
<rect width="350" height="572" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Trois véhicules, quatre mesures</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Même protocole pour les trois, sur</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">revêtement sec — données simulées.</text>
<rect x="14.0" y="87.4" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Vélo-cargo électrique</text>
<text x="26.0" y="145.4" font-size="13.5" fill="#9bbefc">Masse</text>
<text x="26.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">48 kg</text>
<text x="175.0" y="145.4" font-size="13.5" fill="#9bbefc">Freinage à 15 km/h</text>
<text x="175.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">3,2 m</text>
<text x="26.0" y="185.4" font-size="13.5" fill="#9bbefc">Rayon de braquage</text>
<text x="26.0" y="204.4" font-size="16" fill="#e4eaf5" font-weight="700">2,1 m</text>
<text x="175.0" y="185.4" font-size="13.5" fill="#9bbefc">Bruit</text>
<text x="175.0" y="204.4" font-size="16" fill="#e4eaf5" font-weight="700">54 dB(A)</text>
<rect x="14.0" y="231.4" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="261.4" font-size="16" fill="#61dafb" font-weight="700">Fourgonnette électrique</text>
<text x="26.0" y="289.4" font-size="13.5" fill="#9bbefc">Masse</text>
<text x="26.0" y="308.4" font-size="16" fill="#e4eaf5" font-weight="700">1350 kg</text>
<text x="175.0" y="289.4" font-size="13.5" fill="#9bbefc">Freinage à 15 km/h</text>
<text x="175.0" y="308.4" font-size="16" fill="#e4eaf5" font-weight="700">5,8 m</text>
<text x="26.0" y="329.4" font-size="13.5" fill="#9bbefc">Rayon de braquage</text>
<text x="26.0" y="348.4" font-size="16" fill="#e4eaf5" font-weight="700">5,4 m</text>
<text x="175.0" y="329.4" font-size="13.5" fill="#9bbefc">Bruit</text>
<text x="175.0" y="348.4" font-size="16" fill="#e4eaf5" font-weight="700">62 dB(A)</text>
<rect x="14.0" y="375.4" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="405.4" font-size="16" fill="#61dafb" font-weight="700">Robot de livraison</text>
<text x="26.0" y="433.4" font-size="13.5" fill="#9bbefc">Masse</text>
<text x="26.0" y="452.4" font-size="16" fill="#e4eaf5" font-weight="700">95 kg</text>
<text x="175.0" y="433.4" font-size="13.5" fill="#9bbefc">Freinage à 15 km/h</text>
<text x="175.0" y="452.4" font-size="16" fill="#e4eaf5" font-weight="700">1,6 m</text>
<text x="26.0" y="473.4" font-size="13.5" fill="#9bbefc">Rayon de braquage</text>
<text x="26.0" y="492.4" font-size="16" fill="#e4eaf5" font-weight="700">1,2 m</text>
<text x="175.0" y="473.4" font-size="13.5" fill="#9bbefc">Bruit</text>
<text x="175.0" y="492.4" font-size="16" fill="#e4eaf5" font-weight="700">49 dB(A)</text>
<text x="14.0" y="533.6" font-size="13.5" fill="#9bbefc">Unités : kg (kilogrammes), m (mètres), km/h</text>
<text x="14.0" y="551.8" font-size="13.5" fill="#9bbefc">(kilomètres par heure), dB(A) (décibels).</text>
</svg>
