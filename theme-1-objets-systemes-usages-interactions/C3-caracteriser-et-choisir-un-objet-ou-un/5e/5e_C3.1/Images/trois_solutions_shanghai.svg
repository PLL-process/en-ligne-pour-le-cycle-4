<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t1 d1"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="t1">Les trois solutions de livraison comparées : matériaux, énergie, information</title>
  <desc id="d1">Trois colonnes. Solution S1, vélo-cargo à assistance électrique : structure en aluminium
  et acier, 48 kg, batterie rechargeable, énergie électrique en entrée, traitement de l'information par
  un contrôleur d'assistance et un afficheur, charge utile 120 kg, autonomie 55 km. Solution S2,
  fourgonnette électrique compacte : acier et aluminium, 1350 kg, batterie rechargeable, énergie
  électrique, calculateur embarqué avec capteurs et navigation, charge utile 650 kg, autonomie 210 km.
  Solution S3, robot mobile de livraison : aluminium, acier et polymères, 95 kg, batterie rechargeable,
  énergie électrique, capteurs, cartographie, calculateur et supervision humaine, charge utile 80 kg,
  autonomie 38 km. Les trois utilisent la même source d'énergie ; elles se distinguent par la masse,
  la charge utile et la quantité d'information traitée.</desc>
  <rect width="900" height="470" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:13px}
    .ti{font-size:15px;font-weight:600;fill:#61dafb}
    .lb{fill:#9bbefc;font-size:12px}
    .col{fill:#0d2347;stroke:#274a8a;stroke-width:1.5;rx:12}
  </style>
  <text x="26" y="32" font-size="17" font-weight="600">Trois solutions pour le dernier kilomètre — données simulées</text>
  <text class="lb" x="26" y="52">Même source d'énergie pour les trois. Ce qui change : la masse, la charge utile, l'information traitée.</text>

  <rect class="col" x="26" y="70" width="272" height="376" rx="12"/>
  <text class="ti" x="42" y="98">S1 — Vélo-cargo électrique</text>
  <text class="lb" x="42" y="128">Structure</text><text x="42" y="146">Aluminium et acier · 48 kg</text>
  <text class="lb" x="42" y="176">Énergie</text><text x="42" y="194">Batterie → électrique</text>
  <text x="42" y="212">18 Wh par km</text>
  <text class="lb" x="42" y="242">Information</text><text x="42" y="260">Contrôleur d'assistance</text>
  <text x="42" y="278">et afficheur</text>
  <text class="lb" x="42" y="308">Charge utile</text><text x="42" y="326">120 kg</text>
  <text class="lb" x="42" y="356">Autonomie</text><text x="42" y="374">55 km</text>
  <text class="lb" x="42" y="404">Réparabilité</text><text x="42" y="422">8 sur 10</text>

  <rect class="col" x="314" y="70" width="272" height="376" rx="12"/>
  <text class="ti" x="330" y="98">S2 — Fourgonnette électrique</text>
  <text class="lb" x="330" y="128">Structure</text><text x="330" y="146">Acier et aluminium · 1350 kg</text>
  <text class="lb" x="330" y="176">Énergie</text><text x="330" y="194">Batterie → électrique</text>
  <text x="330" y="212">165 Wh par km</text>
  <text class="lb" x="330" y="242">Information</text><text x="330" y="260">Calculateur embarqué,</text>
  <text x="330" y="278">capteurs et navigation</text>
  <text class="lb" x="330" y="308">Charge utile</text><text x="330" y="326">650 kg</text>
  <text class="lb" x="330" y="356">Autonomie</text><text x="330" y="374">210 km</text>
  <text class="lb" x="330" y="404">Réparabilité</text><text x="330" y="422">7 sur 10</text>

  <rect class="col" x="602" y="70" width="272" height="376" rx="12"/>
  <text class="ti" x="618" y="98">S3 — Robot de livraison</text>
  <text class="lb" x="618" y="128">Structure</text><text x="618" y="146">Aluminium, acier, polymères</text>
  <text x="618" y="164">95 kg</text>
  <text class="lb" x="618" y="194">Énergie</text><text x="618" y="212">Batterie → électrique</text>
  <text x="618" y="230">42 Wh par km</text>
  <text class="lb" x="618" y="260">Information</text><text x="618" y="278">Capteurs, cartographie,</text>
  <text x="618" y="296">calculateur, supervision</text>
  <text class="lb" x="618" y="326">Charge utile</text><text x="618" y="344">80 kg</text>
  <text class="lb" x="618" y="374">Autonomie</text><text x="618" y="392">38 km</text>
  <text class="lb" x="618" y="422">Réparabilité</text><text x="618" y="440">5 sur 10</text>
</svg>
