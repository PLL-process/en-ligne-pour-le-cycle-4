<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="t2 d2"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="t2">Le cycle de vie d'un objet technique, et les étapes que les choix de matériaux et d'énergie influencent</title>
  <desc id="d2">Cinq étapes se suivent en boucle : extraction des matières premières, fabrication,
  distribution, utilisation, puis fin de vie — cette dernière renvoyant une flèche vers l'extraction
  quand l'objet est recyclé. Trois étapes sont encadrées en orange parce qu'elles dépendent
  directement des choix de matériaux et d'énergie : l'extraction, qui dépend de la part de matière
  recyclée ; l'utilisation, qui dépend de l'énergie consommée par kilomètre et de la masse à
  déplacer ; la fin de vie, qui dépend de la réparabilité et de la possibilité de démonter. La
  fabrication et la distribution sont en bleu : elles sont influencées, mais moins directement.</desc>
  <rect width="880" height="400" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:13px}
    .et{fill:#0d2347;stroke:#274a8a;stroke-width:2}
    .cle{fill:#2b1f0d;stroke:#ffb454;stroke-width:2.5}
    .ti{font-size:14px;font-weight:600}
    .lb{fill:#9bbefc;font-size:12px}
    .fl{stroke:#61dafb;stroke-width:2.5;fill:none;marker-end:url(#f)}
  </style>
  <defs><marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#61dafb"/></marker></defs>
  <text x="26" y="30" font-size="17" font-weight="600">Le cycle de vie — et ce que nos choix y changent</text>
  <text class="lb" x="26" y="50">Encadré orange : l'étape dépend directement du matériau ou de l'énergie choisis.</text>

  <rect class="cle" x="26" y="76" width="152" height="94" rx="12"/>
  <text class="ti" x="42" y="102" fill="#ffd08a">1. Extraction</text>
  <text class="lb" x="42" y="124">matières premières</text>
  <text x="42" y="146" font-size="12">dépend de la part</text>
  <text x="42" y="162" font-size="12">de matière recyclée</text>

  <rect class="et" x="204" y="76" width="152" height="94" rx="12"/>
  <text class="ti" x="220" y="102">2. Fabrication</text>
  <text class="lb" x="220" y="124">mise en forme</text>
  <text x="220" y="146" font-size="12">procédés liés au</text>
  <text x="220" y="162" font-size="12">matériau retenu</text>

  <rect class="et" x="382" y="76" width="152" height="94" rx="12"/>
  <text class="ti" x="398" y="102">3. Distribution</text>
  <text class="lb" x="398" y="124">transport, stockage</text>
  <text x="398" y="146" font-size="12">la masse pèse ici</text>
  <text x="398" y="162" font-size="12">aussi</text>

  <rect class="cle" x="560" y="76" width="152" height="94" rx="12"/>
  <text class="ti" x="576" y="102" fill="#ffd08a">4. Utilisation</text>
  <text class="lb" x="576" y="124">la plus longue étape</text>
  <text x="576" y="146" font-size="12">Wh par km × masse</text>
  <text x="576" y="162" font-size="12">× durée de vie</text>

  <rect class="cle" x="560" y="236" width="152" height="94" rx="12"/>
  <text class="ti" x="576" y="262" fill="#ffd08a">5. Fin de vie</text>
  <text class="lb" x="576" y="284">réparer, réemployer,</text>
  <text x="576" y="306" font-size="12">recycler — dépend de</text>
  <text x="576" y="322" font-size="12">la réparabilité</text>

  <path class="fl" d="M178 123 H 200"/>
  <path class="fl" d="M356 123 H 378"/>
  <path class="fl" d="M534 123 H 556"/>
  <path class="fl" d="M636 170 V 232"/>
  <path class="fl" d="M560 283 H 300 V 176"/>
  <text class="lb" x="312" y="303">recyclage : la matière repart au début du cycle</text>
  <text class="lb" x="26" y="360">La question de la séquence n'est pas «&#160;quel véhicule est le meilleur&#160;»,</text>
  <text class="lb" x="26" y="380">mais «&#160;le meilleur pour quel besoin, et sur quelle étape du cycle&#160;?&#160;»</text>
</svg>
