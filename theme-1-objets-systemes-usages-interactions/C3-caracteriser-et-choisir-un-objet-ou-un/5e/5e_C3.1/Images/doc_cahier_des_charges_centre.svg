<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 702" width="350" height="702" role="img" aria-labelledby="t_cahier_des_charges_centr d_cahier_des_charges_centr" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_cahier_des_charges_centr">Ce que le centre exige, et ce que chaque véhicule offre</title>
<desc id="d_cahier_des_charges_centr">Quatre fiches. Le centre exige, au moins : charge utile 80 kg, autonomie 35 km, adaptation aux ruelles 4 sur 5, adaptation à la pluie 3 sur 5. Vélo-cargo électrique, S1 : 120 kg, 55 km, ruelles 5 sur 5, pluie 3 sur 5. Fourgonnette électrique, S2 : 650 kg, 210 km, ruelles 2 sur 5, pluie 5 sur 5. Robot de livraison, S3 : 80 kg, 38 km, ruelles 5 sur 5, pluie 2 sur 5.</desc>
<rect width="350" height="702" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Ce que le centre exige, et ce</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">que chaque véhicule offre</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Données simulées.</text>
<rect x="14.0" y="92.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="122.1" font-size="16" fill="#ffb454" font-weight="700">Le centre exige, au moins</text>
<text x="26.0" y="150.1" font-size="13.5" fill="#9bbefc">Charge utile</text>
<text x="26.0" y="169.1" font-size="16" fill="#e4eaf5" font-weight="700">80 kg</text>
<text x="175.0" y="150.1" font-size="13.5" fill="#9bbefc">Autonomie</text>
<text x="175.0" y="169.1" font-size="16" fill="#e4eaf5" font-weight="700">35 km</text>
<text x="26.0" y="190.1" font-size="13.5" fill="#9bbefc">Adaptation ruelles</text>
<text x="26.0" y="209.1" font-size="16" fill="#e4eaf5" font-weight="700">4 sur 5</text>
<text x="175.0" y="190.1" font-size="13.5" fill="#9bbefc">Adaptation pluie</text>
<text x="175.0" y="209.1" font-size="16" fill="#e4eaf5" font-weight="700">3 sur 5</text>
<rect x="14.0" y="236.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="266.1" font-size="16" fill="#61dafb" font-weight="700">Vélo-cargo électrique (S1)</text>
<text x="26.0" y="294.1" font-size="13.5" fill="#9bbefc">Charge utile</text>
<text x="26.0" y="313.1" font-size="16" fill="#e4eaf5" font-weight="700">120 kg</text>
<text x="175.0" y="294.1" font-size="13.5" fill="#9bbefc">Autonomie</text>
<text x="175.0" y="313.1" font-size="16" fill="#e4eaf5" font-weight="700">55 km</text>
<text x="26.0" y="334.1" font-size="13.5" fill="#9bbefc">Adaptation ruelles</text>
<text x="26.0" y="353.1" font-size="16" fill="#e4eaf5" font-weight="700">5 sur 5</text>
<text x="175.0" y="334.1" font-size="13.5" fill="#9bbefc">Adaptation pluie</text>
<text x="175.0" y="353.1" font-size="16" fill="#e4eaf5" font-weight="700">3 sur 5</text>
<rect x="14.0" y="380.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="410.1" font-size="16" fill="#61dafb" font-weight="700">Fourgonnette électrique (S2)</text>
<text x="26.0" y="438.1" font-size="13.5" fill="#9bbefc">Charge utile</text>
<text x="26.0" y="457.1" font-size="16" fill="#e4eaf5" font-weight="700">650 kg</text>
<text x="175.0" y="438.1" font-size="13.5" fill="#9bbefc">Autonomie</text>
<text x="175.0" y="457.1" font-size="16" fill="#e4eaf5" font-weight="700">210 km</text>
<text x="26.0" y="478.1" font-size="13.5" fill="#9bbefc">Adaptation ruelles</text>
<text x="26.0" y="497.1" font-size="16" fill="#e4eaf5" font-weight="700">2 sur 5</text>
<text x="175.0" y="478.1" font-size="13.5" fill="#9bbefc">Adaptation pluie</text>
<text x="175.0" y="497.1" font-size="16" fill="#e4eaf5" font-weight="700">5 sur 5</text>
<rect x="14.0" y="524.1" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="554.1" font-size="16" fill="#61dafb" font-weight="700">Robot de livraison (S3)</text>
<text x="26.0" y="582.1" font-size="13.5" fill="#9bbefc">Charge utile</text>
<text x="26.0" y="601.1" font-size="16" fill="#e4eaf5" font-weight="700">80 kg</text>
<text x="175.0" y="582.1" font-size="13.5" fill="#9bbefc">Autonomie</text>
<text x="175.0" y="601.1" font-size="16" fill="#e4eaf5" font-weight="700">38 km</text>
<text x="26.0" y="622.1" font-size="13.5" fill="#9bbefc">Adaptation ruelles</text>
<text x="26.0" y="641.1" font-size="16" fill="#e4eaf5" font-weight="700">5 sur 5</text>
<text x="175.0" y="622.1" font-size="13.5" fill="#9bbefc">Adaptation pluie</text>
<text x="175.0" y="641.1" font-size="16" fill="#e4eaf5" font-weight="700">2 sur 5</text>
<text x="14.0" y="682.3" font-size="13.5" fill="#9bbefc">Unités : kg (kilogrammes), km (kilomètres).</text>
</svg>
