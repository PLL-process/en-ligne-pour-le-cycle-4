.vpp-batterie rect{fill:#3a3320;stroke:#ffd66b;stroke-width:3}
.vpp-batterie line{stroke:#ffd66b;stroke-width:2}
.vpp-batterie.vpp-allumee rect{fill:#ffd66b}
.vpp-batterie.vpp-allumee line{stroke:#3a3320}
.vpp-cable{fill:none;stroke:#c9d6ee;stroke-width:3}
.vpp-flux{fill:none;stroke:#61dafb;stroke-width:6;stroke-linecap:round}
.vpp-flux-pulse{fill:none;stroke:none}
.vpp-moteur{fill:#c68ef2;stroke:#e4eaf5;stroke-width:3}
.vpp-question{fill:#ffd66b;font-size:34px;font-weight:700}
.vpp-meca,.vpp-meca-pointe{stroke:#81fba1;stroke-width:6;fill:none;stroke-linecap:round}
.vpp-meca-pointe{fill:#81fba1;stroke-width:2}
.vpp-chaine rect{fill:#0d2347;stroke-width:4}
.vpp-chaine text{fill:#e4eaf5;font-size:25px;font-weight:600}
.vpp-c1 rect{stroke:#ffd66b}.vpp-c2 rect{stroke:#61dafb}.vpp-c3 rect{stroke:#c68ef2}.vpp-c4 rect{stroke:#81fba1}
.vpp-fleche{fill:none;stroke:#e4eaf5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
</style>
