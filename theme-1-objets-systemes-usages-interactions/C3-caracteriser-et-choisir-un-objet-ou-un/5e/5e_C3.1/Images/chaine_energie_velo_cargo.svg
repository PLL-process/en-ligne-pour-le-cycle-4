.vpp-route rect{fill:#34425e}
.vpp-roue circle{fill:none;stroke:#c9d6ee;stroke-width:5}
.vpp-roue .vpp-axe{fill:#c9d6ee;stroke:none}
.vpp-rayons line{stroke:#6f86ad;stroke-width:1.5}
.vpp-cadre line{stroke:#9bbefc;stroke-width:6;stroke-linecap:round}
.vpp-cadre .vpp-selle{stroke:#e4eaf5;stroke-width:7}
.vpp-pedalier{fill:#0a1b3d;stroke:#9bbefc;stroke-width:3}
.vpp-bac{fill:#122a52;stroke:#9bbefc;stroke-width:3}
.vpp-colis{fill:#8a5a2b;stroke:#d9a066;stroke-width:2}
.vpp-scotch{stroke:#d9a066;stroke-width:4}
.vpp-livreur circle{fill:#e4eaf5}
.vpp-livreur .vpp-casque{fill:#ffb454}
