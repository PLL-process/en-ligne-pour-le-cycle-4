<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
<title id="t">La chaîne d'énergie du vélo-cargo</title>
<desc id="d">Un vélo-cargo vu de côté, avec son livreur et un colis dans le bac avant. Sous le porte-bagages arrière, la batterie, allumée. Un câble, surligné, la relie au moteur placé au centre de la roue arrière. Une flèche courbe autour de la roue arrière indique qu'elle tourne. Sous le dessin, la chaîne d'énergie en quatre cases reliées par des flèches : batterie, énergie électrique, moteur, énergie mécanique.</desc>
<style>
