<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="tab dab"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="tab">Deux stations de vélos du même quartier, côte à côte</title>
  <desc id="dab">Deux stations de vélos simulées, dessinées côte à côte, vues de côté, à la même
  échelle et dans les mêmes couleurs, sans vélo. À gauche, la première station : sa borne a une
  tête inclinée, son point d'ancrage est au bout d'un bras placé à 90 cm du trottoir, et son
  boîtier porte une seule vis. Sous le dessin, trois lignes : borne inclinée ; ancrage à 90 cm ;
  boîtier à vis unique. À droite, la deuxième station : sa borne est abritée sous un auvent, un toit
  plat porté par un montant ; son point d'ancrage est un anneau posé au ras du trottoir ; son
  boîtier n'a pas de vis, et un cordon de soudure fait tout le tour de son couvercle. Sous le
  dessin, trois lignes : bornes abritées sous un auvent ; ancrage au sol ; boîtier soudé. Rien
  n'indique laquelle des deux stations est la meilleure, et rien ne dit à quoi sert chaque choix.</desc>
  <rect width="720" height="510" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:15px}
    .sous{fill:#9bbefc;font-size:13px}
    .titre{fill:#e4eaf5;font-size:16px;font-weight:600}
    .borne{fill:#122a52;stroke:#61dafb;stroke-width:2.5}
    .boite{fill:#0a1b3d;stroke:#61dafb;stroke-width:2}
    .ecran{fill:#0b3d2e;stroke:#81fba1;stroke-width:2}
    .soudure{stroke:#ffd08a;stroke-width:2;fill:none;stroke-dasharray:3 2}
    .cote{stroke:#9bbefc;stroke-width:1.5;fill:none}
    .cadre{fill:#0d2347;stroke:#274a8a;stroke-width:2}
    .sep{stroke:#274a8a;stroke-width:2}
  </style>
  <text x="24" y="32" font-size="18" font-weight="600">Deux stations, dans le même quartier</text>
  <text class="sous" x="24" y="54">Stations simulées, vues de côté, à la même échelle.</text>
  <path class="sep" d="M 360 70 V 494"/>

  <!-- trottoir commun -->
  <rect x="0" y="330" width="720" height="22" fill="#34425e"/>

  <!-- première station (échelle : 1 cm = 2 unités, trottoir à y = 330) -->
  <rect x="112" y="320" width="84" height="10" rx="2" fill="#274a8a"/>
  <rect class="borne" x="132" y="130" width="44" height="192" rx="6"/>
  <rect class="boite" x="138" y="200" width="32" height="50" rx="4"/>
  <circle cx="154" cy="212" r="4" fill="#ffd08a"/>
  <rect class="borne" x="174" y="144" width="62" height="12" rx="4"/>
  <rect class="boite" x="230" y="134" width="16" height="32" rx="5" stroke-width="2.5"/>
  <g transform="rotate(20 154 114)">
    <rect class="borne" x="96" y="92" width="116" height="44" rx="14"/>
    <rect class="ecran" x="112" y="100" width="60" height="28" rx="4"/>
  </g>
  <path class="cote" d="M 266 150 H 286 M 266 330 H 286 M 276 150 V 330"/>
  <text x="290" y="246">90 cm</text>

  <rect class="cadre" x="24" y="366" width="316" height="128" rx="10"/>
  <text class="titre" x="42" y="392">La première station</text>
  <text x="42" y="420">· borne inclinée</text>
  <text x="42" y="446">· ancrage à 90 cm</text>
  <text x="42" y="472">· boîtier à vis unique</text>

  <!-- deuxième station -->
  <rect x="440" y="110" width="210" height="14" rx="3" fill="#274a8a" stroke="#61dafb" stroke-width="2"/>
  <rect x="632" y="124" width="12" height="206" fill="#274a8a" stroke="#61dafb" stroke-width="2"/>
  <rect x="472" y="320" width="84" height="10" rx="2" fill="#274a8a"/>
  <rect class="borne" x="492" y="176" width="44" height="146" rx="6"/>
  <rect class="borne" x="462" y="146" width="104" height="36" rx="14"/>
  <rect class="ecran" x="484" y="152" width="60" height="24" rx="4"/>
  <rect class="boite" x="498" y="222" width="32" height="50" rx="4"/>
  <rect class="soudure" x="502" y="226" width="24" height="42" rx="2"/>
  <circle cx="590" cy="318" r="11" fill="none" stroke="#61dafb" stroke-width="4"/>
  <rect x="584" y="326" width="12" height="6" fill="#61dafb"/>

  <rect class="cadre" x="380" y="366" width="316" height="128" rx="10"/>
  <text class="titre" x="398" y="392">La deuxième station</text>
  <text x="398" y="420">· bornes abritées sous un auvent</text>
  <text x="398" y="446">· ancrage au sol</text>
  <text x="398" y="472">· boîtier soudé</text>
</svg>
