<svg width="960" height="570" xmlns="http://www.w3.org/2000/svg" viewBox="50 150 960 570" role="img" aria-labelledby="bac-station-t bac-station-d" font-family="Calibri, Carlito, &#x27;Segoe UI&#x27;, Arial, sans-serif"><title id="bac-station-t">La bête à cornes de la station de vélos, ses cases encore vides</title><desc id="bac-station-d">La bête à cornes de la station de vélos : « À qui le produit rend-il service ? » et « Sur quoi agit-il ? » au-dessus de deux ellipses vides, en haut ; « La station de vélos » dans l'ellipse du centre, sous la corne ; « Dans quel but ? » au-dessus du rectangle vide, en bas, au bout de la flèche.</desc><defs><marker id="bac-station-pb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2e75b6"/></marker></defs><rect x="50" y="150" width="960" height="570" fill="#fff"/><text x="318" y="191" text-anchor="middle" font-size="38" font-style="italic" fill="#2b2b2b">À qui le produit rend-il service ?</text><text x="845" y="191" text-anchor="middle" font-size="38" font-style="italic" fill="#2b2b2b">Sur quoi agit-il ?</text><ellipse cx="350" cy="284.5" rx="134" ry="59.5" fill="#fff" stroke="#1f3864" stroke-width="3"/><line x1="234" y1="286" x2="466" y2="286" stroke="#1f3864" stroke-width="2.5" stroke-dasharray="2 3"/><ellipse cx="825.5" cy="284.5" rx="133.5" ry="59.5" fill="#fff" stroke="#1f3864" stroke-width="3"/><line x1="710" y1="286" x2="942" y2="286" stroke="#1f3864" stroke-width="2.5" stroke-dasharray="2 3"/><ellipse cx="583" cy="476" rx="122" ry="73" fill="#fff" stroke="#1f3864" stroke-width="3"/><text x="583" y="470" text-anchor="middle" font-size="38" font-style="normal" font-weight="bold" fill="#1f3864">La station</text><text x="583" y="517" text-anchor="middle" font-size="38" font-style="normal" font-weight="bold" fill="#1f3864">de vélos</text><path d="M388,341 C440,398 520,424 590,421 C660,418 742,392 795,342" fill="none" stroke="#2e75b6" stroke-width="3"/><path d="M792,344 C764,366 750,388 750,414 L750,568" fill="none" stroke="#2e75b6" stroke-width="3" marker-end="url(#bac-station-pb)"/><text x="222" y="560" font-size="38" font-style="italic" fill="#2b2b2b">Dans quel but ?</text><rect x="250" y="573" width="732" height="132" fill="#fff" stroke="#1f3864" stroke-width="3"/><line x1="268" y1="641" x2="964" y2="641" stroke="#1f3864" stroke-width="2.5" stroke-dasharray="2 3"/></svg>
