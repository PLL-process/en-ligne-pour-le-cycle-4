<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="tl dl"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="tl">La station de vélos vue de côté, avant de chercher ses interacteurs</title>
  <desc id="dl">Schéma d'une station de vélos simulée, vue de côté, sans aucune indication de ce qui
  est un interacteur. De gauche à droite et de haut en bas : une borne, c'est-à-dire un poteau fixé
  sur le trottoir par une platine, surmonté d'une tête inclinée qui porte l'écran-lecteur ; à
  mi-hauteur du poteau, un petit boîtier fermé par une vis ; plus bas, un bras horizontal terminé par
  un point d'ancrage. Un vélo est accroché à ce point d'ancrage par sa roue avant, et se tient à
  droite de la borne, roues posées sur le trottoir. Sous la borne, un câble d'alimentation sort du
  pied du poteau, traverse le trottoir, s'enfonce dans le sol et part vers la droite, hors du
  dessin. Le trottoir est une bande horizontale ; le sol est dessiné en dessous. Chaque élément porte
  seulement son nom — borne, écran-lecteur, boîtier, point d'ancrage, vélo, trottoir, câble
  d'alimentation, sol — tous écrits de la même façon : le schéma ne dit pas ce qui fait partie de
  la station et ce qui lui est extérieur. Il n'y a ni pluie, ni personne, ni flèche.</desc>
  <rect width="720" height="460" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:15px}
    .nom{fill:#e4eaf5;font-size:15px}
    .sous{fill:#9bbefc;font-size:13px}
    .trait{stroke:#9bbefc;stroke-width:1.5;fill:none}
    .borne{fill:#122a52;stroke:#61dafb;stroke-width:2.5}
    .cadre{stroke:#c9d6ee;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .roue{stroke:#c9d6ee;stroke-width:5;fill:none}
    .cable{stroke:#ffb454;stroke-width:5;fill:none;stroke-linecap:round}
  </style>
  <text x="24" y="32" font-size="18" font-weight="600">La station, vue de côté</text>
  <text class="sous" x="24" y="54">Station simulée. Chaque élément porte son nom, et rien d'autre.</text>

  <!-- sol et trottoir -->
  <rect x="0" y="372" width="720" height="88" fill="#1c1a24"/>
  <rect x="0" y="344" width="720" height="28" fill="#34425e"/>
  <text class="nom" x="24" y="364">trottoir</text>
  <text class="nom" x="24" y="444">sol</text>

  <!-- câble d'alimentation -->
  <path class="cable" d="M 286 336 V 410 H 720"/>

  <!-- borne : platine, poteau, boîtier, bras d'ancrage, tête inclinée -->
  <rect x="244" y="334" width="84" height="10" rx="2" fill="#274a8a"/>
  <rect class="borne" x="264" y="146" width="44" height="190" rx="6"/>
  <rect x="270" y="196" width="32" height="46" rx="4" fill="#0a1b3d" stroke="#61dafb" stroke-width="2"/>
  <circle cx="286" cy="206" r="3.5" fill="#ffd08a"/>
  <rect class="borne" x="306" y="256" width="58" height="12" rx="4"/>
  <rect x="358" y="246" width="16" height="32" rx="5" fill="#0a1b3d" stroke="#61dafb" stroke-width="2.5"/>
  <g transform="rotate(20 286 128)">
    <rect class="borne" x="236" y="106" width="104" height="44" rx="10"/>
    <rect x="252" y="114" width="60" height="28" rx="4" fill="#0b3d2e" stroke="#81fba1" stroke-width="2"/>
  </g>

  <!-- vélo accroché par la roue avant -->
  <circle class="roue" cx="412" cy="300" r="42"/>
  <circle class="roue" cx="598" cy="300" r="42"/>
  <path class="cadre" d="M 412 300 L 430 222 L 530 232 L 598 300 M 430 222 L 498 302 L 598 300 M 530 232 L 498 302 M 516 206 L 550 206 M 530 232 L 532 206 M 420 214 L 446 208"/>

  <!-- noms, tous du même style -->
  <path class="trait" d="M 150 102 H 196 L 262 122"/>
  <text class="nom" x="36" y="107">écran-lecteur</text>
  <path class="trait" d="M 150 170 H 262"/>
  <text class="nom" x="96" y="175">borne</text>
  <path class="trait" d="M 150 220 H 268"/>
  <text class="nom" x="84" y="225">boîtier</text>
  <path class="trait" d="M 366 244 V 150 H 400"/>
  <text class="nom" x="406" y="155">point d'ancrage</text>
  <path class="trait" d="M 560 230 L 604 180 H 624"/>
  <text class="nom" x="630" y="185">vélo</text>
  <path class="trait" d="M 470 410 V 424"/>
  <text class="nom" x="410" y="444">câble d'alimentation</text>
</svg>
