<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="tq dq"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="tq">Cinq détails numérotés sur la station de vélos</title>
  <desc id="dq">Schéma de la station de vélos simulée, vue de côté, sans vélo, sur laquelle cinq
  détails sont repérés par un numéro dans un cercle. Le numéro 1 est posé sur la tête de la borne,
  qui est inclinée vers le bas. Le numéro 2 est posé sur le point d'ancrage du vélo, au bout d'un
  bras horizontal ; une cote verticale, du trottoir jusqu'au point d'ancrage, indique 90 cm. Le
  numéro 3 est posé sur un coin arrondi de la tête de la borne. Le numéro 4 est posé sur le boîtier
  du poteau, où l'on voit une seule vis. Le numéro 5 est posé sur la tête de la borne, dont les
  pièces — l'écran-lecteur, le cadre et le boîtier — sont séparées par des traits en pointillés.
  Sous le dessin, une légende reprend les cinq détails mot pour mot : 1, la borne est inclinée vers
  le bas plutôt que plate ; 2, le point d'ancrage du vélo est à 90 cm du sol ; 3, les arêtes de la
  station sont arrondies ; 4, le boîtier se démonte avec une vis unique ; 5, les pièces de la borne
  se remplacent une par une, au lieu de former un bloc unique. Le schéma ne dit ni à quel
  interacteur ni à quel domaine chaque détail répond : c'est la question de l'activité.</desc>
  <rect width="720" height="600" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:15px}
    .sous{fill:#9bbefc;font-size:13px}
    .borne{fill:#122a52;stroke:#61dafb;stroke-width:2.5}
    .piece{stroke:#e4eaf5;stroke-width:1.5;stroke-dasharray:4 3;fill:none}
    .cote{stroke:#9bbefc;stroke-width:1.5;fill:none}
    .pastille{fill:#ffb454;stroke:#050f24;stroke-width:2}
    .num{fill:#050f24;font-size:16px;font-weight:700}
    .trait{stroke:#ffb454;stroke-width:2;fill:none}
    .leg{fill:#e4eaf5;font-size:15px}
  </style>
  <text x="24" y="32" font-size="18" font-weight="600">Cinq détails sur la station</text>
  <text class="sous" x="24" y="54">Station simulée, vue de côté, sans vélo. Une cote : 90 cm.</text>

  <!-- trottoir -->
  <rect x="0" y="346" width="720" height="24" fill="#34425e"/>

  <!-- borne : 1 cm de station = 2 unités ; le trottoir est à y = 346 -->
  <rect x="264" y="336" width="84" height="10" rx="2" fill="#274a8a"/>
  <rect class="borne" x="284" y="130" width="44" height="208" rx="6"/>
  <rect x="290" y="196" width="32" height="50" rx="4" fill="#0a1b3d" stroke="#61dafb" stroke-width="2"/>
  <circle cx="306" cy="208" r="4" fill="#ffd08a"/>
  <rect class="borne" x="326" y="160" width="62" height="12" rx="4"/>
  <rect x="382" y="150" width="16" height="32" rx="5" fill="#0a1b3d" stroke="#61dafb" stroke-width="2.5"/>
  <g transform="rotate(20 306 112)">
    <rect class="borne" x="244" y="88" width="124" height="48" rx="14"/>
    <rect x="262" y="97" width="62" height="30" rx="4" fill="#0b3d2e" stroke="#81fba1" stroke-width="2"/>
    <path class="piece" d="M 334 90 V 134 M 254 90 V 134"/>
  </g>

  <!-- cote de 90 cm : du trottoir au point d'ancrage -->
  <path class="cote" d="M 420 166 H 440 M 420 346 H 440 M 430 166 V 346"/>
  <text x="444" y="262">90 cm</text>

  <!-- pastilles numérotées et leurs traits -->
  <path class="trait" d="M 342 99 L 510 64"/>
  <circle class="pastille" cx="526" cy="60" r="16"/><text class="num" x="521" y="66">1</text>
  <path class="trait" d="M 398 166 L 510 166"/>
  <circle class="pastille" cx="526" cy="166" r="16"/><text class="num" x="521" y="172">2</text>
  <path class="trait" d="M 242 118 L 196 158"/>
  <circle class="pastille" cx="180" cy="164" r="16"/><text class="num" x="175" y="170">3</text>
  <path class="trait" d="M 290 222 L 196 240"/>
  <circle class="pastille" cx="180" cy="244" r="16"/><text class="num" x="175" y="250">4</text>
  <path class="trait" d="M 254 100 L 196 94"/>
  <circle class="pastille" cx="180" cy="92" r="16"/><text class="num" x="175" y="98">5</text>

  <!-- légende, mot pour mot -->
  <rect x="24" y="394" width="672" height="190" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="2"/>
  <circle class="pastille" cx="48" cy="424" r="12"/><text class="num" x="43" y="430" font-size="14">1</text>
  <text class="leg" x="70" y="429">la borne est inclinée vers le bas plutôt que plate</text>
  <circle class="pastille" cx="48" cy="458" r="12"/><text class="num" x="43" y="464" font-size="14">2</text>
  <text class="leg" x="70" y="463">le point d'ancrage du vélo est à 90 cm du sol</text>
  <circle class="pastille" cx="48" cy="492" r="12"/><text class="num" x="43" y="498" font-size="14">3</text>
  <text class="leg" x="70" y="497">les arêtes de la station sont arrondies</text>
  <circle class="pastille" cx="48" cy="526" r="12"/><text class="num" x="43" y="532" font-size="14">4</text>
  <text class="leg" x="70" y="531">le boîtier se démonte avec une vis unique</text>
  <circle class="pastille" cx="48" cy="560" r="12"/><text class="num" x="43" y="566" font-size="14">5</text>
  <text class="leg" x="70" y="565">les pièces de la borne se remplacent une par une, au lieu de former un bloc unique</text>
</svg>
