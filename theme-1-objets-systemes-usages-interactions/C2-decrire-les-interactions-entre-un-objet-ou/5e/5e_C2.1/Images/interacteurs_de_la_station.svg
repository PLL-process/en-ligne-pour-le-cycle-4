<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="ti di"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="ti">Les trois natures d'interacteurs autour de la station de vélos</title>
  <desc id="di">Au centre, la station de vélos. Tout autour, trois groupes d'interacteurs de natures
  différentes, présentés comme également importants. Les personnes : l'usager qui prend et rend un
  vélo, l'agent de maintenance qui répare, le riverain qui passe devant. Les objets : le vélo
  lui-même, le trottoir sur lequel la station est fixée, le réseau informatique qui identifie
  l'usager, l'alimentation électrique. Les conditions : la pluie qui mouille les bornes, le sel de
  l'air marin qui attaque les métaux, la température, le vandalisme, et les règles de la ville qui
  limitent l'emprise au sol. Un encadré en bas rappelle qu'un interacteur est toujours extérieur à
  l'objet — la couleur du cadre d'un vélo est une caractéristique de l'objet, pas un interacteur —
  et qu'une liste qui ne contient que des personnes est une liste à moitié faite.</desc>
  <rect width="900" height="430" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:13px}
    .ti{font-size:15px;font-weight:600}
    .lb{fill:#9bbefc;font-size:12px}
    .fl{stroke:#61dafb;stroke-width:2;fill:none;marker-end:url(#fi)}
  </style>
  <defs><marker id="fi" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#61dafb"/></marker></defs>
  <text x="26" y="30" font-size="17" font-weight="600">Ce qui entre en relation avec la station</text>
  <text class="lb" x="26" y="50">Trois natures. Aucune n'est plus « technique » que les autres.</text>

  <rect x="352" y="176" width="196" height="74" rx="14" fill="#122a52" stroke="#61dafb" stroke-width="2.5"/>
  <text class="ti" x="374" y="206" fill="#61dafb">La station</text>
  <text class="lb" x="374" y="230">l'objet que l'on étudie</text>

  <rect x="26" y="72" width="256" height="140" rx="12" fill="#2b1a3f" stroke="#a077d8" stroke-width="2"/>
  <text class="ti" x="42" y="100" fill="#c68ef2">Des personnes</text>
  <text x="42" y="126">· l'usager</text>
  <text x="42" y="150">· l'agent de maintenance</text>
  <text x="42" y="174">· le riverain</text>
  <text class="lb" x="42" y="198">celles qu'on cite en premier</text>

  <rect x="618" y="72" width="256" height="140" rx="12" fill="#0d2347" stroke="#3f6bb5" stroke-width="2"/>
  <text class="ti" x="634" y="100" fill="#8fb6ff">Des objets</text>
  <text x="634" y="126">· le vélo, la borne</text>
  <text x="634" y="150">· le trottoir</text>
  <text x="634" y="174">· le réseau, l'électricité</text>
  <text class="lb" x="634" y="198">ni vivants, ni toujours visibles</text>

  <rect x="322" y="272" width="256" height="140" rx="12" fill="#0d3320" stroke="#4fae7a" stroke-width="2"/>
  <text class="ti" x="338" y="300" fill="#81fba1">Des conditions</text>
  <text x="338" y="326">· la pluie, le sel marin</text>
  <text x="338" y="350">· la température</text>
  <text x="338" y="374">· le vandalisme, les règles</text>
  <text class="lb" x="338" y="398">celles qu'on oublie presque toujours</text>

  <path class="fl" d="M282 142 H 320 V 190 H 348"/>
  <path class="fl" d="M618 142 H 580 V 190 H 552"/>
  <path class="fl" d="M450 272 V 254"/>

  <rect x="26" y="272" width="280" height="140" rx="10" fill="#2b1f0d" stroke="#ffb454" stroke-width="2"/>
  <text x="42" y="298" font-size="14" font-weight="600" fill="#ffd08a">Deux repères</text>
  <text x="42" y="324" font-size="12.5">Un interacteur est toujours</text>
  <text x="42" y="342" font-size="12.5"><tspan font-weight="600">extérieur</tspan> à l'objet.</text>
  <text x="42" y="368" font-size="12.5">La couleur du cadre n'en est</text>
  <text x="42" y="386" font-size="12.5">pas un : c'est l'objet lui-même.</text>

  <rect x="594" y="272" width="280" height="140" rx="10" fill="#2b1f0d" stroke="#ffb454" stroke-width="2"/>
  <text x="610" y="298" font-size="14" font-weight="600" fill="#ffd08a">Le réflexe qui coûte</text>
  <text x="610" y="324" font-size="12.5">Une liste qui ne contient que</text>
  <text x="610" y="342" font-size="12.5">des personnes est une liste</text>
  <text x="610" y="360" font-size="12.5">à moitié faite.</text>
  <text x="610" y="386" font-size="12.5">Compte les tiennes.</text>
</svg>
