<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" role="img" aria-labelledby="ti di"
     font-family="Segoe UI, system-ui, sans-serif" font-size="14">
  <title id="ti">Les quatre familles d'interacteurs extérieurs autour de la station de vélos</title>
  <desc id="di">Au centre, la station de vélos, l'objet que l'on étudie. Autour d'elle, bien séparées les unes des
  autres et d'elle, les quatre familles d'interacteurs extérieurs nommées par le programme, présentées comme
  également importantes. Les usagers : le cycliste abonné qui prend et rend un vélo, le touriste de passage,
  l'agent de maintenance qui répare. Les données : l'identifiant de l'abonné, l'état « disponible » d'un vélo, le
  paiement, le numéro de la borne — rien de tout cela ne se voit, et sans elles la station ne débloque aucun vélo.
  Les autres objets : le vélo, le smartphone qui transmet l'identifiant, le serveur de la ville. Les éléments de
  l'environnement : la pluie, le soleil, le sel de l'air marin qui attaque les métaux, la température, le trottoir
  sur lequel la station est fixée, la circulation. Chaque famille est reliée à la station par une flèche à double
  sens : la relation va dans les deux sens. Une ligne, sous le titre, prévient que ce n'est pas encore un diagramme
  pieuvre : c'est la liste des interacteurs, rangée par familles, sans fonction écrite sur les traits. Sous le
  schéma, à part et sans flèche, deux repères. Le premier : un interacteur est toujours extérieur à l'objet ; la
  couleur du cadre n'en est pas un, c'est une caractéristique de l'objet. Le second : un interacteur n'est pas une
  exigence ; une règle de la ville n'échange rien avec la station, elle impose une condition à celui qui la
  conçoit. Une bande de conclusion rappelle que la famille la plus souvent oubliée est celle des données, parce
  qu'elle ne se voit pas.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#61dafb" stop-opacity=".22"/>
      <stop offset="1" stop-color="#61dafb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <marker id="fi" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto-start-reverse"
            markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M0 0 L10 5 L0 10 Z" fill="#61dafb"/></marker>
  </defs>
  <style>
    text{fill:#e4eaf5}
    .ti{font-size:17px;font-weight:600}
    .lb{fill:#9bbefc;font-size:12.5px}
    .pied{font-size:12.5px;font-style:italic}
    .fl{stroke:#61dafb;stroke-width:2;fill:none;stroke-linecap:round;marker-start:url(#fi);marker-end:url(#fi)}
  </style>
  <rect width="900" height="636" fill="#050f24"/>
  <text style="font-size:19px" x="32" y="40" font-weight="600">Ce qui entre en relation avec la station</text>
  <text style="font-size:13px" class="lb" x="32" y="63">Quatre familles. Aucune n'est plus «&#160;technique&#160;» que les autres.</text>
  <text x="32" y="86" style="font-size:13px;fill:#ffd08a"><tspan font-weight="600">Pas encore un diagramme pieuvre</tspan>&#160;: c'est la liste des interacteurs, rangée par familles — aucune fonction sur les traits.</text>

  <ellipse cx="450.0" cy="270.0" rx="150" ry="96" fill="url(#halo)"/>
  <path class="fl" d="M287 212 C 316.0 212, 316.0 250, 345 250"/>
  <path class="fl" d="M613 212 C 584.0 212, 584.0 250, 555 250"/>
  <path class="fl" d="M287 328 C 316.0 328, 316.0 290, 345 290"/>
  <path class="fl" d="M613 328 C 584.0 328, 584.0 290, 555 290"/>
  <rect x="352" y="228" width="196" height="84" rx="20" fill="#10284d" stroke="#61dafb" stroke-width="2.5"/>
  <rect x="352" y="228" width="196" height="84" rx="20" fill="url(#voile)"/>
  <text class="ti" x="450.0" y="265" text-anchor="middle" style="font-size:19px;fill:#61dafb">La station</text>
  <text class="lb" x="450.0" y="289" text-anchor="middle">l'objet que l'on étudie</text>

  <rect x="32" y="108" width="248" height="140" rx="16" fill="#1f1638" stroke="#7c5cc4" stroke-width="1.8"/>
  <rect x="32" y="108" width="248" height="140" rx="16" fill="url(#voile)"/>
  <text class="ti" x="52" y="142" style="fill:#c9a2ff">👤 Les usagers</text>
  <text x="52" y="170">· le cycliste abonné</text>
  <text x="52" y="193">· le touriste de passage</text>
  <text x="52" y="216">· l'agent de maintenance</text>
  <text class="lb pied" x="52" y="235">ceux qu'on cite en premier</text>

  <rect x="620" y="108" width="248" height="140" rx="16" fill="#2a200c" stroke="#c98a2e" stroke-width="1.8"/>
  <rect x="620" y="108" width="248" height="140" rx="16" fill="url(#voile)"/>
  <text class="ti" x="640" y="142" style="fill:#ffd08a">💾 Les données</text>
  <text x="640" y="170">· l'identifiant de l'abonné</text>
  <text x="640" y="193">· l'état «&#160;disponible&#160;» du vélo</text>
  <text x="640" y="216">· le paiement, le n° de borne</text>
  <text class="lb pied" x="640" y="235">celles qu'on oublie toujours</text>

  <rect x="32" y="292" width="248" height="140" rx="16" fill="#0c1f40" stroke="#3f6bb5" stroke-width="1.8"/>
  <rect x="32" y="292" width="248" height="140" rx="16" fill="url(#voile)"/>
  <text class="ti" x="52" y="326" style="fill:#9cc2ff">📱 Les autres objets</text>
  <text x="52" y="354">· le vélo</text>
  <text x="52" y="377">· le smartphone</text>
  <text x="52" y="400">· le serveur de la ville</text>
  <text class="lb pied" x="52" y="419">avec qui la station échange</text>

  <rect x="620" y="292" width="248" height="140" rx="16" fill="#0b2a1b" stroke="#3f9a68" stroke-width="1.8"/>
  <rect x="620" y="292" width="248" height="140" rx="16" fill="url(#voile)"/>
  <text class="ti" x="640" y="326" style="fill:#8fe8b0">🌧️ L'environnement</text>
  <text x="640" y="354">· la pluie, le soleil</text>
  <text x="640" y="377">· le sel marin, la température</text>
  <text x="640" y="400">· le trottoir, la circulation</text>
  <text class="lb pied" x="640" y="419">ce qui agit sans qu'on l'appelle</text>

  <line x1="32" y1="456" x2="868" y2="456" stroke="#1e3a66" stroke-width="1"/>
  <text style="font-size:12px" class="lb" x="32" y="472" letter-spacing="1.5">DEUX REPÈRES POUR LIRE LE SCHÉMA</text>
  <rect x="32.0" y="484" width="408.0" height="72" rx="12" fill="#0b1a33" stroke="#1e3a66" stroke-width="1"/>
  <rect x="32.0" y="496" width="4" height="48" rx="2" fill="#ffb454"/>
  <text x="52.0" y="508" font-weight="600" style="font-size:14px;fill:#ffd08a">Toujours EXTÉRIEUR à l'objet</text>
  <text style="font-size:13px" x="52.0" y="529">La couleur du cadre n'en est pas un&#160;:</text>
  <text style="font-size:13px" x="52.0" y="547">c'est une caractéristique de l'objet.</text>
  <rect x="460.0" y="484" width="408.0" height="72" rx="12" fill="#0b1a33" stroke="#1e3a66" stroke-width="1"/>
  <rect x="460.0" y="496" width="4" height="48" rx="2" fill="#ff7b88"/>
  <text x="480.0" y="508" font-weight="600" style="font-size:14px;fill:#ff9aa4">Interacteur ≠ exigence</text>
  <text style="font-size:13px" x="480.0" y="529">Une règle de la ville n'échange rien avec la station&#160;:</text>
  <text style="font-size:13px" x="480.0" y="547">elle impose une condition à celui qui la conçoit.</text>

  <rect x="32" y="574" width="836" height="38" rx="10" fill="#10284d" stroke="#3f6bb5" stroke-width="1.5"/>
  <text style="font-size:13px" x="50" y="598"><tspan font-weight="600" style="fill:#ffd08a">La famille qu'on oublie, c'est celle des données</tspan> — parce qu'elle ne se voit pas. Sans l'identifiant, la borne ne débloque rien.</text>
</svg>
