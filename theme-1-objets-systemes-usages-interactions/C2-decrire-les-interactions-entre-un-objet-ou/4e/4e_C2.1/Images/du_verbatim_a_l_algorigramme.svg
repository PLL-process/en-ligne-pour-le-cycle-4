<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="tv dv"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="tv">Du langage naturel aux schémas, graphiques et algorithmes</title>
  <desc id="dv">Quatre étapes reliées par des flèches, qui montrent comment une expérience vécue
  devient une représentation utilisable. Première étape, le langage naturel : ce que les usagers
  disent, avec leurs mots, et le croquis qu'on fait à la main — par exemple « tu tires, ça résiste,
  et tu ne sais pas si c'est toi ou la borne ». Ce qu'on y gagne : le ressenti, tel qu'il est vécu.
  Ce qui manque : rien n'est comparable, et deux personnes peuvent se contredire. Deuxième étape,
  le schéma : le parcours découpé en étapes nommées — arriver, identifier, choisir, déverrouiller,
  partir. Ce qu'on y gagne : tout le monde parle de la même chose au même endroit. Ce qui manque :
  on ne sait pas encore où le temps part. Troisième étape, le graphique : les durées mesurées,
  étape par étape. Ce qu'on y gagne : ce qui coûte du temps devient visible et comparable. Ce qui
  manque : le graphique ne dit pas ce que la machine décide. Quatrième étape, l'algorithme : le
  parcours écrit comme une suite d'actions et de tests, avec ses reprises quand une étape échoue.
  Ce qu'on y gagne : les cas d'échec apparaissent, et deviennent traitables. Une bande en bas
  rappelle qu'on ne remplace pas une étape par la suivante : chacune garde ce que les autres ne
  savent pas dire, et un ressenti n'est pas une mesure.</desc>
  <rect width="900" height="430" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:12.5px}
    .ti{font-size:14.5px;font-weight:600}
    .lb{fill:#9bbefc;font-size:11.5px}
    .pl{fill:#81fba1;font-size:11.5px}
    .mo{fill:#ffb8c0;font-size:11.5px}
    .fl{stroke:#61dafb;stroke-width:2.5;fill:none;marker-end:url(#fv)}
  </style>
  <defs><marker id="fv" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#61dafb"/></marker></defs>
  <text x="26" y="30" font-size="17" font-weight="600">Du langage naturel à l'algorithme</text>
  <text class="lb" x="26" y="50">Quatre représentations d'une même expérience. Aucune ne remplace la précédente.</text>

  <rect x="26" y="70" width="196" height="228" rx="12" fill="#2b1a3f" stroke="#a077d8" stroke-width="2"/>
  <text class="ti" x="40" y="98" fill="#c68ef2">1. Langage naturel</text>
  <text class="lb" x="40" y="118">ce qu'on dit, ce qu'on croque</text>
  <text x="40" y="146" font-size="11.5">« tu tires, ça résiste,</text>
  <text x="40" y="163" font-size="11.5">et tu ne sais pas si</text>
  <text x="40" y="180" font-size="11.5">c'est toi ou la borne »</text>
  <text class="pl" x="40" y="212">+ le ressenti, tel qu'il</text>
  <text class="pl" x="40" y="228">est vécu</text>
  <text class="mo" x="40" y="256">− rien n'est comparable ;</text>
  <text class="mo" x="40" y="272">deux personnes peuvent</text>
  <text class="mo" x="40" y="288">se contredire</text>

  <rect x="246" y="70" width="196" height="228" rx="12" fill="#0d2347" stroke="#3f6bb5" stroke-width="2"/>
  <text class="ti" x="260" y="98" fill="#8fb6ff">2. Schéma</text>
  <text class="lb" x="260" y="118">le parcours en étapes</text>
  <text x="260" y="146" font-size="11.5">arriver → identifier →</text>
  <text x="260" y="163" font-size="11.5">choisir → déverrouiller</text>
  <text x="260" y="180" font-size="11.5">→ partir</text>
  <text class="pl" x="260" y="212">+ tout le monde parle</text>
  <text class="pl" x="260" y="228">du même endroit</text>
  <text class="mo" x="260" y="256">− on ne sait pas encore</text>
  <text class="mo" x="260" y="272">où le temps part</text>

  <rect x="466" y="70" width="196" height="228" rx="12" fill="#0d3320" stroke="#4fae7a" stroke-width="2"/>
  <text class="ti" x="480" y="98" fill="#81fba1">3. Graphique</text>
  <text class="lb" x="480" y="118">les durées mesurées</text>
  <rect x="484" y="140" width="18" height="14" fill="#4fae7a"/>
  <rect x="508" y="132" width="18" height="22" fill="#4fae7a"/>
  <rect x="532" y="112" width="18" height="42" fill="#ffb454"/>
  <rect x="556" y="120" width="18" height="34" fill="#ffb454"/>
  <rect x="580" y="138" width="18" height="16" fill="#4fae7a"/>
  <line x1="480" y1="154" x2="606" y2="154" stroke="#9bbefc"/>
  <text class="lb" x="480" y="172">secondes, par étape</text>
  <text class="pl" x="480" y="212">+ ce qui coûte du temps</text>
  <text class="pl" x="480" y="228">devient comparable</text>
  <text class="mo" x="480" y="256">− il ne dit pas ce que</text>
  <text class="mo" x="480" y="272">la machine décide</text>

  <rect x="686" y="70" width="188" height="228" rx="12" fill="#2b1f0d" stroke="#ffb454" stroke-width="2"/>
  <text class="ti" x="700" y="98" fill="#ffd08a">4. Algorithme</text>
  <text class="lb" x="700" y="118">actions et tests</text>
  <text x="700" y="146" font-size="11.5">présenter la carte</text>
  <text x="700" y="164" font-size="11.5">SI reconnue ALORS</text>
  <text x="700" y="182" font-size="11.5">  ouvrir l'ancrage</text>
  <text x="700" y="200" font-size="11.5">SINON recommencer</text>
  <text class="pl" x="700" y="228">+ les cas d'échec</text>
  <text class="pl" x="700" y="244">apparaissent</text>
  <text class="mo" x="700" y="272">− il ne dit rien du</text>
  <text class="mo" x="700" y="288">ressenti</text>

  <path class="fl" d="M222 184 H 242"/>
  <path class="fl" d="M442 184 H 462"/>
  <path class="fl" d="M662 184 H 682"/>

  <rect x="26" y="318" width="848" height="94" rx="10" fill="#122a52" stroke="#3f6bb5" stroke-width="2"/>
  <text x="42" y="344" font-size="14.5" font-weight="600" fill="#8fb6ff">On n'efface pas les étapes précédentes</text>
  <text x="42" y="370">Chaque représentation garde ce que les autres ne savent pas dire. Le graphique ne connaît</text>
  <text x="42" y="390">pas la colère de Chen&#160;; le verbatim de Chen ne connaît pas les 41&#160;secondes de l'étape «&#160;choisir&#160;».</text>
  <text x="42" y="406" font-weight="600" fill="#ffd08a">Un ressenti n'est pas une mesure — et une mesure n'est pas un ressenti.</text>
</svg>
