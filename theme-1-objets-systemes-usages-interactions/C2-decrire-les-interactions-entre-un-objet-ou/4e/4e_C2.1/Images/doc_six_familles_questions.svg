<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 738" width="350" height="738" role="img" aria-labelledby="t_six_familles_questions d_six_familles_questions" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_six_familles_questions">Six familles d'exigences, six questions à poser à un objet</title>
<desc id="d_six_familles_questions">Six fiches, une par famille d'exigences, avec la question que chacune pose. Sécurité : quelqu'un peut-il se blesser ou être mis en danger ? Incidences environnementales : que coûte l'objet en matière et en énergie, sur sa durée de vie ? Formes et fonctions : la forme sert-elle ce que l'objet doit faire ? Ergonomie : le corps et les gestes sont-ils respectés ? Qualité : l'objet fait-il toujours ce qu'il annonce ? Fiabilité : combien de fois sur cent l'objet échoue-t-il ?</desc>
<rect width="350" height="738" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Six familles d'exigences, six</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">questions à poser à un objet</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Les mots sont ceux du programme.</text>
<rect x="14.0" y="92.1" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="122.1" font-size="16" fill="#61dafb" font-weight="700">Sécurité</text>
<text x="26.0" y="149.1" font-size="15" fill="#e4eaf5">Quelqu'un peut-il se blesser ou être mis</text>
<text x="26.0" y="170.1" font-size="15" fill="#e4eaf5">en danger ?</text>
<rect x="14.0" y="198.1" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="228.1" font-size="16" fill="#61dafb" font-weight="700">Incidences environnementales</text>
<text x="26.0" y="255.1" font-size="15" fill="#e4eaf5">Que coûte l'objet en matière et en</text>
<text x="26.0" y="276.1" font-size="15" fill="#e4eaf5">énergie, sur sa durée de vie ?</text>
<rect x="14.0" y="304.1" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="334.1" font-size="16" fill="#61dafb" font-weight="700">Formes et fonctions</text>
<text x="26.0" y="361.1" font-size="15" fill="#e4eaf5">La forme sert-elle ce que l'objet doit</text>
<text x="26.0" y="382.1" font-size="15" fill="#e4eaf5">faire ?</text>
<rect x="14.0" y="410.1" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="440.1" font-size="16" fill="#61dafb" font-weight="700">Ergonomie</text>
<text x="26.0" y="467.1" font-size="15" fill="#e4eaf5">Le corps et les gestes sont-ils</text>
<text x="26.0" y="488.1" font-size="15" fill="#e4eaf5">respectés ?</text>
<rect x="14.0" y="516.1" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="546.1" font-size="16" fill="#61dafb" font-weight="700">Qualité</text>
<text x="26.0" y="573.1" font-size="15" fill="#e4eaf5">L'objet fait-il toujours ce qu'il</text>
<text x="26.0" y="594.1" font-size="15" fill="#e4eaf5">annonce ?</text>
<rect x="14.0" y="622.1" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="652.1" font-size="16" fill="#61dafb" font-weight="700">Fiabilité</text>
<text x="26.0" y="679.1" font-size="15" fill="#e4eaf5">Combien de fois sur cent l'objet</text>
<text x="26.0" y="700.1" font-size="15" fill="#e4eaf5">échoue-t-il ?</text>
</svg>
