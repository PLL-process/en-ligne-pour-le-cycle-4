<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" style="width:100%;height:auto" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Extrait de la notice d’un climatiseur mobile</title>
<desc id="d">Extrait de notice d'un climatiseur mobile. À gauche, les touches de la télécommande : marche-arrêt ; flocon, froid ; goutte, déshumidifier ; hélice, ventilation seule ; horloge, minuterie pour programmer l'arrêt ; flèches, régler la température ou la durée. À droite, programmer l'arrêt : 1. appuie sur la touche de l'horloge ; 2. règle la durée avec les flèches, de 1 à 12 heures ; 3. attends 5 secondes, le voyant de l'horloge reste allumé. En bas, deux avertissements avec le triangle de danger : ne bouche pas la sortie d'air ; débranche l'appareil avant de le nettoyer.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a41"/></marker></defs>
<rect x="0" y="0" width="1060" height="640" fill="#fbfaf6"/>
<text x="40" y="52" font-size="28" font-weight="700" text-anchor="start" fill="#1b2a41">Extrait de la notice — climatiseur mobile</text>
<rect x="30" y="80" width="490" height="400" rx="14" fill="#ffffff" stroke="#8a97a8" stroke-width="2"/>
<text x="52" y="120" font-size="22" font-weight="700" text-anchor="start" fill="#1b2a41">Les touches de la télécommande</text>
<circle cx="78" cy="168" r="21" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<g stroke="#1b2a41" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M 71 162 A 10 10 0 1 0 85 162"/><line x1="78" y1="156" x2="78" y2="168"/></g>
<text x="118" y="175" font-size="21" text-anchor="start" fill="#1b2a41">Marche / Arrêt</text>
<circle cx="78" cy="220" r="21" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<g stroke="#1b2a41" stroke-width="2.4" fill="none" stroke-linecap="round"><line x1="78.0" y1="208.0" x2="78.0" y2="232.0"/><line x1="67.6" y1="214.0" x2="88.4" y2="226.0"/><line x1="88.4" y1="214.0" x2="67.6" y2="226.0"/><line x1="84.9" y1="224.0" x2="89.3" y2="222.8"/><line x1="84.9" y1="224.0" x2="86.1" y2="228.3"/><line x1="78.0" y1="228.0" x2="81.2" y2="231.2"/><line x1="78.0" y1="228.0" x2="74.8" y2="231.2"/><line x1="71.1" y1="224.0" x2="69.9" y2="228.3"/><line x1="71.1" y1="224.0" x2="66.7" y2="222.8"/><line x1="71.1" y1="216.0" x2="66.7" y2="217.2"/><line x1="71.1" y1="216.0" x2="69.9" y2="211.7"/><line x1="78.0" y1="212.0" x2="74.8" y2="208.8"/><line x1="78.0" y1="212.0" x2="81.2" y2="208.8"/><line x1="84.9" y1="216.0" x2="86.1" y2="211.7"/><line x1="84.9" y1="216.0" x2="89.3" y2="217.2"/></g>
<text x="118" y="227" font-size="21" text-anchor="start" fill="#1b2a41">Froid</text>
<circle cx="78" cy="272" r="21" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<g stroke="#1b2a41" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M 78 260 C 81 266 87 272 87 276 A 9 9 0 0 1 69 276 C 69 272 75 266 78 260 Z"/></g>
<text x="118" y="279" font-size="21" text-anchor="start" fill="#1b2a41">Déshumidifier</text>
<circle cx="78" cy="324" r="21" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<g stroke="#1b2a41" stroke-width="2.4" fill="none" stroke-linecap="round"><ellipse cx="78" cy="317" rx="4" ry="7" transform="rotate(0 78 324)"/><ellipse cx="78" cy="317" rx="4" ry="7" transform="rotate(120 78 324)"/><ellipse cx="78" cy="317" rx="4" ry="7" transform="rotate(240 78 324)"/></g>
<text x="118" y="331" font-size="21" text-anchor="start" fill="#1b2a41">Ventilation seule</text>
<circle cx="78" cy="376" r="21" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<g stroke="#1b2a41" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="78" cy="376" r="11"/><line x1="78" y1="376" x2="78" y2="369"/><line x1="78" y1="376" x2="84" y2="379"/></g>
<text x="118" y="383" font-size="21" text-anchor="start" fill="#1b2a41">Minuterie : programmer l’arrêt</text>
<circle cx="78" cy="428" r="21" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<g stroke="#1b2a41" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M 72 425 L 78 417 L 84 425 Z" fill="#1b2a41"/><path d="M 72 431 L 78 439 L 84 431 Z" fill="#1b2a41"/></g>
<text x="118" y="435" font-size="21" text-anchor="start" fill="#1b2a41">Régler la température ou la durée</text>
<rect x="540" y="80" width="490" height="400" rx="14" fill="#ffffff" stroke="#8a97a8" stroke-width="2"/>
<text x="562" y="120" font-size="22" font-weight="700" text-anchor="start" fill="#1b2a41">Programmer l’arrêt</text>
<text x="562" y="170" font-size="21" text-anchor="start" fill="#1b2a41">1. Appuie sur la touche de l’horloge.</text>
<text x="562" y="226" font-size="21" text-anchor="start" fill="#1b2a41">2. Règle la durée avec ▲ et ▼ :</text>
<text x="590" y="256" font-size="21" text-anchor="start" fill="#1b2a41">de 1 à 12 heures.</text>
<text x="562" y="312" font-size="21" text-anchor="start" fill="#1b2a41">3. Attends 5 secondes :</text>
<text x="590" y="342" font-size="21" text-anchor="start" fill="#1b2a41">le voyant de l’horloge reste allumé.</text>
<rect x="30" y="500" width="1000" height="112" rx="14" fill="#fff6d6" stroke="#b8860b" stroke-width="2"/>
<path d="M 78 526 L 108 582 L 48 582 Z" fill="#ffd21f" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
<text x="78" y="576" font-size="30" font-weight="700" text-anchor="middle" fill="#111111">!</text>
<text x="132" y="548" font-size="21" font-weight="700" text-anchor="start" fill="#1b2a41">Ne bouche pas la sortie d’air.</text>
<text x="132" y="588" font-size="21" font-weight="700" text-anchor="start" fill="#1b2a41">Débranche l’appareil avant de le nettoyer.</text>
</svg>
