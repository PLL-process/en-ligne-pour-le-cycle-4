<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 566" width="350" height="566" role="img" aria-labelledby="t_parcours_cinq_etapes d_parcours_cinq_etapes" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_parcours_cinq_etapes">Le parcours de l'usager, en cinq étapes</title>
<desc id="d_parcours_cinq_etapes">Cinq fiches, dans l'ordre du parcours. 1. Arriver : s'approcher de la borne et lire l'écran. 2. Identifier : présenter sa carte ou son téléphone. 3. Choisir : parcourir la liste des vélos disponibles. 4. Déverrouiller : attendre le déverrouillage du point d'ancrage. 5. Partir : sortir le vélo de son ancrage.</desc>
<rect width="350" height="566" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le parcours de</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">l'usager, en cinq étapes</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Le schéma du parcours : ce que</text>
<text x="14.0" y="94.3" font-size="13.5" fill="#9bbefc">fait l'usager à chaque étape.</text>
<rect x="14.0" y="110.3" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="140.3" font-size="16" fill="#61dafb" font-weight="700">1. Arriver</text>
<text x="26.0" y="167.3" font-size="15" fill="#e4eaf5">S'approcher de la borne et lire l'écran.</text>
<rect x="14.0" y="195.3" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="225.3" font-size="16" fill="#61dafb" font-weight="700">2. Identifier</text>
<text x="26.0" y="252.3" font-size="15" fill="#e4eaf5">Présenter sa carte ou son téléphone.</text>
<rect x="14.0" y="280.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="310.4" font-size="16" fill="#61dafb" font-weight="700">3. Choisir</text>
<text x="26.0" y="337.4" font-size="15" fill="#e4eaf5">Parcourir la liste des vélos disponibles.</text>
<rect x="14.0" y="365.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="395.4" font-size="16" fill="#61dafb" font-weight="700">4. Déverrouiller</text>
<text x="26.0" y="422.4" font-size="15" fill="#e4eaf5">Attendre le déverrouillage du point</text>
<text x="26.0" y="443.4" font-size="15" fill="#e4eaf5">d'ancrage.</text>
<rect x="14.0" y="471.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="501.4" font-size="16" fill="#61dafb" font-weight="700">5. Partir</text>
<text x="26.0" y="528.4" font-size="15" fill="#e4eaf5">Sortir le vélo de son ancrage.</text>
</svg>
