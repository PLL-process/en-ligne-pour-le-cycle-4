<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 690" width="770" height="690" style="width:100%;height:auto" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Algorigramme de la minuterie du climatiseur</title>
<desc id="d">Algorigramme de la minuterie. Début ; régler la durée ; test : la durée est-elle écoulée ? Si NON : continuer à rafraîchir la pièce, puis une flèche revient avant le test. Si OUI : arrêter le climatiseur ; fin.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a41"/></marker></defs>
<rect x="0" y="0" width="770" height="690" fill="#fbfaf6"/>
<text x="30" y="44" font-size="26" font-weight="700" text-anchor="start" fill="#1b2a41">La minuterie du climatiseur</text>
<ellipse cx="250" cy="100" rx="90" ry="30" fill="#e9f7ec" stroke="#1b2a41" stroke-width="2"/>
<text x="250" y="107" font-size="21" text-anchor="middle" fill="#1b2a41">Début</text>
<path d="M 250 130 L 250 166" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
<rect x="110" y="168" width="280" height="58" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="250.0" y="205.0" font-size="21" text-anchor="middle" fill="#1b2a41">Régler la durée</text>
<path d="M 250 226 L 250 284" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
<path d="M 250 286 L 410 366 L 250 446 L 90 366 Z" fill="#fff3d6" stroke="#1b2a41" stroke-width="2"/>
<text x="250" y="360" font-size="21" text-anchor="middle" fill="#1b2a41">La durée est-elle</text>
<text x="250" y="386" font-size="21" text-anchor="middle" fill="#1b2a41">écoulée ?</text>
<path d="M 410 366 L 488 366" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
<text x="449" y="352" font-size="19" font-weight="700" text-anchor="middle" fill="#1b2a41">NON</text>
<rect x="490" y="326" width="250" height="80" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="615.0" y="361.0" font-size="21" text-anchor="middle" fill="#1b2a41">Continuer à rafraîchir</text>
<text x="615.0" y="387.0" font-size="21" text-anchor="middle" fill="#1b2a41">la pièce</text>
<path d="M 615 326 L 615 256 L 264 256" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
<path d="M 250 446 L 250 508" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
<text x="262" y="484" font-size="19" font-weight="700" text-anchor="start" fill="#1b2a41">OUI</text>
<rect x="110" y="510" width="280" height="58" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="250.0" y="547.0" font-size="21" text-anchor="middle" fill="#1b2a41">Arrêter le climatiseur</text>
<path d="M 250 568 L 250 606" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
<ellipse cx="250" cy="638" rx="90" ry="30" fill="#e9f7ec" stroke="#1b2a41" stroke-width="2"/>
<text x="250" y="645" font-size="21" text-anchor="middle" fill="#1b2a41">Fin</text>
</svg>
