<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="tg dg"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="tg">Corrigé — le temps passé à chaque étape du retrait d'un vélo, sur 30 retraits</title>
  <desc id="dg">Graphique en barres du temps passé à chaque étape, avec pour chaque étape deux
  barres : la durée moyenne et la durée la plus longue observée. Étape arriver : 8 secondes en
  moyenne, 14 secondes au maximum. Étape identifier : 14 secondes en moyenne, 27 au maximum. Étape
  choisir : 40 secondes en moyenne, 62 au maximum — c'est la barre moyenne la plus haute. Étape
  déverrouiller : 29 secondes en moyenne, mais 83 secondes au maximum — c'est de loin le plus grand
  écart entre la moyenne et le pire cas, parce que 9 retraits sur 30 ont demandé une reprise. Étape
  partir : 13 secondes en moyenne, 23 au maximum. Un retrait complet dure 104 secondes en moyenne,
  et jusqu'à 168 secondes. Deux encadrés concluent. Le premier : l'étape la plus longue en moyenne
  est « choisir », et pourtant aucun usager ne s'en plaint vraiment ; c'est « déverrouiller » qui
  revient dans les verbatims. Le second : la moyenne de l'étape déverrouiller cache sa queue — pour
  neuf usagers sur trente, elle dure deux à trois fois plus longtemps, et c'est ce qui se raconte.
  Une moyenne décrit le milieu, pas ce qu'on subit.</desc>
  <rect width="900" height="470" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:12.5px}
    .lb{fill:#9bbefc;font-size:11.5px}
    .ax{stroke:#3f6bb5;stroke-width:1.5}
    .val{font-size:11.5px;font-weight:600}
  </style>
  <text x="26" y="30" font-size="17" font-weight="600">Corrigé — le temps passé à chaque étape (30 retraits)</text>
  <text class="lb" x="26" y="50">Barre pleine : la durée moyenne. Barre hachurée : la plus longue durée observée.</text>

  <!-- axes : 0 à 90 s sur 300 px de hauteur, base à y=350 -->
  <line class="ax" x1="96" y1="350" x2="866" y2="350"/>
  <line class="ax" x1="96" y1="80" x2="96" y2="350"/>
  <g stroke="#172c52" stroke-width="1">
    <line x1="96" y1="320" x2="866" y2="320"/><line x1="96" y1="260" x2="866" y2="260"/>
    <line x1="96" y1="200" x2="866" y2="200"/><line x1="96" y1="140" x2="866" y2="140"/>
    <line x1="96" y1="80"  x2="866" y2="80"/>
  </g>
  <text class="lb" x="60" y="354">0 s</text><text class="lb" x="54" y="324">10 s</text>
  <text class="lb" x="54" y="264">30 s</text><text class="lb" x="54" y="204">50 s</text>
  <text class="lb" x="54" y="144">70 s</text><text class="lb" x="54" y="84">90 s</text>

  <defs>
    <pattern id="hach" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#0d2347"/><line x1="0" y1="0" x2="0" y2="7" stroke="#61dafb" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- arriver : moy 8,2 → h=25 ; max 14 → h=42 -->
  <rect x="130" y="325" width="46" height="25" fill="#4fae7a"/>
  <rect x="180" y="308" width="46" height="42" fill="url(#hach)" stroke="#3f6bb5"/>
  <text class="val" x="134" y="318" fill="#81fba1">8 s</text>
  <text class="val" x="186" y="301" fill="#9bbefc">14 s</text>
  <text x="140" y="372">arriver</text>

  <!-- identifier : moy 14,2 → h=43 ; max 27 → h=81 -->
  <rect x="278" y="307" width="46" height="43" fill="#4fae7a"/>
  <rect x="328" y="269" width="46" height="81" fill="url(#hach)" stroke="#3f6bb5"/>
  <text class="val" x="280" y="300" fill="#81fba1">14 s</text>
  <text class="val" x="332" y="262" fill="#9bbefc">27 s</text>
  <text x="282" y="372">identifier</text>

  <!-- choisir : moy 39,8 → h=119 ; max 62 → h=186 -->
  <rect x="426" y="231" width="46" height="119" fill="#ffb454"/>
  <rect x="476" y="164" width="46" height="186" fill="url(#hach)" stroke="#3f6bb5"/>
  <text class="val" x="428" y="224" fill="#ffd08a">40 s</text>
  <text class="val" x="480" y="157" fill="#9bbefc">62 s</text>
  <text x="438" y="372">choisir</text>

  <!-- déverrouiller : moy 29,3 → h=88 ; max 83 → h=249 -->
  <rect x="574" y="262" width="46" height="88" fill="#ff7b88"/>
  <rect x="624" y="101" width="46" height="249" fill="url(#hach)" stroke="#ff7b88" stroke-width="2"/>
  <text class="val" x="576" y="255" fill="#ff9aa4">29 s</text>
  <text class="val" x="628" y="94" fill="#ff9aa4">83 s</text>
  <text x="570" y="372">déverrouiller</text>
  <text class="lb" x="566" y="390" fill="#ff9aa4">9 reprises sur 30</text>

  <!-- partir : moy 12,6 → h=38 ; max 23 → h=69 -->
  <rect x="722" y="312" width="46" height="38" fill="#4fae7a"/>
  <rect x="772" y="281" width="46" height="69" fill="url(#hach)" stroke="#3f6bb5"/>
  <text class="val" x="726" y="305" fill="#81fba1">13 s</text>
  <text class="val" x="776" y="274" fill="#9bbefc">23 s</text>
  <text x="736" y="372">partir</text>

  <text class="lb" x="96" y="410">Un retrait complet dure <tspan fill="#e4eaf5" font-weight="600">104 s en moyenne</tspan>, et jusqu'à <tspan fill="#ff9aa4" font-weight="600">168 s</tspan>.</text>

  <rect x="26" y="422" width="416" height="40" rx="8" fill="#2b1f0d" stroke="#ffb454" stroke-width="2"/>
  <text x="40" y="440" font-size="11.5" font-weight="600" fill="#ffd08a">La plus longue n'est pas celle dont on se plaint</text>
  <text x="40" y="456" font-size="11.5">«&#160;choisir&#160;» dure le plus — et personne n'en parle.</text>

  <rect x="458" y="422" width="416" height="40" rx="8" fill="#3a1218" stroke="#ff7b88" stroke-width="2"/>
  <text x="472" y="440" font-size="11.5" font-weight="600" fill="#ff9aa4">Une moyenne cache sa queue</text>
  <text x="472" y="456" font-size="11.5">Pour 9 usagers sur 30, «&#160;déverrouiller&#160;» triple.</text>
</svg>
