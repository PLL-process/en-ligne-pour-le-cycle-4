<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="ta da"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="ta">Corrigé — les trois autres modes appliqués au même constat</title>
  <desc id="da">Trois représentations supplémentaires du même constat sur la borne de tickets, pour
  les élèves qui ont choisi un autre mode. Première colonne, le parcours utilisateur : cinq étapes
  nommées — approcher, choisir la langue, choisir le titre, payer, récupérer — et sous chacune le
  nombre d'abandons observés sur quarante usagers : zéro, un, quatre, deux, un. L'étape choisir le
  titre concentre la moitié des abandons. Une note rappelle que ce mode situe le problème mais ne
  dit ni qui abandonne ni pourquoi. Deuxième colonne, la carte d'empathie de madame Liu,
  soixante-dix-huit ans. Ce qu'elle dit : il y a trop de boutons et ils changent de place selon
  l'écran. Ce qu'elle fait : elle recommence depuis le début, puis elle renonce et va au guichet.
  Ce qu'elle voit : un écran qui change d'organisation à chaque étape, et une file derrière elle.
  Ce qu'elle ressent : la perte de ses repères, et la gêne d'être vue en train d'échouer. Une note
  rappelle que ce mode restitue ce qui n'est pas dit — la file derrière elle n'apparaît dans aucun
  chiffre — mais qu'il ne se mesure pas. Troisième colonne, le tableau comparatif croisant quatre
  pistes d'amélioration et trois critères : coût, effet sur le taux d'abandon, et délai. Garder les
  boutons à la même place à chaque écran : coût faible, effet fort sur les personnes âgées, délai
  court. Ajouter un plan des zones en images : coût moyen, effet fort sur les touristes, délai
  moyen. Refuser le paiement quand le papier manque : coût faible, effet nul sur l'abandon mais
  supprime la pire panne, délai court. Remplacer toutes les bornes : coût très élevé, effet
  incertain, délai long. Une note rappelle que ce mode est le seul qui permette d'arbitrer, mais
  qu'il se lit lentement. Une bande de conclusion rappelle que ces six modes disent tous la vérité,
  qu'aucun ne la dit tout entière, et que c'est pour cela qu'on en choisit un en connaissance de
  cause.</desc>
  <rect width="900" height="560" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:11.5px}
    .ti{font-size:13.5px;font-weight:600}
    .lb{fill:#9bbefc;font-size:11px}
    .no{fill:#ff9aa4;font-size:10.5px}
    .bx{fill:#0b1b39;stroke:#3f6bb5;stroke-width:1.5}
  </style>
  <text x="26" y="28" font-size="17" font-weight="600">Corrigé — les trois autres modes, sur le même constat</text>
  <text class="lb" x="26" y="47">Tu as choisi un mode qui n'était pas dans la fiche précédente&#160;? Il est ici. Aucun des six n'est un mauvais choix.</text>

  <!-- ══ colonne 1 : parcours utilisateur ══ -->
  <rect x="26" y="60" width="272" height="416" rx="12" fill="#08132c" stroke="#3f6bb5" stroke-width="2"/>
  <text class="ti" x="42" y="86" fill="#8fb6ff">Le parcours utilisateur</text>
  <text class="lb" x="42" y="104">cinq étapes, et les abandons</text>

  <rect class="bx" x="42" y="126" width="240" height="34" rx="5"/>
  <text x="54" y="147">1. approcher</text><text x="228" y="147" fill="#81fba1">0 abandon</text>
  <rect class="bx" x="42" y="170" width="240" height="34" rx="5"/>
  <text x="54" y="191">2. choisir la langue</text><text x="228" y="191" fill="#81fba1">1</text>
  <rect x="42" y="214" width="240" height="34" rx="5" fill="#3a1218" stroke="#ff7b88" stroke-width="2"/>
  <text x="54" y="235">3. choisir le titre</text><text x="222" y="235" fill="#ff9aa4" font-weight="600">4</text>
  <rect class="bx" x="42" y="258" width="240" height="34" rx="5"/>
  <text x="54" y="279">4. payer</text><text x="228" y="279" fill="#ffd08a">2</text>
  <rect class="bx" x="42" y="302" width="240" height="34" rx="5"/>
  <text x="54" y="323">5. récupérer</text><text x="228" y="323" fill="#81fba1">1</text>

  <text x="42" y="360" font-weight="600" fill="#ff9aa4">L'étape 3 concentre la moitié</text>
  <text x="42" y="378" font-weight="600" fill="#ff9aa4">des abandons.</text>
  <rect x="42" y="394" width="240" height="70" rx="8" fill="#2b1f0d" stroke="#ffb454" stroke-width="1.5"/>
  <text x="52" y="416" font-size="11" font-weight="600" fill="#ffd08a">Son angle mort</text>
  <text class="no" x="52" y="436">Il situe le problème, mais il ne dit</text>
  <text class="no" x="52" y="453">ni QUI abandonne, ni pourquoi.</text>

  <!-- ══ colonne 2 : carte d'empathie ══ -->
  <rect x="314" y="60" width="272" height="416" rx="12" fill="#08132c" stroke="#a077d8" stroke-width="2"/>
  <text class="ti" x="330" y="86" fill="#c68ef2">La carte d'empathie</text>
  <text class="lb" x="330" y="104">Mme Liu, 78 ans (V2)</text>

  <rect x="330" y="120" width="118" height="86" rx="6" fill="#2b1a3f" stroke="#a077d8"/>
  <text x="340" y="140" font-size="11" font-weight="600" fill="#c68ef2">Elle DIT</text>
  <text x="340" y="160" font-size="10">«&#160;trop de boutons,</text>
  <text x="340" y="176" font-size="10">et ils changent</text>
  <text x="340" y="192" font-size="10">de place&#160;»</text>

  <rect x="454" y="120" width="118" height="86" rx="6" fill="#2b1a3f" stroke="#a077d8"/>
  <text x="464" y="140" font-size="11" font-weight="600" fill="#c68ef2">Elle FAIT</text>
  <text x="464" y="160" font-size="10">elle recommence</text>
  <text x="464" y="176" font-size="10">au début, puis va</text>
  <text x="464" y="192" font-size="10">au guichet</text>

  <rect x="330" y="214" width="118" height="86" rx="6" fill="#2b1a3f" stroke="#a077d8"/>
  <text x="340" y="234" font-size="11" font-weight="600" fill="#c68ef2">Elle VOIT</text>
  <text x="340" y="254" font-size="10">un écran qui se</text>
  <text x="340" y="270" font-size="10">réorganise, et une</text>
  <text x="340" y="286" font-size="10">file derrière elle</text>

  <rect x="454" y="214" width="118" height="86" rx="6" fill="#2b1a3f" stroke="#a077d8"/>
  <text x="464" y="234" font-size="11" font-weight="600" fill="#c68ef2">Elle RESSENT</text>
  <text x="464" y="254" font-size="10">la perte de ses</text>
  <text x="464" y="270" font-size="10">repères, et la gêne</text>
  <text x="464" y="286" font-size="10">d'être vue</text>

  <text x="330" y="332" font-weight="600" fill="#c68ef2">La file derrière elle n'apparaît</text>
  <text x="330" y="350" font-weight="600" fill="#c68ef2">dans aucun chiffre.</text>
  <rect x="330" y="366" width="240" height="98" rx="8" fill="#2b1f0d" stroke="#ffb454" stroke-width="1.5"/>
  <text x="340" y="388" font-size="11" font-weight="600" fill="#ffd08a">Son angle mort</text>
  <text class="no" x="340" y="408">Il ne se mesure pas : deux</text>
  <text class="no" x="340" y="425">observateurs rempliront la carte</text>
  <text class="no" x="340" y="442">différemment. C'est le prix à payer</text>
  <text class="no" x="340" y="458">pour capter ce qui n'est pas dit.</text>

  <!-- ══ colonne 3 : tableau comparatif ══ -->
  <rect x="602" y="60" width="272" height="416" rx="12" fill="#08132c" stroke="#4fae7a" stroke-width="2"/>
  <text class="ti" x="618" y="86" fill="#81fba1">Le tableau comparatif</text>
  <text class="lb" x="618" y="104">quatre pistes, trois critères</text>

  <rect x="618" y="118" width="240" height="26" fill="#122a52" stroke="#3f6bb5"/>
  <text x="624" y="136" font-size="10" fill="#9bbefc">piste</text>
  <text x="742" y="136" font-size="10" fill="#9bbefc">coût</text>
  <text x="784" y="136" font-size="10" fill="#9bbefc">effet</text>
  <text x="826" y="136" font-size="10" fill="#9bbefc">délai</text>

  <rect x="618" y="144" width="240" height="46" fill="#0d3320" stroke="#25406e"/>
  <text x="624" y="162" font-size="10">boutons à la même</text><text x="624" y="177" font-size="10">place partout</text>
  <text x="742" y="170" font-size="10" fill="#81fba1">faible</text>
  <text x="784" y="170" font-size="10" fill="#81fba1">fort</text>
  <text x="826" y="170" font-size="10" fill="#81fba1">court</text>

  <rect x="618" y="190" width="240" height="46" fill="#0d3320" stroke="#25406e"/>
  <text x="624" y="208" font-size="10">plan des zones</text><text x="624" y="223" font-size="10">en images</text>
  <text x="742" y="216" font-size="10" fill="#ffd08a">moyen</text>
  <text x="784" y="216" font-size="10" fill="#81fba1">fort</text>
  <text x="826" y="216" font-size="10" fill="#ffd08a">moyen</text>

  <rect x="618" y="236" width="240" height="46" fill="#0b1b39" stroke="#25406e"/>
  <text x="624" y="254" font-size="10">refuser le paiement</text><text x="624" y="269" font-size="10">si le papier manque</text>
  <text x="742" y="262" font-size="10" fill="#81fba1">faible</text>
  <text x="784" y="262" font-size="10" fill="#9bbefc">nul*</text>
  <text x="826" y="262" font-size="10" fill="#81fba1">court</text>

  <rect x="618" y="282" width="240" height="46" fill="#3a1218" stroke="#25406e"/>
  <text x="624" y="300" font-size="10">remplacer toutes</text><text x="624" y="315" font-size="10">les bornes</text>
  <text x="742" y="308" font-size="10" fill="#ff9aa4">très élevé</text>
  <text x="784" y="308" font-size="10" fill="#ff9aa4">?</text>
  <text x="826" y="308" font-size="10" fill="#ff9aa4">long</text>

  <text class="lb" x="618" y="348">* nul sur l'abandon — mais supprime</text>
  <text class="lb" x="618" y="364">la pire panne : payer sans titre.</text>

  <rect x="618" y="378" width="240" height="86" rx="8" fill="#2b1f0d" stroke="#ffb454" stroke-width="1.5"/>
  <text x="628" y="400" font-size="11" font-weight="600" fill="#ffd08a">Son angle mort</text>
  <text class="no" x="628" y="420">C'est le seul mode qui permette</text>
  <text class="no" x="628" y="437">d'ARBITRER — et le seul qu'un</text>
  <text class="no" x="628" y="454">lecteur pressé n'ouvrira jamais.</text>

  <rect x="26" y="490" width="848" height="56" rx="10" fill="#122a52" stroke="#3f6bb5" stroke-width="2"/>
  <text x="42" y="514" font-size="14" font-weight="600" fill="#8fb6ff">Les six modes disent tous la vérité</text>
  <text x="42" y="536">Aucun ne la dit <tspan font-weight="600">tout entière</tspan> — et c'est pour cela qu'on en choisit un <tspan font-weight="600">en connaissance de cause</tspan>.</text>
</svg>
