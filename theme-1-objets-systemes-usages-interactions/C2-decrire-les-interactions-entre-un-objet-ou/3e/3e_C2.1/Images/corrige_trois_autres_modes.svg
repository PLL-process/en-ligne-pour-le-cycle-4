<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="ta da"
     font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#e4eaf5">
  <title id="ta">Corrigé — les trois autres modes appliqués au même constat</title>
  <desc id="da">Trois représentations supplémentaires du même constat sur la borne de tickets, pour
  les élèves qui ont choisi un autre mode. Première colonne, le parcours utilisateur : cinq étapes
  nommées — approcher, choisir la langue, choisir le titre, payer, récupérer — et sous chacune le
  nombre d'abandons observés sur quarante usagers : zéro, un, quatre, deux, un. L'étape choisir le
  titre concentre la moitié des abandons. Une note rappelle que ce mode situe le problème mais ne
  dit ni qui abandonne ni pourquoi. Deuxième colonne, la carte d'empathie de madame Liu,
  soixante-dix-huit ans. Ce qu'elle dit : il y a trop de boutons et ils changent de place selon
  l'écran. Ce qu'elle fait : elle recommence depuis le début, puis elle renonce et va au guichet.
  Ce qu'elle voit : un écran qui change d'organisation à chaque étape, et une file derrière elle.
  Ce qu'elle ressent : la perte de ses repères, et la gêne d'être vue en train d'échouer. Une note
  rappelle que ce mode restitue ce qui n'est pas dit — la file derrière elle n'apparaît dans aucun
  chiffre — mais qu'il ne se mesure pas. Troisième colonne, le tableau comparatif croisant quatre
  pistes d'amélioration et trois critères : coût, effet sur le taux d'abandon, et délai. Garder les
  boutons à la même place à chaque écran : coût faible, effet fort sur les personnes âgées, délai
  court. Ajouter un plan des zones en images : coût moyen, effet fort sur les touristes, délai
  moyen. Refuser le paiement quand le papier manque : coût faible, effet nul sur l'abandon mais
  supprime la pire panne, délai court. Remplacer toutes les bornes : coût très élevé, effet
  incertain, délai long. Dans le tableau, le coût se lit en symboles euro : un pour faible, deux pour
  moyen, quatre pour très élevé. Une note rappelle que ce mode est le seul qui permette d'arbitrer, mais
  qu'il se lit lentement. Une bande de conclusion rappelle que ces six modes disent tous la vérité,
  qu'aucun ne la dit tout entière, et que c'est pour cela qu'on en choisit un en connaissance de
  cause.</desc>
  <rect width="900" height="620" fill="#050f24"/>
  <style>
    .ti{font-size:14px;font-weight:600}
    .lb{font-size:11.5px}
    text.lb:not([fill]){fill:#9bbefc}
    .no{fill:#ff9aa4}
    .bx{fill:#0b1b39;stroke:#3f6bb5;stroke-width:1.5}
    .c{text-anchor:middle}
    .e{text-anchor:end}
  </style>
  <text x="26" y="28" font-size="17" font-weight="600">Corrigé — les trois autres modes, sur le même constat</text>
  <text class="lb" x="26" y="47">Tu as choisi un mode qui n'était pas dans la fiche précédente&#160;? Il est ici. Aucun des six n'est un mauvais choix.</text>
  <!-- ══ colonne 1 : parcours utilisateur ══ -->
  <rect x="26" y="60" width="272" height="472" rx="12" fill="#08132c" stroke="#3f6bb5" stroke-width="2"/>
  <text class="ti" x="42" y="86" fill="#8fb6ff">Le parcours utilisateur</text>
  <text class="lb" x="42" y="104">5 étapes · abandons sur 40 usagers</text>
  <rect class="bx" x="42" y="122" width="240" height="34" rx="5"/>
  <text x="54" y="143">1. approcher</text><text class="e" x="270" y="143" fill="#81fba1">0 abandon</text>
  <rect class="bx" x="42" y="168" width="240" height="34" rx="5"/>
  <text x="54" y="189">2. choisir la langue</text><text class="e" x="270" y="189" fill="#81fba1">1 abandon</text>
  <rect x="42" y="214" width="240" height="34" rx="5" fill="#3a1218" stroke="#ff7b88" stroke-width="2"/>
  <text x="54" y="235" font-weight="600">3. choisir le titre</text><text class="e" x="270" y="235" fill="#ff9aa4" font-weight="600">4 abandons</text>
  <rect class="bx" x="42" y="260" width="240" height="34" rx="5"/>
  <text x="54" y="281">4. payer</text><text class="e" x="270" y="281" fill="#ffd08a">2 abandons</text>
  <rect class="bx" x="42" y="306" width="240" height="34" rx="5"/>
  <text x="54" y="327">5. récupérer</text><text class="e" x="270" y="327" fill="#81fba1">1 abandon</text>
  <text x="42" y="368" font-weight="600" fill="#ff9aa4">L'étape 3 concentre la moitié</text>
  <text x="42" y="386" font-weight="600" fill="#ff9aa4">des abandons&#160;: 4 sur 8.</text>
  <rect x="42" y="404" width="240" height="112" rx="8" fill="#2b1f0d" stroke="#ffb454" stroke-width="1.5"/>
  <text x="54" y="428" font-size="12" font-weight="600" fill="#ffd08a">Son angle mort</text>
  <text class="no" x="54" y="450">Il montre où ça bloque, mais il ne</text>
  <text class="no" x="54" y="467">dit ni QUI abandonne, ni pourquoi.</text>
  <!-- ══ colonne 2 : carte d'empathie ══ -->
  <rect x="314" y="60" width="272" height="472" rx="12" fill="#08132c" stroke="#a077d8" stroke-width="2"/>
  <text class="ti" x="330" y="86" fill="#c68ef2">La carte d'empathie</text>
  <text class="lb" x="330" y="104">Mme Liu, 78 ans (V2)</text>
  <rect x="330" y="118" width="114" height="100" rx="6" fill="#2b1a3f" stroke="#a077d8"/>
  <text x="340" y="138" font-size="12" font-weight="600" fill="#c68ef2">Elle DIT</text>
  <text x="340" y="158">«&#160;trop de</text>
  <text x="340" y="173">boutons, et ils</text>
  <text x="340" y="188">changent de</text>
  <text x="340" y="203">place&#160;»</text>
  <rect x="456" y="118" width="114" height="100" rx="6" fill="#2b1a3f" stroke="#a077d8"/>
  <text x="466" y="138" font-size="12" font-weight="600" fill="#c68ef2">Elle FAIT</text>
  <text x="466" y="158">elle recommence</text>
  <text x="466" y="173">au début, puis</text>
  <text x="466" y="188">va au guichet</text>
  <rect x="330" y="230" width="114" height="100" rx="6" fill="#2b1a3f" stroke="#a077d8"/>
  <text x="340" y="250" font-size="12" font-weight="600" fill="#c68ef2">Elle VOIT</text>
  <text x="340" y="270">un écran qui</text>
  <text x="340" y="285">se réorganise,</text>
  <text x="340" y="300">et une file</text>
  <text x="340" y="315">derrière elle</text>
  <rect x="456" y="230" width="114" height="100" rx="6" fill="#2b1a3f" stroke="#a077d8"/>
  <text x="466" y="250" font-size="12" font-weight="600" fill="#c68ef2">Elle RESSENT</text>
  <text x="466" y="270">la perte de</text>
  <text x="466" y="285">ses repères, et</text>
  <text x="466" y="300">la gêne d'être</text>
  <text x="466" y="315">vue</text>
  <text x="330" y="358" font-weight="600" fill="#c68ef2">La file derrière elle n'apparaît</text>
  <text x="330" y="376" font-weight="600" fill="#c68ef2">dans aucun chiffre.</text>
  <rect x="330" y="404" width="240" height="112" rx="8" fill="#2b1f0d" stroke="#ffb454" stroke-width="1.5"/>
  <text x="342" y="428" font-size="12" font-weight="600" fill="#ffd08a">Son angle mort</text>
  <text class="no" x="342" y="450">On ne peut pas le mesurer&#160;: deux</text>
  <text class="no" x="342" y="467">personnes rempliraient la carte</text>
  <text class="no" x="342" y="484">autrement. Mais lui seul montre</text>
  <text class="no" x="342" y="501">ce que personne ne dit.</text>
  <!-- ══ colonne 3 : tableau comparatif ══ -->
  <rect x="602" y="60" width="272" height="472" rx="12" fill="#08132c" stroke="#4fae7a" stroke-width="2"/>
  <text class="ti" x="618" y="86" fill="#81fba1">Le tableau comparatif</text>
  <text class="lb" x="618" y="104">quatre pistes, trois critères</text>
  <rect x="614" y="118" width="248" height="26" fill="#122a52" stroke="#3f6bb5"/>
  <text x="620" y="136" fill="#9bbefc">piste</text>
  <text class="c" x="750" y="136" fill="#9bbefc">coût</text>
  <text class="c" x="793" y="136" fill="#9bbefc">effet</text>
  <text class="c" x="836" y="136" fill="#9bbefc">délai</text>
  <rect x="614" y="144" width="248" height="46" fill="#0d3320" stroke="#25406e"/>
  <text x="620" y="163">boutons à la même</text><text x="620" y="179">place partout</text>
  <text class="c" x="750" y="171" fill="#81fba1" font-weight="600">€</text>
  <text class="c" x="793" y="171" fill="#81fba1" font-weight="600">fort</text>
  <text class="c" x="836" y="171" fill="#81fba1" font-weight="600">court</text>
  <rect x="614" y="190" width="248" height="46" fill="#0d3320" stroke="#25406e"/>
  <text x="620" y="209">plan des zones</text><text x="620" y="225">en images</text>
  <text class="c" x="750" y="217" fill="#ffd08a" font-weight="600">€€</text>
  <text class="c" x="793" y="217" fill="#81fba1" font-weight="600">fort</text>
  <text class="c" x="836" y="217" fill="#ffd08a" font-weight="600">moyen</text>
  <rect x="614" y="236" width="248" height="46" fill="#0b1b39" stroke="#25406e"/>
  <text x="620" y="255">ne pas encaisser</text><text x="620" y="271">sans papier</text>
  <text class="c" x="750" y="263" fill="#81fba1" font-weight="600">€</text>
  <text class="c" x="793" y="263" fill="#9bbefc" font-weight="600">nul*</text>
  <text class="c" x="836" y="263" fill="#81fba1" font-weight="600">court</text>
  <rect x="614" y="282" width="248" height="46" fill="#3a1218" stroke="#25406e"/>
  <text x="620" y="301">remplacer toutes</text><text x="620" y="317">les bornes</text>
  <text class="c" x="750" y="309" fill="#ff9aa4" font-weight="600">€€€€</text>
  <text class="c" x="793" y="309" fill="#ff9aa4" font-weight="600">?</text>
  <text class="c" x="836" y="309" fill="#ff9aa4" font-weight="600">long</text>
  <text class="lb" x="618" y="350">€ peu cher · €€€€ très cher</text>
  <text class="lb" x="618" y="368">* nul sur l'abandon — mais il supprime</text>
  <text class="lb" x="618" y="384">la pire panne&#160;: payer sans titre.</text>
  <rect x="618" y="404" width="240" height="112" rx="8" fill="#2b1f0d" stroke="#ffb454" stroke-width="1.5"/>
  <text x="630" y="428" font-size="12" font-weight="600" fill="#ffd08a">Son angle mort</text>
  <text class="no" x="630" y="450">C'est le seul mode qui permette de</text>
  <text class="no" x="630" y="467">CHOISIR entre les pistes — et le</text>
  <text class="no" x="630" y="484">seul qu'un lecteur pressé ne lira</text>
  <text class="no" x="630" y="501">jamais.</text>
  <rect x="26" y="548" width="848" height="58" rx="10" fill="#122a52" stroke="#3f6bb5" stroke-width="2"/>
  <text x="42" y="572" font-size="14" font-weight="600" fill="#8fb6ff">Les six modes disent tous la vérité</text>
  <text x="42" y="594" font-size="12">Aucun ne la dit <tspan font-weight="600">tout entière</tspan> — c'est pour cela qu'on choisit le mode selon <tspan font-weight="600">ce qu'on veut montrer, et à qui</tspan>.</text>
</svg>
