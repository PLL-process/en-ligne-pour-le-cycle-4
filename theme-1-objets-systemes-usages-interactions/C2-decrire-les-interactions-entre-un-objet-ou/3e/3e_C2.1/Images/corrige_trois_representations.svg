<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="tc dc"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="tc">Corrigé — le même constat rendu de trois façons, une par destinataire</title>
  <desc id="dc">Trois représentations du même constat sur la borne de tickets de Pékin, chacune
  destinée à une personne différente. Première colonne, pour le technicien : un algorigramme. Début,
  l'usager choisit son titre ; action, la borne encaisse ; test, reste-t-il plus de huit pour cent de
  papier ? si oui, imprimer le titre et fin réussie ; si non, refuser le paiement AVANT d'encaisser,
  afficher borne indisponible et alerter la maintenance. Une note précise que l'ordre est le
  correctif : aujourd'hui la borne encaisse puis échoue à imprimer, et l'usager a payé sans titre.
  Deuxième colonne, pour l'élue : un graphique en barres du taux d'abandon par profil d'usager.
  Habitués zéro pour cent, occasionnels onze pour cent, usagers avec poussette vingt-cinq pour cent,
  touristes quarante-trois pour cent, personnes âgées cinquante pour cent. Une phrase unique
  conclut : un usager sur cinq abandonne, mais aucun habitué — ce sont toujours les mêmes qui
  renoncent. Troisième colonne, pour l'usager dans la station : un storyboard de trois vignettes
  sans texte ou presque. Première vignette, une main tient un téléphone devant un code à scanner.
  Deuxième vignette, une flèche indique la borne d'à côté, réservée aux paiements en espèces.
  Troisième vignette, un visage souriant passe le portique. Une bande de conclusion rappelle que le
  fait est le même dans les trois colonnes, que seule la forme change, et que c'est le destinataire
  qui l'a décidée.</desc>
  <rect width="900" height="560" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:11.5px}
    .ti{font-size:13.5px;font-weight:600}
    .lb{fill:#9bbefc;font-size:11px}
    .bx{fill:#0b1b39;stroke:#3f6bb5;stroke-width:1.5}
    .ts{fill:#2b1f0d;stroke:#ffb454;stroke-width:1.5}
    .fl{stroke:#61dafb;stroke-width:1.6;fill:none;marker-end:url(#fc)}
  </style>
  <defs><marker id="fc" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 9 3, 0 6" fill="#61dafb"/></marker></defs>
  <text x="26" y="28" font-size="17" font-weight="600">Corrigé — le même constat, trois fois</text>
  <text class="lb" x="26" y="47">Le fait ne change pas d'une colonne à l'autre. Seule sa forme change, et c'est le destinataire qui l'a décidée.</text>

  <!-- ══ colonne 1 : algorigramme, pour le technicien ══ -->
  <rect x="26" y="60" width="272" height="416" rx="12" fill="#08132c" stroke="#3f6bb5" stroke-width="2"/>
  <text class="ti" x="42" y="86" fill="#8fb6ff">🔧 Pour le technicien</text>
  <text class="lb" x="42" y="104">un algorigramme</text>

  <ellipse cx="162" cy="132" rx="76" ry="15" class="bx"/>
  <text x="112" y="136" font-size="10.5">l'usager choisit</text>
  <rect class="bx" x="86" y="158" width="152" height="30" rx="4"/>
  <text x="98" y="177" font-size="10.5">la borne encaisse</text>
  <path class="fl" d="M162 147 V 156"/>

  <path d="M162 202 L 244 232 L 162 262 L 80 232 Z" fill="#122a52" stroke="#61dafb" stroke-width="1.5"/>
  <text x="106" y="228" font-size="10">papier &gt; 8 %</text>
  <text x="150" y="244" font-size="10">?</text>
  <path class="fl" d="M162 188 V 200"/>
  <text class="lb" x="248" y="236">oui</text>
  <text class="lb" x="58" y="236">non</text>

  <rect class="bx" x="150" y="286" width="130" height="28" rx="4"/>
  <text x="160" y="304" font-size="10.5">imprimer le titre</text>
  <path class="fl" d="M244 232 H 262 V 284"/>
  <ellipse cx="215" cy="342" rx="60" ry="14" fill="#0d3320" stroke="#4fae7a" stroke-width="1.5"/>
  <text x="180" y="346" font-size="10.5" fill="#81fba1">fin : réussite</text>
  <path class="fl" d="M215 314 V 326"/>

  <rect class="ts" x="42" y="286" width="98" height="46" rx="4"/>
  <text x="50" y="303" font-size="9.5" fill="#ffd08a">refuser AVANT</text>
  <text x="50" y="317" font-size="9.5" fill="#ffd08a">d'encaisser +</text>
  <text x="50" y="329" font-size="9.5" fill="#ffd08a">alerter</text>
  <path class="fl" d="M80 232 H 62 V 284"/>

  <rect x="42" y="352" width="240" height="112" rx="8" fill="#2b1f0d" stroke="#ffb454" stroke-width="1.5"/>
  <text x="52" y="374" font-size="11" font-weight="600" fill="#ffd08a">L'ordre EST le correctif</text>
  <text x="52" y="394" font-size="10.5">Aujourd'hui la borne encaisse,</text>
  <text x="52" y="410" font-size="10.5">PUIS échoue à imprimer :</text>
  <text x="52" y="426" font-size="10.5">l'usager a payé et n'a rien.</text>
  <text x="52" y="448" font-size="10.5" fill="#ffd08a">Incident I1 — 3 fois en 30 jours</text>

  <!-- ══ colonne 2 : graphique, pour l'élue ══ -->
  <rect x="314" y="60" width="272" height="416" rx="12" fill="#08132c" stroke="#a077d8" stroke-width="2"/>
  <text class="ti" x="330" y="86" fill="#c68ef2">🏛 Pour l'élue</text>
  <text class="lb" x="330" y="104">un graphique, et une phrase</text>

  <line x1="410" y1="330" x2="566" y2="330" stroke="#9bbefc"/>
  <line x1="410" y1="140" x2="410" y2="330" stroke="#9bbefc"/>
  <text class="lb" x="378" y="144">50 %</text>
  <text class="lb" x="378" y="240">25 %</text>
  <text class="lb" x="386" y="334">0 %</text>

  <rect x="420" y="330" width="22" height="0" fill="#4fae7a"/>
  <line x1="420" y1="330" x2="442" y2="330" stroke="#4fae7a" stroke-width="3"/>
  <text x="418" y="348" font-size="9.5" fill="#81fba1">habitués</text>
  <text x="422" y="324" font-size="10" font-weight="600" fill="#81fba1">0 %</text>

  <rect x="450" y="288" width="22" height="42" fill="#4fae7a"/>
  <text x="444" y="348" font-size="9.5">occas.</text>
  <text x="450" y="282" font-size="10" font-weight="600">11 %</text>

  <rect x="480" y="235" width="22" height="95" fill="#ffb454"/>
  <text x="472" y="348" font-size="9.5">poussette</text>
  <text x="480" y="229" font-size="10" font-weight="600" fill="#ffd08a">25 %</text>

  <rect x="510" y="167" width="22" height="163" fill="#ff7b88"/>
  <text x="504" y="348" font-size="9.5">touristes</text>
  <text x="508" y="161" font-size="10" font-weight="600" fill="#ff9aa4">43 %</text>

  <rect x="540" y="140" width="22" height="190" fill="#ff7b88"/>
  <text x="534" y="348" font-size="9.5">âgées</text>
  <text x="538" y="134" font-size="10" font-weight="600" fill="#ff9aa4">50 %</text>

  <rect x="330" y="368" width="240" height="96" rx="8" fill="#2b1a3f" stroke="#a077d8" stroke-width="1.5"/>
  <text x="340" y="390" font-size="11" font-weight="600" fill="#c68ef2">La phrase, et rien d'autre</text>
  <text x="340" y="412" font-size="10.5">Un usager sur cinq abandonne —</text>
  <text x="340" y="428" font-size="10.5" font-weight="600">mais aucun habitué.</text>
  <text x="340" y="450" font-size="10.5">Ce sont toujours les mêmes qui renoncent.</text>

  <!-- ══ colonne 3 : storyboard, pour l'usager ══ -->
  <rect x="602" y="60" width="272" height="416" rx="12" fill="#08132c" stroke="#4fae7a" stroke-width="2"/>
  <text class="ti" x="618" y="86" fill="#81fba1">🚶 Pour l'usager</text>
  <text class="lb" x="618" y="104">un storyboard, presque sans mots</text>

  <rect x="618" y="120" width="240" height="100" rx="8" fill="#0b1b39" stroke="#4fae7a"/>
  <rect x="700" y="140" width="34" height="58" rx="5" fill="#122a52" stroke="#9bbefc"/>
  <rect x="748" y="146" width="40" height="40" fill="#e4eaf5"/>
  <rect x="754" y="152" width="10" height="10" fill="#050f24"/>
  <rect x="772" y="152" width="10" height="10" fill="#050f24"/>
  <rect x="754" y="170" width="10" height="10" fill="#050f24"/>
  <text x="630" y="212" font-size="11" font-weight="600" fill="#81fba1">1. Téléphone → code</text>

  <rect x="618" y="230" width="240" height="100" rx="8" fill="#0b1b39" stroke="#4fae7a"/>
  <rect x="646" y="248" width="46" height="62" rx="5" fill="#122a52" stroke="#9bbefc"/>
  <path d="M706 280 H 774" stroke="#ffb454" stroke-width="3" marker-end="url(#fc)"/>
  <rect x="786" y="248" width="46" height="62" rx="5" fill="#2b1f0d" stroke="#ffb454"/>
  <text x="792" y="284" font-size="16" fill="#ffd08a">¥</text>
  <text x="630" y="322" font-size="11" font-weight="600" fill="#ffd08a">2. Espèces → borne d'à côté</text>

  <rect x="618" y="340" width="240" height="100" rx="8" fill="#0b1b39" stroke="#4fae7a"/>
  <circle cx="700" cy="378" r="18" fill="#122a52" stroke="#81fba1" stroke-width="1.5"/>
  <circle cx="694" cy="374" r="2" fill="#81fba1"/><circle cx="706" cy="374" r="2" fill="#81fba1"/>
  <path d="M692 384 Q 700 391 708 384" stroke="#81fba1" stroke-width="1.5" fill="none"/>
  <rect x="746" y="352" width="12" height="52" fill="#122a52" stroke="#9bbefc"/>
  <rect x="790" y="352" width="12" height="52" fill="#122a52" stroke="#9bbefc"/>
  <path d="M724 378 H 742" stroke="#81fba1" stroke-width="2.5" marker-end="url(#fc)"/>
  <text x="630" y="432" font-size="11" font-weight="600" fill="#81fba1">3. Passage</text>

  <text class="lb" x="618" y="462">Trois secondes de lecture. Pas une de plus.</text>

  <rect x="26" y="490" width="848" height="56" rx="10" fill="#122a52" stroke="#3f6bb5" stroke-width="2"/>
  <text x="42" y="514" font-size="14" font-weight="600" fill="#8fb6ff">Le fait est le même dans les trois colonnes</text>
  <text x="42" y="536">Seule la <tspan font-weight="600">forme</tspan> change — et ce n'est pas le goût qui l'a choisie, c'est le <tspan font-weight="600">destinataire</tspan>.</text>
</svg>
