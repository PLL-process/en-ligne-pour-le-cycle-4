<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" role="img" aria-labelledby="tc dc"
     font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#e4eaf5">
  <title id="tc">Corrigé — le même constat rendu de trois façons, une par destinataire</title>
  <desc id="dc">Trois représentations du même constat sur la borne de tickets de Pékin, chacune
  destinée à une personne différente. Première colonne, pour le technicien : un algorigramme. Début,
  l'usager a choisi son titre. Test : reste-t-il plus de huit pour cent de papier ? Si non, la borne
  affiche borne indisponible et alerte la maintenance, sans avoir encaissé. Si oui, elle encaisse.
  Test : le paiement a-t-il abouti ? Si non, elle rend l'argent et l'usager choisit à nouveau. Si oui,
  elle imprime le titre : fin, réussite. Une note précise que l'ordre est le correctif : aujourd'hui la
  borne encaisse puis échoue à imprimer, et l'usager a payé sans titre. Deuxième colonne, pour l'élue :
  un graphique en barres horizontales du taux d'abandon par profil d'usager. Habitués zéro pour cent,
  occasionnels onze pour cent, usagers avec poussette vingt-cinq pour cent, touristes quarante-trois
  pour cent, personnes âgées cinquante pour cent. Une phrase unique conclut : un usager sur cinq
  abandonne, mais aucun habitué — ce sont toujours les mêmes qui renoncent. Troisième colonne, pour
  l'usager dans la station : un storyboard de trois vignettes presque sans texte. Première vignette, un
  téléphone devant un code à scanner. Deuxième vignette, une flèche vers la borne d'à côté, réservée
  aux paiements en espèces. Troisième vignette, un visage souriant passe le portique. Une bande de
  conclusion rappelle que le fait est le même dans les trois colonnes, que seule la forme change, et
  que c'est le destinataire qui l'a décidée.</desc>
  <rect width="900" height="646" fill="#050f24"/>
  <style>
    .ti{font-size:14px;font-weight:600}
    .lb{font-size:11.5px}
    text.lb:not([fill]){fill:#9bbefc}
    .bx{fill:#0b1b39;stroke:#3f6bb5;stroke-width:1.5}
    .ts{fill:#2b1f0d;stroke:#ffb454;stroke-width:1.5}
    .fl{stroke:#61dafb;stroke-width:1.6;fill:none;marker-end:url(#fc)}
    .c{text-anchor:middle}
  </style>
  <defs><marker id="fc" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 9">
    <polygon points="0 0, 9 3, 0 6" fill="#61dafb"/></marker>
<marker id="fc_3" markerWidth="24" markerHeight="24" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 9">
    <polygon points="0 0, 9 3, 0 6" fill="#61dafb"/></marker>
<marker id="fc_2p5" markerWidth="12" markerHeight="12" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 9">
    <polygon points="0 0, 9 3, 0 6" fill="#61dafb"/></marker></defs>
  <text x="26" y="28" font-size="17" font-weight="600">Corrigé — le même constat, trois fois</text>
  <text class="lb" x="26" y="47">Le fait ne change pas d'une colonne à l'autre. Seule sa forme change, et c'est le destinataire qui l'a décidée.</text>
  <!-- ══ colonne 1 : algorigramme, pour le technicien ══ -->
  <rect x="26" y="60" width="272" height="492" rx="12" fill="#08132c" stroke="#3f6bb5" stroke-width="2"/>
  <text class="ti" x="42" y="86" fill="#8fb6ff">🔧 Pour le technicien</text>
  <text class="lb" x="42" y="104">un algorigramme</text>
  <ellipse cx="110" cy="128" rx="70" ry="15" class="bx"/>
  <text class="c" x="110" y="132">l'usager a choisi</text>
  <path class="fl" d="M110 143 V 157"/>
  <path d="M110 159 L 170 186 L 110 213 L 50 186 Z" fill="#122a52" stroke="#61dafb" stroke-width="1.5"/>
  <text class="c" x="110" y="184">papier</text>
  <text class="c" x="110" y="199">&gt; 8 %&#160;?</text>
  <path class="fl" d="M170 186 H 202"/>
  <text class="lb" x="176" y="180">non</text>
  <rect class="ts" x="204" y="160" width="84" height="52" rx="4"/>
  <text class="c" x="246" y="176" fill="#ffd08a">indisponible</text>
  <text class="c" x="246" y="191" fill="#ffd08a">+ alerter</text>
  <text class="c" x="246" y="206" fill="#ffd08a">(fin)</text>
  <path class="fl" d="M110 213 V 231"/>
  <text class="lb" x="116" y="226">oui</text>
  <rect class="bx" x="46" y="233" width="128" height="28" rx="4"/>
  <text class="c" x="110" y="251">encaisser</text>
  <path class="fl" d="M110 261 V 277"/>
  <path d="M110 279 L 170 306 L 110 333 L 50 306 Z" fill="#122a52" stroke="#61dafb" stroke-width="1.5"/>
  <text class="c" x="110" y="310">payé&#160;?</text>
  <path class="fl" d="M170 306 H 202"/>
  <text class="lb" x="176" y="300">non</text>
  <rect class="ts" x="204" y="280" width="84" height="52" rx="4"/>
  <text class="c" x="246" y="296" fill="#ffd08a">rendre</text>
  <text class="c" x="246" y="311" fill="#ffd08a">l'argent,</text>
  <text class="c" x="246" y="326" fill="#ffd08a">rechoisir</text>
  <path class="fl" d="M110 333 V 351"/>
  <text class="lb" x="116" y="346">oui</text>
  <rect class="bx" x="46" y="353" width="128" height="28" rx="4"/>
  <text class="c" x="110" y="371">imprimer le titre</text>
  <path class="fl" d="M110 381 V 395"/>
  <ellipse cx="110" cy="411" rx="64" ry="15" fill="#0d3320" stroke="#4fae7a" stroke-width="1.5"/>
  <text class="c" x="110" y="415" fill="#81fba1">fin : réussite</text>
  <rect x="42" y="440" width="240" height="98" rx="8" fill="#2b1f0d" stroke="#ffb454" stroke-width="1.5"/>
  <text x="54" y="462" font-size="12" font-weight="600" fill="#ffd08a">L'ordre EST le correctif</text>
  <text x="54" y="482">Aujourd'hui la borne encaisse,</text>
  <text x="54" y="498">PUIS échoue à imprimer&#160;:</text>
  <text x="54" y="514">l'usager a payé et n'a rien.</text>
  <text x="54" y="530" fill="#ffd08a">Incident I1 — 3 fois en 30 jours.</text>
  <!-- ══ colonne 2 : graphique en barres horizontales, pour l'élue ══ -->
  <rect x="314" y="60" width="272" height="492" rx="12" fill="#08132c" stroke="#a077d8" stroke-width="2"/>
  <text class="ti" x="330" y="86" fill="#c68ef2">🏛 Pour l'élue</text>
  <text class="lb" x="330" y="104">un graphique, et une phrase</text>
  <text x="330" y="136" font-weight="600">Taux d'abandon, selon le profil</text>
  <line x1="432" y1="150" x2="432" y2="376" stroke="#9bbefc"/>
  <text x="424" y="176" text-anchor="end">habitués</text>
  <line x1="432" y1="161" x2="432" y2="183" stroke="#4fae7a" stroke-width="3"/>
  <text x="440.0" y="176" font-weight="600" fill="#81fba1">0 %</text>
  <text x="424" y="220" text-anchor="end">occasionnels</text>
  <rect x="432" y="205" width="22.0" height="22" fill="#4fae7a"/>
  <text x="462.0" y="220" font-weight="600" fill="#e4eaf5">11 %</text>
  <text x="424" y="264" text-anchor="end">avec poussette</text>
  <rect x="432" y="249" width="50.0" height="22" fill="#ffb454"/>
  <text x="490.0" y="264" font-weight="600" fill="#ffd08a">25 %</text>
  <text x="424" y="308" text-anchor="end">touristes</text>
  <rect x="432" y="293" width="86.0" height="22" fill="#ff7b88"/>
  <text x="526.0" y="308" font-weight="600" fill="#ff9aa4">43 %</text>
  <text x="424" y="352" text-anchor="end">personnes âgées</text>
  <rect x="432" y="337" width="100.0" height="22" fill="#ff7b88"/>
  <text x="540.0" y="352" font-weight="600" fill="#ff9aa4">50 %</text>
  <rect x="330" y="410" width="240" height="128" rx="8" fill="#2b1a3f" stroke="#a077d8" stroke-width="1.5"/>
  <text x="342" y="432" font-size="12" font-weight="600" fill="#c68ef2">La phrase, et rien d'autre</text>
  <text x="342" y="456">Un usager sur cinq abandonne —</text>
  <text x="342" y="474" font-weight="600">mais aucun habitué.</text>
  <text x="342" y="498">Ce sont toujours les mêmes</text>
  <text x="342" y="516">qui renoncent.</text>
  <!-- ══ colonne 3 : storyboard, pour l'usager ══ -->
  <rect x="602" y="60" width="272" height="492" rx="12" fill="#08132c" stroke="#4fae7a" stroke-width="2"/>
  <text class="ti" x="618" y="86" fill="#81fba1">🚶 Pour l'usager</text>
  <text class="lb" x="618" y="104">un storyboard, presque sans mots</text>
  <rect x="618" y="120" width="240" height="118" rx="8" fill="#0b1b39" stroke="#4fae7a"/>
  <rect x="618" y="252" width="240" height="118" rx="8" fill="#0b1b39" stroke="#4fae7a"/>
  <rect x="618" y="384" width="240" height="118" rx="8" fill="#0b1b39" stroke="#4fae7a"/>
  <rect x="690" y="140" width="38" height="64" rx="6" fill="#122a52" stroke="#9bbefc"/>
  <rect x="752" y="150" width="44" height="44" fill="#e4eaf5"/>
  <rect x="758" y="156" width="11" height="11" fill="#050f24"/>
  <rect x="779" y="156" width="11" height="11" fill="#050f24"/>
  <rect x="758" y="177" width="11" height="11" fill="#050f24"/>
  <text x="632" y="228" font-size="12" font-weight="600" fill="#81fba1">1. Téléphone → code</text>
  <rect x="648" y="268" width="46" height="66" rx="5" fill="#122a52" stroke="#9bbefc"/>
  <path d="M708 301 H 768" stroke="#ffb454" stroke-width="3" marker-end="url(#fc_3)"/>
  <rect x="788" y="268" width="46" height="66" rx="5" fill="#2b1f0d" stroke="#ffb454"/>
  <text class="c" x="811" y="307" font-size="18" fill="#ffd08a">¥</text>
  <text x="632" y="360" font-size="12" font-weight="600" fill="#ffd08a">2. Espèces → borne d'à côté</text>
  <circle cx="696" cy="430" r="20" fill="#122a52" stroke="#81fba1" stroke-width="1.5"/>
  <circle cx="689" cy="425" r="2.2" fill="#81fba1"/><circle cx="703" cy="425" r="2.2" fill="#81fba1"/>
  <path d="M687 437 Q 696 445 705 437" stroke="#81fba1" stroke-width="1.5" fill="none"/>
  <path d="M724 430 H 752" stroke="#81fba1" stroke-width="2.5" marker-end="url(#fc_2p5)"/>
  <rect x="766" y="402" width="12" height="56" fill="#122a52" stroke="#9bbefc"/>
  <rect x="812" y="402" width="12" height="56" fill="#122a52" stroke="#9bbefc"/>
  <text x="632" y="490" font-size="12" font-weight="600" fill="#81fba1">3. Passage</text>
  <text class="lb" x="618" y="534">Trois secondes de lecture. Pas une de plus.</text>
  <rect x="26" y="572" width="848" height="58" rx="10" fill="#122a52" stroke="#3f6bb5" stroke-width="2"/>
  <text x="42" y="596" font-size="14" font-weight="600" fill="#8fb6ff">Le fait est le même dans les trois colonnes</text>
  <text x="42" y="618" font-size="12">Seule la <tspan font-weight="600">forme</tspan> change — et ce n'est pas le goût qui l'a choisie, c'est le <tspan font-weight="600">destinataire</tspan>.</text>
</svg>
