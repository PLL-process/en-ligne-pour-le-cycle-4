<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 390" width="350" height="390" role="img" aria-labelledby="t_abandons_par_etape d_abandons_par_etape" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_abandons_par_etape">À quelle étape les usagers abandonnent-ils ?</title>
<desc id="d_abandons_par_etape">Cinq barres, une par étape de l'achat, avec le nombre d'abandons. Approcher la borne : 0. Choisir la langue : 1. Choisir le titre : 4. Payer : 2. Récupérer le titre : 1.</desc>
<rect width="350" height="390" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">À quelle étape les usagers</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">abandonnent-ils ?</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">8 abandons sur 40 usagers</text>
<text x="14.0" y="94.3" font-size="13.5" fill="#9bbefc">observés — données simulées.</text>
<text x="14.0" y="130.3" font-size="15" fill="#e4eaf5">Approcher la borne</text>
<rect x="14" y="138.3" width="3.0" height="16" rx="5" fill="#61dafb"/>
<text x="25.0" y="151.8" font-size="15" fill="#e4eaf5" font-weight="700">0</text>
<text x="14.0" y="184.3" font-size="15" fill="#e4eaf5">Choisir la langue</text>
<rect x="14" y="192.3" width="59.0" height="16" rx="5" fill="#61dafb"/>
<text x="81.0" y="205.8" font-size="15" fill="#e4eaf5" font-weight="700">1</text>
<text x="14.0" y="238.3" font-size="15" fill="#e4eaf5">Choisir le titre</text>
<rect x="14" y="246.3" width="236.0" height="16" rx="5" fill="#61dafb"/>
<text x="258.0" y="259.9" font-size="15" fill="#e4eaf5" font-weight="700">4</text>
<text x="14.0" y="292.4" font-size="15" fill="#e4eaf5">Payer</text>
<rect x="14" y="300.4" width="118.0" height="16" rx="5" fill="#61dafb"/>
<text x="140.0" y="313.9" font-size="15" fill="#e4eaf5" font-weight="700">2</text>
<text x="14.0" y="346.4" font-size="15" fill="#e4eaf5">Récupérer le titre</text>
<rect x="14" y="354.4" width="59.0" height="16" rx="5" fill="#61dafb"/>
<text x="81.0" y="367.9" font-size="15" fill="#e4eaf5" font-weight="700">1</text>
</svg>
