<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="tm dm"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="tm">Six modes de représentation d'une expérience utilisateur, avec ce que chacun montre et ce qu'il ne montre pas</title>
  <desc id="dm">Un tableau à trois colonnes présentant six modes de représentation. Pour chacun :
  ce qu'il montre, et son angle mort. Le parcours utilisateur découpe l'expérience en étapes
  nommées ; il situe où se produit un problème, mais il ne chiffre rien. L'algorigramme écrit la
  logique de la machine avec ses actions, ses tests et ses reprises ; il rend les cas d'échec
  traitables, mais il est illisible pour qui n'a pas appris ses formes. Le graphique compare des
  quantités ; il chiffre et hiérarchise, mais il ne dit rien du vécu des personnes. La carte
  d'empathie range ce que l'usager dit, fait, ressent et voit ; elle restitue le vécu, mais elle ne
  se mesure pas et deux observateurs peuvent la remplir différemment. Le storyboard raconte
  l'expérience en quelques images ; il se comprend sans mode d'emploi et par tout le monde, mais il
  ne tient que peu d'informations. Le tableau comparatif croise des critères et des solutions ; il
  est dense et précis, mais il se lit lentement et décourage un lecteur pressé. Une bande de
  conclusion rappelle qu'aucun mode n'est meilleur que les autres dans l'absolu : chacun a été
  inventé pour un usage, et le choix se justifie par le destinataire et par l'intention, jamais par
  le goût.</desc>
  <rect width="900" height="520" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:12.5px}
    .h{fill:#9bbefc;font-size:12.5px;font-weight:600}
    .mo{font-weight:600;fill:#ffd08a;font-size:13px}
    .pl{fill:#81fba1}
    .mi{fill:#ff9aa4}
    .row{fill:#0b1b39;stroke:#25406e}
    .alt{fill:#091531;stroke:#25406e}
  </style>
  <text x="26" y="30" font-size="17" font-weight="600">Six façons de montrer la même expérience</text>
  <text x="26" y="50" font-size="12.5" fill="#9bbefc">Chacune a été inventée pour un usage. Aucune n'est meilleure dans l'absolu.</text>

  <rect x="26" y="64" width="848" height="30" fill="#122a52" stroke="#3f6bb5"/>
  <text class="h" x="40" y="84">Le mode</text>
  <text class="h" x="264" y="84">＋ ce qu'il montre</text>
  <text class="h" x="588" y="84">− son angle mort</text>

  <rect class="row" x="26" y="94" width="848" height="54"/>
  <text class="mo" x="40" y="118">parcours utilisateur</text>
  <text x="40" y="138" font-size="11.5" fill="#9bbefc">les étapes, nommées</text>
  <text class="pl" x="264" y="118">situe où le problème</text><text class="pl" x="264" y="136">se produit</text>
  <text class="mi" x="588" y="118">ne chiffre rien : on ne sait</text><text class="mi" x="588" y="136">pas combien ça coûte</text>

  <rect class="alt" x="26" y="148" width="848" height="54"/>
  <text class="mo" x="40" y="172">algorigramme</text>
  <text x="40" y="192" font-size="11.5" fill="#9bbefc">actions, tests, reprises</text>
  <text class="pl" x="264" y="172">rend les cas d'échec</text><text class="pl" x="264" y="190">visibles, donc traitables</text>
  <text class="mi" x="588" y="172">illisible pour qui n'a pas</text><text class="mi" x="588" y="190">appris ses formes</text>

  <rect class="row" x="26" y="202" width="848" height="54"/>
  <text class="mo" x="40" y="226">graphique</text>
  <text x="40" y="246" font-size="11.5" fill="#9bbefc">des quantités comparées</text>
  <text class="pl" x="264" y="226">chiffre et hiérarchise :</text><text class="pl" x="264" y="244">on voit ce qui domine</text>
  <text class="mi" x="588" y="226">ne dit rien du vécu des</text><text class="mi" x="588" y="244">personnes</text>

  <rect class="alt" x="26" y="256" width="848" height="54"/>
  <text class="mo" x="40" y="280">carte d'empathie</text>
  <text x="40" y="300" font-size="11.5" fill="#9bbefc">dit · fait · ressent · voit</text>
  <text class="pl" x="264" y="280">restitue le vécu, y compris</text><text class="pl" x="264" y="298">ce qui n'est pas dit</text>
  <text class="mi" x="588" y="280">ne se mesure pas : deux</text><text class="mi" x="588" y="298">observateurs divergeront</text>

  <rect class="row" x="26" y="310" width="848" height="54"/>
  <text class="mo" x="40" y="334">storyboard</text>
  <text x="40" y="354" font-size="11.5" fill="#9bbefc">quelques images en suite</text>
  <text class="pl" x="264" y="334">se comprend sans mode</text><text class="pl" x="264" y="352">d'emploi, par tout le monde</text>
  <text class="mi" x="588" y="334">ne tient que très peu</text><text class="mi" x="588" y="352">d'informations</text>

  <rect class="alt" x="26" y="364" width="848" height="54"/>
  <text class="mo" x="40" y="388">tableau comparatif</text>
  <text x="40" y="408" font-size="11.5" fill="#9bbefc">critères × solutions</text>
  <text class="pl" x="264" y="388">dense et précis : tout est</text><text class="pl" x="264" y="406">là, au même endroit</text>
  <text class="mi" x="588" y="388">se lit lentement, et décourage</text><text class="mi" x="588" y="406">un lecteur pressé</text>

  <rect x="26" y="432" width="848" height="72" rx="10" fill="#2b1f0d" stroke="#ffb454" stroke-width="2"/>
  <text x="42" y="458" font-size="14.5" font-weight="600" fill="#ffd08a">Comment on choisit</text>
  <text x="42" y="482">Un mode n'est jamais bon en soi&#160;: <tspan font-weight="600">il est bon pour quelqu'un</tspan>.</text>
  <text x="42" y="500">Le choix se justifie par le <tspan font-weight="600">destinataire</tspan> et par l'<tspan font-weight="600">intention</tspan> — jamais par le goût.</text>
</svg>
