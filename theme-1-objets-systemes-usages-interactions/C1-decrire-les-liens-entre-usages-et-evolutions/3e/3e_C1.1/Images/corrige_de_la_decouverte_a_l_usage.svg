<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="td2 dd2"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="td2">Corrigé — de l'observation de Herschel en 1800 à la détection des feux, à l'échelle du temps</title>
  <desc id="dd2">Une frise dessinée à l'échelle du temps, de 1800 à aujourd'hui : chaque année occupe la
  même longueur. À gauche, en 1800 : William Herschel étale la lumière du Soleil avec un prisme et
  mesure la température de chaque couleur ; au-delà du rouge, là où l'œil ne voit rien, le
  thermomètre monte le plus — c'est l'infrarouge. Puis plus d'un siècle vide sur la frise. Une bande
  couvre le vingtième siècle : les premières caméras thermiques, puis les satellites ; on sait enfin
  fabriquer des détecteurs de ce rayonnement. À droite, aujourd'hui : un drone repère un point chaud
  sous la fumée, de nuit. Une bande de conclusion rappelle que plus de deux siècles séparent
  l'observation de cet usage, que Herschel cherchait quelle couleur chauffe le plus, et qu'une
  découverte devient une technique quand une capacité de fabrication et un besoin la rencontrent.</desc>
  <rect width="900" height="450" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:12px}
    .an{fill:#ffd08a;font-size:15px;font-weight:600}
    .ti{font-size:13.5px;font-weight:600}
    .lb{fill:#9bbefc;font-size:11.5px}
  </style>
  <text x="26" y="30" font-size="17" font-weight="600">Corrigé — de l'observation à l'usage&#160;: deux siècles, à l'échelle</text>
  <text class="lb" x="26" y="50">Sur cette frise, chaque année a la même longueur.</text>

  <rect x="408.6" y="116" width="341.7" height="24" rx="4" fill="#a077d8" fill-opacity="0.35" stroke="#a077d8"/>
  <line x1="60" y1="128" x2="840.0" y2="128" stroke="#274a8a" stroke-width="3"/>
  <line x1="60.0" y1="124" x2="60.0" y2="136" stroke="#9bbefc" stroke-width="1.5"/><text class="lb" x="60.0" y="154" text-anchor="middle">1800</text><line x1="232.6" y1="124" x2="232.6" y2="136" stroke="#9bbefc" stroke-width="1.5"/><text class="lb" x="232.6" y="154" text-anchor="middle">1850</text><line x1="405.1" y1="124" x2="405.1" y2="136" stroke="#9bbefc" stroke-width="1.5"/><text class="lb" x="405.1" y="154" text-anchor="middle">1900</text><line x1="577.7" y1="124" x2="577.7" y2="136" stroke="#9bbefc" stroke-width="1.5"/><text class="lb" x="577.7" y="154" text-anchor="middle">1950</text><line x1="750.3" y1="124" x2="750.3" y2="136" stroke="#9bbefc" stroke-width="1.5"/><text class="lb" x="750.3" y="154" text-anchor="middle">2000</text>
  <circle cx="60" cy="128" r="9" fill="#ffb454"/>
  <circle cx="840.0" cy="128" r="9" fill="#4fae7a"/>
  <text class="an" x="42" y="100">1800</text>
  <text class="an" x="579.4" y="100" text-anchor="middle">XX<tspan font-size="11">e</tspan> siècle</text>
  <text class="an" x="840.0" y="100" text-anchor="end">aujourd'hui</text>
  <text class="lb" x="234.3" y="112" text-anchor="middle">plus d'un siècle</text>

  <rect x="26" y="176" width="250" height="150" rx="10" fill="#2b1f0d" stroke="#ffb454" stroke-width="2"/>
  <text class="ti" x="42" y="200" fill="#ffd08a">1800 — l'observation</text>
  <text x="42" y="224" font-size="11.5">William <tspan font-weight="600">Herschel</tspan> étale la lumière</text>
  <text x="42" y="242" font-size="11.5">du Soleil au prisme et mesure</text>
  <text x="42" y="260" font-size="11.5">la température de chaque couleur.</text>
  <text x="42" y="286" font-size="11.5" fill="#81fba1">Au-delà du rouge, où l'œil ne voit</text>
  <text x="42" y="304" font-size="11.5" fill="#81fba1">rien, il monte le plus&#160;: <tspan font-weight="600">l'infrarouge.</tspan></text>

  <rect x="410.0" y="176" width="280" height="150" rx="10" fill="#2b1a3f" stroke="#a077d8" stroke-width="2"/>
  <text class="ti" x="426.0" y="200" fill="#c68ef2">XX<tspan font-size="10">e</tspan> siècle — les capteurs</text>
  <text x="426.0" y="224" font-size="11.5">Les premières <tspan font-weight="600">caméras thermiques</tspan>,</text>
  <text x="426.0" y="242" font-size="11.5">puis les <tspan font-weight="600">satellites</tspan>&#160;: on sait enfin</text>
  <text x="426.0" y="260" font-size="11.5">fabriquer des détecteurs de ce</text>
  <text x="426.0" y="278" font-size="11.5">rayonnement invisible.</text>

  <rect x="704" y="176" width="170" height="150" rx="10" fill="#0d3320" stroke="#4fae7a" stroke-width="2"/>
  <text class="ti" x="720" y="200" fill="#81fba1">Aujourd'hui — l'usage</text>
  <text x="720" y="224" font-size="11.5">Un drone repère</text>
  <text x="720" y="242" font-size="11.5">un point chaud</text>
  <text x="720" y="260" font-size="11.5">sous la fumée,</text>
  <text x="720" y="278" font-size="11.5">de nuit.</text>
  <text x="720" y="304" font-size="11.5" fill="#ffd08a">Là où aucun œil ne voit.</text>

  <line x1="151" y1="176" x2="60" y2="137" stroke="#ffb454" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="550.0" y1="176" x2="579.4" y2="140" stroke="#a077d8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="789" y1="176" x2="840.0" y2="137" stroke="#4fae7a" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="26" y="346" width="848" height="86" rx="10" fill="#122a52" stroke="#3f6bb5" stroke-width="2"/>
  <text x="42" y="370" font-size="14" font-weight="600" fill="#8fb6ff">Plus de deux siècles séparent l'observation de cet usage.</text>
  <text x="42" y="392" font-size="12">Herschel cherchait quelle couleur chauffe le plus. Il ne pouvait pas prévoir les feux de forêt, ni les drones, ni rien de tout cela.</text>
  <text x="42" y="414" font-size="12">Ce délai est <tspan font-weight="600" fill="#ffd08a">la règle, pas l'exception</tspan>&#160;: une découverte devient une technique quand une capacité de fabrication ET un besoin la rencontrent.</text>
</svg>
