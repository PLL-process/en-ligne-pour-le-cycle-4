<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="th dh"
     font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
  <title id="th">L'expérience de Herschel, en 1800 : le prisme, les thermomètres, et la zone au-delà du rouge</title>
  <desc id="dh">Schéma du dispositif, vu de côté. En haut à gauche, le Soleil. Sa lumière entre par une
  fenêtre presque masquée, puis traverse un prisme de verre. En sortant du prisme, la lumière s'étale en
  éventail et tombe sur une table, où elle dessine une bande de couleurs, de gauche à droite : violet,
  bleu, vert, jaune, orange, rouge. Juste à droite du rouge, une septième zone de la table est
  encadrée en pointillés : l'œil n'y voit aucune couleur, la table y reste sombre. Un thermomètre est
  dessiné dans chacune des sept zones : Herschel n'en posait pas sept à la fois, il avançait le même
  d'une zone à l'autre, et le schéma montre toutes ses mesures ensemble. La colonne de chaque
  thermomètre est dessinée à une hauteur schématique, sans graduation ni chiffre : elle est la plus
  basse sous le violet, s'élève de couleur en couleur jusqu'au rouge, et c'est dans la zone sombre,
  au-delà du rouge, qu'elle monte le plus haut. Une bande en bas du schéma rappelle que chaque
  thermomètre dessiné est une mesure, et que la plus haute est celle de la zone où l'œil ne voit
  rien. Le schéma ne dit ni ce que Herschel cherchait, ni ce qu'il en a conclu.</desc>
  <rect width="820" height="470" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:13px}
    .titre{font-size:18px;font-weight:600}
    .sous{fill:#9bbefc;font-size:13px}
    .nom{fill:#9bbefc;font-size:13px}
    .tube{fill:#0a1b3d;stroke:#c9d6ee;stroke-width:1.5}
    .liquide{fill:#ff7b88}
    .zone{stroke:#9bbefc;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .fort{font-weight:600}
    .c-violet{fill:#c68ef2}
    .c-bleu{fill:#6ea8ff}
    .c-vert{fill:#81fba1}
    .c-jaune{fill:#ffd66b}
    .c-orange{fill:#ffb454}
    .c-rouge{fill:#ff7b88}
  </style>
  <text class="titre" x="24" y="30">L'expérience de Herschel, en 1800 — le dispositif</text>
  <text class="sous" x="24" y="52">Un prisme étale la lumière du Soleil sur une table ; Herschel mesure la température de chaque zone.</text>

  <!-- le Soleil, le volet et sa fente, le faisceau -->
  <circle cx="64" cy="104" r="28" fill="#ffd66b"/>
  <text class="nom" x="40" y="156">Soleil</text>
  <rect x="128" y="68" width="10" height="28" fill="#274a8a"/>
  <rect x="128" y="104" width="10" height="44" fill="#274a8a"/>
  <text class="nom" x="92" y="172">fenêtre masquée</text>
  <path d="M 92 100 L 206 100" stroke="#fff3c4" stroke-width="4" fill="none"/>

  <!-- le prisme -->
  <path d="M 190 128 L 244 128 L 217 76 Z" fill="#122a52" stroke="#61dafb" stroke-width="2"/>
  <text class="nom" x="194" y="148">prisme</text>

  <!-- l'éventail de lumière, du prisme à la table -->
  <path d="M 228 104 L 300 324 L 370 324 Z" fill="#c68ef2" fill-opacity="0.22"/>
  <path d="M 228 104 L 370 324 L 440 324 Z" fill="#6ea8ff" fill-opacity="0.22"/>
  <path d="M 228 104 L 440 324 L 510 324 Z" fill="#81fba1" fill-opacity="0.22"/>
  <path d="M 228 104 L 510 324 L 580 324 Z" fill="#ffd66b" fill-opacity="0.22"/>
  <path d="M 228 104 L 580 324 L 650 324 Z" fill="#ffb454" fill-opacity="0.22"/>
  <path d="M 228 104 L 650 324 L 720 324 Z" fill="#ff7b88" fill-opacity="0.22"/>

  <!-- la table, et les taches de couleur posées dessus -->
  <rect x="270" y="336" width="546" height="14" rx="2" fill="#34425e"/>
  <rect x="300" y="324" width="70" height="12" fill="#c68ef2"/>
  <rect x="370" y="324" width="70" height="12" fill="#6ea8ff"/>
  <rect x="440" y="324" width="70" height="12" fill="#81fba1"/>
  <rect x="510" y="324" width="70" height="12" fill="#ffd66b"/>
  <rect x="580" y="324" width="70" height="12" fill="#ffb454"/>
  <rect x="650" y="324" width="70" height="12" fill="#ff7b88"/>
  <rect x="720" y="324" width="80" height="12" fill="#0a1b3d"/>

  <!-- la zone au-delà du rouge -->
  <rect class="zone" x="722" y="178" width="78" height="164" rx="6"/>
  <text x="614" y="146">Sur la table, ici,</text>
  <text x="614" y="164">l'œil ne voit <tspan class="fort">aucune couleur</tspan>.</text>

  <!-- sept mesures : le même thermomètre, avancé d'une zone à l'autre -->
  <rect class="tube" x="330" y="196" width="10" height="126" rx="5"/>
  <rect class="liquide" x="332.5" y="302" width="5" height="20"/>
  <circle class="liquide" cx="335" cy="326" r="8"/>
  <rect class="tube" x="400" y="196" width="10" height="126" rx="5"/>
  <rect class="liquide" x="402.5" y="294" width="5" height="28"/>
  <circle class="liquide" cx="405" cy="326" r="8"/>
  <rect class="tube" x="470" y="196" width="10" height="126" rx="5"/>
  <rect class="liquide" x="472.5" y="286" width="5" height="36"/>
  <circle class="liquide" cx="475" cy="326" r="8"/>
  <rect class="tube" x="540" y="196" width="10" height="126" rx="5"/>
  <rect class="liquide" x="542.5" y="274" width="5" height="48"/>
  <circle class="liquide" cx="545" cy="326" r="8"/>
  <rect class="tube" x="610" y="196" width="10" height="126" rx="5"/>
  <rect class="liquide" x="612.5" y="262" width="5" height="60"/>
  <circle class="liquide" cx="615" cy="326" r="8"/>
  <rect class="tube" x="680" y="196" width="10" height="126" rx="5"/>
  <rect class="liquide" x="682.5" y="250" width="5" height="72"/>
  <circle class="liquide" cx="685" cy="326" r="8"/>
  <rect class="tube" x="756" y="196" width="10" height="126" rx="5"/>
  <rect class="liquide" x="758.5" y="222" width="5" height="100"/>
  <circle class="liquide" cx="761" cy="326" r="8"/>

  <!-- noms des zones, écrits en toutes lettres pour une impression en gris -->
  <text x="314" y="370" class="c-violet">violet</text>
  <text x="392" y="370" class="c-bleu">bleu</text>
  <text x="459" y="370" class="c-vert">vert</text>
  <text x="525" y="370" class="c-jaune">jaune</text>
  <text x="590" y="370" class="c-orange">orange</text>
  <text x="664" y="370" class="c-rouge">rouge</text>
  <text x="730" y="370">au-delà</text>
  <text x="730" y="386">du rouge</text>

  <!-- ce que montre le montage -->
  <rect x="24" y="400" width="772" height="56" rx="10" fill="#122a52" stroke="#3f6bb5" stroke-width="2"/>
  <text x="40" y="423">Une mesure dans chaque couleur, et <tspan class="fort">une de plus au-delà du rouge</tspan> — le même thermomètre, avancé</text>
  <text x="40" y="443">d'une zone à l'autre (hauteurs schématiques). <tspan class="fort">La plus haute est celle de la zone où l'œil ne voit rien.</tspan></text>
</svg>
