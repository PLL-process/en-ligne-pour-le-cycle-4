<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 376" width="350" height="376" role="img" aria-labelledby="t_publication_virale d_publication_virale" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_publication_virale">Une publication partagée 12 400 fois</title>
<desc id="d_publication_virale">Une publication partagée 12 400 fois, données simulées. Texte : « ALERTE ! L'eau sera coupée trois jours dans toute l'île. Partagez ! » Publiée par @alerte_ile_infos, un compte créé il y a 3 jours. Source citée : aucune.</desc>
<rect width="350" height="376" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Une publication partagée 12 400 fois</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Vue sur un réseau social (données simulées).</text>
<rect x="14.0" y="69.2" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="99.2" font-size="16" fill="#61dafb" font-weight="700">Texte</text>
<text x="26.0" y="126.2" font-size="15" fill="#e4eaf5">« ALERTE ! L'eau sera coupée trois jours</text>
<text x="26.0" y="147.2" font-size="15" fill="#e4eaf5">dans toute l'île. Partagez ! »</text>
<rect x="14.0" y="175.2" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="205.2" font-size="16" fill="#61dafb" font-weight="700">Publiée par</text>
<text x="26.0" y="232.2" font-size="15" fill="#e4eaf5">@alerte_ile_infos, compte créé il y a</text>
<text x="26.0" y="253.2" font-size="15" fill="#e4eaf5">3 jours</text>
<rect x="14.0" y="281.2" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="311.2" font-size="16" fill="#61dafb" font-weight="700">Source citée</text>
<text x="26.0" y="338.2" font-size="15" fill="#e4eaf5">aucune</text>
</svg>
