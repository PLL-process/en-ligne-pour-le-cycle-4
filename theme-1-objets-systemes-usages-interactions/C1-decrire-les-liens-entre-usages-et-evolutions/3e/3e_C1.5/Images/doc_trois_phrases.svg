<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 415" width="350" height="415" role="img" aria-labelledby="t_trois_phrases d_trois_phrases" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_trois_phrases">Trois phrases d'élèves</title>
<desc id="d_trois_phrases">Trois phrases d'élèves sur le numérique. A : « Le numérique pollue énormément, tout le monde le sait. » B : « Le numérique, c'est 4,4 %. » C : « Selon l'ADEME et l'Arcep, le numérique pesait 4,4 % de l'empreinte carbone de la France en 2022. »</desc>
<rect width="350" height="415" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Trois phrases d'élèves</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Pour un argumentaire sur le</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">numérique et l'environnement.</text>
<rect x="14.0" y="87.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">A</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">« Le numérique pollue énormément, tout</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">le monde le sait. »</text>
<rect x="14.0" y="193.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="223.4" font-size="16" fill="#61dafb" font-weight="700">B</text>
<text x="26.0" y="250.4" font-size="15" fill="#e4eaf5">« Le numérique, c'est 4,4 %. »</text>
<rect x="14.0" y="278.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="308.4" font-size="16" fill="#61dafb" font-weight="700">C</text>
<text x="26.0" y="335.4" font-size="15" fill="#e4eaf5">« Selon l'ADEME et l'Arcep, le numérique</text>
<text x="26.0" y="356.4" font-size="15" fill="#e4eaf5">pesait 4,4 % de l'empreinte carbone de la</text>
<text x="26.0" y="377.4" font-size="15" fill="#e4eaf5">France en 2022. »</text>
</svg>
