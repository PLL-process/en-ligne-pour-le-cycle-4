<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 351" width="350" height="351" role="img" aria-labelledby="t_jeu_gratuit d_jeu_gratuit" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_jeu_gratuit">Un jeu gratuit pour téléphone</title>
<desc id="d_jeu_gratuit">La fiche d'un jeu pour téléphone, données simulées. Prix : 0 euro. Achats dans le jeu : aucun. Publicités : oui, ciblées. Données collectées : âge, position, temps de jeu, contacts.</desc>
<rect width="350" height="351" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Un jeu gratuit pour téléphone</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Ce qu'indique sa fiche avant</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">l'installation (données simulées).</text>
<rect x="14.0" y="87.4" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Le jeu</text>
<text x="26.0" y="145.4" font-size="13.5" fill="#9bbefc">Prix</text>
<text x="26.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">0 €</text>
<text x="175.0" y="145.4" font-size="13.5" fill="#9bbefc">Achats dans le jeu</text>
<text x="175.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">aucun</text>
<text x="26.0" y="185.4" font-size="13.5" fill="#9bbefc">Publicités</text>
<text x="26.0" y="204.4" font-size="16" fill="#e4eaf5" font-weight="700">oui, ciblées</text>
<rect x="14.0" y="231.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="261.4" font-size="16" fill="#61dafb" font-weight="700">Données collectées</text>
<text x="26.0" y="288.4" font-size="15" fill="#e4eaf5">âge, position, temps de jeu, contacts</text>
<text x="14.0" y="330.6" font-size="13.5" fill="#9bbefc">€ : euro.</text>
</svg>
