<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 228" width="350" height="228" role="img" aria-labelledby="t_emissions_appareil d_emissions_appareil" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_emissions_appareil">Les émissions d'un appareil, sur toute sa vie</title>
<desc id="d_emissions_appareil">Les émissions d'un appareil numérique sur sa vie, par étape : fabrication, environ 80 % ; usage et fin de vie, environ 20 %.</desc>
<rect width="350" height="228" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Les émissions d'un</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">appareil, sur toute sa vie</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Part de chaque étape — ordre</text>
<text x="14.0" y="94.3" font-size="13.5" fill="#9bbefc">de grandeur donné par l'ADEME.</text>
<text x="14.0" y="130.3" font-size="15" fill="#e4eaf5">Fabrication</text>
<rect x="14" y="138.3" width="236.0" height="16" rx="5" fill="#61dafb"/>
<text x="258.0" y="151.8" font-size="15" fill="#e4eaf5" font-weight="700">≈ 80 %</text>
<text x="14.0" y="184.3" font-size="15" fill="#e4eaf5">Usage et fin de vie</text>
<rect x="14" y="192.3" width="59.0" height="16" rx="5" fill="#61dafb"/>
<text x="81.0" y="205.8" font-size="15" fill="#e4eaf5" font-weight="700">≈ 20 %</text>
</svg>
