<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 343" width="350" height="343" role="img" aria-labelledby="t_empreinte_numerique_fran d_empreinte_numerique_fran" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_empreinte_numerique_fran">L'empreinte carbone du numérique en France</title>
<desc id="d_empreinte_numerique_fran">L'empreinte carbone du numérique en France en 2022, selon l'ADEME et l'Arcep, par poste : équipements, environ 50 % ; centres de données, environ 46 % ; réseaux, environ 4 %. Le numérique pèse 4,4 % de l'empreinte carbone de la France, soit 29,5 millions de tonnes équivalent CO₂.</desc>
<rect width="350" height="343" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">L'empreinte carbone du</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">numérique en France</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Part de chaque poste en 2022 —</text>
<text x="14.0" y="94.3" font-size="13.5" fill="#9bbefc">étude de l'ADEME et de l'Arcep.</text>
<text x="14.0" y="130.3" font-size="15" fill="#e4eaf5">Équipements</text>
<rect x="14" y="138.3" width="236.0" height="16" rx="5" fill="#61dafb"/>
<text x="258.0" y="151.8" font-size="15" fill="#e4eaf5" font-weight="700">≈ 50 %</text>
<text x="14.0" y="184.3" font-size="15" fill="#e4eaf5">Centres de données</text>
<rect x="14" y="192.3" width="217.1" height="16" rx="5" fill="#61dafb"/>
<text x="239.1" y="205.8" font-size="15" fill="#e4eaf5" font-weight="700">≈ 46 %</text>
<text x="14.0" y="238.3" font-size="15" fill="#e4eaf5">Réseaux</text>
<rect x="14" y="246.3" width="18.9" height="16" rx="5" fill="#61dafb"/>
<text x="40.9" y="259.9" font-size="15" fill="#e4eaf5" font-weight="700">≈ 4 %</text>
<text x="14.0" y="286.5" font-size="13.5" fill="#9bbefc">En tout, le numérique pèse 4,4 % de l'empreinte</text>
<text x="14.0" y="304.8" font-size="13.5" fill="#9bbefc">carbone de la France : 29,5 Mt CO₂e (millions de</text>
<text x="14.0" y="323.0" font-size="13.5" fill="#9bbefc">tonnes équivalent CO₂).</text>
</svg>
