<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 375" width="350" height="375" role="img" aria-labelledby="t_trois_mots_de_passe d_trois_mots_de_passe" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_trois_mots_de_passe">Trois mots de passe pour une console</title>
<desc id="d_trois_mots_de_passe">Trois mots de passe proposés pour le compte d'une console de jeu. A : Kenzo2012, le prénom et l'année de naissance de son propriétaire, 9 caractères. B : Soleil!, 7 caractères. C : cocotier-Pluie-47-banane, 24 caractères.</desc>
<rect width="350" height="375" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Trois mots de passe</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">pour une console</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Proposés pour le compte de Kenzo,</text>
<text x="14.0" y="94.3" font-size="13.5" fill="#9bbefc">né en 2012 (données simulées).</text>
<rect x="14.0" y="110.3" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="140.3" font-size="16" fill="#61dafb" font-weight="700">A · Kenzo2012</text>
<text x="26.0" y="167.3" font-size="15" fill="#e4eaf5">9 caractères</text>
<rect x="14.0" y="195.3" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="225.3" font-size="16" fill="#61dafb" font-weight="700">B · Soleil!</text>
<text x="26.0" y="252.3" font-size="15" fill="#e4eaf5">7 caractères</text>
<rect x="14.0" y="280.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="310.4" font-size="16" fill="#61dafb" font-weight="700">C · cocotier-Pluie-47-banane</text>
<text x="26.0" y="337.4" font-size="15" fill="#e4eaf5">24 caractères</text>
</svg>
