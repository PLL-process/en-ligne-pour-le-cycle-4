<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 577" width="350" height="577" role="img" aria-labelledby="t_bandeau_cookies d_bandeau_cookies" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_bandeau_cookies">Ce site utilise des cookies</title>
<desc id="d_bandeau_cookies">Le bandeau de cookies d'un site, données simulées. Cookies essentiels, pour le panier et la connexion : toujours actifs. Mesure d'audience : à choisir. Publicité personnalisée : à choisir. Trois boutons : Tout accepter, Tout refuser sauf les essentiels, Personnaliser.</desc>
<rect width="350" height="577" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Ce site utilise des cookies</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le bandeau affiché à la première</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">visite (données simulées).</text>
<rect x="14.0" y="87.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Essentiels</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">Panier, connexion : toujours actifs.</text>
<rect x="14.0" y="172.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="202.4" font-size="16" fill="#61dafb" font-weight="700">Mesure d'audience</text>
<text x="26.0" y="229.4" font-size="15" fill="#e4eaf5">À choisir.</text>
<rect x="14.0" y="257.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="287.4" font-size="16" fill="#61dafb" font-weight="700">Publicité personnalisée</text>
<text x="26.0" y="314.4" font-size="15" fill="#e4eaf5">À choisir.</text>
<text x="14.0" y="368.7" font-size="15.5" fill="#61dafb" font-weight="700">Trois boutons</text>
<rect x="14.0" y="375.3" width="322.0" height="48.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="405.3" font-size="16" fill="#61dafb" font-weight="700">Tout accepter</text>
<rect x="14.0" y="439.3" width="322.0" height="48.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="469.3" font-size="16" fill="#61dafb" font-weight="700">Tout refuser sauf les essentiels</text>
<rect x="14.0" y="503.3" width="322.0" height="48.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="533.3" font-size="16" fill="#61dafb" font-weight="700">Personnaliser</text>
</svg>
