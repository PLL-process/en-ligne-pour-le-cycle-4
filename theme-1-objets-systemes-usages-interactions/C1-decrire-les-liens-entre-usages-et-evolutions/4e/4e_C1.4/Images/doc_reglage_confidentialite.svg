<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 331" width="350" height="331" role="img" aria-labelledby="t_reglage_confidentialite d_reglage_confidentialite" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_reglage_confidentialite">Qui peut voir tes publications ?</title>
<desc id="d_reglage_confidentialite">Le réglage « Qui peut voir tes publications ? » d'un compte, données simulées. Trois choix : Public, tout le monde, même sans compte ; Amis, les personnes que tu as acceptées ; Moi uniquement. Le choix coché est Public.</desc>
<rect width="350" height="331" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Qui peut voir tes publications ?</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le réglage d'un compte de réseau</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">social (données simulées).</text>
<rect x="14.0" y="87.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="117.4" font-size="16" fill="#ffb454" font-weight="700">◉ Public</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">Tout le monde, même sans compte.</text>
<rect x="14.0" y="172.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="202.4" font-size="16" fill="#61dafb" font-weight="700">○ Amis</text>
<text x="26.0" y="229.4" font-size="15" fill="#e4eaf5">Les personnes que tu as acceptées.</text>
<rect x="14.0" y="257.4" width="322.0" height="48.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="287.4" font-size="16" fill="#61dafb" font-weight="700">○ Moi uniquement</text>
</svg>
