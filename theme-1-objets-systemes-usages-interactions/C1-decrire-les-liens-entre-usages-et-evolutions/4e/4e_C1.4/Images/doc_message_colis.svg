<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 224" width="350" height="224" role="img" aria-labelledby="t_message_colis d_message_colis" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_message_colis">Un SMS reçu un dimanche</title>
<desc id="d_message_colis">Un SMS reçu un dimanche à 7 h 12, données simulées. Expéditeur : un numéro de portable inconnu. Texte : « Votre colis est bloqué. Réglez 1,99 € de frais de livraison avant ce soir : colis-suivi-livraison.top/payer ».</desc>
<rect width="350" height="224" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Un SMS reçu un dimanche</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">7 h 12 · d'un numéro de portable</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">inconnu (données simulées).</text>
<rect x="14.0" y="87.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Message</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">« Votre colis est bloqué. Réglez 1,99 € de</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">frais de livraison avant ce soir : »</text>
<text x="26.0" y="186.4" font-size="15" fill="#e4eaf5">colis-suivi-livraison.top/payer</text>
</svg>
