<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="td dd"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="td">Le moment où une donnée cesse d'être un chiffre et désigne quelqu'un</title>
  <desc id="dd">Trois panneaux qui suivent la même donnée. Premier panneau : la mesure. Un graphique
  montre que les mardis et jeudis à sept heures, la concentration de particules monte à
  soixante-sept microgrammes par mètre cube, contre vingt-six les autres jours. Le graphique est
  exact et ne désigne personne. Deuxième panneau : l'explication. En cherchant la cause, la classe
  découvre que la balayeuse mécanique passe dans la cour les mardis et jeudis à sept heures. Le fait
  est exact lui aussi — et il devient une information sur une personne, puisqu'une seule personne
  conduit cette balayeuse. Troisième panneau : la publication, et le choix. Trois façons de publier
  le même résultat. La première nomme l'agent et le montre en photo : exacte, et inacceptable — elle
  transforme une mesure d'air en accusation contre une personne identifiable. La deuxième dit
  simplement que la concentration monte les mardis et jeudis à sept heures, sans dire pourquoi :
  acceptable, mais inutile, car personne ne peut agir. La troisième dit que le pic correspond au
  nettoyage mécanique de la cour et propose de le déplacer avant l'arrivée des élèves : exacte,
  utile, et elle ne désigne personne — elle désigne une organisation. Une bande de conclusion
  rappelle qu'on n'a pas le choix des faits, qu'on a le choix de ce qu'on en publie, et que la
  question n'est pas est-ce vrai mais qui cela désigne, et pour quel effet.</desc>
  <rect width="900" height="460" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:12.5px}
    .ti{font-size:14.5px;font-weight:600}
    .lb{fill:#9bbefc;font-size:11.5px}
    .fl{stroke:#61dafb;stroke-width:2.5;fill:none;marker-end:url(#fd)}
  </style>
  <defs><marker id="fd" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#61dafb"/></marker></defs>
  <text x="26" y="28" font-size="17" font-weight="600">Quand une donnée cesse d'être un chiffre</text>

  <rect x="26" y="46" width="256" height="176" rx="12" fill="#0d2347" stroke="#3f6bb5" stroke-width="2"/>
  <text class="ti" x="42" y="72" fill="#8fb6ff">1 · La mesure</text>
  <line x1="52" y1="164" x2="266" y2="164" stroke="#9bbefc"/>
  <rect x="60" y="146" width="16" height="18" fill="#4fae7a"/>
  <rect x="90" y="102" width="16" height="62" fill="#ff7b88"/>
  <rect x="120" y="148" width="16" height="16" fill="#4fae7a"/>
  <rect x="150" y="100" width="16" height="64" fill="#ff7b88"/>
  <rect x="180" y="147" width="16" height="17" fill="#4fae7a"/>
  <rect x="210" y="150" width="16" height="14" fill="#4fae7a"/>
  <rect x="240" y="151" width="16" height="13" fill="#4fae7a"/>
  <text class="lb" x="56" y="180">L M M J V S D — à 7 h</text>
  <text x="42" y="202" font-size="11.5" fill="#ff9aa4"><tspan font-weight="600">67</tspan> µg/m³ mardi et jeudi,</text>
  <text x="42" y="218" font-size="11.5">26 les autres jours.</text>

  <rect x="322" y="46" width="256" height="176" rx="12" fill="#2b1a3f" stroke="#a077d8" stroke-width="2"/>
  <text class="ti" x="338" y="72" fill="#c68ef2">2 · L'explication</text>
  <text x="338" y="100" font-size="11.5">La classe cherche la cause.</text>
  <text x="338" y="126" font-size="11.5">La <tspan font-weight="600">balayeuse mécanique</tspan></text>
  <text x="338" y="143" font-size="11.5">passe dans la cour</text>
  <text x="338" y="160" font-size="11.5"><tspan font-weight="600">mardi et jeudi, à 7 h</tspan>.</text>
  <text x="338" y="188" font-size="11.5" fill="#ffd08a">Le fait est exact.</text>
  <text x="338" y="208" font-size="11.5" fill="#ff9aa4">Une seule personne la conduit.</text>

  <rect x="618" y="46" width="256" height="176" rx="12" fill="#2b1f0d" stroke="#ffb454" stroke-width="2"/>
  <text class="ti" x="634" y="72" fill="#ffd08a">3 · La publication</text>
  <text x="634" y="100" font-size="11.5">Le graphique va sur l'ENT.</text>
  <text x="634" y="126" font-size="11.5">Il sera lu par la direction,</text>
  <text x="634" y="143" font-size="11.5">les familles, les collègues</text>
  <text x="634" y="160" font-size="11.5">de la personne concernée.</text>
  <text x="634" y="190" font-size="12.5" fill="#ffd08a" font-weight="600">Ici, on a le choix.</text>
  <text x="634" y="210" font-size="11.5">Et le choix engage.</text>

  <path class="fl" d="M284 134 H 318"/>
  <path class="fl" d="M580 134 H 614"/>

  <text class="ti" x="26" y="252">Trois façons de publier le même résultat</text>

  <rect x="26" y="264" width="272" height="112" rx="10" fill="#3a1218" stroke="#ff7b88" stroke-width="2"/>
  <text x="42" y="288" font-size="12.5" font-weight="600" fill="#ff9aa4">A · avec le nom et la photo</text>
  <text x="42" y="310" font-size="11.5">«&#160;Le pic vient du passage de</text>
  <text x="42" y="327" font-size="11.5">M. ___, agent d'entretien.&#160;»</text>
  <text x="42" y="352" font-size="11.5" fill="#ff9aa4"><tspan font-weight="600">Exacte — et inacceptable.</tspan></text>
  <text x="42" y="368" font-size="11.5" fill="#ff9aa4">Une mesure d'air devient une accusation.</text>

  <rect x="314" y="264" width="272" height="112" rx="10" fill="#0b1b39" stroke="#25406e" stroke-width="2"/>
  <text x="330" y="288" font-size="12.5" font-weight="600" fill="#9bbefc">B · sans dire pourquoi</text>
  <text x="330" y="310" font-size="11.5">«&#160;La concentration monte les</text>
  <text x="330" y="327" font-size="11.5">mardis et jeudis à 7 h.&#160;»</text>
  <text x="330" y="352" font-size="11.5" fill="#9bbefc"><tspan font-weight="600">Acceptable — et inutile.</tspan></text>
  <text x="330" y="368" font-size="11.5" fill="#9bbefc">Personne ne peut rien en faire.</text>

  <rect x="602" y="264" width="272" height="112" rx="10" fill="#0d3320" stroke="#4fae7a" stroke-width="2"/>
  <text x="618" y="288" font-size="12.5" font-weight="600" fill="#81fba1">C · le fait, pas la personne</text>
  <text x="618" y="310" font-size="11.5">«&#160;Le pic correspond au nettoyage</text>
  <text x="618" y="327" font-size="11.5">mécanique. Le décaler avant</text>
  <text x="618" y="344" font-size="11.5">l'arrivée des élèves&#160;?&#160;»</text>
  <text x="618" y="368" font-size="11.5" fill="#81fba1"><tspan font-weight="600">Exacte, utile — et elle désigne</tspan></text>
  <text x="618" y="384" font-size="11.5" fill="#81fba1"><tspan font-weight="600">une organisation, pas quelqu'un.</tspan></text>

  <rect x="26" y="392" width="848" height="56" rx="10" fill="#122a52" stroke="#3f6bb5" stroke-width="2"/>
  <text x="42" y="416" font-size="14" font-weight="600" fill="#8fb6ff">On n'a pas le choix des faits. On a le choix de ce qu'on en publie.</text>
  <text x="42" y="438">La question n'est pas «&#160;est-ce vrai&#160;?&#160;» — les trois le sont. Elle est&#160;: <tspan font-weight="600">qui cela désigne, et pour quel effet&#160;?</tspan></text>
</svg>
