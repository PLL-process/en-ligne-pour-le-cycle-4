<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d"><title id="t">Choisir un graphique adapté</title><desc id="d">Un diagramme en colonnes convient pour comparer des salles, une courbe pour suivre le temps et un secteur est déconseillé pour ces moyennes.</desc><rect width="960" height="350" fill="#fff"/><g font-family="Arial"><text x="480" y="36" text-anchor="middle" font-size="27" font-weight="700">Quel graphique pour quelle question ?</text><g transform="translate(25 65)"><rect width="285" height="245" rx="14" fill="#eaf8ef" stroke="#136b3a" stroke-width="3"/><text x="142" y="33" text-anchor="middle" font-size="21" font-weight="700">Comparer des salles</text><line x1="45" y1="190" x2="245" y2="190" stroke="#172033" stroke-width="3"/><line x1="45" y1="70" x2="45" y2="190" stroke="#172033" stroke-width="3"/><rect x="70" y="105" width="35" height="85" fill="#175ca8"/><rect x="125" y="125" width="35" height="65" fill="#175ca8"/><rect x="180" y="90" width="35" height="100" fill="#175ca8"/><text x="142" y="225" text-anchor="middle" font-size="18">Colonnes ✓</text></g><g transform="translate(337 65)"><rect width="285" height="245" rx="14" fill="#eef5ff" stroke="#175ca8" stroke-width="3"/><text x="142" y="33" text-anchor="middle" font-size="21" font-weight="700">Suivre dans le temps</text><line x1="45" y1="190" x2="245" y2="190" stroke="#172033" stroke-width="3"/><line x1="45" y1="70" x2="45" y2="190" stroke="#172033" stroke-width="3"/><polyline points="55,165 95,140 135,150 175,110 220,90" fill="none" stroke="#175ca8" stroke-width="6"/><text x="142" y="225" text-anchor="middle" font-size="18">Courbe ✓</text></g><g transform="translate(649 65)"><rect width="285" height="245" rx="14" fill="#fff1ed" stroke="#b74220" stroke-width="3"/><text x="142" y="33" text-anchor="middle" font-size="21" font-weight="700">Comparer des moyennes</text><circle cx="142" cy="135" r="60" fill="#f2c27b" stroke="#172033" stroke-width="3"/><path d="M142 135L142 75A60 60 0 0 1 194 165Z" fill="#175ca8"/><line x1="142" y1="135" x2="142" y2="75" stroke="#172033" stroke-width="2"/><line x1="142" y1="135" x2="194" y2="165" stroke="#172033" stroke-width="2"/><text x="142" y="225" text-anchor="middle" font-size="18">Secteur ✗</text></g></g></svg>