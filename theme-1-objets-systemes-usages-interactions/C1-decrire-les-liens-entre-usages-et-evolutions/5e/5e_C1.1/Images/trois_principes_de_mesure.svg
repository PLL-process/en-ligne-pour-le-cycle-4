<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="tp dp"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="tp">Trois principes techniques pour une même fonction : mesurer la poussière dans l'air</title>
  <desc id="dp">Trois colonnes présentant trois façons différentes de remplir la même fonction
  technique, mesurer la concentration de poussières dans l'air. Premier principe, la diffusion
  optique : une diode éclaire l'air, les poussières diffusent la lumière et un photodétecteur la
  mesure ; elle répond en cinq secondes, avec une incertitude de dix pour cent, coûte vingt-cinq
  euros, consomme un virgule deux watt, mais s'encrasse et le collège ne peut pas l'entretenir
  lui-même. Deuxième principe, la gravimétrie : l'air traverse un filtre pendant vingt-quatre heures
  et l'on pèse le filtre avant et après ; l'incertitude n'est que de deux pour cent et la
  consommation de zéro virgule quatre watt, le collège peut changer le filtre lui-même, mais il faut
  attendre vingt-quatre heures pour un seul résultat, et l'appareil coûte neuf cents euros.
  Troisième principe, l'atténuation bêta : une source radioactive scellée traverse le dépôt de
  poussières et l'absorption donne la masse ; la réponse est horaire, l'incertitude de cinq pour
  cent, mais l'appareil coûte six mille cinq cents euros, consomme douze watts et relève d'un
  contrôle réglementaire que le collège ne peut pas assurer. Une bande de conclusion rappelle que la
  fonction est la même dans les trois colonnes — mesurer la poussière — et que ce qui change est le
  principe, c'est-à-dire le phénomène physique employé pour y parvenir ; et qu'aucun des trois n'est
  meilleur dans l'absolu, le choix dépendant de ce que l'on veut en faire.</desc>
  <rect width="900" height="480" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:12.5px}
    .ti{font-size:15px;font-weight:600}
    .lb{fill:#9bbefc;font-size:11.5px}
    .pl{fill:#81fba1;font-size:11.5px}
    .mi{fill:#ff9aa4;font-size:11.5px}
  </style>
  <text x="26" y="30" font-size="17" font-weight="600">Une seule fonction, trois principes</text>
  <text class="lb" x="26" y="50">Fonction technique&#160;: <tspan fill="#ffd08a" font-weight="600">mesurer la concentration de poussières dans l'air</tspan></text>

  <rect x="26" y="66" width="272" height="330" rx="12" fill="#0d2347" stroke="#3f6bb5" stroke-width="2"/>
  <text class="ti" x="42" y="94" fill="#8fb6ff">P1 · Diffusion optique</text>
  <text class="lb" x="42" y="114">un laser, et de la lumière</text>
  <text x="42" y="140" font-size="11.5">Une diode éclaire l'air&#160;;</text>
  <text x="42" y="157" font-size="11.5">les poussières diffusent la</text>
  <text x="42" y="174" font-size="11.5">lumière, un capteur la mesure.</text>
  <circle cx="70" cy="204" r="7" fill="#ffd08a"/>
  <path d="M78 204 H 200" stroke="#ffd08a" stroke-width="1.5"/>
  <circle cx="126" cy="196" r="2.5" fill="#9bbefc"/><circle cx="152" cy="212" r="2" fill="#9bbefc"/>
  <circle cx="176" cy="198" r="2.5" fill="#9bbefc"/>
  <rect x="206" y="196" width="16" height="16" fill="#61dafb"/>
  <text class="pl" x="42" y="248">+ réponse en <tspan font-weight="600">5 s</tspan></text>
  <text class="pl" x="42" y="266">+ <tspan font-weight="600">25 €</tspan>, 1,2 W</text>
  <text class="mi" x="42" y="292">− incertitude <tspan font-weight="600">± 10 %</tspan></text>
  <text class="mi" x="42" y="310">− s'encrasse&#160;: l'optique se</text>
  <text class="mi" x="42" y="327">salit et fausse la mesure</text>
  <text class="mi" x="42" y="352">− le collège ne peut pas</text>
  <text class="mi" x="42" y="369">l'entretenir (boîtier fermé)</text>

  <rect x="314" y="66" width="272" height="330" rx="12" fill="#0d3320" stroke="#4fae7a" stroke-width="2"/>
  <text class="ti" x="330" y="94" fill="#81fba1">P2 · Gravimétrie</text>
  <text class="lb" x="330" y="114">une balance, et du temps</text>
  <text x="330" y="140" font-size="11.5">L'air traverse un filtre</text>
  <text x="330" y="157" font-size="11.5">pendant 24 h&#160;; on pèse le</text>
  <text x="330" y="174" font-size="11.5">filtre avant et après.</text>
  <rect x="352" y="190" width="70" height="26" fill="#122a52" stroke="#9bbefc"/>
  <path d="M430 203 H 466" stroke="#61dafb" stroke-width="1.5"/>
  <path d="M474 214 h 44 M496 214 v -14 M482 200 h 28" stroke="#81fba1" stroke-width="2" fill="none"/>
  <text class="pl" x="330" y="248">+ incertitude <tspan font-weight="600">± 2 %</tspan></text>
  <text class="pl" x="330" y="266">+ <tspan font-weight="600">0,4 W</tspan> seulement</text>
  <text class="pl" x="330" y="284">+ le collège change le filtre</text>
  <text class="mi" x="330" y="310">− <tspan font-weight="600">24 h</tspan> pour UN résultat</text>
  <text class="mi" x="330" y="328">− <tspan font-weight="600">900 €</tspan></text>
  <text class="mi" x="330" y="354">− aucune alerte possible&#160;:</text>
  <text class="mi" x="330" y="371">on sait toujours la veille</text>

  <rect x="602" y="66" width="272" height="330" rx="12" fill="#2b1a3f" stroke="#a077d8" stroke-width="2"/>
  <text class="ti" x="618" y="94" fill="#c68ef2">P3 · Atténuation bêta</text>
  <text class="lb" x="618" y="114">une source, et de la physique</text>
  <text x="618" y="140" font-size="11.5">Un rayonnement traverse le</text>
  <text x="618" y="157" font-size="11.5">dépôt&#160;; ce qu'il perd en</text>
  <text x="618" y="174" font-size="11.5">route donne la masse.</text>
  <circle cx="646" cy="203" r="9" fill="#2b1f0d" stroke="#ffb454" stroke-width="1.5"/>
  <path d="M658 203 H 700" stroke="#c68ef2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="704" y="192" width="10" height="22" fill="#9bbefc"/>
  <path d="M718 203 H 758" stroke="#c68ef2" stroke-width="1.5" stroke-dasharray="4 3" opacity=".5"/>
  <rect x="762" y="194" width="14" height="18" fill="#61dafb"/>
  <text class="pl" x="618" y="248">+ réponse en <tspan font-weight="600">1 h</tspan></text>
  <text class="pl" x="618" y="266">+ incertitude ± 5 %</text>
  <text class="pl" x="618" y="284">+ insensible à l'encrassement</text>
  <text class="mi" x="618" y="310">− <tspan font-weight="600">6 500 €</tspan>, 12 W</text>
  <text class="mi" x="618" y="336">− source radioactive scellée&#160;:</text>
  <text class="mi" x="618" y="353">contrôle réglementaire, hors</text>
  <text class="mi" x="618" y="370">de portée d'un collège</text>

  <rect x="26" y="410" width="848" height="60" rx="10" fill="#2b1f0d" stroke="#ffb454" stroke-width="2"/>
  <text x="42" y="434" font-size="14.5" font-weight="600" fill="#ffd08a">La fonction ne change pas — le principe, si</text>
  <text x="42" y="458">Les trois mesurent la poussière. Ce qui diffère, c'est le <tspan font-weight="600">phénomène physique</tspan> employé — et aucun n'est meilleur&#160;: cela dépend de ce qu'on veut en faire.</text>
</svg>
