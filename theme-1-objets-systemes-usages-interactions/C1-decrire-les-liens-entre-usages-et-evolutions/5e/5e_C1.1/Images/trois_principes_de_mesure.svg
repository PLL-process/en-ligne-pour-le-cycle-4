<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" role="img" aria-labelledby="tp dp"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="tp">Trois principes techniques pour une même fonction : mesurer la poussière dans l'air</title>
  <desc id="dp">Trois colonnes présentant trois façons de remplir la même fonction technique, mesurer la concentration de poussières dans l'air. P1, observer la lumière (diffusion optique) : une petite lampe éclaire l'air, chaque grain de poussière renvoie un éclat de lumière sur le côté et un capteur compte ces éclats ; comme la poussière qui danse dans un rayon de soleil ; réponse en cinq secondes, vingt-cinq euros, mais plus ou moins dix pour cent et la lentille s'encrasse sans prévenir. P2, peser un filtre (gravimétrie) : l'air traverse un filtre pendant vingt-quatre heures, on pèse le filtre avant et après, la différence est la poussière ; comme peser le sac de l'aspirateur ; plus ou moins deux pour cent et le collège change le filtre, mais vingt-quatre heures pour un seul résultat et neuf cents euros. P3, freiner un rayonnement (atténuation bêta) : une source scellée envoie un rayonnement à travers un dépôt de poussière vers un compteur, plus le dépôt est épais moins il en passe ; comme une lampe torche derrière un rideau ; une mesure par heure, plus ou moins cinq pour cent, automatique, mais six mille cinq cents euros et une source radioactive soumise à un contrôle réglementaire hors de portée d'un collège. Une bande de conclusion rappelle que la fonction ne change pas, que le principe change, et qu'aucun n'est meilleur dans l'absolu : cela dépend de ce qu'on veut en faire.</desc>
  <rect width="900" height="426" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:12.5px}
    .sm{fill:#9bbefc}
    .pl{fill:#81fba1;font-size:11.5px}
    .mi{fill:#ff9aa4;font-size:11.5px}
    .lb{fill:#e4eaf5;font-size:11.5px}.sm{fill:#9bbefc;font-size:10px}
    .box{fill:#122a52;stroke:#7d9bd6}.lamp{fill:#ffd08a}.beam{stroke:#ffd08a;stroke-width:2.5}
    .beamhead{fill:#ffd08a}.dust{fill:#9bbefc}.ray{stroke:#ffd08a;stroke-width:1;stroke-dasharray:3 2;opacity:.8}
    .det{fill:#61dafb}.detlb{fill:#052033;font-size:10px;font-weight:600}
    .filtre{fill:#f4f6fb;stroke:#7d9bd6;stroke-width:1.5}.dustdark{fill:#4b5a78}
    .arrow{stroke:#9bbefc;stroke-width:1.5}.arrowhead{fill:#9bbefc}.balance{stroke:#81fba1;stroke-width:2.5;fill:none}
    .src{fill:#2b1f0d;stroke:#ffb454;stroke-width:1.5}.srclb{fill:#ffb454;font-size:13px}
    .rad{stroke:#c68ef2;stroke-width:1.2;stroke-dasharray:4 3}.depot{fill:#4b5a78;stroke:#9bbefc}

  </style>
  <text x="24" y="30" font-size="17" font-weight="600">Une seule fonction, trois principes</text>
  <text x="24" y="50" class="sm" font-size="11.5">Fonction technique&#160;: <tspan fill="#ffd08a" font-weight="600">mesurer la concentration de poussières dans l'air</tspan></text>
  
  <g transform="translate(24 70)">
    <rect width="268" height="262" rx="12" fill="#0d2347" stroke="#3f6bb5" stroke-width="2"/>
    <text x="14" y="26" font-size="15" font-weight="600" fill="#8fb6ff">P1 · Observer la lumière</text>
    <text x="14" y="44" class="sm" font-size="11.5">diffusion optique</text>
    <g transform="translate(14 54) scale(0.6)">
      <rect width="400" height="170" rx="8" fill="#050f24"/>
  <text x="8" y="16" class="lb">① une petite lampe</text>
  <rect x="14" y="52" width="34" height="30" rx="6" class="box"/>
  <circle cx="52" cy="67" r="7" class="lamp"/>
  <path d="M60 67 H 250" class="beam"/>
  <path d="M250 60 l 12 7 l -12 7 z" class="beamhead"/>
  <text x="96" y="44" class="lb">② des grains de poussière dans le faisceau</text>
  <circle cx="118" cy="66" r="3" class="dust"/><circle cx="140" cy="74" r="2.5" class="dust"/><circle cx="160" cy="62" r="3" class="dust"/><circle cx="182" cy="72" r="2.5" class="dust"/><circle cx="204" cy="65" r="3" class="dust"/><path d="M118 66 L161 118" class="ray"/><path d="M140 74 L168 118" class="ray"/><path d="M160 62 L175 118" class="ray"/><path d="M182 72 L182 118" class="ray"/><path d="M204 65 L189 118" class="ray"/>
  <rect x="150" y="118" width="60" height="22" rx="4" class="det"/>
  <text x="180" y="133" text-anchor="middle" class="detlb">capteur</text>
  <text x="8" y="160" class="lb">③ un capteur compte les éclats renvoyés sur le côté</text>
    </g>
    <text x="14" y="176" class="sm" font-size="11">🔎 Comme la poussière qu'on voit danser</text>
    <text x="14" y="191" class="sm" font-size="11">dans un rayon de soleil : on ne voit pas</text>
    <text x="14" y="206" class="sm" font-size="11">la lumière, on voit ce qu'elle éclaire.</text>
    <text x="14" y="232" class="pl">+ réponse en 5 s · 25 €</text>
    <text x="14" y="252" class="mi">− ± 10 % · s'encrasse sans prévenir</text>
  </g>
  <g transform="translate(316 70)">
    <rect width="268" height="262" rx="12" fill="#0d3320" stroke="#4fae7a" stroke-width="2"/>
    <text x="14" y="26" font-size="15" font-weight="600" fill="#81fba1">P2 · Peser un filtre</text>
    <text x="14" y="44" class="sm" font-size="11.5">gravimétrie</text>
    <g transform="translate(14 54) scale(0.6)">
      <rect width="400" height="170" rx="8" fill="#050f24"/>
  <text x="8" y="16" class="lb">① l'air traverse un filtre pendant 24 h</text>
  <path d="M10 68 H 60" class="beam"/><path d="M60 61 l 12 7 l -12 7 z" class="beamhead"/>
  <text x="14" y="58" class="sm">air</text>
  <circle cx="102" cy="68" r="24" class="filtre"/>
  <text x="102" y="104" text-anchor="middle" class="sm">avant : filtre propre</text>
  <path d="M136 68 H 176" class="arrow"/><path d="M176 62 l 10 6 l -10 6 z" class="arrowhead"/>
  <circle cx="218" cy="68" r="24" class="filtre"/><circle cx="206" cy="60" r="1.6" class="dustdark"/><circle cx="214" cy="70" r="1.6" class="dustdark"/><circle cx="222" cy="58" r="1.6" class="dustdark"/><circle cx="210" cy="80" r="1.6" class="dustdark"/><circle cx="226" cy="74" r="1.6" class="dustdark"/><circle cx="218" cy="66" r="1.6" class="dustdark"/><circle cx="230" cy="84" r="1.6" class="dustdark"/><circle cx="204" cy="72" r="1.6" class="dustdark"/>
  <text x="218" y="104" text-anchor="middle" class="sm">après : filtre chargé</text>
  <path d="M300 92 h 48 M324 92 v -18 M308 74 h 32" class="balance"/>
  <text x="324" y="108" text-anchor="middle" class="sm">balance</text>
  <text x="8" y="136" class="lb">② on pèse le filtre avant, puis après</text>
  <text x="8" y="158" class="lb">③ la différence, c'est la poussière récoltée</text>
    </g>
    <text x="14" y="176" class="sm" font-size="11">🔎 Comme peser le sac de l'aspirateur avant</text>
    <text x="14" y="191" class="sm" font-size="11">et après le ménage.</text>
    <text x="14" y="206" class="sm" font-size="11"></text>
    <text x="14" y="232" class="pl">+ ± 2 % · le collège change le filtre</text>
    <text x="14" y="252" class="mi">− 24 h pour UN résultat · 900 €</text>
  </g>
  <g transform="translate(608 70)">
    <rect width="268" height="262" rx="12" fill="#2b1a3f" stroke="#a077d8" stroke-width="2"/>
    <text x="14" y="26" font-size="15" font-weight="600" fill="#c68ef2">P3 · Freiner un rayonnement</text>
    <text x="14" y="44" class="sm" font-size="11.5">atténuation bêta</text>
    <g transform="translate(14 54) scale(0.6)">
      <rect width="400" height="170" rx="8" fill="#050f24"/>
  <text x="8" y="16" class="lb">① une source scellée envoie un rayonnement</text>
  <rect x="20" y="39" width="30" height="22" rx="4" class="src"/><text x="35" y="54" text-anchor="middle" class="srclb">☢</text><path d="M56 44 H 128" class="rad"/><path d="M56 50 H 128" class="rad"/><path d="M56 56 H 128" class="rad"/><rect x="132" y="36" width="6" height="28" class="depot"/><path d="M140 44 H 200" class="rad"/><path d="M140 50 H 200" class="rad"/><path d="M140 56 H 200" class="rad"/><rect x="204" y="39" width="58" height="22" rx="4" class="det"/><text x="233" y="54" text-anchor="middle" class="detlb">compteur</text>
  <text x="268" y="47" class="sm" style="font-size:9.5px">peu de poussière :</text><text x="268" y="59" class="sm" style="font-size:9.5px">il en passe beaucoup</text>
  <rect x="20" y="91" width="30" height="22" rx="4" class="src"/><text x="35" y="106" text-anchor="middle" class="srclb">☢</text><path d="M56 96 H 128" class="rad"/><path d="M56 102 H 128" class="rad"/><path d="M56 108 H 128" class="rad"/><rect x="132" y="88" width="16" height="28" class="depot"/><path d="M150 102 H 200" class="rad"/><rect x="204" y="91" width="58" height="22" rx="4" class="det"/><text x="233" y="106" text-anchor="middle" class="detlb">compteur</text>
  <text x="268" y="99" class="sm" style="font-size:9.5px">beaucoup de poussière :</text><text x="268" y="111" class="sm" style="font-size:9.5px">il en passe peu</text>
  <text x="8" y="140" class="lb">② l'air dépose sa poussière sur une bande de papier</text>
  <text x="8" y="160" class="lb">③ moins il en passe, plus le dépôt est lourd</text>
    </g>
    <text x="14" y="176" class="sm" font-size="11">🔎 Comme une lampe torche derrière un</text>
    <text x="14" y="191" class="sm" font-size="11">rideau : plus le rideau est épais, moins</text>
    <text x="14" y="206" class="sm" font-size="11">la lumière passe.</text>
    <text x="14" y="232" class="pl">+ 1 h · ± 5 % · automatique</text>
    <text x="14" y="252" class="mi">− 6 500 € · radioactif, donc réglementé</text>
  </g>
  <rect x="24" y="346" width="852" height="66" rx="10" fill="#2b1f0d" stroke="#ffb454" stroke-width="2"/>
  <text x="42" y="368" font-size="14.5" font-weight="600" fill="#ffd08a">La fonction ne change pas — le principe, si</text>
  <text x="42" y="388">Les trois mesurent la poussière. Ce qui diffère, c'est le <tspan font-weight="600">phénomène physique</tspan> employé —</text>
  <text x="42" y="404">et aucun n'est meilleur&#160;: cela dépend de ce qu'on veut en faire.</text>
</svg>
