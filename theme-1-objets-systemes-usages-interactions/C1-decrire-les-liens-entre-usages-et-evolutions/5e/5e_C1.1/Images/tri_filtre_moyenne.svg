<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d"><title id="t">Trier, filtrer et calculer dans un tableur</title><desc id="d">Trois mini-tableaux illustrent le tri décroissant, le filtre sur une salle et le calcul de la moyenne.</desc><rect width="960" height="330" fill="#fff"/><g font-family="Arial"><text x="480" y="38" text-anchor="middle" font-size="27" font-weight="700">Trois opérations, trois objectifs</text><g transform="translate(25 70)"><rect width="285" height="220" rx="14" fill="#eef5ff" stroke="#175ca8" stroke-width="3"/><text x="142" y="35" text-anchor="middle" font-size="22" font-weight="700">TRIER</text><text x="142" y="65" text-anchor="middle" font-size="17">ordonner toutes les lignes</text><g font-size="18"><text x="55" y="105">Techno</text><text x="210" y="105">31 °C</text><text x="55" y="140">Maths</text><text x="210" y="140">30 °C</text><text x="55" y="175">SVT</text><text x="210" y="175">29 °C</text></g></g><g transform="translate(337 70)"><rect width="285" height="220" rx="14" fill="#f5f8ed" stroke="#39713d" stroke-width="3"/><text x="142" y="35" text-anchor="middle" font-size="22" font-weight="700">FILTRER</text><text x="142" y="65" text-anchor="middle" font-size="17">n'afficher qu'un critère</text><rect x="45" y="90" width="195" height="42" fill="#fff" stroke="#39713d"/><text x="142" y="117" text-anchor="middle" font-size="18">Salle = Technologie</text><text x="142" y="165" text-anchor="middle" font-size="18">3 lignes visibles</text><text x="142" y="194" text-anchor="middle" font-size="16">les autres sont masquées</text></g><g transform="translate(649 70)"><rect width="285" height="220" rx="14" fill="#fff4dc" stroke="#a76600" stroke-width="3"/><text x="142" y="35" text-anchor="middle" font-size="22" font-weight="700">CALCULER</text><text x="142" y="65" text-anchor="middle" font-size="17">résumer automatiquement</text><text x="142" y="115" text-anchor="middle" font-size="19">=MOYENNE(D2:D13)</text><text x="142" y="160" text-anchor="middle" font-size="31" font-weight="700">29,5 °C</text><text x="142" y="195" text-anchor="middle" font-size="16">le résultat se met à jour</text></g></g></svg>