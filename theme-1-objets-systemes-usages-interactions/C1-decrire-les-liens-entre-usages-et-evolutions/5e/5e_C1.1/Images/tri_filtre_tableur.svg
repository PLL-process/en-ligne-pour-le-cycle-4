<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Différence entre trier et filtrer dans un tableur</title><desc id="desc">À gauche, un tri classe toutes les lignes par température croissante. À droite, un filtre n'affiche que les mesures supérieures ou égales à 29 degrés.</desc><rect width="960" height="440" rx="24" fill="#f7fbff"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="240" y="48" text-anchor="middle" font-size="32" font-weight="700">TRIER</text><text x="720" y="48" text-anchor="middle" font-size="32" font-weight="700">FILTRER</text><text x="240" y="80" text-anchor="middle" font-size="21">Toutes les lignes restent visibles</text><text x="720" y="80" text-anchor="middle" font-size="21">Seules les lignes répondant au critère restent visibles</text><g font-size="22"><rect x="65" y="110" width="350" height="250" fill="#fff" stroke="#17324d" stroke-width="4"/><path d="M65 160H415M65 210H415M65 260H415M65 310H415M225 110V360" stroke="#17324d" stroke-width="2"/><text x="145" y="145">Heure</text><text x="290" y="145">Température</text><text x="145" y="195">13:45</text><text x="290" y="195">27,8</text><text x="145" y="245">14:00</text><text x="290" y="245">28,4</text><text x="145" y="295">14:15</text><text x="290" y="295">28,9</text><text x="145" y="345">14:30</text><text x="290" y="345">29,3</text><rect x="545" y="110" width="350" height="200" fill="#fff" stroke="#17324d" stroke-width="4"/><path d="M545 160H895M545 210H895M545 260H895M705 110V310" stroke="#17324d" stroke-width="2"/><text x="625" y="145">Heure</text><text x="770" y="145">Température</text><text x="625" y="195">14:30</text><text x="770" y="195">29,3</text><text x="625" y="245">14:45</text><text x="770" y="245">29,8</text><text x="625" y="295">15:00</text><text x="770" y="295">30,1</text></g><rect x="610" y="330" width="220" height="52" rx="12" fill="#ffecb3" stroke="#17324d" stroke-width="3"/><text x="720" y="364" text-anchor="middle" font-size="24" font-weight="700">Critère : ≥ 29 °C</text><text x="480" y="420" text-anchor="middle" font-size="22">Trier change l’ordre ; filtrer masque temporairement certaines lignes.</text></g></svg>