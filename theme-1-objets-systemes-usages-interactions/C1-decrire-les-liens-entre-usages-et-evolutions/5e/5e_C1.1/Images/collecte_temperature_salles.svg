<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Collecte de températures dans quatre salles</title><desc id="d">Quatre salles du collège avec des températures différentes à organiser dans un tableur.</desc><rect width="900" height="420" fill="#fff"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Relevés à 14 h</text><g font-family="Arial" font-size="22" text-anchor="middle"><g transform="translate(40 80)"><rect width="180" height="250" rx="18" fill="#e8f3ff" stroke="#175ca8" stroke-width="4"/><text x="90" y="50">Technologie</text><circle cx="90" cy="125" r="48" fill="#fff" stroke="#172033" stroke-width="4"/><text x="90" y="134" font-size="30" font-weight="700">31 °C</text><text x="90" y="215">Humidité 68 %</text></g><g transform="translate(250 80)"><rect width="180" height="250" rx="18" fill="#f3f8ed" stroke="#39713d" stroke-width="4"/><text x="90" y="50">SVT</text><circle cx="90" cy="125" r="48" fill="#fff" stroke="#172033" stroke-width="4"/><text x="90" y="134" font-size="30" font-weight="700">29 °C</text><text x="90" y="215">Humidité 72 %</text></g><g transform="translate(460 80)"><rect width="180" height="250" rx="18" fill="#fff4dc" stroke="#a76600" stroke-width="4"/><text x="90" y="50">Maths</text><circle cx="90" cy="125" r="48" fill="#fff" stroke="#172033" stroke-width="4"/><text x="90" y="134" font-size="30" font-weight="700">30 °C</text><text x="90" y="215">Humidité 65 %</text></g><g transform="translate(670 80)"><rect width="180" height="250" rx="18" fill="#f7ebf7" stroke="#7b3d7e" stroke-width="4"/><text x="90" y="50">Français</text><circle cx="90" cy="125" r="48" fill="#fff" stroke="#172033" stroke-width="4"/><text x="90" y="134" font-size="30" font-weight="700">28 °C</text><text x="90" y="215">Humidité 70 %</text></g></g><text x="450" y="385" text-anchor="middle" font-family="Arial" font-size="22">Comment comparer ces mesures sans se tromper ?</text></svg>