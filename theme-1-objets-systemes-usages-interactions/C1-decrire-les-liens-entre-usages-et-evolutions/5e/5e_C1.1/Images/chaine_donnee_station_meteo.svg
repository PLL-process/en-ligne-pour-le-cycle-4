<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Chaîne de données d’une station météo scolaire</title>
  <desc id="desc">Un capteur mesure la température, le microcontrôleur enregistre la valeur, un tableur trie les données et un graphique aide à prendre une décision.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#263238"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#263238;stroke-width:4;rx:24}.head{font:700 28px Arial,sans-serif;fill:#111}.txt{font:22px Arial,sans-serif;fill:#222}.small{font:19px Arial,sans-serif;fill:#333}.arrow{stroke:#263238;stroke-width:5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="420" fill="#f5f7fa"/>
  <text x="600" y="48" text-anchor="middle" class="head">De la mesure à la décision</text>
  <rect class="box" x="35" y="105" width="230" height="220"/>
  <circle cx="150" cy="172" r="42" fill="none" stroke="#263238" stroke-width="5"/>
  <line x1="150" y1="130" x2="150" y2="194" stroke="#263238" stroke-width="6"/>
  <circle cx="150" cy="213" r="17" fill="#fff" stroke="#263238" stroke-width="5"/>
  <text x="150" y="265" text-anchor="middle" class="head">Collecter</text>
  <text x="150" y="296" text-anchor="middle" class="small">Capteur : 28 °C</text>

  <line class="arrow" x1="270" y1="215" x2="335" y2="215"/>

  <rect class="box" x="350" y="105" width="230" height="220"/>
  <rect x="420" y="145" width="90" height="70" fill="none" stroke="#263238" stroke-width="5" rx="10"/>
  <circle cx="442" cy="180" r="7" fill="#263238"/><circle cx="465" cy="180" r="7" fill="#263238"/><circle cx="488" cy="180" r="7" fill="#263238"/>
  <text x="465" y="265" text-anchor="middle" class="head">Stocker</text>
  <text x="465" y="296" text-anchor="middle" class="small">Une ligne par mesure</text>

  <line class="arrow" x1="585" y1="215" x2="650" y2="215"/>

  <rect class="box" x="665" y="105" width="230" height="220"/>
  <rect x="720" y="140" width="120" height="86" fill="none" stroke="#263238" stroke-width="5"/>
  <line x1="760" y1="140" x2="760" y2="226" stroke="#263238" stroke-width="3"/><line x1="800" y1="140" x2="800" y2="226" stroke="#263238" stroke-width="3"/>
  <line x1="720" y1="169" x2="840" y2="169" stroke="#263238" stroke-width="3"/><line x1="720" y1="198" x2="840" y2="198" stroke="#263238" stroke-width="3"/>
  <text x="780" y="265" text-anchor="middle" class="head">Trier / calculer</text>
  <text x="780" y="296" text-anchor="middle" class="small">Tableur : MIN, MAX, moyenne</text>

  <line class="arrow" x1="900" y1="215" x2="965" y2="215"/>

  <rect class="box" x="980" y="105" width="185" height="220"/>
  <polyline points="1015,220 1045,185 1080,202 1125,145" fill="none" stroke="#263238" stroke-width="6"/>
  <line x1="1015" y1="230" x2="1135" y2="230" stroke="#263238" stroke-width="4"/>
  <line x1="1015" y1="230" x2="1015" y2="140" stroke="#263238" stroke-width="4"/>
  <text x="1072" y="265" text-anchor="middle" class="head">Analyser</text>
  <text x="1072" y="296" text-anchor="middle" class="small">Décider : aérer ?</text>

  <text x="600" y="380" text-anchor="middle" class="txt">Une donnée devient utile lorsqu’elle est contextualisée, organisée et interprétée.</text>
</svg>