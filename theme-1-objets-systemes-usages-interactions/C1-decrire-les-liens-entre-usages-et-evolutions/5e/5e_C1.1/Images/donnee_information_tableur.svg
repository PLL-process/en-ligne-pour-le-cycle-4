<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">De la donnée à l'information</title><desc id="d">Une mesure brute est associée à un contexte puis contrôlée pour devenir une information exploitable.</desc><rect width="900" height="300" fill="#fff"/><g font-family="Arial" text-anchor="middle"><rect x="40" y="80" width="210" height="130" rx="18" fill="#fff4dc" stroke="#a76600" stroke-width="4"/><text x="145" y="125" font-size="24" font-weight="700">Donnée brute</text><text x="145" y="170" font-size="34">31</text><path d="M270 145h110" stroke="#172033" stroke-width="6" marker-end="url(#a)"/><rect x="390" y="80" width="210" height="130" rx="18" fill="#e8f3ff" stroke="#175ca8" stroke-width="4"/><text x="495" y="120" font-size="24" font-weight="700">Contexte</text><text x="495" y="158" font-size="20">31 °C · salle techno</text><text x="495" y="187" font-size="20">14 h · mesure validée</text><path d="M620 145h80" stroke="#172033" stroke-width="6" marker-end="url(#a)"/><rect x="710" y="80" width="150" height="130" rx="18" fill="#eaf8ef" stroke="#136b3a" stroke-width="4"/><text x="785" y="125" font-size="23" font-weight="700">Information</text><text x="785" y="168" font-size="20">Salle trop chaude</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#172033"/></marker></defs></svg>