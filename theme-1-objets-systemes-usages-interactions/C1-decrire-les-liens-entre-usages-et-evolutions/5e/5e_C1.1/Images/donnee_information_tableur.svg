<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">De la donnée à l'information</title><desc id="d">Trois cadres reliés par deux flèches. Une donnée brute, 31 : un nombre seul. On y ajoute son contexte, 31 °C dans la salle techno à 14 h, mesure validée. On obtient une information : la salle est trop chaude.</desc><defs><marker id="a" markerWidth="16" markerHeight="16" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs><rect width="900" height="300" fill="#fff"/><g font-family="Arial" text-anchor="middle"><rect x="30" y="60" width="240" height="140" rx="18" fill="#fff4dc" stroke="#a76600" stroke-width="4"/><text x="150" y="102" font-size="24" font-weight="700" fill="#172033">Donnée brute</text><text x="150" y="152" font-size="34" fill="#172033">31</text><text x="150" y="240" font-size="18" font-style="italic" fill="#4a5568">un nombre seul : 31 quoi ?</text><rect x="330" y="60" width="240" height="140" rx="18" fill="#e8f3ff" stroke="#175ca8" stroke-width="4"/><text x="450" y="102" font-size="24" font-weight="700" fill="#172033">Contexte</text><text x="450" y="142" font-size="20" fill="#172033">31 °C · salle techno</text><text x="450" y="172" font-size="20" fill="#172033">14 h · mesure validée</text><text x="450" y="240" font-size="18" font-style="italic" fill="#4a5568">on ajoute : quoi, où, quand</text><rect x="630" y="60" width="240" height="140" rx="18" fill="#eaf8ef" stroke="#136b3a" stroke-width="4"/><text x="750" y="102" font-size="24" font-weight="700" fill="#172033">Information</text><text x="750" y="152" font-size="21" fill="#172033">Salle trop chaude</text><text x="750" y="240" font-size="18" font-style="italic" fill="#4a5568">on comprend, on peut agir</text><path d="M276 130h36" stroke="#172033" stroke-width="5" marker-end="url(#a)"/><path d="M576 130h36" stroke="#172033" stroke-width="5" marker-end="url(#a)"/></g></svg>
