<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" width="660" height="240" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<title id="t">Les symboles de licence</title>
<desc id="d">Quatre pictogrammes : le copyright pour tous droits réservés, Creative Commons pour une réutilisation libre sous conditions, CC zéro pour le domaine public, et le symbole de marque déposée. Une image trouvée en ligne est protégée par défaut.</desc>
<rect width="660" height="240" fill="#ffffff"/>
<circle cx="90" cy="80" r="34" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="90" y="89" font-size="26" text-anchor="middle" fill="#1d4e89" font-weight="700">©</text><text x="90" y="138" font-size="12" text-anchor="middle" fill="#64748b">tous droits réservés</text><circle cx="250" cy="80" r="34" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="250" y="89" font-size="26" text-anchor="middle" fill="#1d4e89" font-weight="700">CC</text><text x="250" y="138" font-size="12" text-anchor="middle" fill="#64748b">libre, sous conditions</text><circle cx="410" cy="80" r="34" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="410" y="89" font-size="26" text-anchor="middle" fill="#1d4e89" font-weight="700">0</text><text x="410" y="138" font-size="12" text-anchor="middle" fill="#64748b">dans le domaine public</text><circle cx="570" cy="80" r="34" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="570" y="89" font-size="26" text-anchor="middle" fill="#1d4e89" font-weight="700">™</text><text x="570" y="138" font-size="12" text-anchor="middle" fill="#64748b">marque déposée</text><text x="330" y="190" font-size="13" text-anchor="middle" fill="#c2410c" font-weight="700">une image trouvée en ligne n'est PAS libre par défaut</text><text x="330" y="215" font-size="12" text-anchor="middle" fill="#64748b">c'est l'inverse : elle est protégée tant qu'on n'a pas dit le contraire</text>
</svg>
