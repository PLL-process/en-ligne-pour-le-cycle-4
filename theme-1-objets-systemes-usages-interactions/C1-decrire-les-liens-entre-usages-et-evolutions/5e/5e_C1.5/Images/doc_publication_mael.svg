<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 415" width="350" height="415" role="img" aria-labelledby="t_publication_mael d_publication_mael" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_publication_mael">Une publication du compte du club</title>
<desc id="d_publication_mael">La publication du compte du club techno. Photo : Maël, de face, au premier plan, devant le jardin du collège. Légende : « Bravo à Maël, 5e B, pour le potager ! Club techno du collège des Flamboyants. » 48 « j'aime ». Données simulées.</desc>
<rect width="350" height="415" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Une publication du compte du club</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Ce que voit toute personne qui</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">ouvre le compte (données simulées).</text>
<rect x="14.0" y="87.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Photo</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">Maël, de face, au premier plan, devant le</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">jardin du collège.</text>
<rect x="14.0" y="193.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="223.4" font-size="16" fill="#61dafb" font-weight="700">Légende</text>
<text x="26.0" y="250.4" font-size="15" fill="#e4eaf5">« Bravo à Maël, 5e B, pour le potager !</text>
<text x="26.0" y="271.4" font-size="15" fill="#e4eaf5">Club techno du collège des</text>
<text x="26.0" y="292.4" font-size="15" fill="#e4eaf5">Flamboyants. »</text>
<rect x="14.0" y="320.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="350.4" font-size="16" fill="#61dafb" font-weight="700">Réactions</text>
<text x="26.0" y="377.4" font-size="15" fill="#e4eaf5">48 « j'aime »</text>
</svg>
