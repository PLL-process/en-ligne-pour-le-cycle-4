<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Comparer deux principes de freinage</title><desc id="desc">À gauche un frein à patins serre la jante, à droite un frein à disque serre un disque fixé à la roue.</desc><rect width="900" height="420" rx="32" fill="#f8fafc"/><text x="225" y="54" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="700" fill="#0f172a">Frein à patins</text><text x="675" y="54" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="700" fill="#0f172a">Frein à disque</text><circle cx="225" cy="235" r="125" fill="none" stroke="#334155" stroke-width="18"/><circle cx="225" cy="235" r="18" fill="#334155"/><path d="M122 135 L165 205 M328 135 L285 205" stroke="#0891b2" stroke-width="18" stroke-linecap="round"/><rect x="147" y="185" width="34" height="70" rx="10" fill="#0e7490" transform="rotate(-15 164 220)"/><rect x="269" y="185" width="34" height="70" rx="10" fill="#0e7490" transform="rotate(15 286 220)"/><path d="M180 95 L270 95" stroke="#64748b" stroke-width="12"/><circle cx="675" cy="235" r="125" fill="none" stroke="#334155" stroke-width="18"/><circle cx="675" cy="235" r="78" fill="none" stroke="#7c3aed" stroke-width="14" stroke-dasharray="18 10"/><circle cx="675" cy="235" r="18" fill="#334155"/><rect x="735" y="175" width="55" height="120" rx="16" fill="#6d28d9"/><path d="M450 80 V360" stroke="#cbd5e1" stroke-width="4"/><text x="225" y="392" text-anchor="middle" font-family="system-ui" font-size="22" fill="#334155">Frottement sur la jante</text><text x="675" y="392" text-anchor="middle" font-family="system-ui" font-size="22" fill="#334155">Frottement sur un disque</text></svg>