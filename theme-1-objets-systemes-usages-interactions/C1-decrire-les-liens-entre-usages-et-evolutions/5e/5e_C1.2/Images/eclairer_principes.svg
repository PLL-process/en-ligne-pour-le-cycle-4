<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Deux principes pour éclairer</title><desc id="desc">Une lampe à filament transforme l'électricité en chaleur puis en lumière, une LED produit la lumière par électroluminescence.</desc><rect width="900" height="420" rx="32" fill="#f8fafc"/><text x="225" y="54" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="700" fill="#0f172a">Lampe à filament</text><text x="675" y="54" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="700" fill="#0f172a">Lampe LED</text><path d="M225 95 C140 95 120 190 170 245 C195 274 200 300 200 320 H250 C250 300 255 274 280 245 C330 190 310 95 225 95Z" fill="#fde68a" stroke="#92400e" stroke-width="9"/><path d="M185 205 C205 155 245 255 265 205" fill="none" stroke="#b45309" stroke-width="8"/><rect x="190" y="320" width="70" height="45" rx="8" fill="#94a3b8"/><path d="M675 95 C590 95 570 190 620 245 C645 274 650 300 650 320 H700 C700 300 705 274 730 245 C780 190 760 95 675 95Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="9"/><path d="M640 220 h70" stroke="#1d4ed8" stroke-width="10"/><path d="M655 185 v70 M695 185 v70" stroke="#1d4ed8" stroke-width="8"/><rect x="640" y="320" width="70" height="45" rx="8" fill="#94a3b8"/><path d="M450 80 V360" stroke="#cbd5e1" stroke-width="4"/><text x="225" y="398" text-anchor="middle" font-family="system-ui" font-size="21" fill="#334155">Chauffage d'un filament</text><text x="675" y="398" text-anchor="middle" font-family="system-ui" font-size="21" fill="#334155">Électroluminescence</text></svg>