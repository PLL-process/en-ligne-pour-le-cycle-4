<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="tf df"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="tf">Corrigé — une seule fonction, trois principes de freinage, et ce qui serre quoi</title>
  <desc id="df">Trois colonnes pour la même fonction technique : arrêter un vélo en mouvement. La
  fonction est rappelée en haut, écrite par un verbe à l'infinitif, et elle ne dit pas par quel
  moyen. Premier principe, le frein à patins : deux patins de caoutchouc serrent le bord de la roue,
  c'est-à-dire la jante ; le frottement transforme le mouvement en chaleur. La surface qui frotte est
  la jante elle-même, exposée à la pluie et aux projections. Deuxième principe, le frein à disque
  mécanique : deux plaquettes serrent un disque métallique fixé au moyeu, près du centre de la roue ;
  la surface qui frotte est plus petite et plus haute, donc moins exposée à l'eau et à la boue.
  Troisième principe, le frein à tambour : deux mâchoires poussent vers l'extérieur contre la paroi
  intérieure d'un tambour fermé, logé dans le moyeu ; la surface qui frotte est enfermée, donc
  protégée de la pluie et du sel, mais la chaleur s'en évacue mal. Un encadré rappelle que les trois
  emploient le même phénomène physique de base, le frottement, et que ce qui les distingue est
  l'endroit où l'on frotte et ce qui s'y trouve exposé. Un second encadré distingue les trois mots :
  la fonction technique dit ce que l'objet doit faire, le principe dit par quel phénomène, et la
  solution nomme l'objet concret que l'on achète.</desc>
  <rect width="900" height="470" fill="#050f24"/>
  <style>
    text{fill:#e4eaf5;font-size:12.5px}
    .ti{font-size:15px;font-weight:600}
    .lb{fill:#9bbefc;font-size:11.5px}
    .pl{fill:#81fba1;font-size:11.5px}
    .mi{fill:#ff9aa4;font-size:11.5px}
  </style>
  <text x="26" y="30" font-size="17" font-weight="600">Corrigé — une fonction, trois principes</text>
  <text class="lb" x="26" y="52">Fonction technique&#160;: <tspan fill="#ffd08a" font-weight="600">arrêter un vélo en mouvement</tspan> — un verbe à l'infinitif, et aucun moyen nommé.</text>

  <rect x="26" y="68" width="272" height="312" rx="12" fill="#0d2347" stroke="#3f6bb5" stroke-width="2"/>
  <text class="ti" x="42" y="96" fill="#8fb6ff">P1 · Frein à patins</text>
  <text class="lb" x="42" y="116">on serre la <tspan font-weight="600">jante</tspan></text>
  <circle cx="162" cy="186" r="52" fill="none" stroke="#9bbefc" stroke-width="3"/>
  <circle cx="162" cy="186" r="8" fill="#61dafb"/>
  <rect x="104" y="176" width="14" height="20" fill="#ff7b88"/>
  <rect x="206" y="176" width="14" height="20" fill="#ff7b88"/>
  <path d="M96 186 H 102 M228 186 H 222" stroke="#ffd08a" stroke-width="2.5" marker-end="url(#fp)"/>
  <defs><marker id="fp" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 9 3, 0 6" fill="#ffd08a"/></marker></defs>
  <text x="42" y="266" font-size="11.5">Deux patins de caoutchouc</text>
  <text x="42" y="284" font-size="11.5">serrent le <b>bord de la roue</b>.</text>
  <text class="pl" x="42" y="310">+ léger (320 g), 18 €/an</text>
  <text class="pl" x="42" y="328">+ réparable (5/5)</text>
  <text class="mi" x="42" y="352">− la jante est <tspan font-weight="600">exposée</tspan> :</text>
  <text class="mi" x="42" y="370">pluie 8,9 m · corrosion 2/5</text>

  <rect x="314" y="68" width="272" height="312" rx="12" fill="#0d3320" stroke="#4fae7a" stroke-width="2"/>
  <text class="ti" x="330" y="96" fill="#81fba1">P2 · Frein à disque</text>
  <text class="lb" x="330" y="116">on serre un <tspan font-weight="600">disque</tspan></text>
  <circle cx="450" cy="186" r="52" fill="none" stroke="#9bbefc" stroke-width="3"/>
  <circle cx="450" cy="186" r="24" fill="none" stroke="#81fba1" stroke-width="3"/>
  <circle cx="450" cy="186" r="8" fill="#61dafb"/>
  <rect x="420" y="178" width="10" height="16" fill="#ff7b88"/>
  <rect x="470" y="178" width="10" height="16" fill="#ff7b88"/>
  <text x="330" y="266" font-size="11.5">Deux plaquettes serrent un</text>
  <text x="330" y="284" font-size="11.5">disque fixé <b>près du moyeu</b>.</text>
  <text class="pl" x="330" y="310">+ pluie 6,4 m — le meilleur</text>
  <text class="pl" x="330" y="328">+ corrosion 4/5</text>
  <text class="mi" x="330" y="352">− 510 g, 34 €/an</text>
  <text class="mi" x="330" y="370">− réglage plus technique</text>

  <rect x="602" y="68" width="272" height="312" rx="12" fill="#2b1a3f" stroke="#a077d8" stroke-width="2"/>
  <text class="ti" x="618" y="96" fill="#c68ef2">P3 · Frein à tambour</text>
  <text class="lb" x="618" y="116">on pousse <tspan font-weight="600">de l'intérieur</tspan></text>
  <circle cx="738" cy="186" r="52" fill="none" stroke="#9bbefc" stroke-width="3"/>
  <circle cx="738" cy="186" r="30" fill="#2b1f0d" stroke="#c68ef2" stroke-width="3"/>
  <path d="M722 174 a 20 20 0 0 0 0 24" stroke="#ff7b88" stroke-width="4" fill="none"/>
  <path d="M754 174 a 20 20 0 0 1 0 24" stroke="#ff7b88" stroke-width="4" fill="none"/>
  <circle cx="738" cy="186" r="8" fill="#61dafb"/>
  <text x="618" y="266" font-size="11.5">Deux mâchoires poussent</text>
  <text x="618" y="284" font-size="11.5">contre un tambour <b>fermé</b>.</text>
  <text class="pl" x="618" y="310">+ corrosion 5/5 — à l'abri</text>
  <text class="pl" x="618" y="328">+ pluie 6,9 m</text>
  <text class="mi" x="618" y="352">− 760 g, le plus lourd</text>
  <text class="mi" x="618" y="370">− la chaleur s'évacue mal</text>

  <rect x="26" y="392" width="420" height="62" rx="10" fill="#2b1f0d" stroke="#ffb454" stroke-width="2"/>
  <text x="42" y="414" font-size="13" font-weight="600" fill="#ffd08a">Le même phénomène, à trois endroits</text>
  <text x="42" y="436" font-size="11.5">Les trois freinent par <tspan font-weight="600">frottement</tspan>. Ce qui change, c'est</text>
  <text x="42" y="452" font-size="11.5">où l'on frotte — et ce qui s'y trouve exposé.</text>

  <rect x="462" y="392" width="412" height="62" rx="10" fill="#122a52" stroke="#3f6bb5" stroke-width="2"/>
  <text x="478" y="412" font-size="12"><tspan font-weight="600" fill="#8fb6ff">Fonction</tspan> : ce que l'objet doit FAIRE. «&#160;Arrêter le vélo.&#160;»</text>
  <text x="478" y="430" font-size="12"><tspan font-weight="600" fill="#81fba1">Principe</tspan> : par quel phénomène. «&#160;Par frottement sur la jante.&#160;»</text>
  <text x="478" y="448" font-size="12"><tspan font-weight="600" fill="#c68ef2">Solution</tspan> : ce qu'on achète. «&#160;Ce frein à patins-là.&#160;»</text>
<style><![CDATA[
