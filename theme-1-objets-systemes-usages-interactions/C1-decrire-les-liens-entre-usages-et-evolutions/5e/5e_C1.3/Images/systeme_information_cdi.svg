<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Système d'information du CDI</title><desc id="d">Schéma montrant des élèves, un professeur documentaliste, des ordinateurs et un serveur reliés par des flux de données.</desc><style>text{font-family:Arial,sans-serif;fill:#10213f}.box{fill:#eef5ff;stroke:#274a8a;stroke-width:4}.flow{stroke:#1d4e89;stroke-width:7;fill:none;marker-end:url(#a)}.label{font-size:25px;font-weight:bold}.small{font-size:20px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d4e89"/></marker></defs><rect width="1000" height="560" fill="#fff"/><rect class="box" x="60" y="70" width="230" height="120" rx="18"/><text class="label" x="175" y="120" text-anchor="middle">Élèves</text><text class="small" x="175" y="158" text-anchor="middle">recherchent / empruntent</text><rect class="box" x="60" y="370" width="230" height="120" rx="18"/><text class="label" x="175" y="420" text-anchor="middle">Professeur</text><text class="small" x="175" y="458" text-anchor="middle">valide / met à jour</text><rect class="box" x="385" y="220" width="230" height="120" rx="18"/><text class="label" x="500" y="270" text-anchor="middle">Logiciel CDI</text><text class="small" x="500" y="308" text-anchor="middle">traite les données</text><rect class="box" x="710" y="70" width="230" height="120" rx="18"/><text class="label" x="825" y="120" text-anchor="middle">Catalogue</text><text class="small" x="825" y="158" text-anchor="middle">titres / auteurs / états</text><rect class="box" x="710" y="370" width="230" height="120" rx="18"/><text class="label" x="825" y="420" text-anchor="middle">Serveur</text><text class="small" x="825" y="458" text-anchor="middle">stocke et sauvegarde</text><path class="flow" d="M290 130 C360 130 360 230 385 250"/><path class="flow" d="M290 430 C360 430 360 330 385 310"/><path class="flow" d="M615 25