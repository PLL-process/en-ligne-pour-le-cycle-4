<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">Arborescence des données du projet vélos</title><desc id="d">Un dossier principal, Hangzhou_velos_groupeXX, contient quatre dossiers numérotés : 01_donnees_brutes pour le fichier CSV d'origine, 02_analyses pour les tableurs, 03_exports pour le PDF final, 99_archive pour les anciennes versions. Dessous : des noms qui ne changent pas, des versions et deux sauvegardes, et on retrouve ses données.</desc><style>.f{fill:#fff4c7;stroke:#8a6a12;stroke-width:3}.t{font:bold 18px Arial;fill:#43340a}.s{font:17px Arial;fill:#43340a}.l{stroke:#8a6a12;stroke-width:4;fill:none}</style><rect width="960" height="400" fill="#fff"/><path class="f" d="M322 22 H384 L396 34 H638 Q650 34 650 46 V92 Q650 104 638 104 H322 Q310 104 310 92 V34 Q310 22 322 22 Z"/><text class="t" x="480" y="70" text-anchor="middle" style="font-size:20px">Hangzhou_velos_groupeXX</text><path class="l" d="M480 104 V146 M126 146 H834"/><path class="l" d="M126 146 V180 M362 146 V180 M598 146 V180 M834 146 V180"/><path class="f" d="M28 180 H90 L102 192 H224 Q236 192 236 204 V268 Q236 280 224 280 H28 Q16 280 16 268 V192 Q16 180 28 180 Z"/><text class="t" x="126" y="228" text-anchor="middle">01_donnees_brutes</text><text class="s" x="126" y="258" text-anchor="middle">le CSV d'origine</text><path class="f" d="M264 180 H326 L338 192 H460 Q472 192 472 204 V268 Q472 280 460 280 H264 Q252 280 252 268 V192 Q252 180 264 180 Z"/><text class="t" x="362" y="228" text-anchor="middle">02_analyses</text><text class="s" x="362" y="258" text-anchor="middle">les tableurs ODS / XLSX</text><path class="f" d="M500 180 H562 L574 192 H696 Q708 192 708 204 V268 Q708 280 696 280 H500 Q488 280 488 268 V192 Q488 180 500 180 Z"/><text class="t" x="598" y="228" text-anchor="middle">03_exports</text><text class="s" x="598" y="258" text-anchor="middle">le PDF final</text><path class="f" d="M736 180 H798 L810 192 H932 Q944 192 944 204 V268 Q944 280 932 280 H736 Q724 280 724 268 V192 Q724 180 736 180 Z"/><text class="t" x="834" y="228" text-anchor="middle">99_archive</text><text class="s" x="834" y="258" text-anchor="middle">les anciennes versions</text><text class="s" x="480" y="330" text-anchor="middle">Des noms qui ne changent pas + des versions + deux sauvegardes</text><text class="s" x="480" y="356" text-anchor="middle">= des données qu’on retrouve et qu’on réutilise</text></svg>
