<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Stockage local et serveur distant</title><desc id="d">Comparaison entre un ordinateur stockant un fichier localement et un serveur distant accessible par un réseau sécurisé.</desc><style>text{font-family:Arial,sans-serif;fill:#10213f}.box{fill:#eef5ff;stroke:#274a8a;stroke-width:4}.network{stroke:#1d4e89;stroke-width:8;stroke-dasharray:16 10;fill:none}.label{font-size:25px;font-weight:bold}.small{font-size:19px}.warn{fill:#fff9df;stroke:#725f16;stroke-width:3}</style><rect width="1000" height="600" fill="#fff"/><text class="label" x="500" y="55" text-anchor="middle">Où se trouve le fichier ?</text><rect class="box" x="70" y="130" width="300" height="230" rx="20"/><text class="label" x="220" y="180" text-anchor="middle">Stockage local</text><rect x="125" y="215" width="190" height="95" rx="10" fill="#fff" stroke="#274a8a" stroke-width="4"/><text class="small" x="220" y="270" text-anchor="middle">ordinateur / clé USB</text><text class="small" x="220" y="410" text-anchor="middle">Accessible sans réseau</text><text class="small" x="220" y="445" text-anchor="middle">Risque en cas de panne ou perte</text><rect class="box" x="630" y="130" width="300" height="230" rx="20"/><text class="label" x="780" y="180" text-anchor="middle">Serveur distant</text><rect x="700" y="210" width="160" height="115" rx="10" fill="#fff" stroke="#274a8a" stroke-width="4"/><line x1="720" y1="240" x2="840" y2="240" stroke="#274a8a" stroke-width="4"/><line x1="720" y1="270" x2="840" y2="270" stroke="#274a8a" stroke-width="4"/><line x1="720" y1="300" x2="840" y2="300" stroke="#274a8a" stroke-width="4"/><path class="network" d="M370 250C470 170 530 170 630 250"/><text class="small" x="500" y="190" text-anchor="middle">réseau</text><text class="small" x="780" y="410" text-anchor="middle">Accessible depuis plusieurs appareils</text><text class="small" x="780" y="445" text-anchor="middle">Droits d'accès indispensables</text><rect class="warn" x="285" y="500" width="430" height="65" rx="12"/><text class="small" x="500" y="540" text-anchor="middle">Une sauvegarde doit exister sur un autre support.</text></svg>