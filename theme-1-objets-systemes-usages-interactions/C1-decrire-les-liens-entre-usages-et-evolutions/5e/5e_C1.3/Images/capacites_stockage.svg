<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d"><title id="t">Comparaison de capacités de stockage</title><desc id="d">Échelle illustrant un fichier texte de 10 kilo-octets, une photo de 5 mégaoctets, une vidéo de 2 gigaoctets et un disque de 1 téraoctet.</desc><style>text{font-family:Arial,sans-serif;fill:#10213f}.axis{stroke:#274a8a;stroke-width:8}.tick{stroke:#274a8a;stroke-width:5}.box{fill:#eef5ff;stroke:#274a8a;stroke-width:3}.label{font-size:24px;font-weight:bold}.small{font-size:19px}</style><rect width="1000" height="590" fill="#fff"/><text class="label" x="500" y="55" text-anchor="middle">Ordres de grandeur du stockage</text><line class="axis" x1="100" y1="300" x2="900" y2="300"/><g><line class="tick" x1="150" y1="270" x2="150" y2="330"/><line class="tick" x1="380" y1="270" x2="380" y2="330"/><line class="tick" x1="610" y1="270" x2="610" y2="330"/><line class="tick" x1="840" y1="270" x2="840" y2="330"/></g><rect class="box" x="70" y="110" width="160" height="100" rx="14"/><text class="label" x="150" y="150" text-anchor="middle">10 Ko</text><text class="small" x="150" y="185" text-anchor="middle">texte</text><rect class="box" x="300" y="365" width="160" height="100" rx="14"/><text class="label" x="380" y="405" text-anchor="middle">5 Mo</text><text class="small" x="380" y="440" text-anchor="middle">photo</text><rect class="box" x="530" y="110" width="160" height="100" rx="14"/><text class="label" x="610" y="150" text-anchor="middle">2 Go</text><text class="small" x="610" y="185" text-anchor="middle">vidéo</text><rect class="box" x="760" y="365" width="160" height="100" rx="14"/><text class="label" x="840" y="405" text-anchor="middle">1 To</text><text class="small" x="840" y="440" text-anchor="middle">disque</text><text class="small" x="500" y="535" text-anchor="middle">Ko → Mo → Go → To : chaque palier vaut environ 1 000 fois le précédent.</text></svg>