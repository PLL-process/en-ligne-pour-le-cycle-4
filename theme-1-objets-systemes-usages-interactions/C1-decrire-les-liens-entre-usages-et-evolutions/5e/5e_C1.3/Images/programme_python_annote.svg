<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">Programme Python annoté</title><desc id="d">Programme Python de trois lignes montrant une variable température, un test conditionnel et un message d'alerte avec annotations.</desc><style>text{font-family:Arial,sans-serif;fill:#10213f}.code{font-family:monospace;font-size:28px}.panel{fill:#071426;stroke:#274a8a;stroke-width:4}.kw{fill:#c68ef2}.name{fill:#61dafb}.num{fill:#f0a878}.str{fill:#8fd18f}.ann{fill:#eef5ff;stroke:#274a8a;stroke-width:3}.line{stroke:#1d4e89;stroke-width:4}.label{font-size:22px;font-weight:bold}</style><rect width="1000" height="650" fill="#fff"/><rect class="panel" x="80" y="70" width="610" height="310" rx="18"/><text class="code name" x="125" y="145">temperature</text><text class="code" x="315" y="145" fill="#e4eaf5"> = </text><text class="code num" x="365" y="145">31</text><text class="code kw" x="125" y="220">if</text><text class="code name" x="175" y="220"> temperature</text><text class="code" x="390" y="220" fill="#e4eaf5"> &gt; </text><text class="code num" x="460" y="220">30</text><text class="code" x="505" y="220" fill="#e4eaf5">:</text><text class="code name" x="170" y="295">print</text><text class="code" x="255" y="295" fill="#e4eaf5">(</text><text class="code str" x="275" y="295">"Alerte"</text><text class="code" x="430" y="295" fill="#e4eaf5">)</text><rect class="ann" x="735" y="85" width="220" height="80" rx="12"/><text class="label" x="845" y="120" text-anchor="middle">Variable</text><text x="845" y="148" text-anchor="middle">stocke une donnée</text><line class="line" x1="735" y1="125" x2="520" y2="135"/><rect class="ann" x="735" y="225" width="220" height="80" rx="12"/><text class="label" x="845" y="260" text-anchor="middle">Condition</text><text x="845" y="288" text-anchor="middle">compare au seuil</text><line class="line" x1="735" y1="265" x2="540" y2="220"/><rect class="ann" x="735" y="365" width="220" height="80" rx="12"/><text class="label" x="845" y="400" text-anchor="middle">Action</text><text x="845" y="428" text-anchor="middle">affiche le résultat</text><line class="line" x1="735" y1="405" x2="505" y2="295"/><text class="label" x="500" y="505" text-anchor="middle">Trace d'exécution pour temperature = 31</text><rect class="ann" x="280" y="540" width="440" height="70" rx="12"/><text class="label" x="500" y="583" text-anchor="middle">31 &gt; 30 est vrai → « Alerte » s'affiche.</text></svg>