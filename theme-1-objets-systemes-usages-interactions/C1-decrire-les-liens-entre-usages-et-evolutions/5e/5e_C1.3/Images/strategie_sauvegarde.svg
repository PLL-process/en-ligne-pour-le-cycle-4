<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Stratégie de sauvegarde</title><desc id="d">À gauche, le fichier original, mesures.csv. À droite, deux copies sur deux supports différents : en haut la copie locale, sur un disque externe débranché ; en bas la copie distante, sur un serveur à accès protégé. De l'original vers chaque copie, une flèche pleine : copier souvent. De chaque copie vers l'original, une flèche en tirets : restaurer, c'est-à-dire remettre le fichier après une suppression, une panne ou une attaque.</desc><style>text{font-family:Arial,sans-serif;fill:#10213f}.box{fill:#eef5ff;stroke:#274a8a;stroke-width:4}.copy{stroke:#1d4e89;stroke-width:6;fill:none;marker-end:url(#a)}.restore{stroke:#725f16;stroke-width:5;fill:none;stroke-dasharray:12 8;marker-end:url(#b)}.label{font-size:24px;font-weight:bold}.small{font-size:19px}.copie{font-size:19px;font-weight:bold;fill:#1d4e89}.resto{font-size:19px;font-weight:bold;fill:#725f16}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="#1d4e89"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="20" markerHeight="20" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="#725f16"/></marker></defs><rect width="1000" height="600" fill="#fff"/><text class="label" x="500" y="52" text-anchor="middle">Sauvegarder pour pouvoir restaurer</text><rect class="box" x="50" y="200" width="260" height="180" rx="18"/><text class="label" x="180" y="282" text-anchor="middle">Fichier original</text><text class="small" x="180" y="316" text-anchor="middle">mesures.csv</text><rect class="box" x="650" y="90" width="300" height="120" rx="18"/><text class="label" x="800" y="140" text-anchor="middle">Copie locale</text><text class="small" x="800" y="176" text-anchor="middle">disque externe débranché</text><rect class="box" x="650" y="370" width="300" height="120" rx="18"/><text class="label" x="800" y="420" text-anchor="middle">Copie distante</text><text class="small" x="800" y="456" text-anchor="middle">serveur à accès protégé</text><path class="copy" d="M310 228 L646 140"/><path class="copy" d="M310 352 L646 440"/><path class="restore" d="M650 182 L314 268"/><path class="restore" d="M650 398 L314 312"/><text class="copie" x="440" y="150" text-anchor="middle">① copier souvent</text><text class="copie" x="440" y="440" text-anchor="middle">① copier souvent</text><text class="resto" x="490" y="297" text-anchor="middle">② restaurer</text><text class="small" x="500" y="540" text-anchor="middle">Restaurer : remettre le fichier après une suppression, une panne ou une attaque.</text><text class="small" x="500" y="574" text-anchor="middle">Les deux copies sont sur deux supports différents.</text></svg>
