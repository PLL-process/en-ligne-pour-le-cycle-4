<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Stratégie de sauvegarde</title><desc id="d">Schéma de sauvegarde montrant un fichier original copié vers un disque externe et un serveur distant, avec une restauration possible.</desc><style>text{font-family:Arial,sans-serif;fill:#10213f}.box{fill:#eef5ff;stroke:#274a8a;stroke-width:4}.copy{stroke:#1d4e89;stroke-width:7;fill:none;marker-end:url(#a)}.restore{stroke:#725f16;stroke-width:6;fill:none;stroke-dasharray:14 9;marker-end:url(#b)}.label{font-size:24px;font-weight:bold}.small{font-size:19px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d4e89"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#725f16"/></marker></defs><rect width="1000" height="620" fill="#fff"/><text class="label" x="500" y="55" text-anchor="middle">Sauvegarder pour pouvoir restaurer</text><rect class="box" x="390" y="105" width="220" height="110" rx="18"/><text class="label" x="500" y="150" text-anchor="middle">Fichier original</text><text class="small" x="500" y="185" text-anchor="middle">mesures.csv</text><rect class="box" x="80" y="360" width="250" height="120" rx="18"/><text class="label" x="205" y="405" text-anchor="middle">Copie locale</text><text class="small" x="205" y="445" text-anchor="middle">disque externe débranché</text><rect class="box" x="670" y="360" width="250" height="120" rx="18"/><text class="label" x="795" y="405" text-anchor="middle">Copie distante</text><text class="small" x="795" y="445" text-anchor="middle">serveur avec accès protégé</text><path class="copy" d="M450 215C390 265 280 300 220 360"/><path class="copy" d="M550 215C610 265 720 300 780 360"/><text class="small" x="300" y="285" text-anchor="middle">copier régulièrement</text><text class="small" x="700" y="285" text-anchor="middle">copier régulièrement</text><path class="restore" d="M670 455C560 560 390 560 330 455"/><text class="small" x="500" y="565" text-anchor="middle">restaurer après une suppression, une panne ou une attaque</text><text class="small" x="500" y="600" text-anchor="middle">Les copies doivent être sur deux supports différents.</text></svg>