<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">Extrait du tableau de maintenance des vélos</title><desc id="d">Tableau simplifié montrant quatre vélos, leur nombre d'incidents, leur autonomie et le statut prioritaire calculé.</desc><style>.h{fill:#dcecff;stroke:#1e4c79;stroke-width:2}.c{fill:#fff;stroke:#55789c;stroke-width:2}.p{fill:#fff4c7;stroke:#8a6a12;stroke-width:2}.ht{font:bold 20px Arial;fill:#12395e}.t{font:18px Arial;fill:#12395e}</style><rect width="900" height="380" fill="#fff"/><rect class="h" x="40" y="35" width="170" height="60"/><rect class="h" x="210" y="35" width="190" height="60"/><rect class="h" x="400" y="35" width="190" height="60"/><rect class="h" x="590" y="35" width="270" height="60"/><text class="ht" x="125" y="72" text-anchor="middle">id_velo</text><text class="ht" x="305" y="72" text-anchor="middle">incidents</text><text class="ht" x="495" y="72" text-anchor="middle">autonomie %</text><text class="ht" x="725" y="72" text-anchor="middle">statut_maintenance</text><g><rect class="c" x="40" y="95" width="170" height="55"/><rect class="c" x="210" y="95" width="190" height="55"/><rect class="c" x="400" y="95" width="190" height="55"/><rect class="c" x="590" y="95" width="270" height="55"/><text class="t" x="125" y="130" text-anchor="middle">V-102</text><text class="t" x="305" y="130" text-anchor="middle">1</text><text class="t" x="495" y="130" text-anchor="middle">68</text><text class="t" x="725" y="130" text-anchor="middle">normal</text><rect class="p" x="40" y="150" width="170" height="55"/><rect class="p" x="210" y="150" width="190" height="55"/><rect class="p" x="400" y="150" width="190" height="55"/><rect class="p" x="590" y="150" width="270" height="55"/><text class="t" x="125" y="185" text-anchor="middle">V-104</text><text class="t" x="305" y="185" text-anchor="middle">4</text><text class="t" x="495" y="185" text-anchor="middle">47</text><text class="t" x="725" y="185" text-anchor="middle">prioritaire</text><rect class="p" x="40" y="205" width="170" height="55"/><rect class="p" x="210" y="205" width="190" height="55"/><rect class="p" x="400" y="205" width="190" height="55"/><rect class="p" x="590" y="205" width="270" height="55"/><text class="t" x="125" y="240" text-anchor="middle">V-105</text><text class="t" x="305" y="240" text-anchor="middle">0</text><text class="t" x="495" y="240" text-anchor="middle">31</text><text class="t" x="725" y="240" text-anchor="middle">prioritaire</text><rect class="p" x="40" y="260" width="170" height="55"/><rect class="p" x="210" y="260" width="190" height="55"/><rect class="p" x="400" y="260" width="190" height="55"/><rect class="p" x="590" y="260" width="270" height="55"/><text class="t" x="125" y="295" text-anchor="middle">V-112</text><text class="t" x="305" y="295" text-anchor="middle">2</text><text class="t" x="495" y="295" text-anchor="middle">28</text><text class="t" x="725" y="295" text-anchor="middle">prioritaire</text></g><text class="t" x="450" y="350" text-anchor="middle">Règle simulée : incidents ≥ 3 OU autonomie &lt; 35 % → prioritaire</text></svg>