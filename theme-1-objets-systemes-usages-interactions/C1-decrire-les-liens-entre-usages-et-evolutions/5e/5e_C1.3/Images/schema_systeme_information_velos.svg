<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Système d'information d'un service de vélos</title><desc id="d">Les utilisateurs et les vélos produisent des données, transportées par un réseau, traitées par un serveur, stockées dans une base et restituées sous forme d'informations.</desc><style>.b{fill:#eef6ff;stroke:#24578a;stroke-width:3}.h{font:bold 22px Arial;fill:#12395e}.p{font:18px Arial;fill:#12395e}.a{stroke:#24578a;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#24578a"/></marker></defs><rect width="960" height="420" fill="#fff"/><rect class="b" x="30" y="55" rx="18" width="170" height="110"/><text class="h" x="115" y="92" text-anchor="middle">Acteurs</text><text class="p" x="115" y="125" text-anchor="middle">cycliste</text><text class="p" x="115" y="150" text-anchor="middle">technicien</text><rect class="b" x="260" y="55" rx="18" width="170" height="110"/><text class="h" x="345" y="92" text-anchor="middle">Données</text><text class="p" x="345" y="125" text-anchor="middle">identifiant</text><text class="p" x="345" y="150" text-anchor="middle">état du vélo</text><rect class="b" x="490" y="55" rx="18" width="170" height="110"/><text class="h" x="575" y="92" text-anchor="middle">Traitements</text><text class="p" x="575" y="125" text-anchor="middle">vérifier</text><text class="p" x="575" y="150" text-anchor="middle">classer / alerter</text><rect class="b" x="730" y="55" rx="18" width="190" height="110"/><text class="h" x="825" y="92" text-anchor="middle">Informations</text><text class="p" x="825" y="125" text-anchor="middle">disponibilité</text><text class="p" x="825" y="150" text-anchor="middle">maintenance</text><path class="a" d="M200 110 H250"/><path class="a" d="M430 110 H480"/><path class="a" d="M660 110 H720"/><rect class="b" x="260" y="255" rx="18" width="170" height="105"/><text class="h" x="345" y="292" text-anchor="middle">Réseau</text><text class="p" x="345" y="325" text-anchor="middle">transmettre</text><rect class="b" x="490" y="255" rx="18" width="170" height="105"/><text class="h" x="575" y="292" text-anchor="middle">Stockage</text><text class="p" x="575" y="325" text-anchor="middle">base de données</text><path class="a" d="M345 165 V245"/><path class="a" d="M430 307 H480"/><path class="a" d="M575 255 V175"/></svg>