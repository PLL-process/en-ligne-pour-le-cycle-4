<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 904" width="350" height="904" role="img" aria-labelledby="t_carnet_inspection d_carnet_inspection" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_carnet_inspection">Le carnet d'inspection du lampadaire n°3</title>
<desc id="d_carnet_inspection">Le carnet d'inspection du lampadaire n°3, lundi matin après l'orage. Zone 1, panneau solaire : une couche de poussière et deux feuilles collées après l'orage. Les lampes n°1 et n°2, juste à côté, sont aussi sales… et fonctionnent. Zone 2, lanterne LED : vitre propre, aucune trace noire, aucun impact. Rien d'anormal à l'œil. Zone 3, capot du capteur de luminosité : une FISSURE nette traverse le capot. À l'intérieur, des gouttelettes de condensation. Zone 4, détecteur de passage : lentille propre, boîtier intact, bien fixé. Rien d'anormal à l'œil. Zone 5, coffret : le voyant d'état est ÉTEINT. D'habitude, il est vert fixe. Le coffret signale un problème. Zone 6, câble du capteur : le câble PEND sous le coffret, connecteur sorti de la borne « CAPTEUR ». Le connecteur est humide. Le carnet ne classe aucune observation.</desc>
<rect width="350" height="904" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le carnet d'inspection</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">du lampadaire n°3</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Lundi matin, après l'orage : ce que</text>
<text x="14.0" y="94.3" font-size="13.5" fill="#9bbefc">l'inspecteur a vu, zone par zone.</text>
<rect x="14.0" y="110.3" width="322.0" height="132.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="140.3" font-size="16" fill="#61dafb" font-weight="700">1. Panneau solaire</text>
<text x="26.0" y="167.3" font-size="15" fill="#e4eaf5">Une couche de poussière et deux feuilles</text>
<text x="26.0" y="188.3" font-size="15" fill="#e4eaf5">collées après l'orage. Les lampes n°1 et</text>
<text x="26.0" y="209.3" font-size="15" fill="#e4eaf5">n°2, juste à côté, sont aussi sales… et</text>
<text x="26.0" y="230.3" font-size="15" fill="#e4eaf5">fonctionnent.</text>
<rect x="14.0" y="258.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="288.4" font-size="16" fill="#61dafb" font-weight="700">2. Lanterne LED</text>
<text x="26.0" y="315.4" font-size="15" fill="#e4eaf5">Vitre propre, aucune trace noire, aucun</text>
<text x="26.0" y="336.4" font-size="15" fill="#e4eaf5">impact. Rien d'anormal à l'œil.</text>
<rect x="14.0" y="364.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="394.4" font-size="16" fill="#61dafb" font-weight="700">3. Capot du capteur de luminosité</text>
<text x="26.0" y="421.4" font-size="15" fill="#e4eaf5">Une FISSURE nette traverse le capot. À</text>
<text x="26.0" y="442.4" font-size="15" fill="#e4eaf5">l'intérieur, des gouttelettes de</text>
<text x="26.0" y="463.4" font-size="15" fill="#e4eaf5">condensation.</text>
<rect x="14.0" y="491.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="521.4" font-size="16" fill="#61dafb" font-weight="700">4. Détecteur de passage</text>
<text x="26.0" y="548.4" font-size="15" fill="#e4eaf5">Lentille propre, boîtier intact, bien</text>
<text x="26.0" y="569.4" font-size="15" fill="#e4eaf5">fixé. Rien d'anormal à l'œil.</text>
<rect x="14.0" y="597.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="627.4" font-size="16" fill="#61dafb" font-weight="700">5. Coffret</text>
<text x="26.0" y="654.4" font-size="15" fill="#e4eaf5">Le voyant d'état est ÉTEINT. D'habitude,</text>
<text x="26.0" y="675.4" font-size="15" fill="#e4eaf5">il est vert fixe. Le coffret signale un</text>
<text x="26.0" y="696.4" font-size="15" fill="#e4eaf5">problème.</text>
<rect x="14.0" y="724.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="754.4" font-size="16" fill="#61dafb" font-weight="700">6. Câble du capteur</text>
<text x="26.0" y="781.4" font-size="15" fill="#e4eaf5">Le câble PEND sous le coffret,</text>
<text x="26.0" y="802.4" font-size="15" fill="#e4eaf5">connecteur sorti de la borne</text>
<text x="26.0" y="823.4" font-size="15" fill="#e4eaf5">« CAPTEUR ». Le connecteur est humide.</text>
<text x="14.0" y="865.5" font-size="13.5" fill="#9bbefc">Le carnet ne classe aucune observation : c'est la</text>
<text x="14.0" y="883.8" font-size="13.5" fill="#9bbefc">question.</text>
</svg>
