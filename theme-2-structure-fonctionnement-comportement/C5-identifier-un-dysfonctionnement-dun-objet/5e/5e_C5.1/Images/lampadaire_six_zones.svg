<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le lampadaire en panne : six zones à inspecter visuellement</title>
  <desc id="d">Un lampadaire solaire est dessiné au centre, avec six zones numérotées à examiner : 1 le panneau solaire en haut, couvert de poussière et de feuilles ; 2 la lanterne à LED, d'aspect normal ; 3 le capot du capteur de luminosité, qui présente une fissure visible ; 4 le détecteur de passage, d'aspect normal ; 5 le coffret technique, dont le voyant d'état est éteint alors qu'il devrait être vert ; 6 le connecteur du câble du capteur, dont le câble pend débranché sous le coffret. La consigne rappelle qu'une inspection visuelle se fait avec les yeux, sans rien démonter, et que l'on note ce que l'on voit zone par zone.</desc>
  <rect width="940" height="600" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Lampadaire n°3 en panne — examine les 6 zones AVEC LES YEUX, sans rien démonter</text>

  <!-- mât et pied -->
  <rect x="455" y="120" width="14" height="380" fill="#274a8a"/>
  <rect x="425" y="496" width="74" height="14" rx="4" fill="#274a8a"/>
  <g stroke="#3a5da0" stroke-width="2"><line x1="440" y1="496" x2="430" y2="470"/><line x1="484" y1="496" x2="494" y2="470"/></g>

  <!-- 1 · panneau solaire sale -->
  <g>
    <rect x="392" y="64" width="140" height="40" rx="6" fill="#0d2347" stroke="#61dafb" stroke-width="2" transform="rotate(-8 462 84)"/>
    <g transform="rotate(-8 462 84)">
      <line x1="392" y1="78" x2="532" y2="78" stroke="#173666"/><line x1="392" y1="92" x2="532" y2="92" stroke="#173666"/>
      <line x1="427" y1="64" x2="427" y2="104" stroke="#173666"/><line x1="462" y1="64" x2="462" y2="104" stroke="#173666"/><line x1="497" y1="64" x2="497" y2="104" stroke="#173666"/>
      <ellipse cx="420" cy="75" rx="16" ry="7" fill="#7a6a3f" opacity="0.85"/>
      <ellipse cx="500" cy="95" rx="20" ry="8" fill="#7a6a3f" opacity="0.85"/>
      <path d="M470 88 q6 -10 14 -3 q-2 8 -14 3" fill="#4f7a3f"/>
    </g>
    <circle cx="365" cy="70" r="15" fill="#08132c" stroke="#ffd66b" stroke-width="2.5"/>
    <text x="365" y="76" fill="#ffd66b" font-size="15" font-weight="bold" text-anchor="middle">1</text>
    <text x="340" y="105" fill="#9bbefc" font-size="11" text-anchor="middle">panneau solaire</text>
  </g>

  <!-- 2 · lanterne LED -->
  <g>
    <rect x="500" y="128" width="86" height="26" rx="9" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/>
    <circle cx="522" cy="141" r="6" fill="#223c6b"/><circle cx="543" cy="141" r="6" fill="#223c6b"/><circle cx="564" cy="141" r="6" fill="#223c6b"/>
    <circle cx="620" cy="120" r="15" fill="#08132c" stroke="#ffd66b" stroke-width="2.5"/>
    <text x="620" y="126" fill="#ffd66b" font-size="15" font-weight="bold" text-anchor="middle">2</text>
    <text x="660" y="150" fill="#9bbefc" font-size="11" text-anchor="middle">lanterne LED</text>
  </g>

  <!-- 3 · capot du capteur fissuré -->
  <g>
    <rect x="352" y="176" width="64" height="40" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <circle cx="384" cy="196" r="10" fill="#123058" stroke="#61dafb"/>
    <path d="M358 182 l16 12 l-7 9 l14 10" stroke="#ff7b88" stroke-width="2.5" fill="none"/>
    <path d="M405 180 l-9 13" stroke="#ff7b88" stroke-width="2" fill="none"/>
    <circle cx="322" cy="172" r="15" fill="#08132c" stroke="#ffd66b" stroke-width="2.5"/>
    <text x="322" y="178" fill="#ffd66b" font-size="15" font-weight="bold" text-anchor="middle">3</text>
    <text x="300" y="205" fill="#9bbefc" font-size="11" text-anchor="middle">capot du capteur</text>
    <text x="300" y="219" fill="#9bbefc" font-size="11" text-anchor="middle">de luminosité</text>
  </g>

  <!-- 4 · détecteur de passage -->
  <g>
    <rect x="500" y="196" width="56" height="34" rx="9" fill="#0d2347" stroke="#c68ef2" stroke-width="2"/>
    <circle cx="528" cy="213" r="9" fill="#1b1440" stroke="#c68ef2"/>
    <g stroke="#c68ef2" stroke-width="1.4" opacity="0.7"><path d="M542 205 q8 8 0 16" fill="none"/><path d="M549 200 q13 13 0 26" fill="none"/></g>
    <circle cx="600" cy="196" r="15" fill="#08132c" stroke="#ffd66b" stroke-width="2.5"/>
    <text x="600" y="202" fill="#ffd66b" font-size="15" font-weight="bold" text-anchor="middle">4</text>
    <text x="648" y="222" fill="#9bbefc" font-size="11" text-anchor="middle">détecteur de passage</text>
  </g>

  <!-- 5 · coffret voyant éteint -->
  <g>
    <rect x="404" y="300" width="116" height="120" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="2.5"/>
    <text x="462" y="326" fill="#ffb454" font-size="11" font-weight="bold" text-anchor="middle">COFFRET</text>
    <rect x="420" y="338" width="84" height="30" rx="6" fill="#123058"/>
    <text x="462" y="357" fill="#61dafb" font-size="9.5" text-anchor="middle">batterie 12 V (TBT)</text>
    <circle cx="436" cy="392" r="8" fill="#20293c" stroke="#5b7bb8" stroke-width="1.5"/>
    <text x="452" y="396" fill="#9bbefc" font-size="10">voyant d'état : … ?</text>
    <circle cx="368" cy="300" r="15" fill="#08132c" stroke="#ffd66b" stroke-width="2.5"/>
    <text x="368" y="306" fill="#ffd66b" font-size="15" font-weight="bold" text-anchor="middle">5</text>
    <text x="340" y="336" fill="#9bbefc" font-size="11" text-anchor="middle">coffret</text>
    <text x="340" y="350" fill="#9bbefc" font-size="11" text-anchor="middle">technique</text>
  </g>

  <!-- 6 · câble débranché -->
  <g>
    <path d="M416 420 q-24 34 -10 62 q8 16 -6 26" stroke="#ff7b88" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="390" y="508" width="22" height="14" rx="4" fill="#08132c" stroke="#ff7b88" stroke-width="2"/>
    <rect x="418" y="428" width="16" height="10" rx="3" fill="#08132c" stroke="#61dafb" stroke-width="1.6"/>
    <text x="452" y="440" fill="#9bbefc" font-size="9.5">borne « CAPTEUR »</text>
    <circle cx="356" cy="470" r="15" fill="#08132c" stroke="#ffd66b" stroke-width="2.5"/>
    <text x="356" y="476" fill="#ffd66b" font-size="15" font-weight="bold" text-anchor="middle">6</text>
    <text x="330" y="502" fill="#9bbefc" font-size="11" text-anchor="middle">câble et</text>
    <text x="330" y="516" fill="#9bbefc" font-size="11" text-anchor="middle">connecteur</text>
  </g>

  <!-- méthode -->
  <g font-size="11">
    <rect x="640" y="250" width="270" height="200" rx="12" fill="#0d2347" stroke="#274a8a"/>
    <text x="656" y="276" fill="#81fba1" font-weight="bold" font-size="13">👀 L'inspection visuelle, c'est :</text>
    <text x="656" y="300" fill="#e4eaf5">1. regarder zone par zone, SANS démonter</text>
    <text x="656" y="320" fill="#e4eaf5">2. comparer avec l'état normal</text>
    <text x="656" y="340" fill="#e4eaf5">3. noter CE QUE JE VOIS (pas ce que je crois)</text>
    <text x="656" y="360" fill="#e4eaf5">4. désigner la ou les pièces suspectes</text>
    <text x="656" y="388" fill="#ffd66b" font-size="10.5">⚠ On n'ouvre RIEN sans avoir coupé</text>
    <text x="656" y="404" fill="#ffd66b" font-size="10.5">l'alimentation — même en très basse tension.</text>
    <text x="656" y="430" fill="#9bbefc" font-size="10">Témoignage du gardien : « la lampe n°3 est</text>
    <text x="656" y="444" fill="#9bbefc" font-size="10">restée éteinte toute la nuit, même au passage. »</text>
  </g>

  <text x="470" y="576" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">Un bon dépanneur commence toujours par ses yeux : la panne laisse presque toujours un indice visible.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#08132c"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#123058"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#1b1440"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#20293c"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#223c6b"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#274a8a"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#4f7a3f"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#5b7bb8"]{fill:#ffffff}
  text[fill="#5b7bb8"],tspan[fill="#5b7bb8"]{fill:#5475b5}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  *:not(text):not(tspan)[fill="#7a6a3f"]{fill:#ffffff}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  [stroke="#ff7b88"]{stroke:#eb0017}
  text[fill="#ffb454"],tspan[fill="#ffb454"],[fill="#ffb454"] text,[fill="#ffb454"] tspan{fill:#b06300}
  [stroke="#ffb454"]{stroke:#b06300}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
