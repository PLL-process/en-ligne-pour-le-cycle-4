<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">L'atelier de fabrication de la commune : quatre postes, quatre procédés</title>
  <desc id="d">Quatre postes d'un atelier de fabrication collaboratif. Poste 1 : l'imprimante 3D, qui fabrique en AJOUTANT de la matière fil fondu couche par couche — idéale pour une pièce sur mesure comme le capot du capteur. Poste 2 : la découpeuse laser, qui fabrique en ENLEVANT de la matière dans une plaque — idéale pour des joints plats et des plaques. Poste 3 : la perceuse à colonne, qui enlève de la matière pour faire des trous précis de fixation. Poste 4 : l'établi de façonnage avec lime et ponceuse, pour les finitions à la main. En bas, les règles de sécurité de l'atelier : lunettes de protection, cheveux attachés, et on n'utilise une machine qu'avec l'autorisation et la présence d'un adulte.</desc>
  <rect width="940" height="560" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">L'atelier de fabrication de la commune — quel procédé pour refaire ta pièce ?</text>

  <g font-size="11">
    <!-- imprimante 3D -->
    <rect x="30" y="56" width="430" height="180" rx="12" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
    <text x="50" y="84" fill="#81fba1" font-weight="bold" font-size="14">🖨 Poste 1 — L'imprimante 3D</text>
    <g>
      <rect x="56" y="102" width="110" height="96" rx="8" fill="#08132c" stroke="#274a8a"/>
      <rect x="70" y="112" width="82" height="8" rx="3" fill="#274a8a"/>
      <rect x="104" y="120" width="10" height="26" fill="#61dafb"/>
      <path d="M96 146 h28 l-4 8 h-20 z" fill="#9bbefc"/>
      <rect x="84" y="168" width="56" height="10" rx="3" fill="#173666"/>
      <rect x="96" y="158" width="32" height="10" rx="3" fill="#2e7d32"/>
    </g>
    <text x="186" y="112" fill="#e4eaf5">Procédé : dépôt de fil fondu,</text>
    <text x="186" y="128" fill="#81fba1" font-weight="bold">couche par couche → on AJOUTE la matière</text>
    <text x="186" y="150" fill="#e4eaf5">Idéal pour : une pièce SUR MESURE</text>
    <text x="186" y="166" fill="#ffd66b">→ le capot du capteur, introuvable</text>
    <text x="186" y="182" fill="#ffd66b">en magasin, se réimprime à l'unité !</text>
    <text x="186" y="204" fill="#9bbefc" font-size="10">Durée : ~1 h pour un petit capot · plastique PETG (tient dehors)</text>
    <text x="56" y="222" fill="#9bbefc" font-size="10">Fichier 3D dessiné à l'ordinateur (tu le feras en 3e !)</text>

    <!-- découpe laser -->
    <rect x="480" y="56" width="430" height="180" rx="12" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
    <text x="500" y="84" fill="#61dafb" font-weight="bold" font-size="14">✂ Poste 2 — La découpeuse laser</text>
    <g>
      <rect x="506" y="102" width="110" height="80" rx="8" fill="#08132c" stroke="#274a8a"/>
      <rect x="514" y="130" width="94" height="44" rx="4" fill="#123058"/>
      <line x1="560" y1="108" x2="560" y2="140" stroke="#ff7b88" stroke-width="2"/>
      <circle cx="560" cy="146" r="5" fill="#ff7b88" opacity="0.8"/>
      <circle cx="545" cy="155" r="12" fill="none" stroke="#61dafb" stroke-width="1.6" stroke-dasharray="4 3"/>
    </g>
    <text x="636" y="112" fill="#e4eaf5">Procédé : un laser découpe une plaque</text>
    <text x="636" y="128" fill="#61dafb" font-weight="bold">→ on ENLÈVE la matière (découpage)</text>
    <text x="636" y="150" fill="#e4eaf5">Idéal pour : pièces PLATES en série</text>
    <text x="636" y="166" fill="#e4eaf5">→ joints, plaques, supports fins</text>
    <text x="636" y="188" fill="#9bbefc" font-size="10">Matériaux : plexiglas, bois fin, carton —</text>
    <text x="636" y="202" fill="#9bbefc" font-size="10">quelques secondes par pièce</text>
    <text x="506" y="222" fill="#9bbefc" font-size="10">Capot en volume impossible ici : la plaque reste… plate !</text>

    <!-- perceuse -->
    <rect x="30" y="256" width="430" height="150" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="2.5"/>
    <text x="50" y="284" fill="#ffb454" font-weight="bold" font-size="14">🔩 Poste 3 — La perceuse à colonne</text>
    <g>
      <rect x="64" y="296" width="16" height="86" rx="4" fill="#173666"/>
      <rect x="56" y="376" width="80" height="12" rx="4" fill="#274a8a"/>
      <rect x="80" y="300" width="52" height="22" rx="6" fill="#08132c" stroke="#274a8a"/>
      <rect x="100" y="322" width="8" height="26" fill="#9bbefc"/>
      <path d="M100 348 l8 0 l-4 12 z" fill="#e4eaf5"/>
      <rect x="88" y="362" width="34" height="10" rx="3" fill="#123058"/>
    </g>
    <text x="160" y="308" fill="#e4eaf5">Procédé : perçage</text>
    <text x="160" y="324" fill="#ffb454" font-weight="bold">→ on ENLÈVE la matière (des trous précis)</text>
    <text x="160" y="346" fill="#e4eaf5">Idéal pour : les trous de FIXATION</text>
    <text x="160" y="362" fill="#e4eaf5">→ fixer le nouveau capot, le support…</text>
    <text x="160" y="384" fill="#9bbefc" font-size="10">Guidage vertical parfait — bien mieux qu'à main levée</text>

    <!-- établi -->
    <rect x="480" y="256" width="430" height="150" rx="12" fill="#0d2347" stroke="#c68ef2" stroke-width="2.5"/>
    <text x="500" y="284" fill="#c68ef2" font-weight="bold" font-size="14">🪚 Poste 4 — L'établi de façonnage</text>
    <g>
      <rect x="506" y="330" width="120" height="12" rx="3" fill="#274a8a"/>
      <rect x="512" y="342" width="10" height="40" fill="#173666"/><rect x="610" y="342" width="10" height="40" fill="#173666"/>
      <rect x="520" y="308" width="46" height="9" rx="4" fill="#9bbefc" transform="rotate(-14 543 312)"/>
      <rect x="578" y="304" width="26" height="18" rx="4" fill="#123058" stroke="#274a8a"/>
    </g>
    <text x="640" y="308" fill="#e4eaf5">Procédé : limage, ponçage, ébavurage</text>
    <text x="640" y="324" fill="#c68ef2" font-weight="bold">→ on ENLÈVE un peu de matière (finition)</text>
    <text x="640" y="346" fill="#e4eaf5">Idéal pour : ajuster et adoucir</text>
    <text x="640" y="362" fill="#e4eaf5">→ les bords de la pièce imprimée</text>
    <text x="640" y="384" fill="#9bbefc" font-size="10">La pièce sortie de machine n'est jamais tout à fait finie</text>
  </g>

  <rect x="60" y="430" width="820" height="58" rx="10" fill="#3d0f18" stroke="#ff7b88" stroke-width="2"/>
  <text x="470" y="453" fill="#ff7b88" font-size="12.5" font-weight="bold" text-anchor="middle">🥽 Sécurité atelier : lunettes de protection · cheveux attachés, pas de vêtements flottants · une machine ne se</text>
  <text x="470" y="472" fill="#ff7b88" font-size="12.5" font-weight="bold" text-anchor="middle">démarre JAMAIS sans l'autorisation ET la présence d'un adulte</text>

  <text x="470" y="516" fill="#e4eaf5" font-size="12" text-anchor="middle">Deux grandes familles : <tspan fill="#81fba1" font-weight="bold">AJOUTER de la matière</tspan> (impression 3D) ou <tspan fill="#61dafb" font-weight="bold">EN ENLEVER</tspan> (découpe, perçage, ponçage).</text>
  <text x="470" y="540" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">Réparer plutôt que jeter : quand la pièce n'existe plus, l'atelier de la commune la refabrique.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#08132c"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#123058"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#274a8a"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#2e7d32"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#3d0f18"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#5b7bb8"]{fill:#ffffff}
  text[fill="#5b7bb8"],tspan[fill="#5b7bb8"]{fill:#5475b5}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  [stroke="#ff7b88"]{stroke:#eb0017}
  text[fill="#ffb454"],tspan[fill="#ffb454"],[fill="#ffb454"] text,[fill="#ffb454"] tspan{fill:#b06300}
  [stroke="#ffb454"]{stroke:#b06300}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
}
]]></style>
</svg>
