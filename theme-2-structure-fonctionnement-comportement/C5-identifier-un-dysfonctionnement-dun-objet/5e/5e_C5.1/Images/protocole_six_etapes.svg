<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le protocole de réparation fourni, en six étapes ordonnées</title>
  <desc id="d">Six étapes reliées par des flèches, à suivre dans l'ordre. Étape 1, sur fond rouge : couper l'alimentation en basculant l'interrupteur de la batterie, règle de sécurité absolue avant de toucher quoi que ce soit. Étape 2 : inspecter et sécher le connecteur du capteur, vérifier qu'il n'est pas oxydé. Étape 3 : rebrancher le câble du capteur sur la borne CAPTEUR jusqu'au clic. Étape 4 : remplacer le capot fissuré par la pièce neuve pour protéger le capteur de la pluie. Étape 5 : remettre l'alimentation. Étape 6, sur fond vert : tester la réparation en cachant le capteur de luminosité, la lampe doit passer en veille. En bas, deux règles d'or : on ne saute jamais d'étape et on ne travaille qu'en très basse tension, jamais sur le secteur.</desc>
  <rect width="940" height="500" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Le protocole de réparation — fourni par le technicien, à suivre DANS L'ORDRE</text>

  <g font-size="11">
    <!-- étape 1 -->
    <rect x="30" y="60" width="280" height="108" rx="12" fill="#3d0f18" stroke="#ff7b88" stroke-width="2.5"/>
    <circle cx="58" cy="86" r="16" fill="#ff7b88"/><text x="58" y="92" fill="#08132c" font-size="15" font-weight="bold" text-anchor="middle">1</text>
    <text x="84" y="82" fill="#ff7b88" font-weight="bold" font-size="12.5">🔌 COUPER L'ALIMENTATION</text>
    <text x="84" y="102" fill="#ffd9dd">Bascule l'interrupteur de la batterie</text>
    <text x="84" y="118" fill="#ffd9dd">(coffret, 12 V TBT).</text>
    <text x="46" y="148" fill="#ffd66b" font-size="10.5">⚠ TOUJOURS l'étape n°1 — jamais les mains</text>
    <text x="46" y="161" fill="#ffd66b" font-size="10.5">dans un circuit alimenté, même en TBT.</text>

    <!-- étape 2 -->
    <rect x="330" y="60" width="280" height="108" rx="12" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <circle cx="358" cy="86" r="16" fill="#61dafb"/><text x="358" y="92" fill="#08132c" font-size="15" font-weight="bold" text-anchor="middle">2</text>
    <text x="384" y="82" fill="#61dafb" font-weight="bold" font-size="12.5">🔍 INSPECTER LE CONNECTEUR</text>
    <text x="384" y="102" fill="#d9f3ff">Sécher le connecteur du capteur,</text>
    <text x="384" y="118" fill="#d9f3ff">vérifier qu'il n'est ni oxydé ni tordu.</text>
    <text x="346" y="148" fill="#9bbefc" font-size="10.5">L'eau entrée par le capot fissuré a pu</text>
    <text x="346" y="161" fill="#9bbefc" font-size="10.5">abîmer le contact.</text>

    <!-- étape 3 -->
    <rect x="630" y="60" width="280" height="108" rx="12" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <circle cx="658" cy="86" r="16" fill="#61dafb"/><text x="658" y="92" fill="#08132c" font-size="15" font-weight="bold" text-anchor="middle">3</text>
    <text x="684" y="82" fill="#61dafb" font-weight="bold" font-size="12.5">🔗 REBRANCHER LE CÂBLE</text>
    <text x="684" y="102" fill="#d9f3ff">Sur la borne « CAPTEUR » du coffret,</text>
    <text x="684" y="118" fill="#d9f3ff">enfoncer jusqu'au CLIC.</text>
    <text x="646" y="148" fill="#9bbefc" font-size="10.5">Un connecteur a un sens : ne jamais</text>
    <text x="646" y="161" fill="#9bbefc" font-size="10.5">forcer.</text>

    <!-- étape 4 -->
    <rect x="30" y="220" width="280" height="108" rx="12" fill="#0d2347" stroke="#c68ef2" stroke-width="2"/>
    <circle cx="58" cy="246" r="16" fill="#c68ef2"/><text x="58" y="252" fill="#08132c" font-size="15" font-weight="bold" text-anchor="middle">4</text>
    <text x="84" y="242" fill="#c68ef2" font-weight="bold" font-size="12.5">🧩 REMPLACER LE CAPOT</text>
    <text x="84" y="262" fill="#efe0fb">Retirer le capot fissuré, clipser la</text>
    <text x="84" y="278" fill="#efe0fb">pièce neuve sur le capteur.</text>
    <text x="46" y="308" fill="#9bbefc" font-size="10.5">Sans capot étanche, la panne reviendra</text>
    <text x="46" y="321" fill="#9bbefc" font-size="10.5">à la prochaine pluie.</text>

    <!-- étape 5 -->
    <rect x="330" y="220" width="280" height="108" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="2"/>
    <circle cx="358" cy="246" r="16" fill="#ffb454"/><text x="358" y="252" fill="#08132c" font-size="15" font-weight="bold" text-anchor="middle">5</text>
    <text x="384" y="242" fill="#ffb454" font-weight="bold" font-size="12.5">⚡ REMETTRE L'ALIMENTATION</text>
    <text x="384" y="262" fill="#ffe9cf">Rebasculer l'interrupteur : le voyant</text>
    <text x="384" y="278" fill="#ffe9cf">du coffret doit repasser au VERT.</text>
    <text x="346" y="308" fill="#9bbefc" font-size="10.5">Voyant toujours éteint ? On recommence</text>
    <text x="346" y="321" fill="#9bbefc" font-size="10.5">l'inspection : autre chose est en cause.</text>

    <!-- étape 6 -->
    <rect x="630" y="220" width="280" height="108" rx="12" fill="#0e2e18" stroke="#81fba1" stroke-width="2.5"/>
    <circle cx="658" cy="246" r="16" fill="#81fba1"/><text x="658" y="252" fill="#08132c" font-size="15" font-weight="bold" text-anchor="middle">6</text>
    <text x="684" y="242" fill="#81fba1" font-weight="bold" font-size="12.5">✅ TESTER LA RÉPARATION</text>
    <text x="684" y="262" fill="#d9ffe3">Cacher le capteur avec la main :</text>
    <text x="684" y="278" fill="#d9ffe3">la lampe doit passer en VEILLE.</text>
    <text x="646" y="308" fill="#9bbefc" font-size="10.5">Pas de test = pas de réparation :</text>
    <text x="646" y="321" fill="#9bbefc" font-size="10.5">c'est le test qui PROUVE le succès.</text>
  </g>

  <!-- flèches -->
  <g stroke="#5b7bb8" stroke-width="2.5" fill="#5b7bb8">
    <line x1="310" y1="114" x2="326" y2="114"/><path d="M326 109 l10 5 l-10 5 z"/>
    <line x1="610" y1="114" x2="626" y2="114"/><path d="M626 109 l10 5 l-10 5 z"/>
    <path d="M770 172 q0 24 -240 24 q-480 0 -480 20" fill="none"/>
    <path d="M45 212 l5 10 l5 -10 z"/>
    <line x1="310" y1="274" x2="326" y2="274"/><path d="M326 269 l10 5 l-10 5 z"/>
    <line x1="610" y1="274" x2="626" y2="274"/><path d="M626 269 l10 5 l-10 5 z"/>
  </g>

  <rect x="60" y="368" width="820" height="56" rx="10" fill="#173666" stroke="#274a8a"/>
  <text x="470" y="390" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Règles d'or du dépanneur : <tspan fill="#ff7b88" font-weight="bold">on ne saute JAMAIS d'étape</tspan> · <tspan fill="#ffd66b" font-weight="bold">très basse tension uniquement, jamais le secteur (230 V = danger mortel : adulte qualifié seulement)</tspan></text>
  <text x="470" y="410" fill="#9bbefc" font-size="11" text-anchor="middle">Un protocole est écrit par quelqu'un qui connaît l'objet ET les dangers : le suivre, c'est réparer en sécurité.</text>

  <text x="470" y="462" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">Sécurité d'abord (1) → réparer (2-3-4) → réalimenter (5) → PROUVER par le test (6).</text>
</svg>
