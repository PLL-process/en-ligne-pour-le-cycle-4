<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 518" width="350" height="518" role="img" aria-labelledby="t_clip_a_refaire d_clip_a_refaire" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_clip_a_refaire">Le clip-support à refaire</title>
<desc id="d_clip_a_refaire">Le clip-support du capteur d'humidité, à refaire. La pièce : diamètre du capteur qu'elle tient 10,0 mm (millimètres) ; forme en VOLUME + 2 ergots élastiques ; cassé — introuvable en magasin. Son environnement, le jardin : soleil + UV, arrosage, 30 °C+ chaleur, la pièce vivra DEHORS, des années. Les procédés de l'atelier : Impression 3D (PETG), Découpe-pliage (PVC), Taille du bois. Le document ne dit pas lequel choisir.</desc>
<rect width="350" height="518" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le clip-support à refaire</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Ce qu'on sait de la pièce cassée, de l'endroit</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">où elle vivra, et les procédés de l'atelier.</text>
<rect x="14.0" y="87.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">La pièce</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">Diamètre du capteur à tenir : 10,0 mm.</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">Forme en VOLUME + 2 ergots élastiques.</text>
<text x="26.0" y="186.4" font-size="15" fill="#e4eaf5">Cassé — introuvable en magasin.</text>
<rect x="14.0" y="214.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="244.4" font-size="16" fill="#61dafb" font-weight="700">Son environnement : le jardin</text>
<text x="26.0" y="271.4" font-size="15" fill="#e4eaf5">Soleil et UV, arrosage, 30 °C+ chaleur.</text>
<text x="26.0" y="292.4" font-size="15" fill="#e4eaf5">La pièce vivra DEHORS, des années.</text>
<rect x="14.0" y="320.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="350.4" font-size="16" fill="#61dafb" font-weight="700">Les procédés de l'atelier</text>
<text x="26.0" y="377.4" font-size="15" fill="#e4eaf5">🖨 Impression 3D (PETG)</text>
<text x="26.0" y="398.4" font-size="15" fill="#e4eaf5">✂ Découpe-pliage (PVC)</text>
<text x="26.0" y="419.4" font-size="15" fill="#e4eaf5">🪚 Taille du bois</text>
<text x="14.0" y="461.6" font-size="13.5" fill="#9bbefc">mm : millimètres · UV : les rayons ultraviolets du</text>
<text x="14.0" y="479.8" font-size="13.5" fill="#9bbefc">soleil · Le document ne dit pas quel procédé</text>
<text x="14.0" y="498.0" font-size="13.5" fill="#9bbefc">choisir : c'est la question.</text>
</svg>
