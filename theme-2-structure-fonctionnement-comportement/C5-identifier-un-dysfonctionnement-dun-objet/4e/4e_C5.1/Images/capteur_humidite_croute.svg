<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, sans-serif">
<title id="t">Le capteur d'humidité pris dans sa croûte</title><desc id="d">Coupe d'un pot de terre : les deux électrodes du capteur d'humidité sont enrobées d'une croûte de terre et de calcaire. La croûte, toujours humide, conduit le courant entre les électrodes : le capteur mesure « humide » en permanence, même quand la terre du pot est sèche.</desc>
<rect width="800" height="380" fill="#FFFFFF"/><path d="M180 120 L620 120 L570 360 L230 360 Z" fill="#D9B38C"/>
<path d="M180 120 L620 120 L612 158 L188 158 Z" fill="#B07C4F"/>
<text x="400" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3864">Terre du pot : SÈCHE</text>
<rect x="368" y="60" width="64" height="70" rx="8" fill="#1F3864"/>
<text x="400" y="94" text-anchor="middle" font-size="14" fill="#FFFFFF">capteur</text>
<rect x="378" y="130" width="12" height="150" fill="#8C8C8C"/>
<rect x="410" y="130" width="12" height="150" fill="#8C8C8C"/>
<ellipse cx="400" cy="230" rx="86" ry="78" fill="#7A5230" opacity="0.92"/>
<ellipse cx="400" cy="230" rx="86" ry="78" fill="none" stroke="#4d3118" stroke-width="4" stroke-dasharray="10 6"/>
<text x="400" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">CROÛTE terre + calcaire</text>
<text x="400" y="246" text-anchor="middle" font-size="14" fill="#FFE9C9">toujours humide → conduit le courant</text>
<path d="M390 262 q10 12 20 0" stroke="#F4C542" stroke-width="5" fill="none"/>
<path d="M120 200 h50" stroke="#C55A11" stroke-width="4" marker-end="url(#fo)"/>
<text x="118" y="180" font-size="15" fill="#C55A11" font-weight="bold">le courant passe</text>
<text x="118" y="198" font-size="15" fill="#C55A11">DANS la croûte,</text>
<text x="118" y="216" font-size="15" fill="#C55A11" transform="translate(0,20)">pas dans la terre</text>
<rect x="560" y="40" width="210" height="64" rx="10" fill="#FDEBD0" stroke="#C55A11" stroke-width="3"/>
<text x="665" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#C55A11">Mesure affichée :</text>
<text x="665" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#C00000">« HUMIDE » — FAUX !</text>
<defs><marker id="fo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#C55A11"/></marker></defs></svg>