<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="t d">
<title id="t">Le jardin connecté en panne : trois faits qui se contredisent</title>
<desc id="d">Scène du carré potager : plants de tomates flétris sur un sol craquelé, réservoir d'eau plein aux trois quarts, coffret dont l'écran affiche Humidité 78 % et Arrosage OK avec un voyant vert, pompe silencieuse reliée à un goutte-à-goutte à sec, capteur d'humidité planté en terre entouré d'une croûte. Trois étiquettes numérotent les faits à retenir.</desc>
<rect width="920" height="520" fill="#0d2347"/>
<text x="460" y="34" fill="#81aaff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">🚑 Mardi matin au carré potager — observe AVANT d'agir</text>
<!-- sol craquelé -->
<rect x="20" y="380" width="880" height="120" fill="#7a5a3a"/>
<path d="M60 420 l60 8 M150 460 l70 -6 M280 430 l50 10 M420 465 l60 -8 M600 435 l55 6 M740 460 l60 -8 M180 405 l40 12 M520 405 l45 10" stroke="#4a3520" stroke-width="3" fill="none"/>
<!-- plants flétris -->
<g font-family="sans-serif">
  <path d="M120 380 q-8 -50 4 -80 q14 24 8 80z" fill="#8a9a4a"/>
  <path d="M124 320 q-26 -6 -38 12" stroke="#8a9a4a" stroke-width="7" fill="none"/>
  <path d="M126 335 q24 -2 32 16" stroke="#8a9a4a" stroke-width="7" fill="none"/>
  <circle cx="112" cy="345" r="9" fill="#c0543a"/>
  <path d="M210 380 q-6 -44 2 -70 q12 20 8 70z" fill="#8a9a4a"/>
  <path d="M214 328 q-22 -8 -34 8" stroke="#8a9a4a" stroke-width="6" fill="none"/>
  <text x="165" y="500" fill="#ff7b88" font-size="17" font-weight="bold" text-anchor="middle">FAIT n°1 : sol qui CRAQUE, plants flétris</text>
</g>
<!-- réservoir -->
<g>
  <rect x="300" y="240" width="130" height="150" rx="8" fill="#173666" stroke="#61dafb" stroke-width="3"/>
  <rect x="306" y="278" width="118" height="106" fill="#2e7bd6" opacity="0.85"/>
  <line x1="300" y1="278" x2="430" y2="278" stroke="#ffd66b" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="365" y="230" fill="#e4eaf5" font-family="sans-serif" font-size="16" text-anchor="middle">Réservoir</text>
  <text x="365" y="500" fill="#81fba1" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">FAIT n°2 : réservoir PLEIN aux ¾</text>
</g>
<!-- pompe + tuyau -->
<g>
  <rect x="450" y="340" width="80" height="50" rx="8" fill="#173666" stroke="#9bbefc" stroke-width="2"/>
  <text x="490" y="370" fill="#e4eaf5" font-family="sans-serif" font-size="14" text-anchor="middle">POMPE</text>
  <text x="490" y="330" fill="#9bbefc" font-family="sans-serif" font-size="13" text-anchor="middle">…silencieuse</text>
  <path d="M430 350 h20 M530 365 q120 0 180 20" stroke="#9bbefc" stroke-width="5" fill="none"/>
  <text x="640" y="360" fill="#9bbefc" font-family="sans-serif" font-size="13" text-anchor="middle">goutte-à-goutte À SEC</text>
</g>
<!-- capteur -->
<g>
  <rect x="790" y="330" width="16" height="70" rx="3" fill="#c68ef2"/>
  <rect x="782" y="300" width="32" height="34" rx="5" fill="#173666" stroke="#c68ef2" stroke-width="2"/>
  <ellipse cx="798" cy="402" rx="34" ry="12" fill="#5a4326" stroke="#ffd66b" stroke-width="2"/>
  <text x="798" y="290" fill="#c68ef2" font-family="sans-serif" font-size="14" text-anchor="middle">capteur d'humidité</text>
  <text x="798" y="432" fill="#ffd66b" font-family="sans-serif" font-size="12" text-anchor="middle">croûte de terre ?</text>
</g>
<!-- coffret écran -->
<g>
  <rect x="560" y="90" width="290" height="150" rx="10" fill="#050f24" stroke="#61dafb" stroke-width="3"/>
  <text x="705" y="120" fill="#61dafb" font-family="monospace" font-size="18" text-anchor="middle">JARDIN CONNECTÉ v2</text>
  <text x="705" y="155" fill="#e4eaf5" font-family="monospace" font-size="20" text-anchor="middle">Humidité sol : 78 %</text>
  <text x="705" y="188" fill="#81fba1" font-family="monospace" font-size="20" text-anchor="middle">ARROSAGE : OK</text>
  <circle cx="585" cy="215" r="8" fill="#81fba1"/>
  <text x="600" y="220" fill="#9bbefc" font-family="sans-serif" font-size="13">voyant carte : VERT (alimentée)</text>
  <text x="705" y="70" fill="#ff7b88" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">FAIT n°3 : l'écran dit « tout va bien »…</text>
</g>
<!-- question -->
<rect x="20" y="46" width="430" height="150" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
<text x="35" y="76" fill="#ffd66b" font-family="sans-serif" font-size="17" font-weight="bold">❓ Trois faits se contredisent :</text>
<text x="35" y="104" fill="#e4eaf5" font-family="sans-serif" font-size="15">le sol est SEC, le réservoir est PLEIN,</text>
<text x="35" y="128" fill="#e4eaf5" font-family="sans-serif" font-size="15">et la mesure affiche « HUMIDE ».</text>
<text x="35" y="160" fill="#61dafb" font-family="sans-serif" font-size="15" font-weight="bold">Qui ment ? Ton protocole doit le PROUVER,</text>
<text x="35" y="184" fill="#61dafb" font-family="sans-serif" font-size="15" font-weight="bold">test après test — du plus rapide au plus long.</text>
</svg>
