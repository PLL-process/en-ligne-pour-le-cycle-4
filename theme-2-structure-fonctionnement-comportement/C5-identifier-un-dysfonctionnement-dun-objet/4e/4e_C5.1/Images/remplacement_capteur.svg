<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="t d">
<title id="t">Les six gestes du remplacement du capteur — dans le désordre, à toi de construire l'ordre</title>
<desc id="d">Six vignettes non numérotées présentent les gestes du remplacement du capteur d'humidité : test final au plant témoin, débrancher et extraire l'ancien capteur, couper l'alimentation et photographier le branchement, installer le neuf selon la photo, comparer capteur neuf et ancien, remettre l'alimentation. Un bandeau rappelle que tout se fait en très basse tension 12 volts, jamais le secteur, et qu'aucun ordre n'est donné : c'est à l'élève de le construire.</desc>
<rect width="920" height="560" fill="#0d2347"/>
<text x="460" y="36" fill="#81aaff" font-family="sans-serif" font-size="23" font-weight="bold" text-anchor="middle">🧰 Les 6 gestes du remplacement — présentés DANS LE DÉSORDRE</text>
<g font-family="sans-serif">
  <!-- vignette : test final -->
  <rect x="30" y="60" width="270" height="190" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="165" y="90" fill="#61dafb" font-size="15" font-weight="bold" text-anchor="middle">🧪 Test final au plant témoin</text>
  <path d="M120 190 q-6 -40 4 -62 q10 18 6 62z" fill="#7fae4e"/>
  <path d="M150 150 q14 10 8 40" stroke="#61dafb" stroke-width="4" fill="none"/>
  <circle cx="158" cy="146" r="6" fill="#61dafb"/>
  <text x="165" y="222" fill="#e4eaf5" font-size="13" text-anchor="middle">verser de l'eau : la mesure chute,</text>
  <text x="165" y="240" fill="#e4eaf5" font-size="13" text-anchor="middle">la pompe doit s'amorcer — la PREUVE</text>
  <!-- vignette : extraire -->
  <rect x="325" y="60" width="270" height="190" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="460" y="90" fill="#61dafb" font-size="15" font-weight="bold" text-anchor="middle">🪛 Débrancher et extraire l'ancien</text>
  <rect x="430" y="115" width="14" height="60" rx="3" fill="#c68ef2" transform="rotate(18 437 145)"/>
  <ellipse cx="470" cy="185" rx="30" ry="10" fill="#5a4326"/>
  <path d="M470 178 q10 -14 24 -16" stroke="#ffd66b" stroke-width="3" fill="none"/>
  <text x="460" y="222" fill="#e4eaf5" font-size="13" text-anchor="middle">le connecteur d'abord, puis la sonde —</text>
  <text x="460" y="240" fill="#e4eaf5" font-size="13" text-anchor="middle">sa croûte de terre sort avec elle</text>
  <!-- vignette : couper + photo -->
  <rect x="620" y="60" width="270" height="190" rx="10" fill="#173666" stroke="#ffd66b" stroke-width="2"/>
  <text x="755" y="90" fill="#ffd66b" font-size="15" font-weight="bold" text-anchor="middle">🔌📸 Couper l'alim + PHOTO</text>
  <rect x="680" y="120" width="60" height="36" rx="6" fill="#050f24" stroke="#9bbefc" stroke-width="2"/>
  <line x1="695" y1="138" x2="725" y2="138" stroke="#ff7b88" stroke-width="5"/>
  <rect x="770" y="115" width="54" height="42" rx="6" fill="#050f24" stroke="#61dafb" stroke-width="2"/>
  <circle cx="797" cy="136" r="12" fill="none" stroke="#61dafb" stroke-width="3"/>
  <text x="755" y="222" fill="#e4eaf5" font-size="13" text-anchor="middle">la sécurité ET la mémoire du câblage,</text>
  <text x="755" y="240" fill="#e4eaf5" font-size="13" text-anchor="middle">en un seul geste de pro</text>
  <!-- vignette : installer selon photo -->
  <rect x="30" y="270" width="270" height="190" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="165" y="300" fill="#61dafb" font-size="15" font-weight="bold" text-anchor="middle">🧩 Installer et rebrancher</text>
  <rect x="120" y="330" width="14" height="60" rx="3" fill="#81fba1"/>
  <rect x="180" y="330" width="54" height="42" rx="6" fill="#050f24" stroke="#61dafb" stroke-width="2"/>
  <text x="207" y="357" fill="#61dafb" font-size="12" text-anchor="middle">photo</text>
  <text x="165" y="432" fill="#e4eaf5" font-size="13" text-anchor="middle">À L'IDENTIQUE, en suivant la photo :</text>
  <text x="165" y="450" fill="#e4eaf5" font-size="13" text-anchor="middle">mêmes bornes, même sens</text>
  <!-- vignette : comparer -->
  <rect x="325" y="270" width="270" height="190" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="460" y="300" fill="#61dafb" font-size="15" font-weight="bold" text-anchor="middle">🔍 Comparer neuf / ancien</text>
  <rect x="395" y="330" width="14" height="62" rx="3" fill="#c68ef2"/>
  <rect x="455" y="330" width="14" height="62" rx="3" fill="#81fba1"/>
  <text x="402" y="412" fill="#9bbefc" font-size="12" text-anchor="middle">ancien</text>
  <text x="462" y="412" fill="#9bbefc" font-size="12" text-anchor="middle">neuf</text>
  <text x="520" y="352" fill="#ffd66b" font-size="13">3 broches ?</text>
  <text x="520" y="372" fill="#ffd66b" font-size="13">longueur ?</text>
  <text x="520" y="392" fill="#ffd66b" font-size="13">repères ?</text>
  <text x="460" y="442" fill="#e4eaf5" font-size="13" text-anchor="middle">AVANT de monter : la compatibilité</text>
  <!-- vignette : réalimenter -->
  <rect x="620" y="270" width="270" height="190" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="755" y="300" fill="#61dafb" font-size="15" font-weight="bold" text-anchor="middle">⚡ Remettre l'alimentation</text>
  <rect x="690" y="330" width="60" height="36" rx="6" fill="#050f24" stroke="#9bbefc" stroke-width="2"/>
  <line x1="720" y1="322" x2="720" y2="348" stroke="#81fba1" stroke-width="5"/>
  <text x="800" y="352" fill="#81fba1" font-size="14">12 V ✓</text>
  <text x="755" y="432" fill="#e4eaf5" font-size="13" text-anchor="middle">la carte redémarre : l'écran affiche</text>
  <text x="755" y="450" fill="#e4eaf5" font-size="13" text-anchor="middle">enfin une mesure crédible</text>
</g>
<rect x="30" y="482" width="860" height="60" rx="10" fill="#050f24" stroke="#ff7b88" stroke-width="2"/>
<text x="460" y="508" fill="#ff7b88" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">⚠ Très basse tension uniquement (12 V) — le secteur 230 V est INTERDIT.</text>
<text x="460" y="530" fill="#ffd66b" font-family="sans-serif" font-size="15" text-anchor="middle">Aucun numéro sur ces vignettes : en 4e, l'ordre du remplacement, c'est TOI qui le construis.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#5a4326"]{fill:#ffffff}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#7fae4e"],tspan[fill="#7fae4e"],[fill="#7fae4e"] text,[fill="#7fae4e"] tspan{fill:#5b7d38}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  [stroke="#9bbefc"]{stroke:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  [stroke="#ff7b88"]{stroke:#eb0017}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
