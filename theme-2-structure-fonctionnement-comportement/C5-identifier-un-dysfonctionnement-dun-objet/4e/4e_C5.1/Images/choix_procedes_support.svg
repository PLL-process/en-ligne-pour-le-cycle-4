<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="t d">
<title id="t">Trois procédés candidats pour refabriquer le clip-support du capteur, comparés selon des critères</title>
<desc id="d">Le clip-support cassé est dessiné avec sa cote de 10 millimètres. Trois colonnes comparent l'impression 3D en PETG, la découpe-pliage de plaque PVC et la taille dans le bois, selon quatre critères : forme en volume avec ergots, tenue au soleil et à l'humidité du jardin, durée de fabrication, matériel disponible au labo. L'impression 3D coche tous les critères, les deux autres procédés échouent sur la forme ou la tenue.</desc>
<rect width="920" height="560" fill="#0d2347"/>
<text x="460" y="34" fill="#81aaff" font-family="sans-serif" font-size="23" font-weight="bold" text-anchor="middle">🏭 Refabriquer le clip-support : quel procédé CHOISIR ?</text>
<!-- pièce cassée -->
<g font-family="sans-serif">
  <rect x="40" y="70" width="230" height="150" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="155" y="96" fill="#ffd66b" font-size="15" font-weight="bold" text-anchor="middle">La pièce à refaire</text>
  <path d="M100 150 a26 26 0 1 1 8 20" fill="none" stroke="#c68ef2" stroke-width="9"/>
  <path d="M104 174 l-12 16 M116 178 l-4 18" stroke="#ff7b88" stroke-width="4"/>
  <line x1="100" y1="124" x2="152" y2="124" stroke="#61dafb" stroke-width="2"/>
  <text x="126" y="118" fill="#61dafb" font-size="12" text-anchor="middle">⌀ 10,0 mm</text>
  <text x="155" y="205" fill="#e4eaf5" font-size="12.5" text-anchor="middle">forme en VOLUME + 2 ergots élastiques</text>
  <text x="155" y="188" fill="#ff7b88" font-size="12.5" text-anchor="middle">cassé — introuvable en magasin</text>
</g>
<!-- environnement -->
<g font-family="sans-serif">
  <rect x="290" y="70" width="280" height="150" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="430" y="96" fill="#ffd66b" font-size="15" font-weight="bold" text-anchor="middle">Son environnement : le jardin</text>
  <circle cx="340" cy="140" r="20" fill="#ffd66b"/>
  <text x="340" y="185" fill="#e4eaf5" font-size="12.5" text-anchor="middle">soleil + UV</text>
  <path d="M420 122 q6 14 0 22 q-6 -8 0 -22z M440 130 q6 14 0 22 q-6 -8 0 -22z" fill="#61dafb"/>
  <text x="430" y="185" fill="#e4eaf5" font-size="12.5" text-anchor="middle">arrosage</text>
  <text x="510" y="146" fill="#ff7b88" font-size="19" text-anchor="middle">30 °C+</text>
  <text x="510" y="185" fill="#e4eaf5" font-size="12.5" text-anchor="middle">chaleur</text>
  <text x="430" y="208" fill="#9bbefc" font-size="12.5" text-anchor="middle">la pièce vivra DEHORS, des années</text>
</g>
<!-- règle -->
<g font-family="sans-serif">
  <rect x="590" y="70" width="300" height="150" rx="10" fill="#050f24" stroke="#61dafb" stroke-width="2"/>
  <text x="740" y="98" fill="#61dafb" font-size="15" font-weight="bold" text-anchor="middle">La règle du choix</text>
  <text x="740" y="128" fill="#e4eaf5" font-size="13.5" text-anchor="middle">croiser la FORME de la pièce,</text>
  <text x="740" y="150" fill="#e4eaf5" font-size="13.5" text-anchor="middle">le MATÉRIAU adapté au milieu,</text>
  <text x="740" y="172" fill="#e4eaf5" font-size="13.5" text-anchor="middle">le TEMPS et le matériel du labo.</text>
  <text x="740" y="202" fill="#ffd66b" font-size="13.5" font-weight="bold" text-anchor="middle">Et la gamme commence par MESURER.</text>
</g>
<!-- tableau des 3 procédés -->
<g font-family="sans-serif" font-size="14">
  <rect x="40" y="250" width="850" height="250" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="250" y="282" fill="#61dafb" font-size="16" font-weight="bold" text-anchor="middle">🖨 Impression 3D (PETG)</text>
  <text x="530" y="282" fill="#c68ef2" font-size="16" font-weight="bold" text-anchor="middle">✂ Découpe-pliage (PVC)</text>
  <text x="775" y="282" fill="#ffd66b" font-size="16" font-weight="bold" text-anchor="middle">🪚 Taille du bois</text>
  <text x="60" y="322" fill="#9bbefc">Forme volume + ergots</text>
  <text x="250" y="322" fill="#81fba1" text-anchor="middle">✔ couche par couche, en 1 pièce</text>
  <text x="530" y="322" fill="#ff7b88" text-anchor="middle">✘ reste une plaque pliée</text>
  <text x="775" y="322" fill="#ff7b88" text-anchor="middle">✘ ergots fragiles, très long</text>
  <text x="60" y="362" fill="#9bbefc">Tenue soleil + humidité</text>
  <text x="250" y="362" fill="#81fba1" text-anchor="middle">✔ le PETG tient chaleur et UV</text>
  <text x="530" y="362" fill="#ffd66b" text-anchor="middle">~ correcte</text>
  <text x="775" y="362" fill="#ff7b88" text-anchor="middle">✘ gonfle à l'humidité</text>
  <text x="60" y="402" fill="#9bbefc">Durée de fabrication</text>
  <text x="250" y="402" fill="#81fba1" text-anchor="middle">✔ ≈ 40 min, machine seule</text>
  <text x="530" y="402" fill="#81fba1" text-anchor="middle">✔ rapide</text>
  <text x="775" y="402" fill="#ff7b88" text-anchor="middle">✘ 2 h à la main</text>
  <text x="60" y="442" fill="#9bbefc">Matériel du labo</text>
  <text x="250" y="442" fill="#81fba1" text-anchor="middle">✔ imprimante + bobine PETG</text>
  <text x="530" y="442" fill="#81fba1" text-anchor="middle">✔ plieuse disponible</text>
  <text x="775" y="442" fill="#ffd66b" text-anchor="middle">~ établi</text>
  <line x1="60" y1="460" x2="870" y2="460" stroke="#274a8a" stroke-width="2"/>
  <text x="250" y="488" fill="#81fba1" font-size="16" font-weight="bold" text-anchor="middle">🏆 RETENU (4/4 critères)</text>
  <text x="530" y="488" fill="#ff7b88" text-anchor="middle">écarté : la FORME</text>
  <text x="775" y="488" fill="#ff7b88" text-anchor="middle">écarté : la TENUE</text>
</g>
<text x="460" y="536" fill="#9bbefc" font-family="sans-serif" font-size="14" text-anchor="middle">⚠ Atelier : lunettes, cheveux attachés, autorisation ET présence d'un adulte — pour TOUTES les machines.</text>
</svg>
