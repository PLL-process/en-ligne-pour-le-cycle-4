<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Trois procédés pour fabriquer la pièce sur mesure</title>
  <desc id="d">Comparaison de trois procédés de fabrication pour le support de girouette : impression 3D par dépôt de fil, adaptée aux formes complexes en petite série, quelques heures par pièce ; découpe et assemblage de plaques, rapide et disponible au collège mais limitée aux formes simples ; moulage, rentable seulement en grande série industrielle. Chaque procédé est illustré par un pictogramme schématique avec ses avantages et ses limites.</desc>
  <rect width="940" height="430" fill="#050f24"/>
  <text x="470" y="32" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Quel procédé pour refabriquer le support ?</text>

  <!-- Impression 3D -->
  <g>
    <rect x="40" y="60" width="272" height="310" rx="14" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
    <text x="176" y="90" fill="#81fba1" font-size="14" font-weight="bold" text-anchor="middle">🖨 Impression 3D (dépôt de fil)</text>
    <!-- picto -->
    <rect x="116" y="106" width="120" height="14" fill="#173666" stroke="#274a8a"/>
    <rect x="146" y="150" width="60" height="10" fill="#61dafb"/>
    <rect x="141" y="160" width="70" height="10" fill="#61dafb"/>
    <rect x="136" y="170" width="80" height="10" fill="#61dafb"/>
    <line x1="176" y1="120" x2="176" y2="148" stroke="#ffd66b" stroke-width="3"/>
    <circle cx="176" cy="120" r="5" fill="#ffd66b"/>
    <g font-size="11" fill="#9bbefc">
      <text x="56" y="212">✔ formes complexes possibles</text>
      <text x="56" y="232">✔ pièce unique ou petite série</text>
      <text x="56" y="252">✔ fichier 3D réutilisable</text>
      <text x="56" y="276" fill="#ff7b88">✘ quelques heures par pièce</text>
      <text x="56" y="296" fill="#ff7b88">✘ résistance selon le sens</text>
      <text x="70" y="312" fill="#ff7b88">d'impression</text>
      <text x="56" y="340" fill="#ffd66b">domaine de la machine :</text>
      <text x="56" y="356" fill="#ffd66b">220 × 220 × 220 mm au plus</text>
    </g>
  </g>

  <!-- Découpe -->
  <g>
    <rect x="334" y="60" width="272" height="310" rx="14" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
    <text x="470" y="90" fill="#61dafb" font-size="14" font-weight="bold" text-anchor="middle">✂ Découpe + assemblage</text>
    <rect x="410" y="120" width="120" height="40" fill="#173666" stroke="#61dafb" stroke-width="2"/>
    <line x1="410" y1="140" x2="530" y2="140" stroke="#ffd66b" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M540 128 l16 12 l-16 12" fill="none" stroke="#ffd66b" stroke-width="2.5"/>
    <g font-size="11" fill="#9bbefc">
      <text x="350" y="212">✔ rapide (minutes)</text>
      <text x="350" y="232">✔ outils disponibles au collège</text>
      <text x="350" y="252">✔ plaques plastique/bois en stock</text>
      <text x="350" y="276" fill="#ff7b88">✘ formes simples uniquement</text>
      <text x="350" y="296" fill="#ff7b88">✘ assemblage = points faibles</text>
      <text x="350" y="330" fill="#81fba1">→ bonne solution PROVISOIRE</text>
      <text x="350" y="348" fill="#81fba1">en attendant la pièce définitive</text>
    </g>
  </g>

  <!-- Moulage -->
  <g>
    <rect x="628" y="60" width="272" height="310" rx="14" fill="#0d2347" stroke="#c68ef2" stroke-width="2.5"/>
    <text x="764" y="90" fill="#c68ef2" font-size="14" font-weight="bold" text-anchor="middle">🏭 Moulage (injection)</text>
    <path d="M714 120 h100 v34 q0 10 -14 10 h-72 q-14 0 -14 -10 z" fill="#173666" stroke="#c68ef2" stroke-width="2"/>
    <rect x="744" y="106" width="40" height="14" fill="#ffd66b"/>
    <g font-size="11" fill="#9bbefc">
      <text x="644" y="212">✔ très rapide PAR pièce</text>
      <text x="644" y="232">✔ excellente qualité constante</text>
      <text x="644" y="256" fill="#ff7b88">✘ moule très coûteux :</text>
      <text x="658" y="272" fill="#ff7b88">rentable en GRANDE série</text>
      <text x="644" y="292" fill="#ff7b88">✘ inaccessible au collège</text>
      <text x="644" y="330" fill="#9bbefc">→ c'est le procédé d'origine</text>
      <text x="644" y="348" fill="#9bbefc">de la pièce (fabricant)</text>
    </g>
  </g>

  <text x="470" y="404" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">Le choix d'un procédé dépend de : forme de la pièce · nombre d'exemplaires · délai · coût · moyens disponibles · résistance attendue.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#5b7bb8"]{fill:#ffffff}
  text[fill="#5b7bb8"],tspan[fill="#5b7bb8"]{fill:#5475b5}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
