<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Arbre de diagnostic : pourquoi la sirène ne sonne-t-elle plus ?</title>
  <desc id="d">Organigramme de diagnostic. Départ : la sirène ne sonne pas au test. Première question : la LED du boîtier est-elle allumée ? Si non, contrôler batterie et panneau solaire. Si oui : le microcontrôleur envoie-t-il l'ordre (message de test visible dans l'application) ? Si non, contrôler le programme et le microcontrôleur. Si oui : le câble entre le boîtier et la sirène est-il en bon état et bien branché ? Si non, réparer ou rebrancher le câble. Si oui, remplacer la sirène qui est probablement défectueuse.</desc>
  <defs>
    <marker id="dar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Arbre de diagnostic — « la sirène ne sonne plus »</text>

  <!-- départ -->
  <rect x="370" y="48" width="200" height="40" rx="20" fill="#3a1218" stroke="#ff7b88" stroke-width="2.5"/>
  <text x="470" y="73" fill="#ff7b88" font-size="12.5" text-anchor="middle" font-weight="bold">SYMPTÔME : sirène muette</text>
  <line x1="470" y1="88" x2="470" y2="112" stroke="#61dafb" stroke-width="3" marker-end="url(#dar)"/>

  <!-- Q1 losange -->
  <polygon points="470,112 620,152 470,192 320,152" fill="#173666" stroke="#ffd66b" stroke-width="2.5"/>
  <text x="470" y="147" fill="#ffd66b" font-size="12" text-anchor="middle">La LED d'alimentation</text>
  <text x="470" y="163" fill="#ffd66b" font-size="12" text-anchor="middle">du boîtier est-elle allumée ?</text>
  <!-- non -->
  <line x1="320" y1="152" x2="196" y2="152" stroke="#61dafb" stroke-width="3" marker-end="url(#dar)"/>
  <text x="258" y="142" fill="#ff7b88" font-size="11.5" text-anchor="middle" font-weight="bold">NON</text>
  <rect x="40" y="128" width="156" height="52" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
  <text x="118" y="150" fill="#e4eaf5" font-size="11" text-anchor="middle">Contrôler batterie</text>
  <text x="118" y="166" fill="#e4eaf5" font-size="11" text-anchor="middle">et panneau solaire</text>
  <!-- oui -->
  <line x1="470" y1="192" x2="470" y2="222" stroke="#61dafb" stroke-width="3" marker-end="url(#dar)"/>
  <text x="486" y="212" fill="#81fba1" font-size="11.5" font-weight="bold">OUI</text>

  <!-- Q2 -->
  <polygon points="470,222 640,262 470,302 300,262" fill="#173666" stroke="#ffd66b" stroke-width="2.5"/>
  <text x="470" y="252" fill="#ffd66b" font-size="12" text-anchor="middle">Le microcontrôleur envoie-t-il l'ordre ?</text>
  <text x="470" y="268" fill="#9bbefc" font-size="10.5" text-anchor="middle">(le « test sirène » apparaît-il</text>
  <text x="470" y="282" fill="#9bbefc" font-size="10.5" text-anchor="middle">dans le journal de l'application ?)</text>
  <line x1="300" y1="262" x2="196" y2="262" stroke="#61dafb" stroke-width="3" marker-end="url(#dar)"/>
  <text x="248" y="252" fill="#ff7b88" font-size="11.5" text-anchor="middle" font-weight="bold">NON</text>
  <rect x="40" y="238" width="156" height="52" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
  <text x="118" y="260" fill="#e4eaf5" font-size="11" text-anchor="middle">Contrôler programme</text>
  <text x="118" y="276" fill="#e4eaf5" font-size="11" text-anchor="middle">et microcontrôleur</text>
  <line x1="470" y1="302" x2="470" y2="332" stroke="#61dafb" stroke-width="3" marker-end="url(#dar)"/>
  <text x="486" y="322" fill="#81fba1" font-size="11.5" font-weight="bold">OUI</text>

  <!-- Q3 -->
  <polygon points="470,332 640,372 470,412 300,372" fill="#173666" stroke="#ffd66b" stroke-width="2.5"/>
  <text x="470" y="366" fill="#ffd66b" font-size="12" text-anchor="middle">Le câble boîtier → sirène est-il</text>
  <text x="470" y="382" fill="#ffd66b" font-size="12" text-anchor="middle">intact et bien branché ?</text>
  <line x1="300" y1="372" x2="196" y2="372" stroke="#61dafb" stroke-width="3" marker-end="url(#dar)"/>
  <text x="248" y="362" fill="#ff7b88" font-size="11.5" text-anchor="middle" font-weight="bold">NON</text>
  <rect x="40" y="348" width="156" height="52" rx="10" fill="#123322" stroke="#81fba1" stroke-width="2"/>
  <text x="118" y="370" fill="#81fba1" font-size="11" text-anchor="middle">Rebrancher ou</text>
  <text x="118" y="386" fill="#81fba1" font-size="11" text-anchor="middle">remplacer le câble ✔</text>
  <line x1="470" y1="412" x2="470" y2="442" stroke="#61dafb" stroke-width="3" marker-end="url(#dar)"/>
  <text x="486" y="432" fill="#81fba1" font-size="11.5" font-weight="bold">OUI</text>

  <!-- conclusion -->
  <rect x="356" y="442" width="228" height="44" rx="10" fill="#123322" stroke="#81fba1" stroke-width="2.5"/>
  <text x="470" y="461" fill="#81fba1" font-size="11.5" text-anchor="middle" font-weight="bold">Remplacer la sirène</text>
  <text x="470" y="477" fill="#9bbefc" font-size="10.5" text-anchor="middle">(élément probablement défectueux)</text>

  <text x="760" y="140" fill="#9bbefc" font-size="10.5" text-anchor="middle">Règle d'or du dépanneur :</text>
  <text x="760" y="158" fill="#9bbefc" font-size="10.5" text-anchor="middle">tester D'ABORD ce qui est</text>
  <text x="760" y="176" fill="#9bbefc" font-size="10.5" text-anchor="middle">simple, rapide et probable —</text>
  <text x="760" y="194" fill="#9bbefc" font-size="10.5" text-anchor="middle">une seule modification à la fois.</text>
</svg>
