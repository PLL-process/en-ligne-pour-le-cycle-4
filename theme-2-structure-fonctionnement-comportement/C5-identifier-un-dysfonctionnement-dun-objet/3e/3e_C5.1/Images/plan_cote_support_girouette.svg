<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Plan coté du support de girouette à refabriquer</title>
  <desc id="d">Dessin technique coté du support cassé : une platine rectangulaire de 60 millimètres de long sur 40 de large et 8 d'épaisseur, percée de deux trous de fixation de diamètre 5 millimètres entraxe 40 millimètres, surmontée d'un fût cylindrique de diamètre 12 millimètres et de hauteur 35 millimètres percé d'un alésage de 6 millimètres pour l'axe de la girouette. Matière d'origine : plastique ABS. La pièce doit résister aux UV et aux embruns salins.</desc>
  <defs>
    <marker id="cot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 5 L10 0 L10 10 z" fill="#ffd66b"/>
    </marker>
    <marker id="cot2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 5 L10 0 L10 10 z" fill="#ffd66b"/>
    </marker>
  </defs>
  <rect width="940" height="460" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Plan coté — support de girouette (pièce à refabriquer)</text>

  <!-- vue de face -->
  <text x="250" y="66" fill="#9bbefc" font-size="12" text-anchor="middle">VUE DE FACE</text>
  <!-- platine -->
  <rect x="130" y="300" width="240" height="32" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
  <!-- fût -->
  <rect x="226" y="160" width="48" height="140" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
  <!-- alésage (traits cachés) -->
  <line x1="238" y1="160" x2="238" y2="300" stroke="#5b7bb8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="262" y1="160" x2="262" y2="300" stroke="#5b7bb8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- cotes -->
  <line x1="130" y1="356" x2="370" y2="356" stroke="#ffd66b" stroke-width="1.5" marker-start="url(#cot)" marker-end="url(#cot2)"/>
  <text x="250" y="376" fill="#ffd66b" font-size="12" text-anchor="middle">60</text>
  <line x1="404" y1="300" x2="404" y2="332" stroke="#ffd66b" stroke-width="1.5" marker-start="url(#cot)" marker-end="url(#cot2)"/>
  <text x="422" y="320" fill="#ffd66b" font-size="12">8</text>
  <line x1="96" y1="160" x2="96" y2="300" stroke="#ffd66b" stroke-width="1.5" marker-start="url(#cot)" marker-end="url(#cot2)"/>
  <text x="74" y="234" fill="#ffd66b" font-size="12">35</text>
  <line x1="226" y1="132" x2="274" y2="132" stroke="#ffd66b" stroke-width="1.5" marker-start="url(#cot)" marker-end="url(#cot2)"/>
  <text x="250" y="120" fill="#ffd66b" font-size="12" text-anchor="middle">Ø12</text>
  <text x="250" y="152" fill="#5b7bb8" font-size="10.5" text-anchor="middle">alésage Ø6</text>

  <!-- vue de dessus -->
  <text x="680" y="66" fill="#9bbefc" font-size="12" text-anchor="middle">VUE DE DESSUS</text>
  <rect x="560" y="120" width="240" height="160" rx="6" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
  <circle cx="680" cy="200" r="24" fill="none" stroke="#61dafb" stroke-width="2.5"/>
  <circle cx="680" cy="200" r="12" fill="none" stroke="#5b7bb8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="600" cy="200" r="10" fill="none" stroke="#ffd66b" stroke-width="2"/>
  <circle cx="760" cy="200" r="10" fill="none" stroke="#ffd66b" stroke-width="2"/>
  <text x="600" y="178" fill="#ffd66b" font-size="11" text-anchor="middle">Ø5</text>
  <text x="760" y="178" fill="#ffd66b" font-size="11" text-anchor="middle">Ø5</text>
  <line x1="600" y1="248" x2="760" y2="248" stroke="#ffd66b" stroke-width="1.5" marker-start="url(#cot)" marker-end="url(#cot2)"/>
  <text x="680" y="266" fill="#ffd66b" font-size="12" text-anchor="middle">40 (entraxe)</text>
  <line x1="560" y1="300" x2="800" y2="300" stroke="#ffd66b" stroke-width="1.5" marker-start="url(#cot)" marker-end="url(#cot2)"/>
  <text x="680" y="318" fill="#ffd66b" font-size="12" text-anchor="middle">60</text>
  <line x1="828" y1="120" x2="828" y2="280" stroke="#ffd66b" stroke-width="1.5" marker-start="url(#cot)" marker-end="url(#cot2)"/>
  <text x="850" y="204" fill="#ffd66b" font-size="12">40</text>

  <rect x="60" y="396" width="820" height="48" rx="10" fill="#173666" stroke="#274a8a"/>
  <text x="470" y="416" fill="#e4eaf5" font-size="12" text-anchor="middle">Cotes en <b>millimètres</b> · matière d'origine : plastique <tspan fill="#61dafb" font-weight="bold">ABS</tspan> · contraintes : résister aux <tspan fill="#ffd66b">UV</tspan> et aux <tspan fill="#ffd66b">embruns salins</tspan>, supporter la girouette en rotation.</text>
  <text x="470" y="436" fill="#9bbefc" font-size="11" text-anchor="middle">Un plan coté transmet TOUTES les dimensions nécessaires à la fabrication — sans lui, impossible de refaire une pièce qui s'adapte.</text>
</svg>
