<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">La station d'alerte après le cyclone : relevé des symptômes</title>
  <desc id="d">Schéma de la station d'alerte avec quatre constats numérotés relevés après le passage du cyclone : la sirène ne sonne plus lors du test hebdomadaire, la LED d'alimentation du boîtier est allumée, l'application mobile reçoit encore les mesures de vent et de pluie, et la girouette pend, son support cassé. Un encadré rappelle la différence entre symptôme constaté et hypothèse d'explication.</desc>
  <rect width="940" height="440" fill="#050f24"/>
  <text x="470" y="34" fill="#81aaff" font-size="20" font-weight="bold" text-anchor="middle">Après le cyclone : qu'observe-t-on EXACTEMENT ?</text>

  <!-- station simplifiée -->
  <rect x="330" y="120" width="14" height="240" fill="#274a8a"/>
  <rect x="310" y="348" width="54" height="14" rx="4" fill="#274a8a"/>
  <!-- girouette cassée -->
  <line x1="337" y1="120" x2="337" y2="92" stroke="#274a8a" stroke-width="6"/>
  <g transform="rotate(48 337 92)">
    <line x1="337" y1="92" x2="392" y2="80" stroke="#ff7b88" stroke-width="4"/>
    <path d="M392 72 L410 80 L392 88 z" fill="#ff7b88"/>
  </g>
  <path d="M330 96 l14 8 M344 96 l-14 8" stroke="#ff7b88" stroke-width="2.5"/>
  <!-- boîtier -->
  <rect x="292" y="210" width="150" height="90" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
  <text x="367" y="234" fill="#e4eaf5" font-size="11.5" text-anchor="middle">Boîtier électronique</text>
  <circle cx="310" cy="256" r="6" fill="#81fba1"/>
  <text x="322" y="260" fill="#81fba1" font-size="10">LED alimentation : ALLUMÉE</text>
  <text x="367" y="284" fill="#9bbefc" font-size="10" text-anchor="middle">microcontrôleur · batterie · radio</text>
  <!-- sirène -->
  <rect x="150" y="300" width="90" height="60" rx="8" fill="#0d2347" stroke="#ff7b88" stroke-width="2.5"/>
  <path d="M175 322 h18 l11 -11 v30 l-11 -11 h-18 z" fill="#5b7bb8"/>
  <text x="195" y="352" fill="#ff7b88" font-size="10" font-weight="bold" text-anchor="middle">MUETTE</text>
  <line x1="240" y1="330" x2="292" y2="290" stroke="#274a8a" stroke-width="3"/>
  <!-- antenne OK -->
  <line x1="442" y1="240" x2="490" y2="190" stroke="#274a8a" stroke-width="4"/>
  <path d="M500 180 a16 16 0 0 1 0 16" stroke="#81fba1" fill="none" stroke-width="3"/>
  <path d="M510 172 a26 26 0 0 1 0 32" stroke="#81fba1" fill="none" stroke-width="3"/>
  <!-- téléphone OK -->
  <rect x="560" y="200" width="70" height="120" rx="10" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
  <text x="595" y="250" fill="#81fba1" font-size="10.5" text-anchor="middle">📱 mesures</text>
  <text x="595" y="266" fill="#81fba1" font-size="10.5" text-anchor="middle">reçues ✔</text>

  <!-- constats numérotés -->
  <g font-size="12" fill="#e4eaf5">
    <circle cx="84" cy="96" r="13" fill="#173666" stroke="#ff7b88" stroke-width="2"/><text x="84" y="101" text-anchor="middle" fill="#ff7b88" font-weight="bold">1</text>
    <text x="104" y="93">Au test hebdomadaire :</text><text x="104" y="109" fill="#ff7b88" font-weight="bold">la sirène ne sonne plus.</text>

    <circle cx="84" cy="160" r="13" fill="#173666" stroke="#81fba1" stroke-width="2"/><text x="84" y="165" text-anchor="middle" fill="#81fba1" font-weight="bold">2</text>
    <text x="104" y="157">La LED d'alimentation</text><text x="104" y="173" fill="#81fba1">du boîtier est allumée.</text>

    <circle cx="700" cy="96" r="13" fill="#173666" stroke="#81fba1" stroke-width="2"/><text x="700" y="101" text-anchor="middle" fill="#81fba1" font-weight="bold">3</text>
    <text x="720" y="93">L'application reçoit toujours</text><text x="720" y="109" fill="#81fba1">les mesures de vent et de pluie.</text>

    <circle cx="700" cy="160" r="13" fill="#173666" stroke="#ffd66b" stroke-width="2"/><text x="700" y="165" text-anchor="middle" fill="#ffd66b" font-weight="bold">4</text>
    <text x="720" y="157">La girouette pend :</text><text x="720" y="173" fill="#ffd66b">son support est cassé.</text>
  </g>

  <rect x="60" y="382" width="820" height="46" rx="10" fill="#173666" stroke="#274a8a"/>
  <text x="470" y="402" fill="#e4eaf5" font-size="12" text-anchor="middle"><tspan fill="#61dafb" font-weight="bold">Symptôme</tspan> = ce que l'on CONSTATE (la sirène est muette) · <tspan fill="#c68ef2" font-weight="bold">Hypothèse</tspan> = ce que l'on SUPPOSE pour l'expliquer (fusible grillé ? câble arraché ?)</text>
  <text x="470" y="420" fill="#9bbefc" font-size="11" text-anchor="middle">Un bon diagnostic part des symptômes, formule PLUSIEURS hypothèses, puis les teste une par une.</text>
</svg>
