<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Algorigramme de la nouvelle fonctionnalité : alerte graduée</title>
  <desc id="d">Organigramme : début, lire vent et pression, puis premier test : vent supérieur à 118 ? Si oui, vigilance violette, sirène ET gyrophare activés. Sinon, deuxième test : vent supérieur à 90 ? Si oui vigilance rouge, sirène seule. Sinon, troisième test : vent supérieur à 50 ? Si oui vigilance orange, gyrophare seul. Sinon vigilance verte ou jaune, aucun actionneur. Tous les chemins convergent vers : envoyer le message à l'application, puis fin.</desc>
  <defs>
    <marker id="gar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Nouvelle fonctionnalité : l'alerte graduée (algorigramme)</text>

  <rect x="410" y="46" width="120" height="34" rx="17" fill="#173666" stroke="#9bbefc" stroke-width="2"/>
  <text x="470" y="68" fill="#9bbefc" font-size="12" text-anchor="middle">DÉBUT</text>
  <line x1="470" y1="80" x2="470" y2="100" stroke="#61dafb" stroke-width="2.5" marker-end="url(#gar)"/>
  <rect x="380" y="100" width="180" height="38" rx="6" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
  <text x="470" y="124" fill="#e4eaf5" font-size="11.5" text-anchor="middle">Lire vent_kmh, pression_hpa</text>
  <line x1="470" y1="138" x2="470" y2="158" stroke="#61dafb" stroke-width="2.5" marker-end="url(#gar)"/>

  <!-- test 1 -->
  <polygon points="470,158 580,190 470,222 360,190" fill="#173666" stroke="#ffd66b" stroke-width="2.5"/>
  <text x="470" y="195" fill="#ffd66b" font-size="12" text-anchor="middle" font-family="monospace">vent_kmh &gt; 118 ?</text>
  <line x1="580" y1="190" x2="680" y2="190" stroke="#61dafb" stroke-width="2.5" marker-end="url(#gar)"/>
  <text x="622" y="180" fill="#81fba1" font-size="11" font-weight="bold">OUI</text>
  <rect x="684" y="160" width="220" height="60" rx="8" fill="#2b1a3f" stroke="#c68ef2" stroke-width="2.5"/>
  <text x="794" y="184" fill="#c68ef2" font-size="11.5" text-anchor="middle" font-weight="bold">vigilance ← "violette"</text>
  <text x="794" y="204" fill="#e4eaf5" font-size="11" text-anchor="middle">sirène ON + gyrophare ON</text>
  <line x1="470" y1="222" x2="470" y2="242" stroke="#61dafb" stroke-width="2.5" marker-end="url(#gar)"/>
  <text x="486" y="236" fill="#ff7b88" font-size="11" font-weight="bold">NON</text>

  <!-- test 2 -->
  <polygon points="470,242 580,274 470,306 360,274" fill="#173666" stroke="#ffd66b" stroke-width="2.5"/>
  <text x="470" y="279" fill="#ffd66b" font-size="12" text-anchor="middle" font-family="monospace">vent_kmh &gt; 90 ?</text>
  <line x1="580" y1="274" x2="680" y2="274" stroke="#61dafb" stroke-width="2.5" marker-end="url(#gar)"/>
  <text x="622" y="264" fill="#81fba1" font-size="11" font-weight="bold">OUI</text>
  <rect x="684" y="244" width="220" height="60" rx="8" fill="#3a1218" stroke="#ff7b88" stroke-width="2.5"/>
  <text x="794" y="268" fill="#ff7b88" font-size="11.5" text-anchor="middle" font-weight="bold">vigilance ← "rouge"</text>
  <text x="794" y="288" fill="#e4eaf5" font-size="11" text-anchor="middle">sirène ON · gyrophare OFF</text>
  <line x1="470" y1="306" x2="470" y2="326" stroke="#61dafb" stroke-width="2.5" marker-end="url(#gar)"/>
  <text x="486" y="320" fill="#ff7b88" font-size="11" font-weight="bold">NON</text>

  <!-- test 3 -->
  <polygon points="470,326 580,358 470,390 360,358" fill="#173666" stroke="#ffd66b" stroke-width="2.5"/>
  <text x="470" y="363" fill="#ffd66b" font-size="12" text-anchor="middle" font-family="monospace">vent_kmh &gt; 50 ?</text>
  <line x1="580" y1="358" x2="680" y2="358" stroke="#61dafb" stroke-width="2.5" marker-end="url(#gar)"/>
  <text x="622" y="348" fill="#81fba1" font-size="11" font-weight="bold">OUI</text>
  <rect x="684" y="328" width="220" height="60" rx="8" fill="#3a2412" stroke="#ffb454" stroke-width="2.5"/>
  <text x="794" y="352" fill="#ffb454" font-size="11.5" text-anchor="middle" font-weight="bold">vigilance ← "orange"</text>
  <text x="794" y="372" fill="#e4eaf5" font-size="11" text-anchor="middle">gyrophare ON · sirène OFF</text>
  <line x1="470" y1="390" x2="470" y2="410" stroke="#61dafb" stroke-width="2.5" marker-end="url(#gar)"/>
  <text x="486" y="404" fill="#ff7b88" font-size="11" font-weight="bold">NON</text>

  <rect x="380" y="410" width="180" height="44" rx="8" fill="#123322" stroke="#81fba1" stroke-width="2.5"/>
  <text x="470" y="428" fill="#81fba1" font-size="11.5" text-anchor="middle" font-weight="bold">vigilance ← "verte/jaune"</text>
  <text x="470" y="446" fill="#e4eaf5" font-size="10.5" text-anchor="middle">aucun actionneur</text>

  <!-- convergence -->
  <line x1="794" y1="220" x2="794" y2="238" stroke="#274a8a" stroke-width="2"/>
  <line x1="794" y1="304" x2="794" y2="322" stroke="#274a8a" stroke-width="2"/>
  <line x1="794" y1="388" x2="794" y2="480" stroke="#61dafb" stroke-width="2.5"/>
  <line x1="470" y1="454" x2="470" y2="480" stroke="#61dafb" stroke-width="2.5"/>
  <line x1="470" y1="480" x2="576" y2="480" stroke="#61dafb" stroke-width="2.5"/>
  <line x1="794" y1="480" x2="704" y2="480" stroke="#61dafb" stroke-width="2.5" marker-end="url(#gar)"/>
  <rect x="580" y="460" width="120" height="40" rx="8" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
  <text x="640" y="478" fill="#e4eaf5" font-size="10.5" text-anchor="middle">Envoyer message</text>
  <text x="640" y="493" fill="#9bbefc" font-size="10" text-anchor="middle">→ application · FIN</text>

  <text x="180" y="480" fill="#5b7bb8" font-size="10.5" text-anchor="middle" font-style="italic">⚠ L'ordre des tests compte :</text>
  <text x="180" y="497" fill="#5b7bb8" font-size="10.5" text-anchor="middle" font-style="italic">on teste du plus fort au plus faible.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#123322"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#2b1a3f"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#3a1218"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#3a2412"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#5b7bb8"]{fill:#ffffff}
  text[fill="#5b7bb8"],tspan[fill="#5b7bb8"]{fill:#5475b5}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  [stroke="#9bbefc"]{stroke:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  [stroke="#ff7b88"]{stroke:#eb0017}
  text[fill="#ffb454"],tspan[fill="#ffb454"],[fill="#ffb454"] text,[fill="#ffb454"] tspan{fill:#b06300}
  [stroke="#ffb454"]{stroke:#b06300}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
