       <rect x="266" y="118" width="250" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="391" y="142" fill="#81fba1">verte · sirène arrêtée</text>
       <rect x="524" y="118" width="250" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="649" y="142" fill="#81fba1">verte · sirène arrêtée</text>
