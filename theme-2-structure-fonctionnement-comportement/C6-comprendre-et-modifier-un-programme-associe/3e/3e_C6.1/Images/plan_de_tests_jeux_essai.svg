       <rect x="138" y="210" width="120" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="198" y="234" fill="#ffd66b" font-family="monospace" font-size="14">51</text>
       <rect x="266" y="210" width="250" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="391" y="234" fill="#ffb454">orange · sirène arrêtée</text>
       <rect x="524" y="210" width="250" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="649" y="234" fill="#ffb454">orange · sirène arrêtée</text>
       <rect x="782" y="210" width="118" height="38" rx="8" fill="#123322" stroke="#81fba1"/><text x="841" y="234" fill="#81fba1">✔ juste</text></g>
