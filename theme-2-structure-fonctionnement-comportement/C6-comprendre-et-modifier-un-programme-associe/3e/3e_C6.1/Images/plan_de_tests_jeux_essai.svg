       <rect x="138" y="302" width="120" height="38" rx="8" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/><text x="198" y="326" fill="#ffd66b" font-family="monospace" font-size="14">118</text>
       <rect x="266" y="302" width="250" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="391" y="326" fill="#ff7b88">rouge · sirène active</text>
       <rect x="524" y="302" width="250" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="649" y="326" fill="#c68ef2">violette · sirène active</text>
       <rect x="782" y="302" width="118" height="38" rx="8" fill="#3a1218" stroke="#ff7b88"/><text x="841" y="326" fill="#ff7b88" font-weight="bold">✘ faux</text></g>
    <g><rect x="40" y="348" width="90" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="85" y="372" fill="#e4eaf5">n°6</text>
       <rect x="138" y="348" width="120" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="198" y="372" fill="#ffd66b" font-family="monospace" font-size="14">119</text>
       <rect x="266" y="348" width="250" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="391" y="372" fill="#c68ef2">violette · sirène active</text>
       <rect x="524" y="348" width="250" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="649" y="372" fill="#c68ef2">violette · sirène active</text>
       <rect x="782" y="348" width="118" height="38" rx="8" fill="#123322" stroke="#81fba1"/><text x="841" y="372" fill="#81fba1">✔ juste</text></g>
  </g>
  <rect x="40" y="406" width="860" height="90" rx="12" fill="#173666" stroke="#274a8a"/>
  <text x="470" y="436" fill="#e4eaf5" font-size="13" text-anchor="middle">Chaque seuil est essayé juste en dessous, pile dessus et juste au-dessus : <tspan fill="#ffd66b" font-weight="bold">49 · 50 · 51 et 117 · 118 · 119.</tspan></text>
  <text x="470" y="462" fill="#e4eaf5" font-size="13" text-anchor="middle">Seul l'essai pile sur 118 sépare « vent_kmh &gt; 118 » de « vent_kmh &gt;= 118 » : <tspan fill="#ffd66b" font-weight="bold">la copie B a écrit &gt;=.</tspan></text>
  <text x="470" y="488" fill="#9bbefc" font-size="12.5" text-anchor="middle">À 119, les deux écritures donnent violette : cet essai seul ne verrait pas l'erreur.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
