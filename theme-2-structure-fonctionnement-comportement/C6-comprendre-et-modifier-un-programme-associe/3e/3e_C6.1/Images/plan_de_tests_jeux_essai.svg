<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le plan de tests : des jeux d'essai pour valider le programme modifié</title>
  <desc id="d">Tableau de plan de tests avec cinq jeux d'essai : pour chaque test, la valeur d'entrée vent en kilomètres par heure, la sortie attendue calculée à la main, la sortie obtenue en exécutant le programme, et le verdict. Les valeurs choisies encadrent les seuils : 45, 50, 51, 118, 119. Un encart explique qu'un bon jeu d'essai teste surtout les valeurs frontières, là où se cachent les erreurs.</desc>
  <rect width="940" height="400" fill="#050f24"/>
  <text x="470" y="34" fill="#81aaff" font-size="20" font-weight="bold" text-anchor="middle">Valider par un plan de tests : les jeux d'essai</text>

  <g font-size="12" text-anchor="middle">
    <rect x="60" y="60" width="120" height="36" rx="8" fill="#173666"/><text x="120" y="83" fill="#61dafb" font-weight="bold">Test</text>
    <rect x="188" y="60" width="160" height="36" rx="8" fill="#173666"/><text x="268" y="83" fill="#61dafb" font-weight="bold">Entrée vent_kmh</text>
    <rect x="356" y="60" width="200" height="36" rx="8" fill="#173666"/><text x="456" y="83" fill="#61dafb" font-weight="bold">Sortie ATTENDUE (à la main)</text>
    <rect x="564" y="60" width="180" height="36" rx="8" fill="#173666"/><text x="654" y="83" fill="#61dafb" font-weight="bold">Sortie OBTENUE</text>
    <rect x="752" y="60" width="128" height="36" rx="8" fill="#173666"/><text x="816" y="83" fill="#61dafb" font-weight="bold">Verdict</text>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace">
    <g><rect x="60" y="104" width="120" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="120" y="127" fill="#e4eaf5">n°1</text>
       <rect x="188" y="104" width="160" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="268" y="127" fill="#ffd66b">45</text>
       <rect x="356" y="104" width="200" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="456" y="127" fill="#81fba1">verte/jaune</text>
       <rect x="564" y="104" width="180" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="654" y="127" fill="#81fba1">verte/jaune</text>
       <rect x="752" y="104" width="128" height="36" rx="8" fill="#123322" stroke="#81fba1"/><text x="816" y="127" fill="#81fba1">✔</text></g>
    <g><rect x="60" y="148" width="120" height="36" rx="8" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/><text x="120" y="171" fill="#ffd66b">n°2 frontière</text>
       <rect x="188" y="148" width="160" height="36" rx="8" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/><text x="268" y="171" fill="#ffd66b">50</text>
       <rect x="356" y="148" width="200" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="456" y="171" fill="#81fba1">verte/jaune (50 n'est PAS &gt; 50)</text>
       <rect x="564" y="148" width="180" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="654" y="171" fill="#81fba1">verte/jaune</text>
       <rect x="752" y="148" width="128" height="36" rx="8" fill="#123322" stroke="#81fba1"/><text x="816" y="171" fill="#81fba1">✔</text></g>
    <g><rect x="60" y="192" width="120" height="36" rx="8" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/><text x="120" y="215" fill="#ffd66b">n°3 frontière</text>
       <rect x="188" y="192" width="160" height="36" rx="8" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/><text x="268" y="215" fill="#ffd66b">51</text>
       <rect x="356" y="192" width="200" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="456" y="215" fill="#ffb454">orange + gyrophare</text>
       <rect x="564" y="192" width="180" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="654" y="215" fill="#ffb454">orange + gyrophare</text>
       <rect x="752" y="192" width="128" height="36" rx="8" fill="#123322" stroke="#81fba1"/><text x="816" y="215" fill="#81fba1">✔</text></g>
    <g><rect x="60" y="236" width="120" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="120" y="259" fill="#e4eaf5">n°4</text>
       <rect x="188" y="236" width="160" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="268" y="259" fill="#ffd66b">118</text>
       <rect x="356" y="236" width="200" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="456" y="259" fill="#ff7b88">rouge (118 n'est PAS &gt; 118)</text>
       <rect x="564" y="236" width="180" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="654" y="259" fill="#c68ef2">violette ✘</text>
       <rect x="752" y="236" width="128" height="36" rx="8" fill="#3a1218" stroke="#ff7b88"/><text x="816" y="259" fill="#ff7b88">✘ BUG !</text></g>
    <g><rect x="60" y="280" width="120" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="120" y="303" fill="#e4eaf5">n°5</text>
       <rect x="188" y="280" width="160" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="268" y="303" fill="#ffd66b">119</text>
       <rect x="356" y="280" width="200" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="456" y="303" fill="#c68ef2">violette + sirène + gyro</text>
       <rect x="564" y="280" width="180" height="36" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="654" y="303" fill="#c68ef2">violette + sirène + gyro</text>
       <rect x="752" y="280" width="128" height="36" rx="8" fill="#123322" stroke="#81fba1"/><text x="816" y="303" fill="#81fba1">✔</text></g>
  </g>

  <rect x="60" y="334" width="820" height="52" rx="12" fill="#173666" stroke="#274a8a"/>
  <text x="470" y="356" fill="#e4eaf5" font-size="12" text-anchor="middle">Un bon jeu d'essai vise les <tspan fill="#ffd66b" font-weight="bold">valeurs frontières</tspan> (49/50/51, 117/118/119) : c'est LÀ que se cachent les erreurs — ici le test n°4 révèle un bug (a-t-on écrit ≥ au lieu de &gt; ?).</text>
  <text x="470" y="376" fill="#9bbefc" font-size="11" text-anchor="middle">La sortie ATTENDUE se calcule À LA MAIN avant d'exécuter : sinon on ne teste rien, on constate.</text>
</svg>
