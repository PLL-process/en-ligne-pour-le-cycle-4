       <rect x="138" y="164" width="120" height="38" rx="8" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/><text x="198" y="188" fill="#ffd66b" font-family="monospace" font-size="14">50</text>
       <rect x="266" y="164" width="250" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="391" y="188" fill="#81fba1">verte · sirène arrêtée</text>
       <rect x="524" y="164" width="250" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="649" y="188" fill="#81fba1">verte · sirène arrêtée</text>
       <rect x="782" y="164" width="118" height="38" rx="8" fill="#123322" stroke="#81fba1"/><text x="841" y="188" fill="#81fba1">✔ juste</text></g>
