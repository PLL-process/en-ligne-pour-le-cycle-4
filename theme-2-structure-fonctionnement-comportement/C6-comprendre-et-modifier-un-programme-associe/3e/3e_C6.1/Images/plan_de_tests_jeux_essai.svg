       <rect x="138" y="256" width="120" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="198" y="280" fill="#ffd66b" font-family="monospace" font-size="14">117</text>
       <rect x="266" y="256" width="250" height="38" rx="8" fill="#0d2347" stroke="#274a8a"/><text x="391" y="280" fill="#ff7b88">rouge · sirène active</text>
