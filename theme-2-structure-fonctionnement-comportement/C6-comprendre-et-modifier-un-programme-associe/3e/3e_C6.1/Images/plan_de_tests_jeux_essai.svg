<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Plan de tests de la version 1 d'origine, essayé sur la copie B</title>
  <desc id="d">Tableau d'un plan de tests. Le cahier des charges est celui de la version 1 d'origine : seuils 50, 90 et 118 kilomètres par heure, pas de gyrophare. Le programme essayé est une copie, appelée copie B. Six essais : 49, 50, 51, 117, 118 et 119. Pour chacun : la sortie attendue, écrite avant d'exécuter, la sortie obtenue avec la copie B, et le verdict. À 118, on attend rouge avec la sirène active ; la copie B donne violette avec la sirène active : verdict faux. Tous les autres essais sont justes. En bas, l'explication : les essais encadrent les seuils, et seul l'essai à 118 sépare un test écrit avec plus grand que d'un test écrit avec plus grand ou égal ; la copie B a écrit plus grand ou égal à 118.</desc>
  <rect width="940" height="512" fill="#050f24"/>
  <text x="470" y="32" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Plan de tests de la version 1 d'origine</text>
  <text x="470" y="56" fill="#9bbefc" font-size="13" text-anchor="middle">Cahier des charges : seuils 50 · 90 · 118 km/h, pas de gyrophare. Programme essayé : la copie B.</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="72" width="90" height="38" rx="8" fill="#173666"/><text x="85" y="96" fill="#61dafb" font-weight="bold">Test</text>
    <rect x="138" y="72" width="120" height="38" rx="8" fill="#173666"/><text x="198" y="96" fill="#61dafb" font-weight="bold">Vent (km/h)</text>
    <rect x="266" y="72" width="250" height="38" rx="8" fill="#173666"/><text x="391" y="96" fill="#61dafb" font-weight="bold">ATTENDU (écrit avant)</text>
    <rect x="524" y="72" width="250" height="38" rx="8" fill="#173666"/><text x="649" y="96" fill="#61dafb" font-weight="bold">OBTENU (copie B)</text>
    <rect x="782" y="72" width="118" height="38" rx="8" fill="#173666"/><text x="841" y="96" fill="#61dafb" font-weight="bold">Verdict</text>
  </g>
  <g font-size="13" text-anchor="middle">
