<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le programme de la station : données utilisées en entrée, données produites en sortie</title>
  <desc id="d">Schéma : au centre, le programme d'alerte de la station. À gauche, les données UTILISÉES en entrée : vent_kmh et pression_hpa venant des capteurs, et le seuil SEUIL_OURAGAN venant de la mémoire. À droite, les données PRODUITES en sortie : le niveau de vigilance calculé, l'état de la sirène vrai ou faux, et le message envoyé à l'application. Une donnée peut être lue, transformée, puis produite : c'est le traitement.</desc>
  <defs>
    <marker id="par" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/>
    </marker>
  </defs>
  <rect width="940" height="440" fill="#050f24"/>
  <text x="470" y="34" fill="#81aaff" font-size="20" font-weight="bold" text-anchor="middle">Un programme : des données UTILISÉES → des données PRODUITES</text>

  <!-- entrées -->
  <text x="150" y="80" fill="#61dafb" font-size="14" font-weight="bold" text-anchor="middle">DONNÉES UTILISÉES (entrées)</text>
  <g font-family="monospace" font-size="12.5" text-anchor="middle">
    <rect x="40" y="100" width="220" height="52" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
    <text x="150" y="122" fill="#ffd66b">vent_kmh = 132</text>
    <text x="150" y="141" fill="#9bbefc" font-family="Verdana" font-size="10">← capteur anémomètre</text>
    <rect x="40" y="166" width="220" height="52" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
    <text x="150" y="188" fill="#ffd66b">pression_hpa = 966.8</text>
    <text x="150" y="207" fill="#9bbefc" font-family="Verdana" font-size="10">← capteur baromètre</text>
    <rect x="40" y="232" width="220" height="52" rx="10" fill="#0d2347" stroke="#c68ef2" stroke-width="2.5"/>
    <text x="150" y="254" fill="#ffd66b">SEUIL_OURAGAN = 118</text>
    <text x="150" y="273" fill="#9bbefc" font-family="Verdana" font-size="10">← constante en mémoire</text>
  </g>

  <!-- programme -->
  <rect x="340" y="110" width="260" height="200" rx="16" fill="#173666" stroke="#ffd66b" stroke-width="3"/>
  <text x="470" y="146" fill="#ffd66b" font-size="15" font-weight="bold" text-anchor="middle">PROGRAMME</text>
  <text x="470" y="170" fill="#e4eaf5" font-size="11.5" text-anchor="middle">lit les entrées,</text>
  <text x="470" y="188" fill="#e4eaf5" font-size="11.5" text-anchor="middle">compare aux seuils,</text>
  <text x="470" y="206" fill="#e4eaf5" font-size="11.5" text-anchor="middle">décide, produit les sorties</text>
  <rect x="368" y="228" width="204" height="56" rx="9" fill="#08132c"/>
  <text x="470" y="250" fill="#61dafb" font-size="10.5" font-family="monospace" text-anchor="middle">si vent_kmh &gt; SEUIL_OURAGAN :</text>
  <text x="470" y="268" fill="#61dafb" font-size="10.5" font-family="monospace" text-anchor="middle">    vigilance = "violette"</text>

  <!-- sorties -->
  <text x="790" y="80" fill="#81fba1" font-size="14" font-weight="bold" text-anchor="middle">DONNÉES PRODUITES (sorties)</text>
  <g font-family="monospace" font-size="12.5" text-anchor="middle">
    <rect x="680" y="100" width="220" height="52" rx="10" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
    <text x="790" y="122" fill="#81fba1">vigilance = "violette"</text>
    <text x="790" y="141" fill="#9bbefc" font-family="Verdana" font-size="10">→ niveau calculé</text>
    <rect x="680" y="166" width="220" height="52" rx="10" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
    <text x="790" y="188" fill="#81fba1">sirene_active = vrai</text>
    <text x="790" y="207" fill="#9bbefc" font-family="Verdana" font-size="10">→ commande l'actionneur</text>
    <rect x="680" y="232" width="220" height="52" rx="10" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
    <text x="790" y="254" fill="#81fba1">message = "ALERTE…"</text>
    <text x="790" y="273" fill="#9bbefc" font-family="Verdana" font-size="10">→ envoyé à l'application</text>
  </g>

  <line x1="262" y1="126" x2="334" y2="160" stroke="#61dafb" stroke-width="3" marker-end="url(#par)"/>
  <line x1="262" y1="192" x2="334" y2="200" stroke="#61dafb" stroke-width="3" marker-end="url(#par)"/>
  <line x1="262" y1="258" x2="334" y2="240" stroke="#61dafb" stroke-width="3" marker-end="url(#par)"/>
  <line x1="602" y1="160" x2="674" y2="126" stroke="#81fba1" stroke-width="3" marker-end="url(#par)"/>
  <line x1="602" y1="200" x2="674" y2="192" stroke="#81fba1" stroke-width="3" marker-end="url(#par)"/>
  <line x1="602" y1="240" x2="674" y2="258" stroke="#81fba1" stroke-width="3" marker-end="url(#par)"/>

  <rect x="60" y="340" width="820" height="76" rx="12" fill="#173666" stroke="#274a8a"/>
  <text x="470" y="366" fill="#e4eaf5" font-size="12.5" text-anchor="middle"><tspan fill="#61dafb" font-weight="bold">Donnée utilisée</tspan> = lue par le programme (capteur, constante, saisie) · <tspan fill="#81fba1" font-weight="bold">donnée produite</tspan> = créée ou modifiée par le programme (résultat, commande, message).</text>
  <text x="470" y="392" fill="#9bbefc" font-size="11.5" text-anchor="middle">Avant de MODIFIER un programme, on identifie toujours ses entrées et ses sorties : c'est la carte d'identité de la fonctionnalité.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#08132c"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
