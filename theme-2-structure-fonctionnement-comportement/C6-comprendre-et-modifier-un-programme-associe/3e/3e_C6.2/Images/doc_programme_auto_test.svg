<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 456" width="350" height="456" role="img" aria-labelledby="t_programme_auto_test d_programme_auto_test" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_programme_auto_test">Le programme de l'auto-test</title>
<desc id="d_programme_auto_test">Le programme de l'auto-test, dans l'ordre : organes = [anemometre, gyrophare, sirene, radio] / defauts = 0 / pannes = liste vide / POUR CHAQUE organe DANS organes : / (décalée 1 fois) SI tester(organe) est FAUX ALORS / (décalée 2 fois) defauts = defauts + 1 / (décalée 2 fois) ajouter organe à pannes / SI defauts &gt; 0 ALORS / (décalée 1 fois) envoyer("Station : …") / SINON / (décalée 1 fois) envoyer("Station operationnelle"). Le document ne dit pas ce que produit le programme dans un cas donné.</desc>
<rect width="350" height="456" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le programme de l'auto-test</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Chaque matin, la station vérifie ses</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">quatre organes, puis prévient le gardien.</text>
<rect x="14.0" y="87.4" width="322.0" height="300.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Le programme, dans l'ordre</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">organes = [anemometre, gyrophare,</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">           sirene, radio]</text>
<text x="26.0" y="186.4" font-size="15" fill="#e4eaf5">defauts = 0</text>
<text x="26.0" y="207.4" font-size="15" fill="#e4eaf5">pannes = liste vide</text>
<text x="26.0" y="228.4" font-size="15" fill="#e4eaf5">POUR CHAQUE organe DANS organes :</text>
<text x="26.0" y="249.4" font-size="15" fill="#e4eaf5">    SI tester(organe) est FAUX ALORS</text>
<text x="26.0" y="270.4" font-size="15" fill="#e4eaf5">        defauts = defauts + 1</text>
<text x="26.0" y="291.4" font-size="15" fill="#e4eaf5">        ajouter organe à pannes</text>
<text x="26.0" y="312.4" font-size="15" fill="#e4eaf5">SI defauts &gt; 0 ALORS</text>
<text x="26.0" y="333.4" font-size="15" fill="#e4eaf5">    envoyer("Station : …")</text>
<text x="26.0" y="354.4" font-size="15" fill="#e4eaf5">SINON</text>
<text x="26.0" y="375.4" font-size="15" fill="#e4eaf5">    envoyer("Station operationnelle")</text>
<text x="14.0" y="417.6" font-size="13.5" fill="#9bbefc">tester(organe) répond VRAI si l'organe marche ·</text>
<text x="14.0" y="435.8" font-size="13.5" fill="#9bbefc">Une ligne décalée appartient à celle du dessus.</text>
</svg>
