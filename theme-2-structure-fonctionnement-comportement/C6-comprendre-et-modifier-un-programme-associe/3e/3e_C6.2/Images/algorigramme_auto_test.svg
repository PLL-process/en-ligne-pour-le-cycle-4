<svg xmlns="http://www.w3.org/2000/svg" class="algo-svg haut" viewBox="0 0 440 974" role="img" aria-labelledby="auto-t auto-d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title id="auto-t">Algorigramme de l&#x27;auto-test du matin de la station</title><desc id="auto-d">DÉBUT à 7 h 00. Rectangle : defauts ← 0, avant la boucle. La boucle commence. Rectangle : organe suivant de la liste. Losange : l&#x27;organe répond-il correctement ? Branche « non », vers le bas : rectangle defauts ← defauts + 1. Branche « oui », à droite : elle contourne ce rectangle sans rien compter. Les deux chemins se rejoignent en un point. Losange : reste-t-il un organe ? Branche « oui », à gauche : elle remonte et rejoint le point placé en haut de la boucle. Branche « non », vers le bas : on sort de la boucle, cadre en pointillés qui entoure toute la partie répétée, une fois pour chacun des 4 organes. Après la boucle, losange : defauts = 0 ? Branche « oui », à droite : parallélogramme « envoyer au gardien : station opérationnelle ». Branche « non », à gauche : parallélogramme « envoyer au gardien : défaut sur N organe(s) ». Les deux chemins se rejoignent, puis FIN. Deux repères sont écrits sur le schéma : « une seule fois, avant la boucle » à côté de defauts ← 0, et « une décision, après la boucle » à côté du dernier losange.</desc><defs><marker id="auto-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8fb8ff"/></marker></defs><rect width="440" height="974" rx="14" fill="#061330"/><rect x="12" y="150" width="416" height="502" rx="14" fill="none" stroke="#4a6fae" stroke-width="1.5" stroke-dasharray="7 6"/><path d="M220 56 L220 84" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><path d="M220 128 L220 178" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="220" cy="178" r="4.5" fill="#8fb8ff"/><path d="M220 178 L220 204" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><path d="M220 256 L220 284" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><path d="M220 396 L220 428" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><path d="M220 472 L220 502" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round"/><path d="M338 340 L414 340 L414 502 L226 502" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><circle cx="220" cy="502" r="4.5" fill="#8fb8ff"/><path d="M220 502 L220 530" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><path d="M116 582 L24 582 L24 178 L214 178" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><path d="M220 634 L220 682" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><path d="M328 728 L328 792" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><path d="M112 728 L112 792" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><path d="M112 864 L112 890 L214 890" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><path d="M328 864 L328 890 L226 890" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><circle cx="220" cy="890" r="4.5" fill="#8fb8ff"/><path d="M220 890 L220 916" fill="none" stroke="#8fb8ff" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#auto-p)"/><rect x="125" y="16" width="190" height="40" rx="20" fill="#173666" stroke="#7fb0ff" stroke-width="2"/><rect x="125" y="84" width="190" height="44" rx="6" fill="#122a52" stroke="#5b86d1" stroke-width="2"/><rect x="110" y="204" width="220" height="52" rx="6" fill="#122a52" stroke="#5b86d1" stroke-width="2"/><polygon points="220,284 338,340 220,396 102,340" fill="#2b1a3f" stroke="#b48ae6" stroke-width="2"/><rect x="105" y="428" width="230" height="44" rx="6" fill="#122a52" stroke="#5b86d1" stroke-width="2"/><polygon points="220,530 324,582 220,634 116,582" fill="#2b1a3f" stroke="#b48ae6" stroke-width="2"/><polygon points="220,682 328,728 220,774 112,728" fill="#2b1a3f" stroke="#b48ae6" stroke-width="2"/><polygon points="244,792 426,792 412,864 230,864" fill="#0d3320" stroke="#5cc28a" stroke-width="2"/><polygon points="28,792 210,792 196,864 14,864" fill="#0d3320" stroke="#5cc28a" stroke-width="2"/><rect x="155" y="916" width="130" height="40" rx="20" fill="#173666" stroke="#7fb0ff" stroke-width="2"/><text x="220" font-size="16" text-anchor="middle" fill="#e8eefc" y="41.6">DÉBUT — 7 h 00</text><text x="220" font-size="16" text-anchor="middle" fill="#e8eefc" y="111.6">defauts ← 0</text><text x="324" font-size="14" text-anchor="start" fill="#ffd66b" stroke="#061330" stroke-width="5" stroke-linejoin="round" paint-order="stroke" y="100.9">une seule fois,</text><text x="324" font-size="14" text-anchor="start" fill="#ffd66b" stroke="#061330" stroke-width="5" stroke-linejoin="round" paint-order="stroke" y="120.9">avant la boucle</text><text x="220" font-size="16" text-anchor="middle" fill="#e8eefc" y="225.6">organe suivant</text><text x="220" font-size="16" text-anchor="middle" fill="#e8eefc" y="245.6">de la liste</text><text x="220" font-size="16" text-anchor="middle" fill="#e8eefc" y="335.6">l&#x27;organe répond-il</text><text x="220" font-size="16" text-anchor="middle" fill="#e8eefc" y="355.6">correctement ?</text><text x="233" font-size="15" text-anchor="start" fill="#ffb3bc" font-weight="700" stroke="#061330" stroke-width="5" stroke-linejoin="round" paint-order="stroke" y="417.25">non</text><text x="220" font-size="16" text-anchor="middle" fill="#e8eefc" y="455.6">defauts ← defauts + 1</text><text x="376" font-size="15" text-anchor="middle" fill="#8ff0ac" font-weight="700" stroke="#061330" stroke-width="5" stroke-linejoin="round" paint-order="stroke" y="330.25">oui</text><text x="220" font-size="16" text-anchor="middle" fill="#e8eefc" y="577.6">reste-t-il</text><text x="220" font-size="16" text-anchor="middle" fill="#e8eefc" y="597.6">un organe ?</text><text x="70" font-size="15" text-anchor="middle" fill="#8ff0ac" font-weight="700" stroke="#061330" stroke-width="5" stroke-linejoin="round" paint-order="stroke" y="572.25">oui</text><text x="20" font-size="14" text-anchor="start" fill="#a9c1ec" stroke="#061330" stroke-width="5" stroke-linejoin="round" paint-order="stroke" y="145.9">↻ la boucle</text><text x="233" font-size="15" text-anchor="start" fill="#ffb3bc" font-weight="700" stroke="#061330" stroke-width="5" stroke-linejoin="round" paint-order="stroke" y="655.25">non</text><text x="220" font-size="16" text-anchor="middle" fill="#e8eefc" y="733.6">defauts = 0 ?</text><text x="16" font-size="14" text-anchor="start" fill="#ffd66b" stroke="#061330" stroke-width="5" stroke-linejoin="round" paint-order="stroke" y="682.9">une décision,</text><text x="16" font-size="14" text-anchor="start" fill="#ffd66b" stroke="#061330" stroke-width="5" stroke-linejoin="round" paint-order="stroke" y="702.9">après la boucle</text><text x="328" font-size="16" text-anchor="middle" fill="#e8eefc" y="813.6">envoyer au gardien</text><text x="328" font-size="16" text-anchor="middle" fill="#e8eefc" y="833.6">« station</text><text x="328" font-size="16" text-anchor="middle" fill="#e8eefc" y="853.6">opérationnelle »</text><text x="112" font-size="16" text-anchor="middle" fill="#e8eefc" y="813.6">envoyer au gardien</text><text x="112" font-size="16" text-anchor="middle" fill="#e8eefc" y="833.6">« défaut sur</text><text x="112" font-size="16" text-anchor="middle" fill="#e8eefc" y="853.6">N organe(s) »</text><text x="341" font-size="15" text-anchor="start" fill="#8ff0ac" font-weight="700" stroke="#061330" stroke-width="5" stroke-linejoin="round" paint-order="stroke" y="763.25">oui</text><text x="99" font-size="15" text-anchor="end" fill="#ffb3bc" font-weight="700" stroke="#061330" stroke-width="5" stroke-linejoin="round" paint-order="stroke" y="763.25">non</text><text x="220" font-size="16" text-anchor="middle" fill="#e8eefc" y="941.6">FIN</text></svg>
