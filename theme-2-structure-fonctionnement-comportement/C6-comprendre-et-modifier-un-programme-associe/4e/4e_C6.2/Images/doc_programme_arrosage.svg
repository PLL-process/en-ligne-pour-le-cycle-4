<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 390" width="350" height="390" role="img" aria-labelledby="t_programme_arrosage d_programme_arrosage" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_programme_arrosage">Le programme de l'arrosage</title>
<desc id="d_programme_arrosage">Le programme Python de l'arrosage, ligne par ligne : seuil = 30 / while True: / humidite = lire_capteur_pourcent(A0) / if humidite &lt; seuil: / demarrer_pompe() / else: / arreter_pompe() / attendre(1). Le document ne dit pas ce que fait la pompe pour une mesure donnée.</desc>
<rect width="350" height="390" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le programme de l'arrosage</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le programme Python du jardin, complété.</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">L'humidité du sol est lue en % (pour cent).</text>
<rect x="14.0" y="87.4" width="322.0" height="216.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Le programme, dans l'ordre</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">seuil = 30</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">while True:</text>
<text x="26.0" y="186.4" font-size="15" fill="#e4eaf5">    humidite = lire_capteur_pourcent(A0)</text>
<text x="26.0" y="207.4" font-size="15" fill="#e4eaf5">    if humidite &lt; seuil:</text>
<text x="26.0" y="228.4" font-size="15" fill="#e4eaf5">        demarrer_pompe()</text>
<text x="26.0" y="249.4" font-size="15" fill="#e4eaf5">    else:</text>
<text x="26.0" y="270.4" font-size="15" fill="#e4eaf5">        arreter_pompe()</text>
<text x="26.0" y="291.4" font-size="15" fill="#e4eaf5">    attendre(1)</text>
<text x="14.0" y="333.6" font-size="13.5" fill="#9bbefc">Les lignes décalées appartiennent à la ligne qui</text>
<text x="14.0" y="351.8" font-size="13.5" fill="#9bbefc">les précède · attendre(1) : attendre</text>
<text x="14.0" y="370.0" font-size="13.5" fill="#9bbefc">une seconde.</text>
</svg>
