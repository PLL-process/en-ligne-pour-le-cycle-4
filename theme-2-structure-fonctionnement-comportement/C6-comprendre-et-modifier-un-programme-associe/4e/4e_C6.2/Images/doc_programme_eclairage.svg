<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 474" width="350" height="474" role="img" aria-labelledby="t_programme_eclairage d_programme_eclairage" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_programme_eclairage">Le programme de l'éclairage</title>
<desc id="d_programme_eclairage">Le programme de l'éclairage automatique, ligne par ligne : int seuil = 400; / void setup() { / pinMode(LED, OUTPUT); / } / void loop() { / int lumiere = analogRead(A0); / if (lumiere &lt; seuil) { / digitalWrite(LED, HIGH); / } else { / digitalWrite(LED, LOW); / } / }. Le document ne dit pas ce que fait chaque instruction.</desc>
<rect width="350" height="474" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le programme de l'éclairage</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le programme d'une carte de type</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">Arduino : une LDR, la cellule sensible</text>
<text x="14.0" y="89.6" font-size="13.5" fill="#9bbefc">à la lumière, sur A0, et une LED.</text>
<rect x="14.0" y="105.6" width="322.0" height="300.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="135.6" font-size="16" fill="#61dafb" font-weight="700">Le programme, dans l'ordre</text>
<text x="26.0" y="162.6" font-size="15" fill="#e4eaf5">int seuil = 400;</text>
<text x="26.0" y="183.6" font-size="15" fill="#e4eaf5">void setup() {</text>
<text x="26.0" y="204.6" font-size="15" fill="#e4eaf5">    pinMode(LED, OUTPUT);</text>
<text x="26.0" y="225.6" font-size="15" fill="#e4eaf5">}</text>
<text x="26.0" y="246.6" font-size="15" fill="#e4eaf5">void loop() {</text>
<text x="26.0" y="267.6" font-size="15" fill="#e4eaf5">    int lumiere = analogRead(A0);</text>
<text x="26.0" y="288.6" font-size="15" fill="#e4eaf5">    if (lumiere &lt; seuil) {</text>
<text x="26.0" y="309.6" font-size="15" fill="#e4eaf5">        digitalWrite(LED, HIGH);</text>
<text x="26.0" y="330.6" font-size="15" fill="#e4eaf5">    } else {</text>
<text x="26.0" y="351.6" font-size="15" fill="#e4eaf5">        digitalWrite(LED, LOW);</text>
<text x="26.0" y="372.6" font-size="15" fill="#e4eaf5">    }</text>
<text x="26.0" y="393.6" font-size="15" fill="#e4eaf5">}</text>
<text x="14.0" y="435.8" font-size="13.5" fill="#9bbefc">analogRead rend un nombre de 0 à 1023 · HIGH :</text>
<text x="14.0" y="454.0" font-size="13.5" fill="#9bbefc">allumée · LOW : éteinte.</text>
</svg>
