<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 292" width="350" height="292" role="img" aria-labelledby="t_banc_tests_arrosage d_banc_tests_arrosage" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_banc_tests_arrosage">Le banc de tests de l'arrosage</title>
<desc id="d_banc_tests_arrosage">Le banc de tests de l'arrosage : T1 — sol sec, humidité 10 %, seuil 30 %, attendu : POMPE EN MARCHE ; T2 — sol humide, humidité 80 %, seuil 30 %, attendu : pompe à l'arrêt ; T3 — FRONTIÈRE, humidité 30 %, seuil 30 %, attendu : pompe à l'arrêt. Le document ne dit pas ce que le programme a obtenu.</desc>
<rect width="350" height="292" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le banc de tests de l'arrosage</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Trois tests du programme, l'humidité et le seuil</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">en % (pour cent), et ce que le besoin attend.</text>
<rect x="14.0" y="87.4" width="322.0" height="136.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Test</text>
<text x="161.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Humidité</text>
<text x="218.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Seuil</text>
<text x="290.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Pompe</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">T1 sol sec</text>
<text x="161.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">10 %</text>
<text x="218.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">30 %</text>
<text x="290.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">en marche</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">T2 sol humide</text>
<text x="161.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">80 %</text>
<text x="218.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">30 %</text>
<text x="290.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">à l'arrêt</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">T3 frontière</text>
<text x="161.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">30 %</text>
<text x="218.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">30 %</text>
<text x="290.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">à l'arrêt</text>
<text x="14.0" y="253.6" font-size="13.5" fill="#9bbefc">La colonne « Pompe » dit ce que le besoin attend.</text>
<text x="14.0" y="271.8" font-size="13.5" fill="#9bbefc">Chaque test compare la pompe à cette attente.</text>
</svg>
