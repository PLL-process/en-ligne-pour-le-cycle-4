<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif">
  <defs>
    <marker id="arrowInfo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#61dafb"/>
    </marker>
    <marker id="arrowEnergie" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb454"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050f24"/>
      <stop offset="1" stop-color="#0a1a3a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="460" fill="url(#bgGrad)" rx="18"/>

  <!-- Titre -->
  <text x="500" y="38" text-anchor="middle" fill="#81aaff" font-size="22" font-weight="700">Jardin connecté — chaînes d'information et d'énergie</text>
  <text x="500" y="60" text-anchor="middle" fill="#9bbefc" font-size="13" font-style="italic">4e_C6.2 — Compléter un programme pour répondre à une fonctionnalité d'un OST</text>

  <!-- ===================== CHAINE D'INFORMATION ===================== -->
  <text x="40" y="100" fill="#61dafb" font-size="15" font-weight="700">🔵 Chaîne d'information</text>
  <text x="40" y="118" fill="#9bbefc" font-size="11">Acquérir → Traiter → Communiquer / Commander</text>

  <!-- boite 1 : capteur -->
  <rect x="40" y="135" width="150" height="70" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.5"/>
  <text x="115" y="160" text-anchor="middle" fill="#e4eaf5" font-size="12" font-weight="600">Capteur</text>
  <text x="115" y="176" text-anchor="middle" fill="#e4eaf5" font-size="12" font-weight="600">d'humidité</text>
  <text x="115" y="194" text-anchor="middle" fill="#61dafb" font-size="10">ACQUÉRIR</text>

  <line x1="190" y1="170" x2="238" y2="170" stroke="#61dafb" stroke-width="2.5" marker-end="url(#arrowInfo)"/>

  <!-- boite 2 : carte -->
  <rect x="240" y="135" width="150" height="70" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.5"/>
  <text x="315" y="160" text-anchor="middle" fill="#e4eaf5" font-size="12" font-weight="600">Carte</text>
  <text x="315" y="176" text-anchor="middle" fill="#e4eaf5" font-size="12" font-weight="600">Arduino</text>
  <text x="315" y="194" text-anchor="middle" fill="#61dafb" font-size="10">TRAITER</text>

  <line x1="390" y1="170" x2="438" y2="170" stroke="#61dafb" stroke-width="2.5" marker-end="url(#arrowInfo)"/>

  <!-- boite 3 : ecran -->
  <rect x="440" y="135" width="150" height="70" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.5"/>
  <text x="515" y="160" text-anchor="middle" fill="#e4eaf5" font-size="12" font-weight="600">Écran LCD</text>
  <text x="515" y="176" text-anchor="middle" fill="#e4eaf5" font-size="12" font-weight="600">(état du sol)</text>
  <text x="515" y="194" text-anchor="middle" fill="#61dafb" font-size="10">COMMUNIQUER</text>

  <!-- fleche vers le bas (commander -> relais) -->
  <line x1="315" y1="205" x2="315" y2="250" stroke="#61dafb" stroke-width="2.5" marker-end="url(#arrowInfo)"/>
  <text x="330" y="230" fill="#61dafb" font-size="10">COMMANDER</text>

  <!-- ===================== CHAINE D'ENERGIE ===================== -->
  <text x="40" y="290" fill="#ffb454" font-size="15" font-weight="700">🟠 Chaîne d'énergie</text>
  <text x="40" y="308" fill="#ffd9a0" font-size="11">Alimenter → Distribuer → Convertir → Transmettre → Agir</text>

  <!-- boite alim -->
  <rect x="40" y="325" width="130" height="70" rx="12" fill="#3a2408" stroke="#8a5a27" stroke-width="1.5"/>
  <text x="105" y="352" text-anchor="middle" fill="#ffe6c2" font-size="12" font-weight="600">Alimentation</text>
  <text x="105" y="368" text-anchor="middle" fill="#ffe6c2" font-size="12" font-weight="600">(pile 9V)</text>
  <text x="105" y="386" text-anchor="middle" fill="#ffb454" font-size="10">ALIMENTER</text>

  <line x1="170" y1="360" x2="212" y2="360" stroke="#ffb454" stroke-width="2.5" marker-end="url(#arrowEnergie)"/>

  <!-- relais -->
  <rect x="214" y="325" width="130" height="70" rx="12" fill="#3a2408" stroke="#8a5a27" stroke-width="1.5"/>
  <text x="279" y="352" text-anchor="middle" fill="#ffe6c2" font-size="12" font-weight="600">Relais</text>
  <text x="279" y="368" text-anchor="middle" fill="#ffe6c2" font-size="11" font-weight="600">(interrupteur)</text>
  <text x="279" y="386" text-anchor="middle" fill="#ffb454" font-size="10">DISTRIBUER</text>

  <!-- fleche montante reliant commande info -> relais -->
  <line x1="315" y1="250" x2="290" y2="325" stroke="#c68ef2" stroke-width="2" stroke-dasharray="4,4"/>

  <line x1="344" y1="360" x2="386" y2="360" stroke="#ffb454" stroke-width="2.5" marker-end="url(#arrowEnergie)"/>

  <!-- moteur pompe -->
  <rect x="388" y="325" width="130" height="70" rx="12" fill="#3a2408" stroke="#8a5a27" stroke-width="1.5"/>
  <text x="453" y="352" text-anchor="middle" fill="#ffe6c2" font-size="12" font-weight="600">Moteur de</text>
  <text x="453" y="368" text-anchor="middle" fill="#ffe6c2" font-size="12" font-weight="600">la pompe</text>
  <text x="453" y="386" text-anchor="middle" fill="#ffb454" font-size="10">CONVERTIR</text>

  <line x1="518" y1="360" x2="560" y2="360" stroke="#ffb454" stroke-width="2.5" marker-end="url(#arrowEnergie)"/>

  <!-- tuyau -->
  <rect x="562" y="325" width="130" height="70" rx="12" fill="#3a2408" stroke="#8a5a27" stroke-width="1.5"/>
  <text x="627" y="352" text-anchor="middle" fill="#ffe6c2" font-size="12" font-weight="600">Circulation</text>
  <text x="627" y="368" text-anchor="middle" fill="#ffe6c2" font-size="12" font-weight="600">de l'eau</text>
  <text x="627" y="386" text-anchor="middle" fill="#ffb454" font-size="10">TRANSMETTRE</text>

  <line x1="692" y1="360" x2="734" y2="360" stroke="#ffb454" stroke-width="2.5" marker-end="url(#arrowEnergie)"/>

  <!-- arrosage -->
  <rect x="736" y="325" width="130" height="70" rx="12" fill="#173d1f" stroke="#3f8a52" stroke-width="1.5"/>
  <text x="801" y="352" text-anchor="middle" fill="#c8f7d4" font-size="12" font-weight="600">🌱 Arrosage</text>
  <text x="801" y="368" text-anchor="middle" fill="#c8f7d4" font-size="12" font-weight="600">de la plante</text>
  <text x="801" y="386" text-anchor="middle" fill="#81fba1" font-size="10">AGIR</text>

  <!-- légende lien pointillé -->
  <text x="700" y="255" fill="#c68ef2" font-size="10" font-style="italic">le programme (4e_C6.2) relie les deux chaînes</text>

  <!-- pied de page -->
  <text x="500" y="440" text-anchor="middle" fill="#5b7bb8" font-size="10">TechnoQuest — Jardin connecté · schéma original</text>
</svg>
