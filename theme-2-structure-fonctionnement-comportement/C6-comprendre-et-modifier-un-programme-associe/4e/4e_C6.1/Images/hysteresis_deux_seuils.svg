<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="t d">
<title id="t">Un seuil unique fait battre la pompe ; deux seuils écartés — l'hystérésis — la stabilisent</title>
<desc id="d">Deux schémas côte à côte. À gauche, le programme d'avant : un seuil unique à 40 pour cent, la mesure qui vibre autour fait basculer la pompe sans arrêt, barre d'état hachée. À droite, le programme corrigé : deux seuils, démarrage sous 35 pour cent, arrêt au-dessus de 45 pour cent ; entre les deux la pompe garde son état, barre d'état en blocs francs. La règle est écrite : l'écart entre les seuils doit dépasser la vibration de la mesure.</desc>
<rect width="920" height="540" fill="#0d2347"/>
<text x="460" y="34" fill="#81aaff" font-family="sans-serif" font-size="23" font-weight="bold" text-anchor="middle">⚖ Un seuil… ou deux ? Le remède au battement</text>
<!-- panneau gauche : AVANT -->
<g font-family="sans-serif">
  <rect x="30" y="56" width="420" height="400" rx="10" fill="#173666" stroke="#ff7b88" stroke-width="2"/>
  <text x="240" y="84" fill="#ff7b88" font-size="17" font-weight="bold" text-anchor="middle">AVANT — seuil unique (40 %)</text>
  <line x1="60" y1="110" x2="60" y2="330" stroke="#274a8a" stroke-width="2"/>
  <line x1="60" y1="330" x2="420" y2="330" stroke="#274a8a" stroke-width="2"/>
  <line x1="60" y1="220" x2="420" y2="220" stroke="#ffd66b" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="414" y="214" fill="#ffd66b" font-size="13" text-anchor="end">40 %</text>
  <path d="M60 260 L120 232 L132 212 L144 228 L156 210 L168 230 L180 212 L192 228 L204 210 L216 230 L228 212 L240 228 L252 212 L264 229 L276 211 L360 245 L420 262" fill="none" stroke="#61dafb" stroke-width="3"/>
  <text x="200" y="150" fill="#e4eaf5" font-size="13" text-anchor="middle">la mesure VIBRE autour du seuil…</text>
  <text x="240" y="356" fill="#c68ef2" font-size="13" font-weight="bold">Pompe :</text>
  <rect x="60" y="366" width="360" height="24" rx="5" fill="#050f24" stroke="#274a8a"/>
  <g fill="#c68ef2"><rect x="126" y="368" width="5" height="20"/><rect x="138" y="368" width="5" height="20"/><rect x="150" y="368" width="5" height="20"/><rect x="162" y="368" width="5" height="20"/><rect x="174" y="368" width="5" height="20"/><rect x="186" y="368" width="5" height="20"/><rect x="198" y="368" width="5" height="20"/><rect x="210" y="368" width="5" height="20"/><rect x="222" y="368" width="5" height="20"/><rect x="234" y="368" width="5" height="20"/><rect x="246" y="368" width="5" height="20"/><rect x="258" y="368" width="5" height="20"/><rect x="270" y="368" width="5" height="20"/></g>
  <text x="240" y="418" fill="#ff7b88" font-size="14" font-weight="bold" text-anchor="middle">…et la commande bascule à CHAQUE vibration :</text>
  <text x="240" y="438" fill="#ff7b88" font-size="14" font-weight="bold" text-anchor="middle">la pompe BAT — usure, à-coups, bruit</text>
</g>
<!-- panneau droit : APRÈS -->
<g font-family="sans-serif">
  <rect x="470" y="56" width="420" height="400" rx="10" fill="#173666" stroke="#81fba1" stroke-width="2"/>
  <text x="680" y="84" fill="#81fba1" font-size="17" font-weight="bold" text-anchor="middle">APRÈS — deux seuils (35 % / 45 %)</text>
  <line x1="500" y1="110" x2="500" y2="330" stroke="#274a8a" stroke-width="2"/>
  <line x1="500" y1="330" x2="860" y2="330" stroke="#274a8a" stroke-width="2"/>
  <line x1="500" y1="196" x2="860" y2="196" stroke="#81fba1" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="854" y="190" fill="#81fba1" font-size="13" text-anchor="end">ARRÊT : 45 %</text>
  <line x1="500" y1="244" x2="860" y2="244" stroke="#61dafb" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="854" y="262" fill="#61dafb" font-size="13" text-anchor="end">DÉMARRAGE : 35 %</text>
  <rect x="500" y="196" width="360" height="48" fill="#61dafb" opacity="0.08"/>
  <text x="680" y="226" fill="#9bbefc" font-size="12.5" text-anchor="middle">zone calme : entre les deux, on NE CHANGE PAS d'avis</text>
  <path d="M500 262 L560 250 L572 236 L584 228 L596 234 L608 224 L620 230 L632 218 L680 200 L700 190 L760 210 L860 258" fill="none" stroke="#61dafb" stroke-width="3"/>
  <text x="500" y="356" fill="#c68ef2" font-size="13" font-weight="bold">Pompe :</text>
  <rect x="500" y="366" width="360" height="24" rx="5" fill="#050f24" stroke="#274a8a"/>
  <rect x="560" y="368" width="140" height="20" fill="#c68ef2"/>
  <text x="680" y="418" fill="#81fba1" font-size="14" font-weight="bold" text-anchor="middle">UN démarrage franc, UN arrêt franc :</text>
  <text x="680" y="438" fill="#81fba1" font-size="14" font-weight="bold" text-anchor="middle">l'HYSTÉRÉSIS a supprimé le battement</text>
</g>
<rect x="30" y="474" width="860" height="52" rx="10" fill="#050f24" stroke="#61dafb" stroke-width="2"/>
<text x="460" y="496" fill="#61dafb" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">📐 La règle : l'ÉCART entre les deux seuils (ici 10 points) doit dépasser la vibration naturelle de la mesure (±1 à 2 %).</text>
<text x="460" y="516" fill="#9bbefc" font-family="sans-serif" font-size="13.5" text-anchor="middle">Thermostats, réfrigérateurs, lampadaires : tous les systèmes à mesure et commande utilisent ce remède.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  [stroke="#ff7b88"]{stroke:#eb0017}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
