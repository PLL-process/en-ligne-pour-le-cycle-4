<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 458" width="350" height="458" role="img" aria-labelledby="t_programme_corrige_jardin d_programme_corrige_jardin" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_programme_corrige_jardin">Le programme corrigé du jardin</title>
<desc id="d_programme_corrige_jardin">Le programme corrigé du jardin, relu à chaque mesure. Ligne 1 : SI humidité &lt; 35 % ET (heure &lt; 8 h OU heure &gt; 17 h) ALORS pompe ON. Ligne 2 : SI humidité &gt; 45 % ALORS pompe OFF. SINON : la pompe garde l'état qu'elle avait. Le document ne dit pas ce que fait la pompe dans un cas donné.</desc>
<rect width="350" height="458" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le programme corrigé du jardin</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Les règles de la pompe, relues à chaque</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">mesure de l'humidité du sol (en %, pour cent).</text>
<rect x="14.0" y="87.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Ligne 1 · démarrer</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">SI humidité &lt; 35 %</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">ET (heure &lt; 8 h OU heure &gt; 17 h)</text>
<text x="26.0" y="186.4" font-size="15" fill="#e4eaf5">ALORS pompe ON</text>
<rect x="14.0" y="214.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="244.4" font-size="16" fill="#61dafb" font-weight="700">Ligne 2 · arrêter</text>
<text x="26.0" y="271.4" font-size="15" fill="#e4eaf5">SI humidité &gt; 45 %</text>
<text x="26.0" y="292.4" font-size="15" fill="#e4eaf5">ALORS pompe OFF</text>
<rect x="14.0" y="320.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="350.4" font-size="16" fill="#61dafb" font-weight="700">Sinon</text>
<text x="26.0" y="377.4" font-size="15" fill="#e4eaf5">la pompe garde l'état qu'elle avait</text>
<text x="14.0" y="419.6" font-size="13.5" fill="#9bbefc">ON : allumée · OFF : éteinte · h : l'heure</text>
<text x="14.0" y="437.8" font-size="13.5" fill="#9bbefc">de la journée.</text>
</svg>
