<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="t d">
<title id="t">Les relevés de la semaine : la pompe bat autour du seuil unique et un arrosage part à 13 heures</title>
<desc id="d">Courbe de l'humidité du sol sur une journée avec le seuil unique de 40 pour cent en pointillé. Entre 6 heures et 9 heures, la courbe vibre autour du seuil et la barre d'état de la pompe montre 47 démarrages en à-coups. À 13 heures, un arrosage part en plein soleil, signalé comme anomalie. À 22 heures, un arrosage normal se déroule à heure fraîche.</desc>
<rect width="920" height="540" fill="#0d2347"/>
<text x="460" y="34" fill="#81aaff" font-family="sans-serif" font-size="23" font-weight="bold" text-anchor="middle">📈 La clé USB de la présidente — relevés du mardi</text>
<!-- axes -->
<g font-family="sans-serif" font-size="13" fill="#9bbefc">
  <line x1="70" y1="70" x2="70" y2="360" stroke="#274a8a" stroke-width="2"/>
  <line x1="70" y1="360" x2="880" y2="360" stroke="#274a8a" stroke-width="2"/>
  <text x="30" y="80">100 %</text><text x="38" y="222">50 %</text><text x="42" y="364">0 %</text>
  <text x="20" y="55" fill="#61dafb">humidité du sol</text>
  <text x="110" y="382">0 h</text><text x="270" y="382">6 h</text><text x="352" y="382">9 h</text><text x="470" y="382">13 h</text><text x="600" y="382">17 h</text><text x="742" y="382">22 h</text><text x="850" y="382">24 h</text>
</g>
<!-- seuil unique -->
<line x1="70" y1="244" x2="880" y2="244" stroke="#ffd66b" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="876" y="238" fill="#ffd66b" font-family="sans-serif" font-size="14" text-anchor="end" font-weight="bold">seuil UNIQUE : 40 %</text>
<!-- courbe : nuit stable, 6h-9h vibration autour de 40, puis descente, remontée 13h (arrosage), descente, arrosage 22h -->
<path d="M70 200 L270 236 L276 240 L282 248 L288 241 L294 249 L300 240 L306 248 L312 241 L318 249 L324 240 L330 248 L336 242 L342 249 L348 241 L354 247
         L470 300 L486 250 L500 262 L600 306 L742 330 L756 232 L790 250 L880 262"
      fill="none" stroke="#61dafb" stroke-width="3.5" stroke-linejoin="round"/>
<!-- zone battement -->
<ellipse cx="312" cy="244" rx="58" ry="26" fill="none" stroke="#ff7b88" stroke-width="3"/>
<text x="312" y="196" fill="#ff7b88" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">⚠ ANOMALIE n°1</text>
<text x="312" y="214" fill="#ff7b88" font-family="sans-serif" font-size="13" text-anchor="middle">la mesure VIBRE autour de 40 %</text>
<!-- arrosage 13h -->
<circle cx="486" cy="250" r="14" fill="none" stroke="#ff7b88" stroke-width="3"/>
<text x="486" y="212" fill="#ff7b88" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">⚠ ANOMALIE n°2</text>
<text x="486" y="230" fill="#ff7b88" font-family="sans-serif" font-size="13" text-anchor="middle">arrosage à 13 h, plein soleil</text>
<circle cx="486" cy="120" r="17" fill="#ffd66b"/>
<g stroke="#ffd66b" stroke-width="3"><line x1="486" y1="92" x2="486" y2="80"/><line x1="486" y1="160" x2="486" y2="148"/><line x1="458" y1="120" x2="446" y2="120"/><line x1="526" y1="120" x2="514" y2="120"/></g>
<!-- arrosage 22h normal -->
<circle cx="756" cy="232" r="14" fill="none" stroke="#81fba1" stroke-width="3"/>
<text x="756" y="200" fill="#81fba1" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✔ NORMAL : 22 h,</text>
<text x="756" y="216" fill="#81fba1" font-family="sans-serif" font-size="13" text-anchor="middle">heure fraîche</text>
<!-- barre d'état pompe -->
<g font-family="sans-serif">
  <text x="70" y="420" fill="#c68ef2" font-size="14" font-weight="bold">État de la pompe :</text>
  <rect x="70" y="430" width="810" height="26" rx="5" fill="#050f24" stroke="#274a8a"/>
  <g fill="#c68ef2">
    <rect x="272" y="432" width="4" height="22"/><rect x="280" y="432" width="4" height="22"/><rect x="288" y="432" width="4" height="22"/><rect x="296" y="432" width="4" height="22"/><rect x="304" y="432" width="4" height="22"/><rect x="312" y="432" width="4" height="22"/><rect x="320" y="432" width="4" height="22"/><rect x="328" y="432" width="4" height="22"/><rect x="336" y="432" width="4" height="22"/><rect x="344" y="432" width="4" height="22"/><rect x="352" y="432" width="4" height="22"/>
    <rect x="478" y="432" width="16" height="22"/>
    <rect x="748" y="432" width="20" height="22"/>
  </g>
  <text x="312" y="480" fill="#ff7b88" font-size="14" font-weight="bold" text-anchor="middle">47 démarrages en 3 h — la pompe « BAT »</text>
  <text x="486" y="480" fill="#ff7b88" font-size="13" text-anchor="middle">arrosage perdu</text>
  <text x="758" y="480" fill="#81fba1" font-size="13" text-anchor="middle">arrosage utile</text>
</g>
<text x="460" y="520" fill="#9bbefc" font-family="sans-serif" font-size="14.5" text-anchor="middle">❓ Deux anomalies, un fonctionnement normal : à toi de relier chaque écart à la RÈGLE du programme qui l'autorise.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  [stroke="#ff7b88"]{stroke:#eb0017}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
