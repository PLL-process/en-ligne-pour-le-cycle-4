<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="t d">
<title id="t">La méthode de validation en cinq étapes et les quatre scénarios du banc de test</title>
<desc id="d">En haut, la méthode en cinq étapes reliées par des flèches : sauvegarder le programme d'origine, modifier, tester en simulation, valider en réel sur le plant témoin, vérifier la non-régression. En bas, le tableau des quatre scénarios de test : 33 pour cent à 6 heures teste le démarrage, 38 pour cent pompe allumée teste l'hystérésis, 46 pour cent teste l'arrêt, 33 pour cent à 13 heures teste la plage horaire. Un bandeau rappelle qu'on ne modifie jamais le vrai jardin sans sauvegarde.</desc>
<rect width="920" height="560" fill="#0d2347"/>
<text x="460" y="34" fill="#81aaff" font-family="sans-serif" font-size="23" font-weight="bold" text-anchor="middle">🧪 Modifier sans casser : la méthode du club</text>
<g font-family="sans-serif" text-anchor="middle">
  <rect x="30" y="60" width="150" height="102" rx="10" fill="#173666" stroke="#ffd66b" stroke-width="2.5"/>
  <text x="105" y="90" fill="#ffd66b" font-size="26">💾</text>
  <text x="105" y="116" fill="#ffd66b" font-size="14" font-weight="bold">1. SAUVEGARDER</text>
  <text x="105" y="136" fill="#e4eaf5" font-size="11.5">le programme d'origine</text>
  <text x="105" y="152" fill="#e4eaf5" font-size="11.5">(pouvoir revenir en arrière)</text>
  <path d="M182 111 h24" stroke="#61dafb" stroke-width="3" marker-end="url(#fl)"/>
  <rect x="212" y="60" width="150" height="102" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="287" y="90" fill="#c68ef2" font-size="26">✏</text>
  <text x="287" y="116" fill="#c68ef2" font-size="14" font-weight="bold">2. MODIFIER</text>
  <text x="287" y="136" fill="#e4eaf5" font-size="11.5">hystérésis 35/45</text>
  <text x="287" y="152" fill="#e4eaf5" font-size="11.5">+ plage horaire</text>
  <path d="M364 111 h24" stroke="#61dafb" stroke-width="3" marker-end="url(#fl)"/>
  <rect x="394" y="60" width="150" height="102" rx="10" fill="#050f24" stroke="#61dafb" stroke-width="3"/>
  <text x="469" y="90" fill="#61dafb" font-size="26">🖥</text>
  <text x="469" y="116" fill="#61dafb" font-size="14" font-weight="bold">3. SIMULER</text>
  <text x="469" y="136" fill="#e4eaf5" font-size="11.5">les 4 scénarios au banc</text>
  <text x="469" y="152" fill="#e4eaf5" font-size="11.5">(le vrai jardin dort)</text>
  <path d="M546 111 h24" stroke="#61dafb" stroke-width="3" marker-end="url(#fl)"/>
  <rect x="576" y="60" width="150" height="102" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="651" y="90" fill="#81fba1" font-size="26">🌱</text>
  <text x="651" y="116" fill="#81fba1" font-size="14" font-weight="bold">4. VALIDER EN RÉEL</text>
  <text x="651" y="136" fill="#e4eaf5" font-size="11.5">sur le plant témoin</text>
  <text x="651" y="152" fill="#e4eaf5" font-size="11.5">d'abord, pas tout le jardin</text>
  <path d="M728 111 h24" stroke="#61dafb" stroke-width="3" marker-end="url(#fl)"/>
  <rect x="758" y="60" width="132" height="102" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="824" y="90" fill="#ffd66b" font-size="26">🔁</text>
  <text x="824" y="116" fill="#ffd66b" font-size="13" font-weight="bold">5. NON-RÉGRESSION</text>
  <text x="824" y="136" fill="#e4eaf5" font-size="11.5">ce qui marchait…</text>
  <text x="824" y="152" fill="#e4eaf5" font-size="11.5">marche encore</text>
</g>
<defs><marker id="fl" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#61dafb"/></marker></defs>
<!-- tableau scénarios -->
<g font-family="sans-serif" font-size="14">
  <rect x="30" y="192" width="860" height="272" rx="10" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="460" y="222" fill="#61dafb" font-size="16" font-weight="bold" text-anchor="middle">Les 4 scénarios du banc — chacun teste UNE règle</text>
  <line x1="50" y1="238" x2="870" y2="238" stroke="#274a8a" stroke-width="2"/>
  <text x="60" y="266" fill="#9bbefc" font-weight="bold">Scénario 1</text>
  <text x="180" y="266" fill="#e4eaf5">33 % à 6 h, pompe éteinte</text>
  <text x="500" y="266" fill="#ffd66b">règle testée : le DÉMARRAGE</text>
  <text x="800" y="266" fill="#81fba1" font-weight="bold">→ DÉMARRE</text>
  <text x="60" y="312" fill="#9bbefc" font-weight="bold">Scénario 2</text>
  <text x="180" y="312" fill="#e4eaf5">38 % à 6 h 30, pompe DÉJÀ allumée</text>
  <text x="500" y="312" fill="#ffd66b">règle testée : l'HYSTÉRÉSIS</text>
  <text x="800" y="312" fill="#81fba1" font-weight="bold">→ RESTE ON</text>
  <text x="60" y="358" fill="#9bbefc" font-weight="bold">Scénario 3</text>
  <text x="180" y="358" fill="#e4eaf5">46 % à 7 h, pompe allumée</text>
  <text x="500" y="358" fill="#ffd66b">règle testée : l'ARRÊT</text>
  <text x="800" y="358" fill="#81fba1" font-weight="bold">→ S'ARRÊTE</text>
  <text x="60" y="404" fill="#9bbefc" font-weight="bold">Scénario 4</text>
  <text x="180" y="404" fill="#e4eaf5">33 % à 13 h, pompe éteinte</text>
  <text x="500" y="404" fill="#ffd66b">règle testée : la PLAGE HORAIRE</text>
  <text x="800" y="404" fill="#81fba1" font-weight="bold">→ RESTE OFF</text>
  <line x1="50" y1="424" x2="870" y2="424" stroke="#274a8a" stroke-width="2"/>
  <text x="460" y="450" fill="#9bbefc" font-size="13" text-anchor="middle">Un scénario par règle : si UN SEUL verdict est faux, on corrige AVANT de toucher au réel.</text>
</g>
<rect x="30" y="482" width="860" height="56" rx="10" fill="#050f24" stroke="#ff7b88" stroke-width="2"/>
<text x="460" y="506" fill="#ff7b88" font-family="sans-serif" font-size="15.5" font-weight="bold" text-anchor="middle">⚠ On ne modifie JAMAIS le programme du vrai jardin sans sauvegarde ni scénarios de test.</text>
<text x="460" y="527" fill="#ffd66b" font-family="sans-serif" font-size="13.5" text-anchor="middle">La moitié du métier de programmeur, c'est de ne pas casser ce qui marche. (Très basse tension uniquement pour la maquette.)</text>
</svg>
