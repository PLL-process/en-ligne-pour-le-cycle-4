<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Arial, sans-serif">
<title id="t">Le seuil de nuit du lampadaire (SEUIL_NUIT = 30)</title><desc id="d">Deux situations. Le jour : la luminosité mesurée vaut 80, au-dessus du seuil 30, le lampadaire reste éteint. La nuit : la luminosité vaut 12, en dessous du seuil 30, le lampadaire s'allume. La règle du programme : il fait nuit dès que la mesure passe SOUS le seuil.</desc>
<rect width="800" height="380" fill="#FFFFFF"/><text x="200" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#C55A11">☀️ JOUR : lum = 80</text>
<text x="600" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">🌙 NUIT : lum = 12</text>
<line x1="400" y1="20" x2="400" y2="300" stroke="#BFBFBF" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="188" y="70" width="24" height="150" fill="#595959"/><circle cx="200" cy="66" r="22" fill="#D9D9D9" stroke="#595959" stroke-width="4"/>
<text x="200" y="252" text-anchor="middle" font-size="17" fill="#595959">lampadaire ÉTEINT</text>
<rect x="588" y="70" width="24" height="150" fill="#595959"/><circle cx="600" cy="66" r="22" fill="#F4C542" stroke="#C55A11" stroke-width="4"/>
<path d="M578 92 L560 130 M622 92 L640 130 M600 96 L600 136" stroke="#F4C542" stroke-width="4"/>
<text x="600" y="252" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6d00">lampadaire ALLUMÉ</text>
<rect x="80" y="300" width="640" height="26" rx="13" fill="#EDEDED" stroke="#8C8C8C"/>
<rect x="80" y="300" width="640" height="26" rx="13" fill="url(#grad)"/>
<line x1="272" y1="288" x2="272" y2="340" stroke="#C00000" stroke-width="5"/>
<text x="272" y="362" text-anchor="middle" font-size="17" font-weight="bold" fill="#C00000">SEUIL_NUIT = 30</text>
<circle cx="157" cy="313" r="9" fill="#1F3864"/><text x="157" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">12</text>
<circle cx="592" cy="313" r="9" fill="#C55A11"/><text x="592" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#C55A11">80</text>
<text x="90" y="362" font-size="14" fill="#595959">0 (noir total)</text><text x="710" y="362" text-anchor="end" font-size="14" fill="#595959">100 (plein soleil)</text>
<text x="176" y="292" text-anchor="end" font-size="14" fill="#1F3864">← nuit : SOUS le seuil</text>
<defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F3864"/><stop offset="0.3" stop-color="#5B8DEF"/><stop offset="1" stop-color="#F4C542"/></linearGradient></defs></svg>