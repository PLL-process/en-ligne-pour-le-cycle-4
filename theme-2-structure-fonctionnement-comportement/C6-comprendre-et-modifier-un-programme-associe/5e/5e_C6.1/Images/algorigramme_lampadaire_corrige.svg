<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 780" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">L'algorigramme du lampadaire, corrigé : une mesure, deux décisions, trois actions, et la boucle</title>
<desc id="d">Algorigramme à lire de haut en bas. Un ovale Début. Un rectangle « Mesurer la luminosité ambiante ». Un premier losange : « Luminosité inférieure à 30 lux ? (il fait nuit ?) ». Si non, à droite, le rectangle « Éteindre la lampe ». Si oui, on descend au deuxième losange : « Passage détecté ? ». Si oui, on descend au rectangle « Pleine puissance pendant 5 s ». Si non, à droite, le rectangle « Veille à 30 % ». Les trois actions rejoignent une ligne en bas ; de là, une flèche remonte le long du bord gauche jusqu'au rectangle de mesure : c'est la boucle, le lampadaire recommence sans fin, il n'a pas d'ovale Fin. En bas, une légende : ovale pour le début, rectangle pour un traitement ou une action, losange pour une décision à deux sorties OUI et NON, flèche qui remonte pour la boucle.</desc>
<rect width="840" height="780" fill="#050f24"/>
<defs>
  <marker id="fl" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#c9d6f2"/></marker>
  <marker id="fb" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#c4a7ff"/></marker>
</defs>
<text x="420" y="34" text-anchor="middle" fill="#81aaff" font-size="21" font-weight="700">L'algorigramme du lampadaire — corrigé</text>

<!-- Début -->
<ellipse cx="350" cy="84" rx="78" ry="26" fill="#0d1c3a" stroke="#81fba1" stroke-width="3"/>
<text x="350" y="91" text-anchor="middle" fill="#e4eaf5" font-size="19" font-weight="700">DÉBUT</text>
<line x1="350" y1="110" x2="350" y2="138" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fl)"/>

<!-- Mesurer -->
<rect x="210" y="140" width="280" height="62" rx="6" fill="#0d1c3a" stroke="#81aaff" stroke-width="3"/>
<text x="350" y="167" text-anchor="middle" fill="#e4eaf5" font-size="18" font-weight="700">Mesurer la luminosité</text>
<text x="350" y="190" text-anchor="middle" fill="#e4eaf5" font-size="18" font-weight="700">ambiante</text>
<line x1="350" y1="202" x2="350" y2="226" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fl)"/>

<!-- Décision 1 -->
<polygon points="350,228 490,288 350,348 210,288" fill="#1c1a0a" stroke="#ffd66b" stroke-width="3"/>
<text x="350" y="282" text-anchor="middle" fill="#ffe9a8" font-size="17" font-weight="700">Luminosité</text>
<text x="350" y="303" text-anchor="middle" fill="#ffe9a8" font-size="17" font-weight="700">&lt; 30 lux ?</text>
<text x="350" y="322" text-anchor="middle" fill="#ffe9a8" font-size="14">(il fait nuit ?)</text>
<!-- NON → Éteindre -->
<line x1="490" y1="288" x2="566" y2="288" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fl)"/>
<text x="526" y="278" text-anchor="middle" fill="#ff9aa6" font-size="16" font-weight="700">NON</text>
<rect x="568" y="257" width="210" height="62" rx="6" fill="#0d1c3a" stroke="#ff9aa6" stroke-width="3"/>
<text x="673" y="294" text-anchor="middle" fill="#e4eaf5" font-size="18" font-weight="700">Éteindre la lampe</text>
<!-- OUI ↓ -->
<line x1="350" y1="348" x2="350" y2="384" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fl)"/>
<text x="366" y="372" fill="#81fba1" font-size="16" font-weight="700">OUI</text>

<!-- Décision 2 -->
<polygon points="350,386 490,446 350,506 210,446" fill="#1c1a0a" stroke="#ffd66b" stroke-width="3"/>
<text x="350" y="441" text-anchor="middle" fill="#ffe9a8" font-size="17" font-weight="700">Passage</text>
<text x="350" y="462" text-anchor="middle" fill="#ffe9a8" font-size="17" font-weight="700">détecté ?</text>
<!-- NON → Veille -->
<line x1="490" y1="446" x2="566" y2="446" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fl)"/>
<text x="526" y="436" text-anchor="middle" fill="#ff9aa6" font-size="16" font-weight="700">NON</text>
<rect x="568" y="415" width="210" height="62" rx="6" fill="#0d1c3a" stroke="#ffd66b" stroke-width="3"/>
<text x="673" y="452" text-anchor="middle" fill="#e4eaf5" font-size="18" font-weight="700">Veille à 30 %</text>
<!-- OUI ↓ -->
<line x1="350" y1="506" x2="350" y2="542" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fl)"/>
<text x="366" y="530" fill="#81fba1" font-size="16" font-weight="700">OUI</text>
<rect x="210" y="544" width="280" height="62" rx="6" fill="#0d1c3a" stroke="#81fba1" stroke-width="3"/>
<text x="350" y="571" text-anchor="middle" fill="#e4eaf5" font-size="18" font-weight="700">Pleine puissance</text>
<text x="350" y="594" text-anchor="middle" fill="#e4eaf5" font-size="18" font-weight="700">pendant 5 s</text>

<!-- les trois actions rejoignent la ligne du bas, puis la boucle remonte -->
<polyline points="778,288 812,288 812,660" fill="none" stroke="#c4a7ff" stroke-width="3"/>
<line x1="673" y1="477" x2="673" y2="660" stroke="#c4a7ff" stroke-width="3"/>
<line x1="350" y1="606" x2="350" y2="660" stroke="#c4a7ff" stroke-width="3"/>
<polyline points="812,660 120,660 120,171 206,171" fill="none" stroke="#c4a7ff" stroke-width="3" marker-end="url(#fb)"/>
<text x="466" y="688" text-anchor="middle" fill="#c4a7ff" font-size="16" font-weight="700">↺ la boucle : retour à la mesure, sans fin — pas d'ovale FIN</text>

<!-- légende -->
<rect x="30" y="708" width="780" height="56" rx="10" fill="#0a1630" stroke="#2a3f6a" stroke-width="1.5"/>
<ellipse cx="66" cy="736" rx="22" ry="11" fill="none" stroke="#81fba1" stroke-width="2"/>
<text x="96" y="741" fill="#c9d6f2" font-size="15">début</text>
<rect x="160" y="726" width="40" height="20" rx="3" fill="none" stroke="#81aaff" stroke-width="2"/>
<text x="210" y="741" fill="#c9d6f2" font-size="15">traitement ou action</text>
<polygon points="392,724 412,736 392,748 372,736" fill="none" stroke="#ffd66b" stroke-width="2"/>
<text x="422" y="741" fill="#c9d6f2" font-size="15">décision : deux sorties, OUI et NON</text>
<text x="712" y="741" fill="#c4a7ff" font-size="15" font-weight="700">↺ boucle</text>
</svg>
