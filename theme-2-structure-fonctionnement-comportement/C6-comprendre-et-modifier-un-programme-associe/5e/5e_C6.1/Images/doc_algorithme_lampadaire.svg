<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 414" width="350" height="414" role="img" aria-labelledby="t_algorithme_lampadaire d_algorithme_lampadaire" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_algorithme_lampadaire">L'algorithme du lampadaire</title>
<desc id="d_algorithme_lampadaire">L'algorithme du lampadaire, en six étapes : 1. Mesurer la luminosité ambiante. 2. Si la luminosité est inférieure au seuil de nuit (30 lux), considérer qu'il fait nuit. 3. Si nuit ET passage détecté : pleine puissance pendant 5 secondes. 4. Sinon, s'il fait nuit : mettre en veille à 30 %. 5. Sinon : éteindre la lampe. 6. Recommencer sans fin. Le document ne dit pas quelles données viennent des capteurs.</desc>
<rect width="350" height="414" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">L'algorithme du lampadaire</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le programme du lampadaire, traduit</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">en français, étape par étape.</text>
<rect x="14.0" y="87.4" width="322.0" height="258.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Les étapes, dans l'ordre</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">1. Mesurer la luminosité ambiante.</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">2. Si la luminosité est inférieure au seuil</text>
<text x="26.0" y="186.4" font-size="15" fill="#e4eaf5">de nuit (30 lux), considérer qu'il</text>
<text x="26.0" y="207.4" font-size="15" fill="#e4eaf5">fait nuit.</text>
<text x="26.0" y="228.4" font-size="15" fill="#e4eaf5">3. Si nuit ET passage détecté : pleine</text>
<text x="26.0" y="249.4" font-size="15" fill="#e4eaf5">puissance pendant 5 secondes.</text>
<text x="26.0" y="270.4" font-size="15" fill="#e4eaf5">4. Sinon, s'il fait nuit : mettre en</text>
<text x="26.0" y="291.4" font-size="15" fill="#e4eaf5">veille à 30 %.</text>
<text x="26.0" y="312.4" font-size="15" fill="#e4eaf5">5. Sinon : éteindre la lampe.</text>
<text x="26.0" y="333.4" font-size="15" fill="#e4eaf5">6. Recommencer sans fin.</text>
<text x="14.0" y="375.6" font-size="13.5" fill="#9bbefc">lux : l'unité d'éclairement · Le document ne range</text>
<text x="14.0" y="393.8" font-size="13.5" fill="#9bbefc">pas les données : c'est la question.</text>
</svg>
