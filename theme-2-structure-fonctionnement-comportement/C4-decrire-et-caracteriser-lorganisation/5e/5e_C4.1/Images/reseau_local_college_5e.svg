<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le réseau local du collège vu en 5e : terminaux, commutateur, borne Wi-Fi, serveur</title>
  <desc id="d">Schéma simple du réseau local : trois ordinateurs et une imprimante reliés par des câbles au commutateur ; une borne Wi-Fi reliée au commutateur dessert deux tablettes sans fil ; le serveur du collège est aussi relié au commutateur. Chaque équipement porte une étiquette avec son nom sur le réseau. Un encadré rappelle que pour s'envoyer des messages, les équipements doivent pouvoir s'identifier : chacun a un nom et une adresse uniques.</desc>
  <rect width="940" height="440" fill="#050f24"/>
  <text x="470" y="32" fill="#81aaff" font-size="20" font-weight="bold" text-anchor="middle">Le réseau local du collège (vu de la salle de techno)</text>

  <!-- switch au centre -->
  <rect x="380" y="190" width="180" height="56" rx="10" fill="#173666" stroke="#c68ef2" stroke-width="3"/>
  <text x="470" y="213" fill="#c68ef2" font-size="13" font-weight="bold" text-anchor="middle">COMMUTATEUR</text>
  <text x="470" y="232" fill="#9bbefc" font-size="10.5" text-anchor="middle">relie tout le monde</text>

  <!-- PC filaires -->
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="80" width="120 " height="58" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
    <text x="120" y="104" fill="#e4eaf5">💻 PC-TECHNO-01</text>
    <text x="120" y="124" fill="#9bbefc" font-size="9.5">terminal filaire</text>
    <rect x="60" y="180" width="120" height="58" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
    <text x="120" y="204" fill="#e4eaf5">💻 PC-TECHNO-02</text>
    <text x="120" y="224" fill="#9bbefc" font-size="9.5">terminal filaire</text>
    <rect x="60" y="280" width="120" height="58" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
    <text x="120" y="304" fill="#e4eaf5">🖨 IMPRIMANTE-CDI</text>
    <text x="120" y="324" fill="#9bbefc" font-size="9.5">terminal filaire</text>
  </g>
  <line x1="180" y1="109" x2="380" y2="200" stroke="#274a8a" stroke-width="3"/>
  <line x1="180" y1="209" x2="380" y2="215" stroke="#274a8a" stroke-width="3"/>
  <line x1="180" y1="309" x2="380" y2="235" stroke="#274a8a" stroke-width="3"/>

  <!-- borne wifi -->
  <rect x="680" y="90" width="150" height="56" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2.5"/>
  <text x="755" y="113" fill="#ffd66b" font-size="12" font-weight="bold" text-anchor="middle">📶 BORNE WI-FI</text>
  <text x="755" y="132" fill="#9bbefc" font-size="9.5" text-anchor="middle">accès SANS FIL au réseau</text>
  <line x1="560" y1="205" x2="700" y2="145" stroke="#274a8a" stroke-width="3"/>
  <g font-size="10.5" text-anchor="middle">
    <rect x="640" y="180" width="110" height="50" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/>
    <text x="695" y="201" fill="#e4eaf5">📱 TABLETTE-07</text>
    <text x="695" y="218" fill="#9bbefc" font-size="9">terminal sans fil</text>
    <rect x="780" y="180" width="110" height="50" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/>
    <text x="835" y="201" fill="#e4eaf5">📱 TABLETTE-12</text>
    <text x="835" y="218" fill="#9bbefc" font-size="9">terminal sans fil</text>
  </g>
  <g stroke="#ffd66b" stroke-width="1.6" stroke-dasharray="5 4">
    <line x1="732" y1="146" x2="700" y2="178"/><line x1="778" y1="146" x2="820" y2="178"/>
  </g>

  <!-- serveur -->
  <rect x="620" y="300" width="200" height="70" rx="10" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
  <text x="720" y="326" fill="#81fba1" font-size="12" font-weight="bold" text-anchor="middle">🗄 SERVEUR-COLLEGE</text>
  <text x="720" y="346" fill="#9bbefc" font-size="9.5" text-anchor="middle">stocke les dossiers des classes</text>
  <line x1="560" y1="232" x2="640" y2="310" stroke="#274a8a" stroke-width="3"/>

  <rect x="60" y="384" width="820" height="42" rx="10" fill="#173666" stroke="#274a8a"/>
  <text x="470" y="405" fill="#e4eaf5" font-size="12" text-anchor="middle">Pour s'envoyer des messages, les équipements doivent pouvoir <tspan fill="#61dafb" font-weight="bold">s'identifier</tspan> : chacun possède un <tspan fill="#ffd66b" font-weight="bold">nom</tspan> et une <tspan fill="#ffd66b" font-weight="bold">adresse uniques</tspan> sur le réseau.</text>
  <text x="470" y="420" fill="#9bbefc" font-size="10" text-anchor="middle">Sans identification : impossible de savoir à qui livrer — comme un courrier sans nom ni adresse !</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
