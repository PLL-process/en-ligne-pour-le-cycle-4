<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 352" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Les cinq constituants : quelle énergie entre, quelle énergie sort ?</title>
<desc id="d">Cinq colonnes, une par constituant, à lire de haut en bas : un point d'interrogation pour l'énergie qui entre, une flèche, le constituant, une flèche, un point d'interrogation pour l'énergie qui sort. Les constituants : moteur électrique, lampe, radiateur, génératrice, vérin.</desc>
<rect width="920" height="352" fill="#050f24"/>
<defs><marker id="fe" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#ffb15c"/></marker></defs>
<text x="460" y="26" text-anchor="middle" font-size="15" fill="#9aa5b8">Lis chaque colonne de haut en bas : ce qui entre, le constituant, ce qui sort.</text>
<!-- moteur -->
<text x="92" y="72" text-anchor="middle" font-size="24" fill="#9aa5b8" font-weight="700">?</text>
<line x1="92" y1="86" x2="92" y2="128" stroke="#ffb15c" stroke-width="4" marker-end="url(#fe)"/>
<rect x="10" y="136" width="164" height="104" rx="12" fill="#0d1c3a" stroke="#81aaff" stroke-width="3"/>
<g transform="translate(-182,72)"><rect x="248" y="86" width="34" height="28" rx="5" fill="#9aa5b8"/><rect x="282" y="91" width="6" height="18" rx="2" fill="#c9d6f2"/><line x1="288" y1="100" x2="300" y2="100" stroke="#e4eaf5" stroke-width="3" stroke-linecap="round"/><line x1="256" y1="92" x2="256" y2="108" stroke="#0d1c3a" stroke-width="2"/><line x1="264" y1="92" x2="264" y2="108" stroke="#0d1c3a" stroke-width="2"/><line x1="272" y1="92" x2="272" y2="108" stroke="#0d1c3a" stroke-width="2"/></g>
<text x="92" y="208" text-anchor="middle" font-size="15" fill="#e4eaf5" font-weight="700">Moteur</text><text x="92" y="227" text-anchor="middle" font-size="15" fill="#e4eaf5" font-weight="700">électrique</text>
<line x1="92" y1="248" x2="92" y2="290" stroke="#ffb15c" stroke-width="4" marker-end="url(#fe)"/>
<text x="92" y="322" text-anchor="middle" font-size="24" fill="#9aa5b8" font-weight="700">?</text>
<!-- lampe -->
<text x="276" y="72" text-anchor="middle" font-size="24" fill="#9aa5b8" font-weight="700">?</text>
