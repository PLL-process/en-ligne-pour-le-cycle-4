<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le lampadaire solaire intelligent : fonctions techniques et solutions techniques</title>
  <desc id="d">Dessin d'un lampadaire solaire annoté. Chaque élément relie une fonction technique à sa solution : éclairer est assuré par le bloc de LED, capter l'énergie du soleil par le panneau solaire, stocker l'énergie par la batterie, détecter un passage par le détecteur de mouvement, mesurer la lumière du jour par le capteur de luminosité, décider par la petite carte électronique, tenir debout et résister au vent par le mât en acier galvanisé.</desc>
  <rect width="940" height="470" fill="#050f24"/>
  <text x="470" y="32" fill="#81aaff" font-size="20" font-weight="bold" text-anchor="middle">Le lampadaire solaire du parking : qui fait quoi ?</text>

  <!-- lampadaire -->
  <rect x="452" y="120" width="16" height="300" fill="#274a8a"/>
  <rect x="430" y="416" width="60" height="16" rx="4" fill="#274a8a"/>
  <!-- panneau -->
  <g transform="rotate(-20 460 108)">
    <rect x="400" y="86" width="120" height="44" rx="5" fill="#0d2347" stroke="#ffb454" stroke-width="3"/>
    <line x1="430" y1="86" x2="430" y2="130" stroke="#ffb454"/>
    <line x1="460" y1="86" x2="460" y2="130" stroke="#ffb454"/>
    <line x1="490" y1="86" x2="490" y2="130" stroke="#ffb454"/>
  </g>
  <!-- luminaire LED -->
  <rect x="360" y="150" width="100" height="26" rx="9" fill="#0d2347" stroke="#ffd66b" stroke-width="3"/>
  <g stroke="#ffd66b" stroke-width="2"><line x1="380" y1="182" x2="374" y2="196"/><line x1="410" y1="182" x2="410" y2="198"/><line x1="440" y1="182" x2="446" y2="196"/></g>
  <!-- capteurs -->
  <circle cx="486" cy="200" r="12" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
  <circle cx="486" cy="240" r="12" fill="#0d2347" stroke="#c68ef2" stroke-width="2.5"/>
  <!-- boîtier -->
  <rect x="432" y="288" width="56" height="70" rx="8" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
  <text x="460" y="316" fill="#81fba1" font-size="9" text-anchor="middle">carte</text>
  <text x="460" y="328" fill="#81fba1" font-size="9" text-anchor="middle">électro-</text>
  <text x="460" y="340" fill="#81fba1" font-size="9" text-anchor="middle">nique</text>
  <rect x="432" y="366" width="56" height="34" rx="8" fill="#0d2347" stroke="#ff7b88" stroke-width="2.5"/>
  <text x="460" y="387" fill="#ff7b88" font-size="9" text-anchor="middle">batterie</text>

  <!-- annotations gauche -->
  <g font-size="12" fill="#e4eaf5">
    <rect x="30" y="70" width="270" height="52" rx="10" fill="#173666" stroke="#ffb454" stroke-width="2"/>
    <text x="44" y="91"><tspan fill="#ffb454" font-weight="bold">FONCTION :</tspan> capter l'énergie du soleil</text>
    <text x="44" y="110"><tspan fill="#9bbefc">SOLUTION :</tspan> panneau solaire</text>
    <line x1="300" y1="96" x2="396" y2="100" stroke="#ffb454" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="30" y="140" width="270" height="52" rx="10" fill="#173666" stroke="#ffd66b" stroke-width="2"/>
    <text x="44" y="161"><tspan fill="#ffd66b" font-weight="bold">FONCTION :</tspan> éclairer le parking</text>
    <text x="44" y="180"><tspan fill="#9bbefc">SOLUTION :</tspan> bloc de LED</text>
    <line x1="300" y1="166" x2="356" y2="163" stroke="#ffd66b" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="30" y="210" width="270" height="52" rx="10" fill="#173666" stroke="#81fba1" stroke-width="2"/>
    <text x="44" y="231"><tspan fill="#81fba1" font-weight="bold">FONCTION :</tspan> décider d'allumer ou non</text>
    <text x="44" y="250"><tspan fill="#9bbefc">SOLUTION :</tspan> carte électronique</text>
    <line x1="300" y1="236" x2="428" y2="316" stroke="#81fba1" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="30" y="280" width="270" height="52" rx="10" fill="#173666" stroke="#ff7b88" stroke-width="2"/>
    <text x="44" y="301"><tspan fill="#ff7b88" font-weight="bold">FONCTION :</tspan> stocker l'énergie pour la nuit</text>
    <text x="44" y="320"><tspan fill="#9bbefc">SOLUTION :</tspan> batterie</text>
    <line x1="300" y1="306" x2="428" y2="380" stroke="#ff7b88" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- annotations droite -->
  <g font-size="12" fill="#e4eaf5">
    <rect x="620" y="150" width="290" height="52" rx="10" fill="#173666" stroke="#61dafb" stroke-width="2"/>
    <text x="634" y="171"><tspan fill="#61dafb" font-weight="bold">FONCTION :</tspan> mesurer la lumière du jour</text>
    <text x="634" y="190"><tspan fill="#9bbefc">SOLUTION :</tspan> capteur de luminosité</text>
    <line x1="618" y1="176" x2="500" y2="200" stroke="#61dafb" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="620" y="220" width="290" height="52" rx="10" fill="#173666" stroke="#c68ef2" stroke-width="2"/>
    <text x="634" y="241"><tspan fill="#c68ef2" font-weight="bold">FONCTION :</tspan> détecter un passage</text>
    <text x="634" y="260"><tspan fill="#9bbefc">SOLUTION :</tspan> détecteur de mouvement (PIR)</text>
    <line x1="618" y1="246" x2="500" y2="240" stroke="#c68ef2" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="620" y="290" width="290" height="52" rx="10" fill="#173666" stroke="#9bbefc" stroke-width="2"/>
    <text x="634" y="311"><tspan fill="#9bbefc" font-weight="bold">FONCTION :</tspan> tenir debout, résister au vent</text>
    <text x="634" y="330"><tspan fill="#9bbefc">SOLUTION :</tspan> mât en acier galvanisé</text>
    <line x1="618" y1="316" x2="470" y2="300" stroke="#9bbefc" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <rect x="60" y="424" width="820" height="36" rx="10" fill="#173666" stroke="#274a8a"/>
  <text x="470" y="447" fill="#e4eaf5" font-size="12" text-anchor="middle">Une <tspan fill="#ffb454" font-weight="bold">fonction technique</tspan> = CE QUE l'objet doit faire · une <tspan fill="#61dafb" font-weight="bold">solution technique</tspan> = l'élément choisi POUR le faire.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#274a8a"]{fill:#ffffff}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  [stroke="#9bbefc"]{stroke:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  [stroke="#ff7b88"]{stroke:#eb0017}
  text[fill="#ffb454"],tspan[fill="#ffb454"],[fill="#ffb454"] text,[fill="#ffb454"] tspan{fill:#b06300}
  [stroke="#ffb454"]{stroke:#b06300}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
