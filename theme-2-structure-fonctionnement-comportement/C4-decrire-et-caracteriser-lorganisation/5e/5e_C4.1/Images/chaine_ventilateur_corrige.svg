<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 860" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d"><style id="flux-anime">.flux{fill:none;stroke:#ffffff;stroke-opacity:.9;stroke-linecap:round;stroke-dasharray:.1 42;animation:flux-avance 1.6s linear infinite;pointer-events:none}.flux.retour{animation-direction:reverse;animation-delay:-.8s}@keyframes flux-avance{from{stroke-dashoffset:42.1}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.flux{display:none}}@media print{.flux{display:none}}</style>
<title id="t">Exemple corrigé : la chaîne d'énergie du ventilateur</title>
<desc id="d">Chaîne d'énergie à lire de haut en bas. En entrée, l'énergie électrique du réseau. Premier bloc ALIMENTER, la prise et le câble ; flèche : énergie électrique. Deuxième bloc DISTRIBUER, l'interrupteur et le sélecteur de vitesse ; flèche : énergie électrique. Troisième bloc CONVERTIR, le moteur électrique ; une flèche en pointillés part sur le côté : de la chaleur perdue, le moteur chauffe ; flèche vers le bas : énergie cinétique, la rotation. Quatrième bloc TRANSMETTRE, l'axe et l'hélice ; flèche de sortie : énergie cinétique. L'action finale : brasser l'air.</desc>
<rect width="560" height="860" fill="#050f24"/>
<defs><marker id="fe" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#ffb15c"/></marker><marker id="fp" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b8"/></marker></defs>
<text x="280" y="34" text-anchor="middle" fill="#81aaff" font-size="21" font-weight="700">Exemple : la chaîne d'énergie du ventilateur</text>
<line x1="200" y1="56" x2="200" y2="112" stroke="#ffb15c" stroke-width="4" marker-end="url(#fe)"/><line class="flux" x1="200" y1="56" x2="200" y2="112" stroke-width="7" aria-hidden="true"/>
<text x="218" y="91" fill="#ffd2a0" font-size="17" font-weight="700">énergie électrique du réseau</text>
<rect x="75" y="116" width="250" height="58" rx="12" fill="#0d1c3a" stroke="#ffd66b" stroke-width="3.5"/>
<text x="200" y="153" text-anchor="middle" fill="#ffd66b" font-size="22" font-weight="800">ALIMENTER</text>
<text x="200" y="200" text-anchor="middle" fill="#e4eaf5" font-size="17">la prise et le câble</text>
<line x1="200" y1="214" x2="200" y2="270" stroke="#ffb15c" stroke-width="4" marker-end="url(#fe)"/><line class="flux" x1="200" y1="214" x2="200" y2="270" stroke-width="7" aria-hidden="true"/>
<text x="218" y="249" fill="#ffd2a0" font-size="17">énergie électrique</text>
<rect x="75" y="274" width="250" height="58" rx="12" fill="#0d1c3a" stroke="#61dafb" stroke-width="3.5"/>
<text x="200" y="311" text-anchor="middle" fill="#61dafb" font-size="22" font-weight="800">DISTRIBUER</text>
<text x="200" y="358" text-anchor="middle" fill="#e4eaf5" font-size="17">l'interrupteur, le sélecteur de vitesse</text>
<line x1="200" y1="372" x2="200" y2="428" stroke="#ffb15c" stroke-width="4" marker-end="url(#fe)"/><line class="flux" x1="200" y1="372" x2="200" y2="428" stroke-width="7" aria-hidden="true"/>
<text x="218" y="407" fill="#ffd2a0" font-size="17">énergie électrique</text>
<rect x="75" y="432" width="250" height="58" rx="12" fill="#0d1c3a" stroke="#c68ef2" stroke-width="3.5"/>
<text x="200" y="469" text-anchor="middle" fill="#c68ef2" font-size="22" font-weight="800">CONVERTIR</text>
<text x="200" y="516" text-anchor="middle" fill="#e4eaf5" font-size="17">le moteur électrique</text>
<line x1="325" y1="461" x2="372" y2="461" stroke="#9aa5b8" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#fp)"/><line class="flux" x1="325" y1="461" x2="372" y2="461" stroke-width="6" aria-hidden="true"/>
<text x="382" y="457" fill="#c9d6f2" font-size="16">chaleur perdue</text>
<text x="382" y="478" fill="#c9d6f2" font-size="16">(le moteur chauffe)</text>
<line x1="200" y1="530" x2="200" y2="586" stroke="#ffb15c" stroke-width="4" marker-end="url(#fe)"/><line class="flux" x1="200" y1="530" x2="200" y2="586" stroke-width="7" aria-hidden="true"/>
<text x="218" y="565" fill="#ffd2a0" font-size="17">énergie cinétique (rotation)</text>
<rect x="75" y="590" width="250" height="58" rx="12" fill="#0d1c3a" stroke="#81fba1" stroke-width="3.5"/>
<text x="200" y="627" text-anchor="middle" fill="#81fba1" font-size="22" font-weight="800">TRANSMETTRE</text>
<text x="200" y="674" text-anchor="middle" fill="#e4eaf5" font-size="17">l'axe et l'hélice</text>
<line x1="200" y1="688" x2="200" y2="744" stroke="#ffb15c" stroke-width="4" marker-end="url(#fe)"/><line class="flux" x1="200" y1="688" x2="200" y2="744" stroke-width="7" aria-hidden="true"/>
<text x="218" y="723" fill="#ffd2a0" font-size="17" font-weight="700">énergie cinétique</text>
<text x="200" y="770" text-anchor="middle" fill="#81fba1" font-size="21" font-weight="800">→ brasser l'air</text>
<text x="280" y="810" text-anchor="middle" fill="#9aa5b8" font-size="15">la fonction dans le bloc · le composant dessous</text>
<text x="280" y="832" text-anchor="middle" fill="#9aa5b8" font-size="15">la forme d'énergie sur chaque flèche</text>
</svg>