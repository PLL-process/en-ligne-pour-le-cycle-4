<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Les deux chaînes du lampadaire : chaîne d'énergie et chaîne d'information</title>
  <desc id="d">En haut, la chaîne d'énergie : le panneau solaire capte l'énergie lumineuse et la convertit en énergie électrique, la batterie la stocke, le régulateur la distribue, le bloc LED la convertit en lumière. La nature de l'énergie est indiquée à chaque étape : lumineuse, électrique, chimique, électrique, lumineuse. En bas, la chaîne d'information : le capteur de luminosité et le détecteur de mouvement acquièrent des informations, la carte électronique les traite en suivant sa règle nuit et passage, et commande le bloc LED. Une flèche verticale montre que la chaîne d'information COMMANDE la chaîne d'énergie.</desc>
  <defs>
    <marker id="ear" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb454"/>
    </marker>
    <marker id="iar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Les DEUX chaînes du lampadaire</text>

  <!-- CHAÎNE D'ÉNERGIE -->
  <rect x="24" y="50" width="892" height="190" rx="14" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="76" fill="#ffb454" font-size="14" font-weight="bold">⚡ CHAÎNE D'ÉNERGIE</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="50" y="100" width="170" height="66" rx="10" fill="#0d2347" stroke="#ffb454" stroke-width="2.5"/>
    <text x="135" y="122" fill="#ffb454" font-weight="bold">CAPTER + CONVERTIR</text>
    <text x="135" y="140" fill="#e4eaf5">panneau solaire</text>
    <text x="135" y="157" fill="#9bbefc" font-size="10">lumineuse → électrique</text>
    <rect x="280" y="100" width="150" height="66" rx="10" fill="#0d2347" stroke="#ffb454" stroke-width="2.5"/>
    <text x="355" y="122" fill="#ffb454" font-weight="bold">STOCKER</text>
    <text x="355" y="140" fill="#e4eaf5">batterie</text>
    <text x="355" y="157" fill="#9bbefc" font-size="10">chimique</text>
    <rect x="490" y="100" width="160" height="66" rx="10" fill="#0d2347" stroke="#ffb454" stroke-width="2.5"/>
    <text x="570" y="122" fill="#ffb454" font-weight="bold">DISTRIBUER</text>
    <text x="570" y="140" fill="#e4eaf5">régulateur + interrupteur</text>
    <text x="570" y="157" fill="#9bbefc" font-size="10">électrique</text>
    <rect x="710" y="100" width="180" height="66" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2.5"/>
    <text x="800" y="122" fill="#ffd66b" font-weight="bold">CONVERTIR</text>
    <text x="800" y="140" fill="#e4eaf5">bloc LED</text>
    <text x="800" y="157" fill="#9bbefc" font-size="10">électrique → lumineuse</text>
  </g>
  <line x1="220" y1="133" x2="274" y2="133" stroke="#ffb454" stroke-width="3.5" marker-end="url(#ear)"/>
  <line x1="430" y1="133" x2="484" y2="133" stroke="#ffb454" stroke-width="3.5" marker-end="url(#ear)"/>
  <line x1="650" y1="133" x2="704" y2="133" stroke="#ffb454" stroke-width="3.5" marker-end="url(#ear)"/>
  <text x="470" y="212" fill="#9bbefc" font-size="11" text-anchor="middle">☀ énergie LUMINEUSE → ⚡ ÉLECTRIQUE → 🧪 CHIMIQUE (stockée) → ⚡ ÉLECTRIQUE → 💡 LUMINEUSE</text>

  <!-- CHAÎNE D'INFORMATION -->
  <rect x="24" y="290" width="892" height="180" rx="14" fill="none" stroke="#61dafb" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="316" fill="#61dafb" font-size="14" font-weight="bold">🧠 CHAÎNE D'INFORMATION</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="50" y="340" width="200" height="90" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
    <text x="150" y="362" fill="#61dafb" font-weight="bold">ACQUÉRIR</text>
    <text x="150" y="382" fill="#e4eaf5">capteur de luminosité</text>
    <text x="150" y="400" fill="#e4eaf5">détecteur de mouvement</text>
    <text x="150" y="418" fill="#9bbefc" font-size="10">= les capteurs</text>
    <rect x="330" y="340" width="260" height="90" rx="10" fill="#0d2347" stroke="#c68ef2" stroke-width="2.5"/>
    <text x="460" y="362" fill="#c68ef2" font-weight="bold">TRAITER</text>
    <text x="460" y="382" fill="#e4eaf5">carte électronique</text>
    <rect x="352" y="392" width="216" height="28" rx="6" fill="#08132c"/>
    <text x="460" y="410" fill="#ffd66b" font-size="10" font-family="monospace">SI nuit ET passage → allumer fort</text>
    <rect x="670" y="340" width="220" height="90" rx="10" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
    <text x="780" y="362" fill="#81fba1" font-weight="bold">COMMUNIQUER / COMMANDER</text>
    <text x="780" y="384" fill="#e4eaf5">ordre envoyé au bloc LED</text>
    <text x="780" y="404" fill="#9bbefc" font-size="10">(et voyant d'état)</text>
  </g>
  <line x1="250" y1="385" x2="324" y2="385" stroke="#61dafb" stroke-width="3.5" marker-end="url(#iar)"/>
  <line x1="590" y1="385" x2="664" y2="385" stroke="#61dafb" stroke-width="3.5" marker-end="url(#iar)"/>

  <!-- lien commande -->
  <line x1="800" y1="338" x2="800" y2="172" stroke="#81fba1" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#iar)"/>
  <text x="812" y="262" fill="#81fba1" font-size="10.5">la chaîne d'information</text>
  <text x="812" y="278" fill="#81fba1" font-size="10.5">COMMANDE la chaîne d'énergie</text>

  <text x="470" y="500" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">L'énergie fait FONCTIONNER l'objet · l'information le rend INTELLIGENT — les deux chaînes travaillent ensemble.</text>
</svg>
