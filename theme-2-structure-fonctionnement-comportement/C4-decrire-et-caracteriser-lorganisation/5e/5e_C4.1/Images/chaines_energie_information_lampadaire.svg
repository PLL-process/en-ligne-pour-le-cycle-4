<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Les deux chaînes du lampadaire : chaîne d'information en haut, chaîne d'énergie en bas</title>
  <desc id="d">En haut, selon la convention de la technologie, la chaîne d'information : le capteur de luminosité et le détecteur de mouvement acquièrent des informations, la carte électronique les traite en suivant sa règle nuit et passage, et communique son ordre au bloc LED. En bas, la chaîne d'énergie : le panneau solaire capte l'énergie lumineuse et la convertit en énergie électrique, la batterie la stocke sous forme chimique, le régulateur la distribue, le bloc LED la convertit en lumière. La nature de l'énergie est indiquée à chaque étape : lumineuse, électrique, chimique, électrique, lumineuse. Une flèche verticale DESCEND de la chaîne d'information vers la chaîne d'énergie : l'information COMMANDE l'énergie.</desc>
  <defs>
    <marker id="ear" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb454"/>
    </marker>
    <marker id="iar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/>
    </marker>
    <marker id="gar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#81fba1"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Les DEUX chaînes du lampadaire — l'information COMMANDE l'énergie</text>

  <!-- CHAÎNE D'INFORMATION (en haut — convention) -->
  <rect x="24" y="50" width="892" height="180" rx="14" fill="none" stroke="#61dafb" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="76" fill="#61dafb" font-size="14" font-weight="bold">🧠 CHAÎNE D'INFORMATION</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="50" y="100" width="200" height="90" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
    <text x="150" y="122" fill="#61dafb" font-weight="bold">ACQUÉRIR</text>
    <text x="150" y="142" fill="#e4eaf5">capteur de luminosité</text>
    <text x="150" y="160" fill="#e4eaf5">détecteur de mouvement</text>
    <text x="150" y="178" fill="#9bbefc" font-size="10">= les capteurs</text>
    <rect x="330" y="100" width="260" height="90" rx="10" fill="#0d2347" stroke="#c68ef2" stroke-width="2.5"/>
    <text x="460" y="122" fill="#c68ef2" font-weight="bold">TRAITER</text>
    <text x="460" y="142" fill="#e4eaf5">carte électronique</text>
    <rect x="352" y="152" width="216" height="28" rx="6" fill="#08132c"/>
    <text x="460" y="170" fill="#ffd66b" font-size="10" font-family="monospace">SI nuit ET passage → allumer fort</text>
    <rect x="670" y="100" width="220" height="90" rx="10" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
    <text x="780" y="122" fill="#81fba1" font-weight="bold">COMMUNIQUER / COMMANDER</text>
    <text x="780" y="144" fill="#e4eaf5">ordre envoyé au bloc LED</text>
    <text x="780" y="164" fill="#9bbefc" font-size="10">(et voyant d'état)</text>
  </g>
  <line x1="250" y1="145" x2="324" y2="145" stroke="#61dafb" stroke-width="3.5" marker-end="url(#iar)"/>
  <line x1="590" y1="145" x2="664" y2="145" stroke="#61dafb" stroke-width="3.5" marker-end="url(#iar)"/>

  <!-- lien commande : l'ordre DESCEND -->
  <line x1="800" y1="192" x2="800" y2="322" stroke="#81fba1" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#gar)"/>
  <text x="812" y="248" fill="#81fba1" font-size="10.5">l'ORDRE descend :</text>
  <text x="812" y="264" fill="#81fba1" font-size="10.5">l'information COMMANDE l'énergie</text>

  <!-- CHAÎNE D'ÉNERGIE (en bas — convention) -->
  <rect x="24" y="280" width="892" height="190" rx="14" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="306" fill="#ffb454" font-size="14" font-weight="bold">⚡ CHAÎNE D'ÉNERGIE</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="50" y="330" width="170" height="66" rx="10" fill="#0d2347" stroke="#ffb454" stroke-width="2.5"/>
    <text x="135" y="352" fill="#ffb454" font-weight="bold">CAPTER + CONVERTIR</text>
    <text x="135" y="370" fill="#e4eaf5">panneau solaire</text>
    <text x="135" y="387" fill="#9bbefc" font-size="10">lumineuse → électrique</text>
    <rect x="280" y="330" width="150" height="66" rx="10" fill="#0d2347" stroke="#ffb454" stroke-width="2.5"/>
    <text x="355" y="352" fill="#ffb454" font-weight="bold">STOCKER</text>
    <text x="355" y="370" fill="#e4eaf5">batterie</text>
    <text x="355" y="387" fill="#9bbefc" font-size="10">chimique</text>
    <rect x="490" y="330" width="160" height="66" rx="10" fill="#0d2347" stroke="#ffb454" stroke-width="2.5"/>
    <text x="570" y="352" fill="#ffb454" font-weight="bold">DISTRIBUER</text>
    <text x="570" y="370" fill="#e4eaf5">régulateur + interrupteur</text>
    <text x="570" y="387" fill="#9bbefc" font-size="10">électrique</text>
    <rect x="710" y="330" width="180" height="66" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2.5"/>
    <text x="800" y="352" fill="#ffd66b" font-weight="bold">CONVERTIR</text>
    <text x="800" y="370" fill="#e4eaf5">bloc LED</text>
    <text x="800" y="387" fill="#9bbefc" font-size="10">électrique → lumineuse</text>
  </g>
  <line x1="220" y1="363" x2="274" y2="363" stroke="#ffb454" stroke-width="3.5" marker-end="url(#ear)"/>
  <line x1="430" y1="363" x2="484" y2="363" stroke="#ffb454" stroke-width="3.5" marker-end="url(#ear)"/>
  <line x1="650" y1="363" x2="704" y2="363" stroke="#ffb454" stroke-width="3.5" marker-end="url(#ear)"/>
  <text x="470" y="442" fill="#9bbefc" font-size="11" text-anchor="middle">☀ énergie LUMINEUSE → ⚡ ÉLECTRIQUE → 🧪 CHIMIQUE (stockée) → ⚡ ÉLECTRIQUE → 💡 LUMINEUSE</text>

  <text x="470" y="500" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">Convention de la technologie : l'information EN HAUT, l'énergie EN BAS — l'ordre descend, comme le cerveau commande les muscles.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#08132c"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#5b7bb8"]{fill:#ffffff}
  text[fill="#5b7bb8"],tspan[fill="#5b7bb8"]{fill:#5475b5}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ffb454"],tspan[fill="#ffb454"],[fill="#ffb454"] text,[fill="#ffb454"] tspan{fill:#b06300}
  [stroke="#ffb454"]{stroke:#b06300}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
