<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">La recette de conception du schéma de réseau, en quatre étapes illustrées</title>
<desc id="d">Quatre vignettes montrent le schéma en train de se construire, étape par étape. Vignette 1 : une feuille blanche avec le commutateur seul, posé au centre — on commence toujours par le facteur. Vignette 2 : trois traits pleins partent du commutateur vers PC0, PC1 et la borne WiFi — les appareils câblés le rejoignent. Vignette 3 : trois liaisons en pointillés relient la borne WiFi au portable, à la tablette et au smartphone — les appareils sans fil passent par la borne, jamais directement par le commutateur. Vignette 4 : le schéma terminé, dont les branches dessinent une étoile mise en évidence. Sous chaque vignette, la consigne de l'étape.</desc>
<rect width="1080" height="380" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="378" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#135588">La recette du schéma : quatre étapes, dans cet ordre — comme en cuisine</text>

<defs>
  <g id="rsw"><rect x="-16" y="-7" width="32" height="14" rx="3" fill="#2a6f9e"/><g fill="#cde9f8"><rect x="-12" y="-2" width="4" height="4"/><rect x="-5" y="-2" width="4" height="4"/><rect x="2" y="-2" width="4" height="4"/><rect x="9" y="-2" width="4" height="4"/></g></g>
  <g id="rpc"><rect x="-11" y="-9" width="22" height="15" rx="2" fill="#27384a"/><rect x="-8" y="-6" width="16" height="9" fill="#9fd8f1"/><rect x="-6" y="7" width="12" height="3" fill="#66798a"/></g>
  <g id="rap"><rect x="-13" y="-4" width="26" height="11" rx="4" fill="#ecf1f5" stroke="#48677f" stroke-width="1.5"/><path d="M0 -4 v-5 M-6 -8 q6 -6 12 0" fill="none" stroke="#2877b1" stroke-width="2"/></g>
  <g id="rmob"><rect x="-6" y="-10" width="12" height="20" rx="2" fill="#27384a"/><rect x="-4" y="-7" width="8" height="13" fill="#9fd8f1"/></g>
</defs>

<!-- ═ Vignette 1 ═ -->
<g transform="translate(20,50)">
  <rect width="250" height="240" rx="10" fill="#f8fafc" stroke="#4d8bc2" stroke-width="2"/>
  <circle cx="22" cy="22" r="14" fill="#ffd66b" stroke="#8a6d1c" stroke-width="2"/><text x="22" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3a08">1</text>
  <use href="#rsw" x="125" y="120"/>
  <text x="125" y="145" text-anchor="middle" font-size="11" fill="#31475a">le commutateur</text>
  <circle cx="125" cy="118" r="34" fill="none" stroke="#1e9d55" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="125" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#116a3c">JE COMMENCE PAR LE FACTEUR,</text>
  <text x="125" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#116a3c">AU CENTRE de ma feuille</text>
</g>
<!-- ═ Vignette 2 ═ -->
<g transform="translate(290,50)">
  <rect width="250" height="240" rx="10" fill="#f8fafc" stroke="#4d8bc2" stroke-width="2"/>
  <circle cx="22" cy="22" r="14" fill="#ffd66b" stroke="#8a6d1c" stroke-width="2"/><text x="22" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3a08">2</text>
  <line x1="125" y1="118" x2="55" y2="60" stroke="#2f6590" stroke-width="3"/>
  <line x1="125" y1="118" x2="55" y2="175" stroke="#2f6590" stroke-width="3"/>
  <line x1="125" y1="118" x2="200" y2="60" stroke="#2f6590" stroke-width="3"/>
  <use href="#rsw" x="125" y="120"/>
  <use href="#rpc" x="52" y="55"/><text x="52" y="80" text-anchor="middle" font-size="10" fill="#31475a">PC0</text>
  <use href="#rpc" x="52" y="172"/><text x="52" y="196" text-anchor="middle" font-size="10" fill="#31475a">PC1</text>
  <use href="#rap" x="202" y="58"/><text x="202" y="80" text-anchor="middle" font-size="10" fill="#31475a">borne WiFi</text>
  <text x="125" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#116a3c">3 TRAITS PLEINS : chaque appareil</text>
  <text x="125" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#116a3c">câblé rejoint le commutateur</text>
</g>
<!-- ═ Vignette 3 ═ -->
<g transform="translate(560,50)">
  <rect width="250" height="240" rx="10" fill="#f8fafc" stroke="#4d8bc2" stroke-width="2"/>
  <circle cx="22" cy="22" r="14" fill="#ffd66b" stroke="#8a6d1c" stroke-width="2"/><text x="22" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3a08">3</text>
  <line x1="125" y1="118" x2="55" y2="60" stroke="#2f6590" stroke-width="3"/>
  <line x1="125" y1="118" x2="55" y2="175" stroke="#2f6590" stroke-width="3"/>
  <line x1="125" y1="118" x2="200" y2="60" stroke="#2f6590" stroke-width="3"/>
  <line x1="200" y1="60" x2="215" y2="150" stroke="#5b7bb8" stroke-width="2.5" stroke-dasharray="3 5"/>
  <line x1="200" y1="60" x2="160" y2="165" stroke="#5b7bb8" stroke-width="2.5" stroke-dasharray="3 5"/>
  <line x1="200" y1="60" x2="230" y2="100" stroke="#5b7bb8" stroke-width="2.5" stroke-dasharray="3 5"/>
  <use href="#rsw" x="125" y="120"/>
  <use href="#rpc" x="52" y="55"/><use href="#rpc" x="52" y="172"/>
  <use href="#rap" x="202" y="58"/>
  <use href="#rmob" x="215" y="158"/><use href="#rmob" x="160" y="173"/><use href="#rmob" x="232" y="108"/>
  <text x="125" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#116a3c">POINTILLÉS : les sans-fil passent</text>
  <text x="125" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#116a3c">par la borne, jamais en direct</text>
</g>
<!-- ═ Vignette 4 ═ -->
<g transform="translate(830,50)">
  <rect width="230" height="240" rx="10" fill="#f8fafc" stroke="#4d8bc2" stroke-width="2"/>
  <circle cx="22" cy="22" r="14" fill="#ffd66b" stroke="#8a6d1c" stroke-width="2"/><text x="22" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3a08">4</text>
  <g transform="translate(-10,0)">
    <line x1="125" y1="118" x2="60" y2="62" stroke="#2f6590" stroke-width="3"/>
    <line x1="125" y1="118" x2="60" y2="172" stroke="#2f6590" stroke-width="3"/>
    <line x1="125" y1="118" x2="195" y2="62" stroke="#2f6590" stroke-width="3"/>
    <line x1="195" y1="62" x2="205" y2="150" stroke="#5b7bb8" stroke-width="2.5" stroke-dasharray="3 5"/>
    <line x1="195" y1="62" x2="155" y2="165" stroke="#5b7bb8" stroke-width="2.5" stroke-dasharray="3 5"/>
    <use href="#rsw" x="125" y="120"/>
    <use href="#rpc" x="57" y="57"/><use href="#rpc" x="57" y="169"/>
    <use href="#rap" x="197" y="60"/>
    <use href="#rmob" x="205" y="158"/><use href="#rmob" x="155" y="173"/>
    <path d="M125 118 L60 62 M125 118 L60 172 M125 118 L195 62" stroke="#ffd66b" stroke-width="7" opacity="0.35"/>
  </g>
  <text x="115" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#116a3c">JE RECULE D'UN PAS :</text>
  <text x="115" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#116a3c">une ÉTOILE est apparue ⭐</text>
</g>

<rect x="20" y="305" width="1040" height="55" rx="10" fill="#eef6ff" stroke="#4d8bc2" stroke-width="2"/>
<text x="540" y="328" text-anchor="middle" font-size="13.5" fill="#12335e"><tspan font-weight="bold">Ton schéma peut être différent de celui-ci</tspan> (tes positions, ton ordre autour du centre) :</text>
<text x="540" y="348" text-anchor="middle" font-size="13.5" fill="#12335e">ce qui doit être PAREIL, ce sont les 4 règles de la recette — centre, traits pleins, pointillés vers la borne, forme d'étoile.</text>
</svg>
