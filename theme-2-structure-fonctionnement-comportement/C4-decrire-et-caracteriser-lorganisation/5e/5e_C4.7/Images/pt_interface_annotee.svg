<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">La fenêtre de Cisco Packet Tracer 8.2 au démarrage, avec ses quatre zones repérées de 1 à 4</title>
<desc id="d">Reconstitution fidèle de l'écran : en haut, la barre de menus (File, Edit, Options, View, Tools, Extensions, Window, Help) — zone 1. Au centre, le grand espace de travail logique blanc, vide — zone 2. En bas à gauche, la palette d'équipements avec ses deux rangées d'icônes de catégories et la liste des modèles — zone 3. En bas à droite, les deux onglets Realtime (temps réel) et Simulation — zone 4. Des pastilles numérotées jaunes signalent chaque zone.</desc>
<!-- cadre fenêtre -->
<rect width="1080" height="700" fill="#e9edf2"/>
<rect x="4" y="4" width="1072" height="692" fill="#f7f9fb" stroke="#6f8194" stroke-width="2"/>
<!-- barre de titre -->
<rect x="4" y="4" width="1072" height="26" fill="#ffffff"/>
<text x="18" y="22" font-size="14" fill="#333">Cisco Packet Tracer</text>
<!-- barre de menus (zone 1) -->
<rect x="4" y="30" width="1072" height="22" fill="#f2f4f6"/>
<g font-size="12.5" fill="#222">
  <text x="16" y="46">File</text><text x="50" y="46">Edit</text><text x="86" y="46">Options</text>
  <text x="140" y="46">View</text><text x="180" y="46">Tools</text><text x="222" y="46">Extensions</text>
  <text x="296" y="46">Window</text><text x="352" y="46">Help</text>
</g>
<!-- barre d'outils (icônes symbolisées) -->
<rect x="4" y="52" width="1072" height="26" fill="#f7f9fb"/>
<g fill="#54708b">
  <rect x="14" y="58" width="14" height="14" rx="2"/><rect x="36" y="58" width="14" height="14" rx="2"/>
  <rect x="58" y="58" width="14" height="14" rx="2"/><rect x="80" y="58" width="14" height="14" rx="2"/>
  <rect x="102" y="58" width="14" height="14" rx="2"/><rect x="124" y="58" width="14" height="14" rx="2"/>
</g>
<!-- bandeau Logical -->
<rect x="4" y="78" width="1072" height="24" fill="#12335e"/>
<rect x="10" y="81" width="70" height="18" rx="9" fill="#61dafb"/>
<text x="45" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a1b3d">Logical</text>
<rect x="86" y="81" width="76" height="18" rx="9" fill="#274a8a"/>
<text x="124" y="94" text-anchor="middle" font-size="12" fill="#dbe7ff">Physical</text>
<!-- espace logique (zone 2) -->
<rect x="10" y="106" width="1060" height="440" fill="#ffffff" stroke="#9aaabc"/>
<text x="540" y="330" text-anchor="middle" font-size="17" fill="#b8c4d2" font-style="italic">Ton espace de travail : c'est ici que tu poses les appareils et que tu tires les câbles.</text>
<!-- palette (zone 3) -->
<rect x="10" y="552" width="470" height="100" fill="#f2f4f6" stroke="#9aaabc"/>
<!-- rangée 1 : catégories -->
<g>
  <rect x="18" y="560" width="30" height="26" rx="3" fill="#7fd4e8" stroke="#2a6f9e" stroke-width="2"/>
  <rect x="54" y="560" width="30" height="26" rx="3" fill="#cfd9e2"/>
  <rect x="90" y="560" width="30" height="26" rx="3" fill="#cfd9e2"/>
  <polygon points="132,562 141,574 135,574 144,586 128,573 134,573" fill="#e07a1f"/>
  <rect x="162" y="560" width="30" height="26" rx="3" fill="#cfd9e2"/>
  <rect x="198" y="560" width="30" height="26" rx="3" fill="#cfd9e2"/>
</g>
<text x="18" y="600" font-size="10.5" fill="#31475a">Network Devices · End Devices · … · Connections (l'éclair)</text>
<!-- rangée 2 : sous-catégories -->
<g>
  <rect x="18" y="606" width="30" height="24" rx="3" fill="#cfd9e2"/>
  <rect x="54" y="606" width="30" height="24" rx="3" fill="#7fd4e8" stroke="#2a6f9e" stroke-width="2"/>
  <rect x="90" y="606" width="30" height="24" rx="3" fill="#cfd9e2"/>
  <rect x="126" y="606" width="30" height="24" rx="3" fill="#cfd9e2"/>
</g>
<text x="18" y="646" font-size="10.5" fill="#31475a">sous-familles (ex. Switches) puis, à droite, les modèles à glisser</text>
<!-- liste des modèles -->
<rect x="250" y="606" width="222" height="24" fill="#ffffff" stroke="#9aaabc"/>
<g font-size="10" fill="#31475a">
  <rect x="256" y="609" width="26" height="14" rx="2" fill="#7fd4e8"/><text x="258" y="628">2960</text>
  <rect x="292" y="609" width="26" height="14" rx="2" fill="#cfe3ef"/><text x="290" y="628">PT-Switch</text>
</g>
<!-- zone 4 : Realtime / Simulation -->
<rect x="770" y="600" width="140" height="34" rx="6" fill="#e7f3ff" stroke="#4d8bc2" stroke-width="2"/>
<text x="840" y="622" text-anchor="middle" font-size="14" fill="#12335e">🕒 Realtime</text>
<rect x="920" y="600" width="150" height="34" rx="6" fill="#fff0d8" stroke="#c98222" stroke-width="2"/>
<text x="995" y="622" text-anchor="middle" font-size="14" fill="#7a4c10">✉ Simulation</text>

<!-- pastilles numérotées -->
<g font-size="16" font-weight="bold">
  <circle cx="390" cy="41" r="14" fill="#ffd66b" stroke="#8a6d1c" stroke-width="2"/><text x="390" y="47" text-anchor="middle" fill="#4a3a08">1</text>
  <circle cx="1040" cy="130" r="14" fill="#ffd66b" stroke="#8a6d1c" stroke-width="2"/><text x="1040" y="136" text-anchor="middle" fill="#4a3a08">2</text>
  <circle cx="497" cy="568" r="14" fill="#ffd66b" stroke="#8a6d1c" stroke-width="2"/><text x="497" y="574" text-anchor="middle" fill="#4a3a08">3</text>
  <circle cx="745" cy="617" r="14" fill="#ffd66b" stroke="#8a6d1c" stroke-width="2"/><text x="745" y="623" text-anchor="middle" fill="#4a3a08">4</text>
</g>
<!-- légende -->
<rect x="10" y="660" width="1060" height="32" rx="8" fill="#f5f8fc" stroke="#9aaabc"/>
<text x="540" y="681" text-anchor="middle" font-size="13.5" fill="#31475a">① la barre de menus (File pour enregistrer) · ② l'espace logique (ton plan de réseau) · ③ la palette d'équipements (on choisit, puis on GLISSE) · ④ Realtime / Simulation (l'horloge ou l'enveloppe)</text>
</svg>
