<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Donner son adresse à un terminal : la fenêtre IP Configuration de Packet Tracer, et l'analogie de la rue</title>
<desc id="d">À gauche, la fenêtre Desktop puis IP Configuration de PC0, reconstituée d'après Packet Tracer 8.2 : l'interface FastEthernet0, le choix Static coché (et non DHCP), le champ IPv4 Address rempli avec 192.168.10.10 et le champ Subnet Mask rempli automatiquement avec 255.255.255.0. À droite, l'analogie : une rue nommée 192.168.10 dessinée avec cinq maisons numérotées 10, 20, 30, 40 et 50 — les trois premiers nombres sont le nom de la rue, communs à tous ; le dernier nombre est le numéro de maison, unique pour chacun.</desc>
<rect width="1080" height="560" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="558" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">L'adresse IP : le nom de la rue + le numéro de la maison</text>

<!-- fenêtre IP Configuration -->
<rect x="40" y="60" width="480" height="330" rx="8" fill="#f5f7fa" stroke="#60778c" stroke-width="2"/>
<rect x="40" y="60" width="480" height="30" rx="8" fill="#32658f"/>
<text x="58" y="80" font-size="14" fill="#ffffff">PC0 — Desktop → IP Configuration</text>
<g font-size="13.5" fill="#222">
  <text x="60" y="118">Interface</text>
  <rect x="180" y="104" width="300" height="22" fill="#ffffff" stroke="#7c91a4"/><text x="192" y="120">FastEthernet0</text>
  <text x="60" y="158" font-weight="bold">IP Configuration</text>
  <circle cx="200" cy="188" r="8" fill="#ffffff" stroke="#455d72" stroke-width="2"/><text x="216" y="193">DHCP</text>
  <circle cx="320" cy="188" r="8" fill="#ffffff" stroke="#455d72" stroke-width="2"/>
  <circle cx="320" cy="188" r="4.5" fill="#1f6da5"/><text x="336" y="193" font-weight="bold">Static</text>
  <text x="418" y="193" fill="#1e7d4f" font-size="12">← on choisit Static</text>
  <text x="60" y="238">IPv4 Address</text>
  <rect x="200" y="223" width="280" height="26" fill="#ffffff" stroke="#1e7d4f" stroke-width="3"/>
  <text x="212" y="242" font-family="Consolas, monospace" font-size="16" fill="#0a3d1f" font-weight="bold">192.168.10.10</text>
  <text x="60" y="288">Subnet Mask</text>
  <rect x="200" y="273" width="280" height="26" fill="#eef1f4" stroke="#7c91a4"/>
  <text x="212" y="292" font-family="Consolas, monospace" font-size="15" fill="#52697e">255.255.255.0</text>
</g>
<rect x="60" y="315" width="440" height="58" rx="8" fill="#fdf6e3" stroke="#a8823c"/>
<text x="280" y="338" text-anchor="middle" font-size="12.5" fill="#5c4a14" font-weight="bold">La case « Subnet Mask » se remplit toute seule : laisse-la telle quelle.</text>
<text x="280" y="358" text-anchor="middle" font-size="12" fill="#5c4a14">C'est le panneau qui dit « même rue » — tu l'étudieras de près en 4e.</text>

<!-- analogie de la rue -->
<rect x="560" y="60" width="480" height="330" rx="10" fill="#f5f8fc" stroke="#9aaabc"/>
<text x="800" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#31475a">La même adresse, vue comme une rue :</text>
<!-- la rue -->
<rect x="590" y="255" width="420" height="36" fill="#c8cfd6"/>
<line x1="590" y1="273" x2="1010" y2="273" stroke="#ffffff" stroke-width="3" stroke-dasharray="18 14"/>
<rect x="640" y="300" width="330" height="26" rx="13" fill="#12335e"/>
<text x="805" y="318" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Consolas, monospace">rue « 192.168.10 »</text>
<!-- maisons -->
<g>
  <g transform="translate(615,195)">
    <rect x="0" y="20" width="60" height="40" fill="#e8edf1" stroke="#48677f" stroke-width="2"/>
    <polygon points="-6,20 30,-6 66,20" fill="#c0322b"/>
    <text x="30" y="47" text-anchor="middle" font-size="15" font-weight="bold" fill="#12335e">.10</text>
    <text x="30" y="78" text-anchor="middle" font-size="11" fill="#52697e">PC0</text>
  </g>
  <g transform="translate(700,195)">
    <rect x="0" y="20" width="60" height="40" fill="#e8edf1" stroke="#48677f" stroke-width="2"/>
    <polygon points="-6,20 30,-6 66,20" fill="#c0322b"/>
    <text x="30" y="47" text-anchor="middle" font-size="15" font-weight="bold" fill="#12335e">.20</text>
    <text x="30" y="78" text-anchor="middle" font-size="11" fill="#52697e">PC1</text>
  </g>
  <g transform="translate(785,195)">
    <rect x="0" y="20" width="60" height="40" fill="#e8edf1" stroke="#48677f" stroke-width="2"/>
    <polygon points="-6,20 30,-6 66,20" fill="#c0322b"/>
    <text x="30" y="47" text-anchor="middle" font-size="15" font-weight="bold" fill="#12335e">.30</text>
    <text x="30" y="78" text-anchor="middle" font-size="11" fill="#52697e">portable</text>
  </g>
  <g transform="translate(870,195)">
    <rect x="0" y="20" width="60" height="40" fill="#e8edf1" stroke="#48677f" stroke-width="2"/>
    <polygon points="-6,20 30,-6 66,20" fill="#c0322b"/>
    <text x="30" y="47" text-anchor="middle" font-size="15" font-weight="bold" fill="#12335e">.40</text>
    <text x="30" y="78" text-anchor="middle" font-size="11" fill="#52697e">tablette</text>
  </g>
  <g transform="translate(950,195)">
    <rect x="5" y="20" width="55" height="40" fill="#e8edf1" stroke="#48677f" stroke-width="2"/>
    <polygon points="-1,20 32,-6 66,20" fill="#c0322b"/>
    <text x="32" y="47" text-anchor="middle" font-size="15" font-weight="bold" fill="#12335e">.50</text>
    <text x="32" y="78" text-anchor="middle" font-size="11" fill="#52697e">smartphone</text>
  </g>
</g>
<!-- décomposition de l'adresse -->
<g transform="translate(590,110)">
  <rect x="0" y="0" width="250" height="34" rx="6" fill="#12335e"/>
  <text x="125" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#ffffff" font-weight="bold">192 . 168 . 10</text>
  <rect x="258" y="0" width="80" height="34" rx="6" fill="#1e7d4f"/>
  <text x="298" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#ffffff" font-weight="bold">. 10</text>
  <text x="125" y="52" text-anchor="middle" font-size="12" fill="#12335e" font-weight="bold">le nom de la rue — COMMUN à tous</text>
  <text x="298" y="52" text-anchor="middle" font-size="12" fill="#1e7d4f" font-weight="bold">le n° de maison — UNIQUE</text>
</g>

<!-- table d'adressage -->
<rect x="40" y="410" width="1000" height="130" rx="10" fill="#f5f8fc" stroke="#9aaabc"/>
<text x="540" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#31475a">La table d'adressage de la salle (à recopier dans Packet Tracer) :</text>
<g font-size="13.5" font-family="Consolas, monospace">
  <g fill="#12335e" font-weight="bold" font-family="Arial">
    <text x="120" y="470">Appareil</text><text x="330" y="470">Adresse IPv4</text><text x="560" y="470">Liaison</text><text x="800" y="470">Le dernier nombre est-il unique ?</text>
  </g>
  <g fill="#222">
    <text x="120" y="495" font-family="Arial">PC0</text><text x="330" y="495">192.168.10.10</text><text x="560" y="495" font-family="Arial">filaire</text><text x="800" y="495" font-family="Arial">oui — 10</text>
    <text x="120" y="518" font-family="Arial">PC1</text><text x="330" y="518">192.168.10.20</text><text x="560" y="518" font-family="Arial">filaire</text><text x="800" y="518" font-family="Arial">oui — 20</text>
    <text x="470" y="495" font-family="Arial" fill="#52697e" font-size="12"></text>
  </g>
  <g fill="#222">
    <text x="620" y="495" font-family="Arial" font-size="12" fill="#52697e"></text>
  </g>
  <g fill="#222">
    <text x="120" y="518"></text>
  </g>
</g>
<text x="540" y="535" text-anchor="middle" font-size="12.5" fill="#52697e" font-family="Arial">portable : 192.168.10.30 (WiFi) · tablette : 192.168.10.40 (WiFi) · smartphone : 192.168.10.50 (WiFi) — cinq numéros de maison, tous différents.</text>
</svg>
