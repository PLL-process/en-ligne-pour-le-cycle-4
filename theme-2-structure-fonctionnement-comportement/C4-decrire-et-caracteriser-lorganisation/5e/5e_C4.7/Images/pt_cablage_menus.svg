<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Câbler dans Packet Tracer : les deux menus de prises qui s'ouvrent quand on clique, et le code couleur des triangles</title>
<desc id="d">À gauche, le menu qui s'ouvre en cliquant sur un PC avec le câble en main : quatre lignes — RS 232, USB0, USB1 et FastEthernet0 ; c'est FastEthernet0, la prise réseau, qui est entourée. Au centre, le menu du commutateur : Console, puis la longue liste FastEthernet0/1 à FastEthernet0/24 (abrégée), et GigabitEthernet0/1 et 0/2 ; FastEthernet0/1 est entourée. À droite, la légende des triangles de liaison : orange, la prise démarre ; vert, la liaison fonctionne ; rouge, il y a un problème. En bas, l'icône du câble droit Copper Straight-Through, un trait plein noir dans la palette Connections.</desc>
<rect width="1080" height="620" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="618" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#135588">Choisir la bonne PRISE : une à chaque bout du câble</text>

<!-- panneau gauche : menu du PC -->
<text x="200" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#31475a">① Je clique sur PC0…</text>
<g>
  <rect x="90" y="95" width="60" height="42" rx="4" fill="#27384a"/>
  <rect x="95" y="100" width="50" height="30" fill="#9fd8f1"/>
  <rect x="112" y="137" width="14" height="10" fill="#66798a"/>
  <text x="120" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#172b3d">PC0</text>
</g>
<rect x="160" y="105" width="200" height="112" fill="#f5f6f8" stroke="#8a929c"/>
<g font-size="14" fill="#222">
  <rect x="168" y="115" width="16" height="9" rx="2" fill="#3a3f45"/><text x="192" y="124">RS 232</text>
  <rect x="168" y="141" width="16" height="9" rx="2" fill="#3a3f45"/><text x="192" y="150">USB0</text>
  <rect x="168" y="167" width="16" height="9" rx="2" fill="#3a3f45"/><text x="192" y="176">USB1</text>
  <rect x="168" y="192" width="16" height="11" rx="2" fill="#f2c14e" stroke="#8a6d1c"/><text x="192" y="202">FastEthernet0</text>
</g>
<rect x="163" y="186" width="194" height="23" rx="6" fill="none" stroke="#1e7d4f" stroke-width="3"/>
<text x="260" y="238" text-anchor="middle" font-size="13" fill="#1e7d4f" font-weight="bold">→ la prise RÉSEAU du PC : FastEthernet0</text>
<text x="260" y="258" text-anchor="middle" font-size="12" fill="#8f221d">(RS 232 et USB ne sont PAS des prises réseau)</text>

<!-- panneau centre : menu du commutateur -->
<text x="560" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#31475a">② … puis sur Switch0</text>
<g>
  <polygon points="428,110 502,110 516,96 442,96" fill="#7fd4e8"/>
  <polygon points="428,110 502,110 502,128 428,128" fill="#2a6f9e"/>
  <polygon points="502,110 516,96 516,114 502,128" fill="#173c57"/>
  <text x="470" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#172b3d">Switch0</text>
</g>
<rect x="520" y="95" width="215" height="415" fill="#f5f6f8" stroke="#8a929c"/>
<g font-size="13.5" fill="#222">
  <rect x="528" y="104" width="15" height="10" rx="2" fill="#3a3f45"/><text x="551" y="114">Console</text>
  <rect x="528" y="129" width="15" height="11" rx="2" fill="#f2c14e" stroke="#8a6d1c"/><text x="551" y="139">FastEthernet0/1</text>
  <rect x="528" y="154" width="15" height="11" rx="2" fill="#f2c14e" stroke="#8a6d1c"/><text x="551" y="164">FastEthernet0/2</text>
  <rect x="528" y="179" width="15" height="11" rx="2" fill="#f2c14e" stroke="#8a6d1c"/><text x="551" y="189">FastEthernet0/3</text>
  <rect x="528" y="204" width="15" height="11" rx="2" fill="#f2c14e" stroke="#8a6d1c"/><text x="551" y="214">FastEthernet0/4</text>
  <text x="551" y="245" font-size="18" fill="#7a8794">⋮</text>
  <text x="551" y="272" fill="#7a8794">… jusqu'à …</text>
  <rect x="528" y="284" width="15" height="11" rx="2" fill="#f2c14e" stroke="#8a6d1c"/><text x="551" y="294">FastEthernet0/24</text>
  <rect x="528" y="311" width="15" height="11" rx="2" fill="#e07a1f" stroke="#8a4a10"/><text x="551" y="321">GigabitEthernet0/1</text>
  <rect x="528" y="336" width="15" height="11" rx="2" fill="#e07a1f" stroke="#8a4a10"/><text x="551" y="346">GigabitEthernet0/2</text>
</g>
<rect x="524" y="124" width="207" height="21" rx="6" fill="none" stroke="#1e7d4f" stroke-width="3"/>
<text x="627" y="390" text-anchor="middle" font-size="13" fill="#1e7d4f" font-weight="bold">→ une prise LIBRE : FastEthernet0/1</text>
<text x="627" y="410" text-anchor="middle" font-size="12.5" fill="#31475a">24 prises FastEthernet : de quoi brancher</text>
<text x="627" y="427" text-anchor="middle" font-size="12.5" fill="#31475a">toute la salle sur UN SEUL commutateur !</text>

<!-- panneau droit : triangles + câble -->
<text x="905" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#31475a">③ Je lis les triangles</text>
<g>
  <polygon points="830,110 850,110 840,94" fill="#e07a1f"/>
  <text x="862" y="108" font-size="13.5" fill="#222">orange : la prise démarre — patiente quelques secondes</text>
  <polygon points="830,150 850,150 840,134" fill="#1e9d55"/>
  <text x="862" y="148" font-size="13.5" fill="#222">vert : la liaison FONCTIONNE</text>
  <polygon points="830,190 850,190 840,174" fill="#c0322b"/>
  <text x="862" y="188" font-size="13.5" fill="#222">rouge : problème (mauvais câble, prise éteinte…)</text>
</g>
<rect x="800" y="225" width="262" height="120" rx="10" fill="#f5f8fc" stroke="#9aaabc"/>
<text x="931" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Le bon câble, dans Connections ⚡ :</text>
<line x1="830" y1="285" x2="905" y2="270" stroke="#20242e" stroke-width="4"/>
<text x="920" y="282" font-size="13.5" fill="#222">Copper Straight-Through</text>
<text x="920" y="300" font-size="12.5" fill="#52697e">(« câble cuivre droit » : le trait plein)</text>
<text x="931" y="330" text-anchor="middle" font-size="12.5" fill="#8f221d">PC ↔ commutateur = toujours câble DROIT</text>

<!-- schéma résumé en bas -->
<rect x="60" y="450" width="400" height="140" rx="10" fill="#f5f8fc" stroke="#9aaabc"/>
<text x="260" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Résumé du geste (dans l'ordre) :</text>
<g font-size="13" fill="#222">
  <text x="80" y="505">1. Palette Connections ⚡ → clic sur le câble droit</text>
  <text x="80" y="528">2. Clic sur PC0 → choisir FastEthernet0</text>
  <text x="80" y="551">3. Clic sur Switch0 → choisir FastEthernet0/1</text>
  <text x="80" y="574">4. Attendre que les deux triangles passent au VERT</text>
</g>
</svg>
