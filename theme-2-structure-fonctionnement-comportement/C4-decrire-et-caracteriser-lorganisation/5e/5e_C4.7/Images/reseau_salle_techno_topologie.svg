<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Topologie en étoile du réseau de la salle de technologie, telle qu'elle apparaît dans l'espace logique de Cisco Packet Tracer 8.2</title>
<desc id="d">Sept appareils reconstitués fidèlement d'après le logiciel : au centre, le commutateur Switch0 (modèle 2960-24TT). Trois liaisons filaires en traits pleins le relient à PC0 (adresse 192.168.10.10, en haut à gauche), à PC1 (192.168.10.20, en bas à gauche) et au point d'accès AccessPoint0 (en haut à droite). Trois liaisons sans fil en pointillés relient le point d'accès à Laptop0 (192.168.10.30), à la tablette TabletPC0 (192.168.10.40) et au smartphone Smartphone0 (192.168.10.50). Chaque appareil porte son nom et son adresse. La forme générale dessine une étoile : tout passe par le centre.</desc>
<!-- fond : espace logique blanc de Packet Tracer -->
<rect width="1080" height="640" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="638" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#135588">La salle de technologie vue dans Packet Tracer : une ÉTOILE autour du commutateur</text>

<defs>
  <!-- PC : petit écran bleu clair sur tour, façon icône logique PT -->
  <g id="pc">
    <rect x="-29" y="-20" width="58" height="39" rx="4" fill="#27384a"/>
    <rect x="-24" y="-15" width="48" height="28" fill="#9fd8f1"/>
    <rect x="-6" y="19" width="12" height="10" fill="#66798a"/>
    <rect x="-17" y="29" width="34" height="5" fill="#66798a"/>
  </g>
  <!-- portable -->
  <g id="laptop">
    <polygon points="-26,-14 26,-14 30,10 -30,10" fill="#27384a"/>
    <polygon points="-22,-10 22,-10 25,6 -25,6" fill="#9fd8f1"/>
    <rect x="-32" y="10" width="64" height="7" rx="3" fill="#66798a"/>
  </g>
  <!-- commutateur : boîtier plat 3D -->
  <g id="switch">
    <polygon points="-48,-8 34,-8 48,-22 -34,-22" fill="#7fd4e8"/>
    <polygon points="-48,-8 34,-8 34,12 -48,12" fill="#2a6f9e"/>
    <polygon points="34,-8 48,-22 48,-2 34,12" fill="#173c57"/>
    <g fill="#cde9f8">
      <rect x="-42" y="2" width="6" height="5"/><rect x="-32" y="2" width="6" height="5"/>
      <rect x="-22" y="2" width="6" height="5"/><rect x="-12" y="2" width="6" height="5"/>
      <rect x="-2" y="2" width="6" height="5"/><rect x="8" y="2" width="6" height="5"/>
      <rect x="18" y="2" width="6" height="5"/><rect x="28" y="2" width="6" height="5"/>
    </g>
  </g>
  <!-- point d'accès : boîtier + ondes -->
  <g id="ap">
    <rect x="-29" y="-6" width="58" height="24" rx="7" fill="#ecf1f5" stroke="#48677f" stroke-width="2"/>
    <circle cx="-16" cy="6" r="2.5" fill="#48677f"/><circle cx="-6" cy="6" r="2.5" fill="#48677f"/>
    <circle cx="4" cy="6" r="2.5" fill="#48677f"/><circle cx="14" cy="6" r="2.5" fill="#48677f"/>
    <path d="M0 -6 v-10 M-13 -13 q13 -13 26 0 M-20 -20 q20 -20 40 0" fill="none" stroke="#2877b1" stroke-width="3"/>
  </g>
  <!-- tablette -->
  <g id="tablet">
    <rect x="-24" y="-17" width="48" height="34" rx="4" fill="#27384a"/>
    <rect x="-20" y="-13" width="40" height="26" fill="#9fd8f1"/>
  </g>
  <!-- smartphone -->
  <g id="phone">
    <rect x="-11" y="-20" width="22" height="40" rx="4" fill="#27384a"/>
    <rect x="-8" y="-15" width="16" height="28" fill="#9fd8f1"/>
    <circle cx="0" cy="16" r="2" fill="#9fd8f1"/>
  </g>
</defs>

<!-- liaisons filaires (traits pleins) -->
<line x1="540" y1="330" x2="230" y2="150" stroke="#2f6590" stroke-width="4"/>
<line x1="540" y1="330" x2="230" y2="520" stroke="#2f6590" stroke-width="4"/>
<line x1="540" y1="330" x2="850" y2="150" stroke="#2f6590" stroke-width="4"/>
<!-- étiquettes des liaisons filaires -->
<g font-size="13" fill="#31475a">
  <text x="365" y="228" text-anchor="middle" transform="rotate(-30 365 228)">liaison filaire (câble droit)</text>
  <text x="365" y="450" text-anchor="middle" transform="rotate(30 365 450)">liaison filaire (câble droit)</text>
  <text x="700" y="228" text-anchor="middle" transform="rotate(30 700 228)">liaison filaire (câble droit)</text>
</g>
<!-- liaisons sans fil (pointillés) -->
<line x1="850" y1="150" x2="850" y2="500" stroke="#5b7bb8" stroke-width="3" stroke-dasharray="4 7"/>
<line x1="850" y1="150" x2="600" y2="90"  stroke="#5b7bb8" stroke-width="3" stroke-dasharray="4 7"/>
<line x1="850" y1="150" x2="620" y2="540" stroke="#5b7bb8" stroke-width="3" stroke-dasharray="4 7"/>
<g font-size="13" fill="#5b7bb8">
  <text x="880" y="330" text-anchor="start">liaison sans fil (WiFi)</text>
  <text x="700" y="102" text-anchor="middle">WiFi</text>
  <text x="710" y="370" text-anchor="middle">WiFi</text>
</g>

<!-- appareils + étiquettes nom / adresse (police et couleurs de l'espace logique) -->
<use href="#switch" x="540" y="330"/>
<text x="540" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#172b3d">Switch0</text>
<text x="540" y="385" text-anchor="middle" font-size="12" fill="#52697e">commutateur 2960-24TT — le centre de l'étoile</text>

<use href="#pc" x="230" y="150"/>
<text x="230" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#172b3d">PC0</text>
<text x="230" y="217" text-anchor="middle" font-size="12" fill="#52697e">192.168.10.10 · terminal filaire</text>

<use href="#pc" x="230" y="520"/>
<text x="230" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#172b3d">PC1</text>
<text x="230" y="587" text-anchor="middle" font-size="12" fill="#52697e">192.168.10.20 · terminal filaire</text>

<use href="#ap" x="850" y="150"/>
<text x="850" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#172b3d">AccessPoint0</text>
<text x="850" y="213" text-anchor="middle" font-size="12" fill="#52697e">point d'accès · SSID : TECHNO-C4</text>

<use href="#laptop" x="850" y="520"/>
<text x="850" y="560" text-anchor="middle" font-size="14" font-weight="bold" fill="#172b3d">Laptop0</text>
<text x="850" y="577" text-anchor="middle" font-size="12" fill="#52697e">192.168.10.30 · terminal WiFi</text>

<use href="#tablet" x="600" y="80"/>
<text x="600" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#172b3d">TabletPC0</text>
<text x="600" y="137" text-anchor="middle" font-size="12" fill="#52697e">192.168.10.40 · terminal WiFi</text>

<use href="#phone" x="620" y="545"/>
<text x="620" y="592" text-anchor="middle" font-size="14" font-weight="bold" fill="#172b3d">Smartphone0</text>
<text x="620" y="609" text-anchor="middle" font-size="12" fill="#52697e">192.168.10.50 · terminal WiFi</text>

<!-- légende -->
<g>
  <rect x="20" y="600" width="500" height="30" rx="8" fill="#f5f8fc" stroke="#9aaabc"/>
  <line x1="35" y1="615" x2="80" y2="615" stroke="#2f6590" stroke-width="4"/>
  <text x="88" y="620" font-size="13" fill="#31475a">liaison filaire</text>
  <line x1="185" y1="615" x2="230" y2="615" stroke="#5b7bb8" stroke-width="3" stroke-dasharray="4 7"/>
  <text x="238" y="620" font-size="13" fill="#31475a">liaison sans fil</text>
  <text x="352" y="620" font-size="13" fill="#31475a">■ terminaux : 5 — commutateur : 1</text>
</g>
</svg>
