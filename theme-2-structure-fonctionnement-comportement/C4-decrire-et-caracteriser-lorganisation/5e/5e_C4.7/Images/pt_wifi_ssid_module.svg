<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Mettre le WiFi en service : donner un nom au réseau du point d'accès, puis équiper le portable d'une carte WiFi</title>
<desc id="d">Panneau du haut : la fenêtre de configuration du point d'accès (onglet Config, interface Port 1) reconstituée d'après Packet Tracer 8.2 — Port Status sur On, champ SSID rempli avec TECHNO-C4, canal 2.4 GHz numéro 6, authentification Disabled. Panneau du bas : le portable vu de côté dans l'onglet Physical — la pastille du bouton marche/arrêt est repérée, la baie d'extension est montrée d'abord avec le module filaire retiré, puis avec le module WiFi WPC300N inséré ; les trois étapes éteindre, changer le module, rallumer sont numérotées. Une flèche conduit à la fenêtre PC Wireless, onglet Connect, où la ligne TECHNO-C4 apparaît avec son canal 1 et un signal de 47 pour cent, avec le bouton Connect.</desc>
<rect width="1080" height="640" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="638" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Le WiFi en deux temps : nommer le réseau, puis équiper le portable</text>

<!-- ===== panneau haut : SSID du point d'accès ===== -->
<rect x="40" y="55" width="480" height="250" rx="8" fill="#f5f7fa" stroke="#60778c" stroke-width="2"/>
<rect x="40" y="55" width="480" height="30" rx="8" fill="#32658f"/>
<text x="58" y="75" font-size="14" fill="#ffffff">Access Point0 — onglet Config → INTERFACE → Port 1</text>
<g font-size="13.5" fill="#222">
  <text x="60" y="112">Port Status</text>
  <rect x="420" y="100" width="52" height="18" rx="9" fill="#2c9a61"/><text x="437" y="113" fill="#fff">On</text>
  <text x="60" y="147">SSID</text>
  <rect x="180" y="133" width="300" height="24" fill="#ffffff" stroke="#1e7d4f" stroke-width="3"/>
  <text x="192" y="150" font-family="Consolas, monospace" font-size="15" fill="#0a3d1f" font-weight="bold">TECHNO-C4</text>
  <text x="60" y="185">2.4 GHz Channel</text>
  <rect x="180" y="171" width="80" height="22" fill="#ffffff" stroke="#7c91a4"/><text x="192" y="187">6</text>
  <text x="60" y="222">Authentication</text>
  <circle cx="188" cy="217" r="7" fill="#1f6da5" stroke="#455d72"/><text x="203" y="222">Disabled</text>
  <text x="290" y="222" fill="#52697e">(pas de mot de passe pour cet exercice)</text>
</g>
<text x="280" y="262" text-anchor="middle" font-size="13" fill="#1e7d4f" font-weight="bold">Le SSID, c'est le NOM que le point d'accès crie autour de lui.</text>
<text x="280" y="282" text-anchor="middle" font-size="12.5" fill="#31475a">Tous les appareils WiFi de la salle chercheront ce nom : TECHNO-C4.</text>

<!-- ===== panneau haut droite : PC Wireless / Connect ===== -->
<rect x="560" y="55" width="480" height="250" rx="8" fill="#0e1418" stroke="#60778c" stroke-width="2"/>
<rect x="560" y="55" width="480" height="30" rx="8" fill="#5a8f21"/>
<text x="578" y="75" font-size="14" fill="#ffffff">Laptop0 — Desktop → PC Wireless → onglet Connect</text>
<rect x="580" y="100" width="440" height="26" fill="#8fbe3f"/>
<g font-size="13" fill="#1c2a08" font-weight="bold">
  <text x="600" y="118">Wireless Network Name</text><text x="820" y="118">CH</text><text x="880" y="118">Signal</text>
</g>
<rect x="580" y="126" width="440" height="26" fill="#ffffff"/>
<g font-size="13.5">
  <text x="600" y="144" font-family="Consolas, monospace" fill="#0a3d1f" font-weight="bold">TECHNO-C4</text>
  <text x="822" y="144" fill="#222">1</text><text x="884" y="144" fill="#222">47%</text>
</g>
<rect x="577" y="123" width="446" height="31" rx="5" fill="none" stroke="#ffd66b" stroke-width="3"/>
<rect x="800" y="180" width="100" height="30" rx="6" fill="#e8f3d7" stroke="#5a8f21" stroke-width="2"/>
<text x="850" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c4a0a">Connect</text>
<text x="800" y="245" text-anchor="middle" font-size="12.5" fill="#cfe3b8">① je clique sur la ligne TECHNO-C4 ② je clique sur Connect</text>
<text x="800" y="268" text-anchor="middle" font-size="12.5" fill="#cfe3b8">Le signal (47 %) dépend de la distance au point d'accès.</text>
<text x="800" y="291" text-anchor="middle" font-size="12.5" fill="#8fbe3f" font-weight="bold">« Adapter is Active » = le portable est associé !</text>

<!-- ===== panneau bas : le module WiFi du portable ===== -->
<rect x="40" y="330" width="1000" height="280" rx="8" fill="#f5f7fa" stroke="#60778c" stroke-width="2"/>
<rect x="40" y="330" width="1000" height="30" rx="8" fill="#32658f"/>
<text x="58" y="350" font-size="14" fill="#ffffff">Laptop0 — onglet Physical : remplacer le module filaire par le module WiFi WPC300N</text>

<!-- portable vu de côté -->
<g>
  <rect x="80" y="430" width="380" height="52" rx="10" fill="#b9c2ca"/>
  <rect x="70" y="392" width="16" height="90" rx="4" fill="#8d979f"/>
  <!-- bouton power -->
  <circle cx="118" cy="446" r="9" fill="#e8edf1" stroke="#48677f" stroke-width="2"/>
  <circle cx="118" cy="446" r="3" fill="#48677f"/>
  <!-- grille -->
  <g stroke="#8d979f" stroke-width="2">
    <line x1="145" y1="436" x2="145" y2="470"/><line x1="152" y1="436" x2="152" y2="470"/>
    <line x1="159" y1="436" x2="159" y2="470"/><line x1="166" y1="436" x2="166" y2="470"/>
  </g>
  <!-- baie vide -->
  <rect x="205" y="438" width="130" height="30" fill="#2b2f33"/>
  <text x="270" y="500" text-anchor="middle" font-size="12.5" fill="#31475a">la BAIE d'extension (vide quand on retire le module)</text>
</g>
<!-- pastilles étapes -->
<g font-size="14" font-weight="bold">
  <circle cx="118" cy="410" r="13" fill="#ffd66b" stroke="#8a6d1c" stroke-width="2"/><text x="118" y="415" text-anchor="middle" fill="#4a3a08">1</text>
  <text x="150" y="415" font-size="12.5" font-weight="normal" fill="#31475a">j'ÉTEINS (clic sur le bouton rond)</text>
</g>
<!-- module filaire sorti -->
<g>
  <rect x="520" y="395" width="150" height="34" rx="4" fill="#4a5560"/>
  <rect x="640" y="403" width="22" height="18" rx="2" fill="#f2c14e"/>
  <text x="595" y="450" text-anchor="middle" font-size="12.5" fill="#31475a">module FILAIRE (prise RJ45) : je le glisse HORS de la baie</text>
  <circle cx="520" cy="380" r="13" fill="#ffd66b" stroke="#8a6d1c" stroke-width="2"/><text x="520" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a3a08">2</text>
</g>
<!-- module WiFi entrant -->
<g>
  <rect x="520" y="490" width="150" height="34" rx="4" fill="#2f3b46"/>
  <path d="M655 507 h-12 M649 500 q8 7 0 14 M655 494 q14 13 0 26" fill="none" stroke="#61a8dc" stroke-width="2.5"/>
  <text x="608" y="548" text-anchor="middle" font-size="12.5" fill="#31475a">module WiFi « WPC300N » : je le glisse DANS la baie</text>
  <circle cx="520" cy="475" r="13" fill="#ffd66b" stroke="#8a6d1c" stroke-width="2"/><text x="520" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a3a08">3</text>
</g>
<path d="M600 432 q-90 20 -260 14" fill="none" stroke="#8f221d" stroke-width="3" marker-end="url(#fl)"/>
<path d="M598 505 q-160 -10 -258 -40" fill="none" stroke="#1e7d4f" stroke-width="3" marker-end="url(#fl2)"/>
<defs>
  <marker id="fl" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8f221d"/></marker>
  <marker id="fl2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1e7d4f"/></marker>
</defs>
<g font-size="13" fill="#222">
  <text x="740" y="420" font-weight="bold" fill="#8f221d">SORTIR le filaire</text>
  <text x="740" y="512" font-weight="bold" fill="#1e7d4f">ENTRER le WiFi</text>
</g>
<rect x="720" y="540" width="290" height="52" rx="8" fill="#fdf6e3" stroke="#a8823c"/>
<text x="865" y="561" text-anchor="middle" font-size="12.5" fill="#5c4a14" font-weight="bold">④ je RALLUME (même bouton rond)</text>
<text x="865" y="580" text-anchor="middle" font-size="12" fill="#5c4a14">Un vrai portable aussi doit être éteint pour changer une carte !</text>
</svg>
