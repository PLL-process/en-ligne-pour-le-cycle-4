<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Abaque simplifiée : matériaux et procédés de mise en forme pour les pièces de la station</title>
  <desc id="d">Tableau à quatre lignes, une par pièce de la station. Le mât : acier galvanisé à chaud, mis en forme par laminage puis soudure, excellent contre le vent et la corrosion, recyclable. Le coffret électronique : polycarbonate traité anti-UV, moulé par injection, étanche et résistant aux chocs, adapté aux grandes séries. Le support du panneau solaire : aluminium, mis en forme par extrusion, léger, ne rouille pas, recyclable à l'infini. Le carénage de l'anémomètre : ABS, imprimé en 3D, idéal pour une pièce unique et sur mesure, mais à traiter contre les UV. Chaque ligne rappelle le lien entre la forme de la pièce, la taille de série et le procédé.</desc>
  <rect width="940" height="540" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Matériaux &amp; procédés : l'abaque de la station</text>

  <g font-size="11">
    <!-- entêtes -->
    <rect x="30" y="50" width="150" height="40" rx="8" fill="#2E75B6"/>
    <text x="105" y="74" fill="#ffffff" font-weight="bold" text-anchor="middle">Pièce</text>
    <rect x="190" y="50" width="200" height="40" rx="8" fill="#2E75B6"/>
    <text x="290" y="74" fill="#ffffff" font-weight="bold" text-anchor="middle">Matériau retenu</text>
    <rect x="400" y="50" width="210" height="40" rx="8" fill="#2E75B6"/>
    <text x="505" y="74" fill="#ffffff" font-weight="bold" text-anchor="middle">Procédé de mise en forme</text>
    <rect x="620" y="50" width="290" height="40" rx="8" fill="#2E75B6"/>
    <text x="765" y="74" fill="#ffffff" font-weight="bold" text-anchor="middle">Pourquoi (contraintes croisées)</text>

    <!-- mât -->
    <rect x="30" y="100" width="150" height="92" rx="8" fill="#173666" stroke="#ff7b88" stroke-width="2"/>
    <text x="105" y="140" fill="#e4eaf5" text-anchor="middle" font-weight="bold">🗼 Mât</text>
    <text x="105" y="158" fill="#9bbefc" font-size="9.5" text-anchor="middle">(tient tout, prend le vent)</text>
    <rect x="190" y="100" width="200" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="290" y="134" fill="#61dafb" text-anchor="middle" font-weight="bold">Acier galvanisé à chaud</text>
    <text x="290" y="154" fill="#9bbefc" font-size="9.5" text-anchor="middle">zinc protecteur contre le sel</text>
    <rect x="400" y="100" width="210" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="505" y="134" fill="#ffd66b" text-anchor="middle" font-weight="bold">Laminage + soudure</text>
    <text x="505" y="154" fill="#9bbefc" font-size="9.5" text-anchor="middle">tube long et régulier = laminage</text>
    <rect x="620" y="100" width="290" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="634" y="126" fill="#e4eaf5" font-size="10">Vent 230 km/h → solidité de l'acier ;</text>
    <text x="634" y="144" fill="#e4eaf5" font-size="10">embruns → galvanisation ; recyclable ;</text>
    <text x="634" y="162" fill="#e4eaf5" font-size="10">série moyenne → procédé industriel courant.</text>

    <!-- coffret -->
    <rect x="30" y="202" width="150" height="92" rx="8" fill="#173666" stroke="#81fba1" stroke-width="2"/>
    <text x="105" y="242" fill="#e4eaf5" text-anchor="middle" font-weight="bold">🧰 Coffret</text>
    <text x="105" y="260" fill="#9bbefc" font-size="9.5" text-anchor="middle">(protège l'électronique)</text>
    <rect x="190" y="202" width="200" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="290" y="236" fill="#61dafb" text-anchor="middle" font-weight="bold">Polycarbonate anti-UV</text>
    <text x="290" y="256" fill="#9bbefc" font-size="9.5" text-anchor="middle">résistant aux chocs, isolant</text>
    <rect x="400" y="202" width="210" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="505" y="236" fill="#ffd66b" text-anchor="middle" font-weight="bold">Moulage par injection</text>
    <text x="505" y="256" fill="#9bbefc" font-size="9.5" text-anchor="middle">forme complexe + grande série</text>
    <rect x="620" y="202" width="290" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="634" y="228" fill="#e4eaf5" font-size="10">Étanche (pluie) mais moulable avec aérations ;</text>
    <text x="634" y="246" fill="#e4eaf5" font-size="10">UV → traitement obligatoire ; isolant</text>
    <text x="634" y="264" fill="#e4eaf5" font-size="10">électrique ; moule rentable en grande série.</text>

    <!-- support panneau -->
    <rect x="30" y="304" width="150" height="92" rx="8" fill="#173666" stroke="#ffb454" stroke-width="2"/>
    <text x="105" y="344" fill="#e4eaf5" text-anchor="middle" font-weight="bold">📐 Support</text>
    <text x="105" y="362" fill="#9bbefc" font-size="9.5" text-anchor="middle">du panneau solaire</text>
    <rect x="190" y="304" width="200" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="290" y="338" fill="#61dafb" text-anchor="middle" font-weight="bold">Aluminium</text>
    <text x="290" y="358" fill="#9bbefc" font-size="9.5" text-anchor="middle">léger, ne rouille pas</text>
    <rect x="400" y="304" width="210" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="505" y="338" fill="#ffd66b" text-anchor="middle" font-weight="bold">Extrusion</text>
    <text x="505" y="358" fill="#9bbefc" font-size="9.5" text-anchor="middle">profilé = section constante</text>
    <rect x="620" y="304" width="290" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="634" y="330" fill="#e4eaf5" font-size="10">Léger (moins de prise au vent sur le mât) ;</text>
    <text x="634" y="348" fill="#e4eaf5" font-size="10">couche d'oxyde protectrice naturelle ;</text>
    <text x="634" y="366" fill="#e4eaf5" font-size="10">recyclable presque à l'infini.</text>

    <!-- carénage -->
    <rect x="30" y="406" width="150" height="92" rx="8" fill="#173666" stroke="#c68ef2" stroke-width="2"/>
    <text x="105" y="440" fill="#e4eaf5" text-anchor="middle" font-weight="bold">🌀 Carénage</text>
    <text x="105" y="458" fill="#9bbefc" font-size="9.5" text-anchor="middle">de l'anémomètre</text>
    <text x="105" y="474" fill="#9bbefc" font-size="9.5" text-anchor="middle">(pièce unique, sur mesure)</text>
    <rect x="190" y="406" width="200" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="290" y="440" fill="#61dafb" text-anchor="middle" font-weight="bold">ABS (+ vernis anti-UV)</text>
    <text x="290" y="460" fill="#9bbefc" font-size="9.5" text-anchor="middle">plastique d'impression courant</text>
    <rect x="400" y="406" width="210" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="505" y="440" fill="#ffd66b" text-anchor="middle" font-weight="bold">Impression 3D</text>
    <text x="505" y="460" fill="#9bbefc" font-size="9.5" text-anchor="middle">pièce unique = pas de moule</text>
    <rect x="620" y="406" width="290" height="92" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="634" y="432" fill="#e4eaf5" font-size="10">Forme sur mesure, exemplaire unique →</text>
    <text x="634" y="450" fill="#e4eaf5" font-size="10">l'injection serait absurde (moule très cher) ;</text>
    <text x="634" y="468" fill="#e4eaf5" font-size="10">UV → vernis de protection nécessaire.</text>
  </g>
  <text x="470" y="524" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">Règle d'or : la FORME de la pièce + la TAILLE DE SÉRIE guident le procédé — les CONTRAINTES du site guident le matériau.</text>
</svg>
