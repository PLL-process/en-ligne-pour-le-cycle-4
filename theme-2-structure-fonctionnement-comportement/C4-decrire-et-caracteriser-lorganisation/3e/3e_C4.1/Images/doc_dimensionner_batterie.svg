<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 517" width="350" height="517" role="img" aria-labelledby="t_dimensionner_batterie d_dimensionner_batterie" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_dimensionner_batterie">Dimensionner la batterie</title>
<desc id="d_dimensionner_batterie">Les données pour dimensionner la batterie de la station. Le besoin : la station consomme 6 W (watts) en continu ; elle doit tenir 72 h (heures) sans réseau, pendant un cyclone ; sa batterie est sous 12 V (volts). Les deux relations : énergie (Wh, wattheures) = puissance (W) × durée (h) ; capacité (Ah, ampères-heures) = énergie (Wh) ÷ tension (V). Le catalogue propose des batteries de 20, 40 et 100 Ah. Le document ne donne aucun résultat de calcul.</desc>
<rect width="350" height="517" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Dimensionner la batterie</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">W : watts · Wh : wattheures · Ah :</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">ampères-heures · V : volts · h : heures.</text>
<rect x="14.0" y="87.4" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Le besoin</text>
<text x="26.0" y="145.4" font-size="13.5" fill="#9bbefc">Consommation</text>
<text x="26.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">6 W en continu</text>
<text x="175.0" y="145.4" font-size="13.5" fill="#9bbefc">Autonomie exigée</text>
<text x="175.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">72 h</text>
<text x="26.0" y="185.4" font-size="13.5" fill="#9bbefc">Tension</text>
<text x="26.0" y="204.4" font-size="16" fill="#e4eaf5" font-weight="700">12 V</text>
<rect x="14.0" y="231.4" width="322.0" height="132.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="261.4" font-size="16" fill="#61dafb" font-weight="700">Les deux relations</text>
<text x="26.0" y="288.4" font-size="15" fill="#e4eaf5">énergie = puissance × durée</text>
<text x="26.0" y="309.4" font-size="15" fill="#e4eaf5">en Wh = W × h</text>
<text x="26.0" y="330.4" font-size="15" fill="#e4eaf5">capacité = énergie ÷ tension</text>
<text x="26.0" y="351.4" font-size="15" fill="#e4eaf5">en Ah = Wh ÷ V</text>
<rect x="14.0" y="379.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="409.4" font-size="16" fill="#61dafb" font-weight="700">Le catalogue</text>
<text x="26.0" y="436.4" font-size="15" fill="#e4eaf5">Batteries de 20 Ah · 40 Ah · 100 Ah</text>
<text x="14.0" y="478.6" font-size="13.5" fill="#9bbefc">Le document ne donne aucun résultat de calcul :</text>
<text x="14.0" y="496.8" font-size="13.5" fill="#9bbefc">c'est la question.</text>
</svg>
