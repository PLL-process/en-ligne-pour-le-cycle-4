<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Les contraintes du site d'installation de la station, en bord de mer à la Martinique</title>
  <desc id="d">La station d'alerte installée sur la côte, entourée de quatre encadrés de contraintes : le vent cyclonique jusqu'à 230 kilomètres par heure impose résistance mécanique et fixations renforcées ; les embruns salins provoquent la corrosion des métaux non protégés ; le rayonnement UV intense fragilise et décolore les plastiques ordinaires ; la chaleur et l'humidité imposent ventilation et étanchéité du coffret. Un cinquième encadré rappelle la contrainte environnementale : privilégier des matériaux recyclables et durables, limiter l'impact du cycle de vie.</desc>
  <rect width="940" height="500" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Le site impose ses contraintes : bord de mer, Martinique</text>

  <!-- station stylisée au centre -->
  <g>
    <rect x="440" y="150" width="14" height="210" fill="#274a8a"/>
    <rect x="420" y="356" width="54" height="14" rx="4" fill="#274a8a"/>
    <g transform="rotate(-18 447 150)">
      <rect x="400" y="128" width="94" height="34" rx="4" fill="#0d2347" stroke="#ffb454" stroke-width="2.5"/>
      <line x1="424" y1="128" x2="424" y2="162" stroke="#ffb454"/>
      <line x1="448" y1="128" x2="448" y2="162" stroke="#ffb454"/>
      <line x1="472" y1="128" x2="472" y2="162" stroke="#ffb454"/>
    </g>
    <circle cx="447" cy="190" r="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <rect x="424" y="240" width="46" height="60" rx="7" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
    <text x="447" y="266" fill="#81fba1" font-size="8" text-anchor="middle">coffret</text>
    <text x="447" y="278" fill="#81fba1" font-size="8" text-anchor="middle">électro.</text>
    <path d="M320 400 Q400 380 470 400 T620 400 L620 430 L320 430 Z" fill="#0e2f52"/>
    <text x="560" y="420" fill="#61dafb" font-size="11">🌊 mer Caraïbe</text>
  </g>

  <!-- contraintes -->
  <g font-size="11">
    <rect x="30" y="60" width="280" height="78" rx="10" fill="#173666" stroke="#ff7b88" stroke-width="2"/>
    <text x="44" y="82" fill="#ff7b88" font-weight="bold">💨 VENT CYCLONIQUE — jusqu'à 230 km/h</text>
    <text x="44" y="100" fill="#e4eaf5">→ résistance mécanique du mât,</text>
    <text x="44" y="117" fill="#e4eaf5">fixations renforcées, prise au vent limitée</text>
    <line x1="310" y1="100" x2="436" y2="160" stroke="#ff7b88" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="30" y="170" width="280" height="78" rx="10" fill="#173666" stroke="#61dafb" stroke-width="2"/>
    <text x="44" y="192" fill="#61dafb" font-weight="bold">🧂 EMBRUNS SALINS</text>
    <text x="44" y="210" fill="#e4eaf5">→ corrosion rapide des métaux non protégés :</text>
    <text x="44" y="227" fill="#e4eaf5">galvanisation, inox ou aluminium obligatoires</text>
    <line x1="310" y1="209" x2="436" y2="250" stroke="#61dafb" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="630" y="60" width="280" height="78" rx="10" fill="#173666" stroke="#ffd66b" stroke-width="2"/>
    <text x="644" y="82" fill="#ffd66b" font-weight="bold">☀ UV INTENSES (tropiques)</text>
    <text x="644" y="100" fill="#e4eaf5">→ les plastiques ordinaires se fragilisent</text>
    <text x="644" y="117" fill="#e4eaf5">et se décolorent : traitement anti-UV requis</text>
    <line x1="630" y1="100" x2="480" y2="150" stroke="#ffd66b" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="630" y="170" width="280" height="78" rx="10" fill="#173666" stroke="#c68ef2" stroke-width="2"/>
    <text x="644" y="192" fill="#c68ef2" font-weight="bold">🌡 CHALEUR + HUMIDITÉ</text>
    <text x="644" y="210" fill="#e4eaf5">→ coffret étanche (pluie tropicale) MAIS</text>
    <text x="644" y="227" fill="#e4eaf5">ventilé (électronique qui chauffe)</text>
    <line x1="630" y1="209" x2="474" y2="262" stroke="#c68ef2" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="140" y="292" width="270" height="92" rx="10" fill="#173666" stroke="#81fba1" stroke-width="2"/>
    <text x="154" y="314" fill="#81fba1" font-weight="bold">🌱 CONTRAINTE ENVIRONNEMENTALE</text>
    <text x="154" y="332" fill="#e4eaf5">→ matériaux recyclables et durables,</text>
    <text x="154" y="349" fill="#e4eaf5">pièces réparables/remplaçables,</text>
    <text x="154" y="366" fill="#e4eaf5">cycle de vie et transport limités</text>
  </g>

  <rect x="60" y="446" width="820" height="40" rx="10" fill="#173666" stroke="#274a8a"/>
  <text x="470" y="464" fill="#e4eaf5" font-size="12" text-anchor="middle">Justifier un matériau en 3e = croiser <tspan fill="#ff7b88" font-weight="bold">contraintes techniques</tspan> ET <tspan fill="#81fba1" font-weight="bold">contraintes environnementales</tspan> —</text>
  <text x="470" y="480" fill="#9bbefc" font-size="11" text-anchor="middle">et choisir aussi le procédé de mise en forme adapté à la pièce et à la série.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0e2f52"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#274a8a"]{fill:#ffffff}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  [stroke="#ff7b88"]{stroke:#eb0017}
  [stroke="#ffb454"]{stroke:#b06300}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
