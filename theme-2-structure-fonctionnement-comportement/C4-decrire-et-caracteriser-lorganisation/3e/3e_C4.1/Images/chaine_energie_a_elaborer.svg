<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Élaborer la chaîne d'énergie de la station : gabarit de schéma-bloc et palette de blocs</title>
  <desc id="d">En haut, un gabarit de schéma-bloc vide à cinq positions reliées par des flèches : capter et convertir, stocker, réguler et distribuer, convertir pour alimenter, avec une entrée de secours. En bas, la palette des blocs disponibles à placer : panneau solaire, batterie 12 volts, régulateur de charge, convertisseur 12 vers 5 volts, basculement secteur-batterie, et deux intrus : ampoule et haut-parleur. En 3e, c'est l'élève qui élabore la chaîne : choisir les bons blocs ET les placer dans le bon ordre.</desc>
  <rect width="940" height="520" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">À toi d'élaborer : la chaîne d'énergie AUTONOME de la station</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb454"/>
    </marker>
  </defs>

  <!-- gabarit vide -->
  <rect x="24" y="50" width="892" height="220" rx="14" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="76" fill="#ffb454" font-size="14" font-weight="bold">⚡ GABARIT DU SCHÉMA-BLOC (à compléter dans l'activité 1)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="100" width="150" height="80" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="115" y="130" fill="#61dafb" font-weight="bold">1. CAPTER +</text>
    <text x="115" y="146" fill="#61dafb" font-weight="bold">CONVERTIR</text>
    <text x="115" y="166" fill="#9bbefc" font-size="13">?</text>
    <rect x="230" y="100" width="150" height="80" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="305" y="130" fill="#61dafb" font-weight="bold">2. STOCKER</text>
    <text x="305" y="166" fill="#9bbefc" font-size="13">?</text>
    <rect x="420" y="100" width="170" height="80" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="505" y="130" fill="#61dafb" font-weight="bold">3. RÉGULER +</text>
    <text x="505" y="146" fill="#61dafb" font-weight="bold">DISTRIBUER</text>
    <text x="505" y="166" fill="#9bbefc" font-size="13">?</text>
    <rect x="630" y="100" width="160" height="80" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="710" y="130" fill="#61dafb" font-weight="bold">4. CONVERTIR</text>
    <text x="710" y="146" fill="#61dafb" font-weight="bold">POUR ALIMENTER</text>
    <text x="710" y="166" fill="#9bbefc" font-size="13">?</text>
    <rect x="824" y="100" width="86" height="80" rx="10" fill="#0d2347" stroke="#81fba1" stroke-width="2"/>
    <text x="867" y="132" fill="#81fba1" font-size="10" font-weight="bold">STATION</text>
    <text x="867" y="148" fill="#9bbefc" font-size="9">capteurs +</text>
    <text x="867" y="161" fill="#9bbefc" font-size="9">carte + sirène</text>
  </g>
  <line x1="190" y1="140" x2="224" y2="140" stroke="#ffb454" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="380" y1="140" x2="414" y2="140" stroke="#ffb454" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="590" y1="140" x2="624" y2="140" stroke="#ffb454" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="790" y1="140" x2="818" y2="140" stroke="#ffb454" stroke-width="3.5" marker-end="url(#ar)"/>
  <!-- secours -->
  <rect x="230" y="206" width="220" height="46" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="340" y="226" fill="#ffd66b" font-size="11" font-weight="bold" text-anchor="middle">5. SECOURS (avant la coupure)</text>
  <text x="340" y="243" fill="#9bbefc" font-size="11" text-anchor="middle">?</text>
  <line x1="450" y1="229" x2="500" y2="184" stroke="#ffd66b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <!-- palette -->
  <rect x="24" y="290" width="892" height="180" rx="14" fill="none" stroke="#c68ef2" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="316" fill="#c68ef2" font-size="14" font-weight="bold">🧰 PALETTE DES BLOCS DISPONIBLES (attention : deux intrus !)</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="46" y="330" width="120" height="56" rx="9" fill="#173666" stroke="#ffb454" stroke-width="2"/>
    <text x="106" y="353" fill="#e4eaf5">☀ Panneau</text><text x="106" y="369" fill="#e4eaf5">solaire</text>
    <rect x="186" y="330" width="120" height="56" rx="9" fill="#173666" stroke="#ffb454" stroke-width="2"/>
    <text x="246" y="353" fill="#e4eaf5">🔋 Batterie</text><text x="246" y="369" fill="#e4eaf5">12 V — 40 Ah</text>
    <rect x="326" y="330" width="130" height="56" rx="9" fill="#173666" stroke="#ffb454" stroke-width="2"/>
    <text x="391" y="353" fill="#e4eaf5">⚙ Régulateur</text><text x="391" y="369" fill="#e4eaf5">de charge</text>
    <rect x="476" y="330" width="140" height="56" rx="9" fill="#173666" stroke="#ffb454" stroke-width="2"/>
    <text x="546" y="353" fill="#e4eaf5">🔌 Convertisseur</text><text x="546" y="369" fill="#e4eaf5">12 V → 5 V</text>
    <rect x="636" y="330" width="140" height="56" rx="9" fill="#173666" stroke="#ffd66b" stroke-width="2"/>
    <text x="706" y="353" fill="#e4eaf5">🔀 Basculement</text><text x="706" y="369" fill="#e4eaf5">secteur / batterie</text>
    <rect x="46" y="400" width="120" height="56" rx="9" fill="#0d2347" stroke="#ff7b88" stroke-width="2"/>
    <text x="106" y="423" fill="#ff7b88">💡 Ampoule</text><text x="106" y="439" fill="#9bbefc" font-size="9">(intrus ?)</text>
    <rect x="186" y="400" width="120" height="56" rx="9" fill="#0d2347" stroke="#ff7b88" stroke-width="2"/>
    <text x="246" y="423" fill="#ff7b88">🔊 Haut-parleur</text><text x="246" y="439" fill="#9bbefc" font-size="9">(intrus ?)</text>
    <rect x="326" y="400" width="290" height="56" rx="9" fill="#08132c" stroke="#274a8a"/>
    <text x="471" y="423" fill="#9bbefc" font-size="10">En 5e on IDENTIFIAIT · en 4e on COMPLÉTAIT</text>
    <text x="471" y="440" fill="#61dafb" font-size="10" font-weight="bold">en 3e : on ÉLABORE et on JUSTIFIE.</text>
  </g>
  <text x="470" y="498" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">Pendant un cyclone, le réseau EDF coupe : la station doit produire, stocker et gérer SA PROPRE énergie pendant 72 h.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#08132c"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#5b7bb8"]{fill:#ffffff}
  text[fill="#5b7bb8"],tspan[fill="#5b7bb8"]{fill:#5475b5}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  [stroke="#ff7b88"]{stroke:#eb0017}
  text[fill="#ffb454"],tspan[fill="#ffb454"],[fill="#ffb454"] text,[fill="#ffb454"] tspan{fill:#b06300}
  [stroke="#ffb454"]{stroke:#b06300}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
