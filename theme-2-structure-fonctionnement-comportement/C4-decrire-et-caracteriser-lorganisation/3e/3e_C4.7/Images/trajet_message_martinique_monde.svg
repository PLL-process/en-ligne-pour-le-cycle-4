<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le trajet d'un message de Sainte-Luce vers Paris : par où passe l'information ?</title>
  <desc id="d">Schéma stylisé : depuis la Martinique, le message part du collège, traverse le réseau de l'opérateur local, plonge dans un câble sous-marin transatlantique, ressort dans un centre d'échange en Europe, traverse plusieurs routeurs et arrive dans le réseau parisien du destinataire. Chaque étape est numérotée de 1 à 6. Un encart rappelle qu'environ 99 pour cent du trafic intercontinental passe par des câbles sous-marins, pas par les satellites.</desc>
  <defs>
    <marker id="tar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffd66b"/>
    </marker>
  </defs>
  <rect width="940" height="480" fill="#050f24"/>
  <text x="470" y="34" fill="#81aaff" font-size="20" font-weight="bold" text-anchor="middle">De Sainte-Luce à Paris : le voyage réel d'un message</text>

  <!-- océan -->
  <rect x="0" y="250" width="940" height="130" fill="#08132c"/>
  <path d="M0 250 q40 -10 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#173666" fill="none" stroke-width="3"/>
  <text x="470" y="372" fill="#2e5d9f" font-size="13" text-anchor="middle" font-style="italic">Océan Atlantique</text>

  <!-- Martinique -->
  <g>
    <path d="M85 210 q18 -26 44 -18 q20 6 16 28 q-4 20 -26 24 q-30 6 -34 -34 z" fill="#123322" stroke="#81fba1" stroke-width="2.5"/>
    <text x="112" y="176" fill="#81fba1" font-size="13" font-weight="bold" text-anchor="middle">Martinique</text>
    <circle cx="118" cy="228" r="6" fill="#ffd66b"/>
    <text x="118" y="258" fill="#ffd66b" font-size="10.5" text-anchor="middle">Sainte-Luce</text>
  </g>

  <!-- Europe -->
  <g>
    <path d="M800 150 q30 -28 62 -14 q26 12 18 40 q-8 26 -40 26 q-44 0 -40 -52 z" fill="#2b1a3f" stroke="#c68ef2" stroke-width="2.5"/>
    <text x="846" y="122" fill="#c68ef2" font-size="13" font-weight="bold" text-anchor="middle">Europe</text>
    <circle cx="842" cy="176" r="6" fill="#ffd66b"/>
    <text x="848" y="202" fill="#ffd66b" font-size="10.5" text-anchor="middle">Paris</text>
  </g>

  <!-- trajet -->
  <g stroke="#ffd66b" stroke-width="3.5" fill="none">
    <path d="M122 234 C 150 246, 172 252, 196 262" marker-end="url(#tar)"/>
    <path d="M204 266 C 300 320, 430 330, 560 316" marker-end="url(#tar)"/>
    <path d="M568 314 C 660 300, 730 260, 782 216" marker-end="url(#tar)"/>
    <path d="M788 212 C 806 200, 820 190, 834 182" marker-end="url(#tar)"/>
  </g>

  <!-- étapes -->
  <g font-size="11" fill="#e4eaf5">
    <g><circle cx="118" cy="228" r="0"/><rect x="30" y="286" width="180" height="40" rx="8" fill="#173666"/><text x="40" y="302"><tspan fill="#61dafb" font-weight="bold">1-2.</tspan> collège → routeur →</text><text x="40" y="318">réseau de l'opérateur antillais</text></g>
    <g><rect x="330" y="392" width="280" height="40" rx="8" fill="#173666"/><text x="340" y="408"><tspan fill="#61dafb" font-weight="bold">3.</tspan> câble SOUS-MARIN transatlantique</text><text x="340" y="424">(fibre optique posée au fond de l'océan)</text></g>
    <g><rect x="620" y="230" width="190" height="40" rx="8" fill="#173666"/><text x="630" y="246"><tspan fill="#61dafb" font-weight="bold">4.</tspan> point d'atterrissage +</text><text x="630" y="262">centre d'échange Internet</text></g>
    <g><rect x="700" y="60 " width="220" height="40" rx="8" fill="#173666"/><text x="710" y="76"><tspan fill="#61dafb" font-weight="bold">5-6.</tspan> routeurs français → box</text><text x="710" y="92">du destinataire → son téléphone</text></g>
  </g>
  <line x1="470" y1="390" x2="420" y2="330" stroke="#ffd66b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- encart satellite -->
  <rect x="30" y="60" width="300" height="74" rx="10" fill="#0d2347" stroke="#274a8a"/>
  <text x="44" y="82" fill="#ffd66b" font-size="11.5" font-weight="bold">💡 Idée reçue à corriger :</text>
  <text x="44" y="100" fill="#9bbefc" font-size="10.5">l'essentiel du trafic intercontinental (~99 %)</text>
  <text x="44" y="116" fill="#9bbefc" font-size="10.5">passe par des CÂBLES SOUS-MARINS,</text>
  <text x="44" y="130" fill="#9bbefc" font-size="10.5">pas par des satellites.</text>

  <text x="470" y="462" fill="#5b7bb8" font-size="11" text-anchor="middle" font-style="italic">À chaque étape, des ROUTEURS choisissent la suite du chemin — le message change plusieurs fois de réseau.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#08132c"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#123322"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#2b1a3f"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#2e5d9f"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#5b7bb8"]{fill:#ffffff}
  text[fill="#5b7bb8"],tspan[fill="#5b7bb8"]{fill:#5475b5}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
