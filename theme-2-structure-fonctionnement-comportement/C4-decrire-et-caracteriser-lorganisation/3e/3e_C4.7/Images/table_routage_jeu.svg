<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le routeur choisit la route grâce à sa table de routage</title>
  <desc id="d">Un routeur central R2 reçoit un paquet destiné au réseau 203.0.113.x. Sa table de routage indique : pour le réseau 198.51.100.x passer par R1, pour 203.0.113.x passer par R4, pour tout le reste passer par R3. Le paquet est donc envoyé vers R4. Un encart explique que si la liaison vers R4 tombe, la table est mise à jour et le trafic passe par R3 : c'est la résilience du routage.</desc>
  <defs>
    <marker id="qar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffd66b"/>
    </marker>
  </defs>
  <rect width="940" height="460" fill="#050f24"/>
  <text x="470" y="34" fill="#81aaff" font-size="20" font-weight="bold" text-anchor="middle">Comment un routeur choisit-il la route ? Sa table de routage !</text>

  <!-- paquet entrant -->
  <g>
    <rect x="36" y="150" width="150" height="70" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <rect x="36" y="150" width="150" height="24" rx="10" fill="#123c66"/>
    <text x="111" y="167" fill="#61dafb" font-size="11" text-anchor="middle" font-weight="bold">PAQUET entrant</text>
    <text x="111" y="192" fill="#e4eaf5" font-size="11" text-anchor="middle">destination :</text>
    <text x="111" y="209" fill="#ffd66b" font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold">203.0.113.25</text>
  </g>
  <line x1="188" y1="185" x2="268" y2="185" stroke="#ffd66b" stroke-width="3.5" marker-end="url(#qar)"/>

  <!-- routeur R2 -->
  <circle cx="320" cy="185" r="42" fill="#173666" stroke="#81fba1" stroke-width="3"/>
  <text x="320" y="180" fill="#81fba1" font-size="16" text-anchor="middle" font-weight="bold">R2</text>
  <text x="320" y="200" fill="#9bbefc" font-size="9.5" text-anchor="middle">routeur</text>

  <!-- table de routage -->
  <g font-size="11.5" font-family="monospace">
    <rect x="420" y="80" width="360" height="150" rx="12" fill="#0d2347" stroke="#c68ef2" stroke-width="2.5"/>
    <text x="600" y="104" fill="#c68ef2" font-size="13" text-anchor="middle" font-weight="bold" font-family="Verdana">TABLE DE ROUTAGE de R2</text>
    <line x1="436" y1="116" x2="764" y2="116" stroke="#274a8a"/>
    <text x="446" y="138" fill="#9bbefc">réseau 198.51.100.x → passer par R1</text>
    <rect x="438" y="150" width="326" height="24" rx="5" fill="#3a3212"/>
    <text x="446" y="167" fill="#ffd66b" font-weight="bold">réseau 203.0.113.x  → passer par R4 ✔</text>
    <text x="446" y="196" fill="#9bbefc">tout le reste        → passer par R3</text>
    <text x="600" y="220" fill="#5b7bb8" font-size="10" text-anchor="middle" font-family="Verdana" font-style="italic">le routeur lit l'adresse de destination puis applique sa table</text>
  </g>
  <line x1="410" y1="160" x2="366" y2="175" stroke="#c68ef2" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- sorties -->
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <line x1="300" y1="146" x2="230" y2="80" stroke="#274a8a" stroke-width="2.5"/>
    <circle cx="215" cy="68" r="20" fill="#173666" stroke="#274a8a" stroke-width="2"/><text x="215" y="73" fill="#9bbefc">R1</text>
    <line x1="320" y1="227" x2="320" y2="308" stroke="#274a8a" stroke-width="2.5"/>
    <circle cx="320" cy="328" r="20" fill="#173666" stroke="#274a8a" stroke-width="2"/><text x="320" y="333" fill="#9bbefc">R3</text>
    <line x1="356" y1="208 " x2="470" y2="300" stroke="#ffd66b" stroke-width="4" marker-end="url(#qar)"/>
    <circle cx="492" cy="316" r="20" fill="#3a3212" stroke="#ffd66b" stroke-width="3"/><text x="492" y="321" fill="#ffd66b">R4</text>
    <text x="452" y="268" fill="#ffd66b" font-size="10.5" font-family="Verdana">route choisie</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <rect x="540" y="300" width="200" height="34" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="640" y="321" fill="#e4eaf5">→ vers le réseau <tspan font-family="monospace" fill="#ffd66b">203.0.113.x</tspan> 🏠</text>
  </g>

  <!-- résilience -->
  <rect x="40" y="366" width="860" height="76" rx="12" fill="#173666" stroke="#274a8a"/>
  <text x="60" y="392" fill="#e4eaf5" font-size="12.5" font-weight="bold">🌀 Et si la liaison vers R4 est coupée (cyclone, câble arraché) ?</text>
  <text x="60" y="414" fill="#9bbefc" font-size="11.5">Les routeurs se préviennent entre eux et METTENT À JOUR leurs tables : le trafic repasse par R3 puis rejoint sa destination par un autre chemin.</text>
  <text x="60" y="432" fill="#9bbefc" font-size="11.5">C'est pour cela qu'il faut un <tspan fill="#ffd66b" font-weight="bold">protocole de routage commun</tspan> : des règles partagées par tous les routeurs du monde, quelle que soit leur marque.</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#123c66"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#3a3212"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#5b7bb8"]{fill:#ffffff}
  text[fill="#5b7bb8"],tspan[fill="#5b7bb8"]{fill:#5475b5}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
