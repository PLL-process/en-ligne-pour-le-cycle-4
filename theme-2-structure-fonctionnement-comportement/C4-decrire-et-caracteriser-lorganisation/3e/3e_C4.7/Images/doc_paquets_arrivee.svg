<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 328" width="350" height="328" role="img" aria-labelledby="t_paquets_arrivee d_paquets_arrivee" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_paquets_arrivee">Trois paquets, à l'arrivée</title>
<desc id="d_paquets_arrivee">Trois paquets d'un même message arrivent dans cet ordre : le paquet n°3 sur 3, qui porte « SAINTE-LUCE » ; le paquet n°1 sur 3, qui porte « ALERTE » ; le paquet n°2 sur 3, qui porte « ROUGE ». Chaque en-tête porte aussi l'adresse IP de l'expéditeur et celle du destinataire. Le document ne dit pas le message reconstitué.</desc>
<rect width="350" height="328" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Trois paquets, à l'arrivée</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Un message d'alerte, découpé en trois</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">paquets, arrive au téléphone dans cet ordre.</text>
<rect x="14.0" y="87.4" width="322.0" height="136.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Arrivé</text>
<text x="132.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">En-tête</text>
<text x="258.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Contenu</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">1er</text>
<text x="132.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">n°3 / 3</text>
<text x="258.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">« SAINTE-LUCE »</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">2e</text>
<text x="132.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">n°1 / 3</text>
<text x="258.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">« ALERTE »</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">3e</text>
<text x="132.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">n°2 / 3</text>
<text x="258.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">« ROUGE »</text>
<text x="14.0" y="253.6" font-size="13.5" fill="#9bbefc">Chaque en-tête porte aussi l'adresse IP de</text>
<text x="14.0" y="271.8" font-size="13.5" fill="#9bbefc">l'expéditeur et celle du destinataire · Le</text>
<text x="14.0" y="290.0" font-size="13.5" fill="#9bbefc">document ne dit pas le message reconstitué :</text>
<text x="14.0" y="308.3" font-size="13.5" fill="#9bbefc">c'est la question.</text>
</svg>
