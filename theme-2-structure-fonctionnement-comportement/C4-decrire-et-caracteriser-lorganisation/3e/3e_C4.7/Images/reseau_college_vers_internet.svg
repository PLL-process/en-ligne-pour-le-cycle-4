<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Du réseau local du collège au réseau Internet</title>
  <desc id="d">À gauche, le réseau local du collège de Sainte-Luce : ordinateurs et station d'alerte reliés à un commutateur, lui-même relié au routeur. Le routeur est la porte de sortie vers Internet : il relie le réseau local aux autres réseaux par la fibre. À droite, Internet est représenté comme un maillage de routeurs interconnectés reliant d'autres réseaux : maison, mairie, opérateur mobile.</desc>
  <defs>
    <marker id="rar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/>
    </marker>
  </defs>
  <rect width="940" height="470" fill="#050f24"/>
  <text x="470" y="34" fill="#81aaff" font-size="21" font-weight="bold" text-anchor="middle">Du réseau local du collège… au réseau des réseaux</text>

  <!-- Réseau local -->
  <rect x="28" y="64" width="380" height="330" rx="16" fill="none" stroke="#61dafb" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="218" y="90" fill="#61dafb" font-size="14" font-weight="bold" text-anchor="middle">RÉSEAU LOCAL du collège (LAN)</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="52" y="112" width="92" height="58" rx="9" fill="#0d2347" stroke="#274a8a" stroke-width="2"/>
    <text x="98" y="136" fill="#e4eaf5">💻 PC salle</text><text x="98" y="152" fill="#e4eaf5">techno</text>
    <rect x="168" y="112" width="92" height="58" rx="9" fill="#0d2347" stroke="#274a8a" stroke-width="2"/>
    <text x="214" y="136" fill="#e4eaf5">💻 PC CDI</text><text x="214" y="152" fill="#9bbefc">terminaux</text>
    <rect x="284" y="112" width="100" height="58" rx="9" fill="#0d2347" stroke="#ffb454" stroke-width="2"/>
    <text x="334" y="132" fill="#ffb454">🌀 Station</text><text x="334" y="148" fill="#ffb454">d'alerte</text><text x="334" y="163" fill="#9bbefc" font-size="10">(objet connecté)</text>
  </g>

  <!-- switch -->
  <rect x="128" y="216" width="180" height="52" rx="10" fill="#173666" stroke="#c68ef2" stroke-width="2.5"/>
  <text x="218" y="238" fill="#c68ef2" font-size="12.5" font-weight="bold" text-anchor="middle">COMMUTATEUR (switch)</text>
  <text x="218" y="256" fill="#9bbefc" font-size="10.5" text-anchor="middle">relie les équipements ENTRE EUX</text>
  <line x1="98" y1="170" x2="180" y2="214" stroke="#274a8a" stroke-width="2.5"/>
  <line x1="214" y1="170" x2="216" y2="214" stroke="#274a8a" stroke-width="2.5"/>
  <line x1="334" y1="170" x2="256" y2="214" stroke="#274a8a" stroke-width="2.5"/>

  <!-- routeur -->
  <rect x="128" y="304" width="180" height="56" rx="10" fill="#173666" stroke="#81fba1" stroke-width="2.5"/>
  <text x="218" y="326" fill="#81fba1" font-size="12.5" font-weight="bold" text-anchor="middle">ROUTEUR du collège</text>
  <text x="218" y="344" fill="#9bbefc" font-size="10.5" text-anchor="middle">porte de sortie vers les AUTRES réseaux</text>
  <line x1="218" y1="268" x2="218" y2="302" stroke="#274a8a" stroke-width="2.5"/>

  <!-- fibre -->
  <line x1="308" y1="332" x2="472" y2="332" stroke="#ffd66b" stroke-width="4" marker-end="url(#rar)"/>
  <text x="390" y="318" fill="#ffd66b" font-size="11" text-anchor="middle">fibre optique</text>

  <!-- Internet -->
  <rect x="478" y="64" width="434" height="330" rx="16" fill="none" stroke="#c68ef2" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="695" y="90" fill="#c68ef2" font-size="14" font-weight="bold" text-anchor="middle">INTERNET = des milliers de réseaux reliés par des routeurs</text>

  <!-- maillage de routeurs -->
  <g>
    <g stroke="#274a8a" stroke-width="2">
      <line x1="540" y1="332" x2="620" y2="250"/><line x1="620" y1="250" x2="730" y2="300"/>
      <line x1="620" y1="250" x2="700" y2="160"/><line x1="700" y1="160" x2="820" y2="220"/>
      <line x1="730" y1="300" x2="820" y2="220"/><line x1="540" y1="332" x2="730" y2="300"/>
      <line x1="700" y1="160" x2="590" y2="130"/><line x1="820" y1="220" x2="870" y2="330"/>
    </g>
    <g fill="#173666" stroke="#81fba1" stroke-width="2">
      <circle cx="540" cy="332" r="17"/><circle cx="620" cy="250" r="17"/><circle cx="730" cy="300" r="17"/>
      <circle cx="700" cy="160" r="17"/><circle cx="820" cy="220" r="17"/><circle cx="590" cy="130" r="17"/>
      <circle cx="870" cy="330" r="17"/>
    </g>
    <g fill="#81fba1" font-size="12" text-anchor="middle" font-weight="bold">
      <text x="540" y="337">R1</text><text x="620" y="255">R2</text><text x="730" y="305">R3</text>
      <text x="700" y="165">R4</text><text x="820" y="225">R5</text><text x="590" y="135">R6</text><text x="870" y="335">R7</text>
    </g>
  </g>

  <!-- réseaux desservis -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="524" y="76" width="120 " height="34" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="584" y="97" fill="#e4eaf5">🏠 maison (box)</text>
    <line x1="586" y1="112" x2="590" y2="128" stroke="#274a8a" stroke-width="2"/>
    <rect x="760" y="120" width="130" height="34" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="825" y="141" fill="#e4eaf5">🏛 mairie de Sainte-Luce</text>
    <line x1="800" y1="154" x2="812" y2="208" stroke="#274a8a" stroke-width="2"/>
    <rect x="796" y="356" width="112" height="34" rx="8" fill="#0d2347" stroke="#274a8a"/>
    <text x="852" y="377" fill="#e4eaf5">📱 réseau mobile</text>
  </g>

  <text x="470" y="428" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">Commutateur : relie les équipements D'UN réseau · Routeur : relie les réseaux ENTRE EUX — Internet est un réseau DE réseaux</text>
  <text x="470" y="452" fill="#5b7bb8" font-size="10.5" text-anchor="middle">Chaque équipement possède une adresse IP unique sur son réseau (ex. station : 192.168.10.40)</text>
</svg>
