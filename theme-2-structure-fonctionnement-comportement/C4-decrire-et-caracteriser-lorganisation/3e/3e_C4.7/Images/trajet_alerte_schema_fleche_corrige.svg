<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 840" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Corrigé : le trajet de l'alerte de Sainte-Luce à Paris, en schéma fléché</title>
<desc id="d">Schéma fléché à lire de haut en bas, sept étapes reliées par des flèches. Un : la station d'alerte de Sainte-Luce envoie l'alerte. Deux : le routeur du réseau local, au collège. Trois : le réseau de l'opérateur antillais. Quatre : le câble sous-marin, une fibre optique au fond de l'Atlantique. Cinq : le centre d'échange Internet, à l'arrivée du câble en Europe. Six : la box de la tante, après les routeurs français. Sept : son téléphone, où la notification s'affiche. À droite, le lieu de chaque étape : Martinique, Océan, Europe, Paris. En bas : à chaque étape, des routeurs choisissent la suite du chemin ; l'essentiel du trafic entre continents passe par les câbles sous-marins, pas par les satellites.</desc>
<rect width="560" height="840" fill="#050f24"/>
<defs><marker id="fm" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#c9d6f2"/></marker></defs>
<text x="280" y="34" text-anchor="middle" fill="#81aaff" font-size="21" font-weight="700">Le trajet de l'alerte : Sainte-Luce → Paris</text>
<rect x="40" y="60" width="380" height="64" rx="10" fill="#0d1c3a" stroke="#81fba1" stroke-width="3"/>
<text x="56" y="87" fill="#e4eaf5" font-size="18" font-weight="700">① La station d'alerte</text>
<text x="56" y="110" fill="#c9d6f2" font-size="15.5">Sainte-Luce : elle envoie l'alerte</text>
<text x="438" y="98" fill="#81fba1" font-size="16" font-weight="700">Martinique</text>
<line x1="230" y1="124" x2="230" y2="158" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fm)"/>
<rect x="40" y="160" width="380" height="64" rx="10" fill="#0d1c3a" stroke="#81fba1" stroke-width="3"/>
<text x="56" y="187" fill="#e4eaf5" font-size="18" font-weight="700">② Le routeur</text>
<text x="56" y="210" fill="#c9d6f2" font-size="15.5">du réseau local (le collège)</text>
<line x1="230" y1="224" x2="230" y2="258" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fm)"/>
<rect x="40" y="260" width="380" height="64" rx="10" fill="#0d1c3a" stroke="#81aaff" stroke-width="3"/>
<text x="56" y="287" fill="#e4eaf5" font-size="18" font-weight="700">③ Le réseau de l'opérateur</text>
<text x="56" y="310" fill="#c9d6f2" font-size="15.5">antillais</text>
<line x1="230" y1="324" x2="230" y2="358" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fm)"/>
<rect x="40" y="360" width="380" height="64" rx="10" fill="#0d1c3a" stroke="#61dafb" stroke-width="3"/>
<text x="56" y="387" fill="#e4eaf5" font-size="18" font-weight="700">④ Le câble sous-marin</text>
<text x="56" y="410" fill="#c9d6f2" font-size="15.5">fibre optique, au fond de l'Atlantique</text>
<text x="438" y="398" fill="#61dafb" font-size="16" font-weight="700">Océan</text>
<line x1="230" y1="424" x2="230" y2="458" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fm)"/>
<rect x="40" y="460" width="380" height="64" rx="10" fill="#0d1c3a" stroke="#ffd66b" stroke-width="3"/>
<text x="56" y="487" fill="#e4eaf5" font-size="18" font-weight="700">⑤ Le centre d'échange Internet</text>
<text x="56" y="510" fill="#c9d6f2" font-size="15.5">à l'arrivée du câble, en Europe</text>
<text x="438" y="498" fill="#ffd66b" font-size="16" font-weight="700">Europe</text>
<line x1="230" y1="524" x2="230" y2="558" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fm)"/>
<rect x="40" y="560" width="380" height="64" rx="10" fill="#0d1c3a" stroke="#c68ef2" stroke-width="3"/>
<text x="56" y="587" fill="#e4eaf5" font-size="18" font-weight="700">⑥ La box de la tante</text>
<text x="56" y="610" fill="#c9d6f2" font-size="15.5">après les routeurs français</text>
<text x="438" y="598" fill="#c68ef2" font-size="16" font-weight="700">Paris</text>
<line x1="230" y1="624" x2="230" y2="658" stroke="#c9d6f2" stroke-width="3" marker-end="url(#fm)"/>
<rect x="40" y="660" width="380" height="64" rx="10" fill="#0d1c3a" stroke="#c68ef2" stroke-width="3"/>
<text x="56" y="687" fill="#e4eaf5" font-size="18" font-weight="700">⑦ Son téléphone</text>
<text x="56" y="710" fill="#c9d6f2" font-size="15.5">la notification s'affiche</text>
<text x="280" y="766" text-anchor="middle" fill="#9aa5b8" font-size="15">À chaque étape, des routeurs choisissent la suite du chemin.</text>
<text x="280" y="790" text-anchor="middle" fill="#ffd66b" font-size="15">Entre continents : les câbles sous-marins (~99 %), pas les satellites.</text>
</svg>