<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 310" width="350" height="310" role="img" aria-labelledby="t_table_routage_r2 d_table_routage_r2" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_table_routage_r2">La table de routage de R2</title>
<desc id="d_table_routage_r2">La table de routage du routeur R2, en trois règles : réseau 198.51.100.x : envoyer vers R1 ; réseau 203.0.113.x : envoyer vers R4 ; tout le reste : envoyer vers R3. Le document n'aiguille aucun paquet.</desc>
<rect width="350" height="310" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">La table de routage de R2</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Pour chaque paquet, le routeur R2</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">lit l'adresse de destination, puis</text>
<text x="14.0" y="89.6" font-size="13.5" fill="#9bbefc">cherche la règle qui lui correspond.</text>
<rect x="14.0" y="105.6" width="322.0" height="136.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="127.6" font-size="13.5" fill="#61dafb" font-weight="700">Destination</text>
<text x="280.0" y="127.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Envoyer vers</text>
<line x1="14" y1="139.6" x2="336" y2="139.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="161.6" font-size="15" fill="#e4eaf5" font-weight="700">réseau 198.51.100.x</text>
<text x="280.0" y="161.6" font-size="15" fill="#e4eaf5" text-anchor="middle">R1</text>
<line x1="14" y1="173.6" x2="336" y2="173.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="195.6" font-size="15" fill="#e4eaf5" font-weight="700">réseau 203.0.113.x</text>
<text x="280.0" y="195.6" font-size="15" fill="#e4eaf5" text-anchor="middle">R4</text>
<line x1="14" y1="207.6" x2="336" y2="207.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="229.6" font-size="15" fill="#e4eaf5" font-weight="700">tout le reste</text>
<text x="280.0" y="229.6" font-size="15" fill="#e4eaf5" text-anchor="middle">R3</text>
<text x="14.0" y="271.8" font-size="13.5" fill="#9bbefc">x : n'importe quel nombre · Le document n'aiguille</text>
<text x="14.0" y="290.0" font-size="13.5" fill="#9bbefc">aucun paquet : c'est la question.</text>
</svg>
