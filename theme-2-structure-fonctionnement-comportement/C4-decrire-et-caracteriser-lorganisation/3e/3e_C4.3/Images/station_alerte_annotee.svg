<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Station d'alerte cyclonique du collège — schéma annoté</title>
  <desc id="d">Schéma d'une station météo autonome sur mât : girouette et anémomètre en haut, panneau solaire, pluviomètre, boîtier électronique contenant baromètre, microcontrôleur et batterie, antenne de transmission radio, sirène et gyrophare d'alerte.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/>
    </marker>
  </defs>
  <rect width="700" height="540" fill="#050f24"/>
  <text x="350" y="34" fill="#81aaff" font-size="21" font-weight="bold" text-anchor="middle">La station d'alerte cyclonique du collège</text>

  <!-- sol -->
  <rect x="40" y="470" width="620" height="10" rx="5" fill="#173666"/>
  <!-- mât -->
  <rect x="330" y="120" width="14" height="350" fill="#274a8a"/>
  <rect x="310" y="455" width="54" height="18" rx="4" fill="#274a8a"/>

  <!-- anémomètre -->
  <line x1="337" y1="120" x2="337" y2="88" stroke="#274a8a" stroke-width="6"/>
  <circle cx="337" cy="84" r="7" fill="#9bbefc"/>
  <ellipse cx="307" cy="84" rx="14" ry="8" fill="#61dafb"/>
  <ellipse cx="367" cy="84" rx="14" ry="8" fill="#61dafb"/>
  <circle cx="337" cy="60" r="9" fill="#61dafb"/>
  <!-- girouette -->
  <line x1="337" y1="60" x2="400" y2="46" stroke="#9bbefc" stroke-width="4"/>
  <path d="M400 38 L418 46 L400 54 z" fill="#9bbefc"/>

  <!-- panneau solaire -->
  <g transform="rotate(-18 240 190)">
    <rect x="190" y="168" width="100" height="52" rx="4" fill="#0d2347" stroke="#ffb454" stroke-width="3"/>
    <line x1="215" y1="168" x2="215" y2="220" stroke="#ffb454"/>
    <line x1="240" y1="168" x2="240" y2="220" stroke="#ffb454"/>
    <line x1="265" y1="168" x2="265" y2="220" stroke="#ffb454"/>
    <line x1="190" y1="194" x2="290" y2="194" stroke="#ffb454"/>
  </g>
  <line x1="285" y1="205" x2="332" y2="220" stroke="#274a8a" stroke-width="5"/>

  <!-- pluviomètre -->
  <path d="M420 200 L452 200 L444 248 L428 248 z" fill="#0d2347" stroke="#61dafb" stroke-width="3"/>
  <line x1="436" y1="248" x2="436" y2="262" stroke="#274a8a" stroke-width="4"/>
  <line x1="344" y1="258" x2="436" y2="258" stroke="#274a8a" stroke-width="5"/>
  <path d="M428 178 q4 10 8 0 q-4 -12 -8 0" fill="#61dafb"/>

  <!-- boîtier électronique -->
  <rect x="290" y="300" width="180" height="120" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="3"/>
  <text x="380" y="322" fill="#e4eaf5" font-size="13" font-weight="bold" text-anchor="middle">Boîtier étanche</text>
  <rect x="304" y="334" width="70" height="30" rx="5" fill="#173666" stroke="#c68ef2" stroke-width="2"/>
  <text x="339" y="353" fill="#c68ef2" font-size="10" text-anchor="middle">Baromètre</text>
  <rect x="386" y="334" width="70" height="30" rx="5" fill="#173666" stroke="#c68ef2" stroke-width="2"/>
  <text x="421" y="349" fill="#c68ef2" font-size="9.5" text-anchor="middle">Micro-</text>
  <text x="421" y="360" fill="#c68ef2" font-size="9.5" text-anchor="middle">contrôleur</text>
  <rect x="304" y="374" width="152" height="30" rx="5" fill="#173666" stroke="#81fba1" stroke-width="2"/>
  <text x="380" y="393" fill="#81fba1" font-size="11" text-anchor="middle">Batterie 12 V (autonomie)</text>

  <!-- antenne -->
  <line x1="470" y1="300" x2="510" y2="240" stroke="#274a8a" stroke-width="5"/>
  <line x1="510" y1="240" x2="510" y2="180" stroke="#9bbefc" stroke-width="5"/>
  <circle cx="510" cy="174" r="6" fill="#ffd66b"/>
  <path d="M524 168 a18 18 0 0 1 0 14" stroke="#ffd66b" fill="none" stroke-width="3"/>
  <path d="M534 160 a30 30 0 0 1 0 30" stroke="#ffd66b" fill="none" stroke-width="3"/>

  <!-- sirène / gyrophare -->
  <rect x="150" y="404" width="90" height="66" rx="8" fill="#0d2347" stroke="#ff7b88" stroke-width="3"/>
  <path d="M175 428 h20 l12 -12 v34 l-12 -12 h-20 z" fill="#ff7b88"/>
  <path d="M214 424 a14 14 0 0 1 0 22" stroke="#ff7b88" fill="none" stroke-width="3"/>
  <text x="195" y="462" fill="#ff7b88" font-size="10.5" font-weight="bold" text-anchor="middle">Sirène</text>

  <!-- légendes numérotées -->
  <g font-size="12.5" fill="#e4eaf5">
    <circle cx="86" cy="72" r="12" fill="#173666" stroke="#61dafb" stroke-width="2"/><text x="86" y="77" text-anchor="middle" fill="#61dafb" font-weight="bold">1</text>
    <text x="104" y="70">Anémomètre + girouette</text>
    <text x="104" y="86" fill="#9bbefc" font-size="10.5">vitesse et direction du vent</text>
    <line x1="230" y1="74" x2="292" y2="80" stroke="#61dafb" stroke-width="1.6" marker-end="url(#ar)"/>

    <circle cx="86" cy="160" r="12" fill="#173666" stroke="#ffb454" stroke-width="2"/><text x="86" y="165" text-anchor="middle" fill="#ffb454" font-weight="bold">2</text>
    <text x="104" y="158">Panneau solaire</text>
    <text x="104" y="174" fill="#9bbefc" font-size="10.5">énergie autonome</text>
    <line x1="176" y1="168" x2="200" y2="176" stroke="#61dafb" stroke-width="1.6" marker-end="url(#ar)"/>

    <circle cx="560" cy="98" r="12" fill="#173666" stroke="#61dafb" stroke-width="2"/><text x="560" y="103" text-anchor="middle" fill="#61dafb" font-weight="bold">3</text>
    <text x="578" y="96">Pluviomètre</text>
    <text x="578" y="112" fill="#9bbefc" font-size="10.5">hauteur de pluie (mm)</text>
    <line x1="560" y1="112" x2="452" y2="196" stroke="#61dafb" stroke-width="1.6" marker-end="url(#ar)"/>

    <circle cx="580" cy="300" r="12" fill="#173666" stroke="#ffd66b" stroke-width="2"/><text x="580" y="305" text-anchor="middle" fill="#ffd66b" font-weight="bold">4</text>
    <text x="598" y="298">Antenne</text>
    <text x="560" y="318" fill="#9bbefc" font-size="10.5">transmission radio</text>
    <line x1="568" y1="290" x2="524" y2="252" stroke="#61dafb" stroke-width="1.6" marker-end="url(#ar)"/>

    <circle cx="96" cy="330" r="12" fill="#173666" stroke="#c68ef2" stroke-width="2"/><text x="96" y="335" text-anchor="middle" fill="#c68ef2" font-weight="bold">5</text>
    <text x="114" y="328">Boîtier : baromètre,</text>
    <text x="114" y="344">microcontrôleur, batterie</text>
    <line x1="230" y1="336" x2="286" y2="344" stroke="#61dafb" stroke-width="1.6" marker-end="url(#ar)"/>

    <circle cx="96" cy="500" r="12" fill="#173666" stroke="#ff7b88" stroke-width="2"/><text x="96" y="505" text-anchor="middle" fill="#ff7b88" font-weight="bold">6</text>
    <text x="114" y="498">Sirène + gyrophare :</text>
    <text x="114" y="514">alerte locale immédiate</text>
    <line x1="150" y1="470" x2="170" y2="466" stroke="#61dafb" stroke-width="1.6" marker-end="url(#ar)" opacity="0"/>
  </g>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#274a8a"]{fill:#ffffff}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  [stroke="#9bbefc"]{stroke:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  [stroke="#ff7b88"]{stroke:#eb0017}
  text[fill="#ffb454"],tspan[fill="#ffb454"],[fill="#ffb454"] text,[fill="#ffb454"] tspan{fill:#b06300}
  [stroke="#ffb454"]{stroke:#b06300}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
