<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Les types de données de la station et leur codage</title>
  <desc id="d">Tableau illustré : une même station produit des données de types différents. Nombre entier pour le vent, nombre décimal pour la pression, texte pour le nom de la commune, booléen vrai ou faux pour l'alerte, date et heure pour l'horodatage. En bas, le niveau de vigilance est codé sur 3 bits en binaire.</desc>
  <rect width="940" height="470" fill="#050f24"/>
  <text x="470" y="36" fill="#81aaff" font-size="21" font-weight="bold" text-anchor="middle">Une station, des données de types différents</text>

  <!-- entêtes -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="40" y="60" width="200" height="38" rx="9" fill="#173666"/><text x="140" y="84" fill="#61dafb">Information</text>
    <rect x="252" y="60" width="180" height="38" rx="9" fill="#173666"/><text x="342" y="84" fill="#61dafb">Type de donnée</text>
    <rect x="444" y="60" width="220" height="38" rx="9" fill="#173666"/><text x="554" y="84" fill="#61dafb">Exemple de valeur</text>
    <rect x="676" y="60" width="224" height="38" rx="9" fill="#173666"/><text x="788" y="84" fill="#61dafb">Descripteur (nom)</text>
  </g>

  <!-- lignes -->
  <g font-size="12.5">
    <g>
      <rect x="40" y="106" width="200" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="52" y="133" fill="#e4eaf5">💨 vitesse du vent</text>
      <rect x="252" y="106" width="180" height="44" rx="9" fill="#0d2347" stroke="#61dafb"/><text x="342" y="133" fill="#61dafb" text-anchor="middle" font-weight="bold">nombre entier</text>
      <rect x="444" y="106" width="220" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="554" y="133" fill="#ffd66b" text-anchor="middle" font-family="monospace">132</text>
      <rect x="676" y="106" width="224" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="788" y="133" fill="#9bbefc" text-anchor="middle" font-family="monospace">vent_kmh</text>
    </g>
    <g>
      <rect x="40" y="158" width="200" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="52" y="185" fill="#e4eaf5">📉 pression</text>
      <rect x="252" y="158" width="180" height="44" rx="9" fill="#0d2347" stroke="#61dafb"/><text x="342" y="185" fill="#61dafb" text-anchor="middle" font-weight="bold">nombre décimal</text>
      <rect x="444" y="158" width="220" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="554" y="185" fill="#ffd66b" text-anchor="middle" font-family="monospace">987.4</text>
      <rect x="676" y="158" width="224" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="788" y="185" fill="#9bbefc" text-anchor="middle" font-family="monospace">pression_hpa</text>
    </g>
    <g>
      <rect x="40" y="210" width="200" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="52" y="237" fill="#e4eaf5">📍 commune</text>
      <rect x="252" y="210" width="180" height="44" rx="9" fill="#0d2347" stroke="#c68ef2"/><text x="342" y="237" fill="#c68ef2" text-anchor="middle" font-weight="bold">texte (chaîne)</text>
      <rect x="444" y="210" width="220" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="554" y="237" fill="#ffd66b" text-anchor="middle" font-family="monospace">"Sainte-Luce"</text>
      <rect x="676" y="210" width="224" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="788" y="237" fill="#9bbefc" text-anchor="middle" font-family="monospace">commune</text>
    </g>
    <g>
      <rect x="40" y="262" width="200" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="52" y="289" fill="#e4eaf5">🚨 alerte en cours ?</text>
      <rect x="252" y="262" width="180" height="44" rx="9" fill="#0d2347" stroke="#81fba1"/><text x="342" y="289" fill="#81fba1" text-anchor="middle" font-weight="bold">booléen</text>
      <rect x="444" y="262" width="220" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="554" y="289" fill="#ffd66b" text-anchor="middle" font-family="monospace">vrai / faux</text>
      <rect x="676" y="262" width="224" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="788" y="289" fill="#9bbefc" text-anchor="middle" font-family="monospace">alerte_active</text>
    </g>
    <g>
      <rect x="40" y="314" width="200" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="52" y="341" fill="#e4eaf5">🕒 horodatage</text>
      <rect x="252" y="314" width="180" height="44" rx="9" fill="#0d2347" stroke="#ffd66b"/><text x="342" y="341" fill="#ffd66b" text-anchor="middle" font-weight="bold">date + heure</text>
      <rect x="444" y="314" width="220" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="554" y="341" fill="#ffd66b" text-anchor="middle" font-family="monospace" font-size="11">2026-08-28 14:35:00</text>
      <rect x="676" y="314" width="224" height="44" rx="9" fill="#0d2347" stroke="#274a8a"/><text x="788" y="341" fill="#9bbefc" text-anchor="middle" font-family="monospace">horodatage</text>
    </g>
  </g>

  <!-- codage binaire vigilance -->
  <rect x="40" y="378" width="860" height="66" rx="12" fill="#173666" stroke="#274a8a"/>
  <text x="60" y="404" fill="#e4eaf5" font-size="13" font-weight="bold">Coder le niveau de vigilance sur 3 bits :</text>
  <g font-size="12" font-family="monospace" text-anchor="middle">
    <rect x="330" y="388" width="98" height="24" rx="6" fill="#123322"/><text x="379" y="405" fill="#81fba1">000 = verte</text>
    <rect x="438" y="388" width="98" height="24" rx="6" fill="#3a3212"/><text x="487" y="405" fill="#ffd66b">001 = jaune</text>
    <rect x="546" y="388" width="106" height="24" rx="6" fill="#3a2412"/><text x="599" y="405" fill="#ffb454">010 = orange</text>
    <rect x="662" y="388" width="98" height="24" rx="6" fill="#3a1218"/><text x="711" y="405" fill="#ff7b88">011 = rouge</text>
    <rect x="770" y="388" width="110" height="24" rx="6" fill="#2b1a3f"/><text x="825" y="405" fill="#c68ef2">100 = violette</text>
  </g>
  <text x="60" y="432" fill="#9bbefc" font-size="11.5">Avec n bits on code 2ⁿ valeurs : 3 bits suffisent pour les 5 niveaux (2³ = 8 ≥ 5), 2 bits ne suffiraient pas (2² = 4 &lt; 5).</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#123322"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#2b1a3f"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#3a1218"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#3a2412"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#3a3212"]{fill:#ffffff}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  text[fill="#ffb454"],tspan[fill="#ffb454"],[fill="#ffb454"] text,[fill="#ffb454"] tspan{fill:#b06300}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
