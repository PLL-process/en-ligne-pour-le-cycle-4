<title id="t_extrait_mesures_station">Un extrait des mesures de la station</title>
<desc id="d_extrait_mesures_station">Un extrait du fichier de mesures de la station de Sainte-Luce, données simulées, une ligne toutes les huit heures. Le 28/08 00:00 : vent 37 km/h (kilomètres par heure), pression 1011.5 hPa (hectopascals), vigilance verte. Le 28/08 08:00 : vent 38 km/h, pression 1009.9 hPa, vigilance jaune. Le 28/08 16:00 : vent 51 km/h, pression 1004.9 hPa, vigilance orange. Le 29/08 00:00 : vent 71 km/h, pression 999.7 hPa, vigilance orange. Le 29/08 08:00 : vent 95 km/h, pression 989.0 hPa, vigilance rouge. Le 29/08 16:00 : vent 121 km/h, pression 977.7 hPa, vigilance violette.</desc>
