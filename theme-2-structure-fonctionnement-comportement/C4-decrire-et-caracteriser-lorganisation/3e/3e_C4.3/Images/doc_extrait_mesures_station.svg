<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Sainte-Luce, du 28 au 29 août : une mesure</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">toutes les huit heures. Données simulées.</text>
