<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 384" width="350" height="384" role="img" aria-labelledby="t_can_barometre d_can_barometre" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_can_barometre">Le baromètre et son CAN</title>
<desc id="d_can_barometre">Le baromètre de la station mesure de 868 hPa (hectopascals) à 1018 hPa. Son CAN, convertisseur analogique-numérique, travaille sur 10 bits : il change la tension du capteur en un nombre entier N. Le document ne dit ni le plus grand N possible, ni ce que vaut un palier.</desc>
<rect width="350" height="384" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le baromètre et son CAN</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le CAN, convertisseur</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">analogique-numérique, change la tension</text>
<text x="14.0" y="89.6" font-size="13.5" fill="#9bbefc">du capteur en un nombre entier N.</text>
<rect x="14.0" y="105.6" width="322.0" height="88.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="135.6" font-size="16" fill="#61dafb" font-weight="700">Le baromètre</text>
<text x="26.0" y="163.6" font-size="13.5" fill="#9bbefc">Plus basse pression</text>
<text x="26.0" y="182.6" font-size="16" fill="#e4eaf5" font-weight="700">868 hPa</text>
<text x="175.0" y="163.6" font-size="13.5" fill="#9bbefc">Plus haute pression</text>
<text x="175.0" y="182.6" font-size="16" fill="#e4eaf5" font-weight="700">1018 hPa</text>
<rect x="14.0" y="209.6" width="322.0" height="88.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="239.6" font-size="16" fill="#61dafb" font-weight="700">Son CAN</text>
<text x="26.0" y="267.6" font-size="13.5" fill="#9bbefc">Nombre de bits</text>
<text x="26.0" y="286.6" font-size="16" fill="#e4eaf5" font-weight="700">10</text>
<text x="175.0" y="267.6" font-size="13.5" fill="#9bbefc">Il sort</text>
<text x="175.0" y="286.6" font-size="16" fill="#e4eaf5" font-weight="700">un entier N</text>
<text x="14.0" y="327.8" font-size="13.5" fill="#9bbefc">hPa : hectopascals · Le document ne dit ni le plus</text>
<text x="14.0" y="346.0" font-size="13.5" fill="#9bbefc">grand N possible, ni ce que vaut un palier : c'est</text>
<text x="14.0" y="364.3" font-size="13.5" fill="#9bbefc">la question.</text>
</svg>
