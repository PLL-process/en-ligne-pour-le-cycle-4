<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Chaîne d'information de la station d'alerte cyclonique</title>
  <desc id="d">Schéma bloc en trois fonctions : Acquérir (capteurs vent, pluie, pression), Traiter (microcontrôleur comparant les mesures aux seuils d'alerte), Communiquer (antenne radio, sirène, application). Les flèches indiquent la nature des signaux : grandeurs physiques, signaux électriques, données numériques, messages d'alerte.</desc>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/>
    </marker>
  </defs>
  <rect width="940" height="430" fill="#050f24"/>
  <text x="470" y="36" fill="#81aaff" font-size="22" font-weight="bold" text-anchor="middle">Chaîne d'information de la station d'alerte</text>

  <!-- Entrée : grandeurs physiques -->
  <g>
    <rect x="24" y="120" width="150" height="170" rx="12" fill="none" stroke="#9bbefc" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="99" y="108" fill="#9bbefc" font-size="13" text-anchor="middle" font-style="italic">Grandeurs physiques</text>
    <text x="99" y="160" fill="#e4eaf5" font-size="13" text-anchor="middle">💨 vent (km/h)</text>
    <text x="99" y="205" fill="#e4eaf5" font-size="13" text-anchor="middle">🌧 pluie (mm)</text>
    <text x="99" y="250" fill="#e4eaf5" font-size="13" text-anchor="middle">📉 pression (hPa)</text>
  </g>

  <!-- ACQUÉRIR -->
  <g>
    <rect x="230" y="110" width="180" height="190" rx="14" fill="#0d2347" stroke="#61dafb" stroke-width="3"/>
    <rect x="230" y="110" width="180" height="44" rx="14" fill="#173666"/>
    <text x="320" y="139" fill="#61dafb" font-size="17" font-weight="bold" text-anchor="middle">ACQUÉRIR</text>
    <text x="320" y="180" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Anémomètre</text>
    <text x="320" y="212" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Pluviomètre</text>
    <text x="320" y="244" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Baromètre</text>
    <text x="320" y="282" fill="#9bbefc" font-size="11.5" text-anchor="middle" font-style="italic">= les capteurs</text>
  </g>

  <!-- TRAITER -->
  <g>
    <rect x="470" y="110" width="190" height="190" rx="14" fill="#0d2347" stroke="#c68ef2" stroke-width="3"/>
    <rect x="470" y="110" width="190" height="44" rx="14" fill="#2b1a3f"/>
    <text x="565" y="139" fill="#c68ef2" font-size="17" font-weight="bold" text-anchor="middle">TRAITER</text>
    <text x="565" y="180" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Microcontrôleur</text>
    <text x="565" y="210" fill="#9bbefc" font-size="11.5" text-anchor="middle">compare les mesures</text>
    <text x="565" y="226" fill="#9bbefc" font-size="11.5" text-anchor="middle">aux seuils d'alerte</text>
    <rect x="497" y="242" width="136" height="34" rx="8" fill="#173666"/>
    <text x="565" y="258" fill="#ffd66b" font-size="10.5" text-anchor="middle">SI vent &gt; 118 km/h</text>
    <text x="565" y="271" fill="#ffd66b" font-size="10.5" text-anchor="middle">ALORS alerte violette</text>
  </g>

  <!-- COMMUNIQUER -->
  <g>
    <rect x="720" y="110" width="190" height="190" rx="14" fill="#0d2347" stroke="#81fba1" stroke-width="3"/>
    <rect x="720" y="110" width="190" height="44" rx="14" fill="#123322"/>
    <text x="815" y="139" fill="#81fba1" font-size="16" font-weight="bold" text-anchor="middle">COMMUNIQUER</text>
    <text x="815" y="180" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Antenne radio 📡</text>
    <text x="815" y="212" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Sirène + gyrophare</text>
    <text x="815" y="244" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Application mobile</text>
    <text x="815" y="282" fill="#9bbefc" font-size="11.5" text-anchor="middle" font-style="italic">= diffuser l'alerte</text>
  </g>

  <!-- flèches -->
  <line x1="176" y1="205" x2="224" y2="205" stroke="#61dafb" stroke-width="3.5" marker-end="url(#fl)"/>
  <line x1="412" y1="205" x2="464" y2="205" stroke="#61dafb" stroke-width="3.5" marker-end="url(#fl)"/>
  <line x1="662" y1="205" x2="714" y2="205" stroke="#61dafb" stroke-width="3.5" marker-end="url(#fl)"/>

  <!-- étiquettes de signaux -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="150" y="318" width="180" height="52" rx="9" fill="#173666" stroke="#274a8a"/>
    <text x="240" y="340" fill="#61dafb" font-weight="bold">Signal électrique</text>
    <text x="240" y="357" fill="#9bbefc">analogique (tension)</text>
    <line x1="240" y1="316" x2="300" y2="264" stroke="#61dafb" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="390" y="318" width="180" height="52" rx="9" fill="#173666" stroke="#274a8a"/>
    <text x="480" y="340" fill="#c68ef2" font-weight="bold">Donnée numérique</text>
    <text x="480" y="357" fill="#9bbefc">ex. vent = 132 km/h</text>
    <line x1="470" y1="316" x2="440" y2="212" stroke="#c68ef2" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="630" y="318" width="190" height="52" rx="9" fill="#173666" stroke="#274a8a"/>
    <text x="725" y="340" fill="#81fba1" font-weight="bold">Message d'alerte</text>
    <text x="725" y="357" fill="#9bbefc">ordre + information</text>
    <line x1="700" y1="316" x2="690" y2="212" stroke="#81fba1" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <text x="470" y="412" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">Chaîne d'information = Acquérir → Traiter → Communiquer (l'information circule, elle ne s'use pas)</text>
</svg>
