<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Mise en forme, transmission et stockage des données de la station</title>
  <desc id="d">Parcours de la donnée : la station met en forme ses mesures dans un fichier CSV, le transmet par radio à la passerelle du collège, qui l'envoie par Internet au serveur où les fichiers sont stockés. Les téléphones et ordinateurs consultent ensuite ces données. Un encart montre les formats de fichiers : csv et json pour les mesures, png pour les cartes, mp3 pour le message sonore d'alerte.</desc>
  <defs>
    <marker id="fl3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/>
    </marker>
  </defs>
  <rect width="940" height="460" fill="#050f24"/>
  <text x="470" y="34" fill="#81aaff" font-size="21" font-weight="bold" text-anchor="middle">Le voyage d'une mesure : mise en forme → transmission → stockage</text>

  <!-- Station -->
  <g>
    <rect x="36" y="90" width="170" height="150" rx="14" fill="#0d2347" stroke="#61dafb" stroke-width="3"/>
    <text x="121" y="118" fill="#61dafb" font-size="14" font-weight="bold" text-anchor="middle">Station</text>
    <text x="121" y="140" fill="#9bbefc" font-size="11" text-anchor="middle">met en forme :</text>
    <rect x="58" y="152" width="126" height="42" rx="8" fill="#08132c" stroke="#ffd66b" stroke-width="1.5"/>
    <text x="121" y="169" fill="#ffd66b" font-size="9.5" text-anchor="middle" font-family="monospace">heure;vent;pression</text>
    <text x="121" y="184" fill="#ffd66b" font-size="9.5" text-anchor="middle" font-family="monospace">14:35;132;987.4</text>
    <text x="121" y="222" fill="#e4eaf5" font-size="11.5" text-anchor="middle">fichier <tspan fill="#ffd66b" font-family="monospace">.csv</tspan></text>
  </g>

  <!-- radio -->
  <line x1="208" y1="165" x2="288" y2="165" stroke="#61dafb" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#fl3)"/>
  <text x="248" y="148" fill="#9bbefc" font-size="11" text-anchor="middle">radio LoRa</text>
  <text x="248" y="190" fill="#5b7bb8" font-size="10" text-anchor="middle">sans fil, longue portée</text>

  <!-- Passerelle -->
  <g>
    <rect x="292" y="110" width="150" height="110" rx="14" fill="#0d2347" stroke="#c68ef2" stroke-width="3"/>
    <text x="367" y="140" fill="#c68ef2" font-size="13.5" font-weight="bold" text-anchor="middle">Passerelle</text>
    <text x="367" y="162" fill="#9bbefc" font-size="11" text-anchor="middle">du collège</text>
    <text x="367" y="190" fill="#e4eaf5" font-size="11" text-anchor="middle">radio → Internet</text>
  </g>

  <!-- internet -->
  <line x1="444" y1="165" x2="524" y2="165" stroke="#61dafb" stroke-width="3.5" marker-end="url(#fl3)"/>
  <text x="484" y="148" fill="#9bbefc" font-size="11" text-anchor="middle">Internet</text>
  <text x="484" y="190" fill="#5b7bb8" font-size="10" text-anchor="middle">filaire (fibre)</text>

  <!-- Serveur -->
  <g>
    <rect x="528" y="86" width="180" height="158" rx="14" fill="#0d2347" stroke="#81fba1" stroke-width="3"/>
    <text x="618" y="114" fill="#81fba1" font-size="14" font-weight="bold" text-anchor="middle">Serveur</text>
    <text x="618" y="132" fill="#9bbefc" font-size="11" text-anchor="middle">stocke les fichiers</text>
    <g font-family="monospace" font-size="10.5">
      <rect x="548" y="142" width="140" height="22" rx="5" fill="#173666"/><text x="558" y="157" fill="#ffd66b">mesures_08.csv</text>
      <rect x="548" y="168" width="140" height="22" rx="5" fill="#173666"/><text x="558" y="183" fill="#ffd66b">alerte.json</text>
      <rect x="548" y="194" width="140" height="22" rx="5" fill="#173666"/><text x="558" y="209" fill="#ffd66b">carte_vents.png</text>
    </g>
    <text x="618" y="236" fill="#9bbefc" font-size="10" text-anchor="middle" font-style="italic">+ copie locale sur la station</text>
  </g>

  <!-- terminaux -->
  <line x1="710" y1="165" x2="782" y2="165" stroke="#61dafb" stroke-width="3.5" marker-end="url(#fl3)"/>
  <g>
    <rect x="786" y="96" width="120" height="66" rx="12" fill="#0d2347" stroke="#ffd66b" stroke-width="2.5"/>
    <text x="846" y="124" fill="#ffd66b" font-size="12.5" font-weight="bold" text-anchor="middle">📱 Téléphones</text>
    <text x="846" y="146" fill="#9bbefc" font-size="10.5" text-anchor="middle">notification d'alerte</text>
    <rect x="786" y="176" width="120" height="66" rx="12" fill="#0d2347" stroke="#ffd66b" stroke-width="2.5"/>
    <text x="846" y="204" fill="#ffd66b" font-size="12.5" font-weight="bold" text-anchor="middle">💻 Ordinateurs</text>
    <text x="846" y="226" fill="#9bbefc" font-size="10.5" text-anchor="middle">graphiques, historique</text>
  </g>

  <!-- Encart formats -->
  <rect x="36" y="280" width="870" height="118" rx="14" fill="#173666" stroke="#274a8a"/>
  <text x="56" y="308" fill="#e4eaf5" font-size="13.5" font-weight="bold">Un format de fichier pour chaque nature d'information :</text>
  <g font-size="11.5">
    <rect x="56" y="322" width="196" height="60" rx="9" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <text x="154" y="344" fill="#61dafb" text-anchor="middle" font-weight="bold" font-family="monospace">.csv / .ods</text>
    <text x="154" y="366" fill="#9bbefc" text-anchor="middle">tableau de mesures</text>
    <rect x="272" y="322" width="196" height="60" rx="9" fill="#0d2347" stroke="#c68ef2" stroke-width="2"/>
    <text x="370" y="344" fill="#c68ef2" text-anchor="middle" font-weight="bold" font-family="monospace">.json / .txt</text>
    <text x="370" y="366" fill="#9bbefc" text-anchor="middle">message structuré</text>
    <rect x="488" y="322" width="196" height="60" rx="9" fill="#0d2347" stroke="#81fba1" stroke-width="2"/>
    <text x="586" y="344" fill="#81fba1" text-anchor="middle" font-weight="bold" font-family="monospace">.png / .svg</text>
    <text x="586" y="366" fill="#9bbefc" text-anchor="middle">image : carte des vents</text>
    <rect x="704" y="322" width="182" height="60" rx="9" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/>
    <text x="795" y="344" fill="#ffd66b" text-anchor="middle" font-weight="bold" font-family="monospace">.mp3 / .wav</text>
    <text x="795" y="366" fill="#9bbefc" text-anchor="middle">son : message d'alerte</text>
  </g>

  <text x="470" y="434" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">Transmettre = déplacer la donnée · Stocker = la conserver pour plus tard · Mettre en forme = choisir le bon format</text>
</svg>
