<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">La recette de conception d'un schéma à deux réseaux, en quatre étapes</title>
<desc id="d">Quatre vignettes numérotées. Un : dessiner deux quartiers avec deux rues différentes, 192.168.10 pour la Martinique et 192.168.30 pour New York. Deux : poser un poste-frontière, le routeur, à la porte de chaque quartier. Trois : tracer la rue-pont 10.0.0.x entre les deux routeurs, avec les adresses 10.0.0.1 et 10.0.0.2. Quatre : vérifier que chaque quartier garde son commutateur pour la distribution interne.</desc>
<rect width="1080" height="340" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="338" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Concevoir un schéma à DEUX réseaux : la recette en 4 étapes</text>

<!-- vignette 1 -->
<g>
<rect x="25" y="55" width="245" height="250" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="50" cy="80" r="15" fill="#135588"/><text x="50" y="86" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">1</text>
<text x="147" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Deux quartiers, deux rues</text>
<rect x="45" y="110" width="90" height="70" rx="8" fill="#e8f0fb" stroke="#31649c" stroke-width="2"/>
<text x="90" y="138" text-anchor="middle" font-size="11.5" fill="#123d66" font-weight="bold">Martinique</text>
<text x="90" y="158" text-anchor="middle" font-size="10" fill="#123d66" font-family="Consolas, monospace">192.168.10</text>
<rect x="160" y="110" width="90" height="70" rx="8" fill="#fdf1ec" stroke="#b3623a" stroke-width="2"/>
<text x="205" y="138" text-anchor="middle" font-size="11.5" fill="#7a3a1a" font-weight="bold">New York</text>
<text x="205" y="158" text-anchor="middle" font-size="10" fill="#7a3a1a" font-family="Consolas, monospace">192.168.30</text>
<text x="147" y="215" text-anchor="middle" font-size="11.5" fill="#5c4a14">Deux rues différentes =</text>
<text x="147" y="231" text-anchor="middle" font-size="11.5" fill="#5c4a14">deux réseaux ÉTANCHES</text>
<text x="147" y="247" text-anchor="middle" font-size="11.5" fill="#5c4a14">par défaut.</text>
<text x="147" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e7d4f">→ nommer les deux rues</text>
</g>

<!-- vignette 2 -->
<g>
<rect x="288" y="55" width="245" height="250" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="313" cy="80" r="15" fill="#135588"/><text x="313" y="86" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">2</text>
<text x="410" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Un routeur par porte</text>
<rect x="316" y="120" width="86" height="52" rx="10" fill="#2b1a3f" stroke="#7a5aa8" stroke-width="2.5"/>
<text x="359" y="143" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">R-MQ</text>
<text x="359" y="161" text-anchor="middle" font-size="9.5" fill="#dcc7f2">la porte MQ</text>
<rect x="418" y="120" width="86" height="52" rx="10" fill="#2b1a3f" stroke="#7a5aa8" stroke-width="2.5"/>
<text x="461" y="143" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">R-NY</text>
<text x="461" y="161" text-anchor="middle" font-size="9.5" fill="#dcc7f2">la porte NY</text>
<text x="410" y="205" text-anchor="middle" font-size="11.5" fill="#5c4a14">Le routeur = le poste-frontière :</text>
<text x="410" y="221" text-anchor="middle" font-size="11.5" fill="#5c4a14">la passerelle « .1 » de 4e</text>
<text x="410" y="237" text-anchor="middle" font-size="11.5" fill="#5c4a14">prend enfin corps.</text>
<text x="410" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e7d4f">→ un pied dans le quartier (.1)</text>
</g>

<!-- vignette 3 -->
<g>
<rect x="551" y="55" width="245" height="250" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="576" cy="80" r="15" fill="#135588"/><text x="576" y="86" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">3</text>
<text x="673" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">La rue-pont</text>
<rect x="575" y="126" width="70" height="42" rx="8" fill="#2b1a3f" stroke="#7a5aa8" stroke-width="2"/>
<text x="610" y="151" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">R-MQ</text>
<rect x="702" y="126" width="70" height="42" rx="8" fill="#2b1a3f" stroke="#7a5aa8" stroke-width="2"/>
<text x="737" y="151" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">R-NY</text>
<line x1="645" y1="147" x2="702" y2="147" stroke="#7a5aa8" stroke-width="3.5" stroke-dasharray="8 6"/>
<text x="648" y="185" font-size="10" fill="#46326b" font-family="Consolas, monospace">10.0.0.1</text>
<text x="700" y="185" font-size="10" fill="#46326b" font-family="Consolas, monospace">10.0.0.2</text>
<text x="673" y="216" text-anchor="middle" font-size="11.5" fill="#5c4a14">Une mini-rue privée pour</text>
<text x="673" y="232" text-anchor="middle" font-size="11.5" fill="#5c4a14">les 2 routeurs (câble croisé) —</text>
<text x="673" y="248" text-anchor="middle" font-size="11.5" fill="#5c4a14">en vrai : câble sous-marin !</text>
<text x="673" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e7d4f">→ un 3e réseau : le pont</text>
</g>

<!-- vignette 4 -->
<g>
<rect x="814" y="55" width="242" height="250" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="839" cy="80" r="15" fill="#135588"/><text x="839" y="86" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">4</text>
<text x="935" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Les commutateurs restent</text>
<g font-size="10.5" font-family="Consolas, monospace" fill="#31475a">
<text x="838" y="128">PC ── Switch ── Routeur ─┐</text>
<text x="838" y="150">                     pont│</text>
<text x="838" y="172">Serveur ── Switch ── R ─┘</text>
</g>
<text x="935" y="212" text-anchor="middle" font-size="11.5" fill="#5c4a14">Le routeur ne remplace pas</text>
<text x="935" y="228" text-anchor="middle" font-size="11.5" fill="#5c4a14">le commutateur : le local reste</text>
<text x="935" y="244" text-anchor="middle" font-size="11.5" fill="#5c4a14">au commutateur (l'étoile de 5e).</text>
<text x="935" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e7d4f">→ vérifier la chaîne complète</text>
</g>
</svg>
