<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">La fenêtre Config de l'interface GigabitEthernet0/0 du routeur R-MQ, reconstituée</title>
<desc id="d">Reconstitution de la fenêtre de configuration réelle : dans l'onglet Config du routeur R-MQ, l'interface GigabitEthernet0/0 est sélectionnée. Port Status est coché On, IPv4 Address vaut 192.168.10.1 et Subnet Mask 255.255.255.0. En dessous, le journal Equivalent IOS Commands montre les commandes réellement passées : hostname R-MQ, interface GigabitEthernet0/0, ip address 192.168.10.1 255.255.255.0, no shutdown, et le message %LINK-5-CHANGED: Interface GigabitEthernet0/0, changed state to up.</desc>
<rect width="1080" height="560" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="558" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Donner son pied « quartier » au routeur — la fenêtre réelle (R-MQ, prise G0/0)</text>

<!-- fenêtre -->
<g>
<rect x="60" y="52" width="960" height="330" rx="8" fill="#f2f4f7" stroke="#60778c" stroke-width="2"/>
<rect x="60" y="52" width="960" height="30" rx="8" fill="#31475a"/>
<text x="78" y="72" font-size="13" fill="#fff" font-weight="bold">R-MQ</text>
<text x="1002" y="73" text-anchor="end" font-size="14" fill="#fff">✕</text>
<!-- onglets -->
<g font-size="12.5">
<rect x="76" y="90" width="86" height="26" rx="4" fill="#dfe6ee" stroke="#9aaabc"/><text x="119" y="107" text-anchor="middle" fill="#607086">Physical</text>
<rect x="166" y="90" width="86" height="26" rx="4" fill="#ffffff" stroke="#31649c" stroke-width="2"/><text x="209" y="107" text-anchor="middle" fill="#123d66" font-weight="bold">Config</text>
<rect x="256" y="90" width="86" height="26" rx="4" fill="#dfe6ee" stroke="#9aaabc"/><text x="299" y="107" text-anchor="middle" fill="#607086">CLI</text>
</g>
<!-- menu gauche -->
<rect x="76" y="124" width="190" height="244" fill="#e8edf3" stroke="#9aaabc"/>
<g font-size="12" fill="#31475a">
<text x="90" y="146" font-weight="bold" fill="#607086">GLOBAL</text>
<text x="100" y="166">Settings</text>
<text x="90" y="190" font-weight="bold" fill="#607086">ROUTING</text>
<text x="100" y="210">Static</text>
<text x="90" y="234" font-weight="bold" fill="#607086">INTERFACE</text>
</g>
<rect x="92" y="244" width="166" height="24" rx="4" fill="#31649c"/>
<text x="100" y="261" font-size="12" fill="#fff" font-weight="bold">GigabitEthernet0/0</text>
<text x="100" y="288" font-size="12" fill="#31475a">GigabitEthernet0/1</text>
<!-- panneau droit -->
<text x="290" y="146" font-size="14" font-weight="bold" fill="#123d66">GigabitEthernet0/0</text>
<g font-size="13" fill="#31475a">
<text x="290" y="180">Port Status</text>
<rect x="560" y="166" width="18" height="18" rx="3" fill="#eafbe7" stroke="#1e7d4f" stroke-width="2.5"/>
<path d="M563 175 l5 6 l8 -11" stroke="#1e7d4f" stroke-width="3" fill="none"/>
<text x="586" y="180" fill="#0a3d1f" font-weight="bold">On  ← la prise est ALLUMÉE (sinon : rien ne passe)</text>
<text x="290" y="226">IPv4 Address</text>
<rect x="560" y="210" width="220" height="26" rx="4" fill="#fff" stroke="#31649c" stroke-width="2"/>
<text x="572" y="228" font-family="Consolas, monospace" font-size="13.5" fill="#0a2d55" font-weight="bold">192.168.10.1</text>
<text x="796" y="228" font-size="11.5" fill="#607086">le « .1 » du quartier Martinique</text>
<text x="290" y="272">Subnet Mask</text>
<rect x="560" y="256" width="220" height="26" rx="4" fill="#fff" stroke="#31649c" stroke-width="2"/>
<text x="572" y="274" font-family="Consolas, monospace" font-size="13.5" fill="#0a2d55" font-weight="bold">255.255.255.0</text>
<text x="796" y="274" font-size="11.5" fill="#607086">la rue = les 3 premiers nombres</text>
</g>
<!-- flèches pédagogiques -->
<text x="290" y="320" font-size="12" fill="#8a6d1d">Même formulaire que la 4e (SOS serre) — mais ici on configure le ROUTEUR, pas un PC.</text>
<text x="290" y="344" font-size="12" fill="#8a6d1d">À refaire ensuite pour G0/1 (10.0.0.1 / 255.255.255.252) et, en miroir, sur R-NY.</text>
</g>

<!-- journal IOS -->
<rect x="60" y="396" width="960" height="148" rx="8" fill="#101820"/>
<text x="78" y="420" font-size="12.5" fill="#8fa8bf" font-weight="bold">Equivalent IOS Commands — ce que la fenêtre écrit VRAIMENT dans le routeur :</text>
<g font-family="Consolas, monospace" font-size="13" fill="#c5e1a5">
<text x="78" y="446">R-MQ(config)# hostname R-MQ</text>
<text x="78" y="468">R-MQ(config)# interface GigabitEthernet0/0</text>
<text x="78" y="490">R-MQ(config-if)# ip address 192.168.10.1 255.255.255.0</text>
<text x="78" y="512">R-MQ(config-if)# no shutdown</text>
</g>
<text x="78" y="534" font-family="Consolas, monospace" font-size="12.5" fill="#81fba1" font-weight="bold">%LINK-5-CHANGED: Interface GigabitEthernet0/0, changed state to up  ← la prise vient de s'allumer !</text>
</svg>
