<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">La fenêtre Static Routes du routeur R-MQ : écrire la ligne de la table à la main</title>
<desc id="d">Reconstitution de la fenêtre réelle : dans Config, rubrique ROUTING Static, trois champs remplis — Network 192.168.30.0, Mask 255.255.255.0, Next Hop 10.0.0.2 — puis le bouton Add. En dessous, la liste Network Address affiche la ligne ajoutée 192.168.30.0/24 via 10.0.0.2. En bas, la commande équivalente : ip route 192.168.30.0 255.255.255.0 10.0.0.2, et le rappel que R-NY reçoit la ligne miroir.</desc>
<rect width="1080" height="560" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="558" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Écrire la ligne de la table À LA MAIN — la fenêtre Static Routes réelle (R-MQ)</text>

<!-- fenêtre -->
<g>
<rect x="60" y="52" width="960" height="360" rx="8" fill="#f2f4f7" stroke="#60778c" stroke-width="2"/>
<rect x="60" y="52" width="960" height="30" rx="8" fill="#31475a"/>
<text x="78" y="72" font-size="13" fill="#fff" font-weight="bold">R-MQ</text>
<text x="1002" y="73" text-anchor="end" font-size="14" fill="#fff">✕</text>
<!-- menu gauche -->
<rect x="76" y="94" width="190" height="300" fill="#e8edf3" stroke="#9aaabc"/>
<g font-size="12" fill="#31475a">
<text x="90" y="116" font-weight="bold" fill="#607086">GLOBAL</text>
<text x="100" y="136">Settings</text>
<text x="90" y="160" font-weight="bold" fill="#607086">ROUTING</text>
</g>
<rect x="92" y="170" width="166" height="24" rx="4" fill="#31649c"/>
<text x="100" y="187" font-size="12" fill="#fff" font-weight="bold">Static</text>
<text x="100" y="214" font-size="12" fill="#31475a">RIP</text>
<g font-size="12" fill="#31475a">
<text x="90" y="240" font-weight="bold" fill="#607086">INTERFACE</text>
<text x="100" y="260">GigabitEthernet0/0</text>
<text x="100" y="280">GigabitEthernet0/1</text>
</g>
<!-- panneau droit -->
<text x="290" y="120" font-size="14" font-weight="bold" fill="#123d66">Static Routes</text>
<g font-size="13" fill="#31475a">
<text x="290" y="156">Network</text>
<rect x="420" y="140" width="220" height="26" rx="4" fill="#fff" stroke="#31649c" stroke-width="2"/>
<text x="432" y="158" font-family="Consolas, monospace" font-size="13.5" fill="#0a2d55" font-weight="bold">192.168.30.0</text>
<text x="656" y="158" font-size="11.5" fill="#607086">① la RUE de destination (New York)</text>
<text x="290" y="196">Mask</text>
<rect x="420" y="180" width="220" height="26" rx="4" fill="#fff" stroke="#31649c" stroke-width="2"/>
<text x="432" y="198" font-family="Consolas, monospace" font-size="13.5" fill="#0a2d55" font-weight="bold">255.255.255.0</text>
<text x="656" y="198" font-size="11.5" fill="#607086">② « toute la rue », pas une seule maison</text>
<text x="290" y="236">Next Hop</text>
<rect x="420" y="220" width="220" height="26" rx="4" fill="#fff" stroke="#31649c" stroke-width="2"/>
<text x="432" y="238" font-family="Consolas, monospace" font-size="13.5" fill="#0a2d55" font-weight="bold">10.0.0.2</text>
<text x="656" y="238" font-size="11.5" fill="#607086">③ le PROCHAIN SAUT : le pied de pont d'en face</text>
</g>
<rect x="420" y="258" width="80" height="28" rx="6" fill="#1e7d4f"/>
<text x="460" y="277" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Add</text>
<text x="516" y="277" font-size="11.5" fill="#607086">④ … et la ligne entre dans la table ↓</text>
<!-- liste -->
<rect x="290" y="300" width="700" height="94" rx="6" fill="#ffffff" stroke="#9aaabc" stroke-width="1.5"/>
<text x="306" y="322" font-size="12" fill="#607086" font-weight="bold">Network Address</text>
<rect x="300" y="332" width="680" height="30" rx="6" fill="#eafbe7" stroke="#1e7d4f" stroke-width="2.5"/>
<text x="316" y="352" font-family="Consolas, monospace" font-size="13.5" fill="#0a3d1f" font-weight="bold">192.168.30.0/24 via 10.0.0.2</text>
<text x="640" y="384" text-anchor="middle" font-size="11.5" fill="#5c4a14">la ligne DONNÉE de l'activité 2 — la voilà, écrite dans le vrai routeur</text>
</g>

<!-- commande + miroir -->
<rect x="60" y="426" width="960" height="60" rx="8" fill="#101820"/>
<text x="78" y="450" font-size="12.5" fill="#8fa8bf" font-weight="bold">La commande équivalente (ce que Add écrit dans le routeur) :</text>
<text x="78" y="474" font-family="Consolas, monospace" font-size="13.5" fill="#c5e1a5">R-MQ(config)# ip route 192.168.30.0 255.255.255.0 10.0.0.2</text>
<rect x="60" y="496" width="960" height="48" rx="8" fill="#fdf6e3" stroke="#a8823c" stroke-width="2"/>
<text x="540" y="516" text-anchor="middle" font-size="12.5" fill="#5c4a14" font-weight="bold">⚠ N'oublie pas le MIROIR : sur R-NY, la même fenêtre reçoit 192.168.10.0 / 255.255.255.0 / via 10.0.0.1.</text>
<text x="540" y="535" text-anchor="middle" font-size="12" fill="#5c4a14">Une route ne sert à rien sans son retour : l'aller ET le retour doivent connaître leur chemin.</text>
</svg>
