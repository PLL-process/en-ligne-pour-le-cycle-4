<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 245" width="340" height="245" role="img" aria-labelledby="t d" font-family="system-ui,sans-serif">
<title id="t">Une diode électroluminescente</title>
<desc id="d">Le symbole d'une diode : un triangle butant sur une barre, traversé par un fil, avec deux flèches de lumière qui s'en échappent. Elle ne laisse passer le courant que dans un sens.</desc>
<rect width="340" height="245" fill="#fff"/>
<path d="M120,60 L120,180 L215,120 z" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><line x1="215" y1="60" x2="215" y2="180" stroke="#1d4e89" stroke-width="4"/><line x1="40" y1="120" x2="120" y2="120" stroke="#64748b" stroke-width="3"/><line x1="215" y1="120" x2="300" y2="120" stroke="#64748b" stroke-width="3"/><path d="M228,72 L262,38" stroke="#c2410c" stroke-width="2.5"/><path d="M262,38 l-13,1 l5,10 z" fill="#c2410c"/><path d="M246,80 L280,46" stroke="#c2410c" stroke-width="2.5"/><path d="M280,46 l-13,1 l5,10 z" fill="#c2410c"/><text x="170" y="225" font-size="12" text-anchor="middle" fill="#64748b">elle ne laisse passer le courant que dans UN sens</text><text x="170" y="35" font-size="13" text-anchor="middle" fill="#1d4e89" font-weight="700">diode électroluminescente</text>
</svg>
