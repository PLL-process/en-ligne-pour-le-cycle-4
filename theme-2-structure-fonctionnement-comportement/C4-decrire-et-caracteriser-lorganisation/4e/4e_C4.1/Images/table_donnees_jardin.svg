<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">De la mesure brute à la table de données du jardin connecté</title>
  <desc id="d">En haut, le trajet d'une donnée : le capteur du bac B mesure la valeur brute 612 sur 1023 ; la carte la transforme en pourcentage, 60 pour cent, et lui ajoute la date, l'heure et le nom du capteur : c'est l'horodatage ; la mesure enrichie est téléversée vers le serveur. En bas, la table de données du serveur, avec cinq colonnes : identifiant, horodatage, capteur, humidité en pourcentage et arrosage déclenché. Six lignes d'exemples montrent les mesures des bacs A, B et C du 12 mai 2027 entre 7 heures et 17 heures, avec des humidités de 34 à 71 pour cent, et deux arrosages déclenchés quand l'humidité passe sous 40 pour cent. Une remarque explique que cette structure en colonnes permet de trier, filtrer et tracer des courbes.</desc>
  <rect width="940" height="560" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Du capteur à la table : le voyage d'une donnée du jardin</text>

  <!-- trajet de la donnée -->
  <g font-size="11">
    <rect x="30" y="56" width="220" height="84" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <text x="140" y="80" fill="#61dafb" font-weight="bold" text-anchor="middle">🌡 MESURE BRUTE</text>
    <text x="140" y="102" fill="#e4eaf5" text-anchor="middle">capteur du bac B : « 612 »</text>
    <text x="140" y="120" fill="#9bbefc" text-anchor="middle" font-size="10">(sur une échelle de 0 à 1023 —</text>
    <text x="140" y="133" fill="#9bbefc" text-anchor="middle" font-size="10">illisible pour un humain)</text>

    <rect x="330" y="56" width="280" height="84" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/>
    <text x="470" y="80" fill="#ffd66b" font-weight="bold" text-anchor="middle">🧠 TRANSFORMATION par la carte</text>
    <text x="470" y="102" fill="#e4eaf5" text-anchor="middle">612 ÷ 1023 ≈ 60 % d'humidité</text>
    <text x="470" y="120" fill="#9bbefc" text-anchor="middle" font-size="10">+ horodatage : date, heure, nom du capteur</text>
    <text x="470" y="133" fill="#9bbefc" text-anchor="middle" font-size="10">la donnée devient UTILE et DATÉE</text>

    <rect x="690" y="56" width="220" height="84" rx="10" fill="#0d2347" stroke="#81fba1" stroke-width="2"/>
    <text x="800" y="80" fill="#81fba1" font-weight="bold" text-anchor="middle">☁ TÉLÉVERSEMENT</text>
    <text x="800" y="102" fill="#e4eaf5" text-anchor="middle">la mesure rejoint la table</text>
    <text x="800" y="120" fill="#9bbefc" text-anchor="middle" font-size="10">une LIGNE de plus dans la</text>
    <text x="800" y="133" fill="#9bbefc" text-anchor="middle" font-size="10">table de données du serveur</text>

    <g stroke="#5b7bb8" stroke-width="3" fill="#5b7bb8">
      <line x1="250" y1="98" x2="318" y2="98"/><path d="M318 93 l12 5 l-12 5 z"/>
      <line x1="610" y1="98" x2="678" y2="98"/><path d="M678 93 l12 5 l-12 5 z"/>
    </g>
  </g>

  <!-- table -->
  <text x="40" y="184" fill="#c68ef2" font-size="14" font-weight="bold">🗄 LA TABLE « mesures_jardin » (extrait du 12/05/2027)</text>
  <g font-size="11.5">
    <rect x="30" y="196" width="880" height="34" fill="#173666"/>
    <text x="70" y="218" fill="#61dafb" font-weight="bold">id</text>
    <text x="150" y="218" fill="#61dafb" font-weight="bold">horodatage</text>
    <text x="390" y="218" fill="#61dafb" font-weight="bold">capteur</text>
    <text x="530" y="218" fill="#61dafb" font-weight="bold">humidite_pct</text>
    <text x="710" y="218" fill="#61dafb" font-weight="bold">arrosage_declenche</text>
    <g fill="#e4eaf5">
      <rect x="30" y="230" width="880" height="30" fill="#0d2347"/>
      <text x="70" y="250">341</text><text x="150" y="250">12/05/2027 07:00</text><text x="390" y="250">bac_A</text><text x="530" y="250">52</text><text x="710" y="250">non</text>
      <rect x="30" y="260" width="880" height="30" fill="#08132c"/>
      <text x="70" y="280">342</text><text x="150" y="280">12/05/2027 07:00</text><text x="390" y="280">bac_B</text><text x="530" y="280">60</text><text x="710" y="280">non</text>
      <rect x="30" y="290" width="880" height="30" fill="#0d2347"/>
      <text x="70" y="310">343</text><text x="150" y="310">12/05/2027 07:00</text><text x="390" y="310">bac_C</text><text x="530" y="310">71</text><text x="710" y="310">non</text>
      <rect x="30" y="320" width="880" height="30" fill="#3d2410"/>
      <text x="70" y="340">356</text><text x="150" y="340">12/05/2027 12:00</text><text x="390" y="340">bac_A</text><text x="530" y="340" fill="#ffd66b" font-weight="bold">38</text><text x="710" y="340" fill="#ffd66b" font-weight="bold">OUI (38 &lt; seuil 40)</text>
      <rect x="30" y="350" width="880" height="30" fill="#0d2347"/>
      <text x="70" y="370">357</text><text x="150" y="370">12/05/2027 12:00</text><text x="390" y="370">bac_B</text><text x="530" y="370">47</text><text x="710" y="370">non</text>
      <rect x="30" y="380" width="880" height="30" fill="#3d2410"/>
      <text x="70" y="400">371</text><text x="150" y="400">12/05/2027 17:00</text><text x="390" y="400">bac_C</text><text x="530" y="400" fill="#ffd66b" font-weight="bold">34</text><text x="710" y="400" fill="#ffd66b" font-weight="bold">OUI (34 &lt; seuil 40)</text>
    </g>
    <rect x="30" y="196" width="880" height="214" fill="none" stroke="#274a8a" stroke-width="2"/>
    <line x1="130" y1="196" x2="130" y2="410" stroke="#274a8a"/>
    <line x1="370" y1="196" x2="370" y2="410" stroke="#274a8a"/>
    <line x1="510" y1="196" x2="510" y2="410" stroke="#274a8a"/>
    <line x1="690" y1="196" x2="690" y2="410" stroke="#274a8a"/>
  </g>

  <!-- structuration -->
  <g font-size="11">
    <rect x="30" y="430" width="880" height="80" rx="12" fill="#173666" stroke="#274a8a"/>
    <text x="50" y="456" fill="#e4eaf5" font-size="12"><tspan fill="#c68ef2" font-weight="bold">Pourquoi structurer en colonnes ?</tspan> une ligne = UNE mesure · une colonne = UNE information toujours au même endroit.</text>
    <text x="50" y="478" fill="#e4eaf5" font-size="12">C'est cette structure qui permet de <tspan fill="#81fba1" font-weight="bold">TRIER</tspan> (les plus secs d'abord), <tspan fill="#61dafb" font-weight="bold">FILTRER</tspan> (uniquement bac_A) et <tspan fill="#ffd66b" font-weight="bold">TRACER</tspan> la courbe d'humidité.</text>
    <text x="50" y="500" fill="#9bbefc" font-size="10.5">Sans la colonne « capteur », impossible de savoir quel bac a soif — les trois bacs se mélangeraient dans une même bouillie de chiffres.</text>
  </g>

  <text x="470" y="538" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">À toi de lire : quel bac a été arrosé à midi, et pourquoi ? Que raconte la ligne 371 ?</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#08132c"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#3d2410"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#5b7bb8"]{fill:#ffffff}
  text[fill="#5b7bb8"],tspan[fill="#5b7bb8"]{fill:#5475b5}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
