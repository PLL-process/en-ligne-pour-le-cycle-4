<title id="t">Un moteur à courant continu</title>
<desc id="d">Un moteur rond marqué M, alimenté par deux fils à gauche, dont l'axe sort à droite et tourne. Il transforme l'électricité en mouvement.</desc>
<rect width="360" height="240" fill="#fff"/>
<circle cx="130" cy="120" r="58" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="130" y="128" font-size="34" text-anchor="middle" fill="#1d4e89" font-weight="700">M</text><rect x="188" y="112" width="80" height="16" rx="4" fill="#64748b"/><path d="M268,90 a34,34 0 1,1 0,60" fill="none" stroke="#c2410c" stroke-width="3"/><path d="M268,150 l-4,-12 l14,4 z" fill="#c2410c"/><line x1="40" y1="105" x2="72" y2="105" stroke="#c2410c" stroke-width="3"/><line x1="40" y1="135" x2="72" y2="135" stroke="#1d4e89" stroke-width="3"/><text x="180" y="222" font-size="12" text-anchor="middle" fill="#64748b">il transforme l'électricité en mouvement</text>
</svg>
