<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Les deux chaînes du jardin connecté : information en haut, énergie en bas</title>
  <desc id="d">Schéma-bloc du jardin connecté du collège, selon la convention de la technologie. En haut, la chaîne d'information : le capteur d'humidité de chaque bac acquiert la mesure ; la carte programmable traite les données ; le module wifi communique les données vers le réseau ; l'application affiche les courbes pour les élèves. En bas, la chaîne d'énergie, de gauche à droite : le panneau solaire alimente en convertissant l'énergie lumineuse en énergie électrique ; la batterie stocke l'énergie sous forme chimique ; le régulateur distribue l'énergie électrique ; la pompe convertit l'énergie électrique en énergie mécanique pour pousser l'eau ; l'électrovanne distribue l'eau vers les trois bacs. Les flèches d'énergie sont oranges, le flux d'eau est bleu. Une flèche verte DESCEND de la carte vers la pompe : c'est l'ordre d'arrosage — l'information COMMANDE l'énergie.</desc>
  <rect width="940" height="620" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Le jardin connecté du collège — l'information (en haut) COMMANDE l'énergie (en bas)</text>

  <!-- ═══ chaîne d'information (en haut — convention) ═══ -->
  <text x="40" y="66" fill="#61dafb" font-size="14" font-weight="bold">📡 CHAÎNE D'INFORMATION</text>
  <g font-size="11">
    <rect x="30" y="80" width="170" height="70" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <text x="115" y="103" fill="#61dafb" font-weight="bold" text-anchor="middle">🌡 CAPTEURS HUMIDITÉ</text>
    <text x="115" y="121" fill="#e4eaf5" text-anchor="middle">ACQUÉRIR</text>
    <text x="115" y="138" fill="#9bbefc" text-anchor="middle" font-size="10">un par bac (A, B, C)</text>

    <rect x="250" y="80" width="160" height="70" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <text x="330" y="103" fill="#61dafb" font-weight="bold" text-anchor="middle">🧠 CARTE PROGRAMMABLE</text>
    <text x="330" y="121" fill="#e4eaf5" text-anchor="middle">TRAITER</text>
    <text x="330" y="138" fill="#9bbefc" text-anchor="middle" font-size="10">compare au seuil, décide</text>

    <rect x="460" y="80" width="150" height="70" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <text x="535" y="103" fill="#61dafb" font-weight="bold" text-anchor="middle">📶 MODULE WIFI</text>
    <text x="535" y="121" fill="#e4eaf5" text-anchor="middle">COMMUNIQUER</text>
    <text x="535" y="138" fill="#9bbefc" text-anchor="middle" font-size="10">téléverse les mesures</text>

    <rect x="660" y="80" width="160" height="70" rx="10" fill="#0d2347" stroke="#c68ef2" stroke-width="2"/>
    <text x="740" y="103" fill="#c68ef2" font-weight="bold" text-anchor="middle">📱 APPLICATION</text>
    <text x="740" y="121" fill="#e4eaf5" text-anchor="middle">RESTITUER</text>
    <text x="740" y="138" fill="#9bbefc" text-anchor="middle" font-size="10">courbes pour les élèves</text>

    <g stroke="#61dafb" stroke-width="3" fill="#61dafb">
      <line x1="200" y1="115" x2="242" y2="115"/><path d="M242 110 l12 5 l-12 5 z"/>
      <line x1="410" y1="115" x2="452" y2="115"/><path d="M452 110 l12 5 l-12 5 z"/>
      <line x1="610" y1="115" x2="652" y2="115"/><path d="M652 110 l12 5 l-12 5 z"/>
    </g>
    <text x="206" y="106" fill="#61dafb" font-size="9">information</text>
  </g>

  <!-- l'ordre DESCEND : pont info → énergie -->
  <path d="M330 150 q0 60 250 106" stroke="#81fba1" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
  <path d="M568 252 l14 6 l-10 9 z" fill="#81fba1"/>
  <text x="330" y="196" fill="#81fba1" font-size="11.5" font-weight="bold">ORDRE D'ARROSAGE : l'information</text>
  <text x="330" y="212" fill="#81fba1" font-size="11.5" font-weight="bold">COMMANDE l'énergie (l'ordre descend)</text>

  <!-- ═══ chaîne d'énergie (en bas — convention) ═══ -->
  <text x="40" y="248" fill="#ffb454" font-size="14" font-weight="bold">⚡ CHAÎNE D'ÉNERGIE</text>
  <g font-size="11">
    <rect x="30" y="262" width="150" height="70" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/>
    <text x="105" y="285" fill="#ffd66b" font-weight="bold" text-anchor="middle">☀ PANNEAU SOLAIRE</text>
    <text x="105" y="303" fill="#e4eaf5" text-anchor="middle">ALIMENTER / CONVERTIR</text>
    <text x="105" y="320" fill="#9bbefc" text-anchor="middle" font-size="10">lumineuse → électrique</text>

    <rect x="220" y="262" width="140" height="70" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/>
    <text x="290" y="285" fill="#ffd66b" font-weight="bold" text-anchor="middle">🔋 BATTERIE 12 V</text>
    <text x="290" y="303" fill="#e4eaf5" text-anchor="middle">STOCKER</text>
    <text x="290" y="320" fill="#9bbefc" text-anchor="middle" font-size="10">énergie chimique (TBT)</text>

    <rect x="400" y="262" width="140" height="70" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/>
    <text x="470" y="285" fill="#ffd66b" font-weight="bold" text-anchor="middle">⚙ RÉGULATEUR</text>
    <text x="470" y="303" fill="#e4eaf5" text-anchor="middle">DISTRIBUER</text>
    <text x="470" y="320" fill="#9bbefc" text-anchor="middle" font-size="10">protège et répartit</text>

    <rect x="580" y="262" width="140" height="70" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/>
    <text x="650" y="285" fill="#ffd66b" font-weight="bold" text-anchor="middle">💧 POMPE</text>
    <text x="650" y="303" fill="#e4eaf5" text-anchor="middle">CONVERTIR</text>
    <text x="650" y="320" fill="#9bbefc" text-anchor="middle" font-size="10">électrique → mécanique</text>

    <rect x="760" y="262" width="150" height="70" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <text x="835" y="285" fill="#61dafb" font-weight="bold" text-anchor="middle">🚰 ÉLECTROVANNE</text>
    <text x="835" y="303" fill="#e4eaf5" text-anchor="middle">DISTRIBUER (l'eau)</text>
    <text x="835" y="320" fill="#9bbefc" text-anchor="middle" font-size="10">vers les 3 bacs</text>

    <g stroke="#ffb454" stroke-width="3" fill="#ffb454">
      <line x1="180" y1="297" x2="212" y2="297"/><path d="M212 292 l12 5 l-12 5 z"/>
      <line x1="360" y1="297" x2="392" y2="297"/><path d="M392 292 l12 5 l-12 5 z"/>
      <line x1="540" y1="297" x2="572" y2="297"/><path d="M572 292 l12 5 l-12 5 z"/>
    </g>
    <g stroke="#61dafb" stroke-width="3" fill="#61dafb">
      <line x1="720" y1="297" x2="752" y2="297"/><path d="M752 292 l12 5 l-12 5 z"/>
    </g>
    <text x="196" y="288" fill="#ffb454" font-size="9">énergie</text>
    <text x="728" y="288" fill="#61dafb" font-size="9">eau</text>
  </g>

  <!-- flux d'eau vers les bacs -->
  <g font-size="10.5">
    <path d="M835 332 q0 30 -60 40" stroke="#61dafb" stroke-width="2.5" fill="none"/>
    <path d="M835 332 q0 40 0 50" stroke="#61dafb" stroke-width="2.5" fill="none"/>
    <path d="M835 332 q0 30 60 40" stroke="#61dafb" stroke-width="2.5" fill="none"/>
    <rect x="700" y="374" width="70" height="34" rx="7" fill="#0e2e18" stroke="#81fba1" stroke-width="2"/>
    <text x="735" y="395" fill="#81fba1" text-anchor="middle">🌱 BAC A</text>
    <rect x="800" y="382" width="70" height="34" rx="7" fill="#0e2e18" stroke="#81fba1" stroke-width="2"/>
    <text x="835" y="403" fill="#81fba1" text-anchor="middle">🌱 BAC B</text>
    <rect x="758" y="422" width="70" height="34" rx="7" fill="#0e2e18" stroke="#81fba1" stroke-width="2"/>
    <text x="793" y="443" fill="#81fba1" text-anchor="middle">🌱 BAC C</text>
  </g>

  <!-- encart flux -->
  <g font-size="10.5">
    <rect x="30" y="470" width="880" height="100" rx="12" fill="#173666" stroke="#274a8a"/>
    <text x="50" y="496" fill="#e4eaf5" font-size="12"><tspan fill="#61dafb" font-weight="bold">Convention :</tspan> l'information EN HAUT, l'énergie EN BAS — <tspan fill="#81fba1">l'ordre descend</tspan>, comme le cerveau commande les muscles.</text>
    <text x="50" y="518" fill="#e4eaf5" font-size="12"><tspan fill="#ffb454" font-weight="bold">3 flux :</tspan> <tspan fill="#ffb454">énergie (orange)</tspan> — elle se transforme (lumineuse → électrique → chimique → électrique → mécanique) ; <tspan fill="#61dafb">eau (bleu)</tspan> ; <tspan fill="#61dafb">information (bleu clair)</tspan>.</text>
    <text x="50" y="546" fill="#ffd66b" font-size="11.5">À toi de lire : où l'énergie se transforme-t-elle ? où est-elle stockée ou distribuée ? quel bloc fait le pont entre les deux chaînes ?</text>
  </g>

  <text x="470" y="596" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">Le même jardin que tu programmeras en C6 (arrosage automatique) — ici, on lit son ORGANISATION.</text>
</svg>
