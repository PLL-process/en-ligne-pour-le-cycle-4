<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-labelledby="t d" font-family="system-ui,sans-serif">
<title id="t">Un capteur de mouvement</title>
<desc id="d">Un capteur circulaire d'où partent trois faisceaux en pointillés vers une silhouette humaine. Il détecte la chaleur en déplacement, pas la lumière.</desc>
<rect width="400" height="250" fill="#fff"/>
<circle cx="110" cy="120" r="52" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><circle cx="110" cy="120" r="26" fill="#fff" stroke="#1d4e89" stroke-width="2"/><path d="M162,120 L300,60" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><path d="M162,120 L300,120" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><path d="M162,120 L300,180" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><path d="M300,150 l14,-40 l14,40 l-14,-14 z" fill="#0f172a"/><circle cx="314" cy="95" r="11" fill="#0f172a"/><text x="200" y="232" font-size="12" text-anchor="middle" fill="#64748b">il détecte la CHALEUR qui bouge, pas la lumière</text><text x="110" y="200" font-size="12" text-anchor="middle" fill="#1d4e89" font-weight="700">capteur</text>
</svg>
