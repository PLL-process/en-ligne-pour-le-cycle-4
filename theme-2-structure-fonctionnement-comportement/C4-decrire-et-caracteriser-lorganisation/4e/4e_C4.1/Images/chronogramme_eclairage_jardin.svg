<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" style="width:100%;height:auto" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Chronogramme de l’éclairage de l’allée du jardin</title>
<desc id="d">Chronogramme de 16 h à 22 h, en trois pistes. Luminosité, en lux : elle baisse de 800 lux à 16 h jusqu'à 0 ; elle passe sous le seuil « nuit » de 50 lux vers 19 h. Présence, 0 ou 1 : trois passages, à 17 h, 20 h et 21 h 30. LED de l'allée, 0 ou 1 : elle s'allume 10 minutes à chaque passage, à 17 h, 20 h et 21 h 30 — même à 17 h, quand il fait encore jour.</desc>
