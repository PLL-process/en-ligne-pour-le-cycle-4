<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 640" width="840" height="640" style="width:100%;height:auto" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Algorigramme corrigé de l’éclairage de l’allée</title>
<desc id="d">Algorigramme corrigé. Début ; lire la luminosité et la présence ; test : il fait nuit ET quelqu'un passe ? Si OUI : allumer la LED pendant 10 minutes. Si NON : laisser la LED éteinte. Dans les deux cas, une flèche remonte avant « Lire la luminosité et la présence » : le programme relit les capteurs et tourne en boucle.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a41"/></marker></defs>
<rect x="0" y="0" width="840" height="640" fill="#fbfaf6"/>
<text x="30" y="44" font-size="26" font-weight="700" text-anchor="start" fill="#1b2a41">Le programme corrigé de l’éclairage</text>
<ellipse cx="300" cy="100" rx="90" ry="30" fill="#e9f7ec" stroke="#1b2a41" stroke-width="2"/>
<text x="300" y="107" font-size="21" text-anchor="middle" fill="#1b2a41">Début</text>
<path d="M 300 130 L 300 166" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
<rect x="140" y="168" width="320" height="70" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="300.0" y="198.0" font-size="21" text-anchor="middle" fill="#1b2a41">Lire la luminosité</text>
<text x="300.0" y="224.0" font-size="21" text-anchor="middle" fill="#1b2a41">et la présence</text>
<path d="M 300 238 L 300 296" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
<path d="M 300 298 L 490 388 L 300 478 L 110 388 Z" fill="#fff3d6" stroke="#1b2a41" stroke-width="2"/>
<text x="300" y="382" font-size="21" text-anchor="middle" fill="#1b2a41">Il fait nuit ET</text>
<text x="300" y="408" font-size="21" text-anchor="middle" fill="#1b2a41">quelqu’un passe ?</text>
<path d="M 300 478 L 300 536" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
<text x="312" y="514" font-size="19" font-weight="700" text-anchor="start" fill="#1b2a41">OUI</text>
<rect x="140" y="538" width="320" height="70" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="300.0" y="568.0" font-size="21" text-anchor="middle" fill="#1b2a41">Allumer la LED</text>
<text x="300.0" y="594.0" font-size="21" text-anchor="middle" fill="#1b2a41">pendant 10 minutes</text>
<path d="M 490 388 L 566 388" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
<text x="528" y="374" font-size="19" font-weight="700" text-anchor="middle" fill="#1b2a41">NON</text>
<rect x="568" y="348" width="240" height="80" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="688.0" y="383.0" font-size="21" text-anchor="middle" fill="#1b2a41">Laisser la LED</text>
<text x="688.0" y="409.0" font-size="21" text-anchor="middle" fill="#1b2a41">éteinte</text>
<path d="M 688 348 L 688 148 L 314 148" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
<path d="M 140 573 L 60 573 L 60 148 L 286 148" fill="none" stroke="#1b2a41" stroke-width="2.4" marker-end="url(#fl)"/>
</svg>
