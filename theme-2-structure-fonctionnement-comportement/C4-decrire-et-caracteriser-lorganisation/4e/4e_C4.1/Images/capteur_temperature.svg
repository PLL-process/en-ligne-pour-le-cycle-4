<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="t d" font-family="system-ui,sans-serif">
<title id="t">Un capteur de température</title>
<desc id="d">Un boîtier avec une sonde qui sort par le haut et un fil qui part vers la droite, où s'affiche une valeur de 21,4 degrés. Le capteur transforme une grandeur physique en un nombre.</desc>
<rect width="400" height="260" fill="#fff"/>
<rect x="60" y="60" width="70" height="120" rx="10" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><rect x="86" y="30" width="18" height="34" rx="9" fill="#fff" stroke="#c2410c" stroke-width="2"/><circle cx="95" cy="190" r="14" fill="#c2410c"/><line x1="70" y1="90" x2="120" y2="90" stroke="#64748b" stroke-width="2"/><line x1="70" y1="110" x2="120" y2="110" stroke="#64748b" stroke-width="2"/><line x1="70" y1="130" x2="120" y2="130" stroke="#64748b" stroke-width="2"/><line x1="130" y1="120" x2="230" y2="120" stroke="#64748b" stroke-width="3"/><text x="300" y="115" font-size="22" text-anchor="middle" fill="#1d4e89" font-weight="700">21,4 °C</text><text x="300" y="145" font-size="12" text-anchor="middle" fill="#64748b">un nombre</text><text x="190" y="235" font-size="12" text-anchor="middle" fill="#64748b">il transforme une grandeur physique en nombre</text>
</svg>
