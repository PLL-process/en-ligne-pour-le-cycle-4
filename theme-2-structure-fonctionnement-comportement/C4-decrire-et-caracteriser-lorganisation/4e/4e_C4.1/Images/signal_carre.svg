<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 255" width="430" height="255" role="img" aria-labelledby="t d" font-family="system-ui,sans-serif">
<title id="t">Un signal en créneaux</title>
<desc id="d">Un graphique où la courbe saute entre deux niveaux seulement, zéro et un, formant des créneaux. C'est un signal tout ou rien, dit logique.</desc>
<rect width="430" height="255" fill="#fff"/>
<line x1="40" y1="200" x2="410" y2="200" stroke="#64748b" stroke-width="2"/><line x1="40" y1="200" x2="40" y2="45" stroke="#64748b" stroke-width="2"/><path d="M60,170 L60,70 L140,70 L140,170 L220,170 L220,70 L300,70 L300,170 L380,170" fill="none" stroke="#1d4e89" stroke-width="3"/><text x="28" y="75" font-size="12" text-anchor="end" fill="#64748b">1</text><text x="28" y="175" font-size="12" text-anchor="end" fill="#64748b">0</text><text x="225" y="235" font-size="12" text-anchor="middle" fill="#64748b">un signal qui ne prend que deux valeurs : c'est le tout ou rien</text>
</svg>
