<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Arial, sans-serif">
<title id="t">Stocker ou transformer l'énergie ?</title><desc id="d">À gauche, la batterie : l'énergie électrique entre et ressort électrique, de même nature — elle est stockée. À droite, la pompe : l'énergie électrique entre et ressort hydraulique — sa nature change, elle est transformée.</desc>
<rect width="800" height="380" fill="#FFFFFF"/><text x="200" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">BATTERIE = STOCKAGE</text>
<text x="600" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">POMPE = TRANSFORMATION</text>
<line x1="400" y1="20" x2="400" y2="360" stroke="#BFBFBF" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="130" y="120" width="140" height="120" rx="14" fill="#E8F0FE" stroke="#1F3864" stroke-width="4"/>
<rect x="185" y="104" width="30" height="16" fill="#1F3864"/>
<text x="200" y="176" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3864">🔋</text>
<text x="200" y="206" text-anchor="middle" font-size="16" fill="#1F3864">batterie</text>
<path d="M40 180 H120" stroke="#F4C542" stroke-width="12" marker-end="url(#fj)"/>
<path d="M280 180 H360" stroke="#F4C542" stroke-width="12" marker-end="url(#fj)"/>
<text x="78" y="160" text-anchor="middle" font-size="15" fill="#8a6d00">électrique</text>
<text x="322" y="160" text-anchor="middle" font-size="15" fill="#8a6d00">électrique</text>
<text x="200" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#375623">MÊME nature en sortie :</text>
<text x="200" y="314" text-anchor="middle" font-size="17" fill="#375623">l'énergie est mise en réserve</text>
<rect x="530" y="120" width="140" height="120" rx="14" fill="#E8F0FE" stroke="#1F3864" stroke-width="4"/>
<circle cx="600" cy="168" r="26" fill="none" stroke="#1F3864" stroke-width="5"/><path d="M600 142 l14 26 h-28 z" fill="#1F3864"/>
<text x="600" y="206" text-anchor="middle" font-size="16" fill="#1F3864">pompe</text>
<path d="M440 180 H520" stroke="#F4C542" stroke-width="12" marker-end="url(#fj)"/>
<path d="M680 180 H760" stroke="#5B8DEF" stroke-width="12" marker-end="url(#fb)"/>
<text x="478" y="160" text-anchor="middle" font-size="15" fill="#8a6d00">électrique</text>
<text x="722" y="160" text-anchor="middle" font-size="15" fill="#2b4c9b">hydraulique</text>
<text x="600" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#C55A11">La NATURE change :</text>
<text x="600" y="314" text-anchor="middle" font-size="17" fill="#C55A11">électrique → hydraulique</text>
<defs><marker id="fj" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F4C542"/></marker>
<marker id="fb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5B8DEF"/></marker></defs></svg>