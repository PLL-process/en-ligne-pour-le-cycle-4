<h1>🔥 QCM PREMIUM - Automatisation (4e)</h1>

⏱ Temps : <span id="timer">0</span> sec

<div class="progress"><div class="bar" id="bar"></div></div>

<div id="quiz"></div>

<button onclick="corriger()">✅ Corriger</button>
<button onclick="resetQuiz()">🔄 Réinitialiser</button>

<h2 id="score"></h2>
<script>

// TIMER
let time = 0;
setInterval(()=>{
    time++;
    document.getElementById("timer").innerText = time;
},1000);

// QUESTIONS — onze, et onze annoncées
const questions = [

{
q:"Quel composant mesure la température ?",
img:"Images/capteur_temperature.svg",
options:["Moteur","Écran","Capteur"],
answer:2,
exp:"Un capteur mesure une grandeur physique.",
comp:"C4.4 | CRCN D1.3"
},

{
q:"Quel composant détecte un mouvement ?",
img:"Images/capteur_mouvement.svg",
options:["Résistance","Détecteur PIR","Capteur analogique"],
answer:1,
exp:"Le capteur PIR détecte une présence.",
comp:"C4.4"
},

{
q:"Quel objet traite les informations ?",
img:"Images/carte_programmable.svg",
options:["Microcontrôleur","LED de signalisation","Fil de cuivre"],
answer:0,
exp:"Le microcontrôleur traite les données.",
comp:"C6.2"
},

{
q:"Quel composant agit sur le système ?",
img:"Images/moteur_cc.svg",
options:["Actionneur","Capteur","Programme"],
answer:0,
exp:"Un actionneur agit (moteur, LED…).",
comp:"C4.4"
},

{
q:"Un programme sert à :",
img:"Images/carte_programmable.svg",
options:["Charger","Commander","Décorer"],
answer:1,
exp:"Il donne les instructions.",
comp:"C6.2"
},

// 👉 35 autres différentes :

{
q:"Un chronogramme représente :",
img:"Images/signal_carre.svg",
options:["Un dessin technique","Une carte du réseau","Un signal dans le temps"],
answer:2,
exp:"Il montre l’évolution d’un signal.",
comp:"C6.1"
},

{
q:"Tester un programme permet :",
img:"Images/carte_programmable.svg",
options:["Éteindre","Valider","Supprimer"],
answer:1,
exp:"Tester valide le fonctionnement.",
comp:"C6.3"
},

{
q:"Un bug est :",
img:"Images/carte_programmable.svg",
options:["Une erreur","Un capteur","Un moteur"],
answer:0,
exp:"C’est une erreur de programme.",
comp:"C6.3"
},

{
q:"La LED est :",
img:"Images/diode_led.svg",
options:["Programme","Capteur","Actionneur"],
answer:2,
exp:"Elle agit en produisant de la lumière.",
comp:"C4.4"
},

{
q:"Une boucle permet :",
img:"Images/carte_programmable.svg",
options:["Répéter","Arrêter","Supprimer"],
answer:0,
exp:"Elle répète une action.",
comp:"C6.2"
},


{
q:"Dans un système automatisé, que fait le programme ?",
img:"Images/carte_programmable.svg",
options:["Il décide","Il casse","Il coupe"],
answer:0,
exp:"Il pilote le système.",
comp:"C6.2 | CRCN D3.4"
}

];

// Il y avait ici une boucle « compléter jusqu'à 40 uniques » qui poussait 29
// fois LA MÊME question dans la banque, avec la même bonne réponse. Le titre
// annonçait 40 questions uniques ; l'élève en voyait onze, dont une répétée
// vingt-neuf fois, et sa note était calculée sur 40. Elle est retirée : le QCM
// porte le nombre de questions qu'il a réellement, et la note se calcule
// dessus (règle n°155).

// AFFICHAGE
let quizDiv = document.getElementById("quiz");

questions.forEach((q, index) => {

let div = document.createElement("div");
div.className = "question";

let html = `<h3>${index+1}. ${q.q}</h3>`;
if (q.img) html += `<img src="${q.img}" alt=""><br>`;
html += `<p class="competence">🎯 ${q.comp}</p>`;

q.options.forEach((opt,i)=>{
html += `<label>
<input type="radio" name="q${index}" value="${i}" onclick="updateBar()"> ${opt}
</label><br>`;
});

html += `<p id="exp${index}"></p>`;

div.innerHTML = html;
quizDiv.appendChild(div);

});

// PROGRESSION
function updateBar(){
let total = document.querySelectorAll("input[type=radio]:checked").length;
let percent = total/questions.length*100;
document.getElementById("bar").style.width = percent+"%";
}

// CORRECTION
function corriger(){
let score = 0;

questions.forEach((q,index)=>{
let rep = document.querySelector(`input[name="q${index}"]:checked`);
let exp = document.getElementById(`exp${index}`);

if(rep){
if(parseInt(rep.value)===q.answer){
score++;
exp.innerHTML="✅ "+q.exp;
exp.className="correct";
bipJuste();
}else{
exp.innerHTML="❌ "+q.exp;
exp.className="wrong";
bipFaux();
}
}
});

let note=(score/questions.length*20).toFixed(1);

document.getElementById("score").innerHTML =
"Score : "+score+"/"+questions.length+" | Note : "+note+"/20";
}

// RESET
function resetQuiz(){
location.reload();
}

</script>


<script>
/* Deux petits sons, fabriqués par le navigateur lui-même (Web Audio).
   Ils remplacent deux fichiers MP3 chargés depuis un site tiers : la page
   fonctionne désormais sans réseau, et rien n'est téléchargé (règle n°40). */
const Bip = (() => {
  let ctx = null;
  const jouer = (frequences, duree) => {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      frequences.forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        const t = ctx.currentTime + i * duree;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
        o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + duree);
      });
    } catch (e) { /* pas de son disponible : ce n'est pas grave, on continue */ }
  };
  return { juste: () => jouer([660, 880], 0.12), faux: () => jouer([220], 0.22) };
})();
const bipJuste = () => Bip.juste(), bipFaux = () => Bip.faux();
</script>

<!-- loupe-images-v1 — agrandisseur d'images, règle d'or n°92. Aucune bibliothèque, aucun
     réseau. Clic ou Entrée pour agrandir, Échap ou clic dans le fond pour
     refermer. Le focus revient sur l'image quittée. -->
<style>
  .loupe-fond{position:fixed;inset:0;background:rgba(12,14,18,.92);display:none;
    z-index:9999;padding:2rem;box-sizing:border-box;overflow:auto;
    align-items:center;justify-content:center}
  .loupe-fond[data-ouvert="oui"]{display:flex}
  .loupe-fond img{max-width:100%;max-height:88vh;height:auto;
    box-shadow:0 0 0 1px rgba(255,255,255,.15),0 24px 60px rgba(0,0,0,.6);
    background:#fff;border-radius:4px}
  .loupe-legende{position:fixed;left:0;right:0;bottom:.9rem;text-align:center;
    color:#e7e9ee;font:400 .95rem/1.4 system-ui,sans-serif;padding:0 2rem}
  .loupe-fermer{position:fixed;top:.8rem;right:1rem;background:#1b1f27;
    color:#e7e9ee;border:1px solid #3a4150;border-radius:6px;
    font:600 1rem/1 system-ui,sans-serif;padding:.6rem .9rem;cursor:pointer}
  .loupe-fermer:focus-visible,.loupe-cliquable:focus-visible{outline:3px solid #ffb300;
    outline-offset:3px}
  .loupe-cliquable{cursor:zoom-in}
  @media print{.loupe-fond{display:none !important}}
  @media (prefers-reduced-motion:no-preference){
    .loupe-fond[data-ouvert="oui"] img{animation:loupe-ouvre .16s ease-out}
    @keyframes loupe-ouvre{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
  }
</style>
<script>
(function(){
  "use strict";
  var fond, grande, legende, dernier = null;

  function construire(){
    fond = document.createElement("div");
    fond.className = "loupe-fond";
    fond.setAttribute("role", "dialog");
    fond.setAttribute("aria-modal", "true");
    fond.setAttribute("aria-label", "Image agrandie");
    var bouton = document.createElement("button");
    bouton.type = "button";
    bouton.className = "loupe-fermer";
    bouton.textContent = "Fermer \u2715";
    grande = document.createElement("img");
    grande.alt = "";
    legende = document.createElement("p");
    legende.className = "loupe-legende";
    fond.appendChild(bouton); fond.appendChild(grande); fond.appendChild(legende);
    document.body.appendChild(fond);
    bouton.addEventListener("click", fermer);
    fond.addEventListener("click", function(e){ if (e.target === fond) fermer(); });
  }

  function ouvrir(img){
    if (!fond) construire();
    dernier = img;
    grande.src = img.currentSrc || img.src;
    grande.alt = img.alt || "";
    // L'alternative textuelle sert de légende : elle DIT ce que l'image montre.
    legende.textContent = img.alt ? img.alt + "  \u2014  \u00c9chap pour refermer"
                                  : "\u00c9chap pour refermer";
    fond.setAttribute("data-ouvert", "oui");
    fond.querySelector(".loupe-fermer").focus();
  }

  function fermer(){
    if (!fond) return;
    fond.removeAttribute("data-ouvert");
    grande.removeAttribute("src");
    if (dernier) { dernier.focus(); dernier = null; }
  }

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && fond && fond.getAttribute("data-ouvert")) fermer();
  });

  // Les schémas du dépôt sont souvent des SVG écrits directement dans la page.
  // On les sérialise à la volée pour les afficher en grand — sans réseau : le
  // dessin est déjà là, on ne fait que le relire.
  function ouvrirSvg(svg){
    if (!fond) construire();
    dernier = svg;
    var copie = svg.cloneNode(true);
    if (!copie.getAttribute("xmlns")) {
      copie.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    }
    var texte = new XMLSerializer().serializeToString(copie);
    grande.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(texte);
    var titre = svg.querySelector("title");
    var mot = titre ? titre.textContent : (svg.getAttribute("aria-label") || "");
    grande.alt = mot;
    legende.textContent = mot ? mot + "  \u2014  \u00c9chap pour refermer"
                              : "\u00c9chap pour refermer";
    fond.setAttribute("data-ouvert", "oui");
    fond.querySelector(".loupe-fermer").focus();
  }

  function armerSvg(){
    var dessins = document.querySelectorAll("svg");
    for (var i = 0; i < dessins.length; i++) {
      var svg = dessins[i];
      if (svg.closest(".loupe-fond")) continue;
      if (svg.dataset.loupe === "non") continue;
      // Une icône de 20 px n'a pas besoin d'être agrandie : seuls les
      // schémas, ceux qu'on doit LIRE, sont concernés.
      var boite = svg.getBoundingClientRect();
      if (boite.width < 120 || boite.height < 90) continue;
      svg.classList.add("loupe-cliquable");
      svg.setAttribute("tabindex", "0");
      svg.addEventListener("click", function(){ ouvrirSvg(this); });
      svg.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ouvrirSvg(this); }
      });
    }
  }

  function armer(){
    armerSvg();
    var images = document.querySelectorAll("img");
    for (var i = 0; i < images.length; i++) {
      var img = images[i];
      if (img.closest(".loupe-fond")) continue;
      if (img.dataset.loupe === "non") continue;      // opt-out explicite
      img.classList.add("loupe-cliquable");
      img.tabIndex = 0;
      if (!img.getAttribute("title")) {
        img.setAttribute("title", "Cliquer pour agrandir");
      }
      img.addEventListener("click", function(){ ouvrir(this); });
      img.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ouvrir(this); }
      });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", armer);
  } else {
    armer();
  }
})();
</script>
</body>
