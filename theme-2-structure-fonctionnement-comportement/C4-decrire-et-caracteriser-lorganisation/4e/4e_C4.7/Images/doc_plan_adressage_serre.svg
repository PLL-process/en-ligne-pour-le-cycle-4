<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 453" width="350" height="453" role="img" aria-labelledby="t_plan_adressage_serre d_plan_adressage_serre" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_plan_adressage_serre">Le plan d'adressage de la serre</title>
<desc id="d_plan_adressage_serre">Le plan d'adressage du réseau de la serre. PC-Prof : adresse IP 192.168.20.10, masque 255.255.255.0, passerelle 192.168.20.1. Imprimante : adresse IP 192.168.20.30, masque 255.255.255.0, passerelle 192.168.20.1. Capteur-Serre : adresse IP 192.168.20.50, masque 255.255.255.0, passerelle 192.168.20.1. Serveur-Serre : adresse IP 192.168.20.100, masque 255.255.255.0, passerelle 192.168.20.1. La passerelle 192.168.20.1 est prévue au plan, mais pas encore installée.</desc>
<rect width="350" height="453" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le plan d'adressage de la serre</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Les appareils du réseau de la serre,</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">et ce que chacun a reçu à la main.</text>
<rect x="14.0" y="87.4" width="322.0" height="170.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Appareil</text>
<text x="245.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Adresse IP</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">PC-Prof</text>
<text x="245.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">192.168.20.10</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">Imprimante</text>
<text x="245.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">192.168.20.30</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Capteur-Serre</text>
<text x="245.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">192.168.20.50</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Serveur-Serre</text>
<text x="245.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">192.168.20.100</text>
<rect x="14.0" y="273.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="303.4" font-size="16" fill="#61dafb" font-weight="700">Pour tous les appareils</text>
<text x="26.0" y="330.4" font-size="15" fill="#e4eaf5">Masque : 255.255.255.0.</text>
<text x="26.0" y="351.4" font-size="15" fill="#e4eaf5">Passerelle : 192.168.20.1, prévue, pas</text>
<text x="26.0" y="372.4" font-size="15" fill="#e4eaf5">encore installée.</text>
<text x="14.0" y="414.6" font-size="13.5" fill="#9bbefc">Le plan ne dit pas quelle adresse donner à un</text>
<text x="14.0" y="432.8" font-size="13.5" fill="#9bbefc">nouvel appareil : c'est la question.</text>
</svg>
