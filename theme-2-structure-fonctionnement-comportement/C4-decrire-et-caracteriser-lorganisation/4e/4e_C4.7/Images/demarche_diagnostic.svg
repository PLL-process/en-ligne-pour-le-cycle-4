<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">La boucle du dépanneur : symptôme, hypothèse, test, remède</title>
<desc id="d">Quatre boîtes reliées par des flèches de gauche à droite : un, observer le symptôme sans rien toucher ; deux, formuler une hypothèse ; trois, tester l'hypothèse par le test le moins invasif ; quatre, appliquer le remède puis re-tester. Une flèche de retour relie le test à l'hypothèse si le test la contredit, et une flèche finale rappelle que le re-test clôt le diagnostic.</desc>
<rect width="1080" height="380" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="378" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">La boucle du dépanneur — jamais de remède sans test</text>

<!-- boîtes -->
<g>
<rect x="40" y="90" width="220" height="130" rx="12" fill="#eef4fb" stroke="#31649c" stroke-width="2.5"/>
<circle cx="70" cy="118" r="15" fill="#31649c"/><text x="70" y="124" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">1</text>
<text x="150" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#123d66">SYMPTÔME</text>
<text x="150" y="152" text-anchor="middle" font-size="12" fill="#123d66">Observer SANS toucher :</text>
<text x="150" y="170" text-anchor="middle" font-size="12" fill="#123d66">que dit l'écran, exactement ?</text>
<text x="150" y="196" text-anchor="middle" font-size="11.5" fill="#607086" font-style="italic">« Request timed out ×4 »</text>
</g>
<g>
<rect x="310" y="90" width="220" height="130" rx="12" fill="#f4effb" stroke="#7a5aa8" stroke-width="2.5"/>
<circle cx="340" cy="118" r="15" fill="#7a5aa8"/><text x="340" y="124" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">2</text>
<text x="420" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#46326b">HYPOTHÈSE</text>
<text x="420" y="152" text-anchor="middle" font-size="12" fill="#46326b">Qui est suspect ? Viser ce qui</text>
<text x="420" y="170" text-anchor="middle" font-size="12" fill="#46326b">est SEUL en panne.</text>
<text x="420" y="196" text-anchor="middle" font-size="11.5" fill="#607086" font-style="italic">« le capteur : câble ou adresse »</text>
</g>
<g>
<rect x="580" y="90" width="220" height="130" rx="12" fill="#fdf6e3" stroke="#a8823c" stroke-width="2.5"/>
<circle cx="610" cy="118" r="15" fill="#a8823c"/><text x="610" y="124" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">3</text>
<text x="690" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#5c4a14">TEST</text>
<text x="690" y="152" text-anchor="middle" font-size="12" fill="#5c4a14">Le test le MOINS invasif qui</text>
<text x="690" y="170" text-anchor="middle" font-size="12" fill="#5c4a14">peut trancher l'hypothèse.</text>
<text x="690" y="196" text-anchor="middle" font-size="11.5" fill="#607086" font-style="italic">« lire l'IP Configuration »</text>
</g>
<g>
<rect x="850" y="90" width="200" height="130" rx="12" fill="#eafbe7" stroke="#1e7d4f" stroke-width="2.5"/>
<circle cx="880" cy="118" r="15" fill="#1e7d4f"/><text x="880" y="124" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">4</text>
<text x="950" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#0a3d1f">REMÈDE</text>
<text x="950" y="152" text-anchor="middle" font-size="12" fill="#0a3d1f">Réparer la cause prouvée…</text>
<text x="950" y="170" text-anchor="middle" font-size="12" fill="#0a3d1f">puis RE-TESTER !</text>
<text x="950" y="196" text-anchor="middle" font-size="11.5" fill="#607086" font-style="italic">« remettre .20.50 → ping ✓ »</text>
</g>

<!-- flèches -->
<g stroke="#31475a" stroke-width="3" fill="#31475a">
<line x1="260" y1="155" x2="298" y2="155"/><path d="M298 148 l14 7 l-14 7 z"/>
<line x1="530" y1="155" x2="568" y2="155"/><path d="M568 148 l14 7 l-14 7 z"/>
<line x1="800" y1="155" x2="838" y2="155"/><path d="M838 148 l14 7 l-14 7 z"/>
</g>
<!-- boucle retour -->
<path d="M690 220 v52 H420 v-46" fill="none" stroke="#b34a4a" stroke-width="2.5" stroke-dasharray="8 6"/>
<path d="M413 232 l7 -14 l7 14 z" fill="#b34a4a"/>
<text x="555" y="292" text-anchor="middle" font-size="12.5" fill="#7a1f1f" font-weight="bold">test contredit ? → nouvelle hypothèse (on ne s'entête pas)</text>

<!-- règle d'or -->
<rect x="220" y="316" width="640" height="46" rx="10" fill="#12335e"/>
<text x="540" y="336" text-anchor="middle" font-size="13.5" fill="#ffffff" font-weight="bold">Règle du bon dépanneur : jamais de remède sans test — jamais de « réparé » sans RE-test.</text>
<text x="540" y="354" text-anchor="middle" font-size="12" fill="#bcd3f2">(le débranchage au hasard détruit les indices et masque la vraie cause)</text>
</svg>
