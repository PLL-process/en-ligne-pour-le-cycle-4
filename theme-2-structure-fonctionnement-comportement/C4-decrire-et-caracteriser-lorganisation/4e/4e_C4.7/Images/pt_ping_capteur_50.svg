<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">LA preuve de la compétence : le ping vers le capteur qu'on vient d'ajouter (192.168.20.50)</title>
<desc id="d">Transcription réelle du terminal de PC-Prof : la commande ping 192.168.20.50 vers le Capteur-Serre. Quatre réponses Reply from 192.168.20.50, zéro pour cent de perte, temps de zéro à un milliseconde, TTL cent vingt-huit. Un encadré rappelle que ce test-là est la preuve directe que l'objet connecté qu'on vient de paramétrer est joignable, et un second encadré prévient que le tout premier ping peut perdre un ou deux paquets pendant que le réseau apprend les correspondances d'adresses : relancer avant de conclure.</desc>
<rect width="1080" height="420" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="418" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">LA preuve de C4.7 : l'objet AJOUTÉ répond — ping vers le Capteur-Serre</text>

<!-- terminal -->
<g>
<rect x="45" y="52" width="600" height="300" rx="8" fill="#101820"/>
<rect x="45" y="52" width="600" height="24" rx="8" fill="#31475a"/>
<text x="60" y="69" font-size="12" fill="#fff" font-weight="bold">PC-Prof — Command Prompt (transcription réelle)</text>
<g font-family="Consolas, monospace" font-size="13" fill="#e8eef4">
<text x="62" y="100">C:\&gt; ping 192.168.20.50</text>
<text x="62" y="126" fill="#8fa8bf">Pinging 192.168.20.50 with 32 bytes of data:</text>
<text x="62" y="152" fill="#c5e1a5">Reply from 192.168.20.50: bytes=32 time&lt;1ms TTL=128</text>
<text x="62" y="174" fill="#c5e1a5">Reply from 192.168.20.50: bytes=32 time&lt;1ms TTL=128</text>
<text x="62" y="196" fill="#c5e1a5">Reply from 192.168.20.50: bytes=32 time=1ms TTL=128</text>
<text x="62" y="218" fill="#c5e1a5">Reply from 192.168.20.50: bytes=32 time&lt;1ms TTL=128</text>
<text x="62" y="248" fill="#8fa8bf">Ping statistics for 192.168.20.50:</text>
<text x="62" y="270" fill="#81fba1">    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),</text>
<text x="62" y="292" fill="#8fa8bf">Approximate round trip times in milli-seconds:</text>
<text x="62" y="312" fill="#8fa8bf">    Minimum = 0ms, Maximum = 1ms, Average = 0ms</text>
</g>
<text x="345" y="343" text-anchor="middle" font-size="11.5" fill="#d9c48a">valeurs réellement observées pendant notre simulation Packet Tracer 8.2</text>
</g>

<!-- encadrés -->
<g>
<rect x="675" y="52" width="360" height="140" rx="10" fill="#eafbe7" stroke="#1e7d4f" stroke-width="2.5"/>
<text x="855" y="78" text-anchor="middle" font-size="13.5" fill="#0a3d1f" font-weight="bold">🎯 Pourquoi CE ping-là ?</text>
<text x="855" y="102" text-anchor="middle" font-size="12" fill="#0a3d1f">La mission = AJOUTER le capteur au réseau.</text>
<text x="855" y="120" text-anchor="middle" font-size="12" fill="#0a3d1f">La preuve = le capteur RÉPOND.</text>
<text x="855" y="144" text-anchor="middle" font-size="12" fill="#0a3d1f">Les 4 paquets de CE test sont revenus :</text>
<text x="855" y="162" text-anchor="middle" font-size="12" fill="#0a3d1f">0 % de perte PENDANT ce ping.</text>
<text x="855" y="182" text-anchor="middle" font-size="11" fill="#3d6b4a">(un ping réussi ne teste que ce trajet-là, à cet instant-là)</text>
</g>
<rect x="675" y="212" width="360" height="140" rx="10" fill="#fdf6e3" stroke="#a8823c" stroke-width="2.5"/>
<text x="855" y="238" text-anchor="middle" font-size="13.5" fill="#5c4a14" font-weight="bold">⚠ Premier ping : ne panique pas</text>
<text x="855" y="262" text-anchor="middle" font-size="12" fill="#5c4a14">Le tout premier essai peut perdre 1 ou 2 paquets</text>
<text x="855" y="280" text-anchor="middle" font-size="12" fill="#5c4a14">pendant que le réseau apprend les correspondances</text>
<text x="855" y="298" text-anchor="middle" font-size="12" fill="#5c4a14">d'adresses. RELANCE le même ping une 2e fois</text>
<text x="855" y="316" text-anchor="middle" font-size="12" fill="#5c4a14">avant de conclure à une panne.</text>
<text x="855" y="340" text-anchor="middle" font-size="11" fill="#8a6d1d">(vécu dans notre session réelle — et en salle info !)</text>

<!-- bandeau bas -->
<rect x="45" y="372" width="990" height="36" rx="10" fill="#eef4fb" stroke="#31649c" stroke-width="2"/>
<text x="540" y="395" text-anchor="middle" font-size="12.5" fill="#123d66" font-weight="bold">Ordre des preuves : ① ping vers le CAPTEUR (l'objet de la mission) — puis ② serveur et imprimante en validation complémentaire.</text>
</svg>
