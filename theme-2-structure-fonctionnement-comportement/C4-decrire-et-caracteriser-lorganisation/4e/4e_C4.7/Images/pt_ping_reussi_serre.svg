<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Transcription réelle des deux pings réussis depuis PC-Prof</title>
<desc id="d">Un terminal noir reconstitué d'après Packet Tracer 8.2. Premier test : ping 192.168.20.100 vers le serveur, quatre réponses Reply from avec des temps de moins d'une milliseconde à deux millisecondes, TTL 128, bilan quatre envoyés quatre reçus zéro perdu, zéro pour cent de perte. Deuxième test : ping 192.168.20.30 vers l'imprimante, quatre réponses avec des temps de moins d'une milliseconde à douze millisecondes, bilan zéro pour cent de perte, moyenne cinq millisecondes. Des annotations pédagogiques pointent les lignes importantes.</desc>
<rect width="1080" height="620" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="618" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">La preuve par le ping — nos deux mesures réelles (PC-Prof → serveur, puis → imprimante)</text>

<!-- terminal -->
<rect x="40" y="56" width="720" height="540" rx="8" fill="#0c0c0c" stroke="#60778c" stroke-width="2"/>
<rect x="40" y="56" width="720" height="26" rx="8" fill="#32658f"/>
<text x="56" y="74" font-size="13" fill="#fff">PC-Prof — Desktop → Command Prompt</text>
<g font-family="Consolas, monospace" font-size="13.2" fill="#d7d7d7">
<text x="58" y="106">C:\&gt;ping 192.168.20.100</text>
<text x="58" y="130">Pinging 192.168.20.100 with 32 bytes of data:</text>
<text x="58" y="158" fill="#8ff0a4">Reply from 192.168.20.100: bytes=32 time=2ms TTL=128</text>
<text x="58" y="180" fill="#8ff0a4">Reply from 192.168.20.100: bytes=32 time&lt;1ms TTL=128</text>
<text x="58" y="202" fill="#8ff0a4">Reply from 192.168.20.100: bytes=32 time&lt;1ms TTL=128</text>
<text x="58" y="224" fill="#8ff0a4">Reply from 192.168.20.100: bytes=32 time&lt;1ms TTL=128</text>
<text x="58" y="252">Ping statistics for 192.168.20.100:</text>
<text x="58" y="274" fill="#ffd66b">    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),</text>
<text x="58" y="296">Approximate round trip times in milli-seconds:</text>
<text x="58" y="318">    Minimum = 0ms, Maximum = 2ms, Average = 0ms</text>
<text x="58" y="354">C:\&gt;ping 192.168.20.30</text>
<text x="58" y="378">Pinging 192.168.20.30 with 32 bytes of data:</text>
<text x="58" y="406" fill="#8ff0a4">Reply from 192.168.20.30: bytes=32 time&lt;1ms TTL=128</text>
<text x="58" y="428" fill="#8ff0a4">Reply from 192.168.20.30: bytes=32 time=12ms TTL=128</text>
<text x="58" y="450" fill="#8ff0a4">Reply from 192.168.20.30: bytes=32 time=11ms TTL=128</text>
<text x="58" y="472" fill="#8ff0a4">Reply from 192.168.20.30: bytes=32 time&lt;1ms TTL=128</text>
<text x="58" y="500">Ping statistics for 192.168.20.30:</text>
<text x="58" y="522" fill="#ffd66b">    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),</text>
<text x="58" y="544">Approximate round trip times in milli-seconds:</text>
<text x="58" y="566">    Minimum = 0ms, Maximum = 12ms, Average = 5ms</text>
</g>

<!-- annotations -->
<g font-size="12.5">
<rect x="790" y="140" width="266" height="96" rx="8" fill="#eafbe7" stroke="#1e7d4f" stroke-width="2"/>
<text x="923" y="164" text-anchor="middle" fill="#0a3d1f" font-weight="bold">« Reply from » ×4</text>
<text x="923" y="184" text-anchor="middle" fill="#0a3d1f">l'aller-retour a réussi</text>
<text x="923" y="202" text-anchor="middle" fill="#0a3d1f">quatre fois : la livraison</text>
<text x="923" y="220" text-anchor="middle" fill="#0a3d1f">est PROUVÉE</text>
<line x1="790" y1="188" x2="742" y2="190" stroke="#1e7d4f" stroke-width="2"/>

<rect x="790" y="252" width="266" height="76" rx="8" fill="#fdf6e3" stroke="#a8823c" stroke-width="2"/>
<text x="923" y="276" text-anchor="middle" fill="#5c4a14" font-weight="bold">Le bilan à lire en premier :</text>
<text x="923" y="296" text-anchor="middle" fill="#5c4a14">Lost = 0 (0% loss)</text>
<text x="923" y="314" text-anchor="middle" fill="#5c4a14">= aucun message perdu</text>
<line x1="790" y1="278" x2="742" y2="274" stroke="#a8823c" stroke-width="2"/>

<rect x="790" y="400" width="266" height="112" rx="8" fill="#eef4fb" stroke="#31649c" stroke-width="2"/>
<text x="923" y="424" text-anchor="middle" fill="#123d66" font-weight="bold">Des temps qui varient :</text>
<text x="923" y="444" text-anchor="middle" fill="#123d66">&lt;1 ms … 12 ms (moy. 5 ms)</text>
<text x="923" y="464" text-anchor="middle" fill="#123d66">C'est NORMAL sur un réseau</text>
<text x="923" y="482" text-anchor="middle" fill="#123d66">local en bonne santé — le</text>
<text x="923" y="500" text-anchor="middle" fill="#123d66">vrai signal, c'est la PERTE.</text>
<line x1="790" y1="440" x2="742" y2="430" stroke="#31649c" stroke-width="2"/>
</g>
<text x="540" y="608" text-anchor="middle" font-size="11.5" fill="#607086">Valeurs réellement mesurées lors de notre session Packet Tracer 8.2 (montage 4e_serre_TECHNO-C4.pkt).</text>
</svg>
