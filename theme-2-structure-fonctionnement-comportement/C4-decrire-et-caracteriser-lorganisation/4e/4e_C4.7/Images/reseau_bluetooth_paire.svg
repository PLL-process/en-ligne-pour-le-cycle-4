<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" width="620" height="280" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<title id="t">Une liaison Bluetooth entre deux appareils</title>
<desc id="d">Un téléphone et une enceinte reliés par des ondes sur une dizaine de mètres, après un appairage fait une seule fois. Le Bluetooth relie deux appareils entre eux : ce n'est pas un réseau, c'est un lien.</desc>
<rect width="620" height="280" fill="#ffffff"/>
<rect x="60" y="100" width="150" height="80" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="135" y="145" font-size="14" text-anchor="middle" fill="#0f172a">Téléphone</text><rect x="410" y="100" width="150" height="80" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="485" y="145" font-size="14" text-anchor="middle" fill="#0f172a">Enceinte</text><path d="M220,130 a10,10 0 0,1 0,20" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.78"/><path d="M220,120 a20,20 0 0,1 0,40" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.56"/><path d="M220,110 a30,30 0 0,1 0,60" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.34"/><text x="310" y="80" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="700">appairage : une fois pour toutes</text><text x="310" y="225" font-size="12" text-anchor="middle" fill="#64748b">deux appareils, l'un avec l'autre, sur une dizaine de mètres</text><text x="310" y="250" font-size="12" text-anchor="middle" fill="#64748b" font-weight="700">ce n'est pas un réseau : c'est un lien</text>
</svg>
