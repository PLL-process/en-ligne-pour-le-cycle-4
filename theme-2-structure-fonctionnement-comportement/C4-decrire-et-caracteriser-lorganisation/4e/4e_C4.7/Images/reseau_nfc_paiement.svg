<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<title id="t">Le paiement sans contact par NFC</title>
<desc id="d">Une carte à gauche et un terminal à droite échangent par ondes sur quelques centimètres seulement. Cette portée très courte est justement ce qui protège l'échange.</desc>
<rect width="620" height="300" fill="#ffffff"/>
<rect x="60" y="110" width="150" height="90" rx="8" fill="#dbeafe" stroke="#1d4e89" stroke-width="2"/><text x="135" y="160" font-size="14" text-anchor="middle" fill="#0f172a">Carte</text><rect x="400" y="110" width="150" height="90" rx="8" fill="#dbeafe" stroke="#1d4e89" stroke-width="2"/><text x="475" y="160" font-size="14" text-anchor="middle" fill="#0f172a">Terminal</text><path d="M230,145 a10,10 0 0,1 0,20" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.78"/><path d="M230,135 a20,20 0 0,1 0,40" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.56"/><path d="M230,125 a30,30 0 0,1 0,60" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.34"/><path d="M380,145 a10,10 0 0,1 0,20" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.78"/><path d="M380,135 a20,20 0 0,1 0,40" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.56"/><path d="M380,125 a30,30 0 0,1 0,60" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.34"/><text x="305" y="90" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="700">quelques centimètres</text><path d="M230,240 L380,240" stroke="#c2410c" stroke-width="2" marker-end="url(#f)"/><defs><marker id="f" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#c2410c"/></marker></defs><text x="305" y="270" font-size="12" text-anchor="middle" fill="#64748b">la portée très courte EST la sécurité</text>
</svg>
