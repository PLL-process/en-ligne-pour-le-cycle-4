<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<title id="t">Un câble RJ45 et sa prise</title>
<desc id="d">Un câble laissant voir quatre paires de fils torsadées, une prise, et un connecteur à huit broches. Les paires sont torsadées pour résister aux perturbations électriques.</desc>
<rect width="480" height="270" fill="#ffffff"/>
<rect x="40" y="90" width="80" height="66" rx="8" fill="#e4eefb" stroke="#64748b" stroke-width="2"/><rect x="120" y="96" width="60" height="9" rx="3" fill="#c2410c"/><rect x="120" y="110" width="60" height="9" rx="3" fill="#0f766e"/><rect x="120" y="124" width="60" height="9" rx="3" fill="#1d4e89"/><rect x="120" y="138" width="60" height="9" rx="3" fill="#a16207"/><rect x="180" y="80" width="120" height="86" rx="8" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="240" y="130" font-size="13" text-anchor="middle" fill="#0f172a">prise</text><rect x="320" y="60" width="110" height="60" rx="6" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="330" y="70" width="6" height="24" fill="#64748b"/><rect x="342" y="70" width="6" height="24" fill="#64748b"/><rect x="354" y="70" width="6" height="24" fill="#64748b"/><rect x="366" y="70" width="6" height="24" fill="#64748b"/><rect x="378" y="70" width="6" height="24" fill="#64748b"/><rect x="390" y="70" width="6" height="24" fill="#64748b"/><rect x="402" y="70" width="6" height="24" fill="#64748b"/><rect x="414" y="70" width="6" height="24" fill="#64748b"/><text x="375" y="145" font-size="12" text-anchor="middle" fill="#64748b">8 broches</text><text x="240" y="215" font-size="13" text-anchor="middle" fill="#64748b">quatre paires torsadées, huit broches : c'est ça, RJ45</text><text x="240" y="240" font-size="12" text-anchor="middle" fill="#64748b">les paires sont torsadées pour se protéger du bruit</text>
</svg>
