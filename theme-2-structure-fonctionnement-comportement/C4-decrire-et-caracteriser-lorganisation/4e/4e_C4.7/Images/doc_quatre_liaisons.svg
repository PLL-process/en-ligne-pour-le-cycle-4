<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 381" width="350" height="381" role="img" aria-labelledby="t_quatre_liaisons d_quatre_liaisons" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_quatre_liaisons">Quatre liaisons sans fil</title>
<desc id="d_quatre_liaisons">Quatre liaisons sans fil, en ordres de grandeur. Wi-Fi : portée 50 m, débit 100 Mbit/s (mégabits par seconde), consommation forte. Bluetooth : portée 10 m, débit 2 Mbit/s, consommation moyenne. Zigbee : portée 10 à 100 m, débit 250 kbit/s (kilobits par seconde), consommation faible. NFC : portée 5 cm, débit 400 kbit/s, consommation faible. Le document ne dit pas quelle liaison choisir.</desc>
<rect width="350" height="381" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Quatre liaisons sans fil</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Ordres de grandeur. Débit en</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">Mbit/s (mégabits par seconde) ou</text>
<text x="14.0" y="89.6" font-size="13.5" fill="#9bbefc">en kbit/s (kilobits par seconde).</text>
<rect x="14.0" y="105.6" width="322.0" height="170.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="127.6" font-size="13.5" fill="#61dafb" font-weight="700">Liaison</text>
<text x="132.0" y="127.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Portée</text>
<text x="211.0" y="127.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Débit</text>
<text x="294.0" y="127.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Énergie</text>
<line x1="14" y1="139.6" x2="336" y2="139.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="161.6" font-size="15" fill="#e4eaf5" font-weight="700">Wi-Fi</text>
<text x="132.0" y="161.6" font-size="15" fill="#e4eaf5" text-anchor="middle">50 m</text>
<text x="211.0" y="161.6" font-size="15" fill="#e4eaf5" text-anchor="middle">100 Mbit/s</text>
<text x="294.0" y="161.6" font-size="15" fill="#e4eaf5" text-anchor="middle">forte</text>
<line x1="14" y1="173.6" x2="336" y2="173.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="195.6" font-size="15" fill="#e4eaf5" font-weight="700">Bluetooth</text>
<text x="132.0" y="195.6" font-size="15" fill="#e4eaf5" text-anchor="middle">10 m</text>
<text x="211.0" y="195.6" font-size="15" fill="#e4eaf5" text-anchor="middle">2 Mbit/s</text>
<text x="294.0" y="195.6" font-size="15" fill="#e4eaf5" text-anchor="middle">moyenne</text>
<line x1="14" y1="207.6" x2="336" y2="207.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="229.6" font-size="15" fill="#e4eaf5" font-weight="700">Zigbee</text>
<text x="132.0" y="229.6" font-size="15" fill="#e4eaf5" text-anchor="middle">10 à 100 m</text>
<text x="211.0" y="229.6" font-size="15" fill="#e4eaf5" text-anchor="middle">250 kbit/s</text>
<text x="294.0" y="229.6" font-size="15" fill="#e4eaf5" text-anchor="middle">faible</text>
<line x1="14" y1="241.6" x2="336" y2="241.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="263.6" font-size="15" fill="#e4eaf5" font-weight="700">NFC</text>
<text x="132.0" y="263.6" font-size="15" fill="#e4eaf5" text-anchor="middle">5 cm</text>
<text x="211.0" y="263.6" font-size="15" fill="#e4eaf5" text-anchor="middle">400 kbit/s</text>
<text x="294.0" y="263.6" font-size="15" fill="#e4eaf5" text-anchor="middle">faible</text>
<text x="14.0" y="305.8" font-size="13.5" fill="#9bbefc">Portée : la distance que couvre un appareil · cm :</text>
<text x="14.0" y="324.0" font-size="13.5" fill="#9bbefc">centimètres · Énergie : ce qu'il consomme pour</text>
<text x="14.0" y="342.3" font-size="13.5" fill="#9bbefc">émettre · Le document ne dit pas quelle liaison</text>
<text x="14.0" y="360.5" font-size="13.5" fill="#9bbefc">choisir : c'est la question.</text>
</svg>
