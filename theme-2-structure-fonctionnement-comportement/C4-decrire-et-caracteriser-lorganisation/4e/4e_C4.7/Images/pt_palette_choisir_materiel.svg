<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Où cliquer pour choisir son matériel : la palette du bas de l'écran, en trois clics numérotés</title>
<desc id="d">Reconstitution de la palette de Packet Tracer, en bas à gauche de l'écran. Clic un : dans la rangée des catégories, l'icône Network Devices (les appareils réseau). Clic deux : dans la rangée des sous-familles, Switches (les commutateurs), puis le modèle 2960 apparaît dans la liste. Clic trois : cliquer le modèle 2960 puis cliquer sur le plan de travail pour le poser. Le même chemin avec End Devices donne les terminaux : PC, Server, Printer.</desc>
<rect width="1080" height="460" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="458" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Choisir son matériel — la palette en bas de l'écran (3 clics, dans l'ordre)</text>

<!-- palette reconstituée -->
<g>
<rect x="60" y="60" width="620" height="210" rx="6" fill="#e9edf2" stroke="#60778c" stroke-width="2"/>
<!-- rangée catégories -->
<text x="76" y="86" font-size="11.5" fill="#607086" font-weight="bold">Catégories :</text>
<g>
<rect x="76" y="96" width="46" height="40" rx="4" fill="#cfd9e4" stroke="#8b9aa9"/>
<text x="99" y="121" text-anchor="middle" font-size="15">🖧</text>
<rect x="76" y="96" width="46" height="40" rx="4" fill="none" stroke="#d23a3a" stroke-width="3"/>
<rect x="128" y="96" width="46" height="40" rx="4" fill="#cfd9e4" stroke="#8b9aa9"/>
<text x="151" y="121" text-anchor="middle" font-size="15">🖥️</text>
<rect x="180" y="96" width="46" height="40" rx="4" fill="#cfd9e4" stroke="#8b9aa9"/>
<text x="203" y="121" text-anchor="middle" font-size="15">⚡</text>
</g>
<text x="99" y="152" text-anchor="middle" font-size="9.5" fill="#31475a">Network</text>
<text x="99" y="163" text-anchor="middle" font-size="9.5" fill="#31475a">Devices</text>
<text x="151" y="152" text-anchor="middle" font-size="9.5" fill="#31475a">End</text>
<text x="151" y="163" text-anchor="middle" font-size="9.5" fill="#31475a">Devices</text>
<text x="203" y="152" text-anchor="middle" font-size="9.5" fill="#31475a">Connections</text>
<!-- rangée sous-familles -->
<text x="76" y="188" font-size="11.5" fill="#607086" font-weight="bold">Sous-familles :</text>
<rect x="76" y="196" width="70" height="26" rx="4" fill="#cfd9e4" stroke="#8b9aa9"/>
<text x="111" y="213" text-anchor="middle" font-size="10.5" fill="#31475a">Switches</text>
<rect x="76" y="196" width="70" height="26" rx="4" fill="none" stroke="#d23a3a" stroke-width="3"/>
<rect x="152" y="196" width="70" height="26" rx="4" fill="#cfd9e4" stroke="#8b9aa9"/>
<text x="187" y="213" text-anchor="middle" font-size="10.5" fill="#31475a">Routers</text>
<!-- modèles -->
<rect x="300" y="96" width="360" height="126" rx="4" fill="#ffffff" stroke="#8b9aa9"/>
<text x="316" y="118" font-size="11.5" fill="#607086" font-weight="bold">Modèles proposés :</text>
<g>
<rect x="320" y="130" width="64" height="46" rx="4" fill="#eef4fb" stroke="#31649c"/>
<rect x="330" y="146" width="44" height="14" rx="2" fill="#2f6d8f"/>
<text x="352" y="192" text-anchor="middle" font-size="10.5" fill="#123d66" font-weight="bold">2960</text>
<rect x="320" y="130" width="64" height="46" rx="4" fill="none" stroke="#d23a3a" stroke-width="3"/>
<rect x="400" y="130" width="64" height="46" rx="4" fill="#f4f6f9" stroke="#9aaabc"/>
<rect x="412" y="140" width="40" height="24" rx="2" fill="#c3ced9"/>
<text x="432" y="192" text-anchor="middle" font-size="10.5" fill="#607086">autre…</text>
</g>
<!-- numéros -->
<circle cx="60" cy="96" r="15" fill="#d23a3a"/><text x="60" y="102" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">①</text>
<circle cx="60" cy="196" r="15" fill="#d23a3a"/><text x="60" y="202" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">②</text>
<circle cx="300" cy="130" r="15" fill="#d23a3a"/><text x="300" y="136" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">③</text>
</g>

<!-- côté droit : End Devices -->
<rect x="720" y="60" width="300" height="210" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<text x="870" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#31475a">Et pour les terminaux ?</text>
<text x="870" y="112" text-anchor="middle" font-size="12" fill="#5c4a14">Même chemin, catégorie 🖥️ End Devices :</text>
<g font-size="12" fill="#31475a">
<text x="745" y="140">• <tspan font-weight="bold">PC</tspan> → PC-Prof et Capteur-Serre</text>
<text x="745" y="164">• <tspan font-weight="bold">Server</tspan> → Serveur-Serre</text>
<text x="745" y="188">• <tspan font-weight="bold">Printer</tspan> → Imprimante</text>
</g>
<text x="870" y="222" text-anchor="middle" font-size="11.5" fill="#8a6d1d">③ toujours pareil : cliquer le modèle,</text>
<text x="870" y="238" text-anchor="middle" font-size="11.5" fill="#8a6d1d">puis cliquer sur le plan de travail pour POSER.</text>

<!-- bandeau -->
<rect x="60" y="292" width="960" height="60" rx="10" fill="#fdf6e3" stroke="#a8823c" stroke-width="2"/>
<text x="540" y="316" text-anchor="middle" font-size="13" fill="#5c4a14" font-weight="bold">Le réflexe : CATÉGORIE (rangée du haut) → SOUS-FAMILLE (rangée du bas) → MODÈLE → clic sur le plan.</text>
<text x="540" y="338" text-anchor="middle" font-size="12" fill="#5c4a14">Si tu ne vois pas « 2960 » : vérifie que tu es bien sur Network Devices puis Switches (clics ① et ②).</text>

<rect x="60" y="372" width="960" height="60" rx="10" fill="#eef4fb" stroke="#31649c" stroke-width="2"/>
<text x="540" y="396" text-anchor="middle" font-size="12.5" fill="#123d66" font-weight="bold">💡 Notre montage complet : 1 commutateur 2960 + 2 PC + 1 Server + 1 Printer — 5 appareils, posés en étoile.</text>
<text x="540" y="418" text-anchor="middle" font-size="11.5" fill="#123d66">Figure reconstituée d'après le vrai logiciel (Packet Tracer 8.2) — les intitulés sont ceux que tu verras à l'écran.</text>
</svg>
