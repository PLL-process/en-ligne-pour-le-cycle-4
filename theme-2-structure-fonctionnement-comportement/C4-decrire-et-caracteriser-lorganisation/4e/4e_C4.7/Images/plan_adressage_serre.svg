<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Le plan d'adressage de référence de la serre : la rue 192.168.20 et ses habitants</title>
<desc id="d">Une rue horizontale nommée 192.168.20. Tout à gauche, une porte marquée .1 réservée à la passerelle. Le long de la rue, quatre maisons : PC-Prof au numéro 10, Imprimante au numéro 30, Capteur-Serre au numéro 50 signalé comme le nouvel arrivant, Serveur-Serre au numéro 100. Sous la rue, le panneau du masque 255.255.255.0 commun à tous.</desc>
<rect width="1080" height="430" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="428" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Le plan de référence de la serre — rue 192.168.20</text>

<!-- la rue -->
<rect x="60" y="250" width="960" height="44" fill="#c8cfd6"/>
<line x1="60" y1="272" x2="1020" y2="272" stroke="#ffffff" stroke-width="3" stroke-dasharray="20 14"/>
<rect x="380" y="305" width="320" height="30" rx="15" fill="#12335e"/>
<text x="540" y="326" text-anchor="middle" font-size="15" fill="#ffffff" font-family="Consolas, monospace">rue « 192.168.20 »</text>

<!-- passerelle (porte) -->
<g>
<rect x="80" y="150" width="120" height="100" rx="6" fill="#eef1f4" stroke="#8a6d1d" stroke-width="2.5" stroke-dasharray="7 5"/>
<path d="M118 250 v-58 a22 22 0 0 1 44 0 v58 z" fill="#8a6d1d"/>
<circle cx="152" cy="222" r="3.5" fill="#f2e2b8"/>
<text x="140" y="138" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6d1d">passerelle (gateway)</text>
<rect x="98" y="258" width="84" height="24" rx="12" fill="#8a6d1d"/>
<text x="140" y="275" text-anchor="middle" font-size="14" fill="#fff" font-family="Consolas, monospace" font-weight="bold">.1</text>
<text x="140" y="365" text-anchor="middle" font-size="11.5" fill="#5c4a14">numéro RÉSERVÉ —</text>
<text x="140" y="381" text-anchor="middle" font-size="11.5" fill="#5c4a14">la porte de sortie du quartier</text>
</g>

<!-- maisons -->
<!-- PC-Prof -->
<g>
<rect x="270" y="170" width="130" height="80" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<path d="M262 170 L335 120 L408 170 Z" fill="#31475a"/>
<rect x="300" y="196" width="70" height="38" rx="3" fill="#173666"/>
<rect x="306" y="202" width="58" height="22" fill="#61dafb" opacity="0.85"/>
<text x="335" y="108" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#31475a">PC-Prof</text>
<rect x="303" y="258" width="64" height="24" rx="12" fill="#1d4e89"/>
<text x="335" y="275" text-anchor="middle" font-size="13.5" fill="#fff" font-family="Consolas, monospace" font-weight="bold">.10</text>
</g>
<!-- Imprimante -->
<g>
<rect x="470" y="170" width="130" height="80" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<path d="M462 170 L535 120 L608 170 Z" fill="#31475a"/>
<rect x="500" y="200" width="70" height="26" rx="4" fill="#455d72"/>
<rect x="512" y="188" width="46" height="12" fill="#eef1f4" stroke="#455d72"/>
<rect x="512" y="228" width="46" height="10" fill="#eef1f4" stroke="#455d72"/>
<text x="535" y="108" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#31475a">Imprimante</text>
<rect x="503" y="258" width="64" height="24" rx="12" fill="#1d4e89"/>
<text x="535" y="275" text-anchor="middle" font-size="13.5" fill="#fff" font-family="Consolas, monospace" font-weight="bold">.30</text>
</g>
<!-- Capteur -->
<g>
<rect x="670" y="170" width="130" height="80" fill="#eafbe7" stroke="#1e7d4f" stroke-width="3"/>
<path d="M662 170 L735 120 L808 170 Z" fill="#1e7d4f"/>
<circle cx="735" cy="210" r="20" fill="#ffffff" stroke="#1e7d4f" stroke-width="2.5"/>
<path d="M735 198 v12 l8 6" stroke="#1e7d4f" stroke-width="2.5" fill="none"/>
<text x="735" y="108" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e7d4f">Capteur-Serre 🌡</text>
<rect x="703" y="258" width="64" height="24" rx="12" fill="#1e7d4f"/>
<text x="735" y="275" text-anchor="middle" font-size="13.5" fill="#fff" font-family="Consolas, monospace" font-weight="bold">.50</text>
<text x="735" y="365" text-anchor="middle" font-size="11.5" fill="#1e7d4f" font-weight="bold">le nouvel arrivant :</text>
<text x="735" y="381" text-anchor="middle" font-size="11.5" fill="#1e7d4f">adresse FIXE à paramétrer</text>
</g>
<!-- Serveur -->
<g>
<rect x="870" y="150" width="130" height="100" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<path d="M862 150 L935 104 L1008 150 Z" fill="#31475a"/>
<rect x="898" y="166" width="74" height="16" rx="3" fill="#455d72"/><circle cx="962" cy="174" r="3.5" fill="#81fba1"/>
<rect x="898" y="188" width="74" height="16" rx="3" fill="#455d72"/><circle cx="962" cy="196" r="3.5" fill="#81fba1"/>
<rect x="898" y="210" width="74" height="16" rx="3" fill="#455d72"/><circle cx="962" cy="218" r="3.5" fill="#81fba1"/>
<text x="935" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#31475a">Serveur-Serre</text>
<rect x="903" y="258" width="64" height="24" rx="12" fill="#1d4e89"/>
<text x="935" y="275" text-anchor="middle" font-size="13.5" fill="#fff" font-family="Consolas, monospace" font-weight="bold">.100</text>
</g>

<!-- panneau masque -->
<rect x="300" y="355" width="480" height="52" rx="10" fill="#fdf6e3" stroke="#a8823c" stroke-width="2"/>
<text x="540" y="377" text-anchor="middle" font-size="13.5" fill="#5c4a14" font-weight="bold">Panneau du quartier — masque : <tspan font-family="Consolas, monospace">255.255.255.0</tspan></text>
<text x="540" y="397" text-anchor="middle" font-size="12" fill="#5c4a14">« les 3 premiers nombres = la rue · le dernier = la maison » — le même pour TOUS</text>
</svg>
