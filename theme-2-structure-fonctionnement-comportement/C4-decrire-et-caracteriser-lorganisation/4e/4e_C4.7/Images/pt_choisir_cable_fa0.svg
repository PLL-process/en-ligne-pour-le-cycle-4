<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Où cliquer pour câbler : le bon câble dans la palette Connections, puis la bonne prise FastEthernet0</title>
<desc id="d">Deux panneaux. À gauche, la palette Connections ouverte avec l'éclair orange : dans la liste des câbles, Copper Straight-Through, le câble droit, est entouré en rouge — c'est lui pour relier un terminal au commutateur ; Copper Cross-Over, le câble croisé, est barré pour ce montage. À droite, la petite fenêtre qui s'ouvre au clic sur un appareil : la liste des prises, avec FastEthernet0 entouré — c'est la prise réseau du terminal ; côté commutateur, on choisit une prise FastEthernet parmi les vingt-quatre.</desc>
<rect width="1080" height="460" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="458" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Câbler = 2 choix : le bon CÂBLE, puis la bonne PRISE</text>

<!-- panneau gauche : choix du câble -->
<g>
<rect x="50" y="56" width="460" height="290" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="76" cy="82" r="15" fill="#d23a3a"/><text x="76" y="88" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">①</text>
<text x="280" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">La palette Connections (l'éclair ⚡)</text>
<rect x="76" y="104" width="408" height="196" rx="6" fill="#e9edf2" stroke="#8b9aa9"/>
<g>
<rect x="92" y="118" width="40" height="34" rx="4" fill="#cfd9e4" stroke="#8b9aa9"/>
<text x="112" y="141" text-anchor="middle" font-size="14">⚡</text>
<text x="112" y="166" text-anchor="middle" font-size="9" fill="#31475a">Connections</text>
</g>
<g font-size="12" font-family="Consolas, monospace">
<text x="160" y="136" fill="#607086">Automatique (à éviter : on apprend !)</text>
<rect x="152" y="148" width="320" height="28" rx="6" fill="#eafbe7" stroke="#1e7d4f" stroke-width="2.5"/>
<text x="164" y="167" fill="#0a3d1f" font-weight="bold">━━━━ Copper Straight-Through</text>
<text x="160" y="200" fill="#8a2b2b">╌╌╌╌ Copper Cross-Over</text>
<line x1="160" y1="196" x2="356" y2="196" stroke="#d23a3a" stroke-width="2"/>
<text x="160" y="224" fill="#607086">(autres câbles : fibre, série…)</text>
</g>
<text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#5c4a14" font-weight="bold">Terminal ↔ Commutateur = câble DROIT (Straight-Through).</text>
<text x="280" y="280" text-anchor="middle" font-size="11" fill="#5c4a14">Le câble croisé, c'est pour routeur↔routeur — on le retrouvera en 3e !</text>
<text x="280" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e7d4f">→ clic sur le câble droit, puis clic sur le 1er appareil</text>
</g>

<!-- panneau droit : choix de la prise -->
<g>
<rect x="570" y="56" width="460" height="290" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="596" cy="82" r="15" fill="#d23a3a"/><text x="596" y="88" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">②</text>
<text x="800" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">La petite fenêtre des prises</text>
<!-- fenêtre popup reconstituée -->
<rect x="640" y="104" width="320" height="150" rx="4" fill="#ffffff" stroke="#60778c" stroke-width="2"/>
<rect x="640" y="104" width="320" height="24" rx="4" fill="#31475a"/>
<text x="654" y="121" font-size="11" fill="#fff" font-weight="bold">PC-Prof</text>
<g font-size="12" font-family="Consolas, monospace" fill="#31475a">
<text x="658" y="150">RS232 (console — non !)</text>
<rect x="650" y="160" width="300" height="26" rx="6" fill="#eafbe7" stroke="#1e7d4f" stroke-width="2.5"/>
<text x="658" y="178" fill="#0a3d1f" font-weight="bold">FastEthernet0  ← la prise RÉSEAU</text>
<text x="658" y="212" fill="#607086">Bluetooth (sans fil — pas ici)</text>
</g>
<text x="800" y="278" text-anchor="middle" font-size="11.5" fill="#5c4a14" font-weight="bold">Côté terminal : toujours FastEthernet0.</text>
<text x="800" y="296" text-anchor="middle" font-size="11" fill="#5c4a14">Côté commutateur : une prise FastEthernet0/1 à 0/24 — une par câble,</text>
<text x="800" y="312" text-anchor="middle" font-size="11" fill="#5c4a14">jamais deux câbles dans la même prise.</text>
<text x="800" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e7d4f">→ le câble se tend, les triangles apparaissent</text>
</g>

<!-- bandeau bas -->
<rect x="50" y="366" width="980" height="66" rx="10" fill="#fdf6e3" stroke="#a8823c" stroke-width="2"/>
<text x="540" y="390" text-anchor="middle" font-size="13" fill="#5c4a14" font-weight="bold">⏳ Juste après le câblage, les triangles sont ORANGE : le port du commutateur passe par un court état de préparation.</text>
<text x="540" y="412" text-anchor="middle" font-size="12" fill="#5c4a14">Attends qu'ils passent au VERT (≈ 30 s) avant de conclure quoi que ce soit — ce n'est PAS une panne.</text>
<text x="540" y="428" text-anchor="middle" font-size="10.5" fill="#8a6d1d">Figure reconstituée d'après le vrai logiciel (Packet Tracer 8.2) — session réelle : nos triangles ont mis ~30 s à verdir.</text>
</svg>
