<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">La recette de conception d'un plan d'adressage, en quatre étapes</title>
<desc id="d">Quatre vignettes numérotées. Un : recenser les habitants — quatre appareils listés (PC-Prof, Serveur, Imprimante, Capteur), le commutateur barré car il ne réclame pas de numéro. Deux : choisir la rue — le panneau 192.168.20 commun à tous. Trois : attribuer les numéros uniques — 10, 30, 50, 100, avec le 1 réservé à la passerelle dessinée comme une porte. Quatre : écrire le masque 255.255.255.0 qui sépare la rue du numéro de maison.</desc>
<rect width="1080" height="340" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="338" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Concevoir le plan d'adressage : la recette en 4 étapes</text>

<!-- vignette 1 -->
<g>
<rect x="25" y="55" width="245" height="250" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="50" cy="80" r="15" fill="#135588"/><text x="50" y="86" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">1</text>
<text x="147" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Recenser les habitants</text>
<g font-size="13" fill="#222">
<text x="45" y="120">☑ PC-Prof</text>
<text x="45" y="145">☑ Serveur-Serre</text>
<text x="45" y="170">☑ Imprimante</text>
<text x="45" y="195">☑ Capteur-Serre (nouveau)</text>
<text x="45" y="228" fill="#8a2e2e">✗ le commutateur</text>
</g>
<text x="147" y="256" text-anchor="middle" font-size="11" fill="#5c4a14">Le carrefour n'est pas une maison :</text>
<text x="147" y="272" text-anchor="middle" font-size="11" fill="#5c4a14">pas de numéro pour lui ici.</text>
<text x="147" y="295" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e7d4f">→ 4 numéros à prévoir</text>
</g>

<!-- vignette 2 -->
<g>
<rect x="288" y="55" width="245" height="250" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="313" cy="80" r="15" fill="#135588"/><text x="313" y="86" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">2</text>
<text x="410" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Choisir la rue</text>
<rect x="318" y="120" width="185" height="46" rx="8" fill="#12335e"/>
<text x="410" y="141" text-anchor="middle" font-size="15" fill="#fff" font-family="Consolas, monospace">rue 192.168.20</text>
<text x="410" y="159" text-anchor="middle" font-size="10.5" fill="#bcd3f2">le début d'adresse COMMUN</text>
<text x="410" y="195" text-anchor="middle" font-size="11.5" fill="#31475a">Le jardin a déjà la rue 192.168.10 :</text>
<text x="410" y="211" text-anchor="middle" font-size="11.5" fill="#31475a">deux quartiers, deux rues —</text>
<text x="410" y="227" text-anchor="middle" font-size="11.5" fill="#31475a">les courriers ne se mélangent pas.</text>
<text x="410" y="295" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e7d4f">→ même rue pour les 4</text>
</g>

<!-- vignette 3 -->
<g>
<rect x="551" y="55" width="245" height="250" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="576" cy="80" r="15" fill="#135588"/><text x="576" y="86" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">3</text>
<text x="673" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Numéros uniques</text>
<g font-size="13" font-family="Consolas, monospace" fill="#222">
<text x="575" y="122">PC-Prof</text><text x="760" y="122" text-anchor="end" font-weight="bold">.10</text>
<text x="575" y="146">Imprimante</text><text x="760" y="146" text-anchor="end" font-weight="bold">.30</text>
<text x="575" y="170">Capteur</text><text x="760" y="170" text-anchor="end" font-weight="bold">.50</text>
<text x="575" y="194">Serveur</text><text x="760" y="194" text-anchor="end" font-weight="bold">.100</text>
</g>
<rect x="570" y="208" width="206" height="52" rx="8" fill="#fdf6e3" stroke="#a8823c"/>
<path d="M585 250 v-24 a10 10 0 0 1 20 0 v24 z" fill="#8a6d1d"/>
<text x="688" y="228" text-anchor="middle" font-size="11.5" fill="#5c4a14" font-weight="bold">.1 = RÉSERVÉ à la passerelle,</text>
<text x="688" y="245" text-anchor="middle" font-size="11.5" fill="#5c4a14">la porte vers les autres réseaux</text>
<text x="673" y="295" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e7d4f">→ jamais deux fois le même</text>
</g>

<!-- vignette 4 -->
<g>
<rect x="814" y="55" width="242" height="250" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="839" cy="80" r="15" fill="#135588"/><text x="839" y="86" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">4</text>
<text x="935" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Écrire le masque</text>
<rect x="836" y="118" width="200" height="40" rx="6" fill="#ffffff" stroke="#1e7d4f" stroke-width="2.5"/>
<text x="936" y="144" text-anchor="middle" font-size="16" font-family="Consolas, monospace" fill="#0a3d1f" font-weight="bold">255.255.255.0</text>
<g font-size="11.5" fill="#31475a">
<text x="936" y="182" text-anchor="middle">chaque « 255 » = partie RUE</text>
<text x="936" y="199" text-anchor="middle">le « 0 » = partie MAISON</text>
<text x="936" y="226" text-anchor="middle">Le même panneau pour toute</text>
<text x="936" y="242" text-anchor="middle">la rue — jamais personnalisé.</text>
</g>
<text x="935" y="295" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e7d4f">→ un seul masque commun</text>
</g>
</svg>
