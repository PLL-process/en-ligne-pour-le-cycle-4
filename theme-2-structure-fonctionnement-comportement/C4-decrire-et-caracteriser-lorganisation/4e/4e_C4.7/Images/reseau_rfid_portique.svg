<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" width="520" height="290" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<title id="t">Une étiquette RFID et un portique</title>
<desc id="d">Un article portant une petite puce passe entre les deux montants d'un portique. La puce n'a pas de pile : le portique lui envoie l'énergie et reçoit sa réponse.</desc>
<rect width="520" height="290" fill="#ffffff"/>
<rect x="80" y="40" width="16" height="230" rx="6" fill="#e4eefb"/><rect x="420" y="40" width="16" height="230" rx="6" fill="#e4eefb"/><text x="258" y="30" font-size="13" text-anchor="middle" fill="#1d4e89" font-weight="700">portique de sortie</text><rect x="200" y="120" width="110" height="70" rx="8" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="255" y="160" font-size="13" text-anchor="middle" fill="#0f172a">Article</text><rect x="228" y="140" width="54" height="30" rx="4" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="255" y="161" font-size="11" text-anchor="middle" fill="#c2410c">puce</text><path d="M310,145 a10,10 0 0,1 0,20" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.78"/><path d="M310,135 a20,20 0 0,1 0,40" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.56"/><text x="258" y="240" font-size="12" text-anchor="middle" fill="#64748b">la puce n'a pas de pile : le portique lui envoie</text><text x="258" y="260" font-size="12" text-anchor="middle" fill="#64748b">l'énergie ET reçoit sa réponse</text>
</svg>
