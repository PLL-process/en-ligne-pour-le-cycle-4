nt-size="12" text-anchor="middle" fill="#0f172a">7</text><rect x="20" y="140" width="90" height="44" rx="8" fill="#dbeafe" stroke="#1d4e89" stroke-width="2"/><text x="65" y="167" font-size="12" text-anchor="middle" fill="#0f172a">Passerelle</text><line x1="110" y1="150" x2="140" y2="90" stroke="#1d4e89" stroke-width="2.5"/><text x="340" y="285" font-size="12" text-anchor="middle" fill="#64748b">chaque objet relaie ceux qui sont trop loin de la passerelle</text>
