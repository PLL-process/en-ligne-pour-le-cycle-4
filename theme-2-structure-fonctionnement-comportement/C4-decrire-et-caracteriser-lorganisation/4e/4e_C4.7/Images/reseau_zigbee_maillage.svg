<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" width="700" height="310" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<title id="t">Un réseau Zigbee en maillage</title>
<desc id="d">Sept objets connectés reliés entre eux par des liaisons en pointillés, et une passerelle à gauche. Chaque objet relaie les messages de ceux qui sont trop éloignés de la passerelle : c'est le principe du maillage.</desc>
