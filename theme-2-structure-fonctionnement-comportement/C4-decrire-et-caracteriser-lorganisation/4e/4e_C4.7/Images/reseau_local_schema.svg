<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<title id="t">Le schéma d'un réseau local</title>
<desc id="d">De haut en bas : Internet, puis la box qui fait routeur, puis un commutateur, puis trois appareils filaires — ordinateur, imprimante, serveur. Une tablette est reliée à la box par des ondes.</desc>
<rect width="760" height="410" fill="#ffffff"/>
<rect x="300" y="30" width="160" height="54" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="380" y="62" font-size="14" text-anchor="middle" fill="#0f172a">Internet</text><line x1="380" y1="84" x2="380" y2="120" stroke="#c2410c" stroke-width="2.5"/><rect x="300" y="120" width="160" height="54" rx="8" fill="#dbeafe" stroke="#1d4e89" stroke-width="2"/><text x="380" y="152" font-size="14" text-anchor="middle" fill="#0f172a">Box / routeur</text><line x1="380" y1="174" x2="380" y2="210" stroke="#64748b" stroke-width="2.5"/><rect x="300" y="210" width="160" height="50" rx="8" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="380" y="240" font-size="13" text-anchor="middle" fill="#0f172a">Commutateur</text><line x1="300" y1="235" x2="180" y2="300" stroke="#64748b" stroke-width="2.5"/><line x1="380" y1="260" x2="380" y2="300" stroke="#64748b" stroke-width="2.5"/><line x1="460" y1="235" x2="580" y2="300" stroke="#64748b" stroke-width="2.5"/><rect x="110" y="300" width="140" height="50" rx="8" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="180" y="330" font-size="13" text-anchor="middle" fill="#0f172a">Ordinateur</text><rect x="310" y="300" width="140" height="50" rx="8" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="380" y="330" font-size="13" text-anchor="middle" fill="#0f172a">Imprimante</text><rect x="510" y="300" width="140" height="50" rx="8" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="580" y="330" font-size="13" text-anchor="middle" fill="#0f172a">Serveur</text><path d="M478,135 a10,10 0 0,1 0,20" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.78"/><path d="M478,125 a20,20 0 0,1 0,40" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.56"/><rect x="560" y="120" width="120" height="50" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="620" y="150" font-size="12" text-anchor="middle" fill="#0f172a">Tablette</text><text x="380" y="390" font-size="12" text-anchor="middle" fill="#64748b">du plus général au plus particulier : Internet, la box, le commutateur, les appareils</text>
</svg>
