<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">La fenêtre IP Configuration du Capteur-Serre, passerelle comprise</title>
<desc id="d">À gauche, la fenêtre Desktop puis IP Configuration du Capteur-Serre, reconstituée d'après Packet Tracer 8.2 : Static coché, IPv4 Address 192.168.20.50, Subnet Mask 255.255.255.0, et le champ Default Gateway rempli avec 192.168.20.1, entouré en orange comme la nouveauté de 4e. À droite, le rappel du plan sous forme de rue : la porte passerelle au 1, le capteur au 50, et la légende expliquant que chaque habitant note dans son carnet l'adresse de la porte de sortie.</desc>
<rect width="1080" height="560" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="558" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">L'adresse fixe du capteur — la ligne « Default Gateway » entre en scène</text>

<!-- fenêtre IP Configuration -->
<rect x="40" y="60" width="500" height="420" rx="8" fill="#f5f7fa" stroke="#60778c" stroke-width="2"/>
<rect x="40" y="60" width="500" height="30" rx="8" fill="#32658f"/>
<text x="58" y="80" font-size="14" fill="#ffffff">Capteur-Serre — Desktop → IP Configuration</text>
<g font-size="13.5" fill="#222">
  <text x="60" y="120">Interface</text>
  <rect x="190" y="106" width="320" height="22" fill="#ffffff" stroke="#7c91a4"/><text x="202" y="122">FastEthernet0</text>
  <text x="60" y="160" font-weight="bold">IP Configuration</text>
  <circle cx="210" cy="192" r="8" fill="#ffffff" stroke="#455d72" stroke-width="2"/><text x="226" y="197">DHCP</text>
  <circle cx="330" cy="192" r="8" fill="#ffffff" stroke="#455d72" stroke-width="2"/>
  <circle cx="330" cy="192" r="4.5" fill="#1f6da5"/><text x="346" y="197" font-weight="bold">Static</text>
  <text x="437" y="197" fill="#1e7d4f" font-size="12">← adresse FIXE</text>
  <text x="60" y="242">IPv4 Address</text>
  <rect x="210" y="227" width="300" height="26" fill="#ffffff" stroke="#1e7d4f" stroke-width="3"/>
  <text x="222" y="246" font-family="Consolas, monospace" font-size="16" fill="#0a3d1f" font-weight="bold">192.168.20.50</text>
  <text x="60" y="292">Subnet Mask</text>
  <rect x="210" y="277" width="300" height="26" fill="#ffffff" stroke="#7c91a4"/>
  <text x="222" y="296" font-family="Consolas, monospace" font-size="15" fill="#31475a">255.255.255.0</text>
  <text x="60" y="342">Default Gateway</text>
  <rect x="210" y="327" width="300" height="26" fill="#fff8ec" stroke="#d17f1e" stroke-width="3.5"/>
  <text x="222" y="346" font-family="Consolas, monospace" font-size="16" fill="#7a4a08" font-weight="bold">192.168.20.1</text>
</g>
<rect x="60" y="372" width="460" height="88" rx="8" fill="#fdf6e3" stroke="#a8823c"/>
<text x="290" y="396" text-anchor="middle" font-size="12.5" fill="#5c4a14" font-weight="bold">⭐ LA nouveauté de 4e : la passerelle.</text>
<text x="290" y="416" text-anchor="middle" font-size="12" fill="#5c4a14">Chaque habitant note l'adresse de la PORTE du quartier (.1).</text>
<text x="290" y="434" text-anchor="middle" font-size="12" fill="#5c4a14">Inutile pour parler DANS la serre — indispensable le jour</text>
<text x="290" y="452" text-anchor="middle" font-size="12" fill="#5c4a14">où le capteur devra envoyer ses mesures HORS du quartier.</text>

<!-- rappel du plan -->
<rect x="580" y="60" width="460" height="420" rx="10" fill="#f5f8fc" stroke="#9aaabc"/>
<text x="810" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#31475a">Les trois lignes, vues comme la rue :</text>
<!-- rue -->
<rect x="610" y="270" width="400" height="34" fill="#c8cfd6"/>
<line x1="610" y1="287" x2="1010" y2="287" stroke="#ffffff" stroke-width="3" stroke-dasharray="16 12"/>
<rect x="700" y="312" width="220" height="26" rx="13" fill="#12335e"/>
<text x="810" y="330" text-anchor="middle" font-size="13.5" fill="#ffffff" font-family="Consolas, monospace">rue 192.168.20</text>
<!-- porte -->
<path d="M640 270 v-52 a19 19 0 0 1 38 0 v52 z" fill="#8a6d1d"/>
<rect x="632" y="240" width="54" height="20" rx="10" fill="#fff" stroke="#8a6d1d"/>
<text x="659" y="255" text-anchor="middle" font-size="12.5" fill="#8a6d1d" font-family="Consolas, monospace" font-weight="bold">.1</text>
<text x="659" y="205" text-anchor="middle" font-size="12" fill="#8a6d1d" font-weight="bold">la porte</text>
<!-- maison capteur -->
<rect x="850" y="206" width="110" height="64" fill="#eafbe7" stroke="#1e7d4f" stroke-width="2.5"/>
<path d="M843 206 L905 165 L967 206 Z" fill="#1e7d4f"/>
<circle cx="905" cy="238" r="16" fill="#fff" stroke="#1e7d4f" stroke-width="2.5"/>
<path d="M905 228 v10 l7 5" stroke="#1e7d4f" stroke-width="2.5" fill="none"/>
<rect x="878" y="278" width="54" height="20" rx="10" fill="#1e7d4f"/>
<text x="905" y="293" text-anchor="middle" font-size="12.5" fill="#fff" font-family="Consolas, monospace" font-weight="bold">.50</text>
<text x="905" y="152" text-anchor="middle" font-size="12" fill="#1e7d4f" font-weight="bold">le capteur</text>
<!-- légende correspondances -->
<g font-size="12.5" fill="#31475a">
<text x="620" y="380" font-weight="bold">Correspondances :</text>
<text x="620" y="404">• IPv4 Address = SA maison dans la rue (192.168.20.50)</text>
<text x="620" y="426">• Subnet Mask = le panneau du quartier (255.255.255.0)</text>
<text x="620" y="448"><tspan font-weight="bold" fill="#7a4a08">• Default Gateway = l'adresse de la PORTE (192.168.20.1)</tspan></text>
<text x="620" y="468">  — notée dans le carnet de CHAQUE habitant</text>
</g>
</svg>
