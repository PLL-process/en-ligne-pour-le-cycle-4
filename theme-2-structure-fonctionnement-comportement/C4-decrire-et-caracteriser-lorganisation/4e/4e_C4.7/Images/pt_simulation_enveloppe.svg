<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Le mode Simulation : l'enveloppe en plein trajet et sa liste d'événements</title>
<desc id="d">Reconstitution du mode Simulation de Packet Tracer sur le réseau de la serre : à gauche, le montage avec une enveloppe posée sur le commutateur, entre PC-Prof et Serveur-Serre. À droite, le panneau Simulation avec la liste d'événements horodatée : à 0.000 seconde le message est chez PC-Prof, à 0.001 chez Switch0, à 0.002 chez Serveur-Serre — puis le retour. En bas, la ligne du scénario affiche le verdict Successful.</desc>
<rect width="1080" height="560" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="558" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Compléter la simulation : l'enveloppe ajoutée au fichier fourni, et son film image par image</text>

<!-- zone montage -->
<rect x="40" y="60" width="600" height="380" rx="8" fill="#fbfcfe" stroke="#9aaabc"/>
<g stroke="#37474f" stroke-width="3">
<line x1="150" y1="150" x2="320" y2="250"/>
<line x1="150" y1="360" x2="320" y2="270"/>
<line x1="530" y1="150" x2="380" y2="250"/>
<line x1="530" y1="360" x2="380" y2="270"/>
</g>
<g fill="#2e9e4f">
<path d="M162 158 l14 -4 l-7 12 z"/><path d="M306 244 l12 -7 l-3 14 z"/>
<path d="M162 352 l14 4 l-7 -12 z"/><path d="M306 276 l12 7 l-3 -14 z"/>
<path d="M518 158 l-14 -4 l7 12 z"/><path d="M394 244 l-12 -7 l3 14 z"/>
<path d="M518 352 l-14 4 l7 -12 z"/><path d="M394 276 l-12 7 l3 -14 z"/>
</g>
<rect x="320" y="238" width="60" height="44" rx="5" fill="#2f6d8f"/>
<text x="350" y="300" text-anchor="middle" font-size="11.5" fill="#31475a" font-weight="bold">Switch0</text>
<rect x="106" y="106" width="66" height="44" rx="4" fill="#3b6e91"/><rect x="112" y="112" width="54" height="30" fill="#bfe6f5"/>
<text x="139" y="170" text-anchor="middle" font-size="11.5" fill="#135588" font-weight="bold">PC-Prof</text>
<rect x="112" y="330" width="56" height="66" rx="4" fill="#3b6e91"/>
<rect x="118" y="338" width="44" height="11" rx="2" fill="#1c4a63"/><circle cx="155" cy="343" r="2.5" fill="#81fba1"/>
<rect x="118" y="353" width="44" height="11" rx="2" fill="#1c4a63"/><circle cx="155" cy="358" r="2.5" fill="#81fba1"/>
<text x="140" y="416" text-anchor="middle" font-size="11.5" fill="#135588" font-weight="bold">Serveur-Serre</text>
<rect x="500" y="110" width="70" height="36" rx="5" fill="#5c7a94"/>
<text x="535" y="170" text-anchor="middle" font-size="11.5" fill="#31475a">Imprimante</text>
<rect x="502" y="336" width="66" height="44" rx="4" fill="#3b6e91"/><rect x="508" y="342" width="54" height="30" fill="#eafbe7"/>
<text x="535" y="404" text-anchor="middle" font-size="11.5" fill="#1e7d4f">Capteur-Serre</text>
<!-- enveloppe sur le switch -->
<g transform="translate(332 206)">
<rect width="40" height="28" fill="#efe08d" stroke="#7a5aa8" stroke-width="2.5" rx="3"/>
<path d="M0 0 L20 15 L40 0" fill="none" stroke="#7a5aa8" stroke-width="2.5"/>
</g>
<text x="352" y="196" text-anchor="middle" font-size="11.5" fill="#46326b" font-weight="bold">l'enveloppe, arrêtée sur le commutateur</text>
<!-- trajets -->
<path d="M175 128 C 250 150, 300 180, 332 216" fill="none" stroke="#7a5aa8" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M368 236 C 320 300, 240 340, 176 356" fill="none" stroke="#7a5aa8" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M170 350 l6 8 l-10 2 z" fill="#7a5aa8"/>
<text x="240" y="446" font-size="11.5" fill="#46326b">trajet : PC-Prof → Switch0 → Serveur-Serre (puis retour)</text>

<!-- panneau simulation -->
<rect x="670" y="60" width="370" height="380" rx="8" fill="#f5f7fa" stroke="#60778c" stroke-width="2"/>
<rect x="670" y="60" width="370" height="28" rx="8" fill="#32658f"/>
<text x="686" y="79" font-size="13" fill="#fff">Simulation Panel — Event List</text>
<g font-size="12.5" font-family="Consolas, monospace">
<text x="690" y="112" fill="#607086">Time(s)   Last Device → At Device</text>
<line x1="686" y1="122" x2="1024" y2="122" stroke="#c3ccd6"/>
<text x="690" y="144" fill="#222">0.000     —           PC-Prof</text>
<text x="690" y="168" fill="#222">0.001     PC-Prof     Switch0</text>
<text x="690" y="192" fill="#222">0.002     Switch0     Serveur-Serre</text>
<text x="690" y="216" fill="#607086">0.003     Serveur-S.  Switch0   (retour)</text>
<text x="690" y="240" fill="#607086">0.004     Switch0     PC-Prof   (retour)</text>
</g>
<rect x="686" y="258" width="338" height="2" fill="#c3ccd6"/>
<text x="690" y="284" font-size="12.5" fill="#31475a" font-weight="bold">Scénario 0 — PC-Prof → Serveur-Serre :</text>
<rect x="686" y="296" width="140" height="26" rx="6" fill="#eafbe7" stroke="#1e7d4f" stroke-width="2"/>
<text x="756" y="314" text-anchor="middle" font-size="13" fill="#0a3d1f" font-weight="bold">Successful ✓</text>
<g font-size="11.8" fill="#31475a">
<text x="690" y="348">La liste d'événements est le FILM du réseau :</text>
<text x="690" y="366">chaque ligne dit où est le message, à quel</text>
<text x="690" y="384">instant. Le verdict « Successful » valide</text>
<text x="690" y="402">l'aller-retour — le comportement attendu</text>
<text x="690" y="420">du réseau est PROUVÉ.</text>
</g>

<!-- bandeau bas -->
<rect x="60" y="462" width="960" height="78" rx="10" fill="#fdf6e3" stroke="#a8823c" stroke-width="2"/>
<text x="540" y="488" text-anchor="middle" font-size="13" fill="#5c4a14" font-weight="bold">Ta mission 4e_C4.9 : le montage t'est FOURNI — tu y AJOUTES ce test (Add Simple PDU : clic expéditeur, clic destinataire),</text>
<text x="540" y="508" text-anchor="middle" font-size="13" fill="#5c4a14">tu lances Play, tu lis le film… et tu sauvegardes : ton scénario fait désormais partie du fichier.</text>
<text x="540" y="528" text-anchor="middle" font-size="11.5" fill="#8a6d1d">Trajet et chronologie conformes à nos sessions réelles dans Packet Tracer 8.2 (mode Simulation, pas ≈ 1 ms par saut).</text>
</svg>
