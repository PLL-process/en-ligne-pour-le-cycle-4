<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<title id="t">Un commutateur et ses huit prises</title>
<desc id="d">Un boîtier rectangulaire portant huit prises RJ45 alignées. Le commutateur distribue les liaisons à l'intérieur du réseau local ; contrairement au routeur, il ne mène pas à Internet.</desc>
<rect width="600" height="260" fill="#ffffff"/>
<rect x="50" y="105" width="500" height="76" rx="10" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><rect x="70" y="130" width="34" height="26" rx="3" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="124" y="130" width="34" height="26" rx="3" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="178" y="130" width="34" height="26" rx="3" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="232" y="130" width="34" height="26" rx="3" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="286" y="130" width="34" height="26" rx="3" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="340" y="130" width="34" height="26" rx="3" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="394" y="130" width="34" height="26" rx="3" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="448" y="130" width="34" height="26" rx="3" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="300" y="95" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="700">Commutateur (switch)</text><text x="300" y="205" font-size="12" text-anchor="middle" fill="#64748b">huit prises RJ45 : une par appareil du réseau local</text><text x="300" y="235" font-size="12" text-anchor="middle" fill="#64748b">il ne sort pas du réseau — il ne fait que distribuer</text>
</svg>
