<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Le montage terminé de la serre dans Packet Tracer : l'étoile à quatre branches</title>
<desc id="d">Reconstitution du plan de travail de Packet Tracer 8.2 : le commutateur 2960-24TT nommé Switch0 au centre, relié par quatre câbles droits à PC-Prof en haut à gauche, Imprimante en haut à droite, Serveur-Serre en bas à gauche et Capteur-Serre en bas à droite. Chaque extrémité de câble porte un petit triangle vert signalant une liaison opérationnelle. Les prises utilisées sur le commutateur sont FastEthernet0/1 à 0/4, et FastEthernet0 côté appareils.</desc>
<rect width="1080" height="560" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="558" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Le réseau d'entraînement de la serre — l'étoile terminée (liaisons vertes)</text>

<!-- câbles -->
<g stroke="#37474f" stroke-width="3.5">
<line x1="230" y1="150" x2="500" y2="300"/>
<line x1="850" y1="150" x2="580" y2="300"/>
<line x1="230" y1="450" x2="500" y2="320"/>
<line x1="850" y1="450" x2="580" y2="320"/>
</g>
<!-- triangles verts -->
<g fill="#2e9e4f">
<path d="M245 160 l16 -4 l-8 14 z"/><path d="M482 293 l14 -8 l-4 16 z"/>
<path d="M835 160 l-16 -4 l8 14 z"/><path d="M598 293 l-14 -8 l4 16 z"/>
<path d="M245 440 l16 4 l-8 -14 z"/><path d="M482 327 l14 8 l-4 -16 z"/>
<path d="M835 440 l-16 4 l8 -14 z"/><path d="M598 327 l-14 8 l4 -16 z"/>
</g>
<!-- étiquettes de prises -->
<g font-size="11" fill="#607086" font-family="Consolas, monospace">
<text x="300" y="196">Fa0</text><text x="452" y="270">Fa0/1</text>
<text x="758" y="196">Fa0</text><text x="586" y="270">Fa0/2</text>
<text x="300" y="384">Fa0</text><text x="452" y="352">Fa0/3</text>
<text x="758" y="384">Fa0</text><text x="586" y="352">Fa0/4</text>
</g>

<!-- switch central -->
<g>
<rect x="480" y="288" width="120" height="44" rx="5" fill="#2f6d8f"/>
<rect x="486" y="294" width="108" height="12" rx="2" fill="#1c4a63"/>
<g fill="#bde3f2"><rect x="490" y="316" width="9" height="7"/><rect x="503" y="316" width="9" height="7"/><rect x="516" y="316" width="9" height="7"/><rect x="529" y="316" width="9" height="7"/><rect x="542" y="316" width="9" height="7"/><rect x="555" y="316" width="9" height="7"/><rect x="568" y="316" width="9" height="7"/><rect x="581" y="316" width="9" height="7"/></g>
<text x="540" y="352" text-anchor="middle" font-size="12.5" fill="#31475a" font-weight="bold">2960-24TT</text>
<text x="540" y="368" text-anchor="middle" font-size="12.5" fill="#31475a">Switch0</text>
</g>

<!-- PC-Prof -->
<g>
<rect x="160" y="96" width="90" height="58" rx="4" fill="#3b6e91"/>
<rect x="168" y="104" width="74" height="42" fill="#bfe6f5"/>
<rect x="188" y="158" width="34" height="8" fill="#3b6e91"/>
<rect x="172" y="168" width="66" height="9" rx="3" fill="#3b6e91"/>
<text x="205" y="196" text-anchor="middle" font-size="12.5" fill="#31475a">PC-PT</text>
<text x="205" y="212" text-anchor="middle" font-size="13" fill="#135588" font-weight="bold">PC-Prof</text>
</g>
<!-- Imprimante -->
<g>
<rect x="810" y="112" width="100" height="42" rx="6" fill="#5c7a94"/>
<rect x="826" y="96" width="68" height="18" fill="#eef1f4" stroke="#5c7a94"/>
<rect x="826" y="152" width="68" height="12" fill="#eef1f4" stroke="#5c7a94"/>
<text x="860" y="196" text-anchor="middle" font-size="12.5" fill="#31475a">Printer-PT</text>
<text x="860" y="212" text-anchor="middle" font-size="13" fill="#135588" font-weight="bold">Imprimante</text>
</g>
<!-- Serveur -->
<g>
<rect x="170" y="398" width="70" height="92" rx="4" fill="#3b6e91"/>
<rect x="178" y="408" width="54" height="14" rx="2" fill="#1c4a63"/><circle cx="224" cy="415" r="3" fill="#81fba1"/>
<rect x="178" y="428" width="54" height="14" rx="2" fill="#1c4a63"/><circle cx="224" cy="435" r="3" fill="#81fba1"/>
<rect x="178" y="448" width="54" height="14" rx="2" fill="#1c4a63"/><circle cx="224" cy="455" r="3" fill="#81fba1"/>
<text x="205" y="512" text-anchor="middle" font-size="12.5" fill="#31475a">Server-PT</text>
<text x="205" y="528" text-anchor="middle" font-size="13" fill="#135588" font-weight="bold">Serveur-Serre</text>
</g>
<!-- Capteur -->
<g>
<rect x="815" y="404" width="90" height="58" rx="4" fill="#3b6e91"/>
<rect x="823" y="412" width="74" height="42" fill="#eafbe7"/>
<circle cx="860" cy="433" r="14" fill="none" stroke="#1e7d4f" stroke-width="2.5"/>
<path d="M860 424 v9 l6 5" stroke="#1e7d4f" stroke-width="2.5" fill="none"/>
<rect x="843" y="466" width="34" height="8" fill="#3b6e91"/>
<text x="860" y="496" text-anchor="middle" font-size="12.5" fill="#31475a">PC-PT</text>
<text x="860" y="512" text-anchor="middle" font-size="13" fill="#1e7d4f" font-weight="bold">Capteur-Serre</text>
</g>

<!-- encadré lecture -->
<rect x="330" y="428" width="420" height="96" rx="10" fill="#fdf6e3" stroke="#a8823c" stroke-width="2"/>
<text x="540" y="452" text-anchor="middle" font-size="13" fill="#5c4a14" font-weight="bold">Comment lire le montage :</text>
<text x="540" y="472" text-anchor="middle" font-size="12" fill="#5c4a14">4 terminaux · 4 câbles droits (Copper Straight-Through) · 1 commutateur</text>
<text x="540" y="490" text-anchor="middle" font-size="12" fill="#5c4a14">▲ vert des DEUX côtés = liaison prête · topologie en ÉTOILE</text>
<text x="540" y="510" text-anchor="middle" font-size="12" fill="#8a2e2e" font-weight="bold">Câblé ≠ adressé : personne n'a encore d'adresse IP !</text>
</svg>
