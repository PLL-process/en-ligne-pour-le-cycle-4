<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Renommer un appareil (Config → Display Name) et enregistrer son fichier (File → Save As)</title>
<desc id="d">Deux panneaux. À gauche, la fenêtre d'un appareil, onglet Config, rubrique Settings : le champ Display Name contient Capteur-Serre — c'est là qu'on renomme. À droite, le menu File avec Save As et la fenêtre d'enregistrement : le champ Nom du fichier contient serre_4A_NOM_Prenom.pkt, exemple du nom attendu, et le bouton Enregistrer.</desc>
<rect width="1080" height="440" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="438" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Renommer chaque appareil… et enregistrer TON fichier (sinon tout est perdu !)</text>

<!-- panneau gauche : Display Name -->
<g>
<rect x="50" y="56" width="470" height="280" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="76" cy="82" r="15" fill="#d23a3a"/><text x="76" y="88" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">①</text>
<text x="285" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Renommer : onglet Config → Settings</text>
<!-- fenêtre reconstituée -->
<rect x="76" y="104" width="418" height="200" rx="4" fill="#f2f4f7" stroke="#60778c" stroke-width="2"/>
<rect x="76" y="104" width="418" height="22" rx="4" fill="#31475a"/>
<text x="90" y="120" font-size="11" fill="#fff" font-weight="bold">Capteur-Serre</text>
<g font-size="11.5">
<rect x="90" y="134" width="70" height="22" rx="3" fill="#dfe6ee" stroke="#9aaabc"/><text x="125" y="149" text-anchor="middle" fill="#607086">Physical</text>
<rect x="164" y="134" width="70" height="22" rx="3" fill="#ffffff" stroke="#31649c" stroke-width="2"/><text x="199" y="149" text-anchor="middle" fill="#123d66" font-weight="bold">Config</text>
<rect x="238" y="134" width="70" height="22" rx="3" fill="#dfe6ee" stroke="#9aaabc"/><text x="273" y="149" text-anchor="middle" fill="#607086">Desktop</text>
</g>
<rect x="90" y="166" width="110" height="24" rx="4" fill="#31649c"/>
<text x="98" y="183" font-size="11" fill="#fff" font-weight="bold">GLOBAL Settings</text>
<text x="216" y="183" font-size="12" fill="#31475a">Display Name :</text>
<rect x="216" y="192" width="262" height="26" rx="4" fill="#fff" stroke="#31649c" stroke-width="2"/>
<text x="226" y="210" font-size="12.5" font-family="Consolas, monospace" fill="#0a2d55" font-weight="bold">Capteur-Serre</text>
<text x="285" y="248" text-anchor="middle" font-size="11.5" fill="#5c4a14">Un nom clair par appareil : PC-Prof, Imprimante,</text>
<text x="285" y="264" text-anchor="middle" font-size="11.5" fill="#5c4a14">Capteur-Serre, Serveur-Serre — fini les « PC0 / PC1 » anonymes.</text>
<text x="285" y="290" text-anchor="middle" font-size="11" fill="#8a6d1d">Astuce vécue : après la saisie, clique ailleurs ou appuie sur Tab pour valider.</text>
</g>

<!-- panneau droit : Save As -->
<g>
<rect x="560" y="56" width="470" height="280" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="586" cy="82" r="15" fill="#d23a3a"/><text x="586" y="88" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">②</text>
<text x="795" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Enregistrer : File → Save As…</text>
<!-- menu -->
<rect x="586" y="104" width="130" height="118" rx="4" fill="#ffffff" stroke="#8b9aa9"/>
<g font-size="11.5" fill="#31475a">
<text x="598" y="122" font-weight="bold" fill="#123d66">File</text>
<text x="598" y="142">New</text>
<text x="598" y="160">Open…</text>
<text x="598" y="178">Save</text>
<rect x="592" y="184" width="118" height="20" rx="4" fill="#eafbe7" stroke="#1e7d4f" stroke-width="2"/>
<text x="598" y="198" fill="#0a3d1f" font-weight="bold">Save As…  Ctrl+Maj+S</text>
</g>
<!-- dialog -->
<rect x="736" y="110" width="280" height="128" rx="4" fill="#2b2f36"/>
<text x="750" y="132" font-size="11" fill="#cfd9e4" font-weight="bold">Enregistrer le fichier</text>
<text x="750" y="158" font-size="11" fill="#9fb0c0">Nom du fichier :</text>
<rect x="750" y="166" width="252" height="26" rx="4" fill="#1a1e24" stroke="#61dafb"/>
<text x="758" y="184" font-size="11.5" font-family="Consolas, monospace" fill="#c5e1a5" font-weight="bold">serre_4A_NOM_Prenom.pkt</text>
<rect x="906" y="202" width="96" height="26" rx="6" fill="#1d4e89"/>
<text x="954" y="220" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Enregistrer</text>
<text x="795" y="262" text-anchor="middle" font-size="11.5" fill="#5c4a14" font-weight="bold">Le nom attendu : serre_4X_NOM_Prenom.pkt (ta classe, ton nom).</text>
<text x="795" y="280" text-anchor="middle" font-size="11" fill="#5c4a14">Enregistre dès le montage fini — puis après CHAQUE grande étape.</text>
<text x="795" y="304" text-anchor="middle" font-size="11" fill="#8a2b2b" font-weight="bold">⚠ Leçon de notre session réelle : un montage non enregistré a été perdu.</text>
<text x="795" y="320" text-anchor="middle" font-size="11" fill="#8a2b2b">Sauvegarde AVANT de manipuler les pannes.</text>
</g>

<!-- bandeau -->
<rect x="50" y="356" width="980" height="52" rx="10" fill="#fdf6e3" stroke="#a8823c" stroke-width="2"/>
<text x="540" y="378" text-anchor="middle" font-size="13" fill="#5c4a14" font-weight="bold">Renommer (①) rend le plan lisible ; enregistrer (②) rend ton travail durable — les deux font partie du métier.</text>
<text x="540" y="398" text-anchor="middle" font-size="10.5" fill="#8a6d1d">Figure reconstituée d'après le vrai logiciel (Packet Tracer 8.2).</text>
</svg>
