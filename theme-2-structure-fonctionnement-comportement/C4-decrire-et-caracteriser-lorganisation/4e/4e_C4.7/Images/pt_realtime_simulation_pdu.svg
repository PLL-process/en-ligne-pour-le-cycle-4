<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Les deux commandes qui bloquent tout le monde : le bouton Realtime / Simulation, et l'outil Add Simple PDU</title>
<desc id="d">Deux panneaux. À gauche, le coin bas-droit de l'écran reconstitué : les deux boutons Realtime et Simulation, avec un grand cercle rouge autour de Simulation — c'est là qu'on bascule en mode film. À droite, la barre d'outils verticale avec l'icône enveloppe fermée Add Simple PDU entourée et fléchée : un clic sur l'enveloppe, un clic sur l'expéditeur, un clic sur le destinataire.</desc>
<rect width="1080" height="440" fill="#ffffff"/>
<rect x="1" y="1" width="1078" height="438" fill="none" stroke="#9aaabc" stroke-width="2"/>
<text x="540" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#135588">Valider par simulation : les 2 endroits où il faut cliquer (et que tout le monde cherche !)</text>

<!-- panneau gauche : Realtime/Simulation -->
<g>
<rect x="50" y="56" width="470" height="300" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="76" cy="82" r="15" fill="#d23a3a"/><text x="76" y="88" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">①</text>
<text x="285" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">Passer en mode Simulation</text>
<text x="285" y="110" text-anchor="middle" font-size="11.5" fill="#607086">(coin BAS-DROIT de l'écran — sous le plan de travail)</text>
<!-- reconstitution du coin -->
<rect x="90" y="126" width="390" height="120" rx="6" fill="#0d2347"/>
<g>
<rect x="150" y="170" width="120" height="30" rx="15" fill="#e8eef4" stroke="#8b9aa9" stroke-width="1.5"/>
<circle cx="170" cy="185" r="9" fill="#31649c"/><text x="170" y="189" text-anchor="middle" font-size="9" fill="#fff">🕐</text>
<text x="228" y="190" text-anchor="middle" font-size="12.5" fill="#31475a" font-weight="bold">Realtime</text>
</g>
<g>
<rect x="290" y="170" width="140" height="30" rx="15" fill="#e8eef4" stroke="#8b9aa9" stroke-width="1.5"/>
<circle cx="310" cy="185" r="9" fill="#31649c"/><text x="310" y="189" text-anchor="middle" font-size="9" fill="#fff">🎬</text>
<text x="368" y="190" text-anchor="middle" font-size="12.5" fill="#31475a" font-weight="bold">Simulation</text>
<ellipse cx="360" cy="185" rx="86" ry="28" fill="none" stroke="#d23a3a" stroke-width="4"/>
</g>
<text x="285" y="272" text-anchor="middle" font-size="12" fill="#5c4a14" font-weight="bold">Realtime = la vraie vitesse · Simulation = le film image par image.</text>
<text x="285" y="292" text-anchor="middle" font-size="11.5" fill="#5c4a14">Astuce vécue : le panneau Simulation recouvre une partie du plan —</text>
<text x="285" y="308" text-anchor="middle" font-size="11.5" fill="#5c4a14">détache-le ou ferme-le pour cliquer un appareil caché dessous.</text>
<text x="285" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e7d4f">→ le panneau Event List apparaît à droite</text>
</g>

<!-- panneau droit : Add Simple PDU -->
<g>
<rect x="560" y="56" width="470" height="300" rx="10" fill="#f5f8fc" stroke="#31475a" stroke-width="2"/>
<circle cx="586" cy="82" r="15" fill="#d23a3a"/><text x="586" y="88" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">②</text>
<text x="795" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#31475a">L'outil Add Simple PDU (l'enveloppe)</text>
<text x="795" y="110" text-anchor="middle" font-size="11.5" fill="#607086">(barre d'outils à DROITE du plan de travail)</text>
<!-- barre d'outils verticale -->
<rect x="620" y="126" width="44" height="190" rx="6" fill="#e9edf2" stroke="#8b9aa9"/>
<g font-size="15">
<text x="642" y="152" text-anchor="middle">🔍</text>
<text x="642" y="182" text-anchor="middle">📝</text>
<text x="642" y="212" text-anchor="middle" font-size="17">✉️</text>
<text x="642" y="244" text-anchor="middle">✉</text>
<text x="642" y="274" text-anchor="middle">🗑</text>
</g>
<circle cx="642" cy="207" r="19" fill="none" stroke="#d23a3a" stroke-width="4"/>
<path d="M700 207 L668 207" stroke="#d23a3a" stroke-width="4" marker-end="none"/>
<path d="M676 199 L664 207 L676 215 z" fill="#d23a3a"/>
<text x="712" y="200" font-size="12.5" fill="#5c4a14" font-weight="bold">l'enveloppe FERMÉE</text>
<text x="712" y="218" font-size="11.5" fill="#5c4a14">= Add Simple PDU (raccourci P)</text>
<g font-size="12" fill="#31475a">
<text x="700" y="252">1. clic sur l'<tspan font-weight="bold">enveloppe</tspan></text>
<text x="700" y="272">2. clic sur l'<tspan font-weight="bold">expéditeur</tspan> (PC-Prof)</text>
<text x="700" y="292">3. clic sur le <tspan font-weight="bold">destinataire</tspan> (Serveur)</text>
</g>
<text x="795" y="322" text-anchor="middle" font-size="12" fill="#5c4a14">Astuce vécue : crée le PDU en Realtime (ligne « Successful »),</text>
<text x="795" y="338" text-anchor="middle" font-size="12" fill="#5c4a14">puis passe en Simulation et rejoue le film avec Fire ▶.</text>
</g>

<!-- bandeau -->
<rect x="50" y="376" width="980" height="48" rx="10" fill="#fdf6e3" stroke="#a8823c" stroke-width="2"/>
<text x="540" y="396" text-anchor="middle" font-size="13" fill="#5c4a14" font-weight="bold">Le modèle des 3 images : OÙ cliquer (cette figure) → QUOI faire (la recette) → QUOI observer (l'Event List et son verdict).</text>
<text x="540" y="416" text-anchor="middle" font-size="10.5" fill="#8a6d1d">Figure reconstituée d'après le vrai logiciel (Packet Tracer 8.2).</text>
</svg>
