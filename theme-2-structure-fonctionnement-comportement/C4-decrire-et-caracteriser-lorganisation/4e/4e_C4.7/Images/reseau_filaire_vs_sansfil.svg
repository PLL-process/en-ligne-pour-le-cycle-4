<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<title id="t">Liaison filaire et liaison sans fil</title>
<desc id="d">À gauche, un ordinateur relié à une box par un fil : rapide et stable, mais il faut tirer le câble. À droite, une tablette reliée à la même box par des ondes : on peut bouger, mais le débit est partagé et les murs affaiblissent le signal.</desc>
<rect width="720" height="300" fill="#ffffff"/>
<rect x="20" y="20" width="330" height="260" rx="12" fill="#f8fafc" stroke="#e4eefb"/><text x="185" y="50" font-size="15" text-anchor="middle" fill="#1d4e89" font-weight="700">Liaison filaire</text><rect x="50" y="90" width="110" height="50" rx="8" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="105" y="120" font-size="13" text-anchor="middle" fill="#0f172a">Ordinateur</text><rect x="210" y="90" width="110" height="50" rx="8" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="265" y="120" font-size="13" text-anchor="middle" fill="#0f172a">Box</text><line x1="160" y1="115" x2="210" y2="115" stroke="#1d4e89" stroke-width="2.5"/><text x="185" y="175" font-size="12" text-anchor="middle" fill="#64748b">un fil : rapide, stable,</text><text x="185" y="195" font-size="12" text-anchor="middle" fill="#64748b">mais il faut le tirer</text><rect x="370" y="20" width="330" height="260" rx="12" fill="#fffbf5" stroke="#fed7aa"/><text x="535" y="50" font-size="15" text-anchor="middle" fill="#c2410c" font-weight="700">Liaison sans fil</text><rect x="400" y="90" width="110" height="50" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="455" y="120" font-size="13" text-anchor="middle" fill="#0f172a">Tablette</text><rect x="560" y="90" width="110" height="50" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="615" y="120" font-size="13" text-anchor="middle" fill="#0f172a">Box</text><path d="M515,105 a10,10 0 0,1 0,20" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.78"/><path d="M515,95 a20,20 0 0,1 0,40" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.56"/><path d="M515,85 a30,30 0 0,1 0,60" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.34"/><text x="535" y="175" font-size="12" text-anchor="middle" fill="#64748b">des ondes : libre de bouger,</text><text x="535" y="195" font-size="12" text-anchor="middle" fill="#64748b">mais partagé et affaibli par les murs</text>
</svg>
