<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" height="300" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<title id="t">Le routeur relie le réseau local à Internet</title>
<desc id="d">À gauche, un ordinateur et une imprimante reliés par des fils à un routeur au centre. À droite, le routeur est relié à Internet. Le routeur fait la jonction entre le réseau local, appelé LAN, et le reste du monde.</desc>
<rect width="740" height="300" fill="#ffffff"/>
<rect x="40" y="90" width="150" height="60" rx="8" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="115" y="125" font-size="13" text-anchor="middle" fill="#0f172a">Ordinateur</text><rect x="40" y="180" width="150" height="60" rx="8" fill="#e4eefb" stroke="#1d4e89" stroke-width="2"/><text x="115" y="215" font-size="13" text-anchor="middle" fill="#0f172a">Imprimante</text><line x1="190" y1="120" x2="300" y2="150" stroke="#64748b" stroke-width="2.5"/><line x1="190" y1="210" x2="300" y2="150" stroke="#64748b" stroke-width="2.5"/><rect x="300" y="120" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4e89" stroke-width="2"/><text x="375" y="155" font-size="14" text-anchor="middle" fill="#0f172a">Routeur</text><line x1="450" y1="150" x2="560" y2="150" stroke="#64748b" stroke-width="2.5"/><rect x="560" y="120" width="150" height="60" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="635" y="155" font-size="14" text-anchor="middle" fill="#0f172a">Internet</text><text x="375" y="205" font-size="12" text-anchor="middle" fill="#64748b">il relie les deux mondes</text><text x="150" y="275" font-size="12" text-anchor="middle" fill="#64748b">réseau local (LAN)</text><text x="635" y="205" font-size="12" text-anchor="middle" fill="#64748b">le reste du monde</text>
</svg>
