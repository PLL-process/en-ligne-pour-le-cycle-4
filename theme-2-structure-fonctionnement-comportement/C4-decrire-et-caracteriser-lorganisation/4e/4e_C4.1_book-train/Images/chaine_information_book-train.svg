<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1470 560" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Chaîne d'information simplifiée du Book Train de la New York Public Library</title>
<desc id="d">Schéma fonctionnel horizontal en trois blocs situés en haut : Acquérir (terminal de commande du lecteur, capteurs de station le long du rail, capteur de wagonnet vacant au poste de chargement), Traiter (automate PLC et serveur central qui comparent la position mesurée à la destination programmée dans chaque wagonnet), Communiquer (ordres envoyés au variateur du moteur, affichage au comptoir de distribution et signal de wagonnet disponible). La sortie utile, placée à droite du bloc Communiquer dans le sens de lecture, est une information : le livre demandé est arrivé au comptoir du troisième étage. Une flèche d'ordres rouge, décidés par le bloc Traiter et émis par le bloc Communiquer, descend vers un rappel de la chaîne d'énergie situé en bas du schéma, conformément à la convention : l'information en haut, l'énergie en bas, la flèche d'ordres qui descend et entre par la gauche du rappel, au-dessus de l'énergie d'entrée et sans la croiser. Le rappel simplifié de la chaîne d'énergie reçoit ainsi deux entrées à sa gauche, les ordres en haut et l'énergie extérieure 480 volts alternatif en bas, et produit à sa droite, sous l'information utile, l'action : déplacer le wagonnet.</desc>

<style>
  .flux-anime{animation:flux 1.1s linear infinite}
  @keyframes flux{to{stroke-dashoffset:-32}}
  @media (prefers-reduced-motion:reduce){.flux-anime{animation:none}}
  .pulse{filter:drop-shadow(0 0 2px rgba(77,144,184,.8))}
  @media (prefers-reduced-motion:reduce){.pulse{display:none}}
</style>

<defs>
  <linearGradient id="g-acier-f" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#44586c"/><stop offset="1" stop-color="#24313d"/>
  </linearGradient>
  <linearGradient id="g-bloc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f7fa"/>
  </linearGradient>
  <linearGradient id="g-acier" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2f6fa"/><stop offset="1" stop-color="#dfe8f0"/>
  </linearGradient>
  <linearGradient id="g-rose" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf3f2"/><stop offset="1" stop-color="#f7e3e1"/>
  </linearGradient>
  <filter id="ombre" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2d3a46" flood-opacity="0.22"/>
  </filter>
  <filter id="ombre-l" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#2d3a46" flood-opacity="0.15"/>
  </filter>
  <marker id="fleche" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L13,6.5 L0,13 z" fill="#7a5e28"/>
  </marker>
  <marker id="fleche-ordre" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L13,6.5 L0,13 z" fill="#8f221d"/>
  </marker>
  <marker id="fleche-info" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L13,6.5 L0,13 z" fill="#2d3a46"/>
  </marker>
</defs>

<!-- fond + zones pédagogiques teintées -->
<rect x="0" y="0" width="1470" height="560" fill="#fdfcf8"/>
<rect x="14" y="80" width="1442" height="292" rx="16" fill="#eef3f7" opacity="0.45"/>
<rect x="14" y="420" width="1442" height="126" rx="16" fill="#fbf0ef" opacity="0.5"/>
<text x="1442" y="102" font-size="12" font-weight="bold" fill="#7d94a8" text-anchor="end" letter-spacing="2">INFORMATION</text>
<text x="30" y="442" font-size="12" font-weight="bold" fill="#c9948f" letter-spacing="2">ÉNERGIE</text>

<!-- titre -->
<text x="30" y="42" font-size="26" font-weight="bold" font-family="Georgia, serif" fill="#2d3a46">🧠 Chaîne d'information simplifiée du Book Train</text>
<rect x="30" y="50" width="360" height="3" rx="1.5" fill="#a8823c"/>
<text x="30" y="70" font-size="15" fill="#5a6068" font-style="italic">De la commande du lecteur à l'ordre donné aux moteurs · le « cerveau » du système</text>

<!-- Entrées : les grandeurs captées -->
<g font-size="12.5" fill="#5a6068">
  <text x="36" y="118">demande du lecteur</text>
  <text x="36" y="160">position du wagonnet</text>
  <text x="36" y="202">wagonnet libre ou non</text>
  <line x1="176" y1="113" x2="216" y2="113" stroke="#2d3a46" stroke-width="2.5" marker-end="url(#fleche-info)"/>
  <line x1="176" y1="155" x2="216" y2="155" stroke="#2d3a46" stroke-width="2.5" marker-end="url(#fleche-info)"/>
  <line x1="176" y1="197" x2="216" y2="197" stroke="#2d3a46" stroke-width="2.5" marker-end="url(#fleche-info)"/>
</g>

<!-- Bloc ACQUÉRIR -->
<g filter="url(#ombre)">
  <rect x="220" y="90" width="230" height="150" rx="14" fill="url(#g-bloc)" stroke="#2d3a46" stroke-width="3"/>
  <path d="M220 104 a14 14 0 0 1 14 -14 h202 a14 14 0 0 1 14 14 v20 h-230 z" fill="url(#g-acier-f)"/>
</g>
<text x="335" y="113" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="1">ACQUÉRIR</text>
<text x="335" y="146" font-size="13.5" text-anchor="middle" fill="#20242e">① Terminal de commande</text>
<text x="335" y="163" font-size="12.5" text-anchor="middle" fill="#5a6068">(salle de lecture, 3ᵉ étage)</text>
<text x="335" y="186" font-size="13.5" text-anchor="middle" fill="#20242e">② Capteurs de station</text>
<text x="335" y="203" font-size="12.5" text-anchor="middle" fill="#5a6068">le long du rail (≈ 290 m)</text>
<text x="335" y="226" font-size="13.5" text-anchor="middle" fill="#20242e">③ Capteur « wagonnet vacant »</text>

<line x1="450" y1="165" x2="516" y2="165" stroke="#2d3a46" stroke-width="3.5" marker-end="url(#fleche-info)"/>
<g filter="url(#ombre-l)"><rect x="455" y="130" width="64" height="20" rx="10" fill="#fff" stroke="#c7d3dd"/></g>
<text x="487" y="144" font-size="11" font-weight="bold" fill="#5a6068" text-anchor="middle">signaux</text>

<!-- Bloc TRAITER -->
<g filter="url(#ombre)">
  <rect x="524" y="90" width="230" height="150" rx="14" fill="url(#g-bloc)" stroke="#2d3a46" stroke-width="3"/>
  <path d="M524 104 a14 14 0 0 1 14 -14 h202 a14 14 0 0 1 14 14 v20 h-230 z" fill="url(#g-acier-f)"/>
</g>
<text x="639" y="113" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="1">TRAITER</text>
<text x="639" y="146" font-size="13.5" text-anchor="middle" fill="#20242e">Automate (PLC) + serveur central</text>
<text x="639" y="170" font-size="13" text-anchor="middle" fill="#20242e">compare en permanence :</text>
<text x="639" y="190" font-size="13" font-weight="bold" text-anchor="middle" fill="#20242e">position mesurée = destination</text>
<text x="639" y="207" font-size="13" font-weight="bold" text-anchor="middle" fill="#20242e">programmée ?</text>
<text x="639" y="228" font-size="12" text-anchor="middle" fill="#5a6068">+ aiguille les 24 wagonnets sans collision</text>

<line x1="754" y1="165" x2="820" y2="165" stroke="#2d3a46" stroke-width="3.5" marker-end="url(#fleche-info)"/>
<g filter="url(#ombre-l)"><rect x="755" y="130" width="72" height="20" rx="10" fill="#fff" stroke="#c7d3dd"/></g>
<text x="791" y="144" font-size="11" font-weight="bold" fill="#5a6068" text-anchor="middle">décisions</text>

<!-- Bloc COMMUNIQUER -->
<g filter="url(#ombre)">
  <rect x="828" y="90" width="262" height="150" rx="14" fill="url(#g-bloc)" stroke="#2d3a46" stroke-width="3"/>
  <path d="M828 104 a14 14 0 0 1 14 -14 h234 a14 14 0 0 1 14 14 v20 h-262 z" fill="url(#g-acier-f)"/>
</g>
<text x="959" y="113" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="1">COMMUNIQUER</text>
<text x="959" y="146" font-size="13.5" text-anchor="middle" fill="#20242e">① Ordres au variateur du moteur</text>
<text x="959" y="163" font-size="12.5" text-anchor="middle" fill="#5a6068">(démarrer, ralentir, s'arrêter en station)</text>
<text x="959" y="186" font-size="13.5" text-anchor="middle" fill="#20242e">② Affichage au comptoir</text>
<text x="959" y="203" font-size="12.5" text-anchor="middle" fill="#5a6068">(« votre livre arrive »)</text>
<text x="959" y="226" font-size="13.5" text-anchor="middle" fill="#20242e">③ Signal « wagonnet disponible »</text>

<!-- Sortie utile : information -->
<line x1="1090" y1="165" x2="1112" y2="165" stroke="#2d3a46" stroke-width="3.5" marker-end="url(#fleche-info)"/>
<g filter="url(#ombre)">
  <rect x="1116" y="128" width="330" height="74" rx="34" fill="url(#g-acier)" stroke="#2d3a46" stroke-width="3"/>
</g>
<text x="1281" y="158" font-size="15" font-weight="bold" fill="#2d3a46" text-anchor="middle">📚 INFORMATION UTILE :</text>
<text x="1281" y="180" font-size="13" fill="#2d3a46" text-anchor="middle">le livre demandé est arrivé au comptoir du 3ᵉ étage</text>

<!-- Boucle de retour capteurs (rétroaction) -->
<path d="M 639 240 V 262 H 335 V 244" fill="none" stroke="#7a5e28" stroke-width="2.5" class="flux-anime" stroke-dasharray="7 4" marker-end="url(#fleche)"/>
<text x="487" y="256" font-size="12" fill="#7a5e28" text-anchor="middle" font-style="italic">rétroaction : les capteurs re-mesurent en continu</text>

<!-- Flèche d'ORDRE : elle sort de COMMUNIQUER (jamais d'Acquérir ni de Traiter) et descend -->
<path d="M 1000 240 V 300 H 300 V 455 H 336" fill="none" stroke="#8f221d" stroke-width="4" class="flux-anime" stroke-dasharray="10 6" marker-end="url(#fleche-ordre)"/>
<g filter="url(#ombre-l)">
  <rect x="908" y="312" width="186" height="84" rx="10" fill="#fff" stroke="#e4c8c5" stroke-width="1.5"/>
</g>
<text x="1086" y="332" font-size="14" font-weight="bold" fill="#8f221d" text-anchor="end">ORDRES</text>
<text x="1086" y="348" font-size="11.5" fill="#8f221d" text-anchor="end">décidés par Traiter,</text>
<text x="1086" y="362" font-size="11.5" fill="#8f221d" text-anchor="end">émis par Communiquer :</text>
<text x="1086" y="376" font-size="11.5" fill="#8f221d" text-anchor="end">l'information commande,</text>
<text x="1086" y="390" font-size="11.5" fill="#8f221d" text-anchor="end">l'énergie exécute</text>

<!-- séparation info / énergie -->
<line x1="20" y1="392" x2="240" y2="392" stroke="#a8823c" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="640" y1="392" x2="840" y2="392" stroke="#a8823c" stroke-width="1.5" stroke-dasharray="4 6"/>
<text x="250" y="397" font-size="12.5" fill="#a8823c" font-style="italic">— au-dessus : l'information décide · en dessous : l'énergie exécute —</text>

<!-- ============ Zone ÉNERGIE (rappel) ============ -->
<text x="290" y="446" font-size="11" font-weight="bold" font-style="italic" fill="#8f221d" text-anchor="end">ordres ↴</text>
<!-- entrées du rappel : ordres en haut, énergie en bas -->
<line x1="30" y1="502" x2="332" y2="502" stroke="#c0322b" stroke-width="3.5" marker-end="url(#fleche-ordre)"/>
<text x="40" y="492" font-size="11.5" font-weight="bold" font-style="italic" fill="#c0322b">⚡ énergie d'entrée · 480 V ~ (source extérieure)</text>
<g filter="url(#ombre-l)">
  <rect x="340" y="430" width="690" height="100" rx="14" fill="url(#g-rose)" stroke="#c0322b" stroke-width="2" stroke-dasharray="8 5"/>
</g>
<text x="685" y="463" font-size="15" font-weight="bold" fill="#8f221d" text-anchor="middle" letter-spacing="0.5">CHAÎNE D'ÉNERGIE (rappel simplifié)</text>
<text x="685" y="491" font-size="13.5" fill="#8f221d" text-anchor="middle">Alimenter (480 V ~ → 24 V ⎓) → Distribuer → Convertir → Transmettre</text>
<text x="685" y="513" font-size="11" fill="#a8564f" text-anchor="middle" font-style="italic">(détail : voir schéma « Chaîne d'énergie »)</text>
<!-- sortie : ACTION, à droite, sous l'information utile -->
<line x1="1030" y1="470" x2="1146" y2="470" stroke="#2b2f38" stroke-width="3.5" marker-end="url(#fleche-info)"/>
<g filter="url(#ombre)">
  <rect x="1150" y="436" width="286" height="70" rx="34" fill="#e7f5ed" stroke="#1e7d4f" stroke-width="2.5"/>
</g>
<text x="1293" y="464" font-size="13.5" font-weight="bold" fill="#1e7d4f" text-anchor="middle">🚃 ACTION :</text>
<text x="1293" y="485" font-size="12.5" fill="#1e7d4f" text-anchor="middle">déplacer le wagonnet</text>

<!-- légende (panneau) -->
<g filter="url(#ombre-l)">
  <rect x="30" y="248" width="254" height="96" rx="12" fill="#fff" stroke="#d9d2c0" stroke-width="1.5"/>
</g>
<text x="44" y="270" font-size="12" font-weight="bold" fill="#5a6068" letter-spacing="1">LÉGENDE</text>
<g font-size="12" fill="#20242e">
  <line x1="44" y1="288" x2="80" y2="288" stroke="#2d3a46" stroke-width="3" marker-end="url(#fleche-info)"/>
  <text x="88" y="293">flux d'informations</text>
  <line x1="44" y1="310" x2="80" y2="310" stroke="#8f221d" stroke-width="3" class="flux-anime" stroke-dasharray="9 5" marker-end="url(#fleche-ordre)"/>
  <text x="88" y="315">ordres (info → énergie)</text>
  <line x1="44" y1="332" x2="80" y2="332" stroke="#7a5e28" stroke-width="2.5" class="flux-anime" stroke-dasharray="7 4" marker-end="url(#fleche)"/>
  <text x="88" y="337">rétroaction (mesure continue)</text>
</g>

<!-- impulsions : l'information circule (trait plein = continu, la bille montre le sens) -->
<circle r="3" fill="#4d90b8" class="pulse" opacity="0.9"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite" path="M176,113 L216,113"/></circle>
<circle r="3" fill="#4d90b8" class="pulse" opacity="0.9"><animateMotion dur="1.2s" begin="0.4s" repeatCount="indefinite" path="M176,155 L216,155"/></circle>
<circle r="3" fill="#4d90b8" class="pulse" opacity="0.9"><animateMotion dur="1.2s" begin="0.8s" repeatCount="indefinite" path="M176,197 L216,197"/></circle>
<circle r="3.5" fill="#4d90b8" class="pulse" opacity="0.9"><animateMotion dur="1.1s" begin="0.2s" repeatCount="indefinite" path="M450,165 L516,165"/></circle>
<circle r="3.5" fill="#4d90b8" class="pulse" opacity="0.9"><animateMotion dur="1.1s" begin="0.55s" repeatCount="indefinite" path="M754,165 L820,165"/></circle>
<circle r="3.5" fill="#4d90b8" class="pulse" opacity="0.9"><animateMotion dur="1.2s" begin="0.3s" repeatCount="indefinite" path="M1090,165 L1110,165"/></circle>
<circle r="3" fill="#4d90b8" class="pulse" opacity="0.9"><animateMotion dur="1.3s" begin="0s" repeatCount="indefinite" path="M44,288 L80,288"/></circle>

<text x="30" y="552" font-size="11" fill="#8a929c">Schéma original CC0 — séquence « Book Train » · convention du dépôt : information en haut, énergie en bas, la flèche d'ordre descend.</text>
</svg>
