<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1030" viewBox="0 0 480 1030" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" style="width:100%;height:auto">
<title id="t">Algorigramme corrigé du trajet d’un livre dans le Book Train</title><desc id="d">Algorigramme de haut en bas. DÉBUT. Entrée : le lecteur commande un livre. Action : chercher le livre au sous-sol (magasinier). Test : wagonnet vacant disponible ? Si NON, la flèche remonte et rejoint le trait vertical juste au-dessus du test : on attend. Si OUI : déposer le livre et programmer la destination, puis rouler (tunnel puis montée verticale). Test : arrivé à la station du 3ᵉ étage ? Si NON, la flèche remonte et rejoint le trait vertical juste au-dessus de « rouler » : on continue de rouler. Si OUI : sortie, le livre est remis au lecteur ; action : repartir à vide au sous-sol. FIN.</desc>
<defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1a1a1a"/></marker></defs>
<rect width="480" height="1030" fill="#ffffff"/>
<path d="M 240 64 L 240 93" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pointe)"/>
<path d="M 240 150 L 240 179" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pointe)"/>
<path d="M 240 236 L 240 266" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<path d="M 240 266 L 240 289" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pointe)"/>
<path d="M 105 345 L 60 345 L 60 266 L 239 266" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pointe)"/>
<path d="M 240 400 L 240 439" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pointe)"/>
<path d="M 240 496 L 240 526" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<path d="M 240 526 L 240 549" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pointe)"/>
<path d="M 240 606 L 240 635" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pointe)"/>
<path d="M 105 691 L 60 691 L 60 526 L 239 526" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pointe)"/>
<path d="M 240 746 L 240 785" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pointe)"/>
<path d="M 240 842 L 240 871" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pointe)"/>
<path d="M 240 928 L 240 957" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pointe)"/>
<circle cx="240" cy="266" r="4" fill="#1a1a1a"/>
<circle cx="240" cy="526" r="4" fill="#1a1a1a"/>
<rect x="180" y="20" width="120" height="44" rx="22" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
<text x="240" y="47" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="700">DÉBUT</text>
<polygon points="140,94 360,94 340,150 120,150" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
<text x="240" y="117.5" font-size="15" text-anchor="middle" fill="#1a1a1a">Entrée : le lecteur</text>
<text x="240" y="136.5" font-size="15" text-anchor="middle" fill="#1a1a1a">commande un livre</text>
<rect x="120" y="180" width="240" height="56" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
<text x="240" y="203.5" font-size="15" text-anchor="middle" fill="#1a1a1a">Chercher le livre au sous-sol</text>
<text x="240" y="222.5" font-size="15" text-anchor="middle" fill="#1a1a1a">(magasinier)</text>
<polygon points="240,290 375,345 240,400 105,345" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
<text x="240" y="340.5" font-size="15" text-anchor="middle" fill="#1a1a1a">Wagonnet vacant</text>
<text x="240" y="359.5" font-size="15" text-anchor="middle" fill="#1a1a1a">disponible ?</text>
<rect x="120" y="440" width="240" height="56" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
<text x="240" y="463.5" font-size="15" text-anchor="middle" fill="#1a1a1a">Déposer le livre et</text>
<text x="240" y="482.5" font-size="15" text-anchor="middle" fill="#1a1a1a">programmer la destination</text>
<rect x="120" y="550" width="240" height="56" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
<text x="240" y="573.5" font-size="15" text-anchor="middle" fill="#1a1a1a">Rouler : tunnel puis</text>
<text x="240" y="592.5" font-size="15" text-anchor="middle" fill="#1a1a1a">montée verticale</text>
<polygon points="240,636 375,691 240,746 105,691" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
<text x="240" y="686.5" font-size="15" text-anchor="middle" fill="#1a1a1a">Arrivé à la station</text>
<text x="240" y="705.5" font-size="15" text-anchor="middle" fill="#1a1a1a">du 3ᵉ étage ?</text>
<polygon points="140,786 360,786 340,842 120,842" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
<text x="240" y="809.5" font-size="15" text-anchor="middle" fill="#1a1a1a">Sortie : le livre est</text>
<text x="240" y="828.5" font-size="15" text-anchor="middle" fill="#1a1a1a">remis au lecteur</text>
<rect x="120" y="872" width="240" height="56" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
<text x="240" y="905" font-size="15" text-anchor="middle" fill="#1a1a1a">Repartir à vide au sous-sol</text>
<rect x="180" y="958" width="120" height="44" rx="22" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
<text x="240" y="985" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="700">FIN</text>
<rect x="63" y="316" width="38" height="19" fill="#ffffff"/><text x="82" y="330" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">NON</text>
<rect x="243" y="408" width="38" height="19" fill="#ffffff"/><text x="262" y="422" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">OUI</text>
<rect x="63" y="662" width="38" height="19" fill="#ffffff"/><text x="82" y="676" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">NON</text>
<rect x="243" y="754" width="38" height="19" fill="#ffffff"/><text x="262" y="768" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">OUI</text>
</svg>
