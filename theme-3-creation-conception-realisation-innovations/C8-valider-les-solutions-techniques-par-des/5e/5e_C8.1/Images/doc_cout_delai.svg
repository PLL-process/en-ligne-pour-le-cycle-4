<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 381" width="350" height="381" role="img" aria-labelledby="t_cout_delai d_cout_delai" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_cout_delai">Les 40 patères : marge, coût, délai</title>
<desc id="d_cout_delai">Les quatre matériaux qui tiennent, pour 40 patères ; l'atelier dispose de 8 heures. PLA : coefficient 3,8, coût 24 euros, 30 heures d'atelier. PVC : coefficient 3,8, coût 84 euros, 6,7 heures d'atelier. Aluminium : coefficient 11,9, coût 192 euros, 10 heures d'atelier. Acier doux : coefficient 20,0, coût 220 euros, 10 heures d'atelier.</desc>
<rect width="350" height="381" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Les 40 patères : marge, coût, délai</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Les quatre matériaux qui tiennent</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">(k ≥ 3). L'atelier dispose de 8 heures.</text>
<rect x="14.0" y="87.4" width="322.0" height="170.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Matériau</text>
<text x="155.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">k</text>
<text x="226.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Coût</text>
<text x="301.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Atelier</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">PLA</text>
<text x="155.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">3,8</text>
<text x="226.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">24 €</text>
<text x="301.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">30 h</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">PVC</text>
<text x="155.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">3,8</text>
<text x="226.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">84 €</text>
<text x="301.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">6,7 h</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Aluminium</text>
<text x="155.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">11,9</text>
<text x="226.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">192 €</text>
<text x="301.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">10 h</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Acier doux</text>
<text x="155.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">20,0</text>
<text x="226.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">220 €</text>
<text x="301.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">10 h</text>
<text x="14.0" y="287.6" font-size="13.5" fill="#9bbefc">k : coefficient de sécurité, sur la limite élastique</text>
<text x="14.0" y="305.8" font-size="13.5" fill="#9bbefc">· € : euro · h : heure · Acier : galvanisé contre la</text>
<text x="14.0" y="324.0" font-size="13.5" fill="#9bbefc">rouille, compris dans le coût. PLA : plastique des</text>
<text x="14.0" y="342.3" font-size="13.5" fill="#9bbefc">imprimantes 3D (trois dimensions) · PVC :</text>
<text x="14.0" y="360.5" font-size="13.5" fill="#9bbefc">plastique rigide, celui des tuyaux.</text>
</svg>
