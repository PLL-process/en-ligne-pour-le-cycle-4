<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 378" width="350" height="378" role="img" aria-labelledby="t_plie_casse d_plie_casse" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_plie_casse">Quand le crochet plie, quand il casse</title>
<desc id="d_plie_casse">Pour chaque matériau du crochet, la charge à partir de laquelle il plie pour toujours, calculée par la simulation, et la charge à laquelle il casse, relevée au banc d'essai. Bois (pin) : plie à 25 kilogrammes, casse à 41 kilogrammes. PLA : plie à 46 kilogrammes, casse à 51 kilogrammes. PVC : plie à 46 kilogrammes, casse à 53 kilogrammes. Aluminium : plie à 143 kilogrammes, casse à 194 kilogrammes. Acier doux : plie à 240 kilogrammes, casse à 408 kilogrammes.</desc>
<rect width="350" height="378" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Quand le crochet plie, quand il casse</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Plie à : il reste tordu, calculé par la</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">simulation. Casse à : relevé au banc d'essai.</text>
<rect x="14.0" y="87.4" width="322.0" height="204.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Matériau</text>
<text x="192.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Plie à</text>
<text x="288.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Casse à</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Bois (pin)</text>
<text x="192.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">25 kg</text>
<text x="288.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">41 kg</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">PLA</text>
<text x="192.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">46 kg</text>
<text x="288.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">51 kg</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">PVC</text>
<text x="192.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">46 kg</text>
<text x="288.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">53 kg</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Aluminium</text>
<text x="192.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">143 kg</text>
<text x="288.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">194 kg</text>
<line x1="14" y1="257.4" x2="336" y2="257.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="279.4" font-size="15" fill="#e4eaf5" font-weight="700">Acier doux</text>
<text x="192.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">240 kg</text>
<text x="288.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">408 kg</text>
<text x="14.0" y="321.6" font-size="13.5" fill="#9bbefc">kg : kilogramme. PLA : plastique des imprimantes 3D</text>
<text x="14.0" y="339.8" font-size="13.5" fill="#9bbefc">(trois dimensions) · PVC : plastique rigide, celui</text>
<text x="14.0" y="358.0" font-size="13.5" fill="#9bbefc">des tuyaux.</text>
</svg>
