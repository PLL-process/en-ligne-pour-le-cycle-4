<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 419" width="350" height="419" role="img" aria-labelledby="t_deux_coefficients d_deux_coefficients" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_deux_coefficients">Le coefficient de sécurité du crochet</title>
<desc id="d_deux_coefficients">Le coefficient de sécurité du crochet, sous 12 kilogrammes ; le gestionnaire exige 3 au moins. Pour chaque matériau, calculé sur la rupture, puis sur la limite élastique. Bois (pin) : sur la rupture 3,4, sur l'élastique 2,1. PLA : sur la rupture 4,2, sur l'élastique 3,8. PVC : sur la rupture 4,4, sur l'élastique 3,8. Aluminium : sur la rupture 16,1, sur l'élastique 11,9. Acier doux : sur la rupture 34,0, sur l'élastique 20,0.</desc>
<rect width="350" height="419" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le coefficient de</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">sécurité du crochet</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Sous 12 kg, la charge de service.</text>
<text x="14.0" y="94.3" font-size="13.5" fill="#9bbefc">Le gestionnaire exige 3 au moins.</text>
<rect x="14.0" y="110.3" width="322.0" height="204.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700">Matériau</text>
<text x="167.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Sur la rupture</text>
<text x="278.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Sur l'élastique</text>
<line x1="14" y1="144.3" x2="336" y2="144.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="166.3" font-size="15" fill="#e4eaf5" font-weight="700">Bois (pin)</text>
<text x="167.0" y="166.3" font-size="15" fill="#e4eaf5" text-anchor="middle">3,4</text>
<text x="278.0" y="166.3" font-size="15" fill="#e4eaf5" text-anchor="middle">2,1</text>
<line x1="14" y1="178.3" x2="336" y2="178.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="200.3" font-size="15" fill="#e4eaf5" font-weight="700">PLA</text>
<text x="167.0" y="200.3" font-size="15" fill="#e4eaf5" text-anchor="middle">4,2</text>
<text x="278.0" y="200.3" font-size="15" fill="#e4eaf5" text-anchor="middle">3,8</text>
<line x1="14" y1="212.3" x2="336" y2="212.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="234.3" font-size="15" fill="#e4eaf5" font-weight="700">PVC</text>
<text x="167.0" y="234.3" font-size="15" fill="#e4eaf5" text-anchor="middle">4,4</text>
<text x="278.0" y="234.3" font-size="15" fill="#e4eaf5" text-anchor="middle">3,8</text>
<line x1="14" y1="246.3" x2="336" y2="246.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="268.4" font-size="15" fill="#e4eaf5" font-weight="700">Aluminium</text>
<text x="167.0" y="268.4" font-size="15" fill="#e4eaf5" text-anchor="middle">16,1</text>
<text x="278.0" y="268.4" font-size="15" fill="#e4eaf5" text-anchor="middle">11,9</text>
<line x1="14" y1="280.4" x2="336" y2="280.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="302.4" font-size="15" fill="#e4eaf5" font-weight="700">Acier doux</text>
<text x="167.0" y="302.4" font-size="15" fill="#e4eaf5" text-anchor="middle">34,0</text>
<text x="278.0" y="302.4" font-size="15" fill="#e4eaf5" text-anchor="middle">20,0</text>
<text x="14.0" y="344.5" font-size="13.5" fill="#9bbefc">Sur la rupture : la limite où le crochet casse. Sur</text>
<text x="14.0" y="362.8" font-size="13.5" fill="#9bbefc">l'élastique : la limite où il plie pour toujours. PLA :</text>
<text x="14.0" y="381.0" font-size="13.5" fill="#9bbefc">plastique des imprimantes 3D (trois dimensions) ·</text>
<text x="14.0" y="399.2" font-size="13.5" fill="#9bbefc">PVC : plastique rigide, celui des tuyaux.</text>
</svg>
