<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 823" width="350" height="823" role="img" aria-labelledby="t_angles_morts d_angles_morts" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_angles_morts">Ce que l'essai de traction ne voit pas</title>
<desc id="d_angles_morts">Le hall du collège : l'air de la Martinique est salé ; les sacs y arrivent trempés par l'averse de midi ; exigé 40 kilogrammes. Pour chaque matériau, sa charge de rupture au banc et ce que l'essai de traction ne voit pas. Bois (pin), 41 kilogrammes : Un nœud dans la pièce, et il casse bien plus tôt. PLA imprimé en 3D, 51 kilogrammes : En travers des couches, il se déchire à moins de la moitié. PVC rigide, 53 kilogrammes : Il flue : sous une charge permanente, il se déforme lentement. Aluminium, 194 kilogrammes : Léger et solide ; il se raye, et plie avant de casser. Acier doux, 408 kilogrammes : En bord de mer, sans protection, il rouille.</desc>
<rect width="350" height="823" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Ce que l'essai de</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">traction ne voit pas</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Les cinq matériaux tiennent au</text>
<text x="14.0" y="94.3" font-size="13.5" fill="#9bbefc">banc. Le hall, lui, a ses contraintes.</text>
<rect x="14.0" y="110.3" width="322.0" height="132.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="140.3" font-size="16" fill="#ffb454" font-weight="700">Le hall du collège</text>
<text x="26.0" y="167.3" font-size="15" fill="#e4eaf5">L'air de la Martinique est salé.</text>
<text x="26.0" y="188.3" font-size="15" fill="#e4eaf5">Les sacs y arrivent trempés par</text>
<text x="26.0" y="209.3" font-size="15" fill="#e4eaf5">l'averse de midi.</text>
<text x="26.0" y="230.3" font-size="15" fill="#e4eaf5">Exigé : 40 kg.</text>
<rect x="14.0" y="258.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="288.4" font-size="16" fill="#61dafb" font-weight="700">Bois (pin) · 41 kg</text>
<text x="26.0" y="315.4" font-size="15" fill="#e4eaf5">Un nœud dans la pièce, et il casse bien</text>
<text x="26.0" y="336.4" font-size="15" fill="#e4eaf5">plus tôt.</text>
<rect x="14.0" y="364.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="394.4" font-size="16" fill="#61dafb" font-weight="700">PLA imprimé en 3D · 51 kg</text>
<text x="26.0" y="421.4" font-size="15" fill="#e4eaf5">En travers des couches, il se déchire à</text>
<text x="26.0" y="442.4" font-size="15" fill="#e4eaf5">moins de la moitié.</text>
<rect x="14.0" y="470.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="500.4" font-size="16" fill="#61dafb" font-weight="700">PVC rigide · 53 kg</text>
<text x="26.0" y="527.4" font-size="15" fill="#e4eaf5">Il flue : sous une charge permanente, il</text>
<text x="26.0" y="548.4" font-size="15" fill="#e4eaf5">se déforme lentement.</text>
<rect x="14.0" y="576.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="606.4" font-size="16" fill="#61dafb" font-weight="700">Aluminium · 194 kg</text>
<text x="26.0" y="633.4" font-size="15" fill="#e4eaf5">Léger et solide ; il se raye, et plie avant</text>
<text x="26.0" y="654.4" font-size="15" fill="#e4eaf5">de casser.</text>
<rect x="14.0" y="682.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="712.4" font-size="16" fill="#61dafb" font-weight="700">Acier doux · 408 kg</text>
<text x="26.0" y="739.4" font-size="15" fill="#e4eaf5">En bord de mer, sans protection, il</text>
<text x="26.0" y="760.4" font-size="15" fill="#e4eaf5">rouille.</text>
<text x="14.0" y="802.5" font-size="13.5" fill="#9bbefc">kg : kilogramme. PLA, PVC : deux plastiques.</text>
</svg>
