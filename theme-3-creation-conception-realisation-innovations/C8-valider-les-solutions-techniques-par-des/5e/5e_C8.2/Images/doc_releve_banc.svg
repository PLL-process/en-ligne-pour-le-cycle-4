<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 484" width="350" height="484" role="img" aria-labelledby="t_releve_banc d_releve_banc" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_releve_banc">Le relevé du banc d'essai</title>
<desc id="d_releve_banc">Le relevé du banc d'essai : essai de traction, une éprouvette neuve de 10 millimètres carrés par matériau, valeurs simulées. Exigé : 40 kilogrammes, un sac de 8 kilogrammes avec un coefficient de 5. Charge de rupture : Bois (pin), 41 kilogrammes ; PLA imprimé en 3D, 51 kilogrammes ; PVC rigide, 53 kilogrammes ; Aluminium, 194 kilogrammes ; Acier doux, 408 kilogrammes.</desc>
<rect width="350" height="484" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le relevé du banc d'essai</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Essai de traction, une éprouvette neuve</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">de 10 mm² par matériau. Valeurs simulées.</text>
<rect x="14.0" y="87.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="117.4" font-size="16" fill="#ffb454" font-weight="700">Ce qu'exige le gestionnaire</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">Un sac de 8 kg, un coefficient de 5 : la</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">patère doit tenir 40 kg.</text>
<rect x="14.0" y="193.4" width="322.0" height="204.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="215.4" font-size="13.5" fill="#61dafb" font-weight="700">Matériau</text>
<text x="275.0" y="215.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Casse à</text>
<line x1="14" y1="227.4" x2="336" y2="227.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="249.4" font-size="15" fill="#e4eaf5" font-weight="700">Bois (pin)</text>
<text x="275.0" y="249.4" font-size="15" fill="#e4eaf5" text-anchor="middle">41 kg</text>
<line x1="14" y1="261.4" x2="336" y2="261.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="283.4" font-size="15" fill="#e4eaf5" font-weight="700">PLA imprimé en 3D</text>
<text x="275.0" y="283.4" font-size="15" fill="#e4eaf5" text-anchor="middle">51 kg</text>
<line x1="14" y1="295.4" x2="336" y2="295.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="317.4" font-size="15" fill="#e4eaf5" font-weight="700">PVC rigide</text>
<text x="275.0" y="317.4" font-size="15" fill="#e4eaf5" text-anchor="middle">53 kg</text>
<line x1="14" y1="329.4" x2="336" y2="329.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="351.4" font-size="15" fill="#e4eaf5" font-weight="700">Aluminium</text>
<text x="275.0" y="351.4" font-size="15" fill="#e4eaf5" text-anchor="middle">194 kg</text>
<line x1="14" y1="363.4" x2="336" y2="363.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="385.4" font-size="15" fill="#e4eaf5" font-weight="700">Acier doux</text>
<text x="275.0" y="385.4" font-size="15" fill="#e4eaf5" text-anchor="middle">408 kg</text>
<text x="14.0" y="427.6" font-size="13.5" fill="#9bbefc">kg : kilogramme · mm² : millimètre carré. PLA :</text>
<text x="14.0" y="445.8" font-size="13.5" fill="#9bbefc">plastique des imprimantes 3D (trois dimensions) ·</text>
<text x="14.0" y="464.0" font-size="13.5" fill="#9bbefc">PVC : plastique rigide, celui des tuyaux.</text>
</svg>
