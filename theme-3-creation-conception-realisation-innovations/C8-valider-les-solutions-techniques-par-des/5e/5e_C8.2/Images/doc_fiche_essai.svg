<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 397" width="350" height="397" role="img" aria-labelledby="t_fiche_essai d_fiche_essai" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_fiche_essai">La fiche d'essai de l'aluminium</title>
<desc id="d_fiche_essai">La fiche d'essai de l'aluminium. Essai de traction : on tire dans l'axe de l'éprouvette. Éprouvette neuve, de 10 millimètres carrés de section, la même pour les cinq matériaux. Charge ajoutée par paliers, jusqu'à la rupture. Rupture à 194 kilogrammes. Valeurs simulées.</desc>
<rect width="350" height="397" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">La fiche d'essai de l'aluminium</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Ce que l'élève a noté au banc, avec sa mesure.</text>
<rect x="14.0" y="69.2" width="322.0" height="174.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="99.2" font-size="16" fill="#61dafb" font-weight="700">Comment l'essai a été fait</text>
<text x="26.0" y="126.2" font-size="15" fill="#e4eaf5">Essai de traction : on tire dans l'axe de</text>
<text x="26.0" y="147.2" font-size="15" fill="#e4eaf5">l'éprouvette.</text>
<text x="26.0" y="168.2" font-size="15" fill="#e4eaf5">Éprouvette neuve, de 10 mm² de section,</text>
<text x="26.0" y="189.2" font-size="15" fill="#e4eaf5">la même pour les cinq matériaux.</text>
<text x="26.0" y="210.2" font-size="15" fill="#e4eaf5">Charge ajoutée par paliers, jusqu'à la</text>
<text x="26.0" y="231.2" font-size="15" fill="#e4eaf5">rupture.</text>
<rect x="14.0" y="259.2" width="322.0" height="88.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="289.2" font-size="16" fill="#61dafb" font-weight="700">Ce qui a été relevé</text>
<text x="26.0" y="317.2" font-size="13.5" fill="#9bbefc">Rupture à</text>
<text x="26.0" y="336.2" font-size="16" fill="#e4eaf5" font-weight="700">194 kg</text>
<text x="175.0" y="317.2" font-size="13.5" fill="#9bbefc">Valeurs</text>
<text x="175.0" y="336.2" font-size="16" fill="#e4eaf5" font-weight="700">simulées</text>
<text x="14.0" y="377.4" font-size="13.5" fill="#9bbefc">kg : kilogramme · mm² : millimètre carré.</text>
</svg>
