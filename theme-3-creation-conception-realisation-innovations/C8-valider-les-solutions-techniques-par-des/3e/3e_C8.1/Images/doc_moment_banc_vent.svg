<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 396" width="350" height="396" role="img" aria-labelledby="t_moment_banc_vent d_moment_banc_vent" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_moment_banc_vent">Le moment au pied du mât</title>
<desc id="d_moment_banc_vent">Le moment au pied d'un mât de 2 000 millimètres, pour chaque profilé : sous la poussée du banc, 100 newtons en tête, puis sous le vent de 150 kilomètres par heure. Tube alu diamètre 50 : banc 200 newtons-mètres, vent 204 newtons-mètres. Barre acier diamètre 20 : banc 200 newtons-mètres, vent 128 newtons-mètres. Tube PVC diamètre 50 : banc 200 newtons-mètres, vent 204 newtons-mètres. Poutre bois 40sur40 : banc 200 newtons-mètres, vent 298 newtons-mètres. Tube acier diamètre 33,7 : banc 200 newtons-mètres, vent 163 newtons-mètres.</desc>
<rect width="350" height="396" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le moment au pied du mât</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Mât de 2 000 mm. Le banc pousse 100 N en tête ;</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">le vent de 150 km/h appuie sur toute la hauteur.</text>
<rect x="14.0" y="87.4" width="322.0" height="204.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Profilé</text>
<text x="222.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Banc</text>
<text x="298.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Vent</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Tube alu Ø50</text>
<text x="222.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">200 N·m</text>
<text x="298.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">204 N·m</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">Barre acier Ø20</text>
<text x="222.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">200 N·m</text>
<text x="298.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">128 N·m</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Tube PVC Ø50</text>
<text x="222.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">200 N·m</text>
<text x="298.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">204 N·m</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Poutre bois 40×40</text>
<text x="222.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">200 N·m</text>
<text x="298.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">298 N·m</text>
<line x1="14" y1="257.4" x2="336" y2="257.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="279.4" font-size="15" fill="#e4eaf5" font-weight="700">Tube acier Ø33,7</text>
<text x="222.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">200 N·m</text>
<text x="298.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">163 N·m</text>
<text x="14.0" y="321.6" font-size="13.5" fill="#9bbefc">N·m : newton-mètre · N : newton · mm : millimètre ·</text>
<text x="14.0" y="339.8" font-size="13.5" fill="#9bbefc">km/h : kilomètre par heure. Ø : diamètre, en</text>
<text x="14.0" y="358.0" font-size="13.5" fill="#9bbefc">millimètres · alu : aluminium · PVC : plastique rigide</text>
<text x="14.0" y="376.3" font-size="13.5" fill="#9bbefc">· tube acier : galvanisé contre la rouille.</text>
</svg>
