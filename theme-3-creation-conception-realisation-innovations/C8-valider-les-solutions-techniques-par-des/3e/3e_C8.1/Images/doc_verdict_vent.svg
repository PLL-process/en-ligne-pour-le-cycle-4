<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 437" width="350" height="437" role="img" aria-labelledby="t_verdict_vent d_verdict_vent" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_verdict_vent">Le mât sous le vent, profilé par profilé</title>
<desc id="d_verdict_vent">Le mât de 2 000 millimètres sous le vent de 150 kilomètres par heure, calculé sur la limite élastique ; il faut un coefficient de sécurité d'au moins 3 et une flèche en tête d'au plus 40 millimètres. Tube alu diamètre 50 : coefficient 3,4, flèche 27 millimètres. Barre acier diamètre 20 : coefficient 1,4, flèche 93 millimètres. Tube PVC diamètre 50 : coefficient 1,1, flèche 623 millimètres. Poutre bois 40sur40 : coefficient 0,9, flèche 145 millimètres. Tube acier diamètre 33,7 : coefficient 2,7, flèche 29 millimètres.</desc>
<rect width="350" height="437" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le mât sous le vent,</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">profilé par profilé</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Mât de 2 000 mm, vent de 150 km/h, sur la limite</text>
<text x="14.0" y="94.3" font-size="13.5" fill="#9bbefc">élastique. Exigé : k ≥ 3 et flèche ≤ 40 mm.</text>
<rect x="14.0" y="110.3" width="322.0" height="204.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700">Profilé</text>
<text x="217.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">k</text>
<text x="293.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Flèche</text>
<line x1="14" y1="144.3" x2="336" y2="144.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="166.3" font-size="15" fill="#e4eaf5" font-weight="700">Tube alu Ø50</text>
<text x="217.0" y="166.3" font-size="15" fill="#e4eaf5" text-anchor="middle">3,4</text>
<text x="293.0" y="166.3" font-size="15" fill="#e4eaf5" text-anchor="middle">27 mm</text>
<line x1="14" y1="178.3" x2="336" y2="178.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="200.3" font-size="15" fill="#e4eaf5" font-weight="700">Barre acier Ø20</text>
<text x="217.0" y="200.3" font-size="15" fill="#e4eaf5" text-anchor="middle">1,4</text>
<text x="293.0" y="200.3" font-size="15" fill="#e4eaf5" text-anchor="middle">93 mm</text>
<line x1="14" y1="212.3" x2="336" y2="212.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="234.3" font-size="15" fill="#e4eaf5" font-weight="700">Tube PVC Ø50</text>
<text x="217.0" y="234.3" font-size="15" fill="#e4eaf5" text-anchor="middle">1,1</text>
<text x="293.0" y="234.3" font-size="15" fill="#e4eaf5" text-anchor="middle">623 mm</text>
<line x1="14" y1="246.3" x2="336" y2="246.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="268.4" font-size="15" fill="#e4eaf5" font-weight="700">Poutre bois 40×40</text>
<text x="217.0" y="268.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,9</text>
<text x="293.0" y="268.4" font-size="15" fill="#e4eaf5" text-anchor="middle">145 mm</text>
<line x1="14" y1="280.4" x2="336" y2="280.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="302.4" font-size="15" fill="#e4eaf5" font-weight="700">Tube acier Ø33,7</text>
<text x="217.0" y="302.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2,7</text>
<text x="293.0" y="302.4" font-size="15" fill="#e4eaf5" text-anchor="middle">29 mm</text>
<text x="14.0" y="344.5" font-size="13.5" fill="#9bbefc">k : coefficient de sécurité · flèche : de combien</text>
<text x="14.0" y="362.8" font-size="13.5" fill="#9bbefc">la tête du mât se déplace · mm : millimètre · km/h :</text>
<text x="14.0" y="381.0" font-size="13.5" fill="#9bbefc">kilomètre par heure. Ø : diamètre, en millimètres ·</text>
<text x="14.0" y="399.2" font-size="13.5" fill="#9bbefc">alu : aluminium · PVC : plastique rigide · tube</text>
<text x="14.0" y="417.4" font-size="13.5" fill="#9bbefc">acier : galvanisé contre la rouille.</text>
</svg>
