<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 310" width="350" height="310" role="img" aria-labelledby="t_retenus_reglage d_retenus_reglage" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_retenus_reglage">Combien de profilés passent ?</title>
<desc id="d_retenus_reglage">Le nombre de profilés qui passent, sur 5, sous le vent de 150 kilomètres par heure, selon la hauteur du mât et la limite choisie ; un profilé passe avec un coefficient d'au moins 3 et une flèche d'au plus 40 millimètres. Mât de 1 200 millimètres : 4 sur la rupture, 2 sur la limite élastique. Mât de 1 500 millimètres : 3 sur la rupture, 2 sur la limite élastique. Mât de 2 000 millimètres : 2 sur la rupture, 1 sur la limite élastique.</desc>
<rect width="350" height="310" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Combien de profilés passent ?</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Sous le vent de 150 km/h. Passe :</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">k ≥ 3 et flèche ≤ 40 mm, sur 5 profilés.</text>
<rect x="14.0" y="87.4" width="322.0" height="136.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Mât de</text>
<text x="167.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Sur la rupture</text>
<text x="278.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Sur l'élastique</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">1 200 mm</text>
<text x="167.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">4</text>
<text x="278.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">1 500 mm</text>
<text x="167.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">3</text>
<text x="278.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">2 000 mm</text>
<text x="167.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2</text>
<text x="278.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">1</text>
<text x="14.0" y="253.6" font-size="13.5" fill="#9bbefc">Sur la rupture : la limite où le mât casse. Sur</text>
<text x="14.0" y="271.8" font-size="13.5" fill="#9bbefc">l'élastique : la limite où il reste tordu. mm :</text>
<text x="14.0" y="290.0" font-size="13.5" fill="#9bbefc">millimètre · km/h : kilomètre par heure.</text>
</svg>
