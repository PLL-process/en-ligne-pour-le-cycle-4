<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 396" width="350" height="396" role="img" aria-labelledby="t_releve_flexion d_releve_flexion" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_releve_flexion">Le relevé du banc, en flexion</title>
<desc id="d_releve_flexion">Le relevé du banc en flexion, pour un mât de 2 000 millimètres encastré au pied et poussé en tête ; il faut une rupture d'au moins 300 newtons et une flèche d'au plus 40 millimètres sous une charge d'essai de 100 newtons. Tube alu diamètre 50 : rupture à 467 newtons, flèche de 31,0 millimètres. Barre acier diamètre 20 : rupture à 157 newtons, flèche de 161,7 millimètres. Tube PVC diamètre 50 : rupture à 128 newtons, flèche de 723,8 millimètres. Poutre bois 40 sur 40 : rupture à 213 newtons, flèche de 113,6 millimètres. Tube acier diamètre 33,7 : rupture à 367 newtons, flèche de 41,1 millimètres.</desc>
<rect width="350" height="396" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le relevé du banc, en flexion</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Mât de 2 000 mm encastré au pied, poussé en tête.</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">Exigé : rupture ≥ 300 N, flèche ≤ 40 mm sous 100 N.</text>
<rect x="14.0" y="87.4" width="322.0" height="204.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Profilé</text>
<text x="200.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Rupture</text>
<text x="286.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Flèche</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Tube alu Ø50</text>
<text x="200.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">467 N</text>
<text x="286.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">31,0 mm</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">Barre acier Ø20</text>
<text x="200.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">157 N</text>
<text x="286.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">161,7 mm</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Tube PVC Ø50</text>
<text x="200.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">128 N</text>
<text x="286.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">723,8 mm</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Poutre bois 40×40</text>
<text x="200.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">213 N</text>
<text x="286.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">113,6 mm</text>
<line x1="14" y1="257.4" x2="336" y2="257.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="279.4" font-size="15" fill="#e4eaf5" font-weight="700">Tube acier Ø33,7</text>
<text x="200.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">367 N</text>
<text x="286.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">41,1 mm</text>
<text x="14.0" y="321.6" font-size="13.5" fill="#9bbefc">N : newton · mm : millimètre · flèche : de combien la</text>
<text x="14.0" y="339.8" font-size="13.5" fill="#9bbefc">tête du mât se déplace, sous 100 N. Ø : diamètre,</text>
<text x="14.0" y="358.0" font-size="13.5" fill="#9bbefc">en millimètres · alu : aluminium · PVC : plastique</text>
<text x="14.0" y="376.3" font-size="13.5" fill="#9bbefc">rigide · tube acier : galvanisé contre la rouille.</text>
</svg>
