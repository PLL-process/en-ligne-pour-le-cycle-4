<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 396" width="350" height="396" role="img" aria-labelledby="t_traction_flexion d_traction_flexion" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_traction_flexion">Deux essais, les cinq mêmes mâts</title>
<desc id="d_traction_flexion">La charge de rupture des cinq profilés, de 2 000 millimètres de haut : tirés dans leur axe, en traction, puis poussés en tête, en flexion. Tube alu diamètre 50 : traction 84,2 kilonewtons, flexion 467 newtons. Barre acier diamètre 20 : traction 125,7 kilonewtons, flexion 157 newtons. Tube PVC diamètre 50 : traction 23,0 kilonewtons, flexion 128 newtons. Poutre bois 40 sur 40 : traction 64,0 kilonewtons, flexion 213 newtons. Tube acier diamètre 33,7 : traction 101,6 kilonewtons, flexion 367 newtons.</desc>
<rect width="350" height="396" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Deux essais, les cinq mêmes mâts</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">La charge de rupture de chaque</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">profilé : tiré dans son axe (traction),</text>
<text x="14.0" y="89.6" font-size="13.5" fill="#9bbefc">puis poussé en tête (flexion).</text>
<rect x="14.0" y="105.6" width="322.0" height="204.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="127.6" font-size="13.5" fill="#61dafb" font-weight="700">Profilé</text>
<text x="222.0" y="127.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Traction</text>
<text x="298.0" y="127.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Flexion</text>
<line x1="14" y1="139.6" x2="336" y2="139.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="161.6" font-size="15" fill="#e4eaf5" font-weight="700">Tube alu Ø50</text>
<text x="222.0" y="161.6" font-size="15" fill="#e4eaf5" text-anchor="middle">84,2 kN</text>
<text x="298.0" y="161.6" font-size="15" fill="#e4eaf5" text-anchor="middle">467 N</text>
<line x1="14" y1="173.6" x2="336" y2="173.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="195.6" font-size="15" fill="#e4eaf5" font-weight="700">Barre acier Ø20</text>
<text x="222.0" y="195.6" font-size="15" fill="#e4eaf5" text-anchor="middle">125,7 kN</text>
<text x="298.0" y="195.6" font-size="15" fill="#e4eaf5" text-anchor="middle">157 N</text>
<line x1="14" y1="207.6" x2="336" y2="207.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="229.6" font-size="15" fill="#e4eaf5" font-weight="700">Tube PVC Ø50</text>
<text x="222.0" y="229.6" font-size="15" fill="#e4eaf5" text-anchor="middle">23,0 kN</text>
<text x="298.0" y="229.6" font-size="15" fill="#e4eaf5" text-anchor="middle">128 N</text>
<line x1="14" y1="241.6" x2="336" y2="241.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="263.6" font-size="15" fill="#e4eaf5" font-weight="700">Poutre bois 40×40</text>
<text x="222.0" y="263.6" font-size="15" fill="#e4eaf5" text-anchor="middle">64,0 kN</text>
<text x="298.0" y="263.6" font-size="15" fill="#e4eaf5" text-anchor="middle">213 N</text>
<line x1="14" y1="275.6" x2="336" y2="275.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="297.6" font-size="15" fill="#e4eaf5" font-weight="700">Tube acier Ø33,7</text>
<text x="222.0" y="297.6" font-size="15" fill="#e4eaf5" text-anchor="middle">101,6 kN</text>
<text x="298.0" y="297.6" font-size="15" fill="#e4eaf5" text-anchor="middle">367 N</text>
<text x="14.0" y="339.8" font-size="13.5" fill="#9bbefc">N : newton · kN : kilonewton, 1 000 N · Ø : diamètre,</text>
<text x="14.0" y="358.0" font-size="13.5" fill="#9bbefc">en millimètres · alu : aluminium · PVC : plastique</text>
<text x="14.0" y="376.3" font-size="13.5" fill="#9bbefc">rigide · tube acier : galvanisé contre la rouille.</text>
</svg>
