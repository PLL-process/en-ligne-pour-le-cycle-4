<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 588" width="350" height="588" role="img" aria-labelledby="t_protocole_console d_protocole_console" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_protocole_console">Le protocole de l'essai d'une console</title>
<desc id="d_protocole_console">Extrait du protocole de l'essai d'une console qui doit tenir 33 kilogrammes. La pièce : 3 consoles de 15 millimètres d'épaisseur, imprimées comme celles du toit. La charge : des sacs de sable de 5,5 kilogrammes, deux par palier : 11, 22, puis 33 kilogrammes ; on laisse 33 kilogrammes posés 5 minutes. La mesure : une règle graduée, debout près du bout de la console ; une lecture avant de charger, une à chaque palier, une fois les sacs retirés. Le critère, écrit avant l'essai : le cadre est vide.</desc>
<rect width="350" height="588" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le protocole de l'essai d'une console</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Extrait. La console porte une</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">jardinière ; elle doit tenir 33 kg.</text>
<rect x="14.0" y="87.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">La pièce</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">3 consoles de 15 mm d'épaisseur,</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">imprimées comme celles du toit.</text>
<rect x="14.0" y="193.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="223.4" font-size="16" fill="#61dafb" font-weight="700">La charge</text>
<text x="26.0" y="250.4" font-size="15" fill="#e4eaf5">Des sacs de sable de 5,5 kg, deux par</text>
<text x="26.0" y="271.4" font-size="15" fill="#e4eaf5">palier : 11 kg, 22 kg, puis 33 kg.</text>
<text x="26.0" y="292.4" font-size="15" fill="#e4eaf5">On laisse 33 kg posés 5 minutes.</text>
<rect x="14.0" y="320.4" width="322.0" height="132.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="350.4" font-size="16" fill="#61dafb" font-weight="700">La mesure</text>
<text x="26.0" y="377.4" font-size="15" fill="#e4eaf5">Une règle graduée, debout près du bout</text>
<text x="26.0" y="398.4" font-size="15" fill="#e4eaf5">de la console : une lecture avant de</text>
<text x="26.0" y="419.4" font-size="15" fill="#e4eaf5">charger, une à chaque palier, une fois</text>
<text x="26.0" y="440.4" font-size="15" fill="#e4eaf5">les sacs retirés.</text>
<rect x="14.0" y="468.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="498.4" font-size="16" fill="#ffb454" font-weight="700">Le critère, écrit avant l'essai</text>
<text x="26.0" y="525.4" font-size="15" fill="#e4eaf5">…………………………………………</text>
<text x="14.0" y="567.6" font-size="13.5" fill="#9bbefc">kg : kilogramme · mm : millimètre.</text>
</svg>
