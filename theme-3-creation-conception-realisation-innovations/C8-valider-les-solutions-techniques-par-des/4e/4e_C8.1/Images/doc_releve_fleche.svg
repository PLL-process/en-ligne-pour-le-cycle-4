<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 308" width="350" height="308" role="img" aria-labelledby="t_releve_fleche d_releve_fleche" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_releve_fleche">L'essai d'une console : la flèche</title>
<desc id="d_releve_fleche">Le relevé de l'essai d'une console. La flèche, c'est de combien le bout de la console descend sous la charge. Charge 0 kilogramme : 0 millimètre. Charge 11 kilogrammes : 4,1 millimètres. Charge 22 kilogrammes : case vide. Charge 33 kilogrammes : case vide.</desc>
<rect width="350" height="308" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">L'essai d'une console : la flèche</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">La flèche : de combien le bout de la</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">console descend sous la charge.</text>
<rect x="14.0" y="87.4" width="322.0" height="170.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Charge posée</text>
<text x="255.5" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Le bout descend de</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">0 kg</text>
<text x="255.5" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0 mm</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">11 kg</text>
<text x="255.5" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">4,1 mm</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">22 kg</text>
<text x="255.5" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">…</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">33 kg</text>
<text x="255.5" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">…</text>
<text x="14.0" y="287.6" font-size="13.5" fill="#9bbefc">kg : kilogramme · mm : millimètre.</text>
</svg>
