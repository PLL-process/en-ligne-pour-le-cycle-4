<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Pourquoi rejouer TOUT le protocole après une correction</title>
  <desc id="d">Comparaison en trois temps. Premier tableau, avant correction : stabilité conforme avec zéro virgule cinq centimètre pour une limite d'un centimètre, étanchéité conforme, LED conforme, gel non conforme, l'attache est fissurée. Au centre, la correction : l'attache plastique est remplacée par une attache en inox, plus résistante au froid mais aussi plus lourde. Troisième tableau, après correction, si l'on ne rejoue que le test de gel : le gel devient conforme, et les trois autres lignes portent un point d'interrogation, car elles n'ont pas été refaites. Et si l'on rejoue tout : le gel est conforme, l'étanchéité et la LED restent conformes, mais la stabilité passe à un virgule deux centimètre, au-dessus de la limite d'un centimètre : elle est devenue non conforme à cause du poids de la nouvelle attache. Conclusion : il n'y avait qu'un demi-centimètre de marge sur la stabilité ; une correction peut casser ce qui fonctionnait, et seule la reprise complète du protocole le révèle.</desc>
  <rect width="940" height="460" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Une correction peut casser ce qui marchait — seul le protocole entier le montre</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#c68ef2"/></marker></defs>

  <!-- avant -->
  <rect x="20" y="52" width="252" height="196" rx="10" fill="#0a1b3d" stroke="#274a8a" stroke-width="2"/>
  <text x="146" y="76" fill="#9bbefc" font-size="12.5" font-weight="bold" text-anchor="middle">AVANT correction</text>
  <text x="40" y="106" fill="#e4eaf5" font-size="11.5">stabilité</text>
  <text x="196" y="106" fill="#9bbefc" font-size="10.5" text-anchor="end">0,5 cm</text>
  <text x="252" y="106" fill="#81fba1" font-size="12" text-anchor="end">✔</text>
  <text x="40" y="140" fill="#e4eaf5" font-size="11.5">étanchéité</text>
  <text x="252" y="140" fill="#81fba1" font-size="12" text-anchor="end">✔</text>
  <text x="40" y="174" fill="#e4eaf5" font-size="11.5">LED à 3 m</text>
  <text x="252" y="174" fill="#81fba1" font-size="12" text-anchor="end">✔</text>
  <text x="40" y="208" fill="#e4eaf5" font-size="11.5">gel −8 °C</text>
  <text x="196" y="208" fill="#ff7b88" font-size="10.5" text-anchor="end">fissurée</text>
  <text x="252" y="208" fill="#ff7b88" font-size="12" text-anchor="end">✘</text>
  <text x="146" y="236" fill="#9bbefc" font-size="10.5" text-anchor="middle">marge sur la stabilité : 0,5 cm</text>

  <!-- correction -->
  <path d="M276 150 L316 150" stroke="#c68ef2" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="322" y="94" width="296" height="112" rx="10" fill="#1a1230" stroke="#c68ef2" stroke-width="2"/>
  <text x="470" y="120" fill="#c68ef2" font-size="13" font-weight="bold" text-anchor="middle">LA CORRECTION</text>
  <text x="470" y="146" fill="#e4eaf5" font-size="12" text-anchor="middle">attache plastique → attache INOX</text>
  <text x="470" y="172" fill="#81fba1" font-size="11.5" text-anchor="middle">+ résistante au froid</text>
  <text x="470" y="192" fill="#ffd66b" font-size="11.5" text-anchor="middle">… et plus LOURDE</text>
  <path d="M622 150 L662 150" stroke="#c68ef2" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- apres, partiel -->
  <rect x="668" y="52" width="252" height="196" rx="10" fill="#1a1230" stroke="#ff7b88" stroke-width="2"/>
  <text x="794" y="76" fill="#ff7b88" font-size="12" font-weight="bold" text-anchor="middle">On ne rejoue QUE le gel</text>
  <text x="688" y="106" fill="#e4eaf5" font-size="11.5">stabilité</text>
  <text x="900" y="106" fill="#ffd66b" font-size="13" text-anchor="end" font-weight="bold">?</text>
  <text x="688" y="140" fill="#e4eaf5" font-size="11.5">étanchéité</text>
  <text x="900" y="140" fill="#ffd66b" font-size="13" text-anchor="end" font-weight="bold">?</text>
  <text x="688" y="174" fill="#e4eaf5" font-size="11.5">LED à 3 m</text>
  <text x="900" y="174" fill="#ffd66b" font-size="13" text-anchor="end" font-weight="bold">?</text>
  <text x="688" y="208" fill="#e4eaf5" font-size="11.5">gel −8 °C</text>
  <text x="900" y="208" fill="#81fba1" font-size="12" text-anchor="end">✔</text>
  <text x="794" y="236" fill="#ff7b88" font-size="10.5" text-anchor="middle">trois lignes non vérifiées sur le NOUVEL objet</text>

  <!-- apres, complet -->
  <rect x="240" y="268" width="460" height="140" rx="10" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="470" y="294" fill="#81fba1" font-size="12.5" font-weight="bold" text-anchor="middle">On rejoue TOUT le protocole</text>
  <text x="266" y="322" fill="#e4eaf5" font-size="11.5">stabilité</text>
  <text x="600" y="322" fill="#ff7b88" font-size="11" text-anchor="end">1,2 cm — la limite était 1 cm</text>
  <text x="676" y="322" fill="#ff7b88" font-size="13" text-anchor="end" font-weight="bold">✘</text>
  <text x="266" y="348" fill="#e4eaf5" font-size="11.5">étanchéité</text>
  <text x="676" y="348" fill="#81fba1" font-size="12" text-anchor="end">✔</text>
  <text x="266" y="374" fill="#e4eaf5" font-size="11.5">LED à 3 m</text>
  <text x="676" y="374" fill="#81fba1" font-size="12" text-anchor="end">✔</text>
  <text x="266" y="400" fill="#e4eaf5" font-size="11.5">gel −8 °C</text>
  <text x="676" y="400" fill="#81fba1" font-size="12" text-anchor="end">✔</text>

  <text x="470" y="440" fill="#c68ef2" font-size="13" text-anchor="middle" font-weight="bold">Le gel est réparé — et la stabilité, elle, vient de tomber. On ne l'aurait jamais su.</text>
</svg>
