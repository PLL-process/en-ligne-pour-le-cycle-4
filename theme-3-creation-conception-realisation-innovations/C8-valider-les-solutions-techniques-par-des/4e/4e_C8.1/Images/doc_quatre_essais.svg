<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 592" width="350" height="592" role="img" aria-labelledby="t_quatre_essais d_quatre_essais" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_quatre_essais">Les quatre essais du support</title>
<desc id="d_quatre_essais">Les quatre essais du support du capteur, pour les jardinières d'un toit de New York. Pour chacun, l'attendu écrit avant l'essai, puis l'observé. Secousses pendant 10 secondes, de combien il bouge : attendu moins de 1 centimètre, observé 0,5 centimètre. Pluie pendant 30 secondes, gouttes à l'intérieur : attendu 0 goutte, observé 0 goutte. LED à 3 mètres, en plein soleil : attendu visible, observé visible. Gel à moins 8 degrés Celsius, l'attache est : attendu intacte, observé fissurée.</desc>
<rect width="350" height="592" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Les quatre essais du support</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le support du capteur, pour les</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">jardinières d'un toit de New York.</text>
<text x="14.0" y="89.6" font-size="13.5" fill="#9bbefc">L'attendu est écrit avant l'essai.</text>
<rect x="14.0" y="105.6" width="322.0" height="88.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="135.6" font-size="16" fill="#61dafb" font-weight="700">Secousses (10 s) : il bouge de</text>
<text x="26.0" y="163.6" font-size="13.5" fill="#9bbefc">Attendu</text>
<text x="26.0" y="182.6" font-size="16" fill="#e4eaf5" font-weight="700">moins de 1 cm</text>
<text x="175.0" y="163.6" font-size="13.5" fill="#9bbefc">Observé</text>
<text x="175.0" y="182.6" font-size="16" fill="#e4eaf5" font-weight="700">0,5 cm</text>
<rect x="14.0" y="209.6" width="322.0" height="88.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="239.6" font-size="16" fill="#61dafb" font-weight="700">Pluie (30 s) : gouttes à l'intérieur</text>
<text x="26.0" y="267.6" font-size="13.5" fill="#9bbefc">Attendu</text>
<text x="26.0" y="286.6" font-size="16" fill="#e4eaf5" font-weight="700">0 goutte</text>
<text x="175.0" y="267.6" font-size="13.5" fill="#9bbefc">Observé</text>
<text x="175.0" y="286.6" font-size="16" fill="#e4eaf5" font-weight="700">0 goutte</text>
<rect x="14.0" y="313.6" width="322.0" height="88.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="343.6" font-size="16" fill="#61dafb" font-weight="700">LED à 3 m, en plein soleil</text>
<text x="26.0" y="371.6" font-size="13.5" fill="#9bbefc">Attendu</text>
<text x="26.0" y="390.6" font-size="16" fill="#e4eaf5" font-weight="700">visible</text>
<text x="175.0" y="371.6" font-size="13.5" fill="#9bbefc">Observé</text>
<text x="175.0" y="390.6" font-size="16" fill="#e4eaf5" font-weight="700">visible</text>
<rect x="14.0" y="417.6" width="322.0" height="88.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="447.6" font-size="16" fill="#61dafb" font-weight="700">Gel (−8 °C) : l'attache est</text>
<text x="26.0" y="475.6" font-size="13.5" fill="#9bbefc">Attendu</text>
<text x="26.0" y="494.6" font-size="16" fill="#e4eaf5" font-weight="700">intacte</text>
<text x="175.0" y="475.6" font-size="13.5" fill="#9bbefc">Observé</text>
<text x="175.0" y="494.6" font-size="16" fill="#e4eaf5" font-weight="700">fissurée</text>
<text x="14.0" y="535.8" font-size="13.5" fill="#9bbefc">s : seconde · cm : centimètre · m : mètre · °C :</text>
<text x="14.0" y="554.0" font-size="13.5" fill="#9bbefc">degré Celsius · LED : petite lampe qui s'allume (en</text>
<text x="14.0" y="572.3" font-size="13.5" fill="#9bbefc">anglais, light-emitting diode).</text>
</svg>
