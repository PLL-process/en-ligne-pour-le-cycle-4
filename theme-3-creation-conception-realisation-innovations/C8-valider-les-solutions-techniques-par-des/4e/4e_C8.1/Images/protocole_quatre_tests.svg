<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le protocole du support : quatre tests, quatre attendus chiffrés, une décision</title>
  <desc id="d">Tableau de quatre lignes, avec pour chacune l'action à mener, le résultat attendu écrit avant l'essai, le résultat observé au banc et la conformité. Ligne 1, stabilité : secouer dix secondes, attendu bouge de moins d'un centimètre, observé bougé de zéro virgule cinq centimètre, conforme. Ligne 2, étanchéité : arroser trente secondes, attendu aucune goutte à l'intérieur, observé aucune goutte, conforme. Ligne 3, lisibilité : regarder la LED à trois mètres en plein soleil, attendu visible, observé visible, conforme. Ligne 4, tenue au froid : une nuit à moins huit degrés, attendu attache intacte, observé attache fissurée, non conforme. En bas, la décision globale : à améliorer, et non validée, parce que le gel est une contrainte réelle d'un hiver new-yorkais. Avertissement : trois réussites sur quatre ne suffisent pas, la validation n'est pas un vote ; ce qui compte est l'importance du critère qui a échoué.</desc>
  <rect width="940" height="480" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Le protocole du support : chaque étape porte son résultat attendu</text>

  <rect x="24" y="50" width="892" height="40" rx="8" fill="#173666"/>
  <text x="146" y="75" fill="#9bbefc" font-size="12.5" text-anchor="middle" font-weight="bold">Action</text>
  <text x="420" y="68" fill="#c68ef2" font-size="12.5" text-anchor="middle" font-weight="bold">Résultat ATTENDU</text>
  <text x="420" y="84" fill="#9bbefc" font-size="10" text-anchor="middle">écrit avant l'essai</text>
  <text x="680" y="75" fill="#61dafb" font-size="12.5" text-anchor="middle" font-weight="bold">Observé au banc</text>
  <text x="856" y="75" fill="#9bbefc" font-size="12.5" text-anchor="middle" font-weight="bold">Conforme ?</text>

  <rect x="24" y="106" width="892" height="52" rx="6" fill="#0d2347" stroke="#274a8a" stroke-width="1.5"/>
  <text x="146" y="136" fill="#e4eaf5" font-size="12" text-anchor="middle">secouer 10 s</text>
  <text x="420" y="136" fill="#ffd66b" font-size="12" text-anchor="middle">bouge de moins de 1 cm</text>
  <text x="680" y="136" fill="#e4eaf5" font-size="12" text-anchor="middle">bougé de 0,5 cm</text>
  <text x="856" y="137" fill="#81fba1" font-size="14" font-weight="bold" text-anchor="middle">✔ oui</text>

  <rect x="24" y="174" width="892" height="52" rx="6" fill="#0d2347" stroke="#274a8a" stroke-width="1.5"/>
  <text x="146" y="204" fill="#e4eaf5" font-size="12" text-anchor="middle">arroser 30 s</text>
  <text x="420" y="204" fill="#ffd66b" font-size="12" text-anchor="middle">aucune goutte à l'intérieur</text>
  <text x="680" y="204" fill="#e4eaf5" font-size="12" text-anchor="middle">aucune goutte</text>
  <text x="856" y="205" fill="#81fba1" font-size="14" font-weight="bold" text-anchor="middle">✔ oui</text>

  <rect x="24" y="242" width="892" height="52" rx="6" fill="#0d2347" stroke="#274a8a" stroke-width="1.5"/>
  <text x="146" y="272" fill="#e4eaf5" font-size="12" text-anchor="middle">LED à 3 m, plein soleil</text>
  <text x="420" y="272" fill="#ffd66b" font-size="12" text-anchor="middle">visible</text>
  <text x="680" y="272" fill="#e4eaf5" font-size="12" text-anchor="middle">visible</text>
  <text x="856" y="273" fill="#81fba1" font-size="14" font-weight="bold" text-anchor="middle">✔ oui</text>

  <rect x="24" y="310" width="892" height="52" rx="6" fill="#1a1230" stroke="#ff7b88" stroke-width="2.5"/>
  <text x="146" y="340" fill="#e4eaf5" font-size="12" text-anchor="middle">une nuit à −8 °C</text>
  <text x="420" y="340" fill="#ffd66b" font-size="12" text-anchor="middle">attache intacte</text>
  <text x="680" y="340" fill="#ff7b88" font-size="12" text-anchor="middle" font-weight="bold">attache fissurée</text>
  <text x="856" y="341" fill="#ff7b88" font-size="14" font-weight="bold" text-anchor="middle">✘ non</text>

  <g stroke="#274a8a" stroke-width="1">
    <line x1="268" y1="58" x2="268" y2="82"/><line x1="572" y1="58" x2="572" y2="82"/><line x1="788" y1="58" x2="788" y2="82"/>
    <line x1="268" y1="114" x2="268" y2="150"/><line x1="572" y1="114" x2="572" y2="150"/><line x1="788" y1="114" x2="788" y2="150"/>
    <line x1="268" y1="182" x2="268" y2="218"/><line x1="572" y1="182" x2="572" y2="218"/><line x1="788" y1="182" x2="788" y2="218"/>
    <line x1="268" y1="250" x2="268" y2="286"/><line x1="572" y1="250" x2="572" y2="286"/><line x1="788" y1="250" x2="788" y2="286"/>
    <line x1="268" y1="318" x2="268" y2="354"/><line x1="572" y1="318" x2="572" y2="354"/><line x1="788" y1="318" x2="788" y2="354"/>
  </g>

  <rect x="24" y="380" width="430" height="76" rx="10" fill="#0a1b3d" stroke="#ffd66b" stroke-width="2"/>
  <text x="239" y="406" fill="#ffd66b" font-size="13.5" font-weight="bold" text-anchor="middle">Décision : À AMÉLIORER</text>
  <text x="239" y="430" fill="#e4eaf5" font-size="11.5" text-anchor="middle">le gel est une contrainte réelle d'un hiver new-yorkais :</text>
  <text x="239" y="448" fill="#e4eaf5" font-size="11.5" text-anchor="middle">on ne généralise pas un support qui casse en janvier</text>

  <rect x="486" y="380" width="430" height="76" rx="10" fill="#1a1230" stroke="#ff7b88" stroke-width="2"/>
  <text x="701" y="406" fill="#ff7b88" font-size="13.5" font-weight="bold" text-anchor="middle">Trois sur quatre ne suffit pas</text>
  <text x="701" y="430" fill="#e4eaf5" font-size="11.5" text-anchor="middle">La validation n'est pas un vote. Ce n'est pas le NOMBRE</text>
  <text x="701" y="448" fill="#e4eaf5" font-size="11.5" text-anchor="middle">de tests réussis qui décide, c'est LEQUEL a échoué.</text>
</svg>
