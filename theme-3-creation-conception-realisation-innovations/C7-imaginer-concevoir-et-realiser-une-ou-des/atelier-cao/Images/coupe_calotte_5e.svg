<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" role="img"
     aria-labelledby="t d" font-family="system-ui,sans-serif">
<title id="t">Coupe du dé : à gauche le creux cylindrique, à droite la calotte</title>
<desc id="d">Une coupe de la face du dé. À gauche, le creux actuel : un cylindre de
10 millimètres de large, 1,5 millimètre de profondeur, à fond plat et à arête vive.
À droite, la calotte : une bille de 20 millimètres de diamètre, dont le centre est
8,5 millimètres au-dessus de la face, s'enfonce de 1,5 millimètre et laisse un creux
arrondi de 10,54 millimètres de large. Les deux creux ont la même profondeur ; la
calotte est à peine plus large, et son fond est rond.</desc>
