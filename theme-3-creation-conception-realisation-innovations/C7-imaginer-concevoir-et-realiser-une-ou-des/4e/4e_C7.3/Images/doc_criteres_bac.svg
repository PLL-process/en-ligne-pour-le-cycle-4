<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 952" width="350" height="952" role="img" aria-labelledby="t_criteres_bac d_criteres_bac" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_criteres_bac">Six matériaux pour le bac du jardin</title>
<desc id="d_criteres_bac">Le cahier des charges du bac du jardin : résistance d'au moins 20 mégapascals, au moins 5 ans au soleil, au moins 3 sur 5 au sel, au moins 4 sur 5 à l'eau, au moins 40 pour cent recyclable, au plus 60 kilogrammes. Puis les six matériaux. Le pin non traité : 40 mégapascals, 2 ans au soleil, 2 sur 5 au sel, 1 sur 5 à l'eau, 90 pour cent recyclable, 17,7 kilogrammes. Le pin traité autoclave : 38 mégapascals, 8 ans au soleil, 3 sur 5 au sel, 4 sur 5 à l'eau, 20 pour cent recyclable, 18,7 kilogrammes. Le PVC : 45 mégapascals, 8 ans au soleil, 5 sur 5 au sel, 5 sur 5 à l'eau, 45 pour cent recyclable, 47,6 kilogrammes. Le polypropylène recyclé : 30 mégapascals, 6 ans au soleil, 5 sur 5 au sel, 5 sur 5 à l'eau, 95 pour cent recyclable, 32,3 kilogrammes. L'acier galvanisé : 235 mégapascals, 25 ans au soleil, 3 sur 5 au sel, 3 sur 5 à l'eau, 95 pour cent recyclable, 266,9 kilogrammes. Le teck : 75 mégapascals, 15 ans au soleil, 5 sur 5 au sel, 5 sur 5 à l'eau, 85 pour cent recyclable, 22,1 kilogrammes.</desc>
<rect width="350" height="952" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Six matériaux pour le bac du jardin</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le cahier des charges du bac, puis</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">ce que tient chaque matériau.</text>
<rect x="14.0" y="87.4" width="322.0" height="168.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="117.4" font-size="16" fill="#ffb454" font-weight="700">Ce que le bac exige</text>
<text x="26.0" y="145.4" font-size="13.5" fill="#9bbefc">Résistance</text>
<text x="26.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">au moins 20 MPa</text>
<text x="175.0" y="145.4" font-size="13.5" fill="#9bbefc">Soleil</text>
<text x="175.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">au moins 5 ans</text>
<text x="26.0" y="185.4" font-size="13.5" fill="#9bbefc">Sel</text>
<text x="26.0" y="204.4" font-size="16" fill="#e4eaf5" font-weight="700">au moins 3 / 5</text>
<text x="175.0" y="185.4" font-size="13.5" fill="#9bbefc">Eau</text>
<text x="175.0" y="204.4" font-size="16" fill="#e4eaf5" font-weight="700">au moins 4 / 5</text>
<text x="26.0" y="225.4" font-size="13.5" fill="#9bbefc">Recyclable</text>
<text x="26.0" y="244.4" font-size="16" fill="#e4eaf5" font-weight="700">au moins 40 %</text>
<text x="175.0" y="225.4" font-size="13.5" fill="#9bbefc">Masse</text>
<text x="175.0" y="244.4" font-size="16" fill="#e4eaf5" font-weight="700">au plus 60 kg</text>
<text x="14.0" y="297.7" font-size="15.5" fill="#61dafb" font-weight="700">Ce que tient chaque matériau</text>
<rect x="14.0" y="304.3" width="322.0" height="238.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="326.3" font-size="13.5" fill="#61dafb" font-weight="700">Matériau</text>
<text x="155.0" y="326.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Résistance</text>
<text x="231.0" y="326.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Soleil</text>
<text x="301.0" y="326.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Sel</text>
<line x1="14" y1="338.3" x2="336" y2="338.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="360.3" font-size="15" fill="#e4eaf5" font-weight="700">Pin nu</text>
<text x="155.0" y="360.3" font-size="15" fill="#e4eaf5" text-anchor="middle">40 MPa</text>
<text x="231.0" y="360.3" font-size="15" fill="#e4eaf5" text-anchor="middle">2 ans</text>
<text x="301.0" y="360.3" font-size="15" fill="#e4eaf5" text-anchor="middle">2 / 5</text>
<line x1="14" y1="372.3" x2="336" y2="372.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="394.3" font-size="15" fill="#e4eaf5" font-weight="700">Pin traité</text>
<text x="155.0" y="394.3" font-size="15" fill="#e4eaf5" text-anchor="middle">38 MPa</text>
<text x="231.0" y="394.3" font-size="15" fill="#e4eaf5" text-anchor="middle">8 ans</text>
<text x="301.0" y="394.3" font-size="15" fill="#e4eaf5" text-anchor="middle">3 / 5</text>
<line x1="14" y1="406.3" x2="336" y2="406.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="428.3" font-size="15" fill="#e4eaf5" font-weight="700">PVC</text>
<text x="155.0" y="428.3" font-size="15" fill="#e4eaf5" text-anchor="middle">45 MPa</text>
<text x="231.0" y="428.3" font-size="15" fill="#e4eaf5" text-anchor="middle">8 ans</text>
<text x="301.0" y="428.3" font-size="15" fill="#e4eaf5" text-anchor="middle">5 / 5</text>
<line x1="14" y1="440.3" x2="336" y2="440.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="462.3" font-size="15" fill="#e4eaf5" font-weight="700">PP recyclé</text>
<text x="155.0" y="462.3" font-size="15" fill="#e4eaf5" text-anchor="middle">30 MPa</text>
<text x="231.0" y="462.3" font-size="15" fill="#e4eaf5" text-anchor="middle">6 ans</text>
<text x="301.0" y="462.3" font-size="15" fill="#e4eaf5" text-anchor="middle">5 / 5</text>
<line x1="14" y1="474.3" x2="336" y2="474.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="496.3" font-size="15" fill="#e4eaf5" font-weight="700">Acier galva.</text>
<text x="155.0" y="496.3" font-size="15" fill="#e4eaf5" text-anchor="middle">235 MPa</text>
<text x="231.0" y="496.3" font-size="15" fill="#e4eaf5" text-anchor="middle">25 ans</text>
<text x="301.0" y="496.3" font-size="15" fill="#e4eaf5" text-anchor="middle">3 / 5</text>
<line x1="14" y1="508.3" x2="336" y2="508.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="530.3" font-size="15" fill="#e4eaf5" font-weight="700">Teck</text>
<text x="155.0" y="530.3" font-size="15" fill="#e4eaf5" text-anchor="middle">75 MPa</text>
<text x="231.0" y="530.3" font-size="15" fill="#e4eaf5" text-anchor="middle">15 ans</text>
<text x="301.0" y="530.3" font-size="15" fill="#e4eaf5" text-anchor="middle">5 / 5</text>
<text x="14.0" y="584.6" font-size="15.5" fill="#61dafb" font-weight="700">À l'eau, en fin de vie, sur la balance</text>
<rect x="14.0" y="591.2" width="322.0" height="238.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="613.2" font-size="13.5" fill="#61dafb" font-weight="700">Matériau</text>
<text x="145.0" y="613.2" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Eau</text>
<text x="216.0" y="613.2" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Recyclable</text>
<text x="296.0" y="613.2" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Masse</text>
<line x1="14" y1="625.2" x2="336" y2="625.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="647.2" font-size="15" fill="#e4eaf5" font-weight="700">Pin nu</text>
<text x="145.0" y="647.2" font-size="15" fill="#e4eaf5" text-anchor="middle">1 / 5</text>
<text x="216.0" y="647.2" font-size="15" fill="#e4eaf5" text-anchor="middle">90 %</text>
<text x="296.0" y="647.2" font-size="15" fill="#e4eaf5" text-anchor="middle">17,7 kg</text>
<line x1="14" y1="659.2" x2="336" y2="659.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="681.2" font-size="15" fill="#e4eaf5" font-weight="700">Pin traité</text>
<text x="145.0" y="681.2" font-size="15" fill="#e4eaf5" text-anchor="middle">4 / 5</text>
<text x="216.0" y="681.2" font-size="15" fill="#e4eaf5" text-anchor="middle">20 %</text>
<text x="296.0" y="681.2" font-size="15" fill="#e4eaf5" text-anchor="middle">18,7 kg</text>
<line x1="14" y1="693.2" x2="336" y2="693.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="715.2" font-size="15" fill="#e4eaf5" font-weight="700">PVC</text>
<text x="145.0" y="715.2" font-size="15" fill="#e4eaf5" text-anchor="middle">5 / 5</text>
<text x="216.0" y="715.2" font-size="15" fill="#e4eaf5" text-anchor="middle">45 %</text>
<text x="296.0" y="715.2" font-size="15" fill="#e4eaf5" text-anchor="middle">47,6 kg</text>
<line x1="14" y1="727.2" x2="336" y2="727.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="749.2" font-size="15" fill="#e4eaf5" font-weight="700">PP recyclé</text>
<text x="145.0" y="749.2" font-size="15" fill="#e4eaf5" text-anchor="middle">5 / 5</text>
<text x="216.0" y="749.2" font-size="15" fill="#e4eaf5" text-anchor="middle">95 %</text>
<text x="296.0" y="749.2" font-size="15" fill="#e4eaf5" text-anchor="middle">32,3 kg</text>
<line x1="14" y1="761.2" x2="336" y2="761.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="783.2" font-size="15" fill="#e4eaf5" font-weight="700">Acier galva.</text>
<text x="145.0" y="783.2" font-size="15" fill="#e4eaf5" text-anchor="middle">3 / 5</text>
<text x="216.0" y="783.2" font-size="15" fill="#e4eaf5" text-anchor="middle">95 %</text>
<text x="296.0" y="783.2" font-size="15" fill="#e4eaf5" text-anchor="middle">266,9 kg</text>
<line x1="14" y1="795.2" x2="336" y2="795.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="817.2" font-size="15" fill="#e4eaf5" font-weight="700">Teck</text>
<text x="145.0" y="817.2" font-size="15" fill="#e4eaf5" text-anchor="middle">5 / 5</text>
<text x="216.0" y="817.2" font-size="15" fill="#e4eaf5" text-anchor="middle">85 %</text>
<text x="296.0" y="817.2" font-size="15" fill="#e4eaf5" text-anchor="middle">22,1 kg</text>
<text x="14.0" y="859.4" font-size="13.5" fill="#9bbefc">PP : polypropylène · MPa : mégapascal</text>
<text x="14.0" y="877.7" font-size="13.5" fill="#9bbefc">(résistance) · Soleil : années avant de griser ou</text>
<text x="14.0" y="895.9" font-size="13.5" fill="#9bbefc">de fendre · Sel, Eau : tenue de 1 à 5 · Recyclable :</text>
<text x="14.0" y="914.1" font-size="13.5" fill="#9bbefc">part de la matière qu'on sait recycler · kg :</text>
<text x="14.0" y="932.3" font-size="13.5" fill="#9bbefc">kilogramme, masse du bac.</text>
