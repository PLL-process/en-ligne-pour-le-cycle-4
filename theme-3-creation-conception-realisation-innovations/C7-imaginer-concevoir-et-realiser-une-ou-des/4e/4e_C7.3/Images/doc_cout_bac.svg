<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 310" width="350" height="310" role="img" aria-labelledby="t_cout_bac d_cout_bac" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_cout_bac">Les trois retenus, sur 15 ans</title>
<desc id="d_cout_bac">Les trois matériaux retenus pour le bac, leur durée de vie, le prix d'un bac et le coût sur 15 ans, remplacements compris. Le PVC : il dure 8 ans, un bac coûte 166,60 euros, et 333,20 euros sur 15 ans. Le polypropylène recyclé : il dure 6 ans, un bac coûte 90,44 euros, et 271,32 euros sur 15 ans. Le teck : il dure 15 ans, un bac coûte 309,40 euros, et 309,40 euros sur 15 ans.</desc>
<rect width="350" height="310" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Les trois retenus, sur 15 ans</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Combien dure chaque bac, son</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">prix, et ce qu'il coûte sur 15 ans.</text>
<rect x="14.0" y="87.4" width="322.0" height="136.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Matériau</text>
<text x="142.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Durée</text>
<text x="214.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Un bac</text>
<text x="295.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">15 ans</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">PVC</text>
<text x="142.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">8 ans</text>
<text x="214.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">166,60 €</text>
<text x="295.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">333,20 €</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">PP recyclé</text>
<text x="142.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">6 ans</text>
<text x="214.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">90,44 €</text>
<text x="295.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">271,32 €</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Teck</text>
<text x="142.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">15 ans</text>
<text x="214.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">309,40 €</text>
<text x="295.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">309,40 €</text>
<text x="14.0" y="253.6" font-size="13.5" fill="#9bbefc">PP : polypropylène · Durée : années avant qu'il</text>
<text x="14.0" y="271.8" font-size="13.5" fill="#9bbefc">faille le remplacer · 15 ans : prix d'un bac ×</text>
<text x="14.0" y="290.0" font-size="13.5" fill="#9bbefc">nombre de bacs achetés pour couvrir 15 ans.</text>
</svg>
