<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 762" width="350" height="762" role="img" aria-labelledby="t_champs_message d_champs_message" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_champs_message">Ce que le jardin pourrait envoyer</title>
<desc id="d_champs_message">Les 7 champs qu'un message du jardin connecté pourrait porter, chacun avec une valeur d'exemple et ce qu'il dit. id : jardin-cour — l'identifiant de l'objet qui parle. h : 38 — la valeur lue par le capteur d'humidité. u : % — l'unité de cette valeur. t : 14:07 — l'heure à laquelle la mesure a été prise. pompe : false — l'état de la pompe au moment de la mesure. etat : …127 valeurs… — les 127 variables internes de la carte. eleve : Maëlys — le prénom de l'élève qui a programmé la carte.</desc>
<rect width="350" height="762" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Ce que le jardin pourrait envoyer</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Les 7 champs possibles d'un</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">message, avec une valeur d'exemple.</text>
<rect x="14.0" y="87.4" width="322.0" height="272.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Champ</text>
<text x="230.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Exemple</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">id</text>
<text x="230.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">jardin-cour</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">h</text>
<text x="230.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">38</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">u</text>
<text x="230.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">%</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">t</text>
<text x="230.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">14:07</text>
<line x1="14" y1="257.4" x2="336" y2="257.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="279.4" font-size="15" fill="#e4eaf5" font-weight="700">pompe</text>
<text x="230.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">false</text>
<line x1="14" y1="291.4" x2="336" y2="291.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="313.4" font-size="15" fill="#e4eaf5" font-weight="700">etat</text>
<text x="230.0" y="313.4" font-size="15" fill="#e4eaf5" text-anchor="middle">…127 valeurs…</text>
<line x1="14" y1="325.4" x2="336" y2="325.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="347.4" font-size="15" fill="#e4eaf5" font-weight="700">eleve</text>
<text x="230.0" y="347.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Maëlys</text>
<rect x="14.0" y="375.4" width="322.0" height="300.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="405.4" font-size="16" fill="#61dafb" font-weight="700">Ce que dit chaque champ</text>
<text x="26.0" y="432.4" font-size="15" fill="#e4eaf5">id : l'identifiant de l'objet qui parle.</text>
<text x="26.0" y="453.4" font-size="15" fill="#e4eaf5">h : la valeur lue par le capteur</text>
<text x="26.0" y="474.4" font-size="15" fill="#e4eaf5">d'humidité.</text>
<text x="26.0" y="495.4" font-size="15" fill="#e4eaf5">u : l'unité de cette valeur.</text>
<text x="26.0" y="516.4" font-size="15" fill="#e4eaf5">t : l'heure à laquelle la mesure a été</text>
<text x="26.0" y="537.4" font-size="15" fill="#e4eaf5">prise.</text>
<text x="26.0" y="558.4" font-size="15" fill="#e4eaf5">pompe : l'état de la pompe, quand on</text>
<text x="26.0" y="579.4" font-size="15" fill="#e4eaf5">mesure.</text>
<text x="26.0" y="600.4" font-size="15" fill="#e4eaf5">etat : les 127 variables internes de la</text>
<text x="26.0" y="621.4" font-size="15" fill="#e4eaf5">carte.</text>
<text x="26.0" y="642.4" font-size="15" fill="#e4eaf5">eleve : le prénom de l'élève qui a</text>
<text x="26.0" y="663.4" font-size="15" fill="#e4eaf5">programmé la carte.</text>
<text x="14.0" y="705.6" font-size="13.5" fill="#9bbefc">Le document ne dit pas lesquels envoyer : c'est la</text>
<text x="14.0" y="723.8" font-size="13.5" fill="#9bbefc">question. · false : faux, la pompe est arrêtée</text>
<text x="14.0" y="742.0" font-size="13.5" fill="#9bbefc">· % : pour cent.</text>
</svg>
