<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 412" width="350" height="412" role="img" aria-labelledby="t_conso_jardin d_conso_jardin" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_conso_jardin">Ce que consomme le jardin connecté</title>
<desc id="d_conso_jardin">Ce que consomme le jardin connecté en une journée, sous 5 volts. Carte Arduino UNO : 45 milliampères pendant 24 heures, 5,40 wattheures. Capteur d'humidité du sol : 2 milliampères pendant 24 heures, 0,24 wattheures. Écran LCD RGB : 40 milliampères pendant 1 heure, 0,20 wattheures. Pompe immergée 5 volts : 300 milliampères pendant 1 minute, 0,025 wattheures. Module relais : 70 milliampères pendant 1 minute, 0,006 wattheures. Total : 5,87 wattheures par jour.</desc>
<rect width="350" height="412" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Ce que consomme le jardin connecté</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Cinq composants, sous 5 V</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">(volts), pendant une journée.</text>
<rect x="14.0" y="87.4" width="322.0" height="238.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Composant</text>
<text x="163.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Courant</text>
<text x="224.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Durée</text>
<text x="294.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Énergie</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Carte UNO</text>
<text x="163.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">45 mA</text>
<text x="224.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">24 h</text>
<text x="294.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">5,40 Wh</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">Capteur</text>
<text x="163.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2 mA</text>
<text x="224.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">24 h</text>
<text x="294.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,24 Wh</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Écran</text>
<text x="163.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">40 mA</text>
<text x="224.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">1 h</text>
<text x="294.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,20 Wh</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Pompe</text>
<text x="163.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">300 mA</text>
<text x="224.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">1 min</text>
<text x="294.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,025 Wh</text>
<line x1="14" y1="257.4" x2="336" y2="257.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="279.4" font-size="15" fill="#e4eaf5" font-weight="700">Relais</text>
<text x="163.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">70 mA</text>
<text x="224.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">1 min</text>
<text x="294.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,006 Wh</text>
<line x1="14" y1="291.4" x2="336" y2="291.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="313.4" font-size="15" fill="#e4eaf5" font-weight="700">Total</text>
<text x="163.0" y="313.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<text x="224.0" y="313.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<text x="294.0" y="313.4" font-size="15" fill="#e4eaf5" text-anchor="middle">5,87 Wh</text>
<text x="14.0" y="355.6" font-size="13.5" fill="#9bbefc">Capteur : le capteur d'humidité du sol · mA :</text>
<text x="14.0" y="373.8" font-size="13.5" fill="#9bbefc">milliampère · h : heure · min : minute · Wh :</text>
<text x="14.0" y="392.0" font-size="13.5" fill="#9bbefc">wattheure · énergie = courant × 5 V × durée.</text>
</svg>
