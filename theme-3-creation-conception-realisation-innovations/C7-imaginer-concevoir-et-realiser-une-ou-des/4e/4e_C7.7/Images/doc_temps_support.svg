<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 463" width="350" height="463" role="img" aria-labelledby="t_temps_support d_temps_support" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_temps_support">Le temps de chaque moyen</title>
<desc id="d_temps_support">Le temps de chaque moyen pour le support du capteur. Découpe laser : 10 minutes de préparation, puis 2 minutes par pièce. Fraiseuse : 25 minutes de préparation, puis 12 minutes par pièce. Impression 3D : 15 minutes de préparation, puis 40 minutes par pièce. Sciage à la main : aucune préparation, puis 18 minutes par pièce. Thermoformage : 1 heure de préparation, puis 4 minutes par pièce. Temps de machine disponible avant la date : 3 heures.</desc>
<rect width="350" height="463" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le temps de chaque moyen</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Une préparation payée une fois,</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">puis un temps pour chaque pièce.</text>
<rect x="14.0" y="87.4" width="322.0" height="204.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Moyen</text>
<text x="202.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Préparation</text>
<text x="293.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Par pièce</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Découpe laser</text>
<text x="202.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">10 min</text>
<text x="293.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2 min</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">Fraiseuse</text>
<text x="202.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">25 min</text>
<text x="293.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">12 min</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Impression 3D</text>
<text x="202.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">15 min</text>
<text x="293.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">40 min</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Sciage à la main</text>
<text x="202.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0 min</text>
<text x="293.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">18 min</text>
<line x1="14" y1="257.4" x2="336" y2="257.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="279.4" font-size="15" fill="#e4eaf5" font-weight="700">Thermoformage</text>
<text x="202.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">1 h</text>
<text x="293.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">4 min</text>
<rect x="14.0" y="307.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="337.4" font-size="16" fill="#ffb454" font-weight="700">Temps de machine disponible</text>
<text x="26.0" y="364.4" font-size="15" fill="#e4eaf5">3 h avant la date.</text>
<text x="14.0" y="406.6" font-size="13.5" fill="#9bbefc">min : minute · h : heure · temps total =</text>
<text x="14.0" y="424.8" font-size="13.5" fill="#9bbefc">préparation + nombre de pièces × temps par</text>
<text x="14.0" y="443.0" font-size="13.5" fill="#9bbefc">pièce.</text>
</svg>
