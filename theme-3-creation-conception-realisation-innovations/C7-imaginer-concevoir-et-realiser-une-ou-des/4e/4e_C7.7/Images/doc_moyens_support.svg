<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 823" width="350" height="823" role="img" aria-labelledby="t_moyens_support d_moyens_support" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_moyens_support">Cinq moyens pour le support</title>
<desc id="d_moyens_support">Le support du capteur d'humidité exige : du PMMA, une fente à 0,3 millimètre près, une paroi de 3 millimètres, deux perçages traversants. Les cinq moyens de l'atelier. Découpe laser : tolérance 0,2 millimètre, angle interne vif, il perce de part en part, matières : PMMA, contreplaqué, carton. Fraiseuse : tolérance 0,05 millimètre, angle interne arrondi à 1,5 millimètre, il perce de part en part, matières : PMMA, PVC, contreplaqué, aluminium. Impression 3D : tolérance 0,3 millimètre, angle interne vif, il perce de part en part, matières : PLA, PETG, PP recyclé. Sciage à la main : tolérance 1 millimètre, angle interne vif, il perce de part en part, matières : PMMA, PVC, contreplaqué, aluminium. Thermoformage : tolérance 1 millimètre, angle interne arrondi à 3 millimètre, il ne perce pas, matières : PMMA, PVC, PETG.</desc>
<rect width="350" height="823" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Cinq moyens pour le support</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Ce que le support exige, puis ce que</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">sait faire chaque moyen de l'atelier.</text>
<rect x="14.0" y="87.4" width="322.0" height="128.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="117.4" font-size="16" fill="#ffb454" font-weight="700">Ce que le support exige</text>
<text x="26.0" y="145.4" font-size="13.5" fill="#9bbefc">Matière</text>
<text x="26.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">PMMA</text>
<text x="175.0" y="145.4" font-size="13.5" fill="#9bbefc">Fente</text>
<text x="175.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">à 0,3 mm près</text>
<text x="26.0" y="185.4" font-size="13.5" fill="#9bbefc">Paroi</text>
<text x="26.0" y="204.4" font-size="16" fill="#e4eaf5" font-weight="700">3 mm</text>
<text x="175.0" y="185.4" font-size="13.5" fill="#9bbefc">Perçages</text>
<text x="175.0" y="204.4" font-size="16" fill="#e4eaf5" font-weight="700">deux, traversants</text>
<text x="14.0" y="257.7" font-size="15.5" fill="#61dafb" font-weight="700">Ce que sait faire chaque moyen</text>
<rect x="14.0" y="264.3" width="322.0" height="204.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="286.3" font-size="13.5" fill="#61dafb" font-weight="700">Moyen</text>
<text x="176.0" y="286.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Tolérance</text>
<text x="249.0" y="286.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Angle</text>
<text x="310.0" y="286.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Perce</text>
<line x1="14" y1="298.3" x2="336" y2="298.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="320.3" font-size="15" fill="#e4eaf5" font-weight="700">Découpe laser</text>
<text x="176.0" y="320.3" font-size="15" fill="#e4eaf5" text-anchor="middle">0,2 mm</text>
<text x="249.0" y="320.3" font-size="15" fill="#e4eaf5" text-anchor="middle">vif</text>
<text x="310.0" y="320.3" font-size="15" fill="#e4eaf5" text-anchor="middle">oui</text>
<line x1="14" y1="332.3" x2="336" y2="332.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="354.3" font-size="15" fill="#e4eaf5" font-weight="700">Fraiseuse</text>
<text x="176.0" y="354.3" font-size="15" fill="#e4eaf5" text-anchor="middle">0,05 mm</text>
<text x="249.0" y="354.3" font-size="15" fill="#e4eaf5" text-anchor="middle">1,5 mm</text>
<text x="310.0" y="354.3" font-size="15" fill="#e4eaf5" text-anchor="middle">oui</text>
<line x1="14" y1="366.3" x2="336" y2="366.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="388.3" font-size="15" fill="#e4eaf5" font-weight="700">Impression 3D</text>
<text x="176.0" y="388.3" font-size="15" fill="#e4eaf5" text-anchor="middle">0,3 mm</text>
<text x="249.0" y="388.3" font-size="15" fill="#e4eaf5" text-anchor="middle">vif</text>
<text x="310.0" y="388.3" font-size="15" fill="#e4eaf5" text-anchor="middle">oui</text>
<line x1="14" y1="400.3" x2="336" y2="400.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="422.3" font-size="15" fill="#e4eaf5" font-weight="700">Sciage à la main</text>
<text x="176.0" y="422.3" font-size="15" fill="#e4eaf5" text-anchor="middle">1 mm</text>
<text x="249.0" y="422.3" font-size="15" fill="#e4eaf5" text-anchor="middle">vif</text>
<text x="310.0" y="422.3" font-size="15" fill="#e4eaf5" text-anchor="middle">oui</text>
<line x1="14" y1="434.3" x2="336" y2="434.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="456.3" font-size="15" fill="#e4eaf5" font-weight="700">Thermoformage</text>
<text x="176.0" y="456.3" font-size="15" fill="#e4eaf5" text-anchor="middle">1 mm</text>
<text x="249.0" y="456.3" font-size="15" fill="#e4eaf5" text-anchor="middle">3 mm</text>
<text x="310.0" y="456.3" font-size="15" fill="#e4eaf5" text-anchor="middle">non</text>
<rect x="14.0" y="484.3" width="322.0" height="216.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="514.3" font-size="16" fill="#61dafb" font-weight="700">Les matières qu'il accepte</text>
<text x="26.0" y="541.3" font-size="15" fill="#e4eaf5">Découpe laser : PMMA, contreplaqué,</text>
<text x="26.0" y="562.3" font-size="15" fill="#e4eaf5">carton.</text>
<text x="26.0" y="583.3" font-size="15" fill="#e4eaf5">Fraiseuse : PMMA, PVC, contreplaqué,</text>
<text x="26.0" y="604.3" font-size="15" fill="#e4eaf5">aluminium.</text>
<text x="26.0" y="625.3" font-size="15" fill="#e4eaf5">Impression 3D : PLA, PETG, PP recyclé.</text>
<text x="26.0" y="646.3" font-size="15" fill="#e4eaf5">Sciage à la main : PMMA, PVC,</text>
<text x="26.0" y="667.3" font-size="15" fill="#e4eaf5">contreplaqué, aluminium.</text>
<text x="26.0" y="688.3" font-size="15" fill="#e4eaf5">Thermoformage : PMMA, PVC, PETG.</text>
<text x="14.0" y="730.5" font-size="13.5" fill="#9bbefc">mm : millimètre · Tolérance : l'écart qu'il tient sur</text>
<text x="14.0" y="748.7" font-size="13.5" fill="#9bbefc">une cote · Angle : l'angle interne le plus vif qu'il</text>
<text x="14.0" y="767.0" font-size="13.5" fill="#9bbefc">laisse · Perce : il traverse la plaque · PMMA : le</text>
<text x="14.0" y="785.2" font-size="13.5" fill="#9bbefc">verre acrylique · PVC, PLA, PETG, PP : des</text>
<text x="14.0" y="803.4" font-size="13.5" fill="#9bbefc">plastiques.</text>
</svg>
