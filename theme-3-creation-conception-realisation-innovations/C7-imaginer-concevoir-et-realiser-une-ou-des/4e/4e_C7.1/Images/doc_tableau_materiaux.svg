<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 310" width="350" height="310" role="img" aria-labelledby="t_tableau_materiaux d_tableau_materiaux" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_tableau_materiaux">Trois matériaux pour le boîtier</title>
<desc id="d_tableau_materiaux">Le tableau des trois matériaux pour le boîtier du jardin, rempli après le banc météo. Le bois de palette : tenue à la pluie et au gel moyenne, découpe facile, impact environnemental faible. Le plastique récupéré : tenue à la pluie et au gel bonne, découpe moyenne, impact environnemental faible. Le carton renforcé : tenue à la pluie et au gel faible, découpe facile, impact environnemental faible.</desc>
<rect width="350" height="310" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Trois matériaux pour le boîtier</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Après le banc météo : ce que chacun</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">tient, se laisse faire, et coûte au monde.</text>
<rect x="14.0" y="87.4" width="322.0" height="136.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Matériau</text>
<text x="171.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Pluie</text>
<text x="238.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Découpe</text>
<text x="306.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Impact</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Bois palette</text>
<text x="171.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Moyenne</text>
<text x="238.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Facile</text>
<text x="306.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Faible</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">Plastique récup</text>
<text x="171.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Bonne</text>
<text x="238.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Moyenne</text>
<text x="306.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Faible</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Carton renforcé</text>
<text x="171.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Faible</text>
<text x="238.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Facile</text>
<text x="306.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Faible</text>
<text x="14.0" y="253.6" font-size="13.5" fill="#9bbefc">Pluie : tenue à l'humidité et au gel · Découpe :</text>
<text x="14.0" y="271.8" font-size="13.5" fill="#9bbefc">facilité à le couper avec les outils du collège ·</text>
<text x="14.0" y="290.0" font-size="13.5" fill="#9bbefc">Impact : impact environnemental.</text>
</svg>
