<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le banc météo : trois matériaux soumis à quatre météos new-yorkaises</title>
  <desc id="d">Tableau croisé. En colonnes, quatre météos : pluie d'automne, gel de janvier, vent de canyon, canicule de juillet. En lignes, trois matériaux. Bois de palette : à la pluie il gonfle mais tient s'il est traité, tenue moyenne ; au gel il tient ; au vent il tient s'il est fixé ; à la canicule il se fend un peu. Plastique récupéré : à la pluie il n'absorbe pas et ignore l'eau, tenue bonne ; au gel il devient cassant ; au vent il tient s'il est lesté ; à la canicule il se déforme. Carton renforcé : à la pluie il se délite, c'est sa contrainte fatale, tenue faible ; au gel il tient s'il est sec ; au vent il se plie ; à la canicule il ne craint rien. En bas, la conclusion : aucun matériau ne gagne partout, donc le meilleur matériau n'existe pas dans l'absolu ; il dépend des contraintes du lieu. Et un rappel de vocabulaire : la contrainte s'impose, comme le gel ou la pluie ; le critère se choisit pour comparer, comme la tenue à l'humidité.</desc>
  <rect width="940" height="470" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Le banc météo : douze essais, aucun vainqueur absolu</text>

  <rect x="186" y="50" width="732" height="36" rx="6" fill="#173666"/>
  <text x="271.5" y="73" fill="#61dafb" font-size="12" text-anchor="middle" font-weight="bold">Pluie d'automne</text>
  <text x="458.5" y="73" fill="#61dafb" font-size="12" text-anchor="middle" font-weight="bold">Gel de janvier</text>
  <text x="645.5" y="73" fill="#61dafb" font-size="12" text-anchor="middle" font-weight="bold">Vent de canyon</text>
  <text x="832.5" y="73" fill="#61dafb" font-size="12" text-anchor="middle" font-weight="bold">Canicule de juillet</text>

  <!-- bois -->
  <rect x="20" y="102" width="150" height="86" rx="8" fill="#0d2347" stroke="#274a8a" stroke-width="2"/>
  <text x="95" y="139" fill="#e4eaf5" font-size="13" text-anchor="middle" font-weight="bold">Bois de palette</text>
  <text x="95" y="159" fill="#ffd66b" font-size="12" text-anchor="middle">tenue : moyenne</text>
  <rect x="186" y="102" width="171" height="86" rx="8" fill="#0a1b3d" stroke="#ffd66b" stroke-width="2"/>
  <text x="271.5" y="139" fill="#ffd66b" font-size="13" text-anchor="middle">gonfle</text>
  <text x="271.5" y="159" fill="#9bbefc" font-size="12" text-anchor="middle">mais tient s'il est traité</text>
  <rect x="373" y="102" width="171" height="86" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="458.5" y="149" fill="#81fba1" font-size="13" text-anchor="middle">tient</text>
  <rect x="560" y="102" width="171" height="86" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="645.5" y="139" fill="#81fba1" font-size="13" text-anchor="middle">tient</text>
  <text x="645.5" y="159" fill="#9bbefc" font-size="12" text-anchor="middle">s'il est bien fixé</text>
  <rect x="747" y="102" width="171" height="86" rx="8" fill="#0a1b3d" stroke="#ffd66b" stroke-width="2"/>
  <text x="832.5" y="149" fill="#ffd66b" font-size="13" text-anchor="middle">se fend un peu</text>

  <!-- plastique -->
  <rect x="20" y="204" width="150" height="86" rx="8" fill="#0d2347" stroke="#274a8a" stroke-width="2"/>
  <text x="95" y="241" fill="#e4eaf5" font-size="13" text-anchor="middle" font-weight="bold">Plastique récup</text>
  <text x="95" y="261" fill="#81fba1" font-size="12" text-anchor="middle">tenue : bonne</text>
  <rect x="186" y="204" width="171" height="86" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2.5"/>
  <text x="271.5" y="241" fill="#81fba1" font-size="13.5" text-anchor="middle" font-weight="bold">ignore la pluie</text>
  <text x="271.5" y="261" fill="#9bbefc" font-size="12" text-anchor="middle">il ne l'absorbe pas</text>
  <rect x="373" y="204" width="171" height="86" rx="8" fill="#0a1b3d" stroke="#ff7b88" stroke-width="2"/>
  <text x="458.5" y="251" fill="#ff7b88" font-size="13" text-anchor="middle">devient cassant</text>
  <rect x="560" y="204" width="171" height="86" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="645.5" y="241" fill="#81fba1" font-size="13" text-anchor="middle">tient</text>
  <text x="645.5" y="261" fill="#9bbefc" font-size="12" text-anchor="middle">s'il est lesté</text>
  <rect x="747" y="204" width="171" height="86" rx="8" fill="#0a1b3d" stroke="#ffd66b" stroke-width="2"/>
  <text x="832.5" y="251" fill="#ffd66b" font-size="13" text-anchor="middle">se déforme</text>

  <!-- carton -->
  <rect x="20" y="306" width="150" height="86" rx="8" fill="#0d2347" stroke="#274a8a" stroke-width="2"/>
  <text x="95" y="343" fill="#e4eaf5" font-size="13" text-anchor="middle" font-weight="bold">Carton renforcé</text>
  <text x="95" y="363" fill="#ff7b88" font-size="12" text-anchor="middle">tenue : faible</text>
  <rect x="186" y="306" width="171" height="86" rx="8" fill="#1a1230" stroke="#ff7b88" stroke-width="2.5"/>
  <text x="271.5" y="343" fill="#ff7b88" font-size="13.5" text-anchor="middle" font-weight="bold">se délite</text>
  <text x="271.5" y="363" fill="#c68ef2" font-size="12" text-anchor="middle">sa contrainte fatale</text>
  <rect x="373" y="306" width="171" height="86" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="458.5" y="343" fill="#81fba1" font-size="13" text-anchor="middle">tient</text>
  <text x="458.5" y="363" fill="#9bbefc" font-size="12" text-anchor="middle">s'il reste sec</text>
  <rect x="560" y="306" width="171" height="86" rx="8" fill="#0a1b3d" stroke="#ffd66b" stroke-width="2"/>
  <text x="645.5" y="353" fill="#ffd66b" font-size="13" text-anchor="middle">se plie</text>
  <rect x="747" y="306" width="171" height="86" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="832.5" y="353" fill="#81fba1" font-size="13" text-anchor="middle">ne craint rien</text>

  <text x="470" y="426" fill="#c68ef2" font-size="13" text-anchor="middle" font-weight="bold">Aucune ligne n'est verte partout : « le meilleur matériau » n'existe pas dans l'absolu.</text>
  <text x="470" y="452" fill="#9bbefc" font-size="12" text-anchor="middle">La CONTRAINTE s'impose (le gel, la pluie) · le CRITÈRE se choisit pour comparer (la tenue à l'humidité).</text>
</svg>
