<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le banc météo : trois matériaux soumis à quatre météos new-yorkaises</title>
  <desc id="d">Tableau croisé. En colonnes, quatre météos : pluie d'automne, gel de janvier, vent de canyon, canicule de juillet. En lignes, trois matériaux. Bois de palette : à la pluie il gonfle mais tient s'il est traité, tenue moyenne ; au gel il tient ; au vent il tient s'il est fixé ; à la canicule il se fend un peu. Plastique récupéré : à la pluie il n'absorbe pas et ignore l'eau, tenue bonne ; au gel il devient cassant ; au vent il tient s'il est lesté ; à la canicule il se déforme. Carton renforcé : à la pluie il se délite, c'est sa contrainte fatale, tenue faible ; au gel il tient s'il est sec ; au vent il se plie ; à la canicule il ne craint rien. En bas, la conclusion : aucun matériau ne gagne partout, donc le meilleur matériau n'existe pas dans l'absolu ; il dépend des contraintes du lieu. Et un rappel de vocabulaire : la contrainte s'impose, comme le gel ou la pluie ; le critère se choisit pour comparer, comme la tenue à l'humidité.</desc>
  <rect width="940" height="470" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Le banc météo : douze essais, aucun vainqueur absolu</text>

  <rect x="180" y="50" width="740" height="36" rx="6" fill="#173666"/>
  <text x="272" y="73" fill="#61dafb" font-size="12" text-anchor="middle" font-weight="bold">Pluie d'automne</text>
  <text x="457" y="73" fill="#61dafb" font-size="12" text-anchor="middle" font-weight="bold">Gel de janvier</text>
  <text x="642" y="73" fill="#61dafb" font-size="12" text-anchor="middle" font-weight="bold">Vent de canyon</text>
  <text x="827" y="73" fill="#61dafb" font-size="12" text-anchor="middle" font-weight="bold">Canicule de juillet</text>

  <!-- bois -->
  <rect x="20" y="94" width="160" height="94" rx="8" fill="#0d2347" stroke="#274a8a" stroke-width="2"/>
  <text x="100" y="134" fill="#e4eaf5" font-size="13" text-anchor="middle" font-weight="bold">Bois de palette</text>
  <text x="100" y="156" fill="#ffd66b" font-size="11" text-anchor="middle">tenue : moyenne</text>
  <rect x="184" y="94" width="178" height="94" rx="8" fill="#0a1b3d" stroke="#ffd66b" stroke-width="2"/>
  <text x="272" y="130" fill="#ffd66b" font-size="12" text-anchor="middle">gonfle</text>
  <text x="272" y="150" fill="#9bbefc" font-size="10.5" text-anchor="middle">mais tient s'il est traité</text>
  <rect x="368" y="94" width="178" height="94" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="457" y="140" fill="#81fba1" font-size="12" text-anchor="middle">tient</text>
  <rect x="552" y="94" width="178" height="94" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="642" y="134" fill="#81fba1" font-size="12" text-anchor="middle">tient</text>
  <text x="642" y="152" fill="#9bbefc" font-size="10.5" text-anchor="middle">s'il est bien fixé</text>
  <rect x="736" y="94" width="184" height="94" rx="8" fill="#0a1b3d" stroke="#ffd66b" stroke-width="2"/>
  <text x="828" y="140" fill="#ffd66b" font-size="12" text-anchor="middle">se fend un peu</text>

  <!-- plastique -->
  <rect x="20" y="194" width="160" height="94" rx="8" fill="#0d2347" stroke="#274a8a" stroke-width="2"/>
  <text x="100" y="234" fill="#e4eaf5" font-size="13" text-anchor="middle" font-weight="bold">Plastique récup</text>
  <text x="100" y="256" fill="#81fba1" font-size="11" text-anchor="middle">tenue : bonne</text>
  <rect x="184" y="194" width="178" height="94" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2.5"/>
  <text x="272" y="230" fill="#81fba1" font-size="12" text-anchor="middle" font-weight="bold">ignore la pluie</text>
  <text x="272" y="250" fill="#9bbefc" font-size="10.5" text-anchor="middle">il ne l'absorbe pas</text>
  <rect x="368" y="194" width="178" height="94" rx="8" fill="#0a1b3d" stroke="#ff7b88" stroke-width="2"/>
  <text x="457" y="240" fill="#ff7b88" font-size="12" text-anchor="middle">devient cassant</text>
  <rect x="552" y="194" width="178" height="94" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="642" y="234" fill="#81fba1" font-size="12" text-anchor="middle">tient</text>
  <text x="642" y="252" fill="#9bbefc" font-size="10.5" text-anchor="middle">s'il est lesté</text>
  <rect x="736" y="194" width="184" height="94" rx="8" fill="#0a1b3d" stroke="#ffd66b" stroke-width="2"/>
  <text x="828" y="240" fill="#ffd66b" font-size="12" text-anchor="middle">se déforme</text>

  <!-- carton -->
  <rect x="20" y="294" width="160" height="94" rx="8" fill="#0d2347" stroke="#274a8a" stroke-width="2"/>
  <text x="100" y="334" fill="#e4eaf5" font-size="13" text-anchor="middle" font-weight="bold">Carton renforcé</text>
  <text x="100" y="356" fill="#ff7b88" font-size="11" text-anchor="middle">tenue : faible</text>
  <rect x="184" y="294" width="178" height="94" rx="8" fill="#1a1230" stroke="#ff7b88" stroke-width="2.5"/>
  <text x="272" y="330" fill="#ff7b88" font-size="12.5" text-anchor="middle" font-weight="bold">se délite</text>
  <text x="272" y="350" fill="#c68ef2" font-size="10.5" text-anchor="middle">sa contrainte fatale</text>
  <rect x="368" y="294" width="178" height="94" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="457" y="334" fill="#81fba1" font-size="12" text-anchor="middle">tient</text>
  <text x="457" y="352" fill="#9bbefc" font-size="10.5" text-anchor="middle">s'il reste sec</text>
  <rect x="552" y="294" width="178" height="94" rx="8" fill="#0a1b3d" stroke="#ffd66b" stroke-width="2"/>
  <text x="642" y="340" fill="#ffd66b" font-size="12" text-anchor="middle">se plie</text>
  <rect x="736" y="294" width="184" height="94" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="828" y="340" fill="#81fba1" font-size="12" text-anchor="middle">ne craint rien</text>

  <text x="470" y="416" fill="#c68ef2" font-size="13" text-anchor="middle" font-weight="bold">Aucune ligne n'est verte partout : « le meilleur matériau » n'existe pas dans l'absolu.</text>
  <text x="470" y="444" fill="#9bbefc" font-size="12" text-anchor="middle">La CONTRAINTE s'impose (le gel, la pluie) · le CRITÈRE se choisit pour comparer (la tenue à l'humidité).</text>
</svg>
