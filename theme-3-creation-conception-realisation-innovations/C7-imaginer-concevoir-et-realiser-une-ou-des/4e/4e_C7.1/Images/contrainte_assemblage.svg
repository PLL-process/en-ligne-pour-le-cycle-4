<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Assembler : placer à l'œil, ou interdire un mouvement</title>
  <desc id="d">Comparaison en deux colonnes. À gauche, placer à l'œil : le couvercle est posé approximativement sur la boîte, il paraît bien mis ; mais quand la cote de la boîte passe de 60 à 70 millimètres, le couvercle reste où il était, et il déborde. Rien ne le rattache à la boîte. À droite, poser une contrainte : la contrainte coaxiale interdit les déplacements latéraux, la contrainte coïncidente plaque la face du couvercle sur celle de la boîte ; le logiciel en déduit alors la position exacte. Quand la cote passe de 60 à 70 millimètres, le couvercle suit tout seul et reste centré. En bas, la formule : une contrainte ne place pas la pièce, elle lui interdit un mouvement ; la position en découle, et elle se maintient quand les cotes changent.</desc>
  <rect width="940" height="420" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Placer à l'œil est facile — et faux au premier changement de cote</text>

  <!-- colonne gauche -->
  <rect x="24" y="50" width="440" height="300" rx="12" fill="#1a1230" stroke="#ff7b88" stroke-width="2"/>
  <text x="244" y="76" fill="#ff7b88" font-size="13.5" font-weight="bold" text-anchor="middle">Placer à l'œil</text>

  <text x="124" y="104" fill="#9bbefc" font-size="11" text-anchor="middle">boîte de 60 mm</text>
  <rect x="64" y="150" width="120" height="60" fill="#0d2347" stroke="#81fba1" stroke-width="2"/>
  <rect x="70" y="128" width="108" height="18" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
  <text x="124" y="228" fill="#81fba1" font-size="11" text-anchor="middle">ça a l'air bien mis</text>

  <text x="364" y="104" fill="#9bbefc" font-size="11" text-anchor="middle">la boîte passe à 70 mm</text>
  <rect x="294" y="150" width="140" height="60" fill="#0d2347" stroke="#81fba1" stroke-width="2"/>
  <rect x="270" y="128" width="108" height="18" fill="#0d2347" stroke="#ff7b88" stroke-width="2"/>
  <text x="364" y="228" fill="#ff7b88" font-size="11" text-anchor="middle">le couvercle n'a pas suivi</text>
  <text x="364" y="246" fill="#ff7b88" font-size="11" text-anchor="middle">il déborde à gauche</text>

  <text x="244" y="288" fill="#e4eaf5" font-size="11.5" text-anchor="middle">Rien ne rattache le couvercle à la boîte :</text>
  <text x="244" y="308" fill="#e4eaf5" font-size="11.5" text-anchor="middle">il est simplement posé aux coordonnées</text>
  <text x="244" y="328" fill="#e4eaf5" font-size="11.5" text-anchor="middle">où on l'a lâché.</text>

  <!-- colonne droite -->
  <rect x="476" y="50" width="440" height="300" rx="12" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="696" y="76" fill="#81fba1" font-size="13.5" font-weight="bold" text-anchor="middle">Poser une contrainte</text>

  <text x="576" y="104" fill="#9bbefc" font-size="11" text-anchor="middle">boîte de 60 mm</text>
  <rect x="516" y="150" width="120" height="60" fill="#0d2347" stroke="#81fba1" stroke-width="2"/>
  <rect x="522" y="128" width="108" height="18" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
  <line x1="576" y1="118" x2="576" y2="216" stroke="#c68ef2" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="816" y="104" fill="#9bbefc" font-size="11" text-anchor="middle">la boîte passe à 70 mm</text>
  <rect x="746" y="150" width="140" height="60" fill="#0d2347" stroke="#81fba1" stroke-width="2"/>
  <rect x="752" y="128" width="128" height="18" fill="#0d2347" stroke="#81fba1" stroke-width="2"/>
  <line x1="816" y1="118" x2="816" y2="216" stroke="#c68ef2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="816" y="228" fill="#81fba1" font-size="11" text-anchor="middle">le couvercle a suivi tout seul</text>

  <text x="696" y="266" fill="#c68ef2" font-size="11.5" text-anchor="middle" font-weight="bold">coaxial → interdit les déplacements latéraux</text>
  <text x="696" y="288" fill="#c68ef2" font-size="11.5" text-anchor="middle" font-weight="bold">coïncident → plaque les deux faces</text>
  <text x="696" y="316" fill="#e4eaf5" font-size="11.5" text-anchor="middle">Tu n'as donné aucune position :</text>
  <text x="696" y="334" fill="#e4eaf5" font-size="11.5" text-anchor="middle">le logiciel l'a déduite des interdictions.</text>

  <text x="470" y="386" fill="#c68ef2" font-size="13.5" text-anchor="middle" font-weight="bold">Une contrainte ne place pas la pièce : elle lui interdit un mouvement.</text>
  <text x="470" y="408" fill="#9bbefc" font-size="12" text-anchor="middle">La position en découle — et elle se maintient quand les cotes changent.</text>
</svg>
