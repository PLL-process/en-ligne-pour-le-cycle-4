<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 326" width="350" height="326" role="img" aria-labelledby="t_taches_jardin d_taches_jardin" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_taches_jardin">Les tâches du projet du jardin</title>
<desc id="d_taches_jardin">Les quatre tâches du projet du jardin, données dans le désordre, avec leur durée. Fabriquer le prototype : 40 minutes. Formuler le besoin du jardinier : 15 minutes. Comparer les matériaux : 20 minutes. Dessiner deux supports : 25 minutes.</desc>
<rect width="350" height="326" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Les tâches du projet du jardin</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Données dans le désordre,</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">chacune avec sa durée.</text>
<rect x="14.0" y="87.4" width="322.0" height="170.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Tâche</text>
<text x="293.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Durée</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Fabriquer le prototype</text>
<text x="293.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">40 min</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">Formuler le besoin du jardinier</text>
<text x="293.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">15 min</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Comparer les matériaux</text>
<text x="293.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">20 min</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Dessiner deux supports</text>
<text x="293.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">25 min</text>
<text x="14.0" y="287.6" font-size="13.5" fill="#9bbefc">min : minute · la liste ne dit pas dans quel ordre</text>
<text x="14.0" y="305.8" font-size="13.5" fill="#9bbefc">mener les tâches.</text>
</svg>
