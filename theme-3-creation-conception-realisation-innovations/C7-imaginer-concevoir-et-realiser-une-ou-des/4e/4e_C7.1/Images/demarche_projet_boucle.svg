<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">La démarche de projet est une boucle, pas une ligne droite</title>
  <desc id="d">Diagramme de flux en cinq étapes, de gauche à droite. Étape 1, terminal arrondi : identifier le BESOIN, à quoi ça sert et pour qui. Étape 2, rectangle : imaginer PLUSIEURS solutions, A et B. Étape 3, losange : CHOISIR avec des critères nommés ; la décision a deux sorties. Étape 4, rectangle : RÉALISER le prototype. Étape 5, rectangle : TESTER. Depuis l'étape 5, une flèche remonte vers l'étape 2, les solutions : c'est la boucle d'amélioration, un test raté ne tue pas le projet, il renvoie aux solutions. Le besoin, lui, n'est jamais remis en cause par un test : il reste le point de départ. En bas, trois avertissements : commencer par une solution au lieu du besoin, c'est répondre avant d'avoir entendu la question ; une seule idée n'est pas une conception ; un choix sans critère nommé est un caprice.</desc>
  <rect width="940" height="400" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">La démarche de projet : une boucle, jamais une ligne droite</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#ffd66b"/></marker></defs>

  <rect x="24" y="96" width="150" height="56" rx="28" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
  <text x="99" y="120" fill="#61dafb" font-size="13" text-anchor="middle" font-weight="bold">1 · BESOIN</text>
  <text x="99" y="139" fill="#9bbefc" font-size="10.5" text-anchor="middle">pour qui, pour quoi</text>

  <path d="M178 124 L206 124" stroke="#61dafb" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="210" y="96" width="150" height="56" rx="7" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
  <text x="285" y="120" fill="#81fba1" font-size="13" text-anchor="middle" font-weight="bold">2 · SOLUTIONS</text>
  <text x="285" y="139" fill="#9bbefc" font-size="10.5" text-anchor="middle">au moins deux, A et B</text>

  <path d="M364 124 L392 124" stroke="#61dafb" stroke-width="2.5" marker-end="url(#a)"/>

  <polygon points="472,88 566,124 472,160 378,124" fill="#0d2347" stroke="#c68ef2" stroke-width="2.5"/>
  <text x="472" y="120" fill="#c68ef2" font-size="12.5" text-anchor="middle" font-weight="bold">3 · CHOISIR</text>
  <text x="472" y="138" fill="#9bbefc" font-size="10" text-anchor="middle">critères nommés</text>

  <path d="M570 124 L598 124" stroke="#61dafb" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="602" y="96" width="140" height="56" rx="7" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
  <text x="672" y="120" fill="#81fba1" font-size="13" text-anchor="middle" font-weight="bold">4 · RÉALISER</text>
  <text x="672" y="139" fill="#9bbefc" font-size="10.5" text-anchor="middle">le prototype</text>

  <path d="M746 124 L774 124" stroke="#61dafb" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="778" y="96" width="138" height="56" rx="7" fill="#0d2347" stroke="#ffd66b" stroke-width="2.5"/>
  <text x="847" y="120" fill="#ffd66b" font-size="13" text-anchor="middle" font-weight="bold">5 · TESTER</text>
  <text x="847" y="139" fill="#9bbefc" font-size="10.5" text-anchor="middle">attendu, puis observé</text>

  <!-- boucle -->
  <path d="M847 156 L847 216 L285 216 L285 158" stroke="#ffd66b" stroke-width="2.5" fill="none" stroke-dasharray="8 5" marker-end="url(#ab)"/>
  <rect x="380" y="204" width="380" height="22" fill="#050f24"/>
  <text x="570" y="221" fill="#ffd66b" font-size="12" text-anchor="middle" font-weight="bold">test raté → on retourne aux SOLUTIONS, pas au besoin</text>

  <line x1="24" y1="248" x2="916" y2="248" stroke="#274a8a" stroke-width="1"/>

  <rect x="24" y="266" width="284" height="104" rx="10" fill="#1a1230" stroke="#ff7b88" stroke-width="1.5"/>
  <text x="166" y="292" fill="#ff7b88" font-size="12" text-anchor="middle" font-weight="bold">Commencer par une solution</text>
  <text x="166" y="318" fill="#e4eaf5" font-size="11.5" text-anchor="middle">c'est répondre avant d'avoir</text>
  <text x="166" y="336" fill="#e4eaf5" font-size="11.5" text-anchor="middle">entendu la question</text>

  <rect x="328" y="266" width="284" height="104" rx="10" fill="#1a1230" stroke="#ff7b88" stroke-width="1.5"/>
  <text x="470" y="292" fill="#ff7b88" font-size="12" text-anchor="middle" font-weight="bold">N'avoir qu'une idée</text>
  <text x="470" y="318" fill="#e4eaf5" font-size="11.5" text-anchor="middle">une seule idée n'est pas</text>
  <text x="470" y="336" fill="#e4eaf5" font-size="11.5" text-anchor="middle">une conception</text>

  <rect x="632" y="266" width="284" height="104" rx="10" fill="#1a1230" stroke="#ff7b88" stroke-width="1.5"/>
  <text x="774" y="292" fill="#ff7b88" font-size="12" text-anchor="middle" font-weight="bold">Choisir sans critère</text>
  <text x="774" y="318" fill="#e4eaf5" font-size="11.5" text-anchor="middle">un choix sans critère nommé</text>
  <text x="774" y="336" fill="#e4eaf5" font-size="11.5" text-anchor="middle">est un caprice</text>
</svg>
