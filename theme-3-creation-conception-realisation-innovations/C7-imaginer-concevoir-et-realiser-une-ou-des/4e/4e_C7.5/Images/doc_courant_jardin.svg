<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 498" width="350" height="498" role="img" aria-labelledby="t_courant_jardin d_courant_jardin" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_courant_jardin">Le courant du jardin connecté</title>
<desc id="d_courant_jardin">Ce que demande chaque constituant du jardin connecté. Pompe : 700 milliampères. Carte UNO : 45 milliampères. Module relais : 30 milliampères. Écran LCD : 20 milliampères. Capteur d'humidité : 5 milliampères. Capteur de température : 5 milliampères. Le câble USB fournit jusqu'à 500 milliampères ; l'alimentation externe 5 volts, jusqu'à 2000 milliampères.</desc>
<rect width="350" height="498" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le courant du jardin connecté</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Ce que demande chaque constituant,</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">et ce que fournit chaque source.</text>
<rect x="14.0" y="87.4" width="322.0" height="238.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Constituant</text>
<text x="284.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Demande</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Pompe</text>
<text x="284.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">700 mA</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">Carte UNO</text>
<text x="284.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">45 mA</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Module relais</text>
<text x="284.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">30 mA</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Écran LCD</text>
<text x="284.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">20 mA</text>
<line x1="14" y1="257.4" x2="336" y2="257.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="279.4" font-size="15" fill="#e4eaf5" font-weight="700">Capteur d'humidité</text>
<text x="284.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">5 mA</text>
<line x1="14" y1="291.4" x2="336" y2="291.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="313.4" font-size="15" fill="#e4eaf5" font-weight="700">Capteur de température</text>
<text x="284.0" y="313.4" font-size="15" fill="#e4eaf5" text-anchor="middle">5 mA</text>
<rect x="14.0" y="341.4" width="322.0" height="88.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="371.4" font-size="16" fill="#ffb454" font-weight="700">Ce que fournissent les sources</text>
<text x="26.0" y="399.4" font-size="13.5" fill="#9bbefc">Câble USB</text>
<text x="26.0" y="418.4" font-size="16" fill="#e4eaf5" font-weight="700">jusqu'à 500 mA</text>
<text x="175.0" y="399.4" font-size="13.5" fill="#9bbefc">Alimentation externe</text>
<text x="175.0" y="418.4" font-size="16" fill="#e4eaf5" font-weight="700">jusqu'à 2 000 mA</text>
<text x="14.0" y="459.6" font-size="13.5" fill="#9bbefc">mA : milliampère · l'alimentation externe est une</text>
<text x="14.0" y="477.8" font-size="13.5" fill="#9bbefc">très basse tension, 5 V (volts).</text>
</svg>
