<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 348" width="350" height="348" role="img" aria-labelledby="t_programme_jardin d_programme_jardin" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_programme_jardin">Le programme de la carte</title>
<desc id="d_programme_jardin">Le programme téléversé dans la carte du jardin, ligne par ligne : humidite = analogRead(A0) ; afficher(humidite, "%") ; si humidite &lt; 35 alors ; digitalWrite(4, HAUT) ; attendre(6 secondes) ; digitalWrite(4, BAS).</desc>
<rect width="350" height="348" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le programme de la carte</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Celui qui est téléversé dans la carte du jardin.</text>
<rect x="14.0" y="69.2" width="322.0" height="174.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="99.2" font-size="16" fill="#61dafb" font-weight="700">Programme</text>
<text x="26.0" y="126.2" font-size="15" fill="#e4eaf5">humidite = analogRead(A0)</text>
<text x="26.0" y="147.2" font-size="15" fill="#e4eaf5">afficher(humidite, "%")</text>
<text x="26.0" y="168.2" font-size="15" fill="#e4eaf5">si humidite &lt; 35 alors</text>
<text x="26.0" y="189.2" font-size="15" fill="#e4eaf5">→ digitalWrite(4, HAUT)</text>
<text x="26.0" y="210.2" font-size="15" fill="#e4eaf5">→ attendre(6 secondes)</text>
<text x="26.0" y="231.2" font-size="15" fill="#e4eaf5">→ digitalWrite(4, BAS)</text>
<text x="14.0" y="273.4" font-size="13.5" fill="#9bbefc">→ : ligne qui dépend du « si » au-dessus ·</text>
<text x="14.0" y="291.6" font-size="13.5" fill="#9bbefc">analogRead(A0) : lire le port analogique A0 ·</text>
<text x="14.0" y="309.8" font-size="13.5" fill="#9bbefc">digitalWrite(4, HAUT) : mettre la sortie D4 à</text>
<text x="14.0" y="328.0" font-size="13.5" fill="#9bbefc">l'état haut, le relais se ferme · BAS : il s'ouvre.</text>
</svg>
