  <line x1="470" y1="102" x2="470" y2="356" stroke="#8fa3bd" stroke-width="1.5"/>
  <rect x="26" y="102" width="444" height="22" fill="#eef2f8"/>
  <text class="hd" x="38" y="117">Name</text><text class="hd" x="252" y="117">Begin date</text>
