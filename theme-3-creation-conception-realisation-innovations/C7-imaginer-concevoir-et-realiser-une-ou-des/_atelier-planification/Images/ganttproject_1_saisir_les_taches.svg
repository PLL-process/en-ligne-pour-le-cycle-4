<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="g1t g1d"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="g1t">GanttProject, étape 1 — saisir les tâches et leur durée (schéma reconstruit)</title>
  <desc id="g1d">Schéma reconstruit de la fenêtre de GanttProject, à l'étape où l'on saisit les
  tâches du projet. La fenêtre comporte une barre de menus dont les entrées utiles sont Project,
  Tasks et Gantt view. Sous la barre de menus, deux onglets : Gantt, qui est actif, et Resources
  chart. La fenêtre est coupée en deux dans le sens de la hauteur. À gauche, la table des tâches,
  avec ses colonnes Name, Begin date, End date et Duration ; on y a saisi les six premières tâches
  du jardin connecté de Brooklyn, chacune avec sa durée en jours. À droite, la zone du diagramme,
  encore presque vide, où une barre apparaît pour chaque tâche saisie. Trois bulles numérotées
  guident le geste. La première indique le menu Tasks, puis New task, qui ajoute une ligne — le
  raccourci clavier étant la touche Inser. La deuxième montre qu'on saisit le nom de la tâche
  directement dans la colonne Name, puis qu'on presse la touche Tabulation pour passer à la
  colonne suivante. La troisième montre la colonne Duration, où l'on tape un nombre de jours, et
  précise que la date de fin se calcule toute seule : on ne la saisit jamais. Un encadré en bas
  rappelle qu'un jalon se crée de la même façon, en cochant la case Milestone dans les propriétés
  de la tâche, et qu'un jalon a toujours une durée nulle parce que ce n'est pas un travail mais un
  point de contrôle.</desc>
  <rect width="900" height="470" fill="#f4f7fb"/>
