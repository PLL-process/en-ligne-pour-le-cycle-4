    <text x="38" y="145">Relever les besoins en eau</text><text x="252" y="145">S1</text><text x="336" y="145">S1</text><text x="424" y="145">1</text>
    <text x="38" y="171">Choisir les grandeurs à mesurer</text><text x="252" y="171">S2</text><text x="336" y="171">S2</text><text x="424" y="171">1</text>
