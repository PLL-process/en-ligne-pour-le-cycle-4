    .ui{font-family:Segoe UI,system-ui,sans-serif;font-size:11.5px;fill:#22334d}
    .hd{font-size:11.5px;font-weight:600;fill:#33465f}
    .bulle{fill:#b4212a}
    .btxt{fill:#fff;font-size:11.5px;font-weight:700}
    .note{font-size:12px;fill:#7a2530}
  </style>
