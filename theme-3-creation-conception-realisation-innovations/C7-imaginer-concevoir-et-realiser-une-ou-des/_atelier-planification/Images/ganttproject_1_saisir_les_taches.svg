  <circle class="bulle" cx="440" cy="140" r="11"/><text class="btxt" x="436" y="144">3</text>

  <rect x="26" y="368" width="410" height="42" rx="6" fill="#fdeceb" stroke="#d9908f"/>
  <circle class="bulle" cx="46" cy="382" r="9"/><text class="btxt" x="43" y="386">1</text>
  <text class="note" x="62" y="386"><tspan font-weight="700">Tasks → New task</tspan> ajoute une ligne.</text>
  <text class="note" x="62" y="402">Raccourci&#160;: la touche <tspan font-weight="700">Inser</tspan>.</text>

  <rect x="446" y="368" width="212" height="42" rx="6" fill="#fdeceb" stroke="#d9908f"/>
  <circle class="bulle" cx="466" cy="382" r="9"/><text class="btxt" x="463" y="386">2</text>
  <text class="note" x="482" y="386">On tape le nom dans <tspan font-weight="700">Name</tspan>,</text>
  <text class="note" x="482" y="402">puis <tspan font-weight="700">Tab</tspan> pour la colonne suivante.</text>

  <rect x="668" y="368" width="206" height="42" rx="6" fill="#fdeceb" stroke="#d9908f"/>
  <circle class="bulle" cx="688" cy="382" r="9"/><text class="btxt" x="685" y="386">3</text>
  <text class="note" x="704" y="386">On saisit la <tspan font-weight="700">durée</tspan>.</text>
  <text class="note" x="704" y="402"><tspan font-weight="700">End date se calcule seule.</tspan></text>

  <rect x="26" y="420" width="848" height="38" rx="6" fill="#e8f1e8" stroke="#7aa77a"/>
  <text x="42" y="443" font-size="12.5">🏁 <tspan font-weight="700">Un jalon&#160;?</tspan> Même geste, puis on coche <tspan font-weight="700">Milestone</tspan> dans les propriétés de la tâche. Un jalon a toujours une durée de <tspan font-weight="700">0</tspan>&#160;: ce n'est pas un travail, c'est un point de contrôle.</text>
</svg>
