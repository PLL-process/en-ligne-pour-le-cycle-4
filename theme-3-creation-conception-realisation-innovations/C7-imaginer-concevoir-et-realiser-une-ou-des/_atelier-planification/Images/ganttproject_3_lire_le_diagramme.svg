    <text x="300" y="72">S1</text><text x="360" y="72">S2</text><text x="420" y="72">S3</text>
    <text x="480" y="72">S4</text><text x="540" y="72">S5</text><text x="600" y="72">S6</text>
    <text x="660" y="72">S7</text><text x="720" y="72">S8</text><text x="780" y="72">S9</text>
  </g>
  <line x1="286" y1="56" x2="286" y2="348" stroke="#8fa3bd"/>
  <g stroke="#e6ecf4">
    <line x1="290" y1="80" x2="290" y2="348"/><line x1="350" y1="80" x2="350" y2="348"/>
    <line x1="410" y1="80" x2="410" y2="348"/><line x1="470" y1="80" x2="470" y2="348"/>
    <line x1="530" y1="80" x2="530" y2="348"/><line x1="590" y1="80" x2="590" y2="348"/>
    <line x1="650" y1="80" x2="650" y2="348"/><line x1="710" y1="80" x2="710" y2="348"/>
    <line x1="770" y1="80" x2="770" y2="348"/><line x1="830" y1="80" x2="830" y2="348"/>
  </g>

  <g class="ui">
    <text x="38" y="102">A · Relever les besoins en eau</text><text x="244" y="102">1</text>
    <text x="38" y="130">B · Choisir les grandeurs</text><text x="244" y="130">1</text>
    <text x="38" y="158">C · Câbler le capteur</text><text x="244" y="158">2</text>
    <text x="38" y="186">D · Écrire le programme</text><text x="244" y="186">2</text>
    <text x="38" y="214">E · Fabriquer le support</text><text x="244" y="214">3</text>
    <text x="38" y="242">F · Assembler</text><text x="244" y="242">1</text>
    <text x="38" y="270">G · Téléverser et régler</text><text x="244" y="270">1</text>
    <text x="38" y="298">H · Tester une semaine</text><text x="244" y="298">2</text>
    <text x="38" y="326">I · Le jardin s'arrose seul</text><text x="244" y="326">0</text>
  </g>

