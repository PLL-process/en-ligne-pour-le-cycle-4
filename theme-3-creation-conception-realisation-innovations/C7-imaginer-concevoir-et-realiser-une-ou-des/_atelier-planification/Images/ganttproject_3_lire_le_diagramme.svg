<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="g3t g3d"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="g3t">GanttProject, étape 3 — lire le diagramme du jardin de Brooklyn (schéma reconstruit)</title>
  <desc id="g3d">Schéma reconstruit du diagramme de GanttProject pour le projet du jardin connecté
  de Brooklyn, une fois les neuf entrées saisies et les antériorités déclarées. À gauche, la table
  rappelle les tâches de A à I avec leur durée. À droite, chaque tâche est représentée par une barre
  horizontale dont la longueur vaut sa durée et dont la position indique quand elle commence ; des
  flèches relient les barres liées par une antériorité. Le projet occupe neuf séances au total. Le
  jalon final, nommé « Le jardin s'arrose seul », est dessiné comme un losange sans longueur,
  puisque sa durée est nulle. Trois lectures sont mises en évidence par des bulles numérotées. La
  première montre trois barres qui se chevauchent dans le temps : câbler le capteur, écrire le
  programme et fabriquer le support avancent en même temps, parce qu'aucune antériorité ne les lie —
  c'est le parallélisme, et c'est ce qui empêche le projet de durer treize séances au lieu de neuf.
  La deuxième désigne une barre qui commence plus tard qu'elle ne pourrait : écrire le programme
  d'arrosage ne dépend que de la première tâche, on pourrait la commencer dès la deuxième séance,
  et elle dispose donc de trois séances de marge. La troisième désigne le jalon et rappelle qu'il ne
  se traîne pas : il arrive quand la dernière tâche qui le précède est finie. Un encadré donne la
  question à se poser devant tout diagramme : qu'est-ce qui, dans ce dessin, m'empêche de finir plus
  tôt ? Un second encadré prévient d'une erreur de lecture fréquente : une barre longue n'est pas
  forcément un problème, alors qu'une barre courte placée au mauvais endroit peut retarder tout le
  reste.</desc>
  <rect width="900" height="490" fill="#f4f7fb"/>
  <style>
    text{fill:#16233a;font-size:12px}
    .ui{font-size:11.5px;fill:#22334d}
    .hd{font-size:11.5px;font-weight:600;fill:#33465f}
    .bulle{fill:#b4212a}
    .btxt{fill:#fff;font-size:11.5px;font-weight:700}
    .note{font-size:12px;fill:#7a2530}
    .dep{stroke:#8a99ad;stroke-width:1.6;fill:none;marker-end:url(#fd3)}
  </style>
  <defs><marker id="fd3" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="#8a99ad"/></marker></defs>
  <text x="26" y="26" font-size="16" font-weight="600">Étape 3 — lire le diagramme</text>
  <text x="26" y="44" font-size="11.5" fill="#5b6b82">Jardin connecté de Brooklyn · 9 entrées · <tspan font-weight="700">9 séances au total</tspan> — schéma reconstruit, pas une capture.</text>

