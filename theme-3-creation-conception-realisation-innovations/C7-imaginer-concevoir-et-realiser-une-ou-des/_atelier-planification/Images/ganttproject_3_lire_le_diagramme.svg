    <rect x="350" y="120" width="56" height="14" rx="3"/>
    <rect x="410" y="148" width="116" height="14" rx="3"/>
    <rect x="350" y="176" width="116" height="14" rx="3"/>
    <rect x="410" y="204" width="176" height="14" rx="3"/>
    <rect x="590" y="232" width="56" height="14" rx="3"/>
    <rect x="650" y="260" width="56" height="14" rx="3"/>
