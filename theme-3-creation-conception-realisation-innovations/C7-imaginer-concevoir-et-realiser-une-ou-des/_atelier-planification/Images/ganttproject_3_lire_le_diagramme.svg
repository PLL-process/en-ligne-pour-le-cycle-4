  </g>
  <polygon points="830,315 838,323 830,331 822,323" fill="#1f6b3a"/>

  <path class="dep" d="M346 99 H 352 V 116"/>
  <path class="dep" d="M406 127 H 412 V 144"/>
  <path class="dep" d="M406 127 H 408 V 200 H 408"/>
  <path class="dep" d="M346 99 H 348 V 172 H 348"/>
  <path class="dep" d="M586 211 H 590 V 228"/>
  <path class="dep" d="M646 239 H 650 V 256"/>
  <path class="dep" d="M706 267 H 710 V 284"/>
  <path class="dep" d="M826 295 H 830 V 311"/>

  <rect x="404" y="142" width="188" height="82" fill="none" stroke="#b4212a" stroke-width="2" stroke-dasharray="5 4" rx="4"/>
  <circle class="bulle" cx="404" cy="142" r="11"/><text class="btxt" x="400" y="146">1</text>
  <circle class="bulle" cx="470" cy="183" r="11"/><text class="btxt" x="466" y="187">2</text>
  <circle class="bulle" cx="852" cy="323" r="11"/><text class="btxt" x="848" y="327">3</text>

  <rect x="26" y="360" width="282" height="60" rx="6" fill="#fdeceb" stroke="#d9908f"/>
  <circle class="bulle" cx="46" cy="378" r="9"/><text class="btxt" x="43" y="382">1</text>
  <text class="note" x="62" y="382"><tspan font-weight="700">Trois barres se chevauchent&#160;:</tspan></text>
  <text class="note" x="62" y="398">C, D et E avancent <tspan font-weight="700">en même temps</tspan>.</text>
  <text class="note" x="62" y="414">Sans cela, le projet durerait 13 séances.</text>

  <rect x="318" y="360" width="282" height="60" rx="6" fill="#fdeceb" stroke="#d9908f"/>
  <circle class="bulle" cx="338" cy="378" r="9"/><text class="btxt" x="335" y="382">2</text>
  <text class="note" x="354" y="382"><tspan font-weight="700">D pourrait commencer plus tôt&#160;:</tspan></text>
  <text class="note" x="354" y="398">elle ne dépend que de A.</text>
  <text class="note" x="354" y="414">Elle a <tspan font-weight="700">3 séances de marge</tspan>.</text>

  <rect x="610" y="360" width="264" height="60" rx="6" fill="#fdeceb" stroke="#d9908f"/>
  <circle class="bulle" cx="630" cy="378" r="9"/><text class="btxt" x="627" y="382">3</text>
  <text class="note" x="646" y="382"><tspan font-weight="700">Le jalon est un losange&#160;:</tspan></text>
  <text class="note" x="646" y="398">aucune longueur, aucune durée.</text>
  <text class="note" x="646" y="414">Il arrive quand H est finie.</text>

  <rect x="26" y="430" width="410" height="50" rx="6" fill="#e8f1e8" stroke="#7aa77a"/>
  <text x="42" y="452" font-size="12.5" font-weight="700">La question à se poser devant tout diagramme</text>
  <text x="42" y="470" font-size="12">«&#160;Qu'est-ce qui, dans ce dessin, <tspan font-weight="700">m'empêche de finir plus tôt</tspan>&#160;?&#160;»</text>

  <rect x="446" y="430" width="428" height="50" rx="6" fill="#3a1218" stroke="#c0555c"/>
  <text x="462" y="452" font-size="12.5" font-weight="700" fill="#ffd7da">⚠ Erreur de lecture fréquente</text>
  <text x="462" y="470" font-size="12" fill="#ffd7da">Une <tspan font-weight="700">longue</tspan> barre n'est pas forcément un problème. Une <tspan font-weight="700">courte</tspan>, mal placée, retarde tout.</text>
</svg>
