<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="g2t g2d"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="g2t">GanttProject, étape 2 — déclarer les antériorités, et laisser le logiciel recalculer les dates (schéma reconstruit)</title>
  <desc id="g2d">Schéma reconstruit de GanttProject à l'étape des dépendances. La zone du diagramme
  montre six barres de tâches ; une flèche part de la fin d'une barre et rejoint le début d'une
  autre, matérialisant une antériorité. Deux façons de faire sont montrées côte à côte. La première,
  à la souris : on clique sur la barre de la tâche qui doit se terminer d'abord et l'on glisse
  jusqu'à la barre de celle qui doit attendre ; une flèche apparaît. La seconde, par la boîte de
  dialogue : clic droit sur la tâche, Task Properties, onglet Predecessors, où l'on ajoute la tâche
  qui précède et le type de lien, Finish-Start étant celui qu'on emploie presque toujours. Une bulle
  attire l'attention sur l'effet immédiat : dès qu'une dépendance est déclarée, GanttProject décale
  la tâche qui attend et recalcule ses dates de début et de fin tout seul. La différence avec le
  tableur est expliquée dans un encadré : dans un tableur, on écrit soi-même la formule qui décale
  la tâche ; ici, on déclare seulement qui attend qui, et le logiciel calcule. Ce qu'on gagne, c'est
  que le calcul se refait automatiquement à chaque changement de durée. Ce qu'on perd, c'est de voir
  le calcul — d'où l'importance d'avoir compris ce que le logiciel fait à notre place. Un dernier
  encadré met en garde contre l'erreur la plus fréquente : déclarer une antériorité entre deux
  tâches qui n'en ont pas besoin. Deux tâches sans lien peuvent avancer en même temps, et c'est
  précisément là qu'on gagne du temps ; une antériorité inutile allonge le projet sans raison.</desc>
