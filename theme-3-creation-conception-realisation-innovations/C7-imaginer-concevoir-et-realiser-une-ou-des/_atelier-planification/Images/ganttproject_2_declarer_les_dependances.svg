  <text class="ui" x="586" y="272" fill="#5b6b82">le lien qu'on emploie presque toujours.</text>
  <circle class="bulle" cx="740" cy="102" r="11"/><text class="btxt" x="736" y="106">3</text>

  <rect x="26" y="318" width="410" height="66" rx="6" fill="#fdeceb" stroke="#d9908f"/>
  <circle class="bulle" cx="46" cy="336" r="9"/><text class="btxt" x="43" y="340">1</text>
  <text class="note" x="62" y="340"><tspan font-weight="700">À la souris</tspan>&#160;: on part de la barre qui finit d'abord</text>
  <text class="note" x="62" y="356">et l'on glisse jusqu'à celle qui doit attendre.</text>
  <circle class="bulle" cx="46" cy="372" r="9"/><text class="btxt" x="43" y="376">2</text>
  <text class="note" x="62" y="376">La flèche apparaît&#160;: l'antériorité est déclarée.</text>

  <rect x="446" y="318" width="428" height="66" rx="6" fill="#fdeceb" stroke="#d9908f"/>
  <circle class="bulle" cx="466" cy="336" r="9"/><text class="btxt" x="463" y="340">3</text>
  <text class="note" x="482" y="340"><tspan font-weight="700">Ou par la boîte&#160;:</tspan> clic droit → Task Properties →</text>
  <text class="note" x="482" y="356">onglet <tspan font-weight="700">Predecessors</tspan> → Add → choisir la tâche qui précède.</text>
  <text class="note" x="482" y="376">Et aussitôt&#160;: <tspan font-weight="700">GanttProject décale la tâche et recalcule ses dates.</tspan></text>

  <rect x="26" y="394" width="410" height="76" rx="6" fill="#e8f1e8" stroke="#7aa77a"/>
  <text x="42" y="416" font-size="12.5" font-weight="700">Tableur ou GanttProject&#160;?</text>
  <text x="42" y="434" font-size="12">Dans un tableur, <tspan font-weight="700">tu écris la formule</tspan> qui décale la tâche.</text>
  <text x="42" y="450" font-size="12">Ici, tu déclares seulement <tspan font-weight="700">qui attend qui</tspan>&#160;: le logiciel calcule.</text>
  <text x="42" y="466" font-size="12">Tu gagnes le recalcul automatique&#160;; tu perds de voir le calcul.</text>

  <rect x="446" y="394" width="428" height="76" rx="6" fill="#3a1218" stroke="#c0555c"/>
  <text x="462" y="416" font-size="12.5" font-weight="700" fill="#ffd7da">⚠ L'erreur la plus fréquente</text>
  <text x="462" y="436" font-size="12" fill="#ffd7da">Déclarer une antériorité entre deux tâches qui n'en ont pas besoin.</text>
  <text x="462" y="454" font-size="12" fill="#ffd7da">Deux tâches sans lien avancent <tspan font-weight="700">en même temps</tspan> — c'est là qu'on</text>
  <text x="462" y="468" font-size="12" fill="#ffd7da">gagne du temps. Une flèche inutile allonge le projet pour rien.</text>
