<text x="867.0" y="394.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="28" y="434.0" font-size="13" fill="#0f172a"><tspan font-weight="700">I</tspan>  Téléverser et étalonner</text>
