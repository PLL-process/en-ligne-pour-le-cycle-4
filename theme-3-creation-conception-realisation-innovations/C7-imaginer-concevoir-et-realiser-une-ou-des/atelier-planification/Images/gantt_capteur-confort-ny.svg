<text x="28" y="46" font-size="21" font-weight="700" fill="#0f172a">Le capteur de confort de la salle 214</text>
<text x="28" y="68" font-size="13.5" fill="#475569">3e · 11 tâches · le projet tient en <tspan font-weight="700" fill="#c2410c">12 séances</tspan></text>
