<rect x="774" y="247" width="124" height="22" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="526" y="247" width="124" height="22" rx="5" fill="#0f766e"/>
<text x="588.0" y="262.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">2</text>
<text x="918" y="262.0" font-size="11.5" fill="#0f766e" stroke="#ffffff" stroke-width="3" paint-order="stroke">marge 4</text>
<text x="28" y="310.0" font-size="13" fill="#0f172a"><tspan font-weight="700">D</tspan>  Modéliser le boîtier</text>
<rect x="526" y="295" width="124" height="22" rx="5" fill="#c2410c"/>
<text x="588.0" y="310.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">2</text>
<text x="28" y="358.0" font-size="13" fill="#0f172a"><tspan font-weight="700">E</tspan>  Imprimer le boîtier</text>
<rect x="650" y="343" width="186" height="22" rx="5" fill="#c2410c"/>
<text x="743.0" y="358.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">3</text>
<text x="28" y="406.0" font-size="13" fill="#0f172a"><tspan font-weight="700">G</tspan>  Câbler les capteurs sur la carte</text>
<rect x="464" y="386" width="372" height="32" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="774" y="391" width="62" height="22" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="464" y="391" width="62" height="22" rx="5" fill="#0f766e"/>
<text x="495.0" y="406.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="856" y="406.0" font-size="11.5" fill="#0f766e" stroke="#ffffff" stroke-width="3" paint-order="stroke">marge 5</text>
<text x="28" y="454.0" font-size="13" fill="#0f172a"><tspan font-weight="700">H</tspan>  Assembler la carte dans le boîtier</text>
<rect x="836" y="439" width="62" height="22" rx="5" fill="#c2410c"/>
<text x="867.0" y="454.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="28" y="502.0" font-size="13" fill="#0f172a"><tspan font-weight="700">I</tspan>  Téléverser et étalonner</text>
<rect x="898" y="487" width="62" height="22" rx="5" fill="#c2410c"/>
<text x="929.0" y="502.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="28" y="550.0" font-size="13" fill="#0f172a"><tspan font-weight="700">J</tspan>  Mesurer trois jours et comparer au cahier …</text>
<rect x="960" y="535" width="124" height="22" rx="5" fill="#c2410c"/>
<text x="1022.0" y="550.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">2</text>
<text x="28" y="598.0" font-size="13" fill="#0f172a"><tspan font-weight="700">K</tspan>  Le capteur signale la surchauffe</text>
<path d="M1084,583.0 L1095,594.0 L1084,605.0 L1073,594.0 z" fill="#c2410c"/>
<text x="1102" y="598.0" font-size="12" font-weight="700" fill="#c2410c">jalon</text>
