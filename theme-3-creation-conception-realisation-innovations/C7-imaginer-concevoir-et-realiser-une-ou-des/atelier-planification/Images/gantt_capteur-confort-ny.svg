<text x="28" y="118.0" font-size="13" fill="#0f172a"><tspan font-weight="700">A</tspan>  Définir ce qu'on appelle une salle inconfo…</text>
<rect x="340" y="103" width="62" height="22" rx="5" fill="#c2410c"/>
<text x="371.0" y="118.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="28" y="166.0" font-size="13" fill="#0f172a"><tspan font-weight="700">B</tspan>  Choisir les grandeurs à mesurer</text>
<rect x="402" y="151" width="62" height="22" rx="5" fill="#c2410c"/>
<text x="433.0" y="166.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="28" y="214.0" font-size="13" fill="#0f172a"><tspan font-weight="700">C</tspan>  Rédiger le cahier des charges</text>
<rect x="464" y="199" width="62" height="22" rx="5" fill="#c2410c"/>
<text x="495.0" y="214.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="28" y="262.0" font-size="13" fill="#0f172a"><tspan font-weight="700">F</tspan>  Écrire le programme de mesure et d'alerte</text>
