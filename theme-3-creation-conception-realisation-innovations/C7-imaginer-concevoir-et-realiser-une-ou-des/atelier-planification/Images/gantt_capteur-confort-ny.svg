<text x="66" y="567" font-size="12" fill="#0f172a"><tspan font-weight="700">chemin critique</tspan> — aucun jeu : un jour de retard ici, c'est un jour de retard sur tout le projet.</text>
<rect x="28" y="578" width="30" height="13" rx="4" fill="#0f766e"/>
<text x="66" y="589" font-size="12" fill="#0f172a"><tspan font-weight="700">tâche à marge</tspan> — elle a du jeu ; le rectangle pointillé montre où elle aurait pu être placée sans rien retarder.</text>
<rect x="28" y="600" width="30" height="13" rx="4" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
<text x="66" y="611" font-size="12" fill="#0f172a"><tspan font-weight="700">la fenêtre</tspan> — allonge une tâche à marge jusqu'à remplir son rectangle : elle devient critique, et le chemin change.</text>
