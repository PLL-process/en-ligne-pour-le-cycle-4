<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1234 726" width="1234" height="726" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Diagramme de Gantt — capteur-confort-ny (3e)</title>
<desc id="d">Le projet dure 12 séances. Les tâches du chemin critique sont en orange plein ; les tâches à marge sont en sarcelle, avec un rectangle pointillé qui montre la fenêtre dans laquelle elles auraient pu être placées.</desc>
