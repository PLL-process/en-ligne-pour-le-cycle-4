<line x1="464" y1="68" x2="464" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="495.0" y="82" font-size="11.5" text-anchor="middle" fill="#64748b">séance 3</text>
<line x1="526" y1="68" x2="526" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="557.0" y="82" font-size="11.5" text-anchor="middle" fill="#64748b">séance 4</text>
<line x1="588" y1="68" x2="588" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="619.0" y="82" font-size="11.5" text-anchor="middle" fill="#64748b">séance 5</text>
<line x1="650" y1="68" x2="650" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="681.0" y="82" font-size="11.5" text-anchor="middle" fill="#64748b">séance 6</text>
<line x1="712" y1="68" x2="712" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="743.0" y="82" font-size="11.5" text-anchor="middle" fill="#64748b">séance 7</text>
<line x1="774" y1="68" x2="774" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="28" y="114.0" font-size="13" fill="#0f172a"><tspan font-weight="700">A</tspan>  Observer le hall aux heures de pointe et n…</text>
<rect x="340" y="99" width="62" height="22" rx="5" fill="#c2410c"/>
<text x="371.0" y="114.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<rect x="0" y="130" width="924" height="40" fill="#f8fafc"/>
<text x="28" y="154.0" font-size="13" fill="#0f172a"><tspan font-weight="700">B</tspan>  Choisir ce que l'indicateur doit signaler</text>
<rect x="402" y="139" width="62" height="22" rx="5" fill="#c2410c"/>
<text x="433.0" y="154.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="28" y="194.0" font-size="13" fill="#0f172a"><tspan font-weight="700">C</tspan>  Dessiner le support à fabriquer</text>
<rect x="464" y="179" width="124" height="22" rx="5" fill="#c2410c"/>
<text x="526.0" y="194.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">2</text>
<rect x="0" y="210" width="924" height="40" fill="#f8fafc"/>
<text x="28" y="234.0" font-size="13" fill="#0f172a"><tspan font-weight="700">D</tspan>  Choisir le matériau du support</text>
<rect x="464" y="215" width="124" height="30" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="526" y="219" width="62" height="22" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="464" y="219" width="62" height="22" rx="5" fill="#0f766e"/>
<text x="495.0" y="234.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="597" y="234.0" font-size="11.5" fill="#0f766e">marge 1</text>
<text x="28" y="274.0" font-size="13" fill="#0f172a"><tspan font-weight="700">E</tspan>  Fabriquer le support</text>
<rect x="588" y="259" width="124" height="22" rx="5" fill="#c2410c"/>
<text x="650.0" y="274.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">2</text>
<rect x="0" y="290" width="924" height="40" fill="#f8fafc"/>
<text x="28" y="314.0" font-size="13" fill="#0f172a"><tspan font-weight="700">F</tspan>  Installer l'indicateur dans le hall</text>
<rect x="712" y="299" width="62" height="22" rx="5" fill="#c2410c"/>
<text x="743.0" y="314.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="28" y="354.0" font-size="13" fill="#0f172a"><tspan font-weight="700">G</tspan>  L'indicateur est en service</text>
<path d="M774,339.0 L785,350.0 L774,361.0 L763,350.0 z" fill="#c2410c"/>
<text x="792" y="354.0" font-size="12" font-weight="700" fill="#c2410c">jalon</text>
<path d="M402,110.0 V137.0" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#fl)"/>
<path d="M464,150.0 V177.0" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#fl)"/>
<path d="M464,150.0 V217.0" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#fl)"/>
<path d="M588,190.0 V257.0" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#fl)"/>
<path d="M526,230.0 H578 V270.0 H584" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#fl)"/>
<path d="M712,270.0 V297.0" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#fl)"/>
<path d="M774,310.0 V337.0" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#fl)"/>
<line x1="28" y1="384" x2="896" y2="384" stroke="#e2e8f0"/>
<rect x="28" y="396" width="30" height="13" rx="4" fill="#c2410c"/>
<text x="66" y="407" font-size="12" fill="#0f172a"><tspan font-weight="700">chemin critique</tspan> — aucun jeu : un jour de retard ici, c'est un jour de retard sur tout le projet.</text>
<rect x="28" y="418" width="30" height="13" rx="4" fill="#0f766e"/>
<text x="66" y="429" font-size="12" fill="#0f172a"><tspan font-weight="700">tâche à marge</tspan> — elle a du jeu ; le rectangle pointillé montre où elle aurait pu être placée sans rien retarder.</text>
<rect x="28" y="440" width="30" height="13" rx="4" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
<text x="66" y="451" font-size="12" fill="#0f172a"><tspan font-weight="700">la fenêtre</tspan> — allonge une tâche à marge jusqu'à remplir son rectangle : elle devient critique, et le chemin change.</text>
</svg>