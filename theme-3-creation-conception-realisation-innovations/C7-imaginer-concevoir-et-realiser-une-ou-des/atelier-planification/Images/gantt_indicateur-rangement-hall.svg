<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 478" width="924" height="478" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Diagramme de Gantt — indicateur-rangement-hall (5e)</title>
<desc id="d">Le projet dure 7 séances. Les tâches du chemin critique sont en orange plein ; les tâches à marge sont en sarcelle, avec un rectangle pointillé qui montre la fenêtre dans laquelle elles auraient pu être placées.</desc>
<rect width="924" height="478" fill="#ffffff"/>
<defs><marker id="fl" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="46" font-size="21" font-weight="700" fill="#0f172a">L'indicateur de rangement du hall</text>
<text x="28" y="68" font-size="13.5" fill="#475569">5e · 7 tâches · le projet tient en <tspan font-weight="700" fill="#c2410c">7 séances</tspan></text>
<line x1="340" y1="68" x2="340" y2="370" stroke="#e2e8f0" stroke-width="1"/>
<text x="371.0" y="82" font-size="11.5" text-anchor="middle" fill="#64748b">séance 1</text>
<line x1="402" y1="68" x2="402" y2="370" stroke="#e2e8f0" stroke-width="1"/>
