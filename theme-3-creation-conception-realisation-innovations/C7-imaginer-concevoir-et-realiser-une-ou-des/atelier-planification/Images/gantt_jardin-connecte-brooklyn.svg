<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1048 630" width="1048" height="630" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Diagramme de Gantt — jardin-connecte-brooklyn (4e)</title>
<desc id="d">Le projet dure 9 séances. Les tâches du chemin critique sont en orange plein ; les tâches à marge sont en sarcelle, avec un rectangle pointillé qui montre la fenêtre dans laquelle elles auraient pu être placées.</desc>
