<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 344" width="350" height="344" role="img" aria-labelledby="t_conso_hall d_conso_hall" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_conso_hall">Ce que consomme l'indicateur du hall</title>
<desc id="d_conso_hall">Ce que consomme l'indicateur du hall en une journée, sous 5 volts. Carte Arduino UNO : 45 milliampères pendant 10 heures, 2,25 wattheures. DEL indicatrice : 10 milliampères pendant 10 heures, 0,50 wattheures. Capteur de présence du sac : 0,5 milliampères pendant 10 heures, 0,025 wattheures. Total : 2,78 wattheures par jour.</desc>
<rect width="350" height="344" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Ce que consomme l'indicateur du hall</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Trois composants, sous 5 V (volts),</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">pendant une journée de classe.</text>
<rect x="14.0" y="87.4" width="322.0" height="170.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Composant</text>
<text x="153.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Courant</text>
<text x="217.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Durée</text>
<text x="291.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Énergie</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Carte UNO</text>
<text x="153.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">45 mA</text>
<text x="217.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">10 h</text>
<text x="291.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2,25 Wh</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">DEL</text>
<text x="153.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">10 mA</text>
<text x="217.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">10 h</text>
<text x="291.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,50 Wh</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Capteur</text>
<text x="153.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,5 mA</text>
<text x="217.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">10 h</text>
<text x="291.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,025 Wh</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Total</text>
<text x="153.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<text x="217.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<text x="291.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2,78 Wh</text>
<text x="14.0" y="287.6" font-size="13.5" fill="#9bbefc">Capteur : le capteur de présence du sac · mA :</text>
<text x="14.0" y="305.8" font-size="13.5" fill="#9bbefc">milliampère · h : heure · Wh : wattheure · énergie</text>
<text x="14.0" y="324.0" font-size="13.5" fill="#9bbefc">= courant × 5 V × durée.</text>
</svg>
