<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 430" width="350" height="430" role="img" aria-labelledby="t_prix_banc d_prix_banc" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_prix_banc">Le prix de l'assise</title>
<desc id="d_prix_banc">Pour chacun des six matériaux, le prix au kilogramme, la masse de l'assise et son prix. Le pin non traité : 2,20 euros le kilogramme, 11,6 kilogrammes, 25,63 euros l'assise. Le pin traité autoclave : 3,80 euros le kilogramme, 12,3 kilogrammes, 46,82 euros l'assise. Le teck : 14,00 euros le kilogramme, 14,6 kilogrammes, 203,84 euros l'assise. Le PVC : 3,50 euros le kilogramme, 31,4 kilogrammes, 109,76 euros l'assise. L'acier galvanisé : 1,90 euros le kilogramme, 175,8 kilogrammes, 334,10 euros l'assise. Le béton : 0,35 euros le kilogramme, 53,8 kilogrammes, 18,82 euros l'assise.</desc>
<rect width="350" height="430" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le prix de l'assise</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">La même assise de 1,60 m, dans</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">chacun des six matériaux.</text>
<rect x="14.0" y="87.4" width="322.0" height="238.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Matériau</text>
<text x="153.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Prix au kg</text>
<text x="220.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Masse</text>
<text x="295.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Assise</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Pin nu</text>
<text x="153.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2,20 €</text>
<text x="220.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">11,6 kg</text>
<text x="295.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">25,63 €</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">Pin traité</text>
<text x="153.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">3,80 €</text>
<text x="220.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">12,3 kg</text>
<text x="295.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">46,82 €</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Teck</text>
<text x="153.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">14,00 €</text>
<text x="220.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">14,6 kg</text>
<text x="295.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">203,84 €</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">PVC</text>
<text x="153.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">3,50 €</text>
<text x="220.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">31,4 kg</text>
<text x="295.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">109,76 €</text>
<line x1="14" y1="257.4" x2="336" y2="257.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="279.4" font-size="15" fill="#e4eaf5" font-weight="700">Acier galva.</text>
<text x="153.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">1,90 €</text>
<text x="220.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">175,8 kg</text>
<text x="295.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">334,10 €</text>
<line x1="14" y1="291.4" x2="336" y2="291.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="313.4" font-size="15" fill="#e4eaf5" font-weight="700">Béton</text>
<text x="153.0" y="313.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,35 €</text>
<text x="220.0" y="313.4" font-size="15" fill="#e4eaf5" text-anchor="middle">53,8 kg</text>
<text x="295.0" y="313.4" font-size="15" fill="#e4eaf5" text-anchor="middle">18,82 €</text>
<text x="14.0" y="355.6" font-size="13.5" fill="#9bbefc">kg : kilogramme · prix de l'assise = prix au</text>
<text x="14.0" y="373.8" font-size="13.5" fill="#9bbefc">kilogramme × masse de l'assise ; la masse vient du</text>
<text x="14.0" y="392.0" font-size="13.5" fill="#9bbefc">volume de l'assise et de la masse volumique du</text>
<text x="14.0" y="410.3" font-size="13.5" fill="#9bbefc">matériau.</text>
</svg>
