<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 466" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le tableau de tests de l'indicateur : attendu écrit d'abord, observé ensuite</title>
  <desc id="d">Un tableau de quatre colonnes : test, résultat attendu écrit AVANT l'essai, résultat observé pendant l'essai, et conformité. Ligne 1, poser le sac : attendu LED rouge, observé LED rouge, conforme. Ligne 2, enlever le sac : attendu LED verte, observé LED verte, conforme. Ligne 3, visible à deux mètres : attendu oui, observé non, la LED est trop pâle en plein jour, non conforme. Sous le tableau, la décision : à améliorer, parce qu'un test important a échoué ; l'écart désigne précisément ce qu'il faut corriger, ici la luminosité de la LED. En bas, deux rappels : le résultat attendu s'écrit avant l'essai, sinon il tombe toujours juste et ne prouve rien ; après correction, il faut refaire le test, sinon la correction n'est pas prouvée.</desc>
  <rect width="940" height="466" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Valider, c'est comparer ce qu'on attendait à ce qu'on a vu</text>

  <!-- en-tete -->
  <rect x="30" y="52" width="880" height="42" rx="8" fill="#173666" stroke="#274a8a" stroke-width="2"/>
  <text x="150" y="78" fill="#9bbefc" font-size="13" font-weight="bold" text-anchor="middle">Test</text>
  <text x="400" y="72" fill="#c68ef2" font-size="13" font-weight="bold" text-anchor="middle">Résultat ATTENDU</text>
  <text x="400" y="88" fill="#9bbefc" font-size="10.5" text-anchor="middle">écrit AVANT l'essai</text>
  <text x="640" y="72" fill="#61dafb" font-size="13" font-weight="bold" text-anchor="middle">Résultat OBSERVÉ</text>
  <text x="640" y="88" fill="#9bbefc" font-size="10.5" text-anchor="middle">noté pendant l'essai</text>
  <text x="840" y="78" fill="#9bbefc" font-size="13" font-weight="bold" text-anchor="middle">Conforme ?</text>

  <!-- ligne 1 -->
  <rect x="30" y="110" width="880" height="48" rx="6" fill="#0d2347" stroke="#274a8a" stroke-width="1.5"/>
  <text x="150" y="140" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Poser le sac</text>
  <text x="400" y="140" fill="#ff7b88" font-size="12.5" text-anchor="middle">LED rouge</text>
  <text x="640" y="140" fill="#ff7b88" font-size="12.5" text-anchor="middle">LED rouge</text>
  <text x="840" y="141" fill="#81fba1" font-size="15" font-weight="bold" text-anchor="middle">✔ oui</text>

  <!-- ligne 2 -->
  <rect x="30" y="174" width="880" height="48" rx="6" fill="#0d2347" stroke="#274a8a" stroke-width="1.5"/>
  <text x="150" y="204" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Enlever le sac</text>
  <text x="400" y="204" fill="#81fba1" font-size="12.5" text-anchor="middle">LED verte</text>
  <text x="640" y="204" fill="#81fba1" font-size="12.5" text-anchor="middle">LED verte</text>
  <text x="840" y="205" fill="#81fba1" font-size="15" font-weight="bold" text-anchor="middle">✔ oui</text>

  <!-- ligne 3 : ecart -->
  <rect x="30" y="238" width="880" height="56" rx="6" fill="#1a1230" stroke="#ff7b88" stroke-width="2"/>
  <text x="150" y="264" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Visible à 2 m</text>
  <text x="150" y="282" fill="#9bbefc" font-size="10.5" text-anchor="middle">(performance)</text>
  <text x="400" y="271" fill="#ffd66b" font-size="12.5" text-anchor="middle">oui, lisible de loin</text>
  <text x="640" y="262" fill="#ff7b88" font-size="12.5" text-anchor="middle">non</text>
  <text x="640" y="280" fill="#9bbefc" font-size="10.5" text-anchor="middle">LED trop pâle en plein jour</text>
  <text x="840" y="272" fill="#ff7b88" font-size="15" font-weight="bold" text-anchor="middle">✘ non</text>

  <!-- separateurs verticaux -->
  <g stroke="#274a8a" stroke-width="1">
    <line x1="270" y1="60" x2="270" y2="86"/>
    <line x1="530" y1="60" x2="530" y2="86"/>
    <line x1="762" y1="60" x2="762" y2="86"/>
    <line x1="270" y1="118" x2="270" y2="150"/>
    <line x1="530" y1="118" x2="530" y2="150"/>
    <line x1="762" y1="118" x2="762" y2="150"/>
    <line x1="270" y1="182" x2="270" y2="214"/>
    <line x1="530" y1="182" x2="530" y2="214"/>
    <line x1="762" y1="182" x2="762" y2="214"/>
    <line x1="270" y1="246" x2="270" y2="286"/>
    <line x1="530" y1="246" x2="530" y2="286"/>
    <line x1="762" y1="246" x2="762" y2="286"/>
  </g>

  <!-- decision -->
  <rect x="30" y="312" width="430" height="82" rx="10" fill="#0a1b3d" stroke="#ffd66b" stroke-width="2"/>
  <text x="245" y="338" fill="#ffd66b" font-size="13.5" font-weight="bold" text-anchor="middle">Décision : À AMÉLIORER</text>
  <text x="245" y="360" fill="#e4eaf5" font-size="11.5" text-anchor="middle">un test important a échoué : on ne valide pas,</text>
  <text x="245" y="378" fill="#e4eaf5" font-size="11.5" text-anchor="middle">mais on ne rejette pas non plus</text>

  <rect x="480" y="312" width="430" height="82" rx="10" fill="#0a1b3d" stroke="#81fba1" stroke-width="2"/>
  <text x="695" y="338" fill="#81fba1" font-size="13.5" font-weight="bold" text-anchor="middle">Ce que l'écart nous apprend</text>
  <text x="695" y="360" fill="#e4eaf5" font-size="11.5" text-anchor="middle">il désigne quoi corriger : la luminosité.</text>
  <text x="695" y="378" fill="#e4eaf5" font-size="11.5" text-anchor="middle">Un test raté est une information, pas une faute.</text>

  <!-- rappels -->
  <text x="470" y="422" fill="#c68ef2" font-size="12.5" text-anchor="middle" font-weight="bold">Écrire l'attendu APRÈS l'essai, c'est avoir toujours raison — et ne rien prouver.</text>
  <text x="470" y="446" fill="#9bbefc" font-size="12" text-anchor="middle">Après correction, on REFAIT le test : sans cela, la correction n'est pas prouvée.</text>
</svg>
