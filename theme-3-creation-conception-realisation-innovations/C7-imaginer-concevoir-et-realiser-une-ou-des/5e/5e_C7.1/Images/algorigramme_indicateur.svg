<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">L'algorigramme de l'indicateur de rangement, et le vocabulaire de ses symboles</title>
  <desc id="d">À gauche, un algorigramme lu de haut en bas. Bloc 1, un terminal de forme arrondie : DÉBUT, au démarrage de l'indicateur. Bloc 2, un rectangle : lire le capteur, sac posé ou non. Bloc 3, un losange : place occupée, point d'interrogation ; deux sorties partent de ce losange. Sortie OUI vers la droite, bloc 4, un rectangle : LED rouge. Sortie NON vers la gauche, bloc 5, un rectangle : LED verte. Les deux chemins se rejoignent, et une flèche remonte vers le bloc 2 : la boucle, l'indicateur surveille en continu. À droite, la légende des trois symboles : le terminal arrondi marque le début ou la fin ; le rectangle est une action ou un traitement et n'a qu'une seule sortie ; le losange est une décision et a toujours deux sorties, une pour OUI et une pour NON. En bas à droite, la même règle écrite en Python : si occupee deux points, afficher ROUGE, sinon, afficher VERT.</desc>
  <rect width="940" height="560" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Le même raisonnement, en trois habits : schéma, symboles, programme</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/></marker></defs>

  <!-- ── algorigramme ── -->
  <rect x="24" y="52" width="480" height="486" rx="12" fill="#0a1b3d" stroke="#274a8a" stroke-width="2"/>

  <rect x="184" y="74" width="160" height="42" rx="21" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
  <text x="264" y="100" fill="#61dafb" font-size="13" text-anchor="middle" font-weight="bold">DÉBUT</text>
  <text x="160" y="100" fill="#5b7bb8" font-size="12" text-anchor="end">1</text>
  <path d="M264 118 L264 146" stroke="#61dafb" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="152" y="148" width="224" height="44" rx="6" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
  <text x="264" y="175" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Lire le capteur</text>
  <text x="140" y="175" fill="#5b7bb8" font-size="12" text-anchor="end">2</text>
  <path d="M264 194 L264 222" stroke="#61dafb" stroke-width="2.5" marker-end="url(#a)"/>

  <polygon points="264,224 380,282 264,340 148,282" fill="#0d2347" stroke="#c68ef2" stroke-width="2.5"/>
  <text x="264" y="287" fill="#c68ef2" font-size="12.5" text-anchor="middle" font-weight="bold">Place occupée ?</text>
  <text x="264" y="248" fill="#5b7bb8" font-size="12" text-anchor="middle">3</text>

  <path d="M380 282 L424 282 L424 372" stroke="#61dafb" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="400" y="272" fill="#81fba1" font-size="12" text-anchor="middle">OUI</text>
  <path d="M148 282 L104 282 L104 372" stroke="#61dafb" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="126" y="272" fill="#ffd66b" font-size="12" text-anchor="middle">NON</text>

  <rect x="346" y="374" width="156" height="44" rx="6" fill="#0d2347" stroke="#ff7b88" stroke-width="2.5"/>
  <text x="424" y="401" fill="#ff7b88" font-size="12.5" text-anchor="middle" font-weight="bold">LED rouge</text>
  <text x="336" y="401" fill="#5b7bb8" font-size="12" text-anchor="end">4</text>

  <rect x="42" y="374" width="124" height="44" rx="6" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
  <text x="104" y="401" fill="#81fba1" font-size="12.5" text-anchor="middle" font-weight="bold">LED verte</text>
  <text x="180" y="401" fill="#5b7bb8" font-size="12" text-anchor="start">5</text>

  <path d="M424 420 L424 468 L104 468 L104 420" stroke="#5b7bb8" stroke-width="2" fill="none"/>
  <path d="M264 468 L264 490 L56 490 L56 170 L146 170" stroke="#5b7bb8" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="264" y="512" fill="#5b7bb8" font-size="11.5" text-anchor="middle">la boucle : on retourne lire le capteur</text>

  <!-- ── légende des symboles ── -->
  <rect x="524" y="52" width="392" height="238" rx="12" fill="#0a1b3d" stroke="#274a8a" stroke-width="2"/>
  <text x="720" y="78" fill="#81aaff" font-size="13.5" font-weight="bold" text-anchor="middle">La forme dit la fonction</text>

  <rect x="552" y="98" width="96" height="34" rx="17" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
  <text x="600" y="120" fill="#61dafb" font-size="11.5" text-anchor="middle">terminal</text>
  <text x="672" y="113" fill="#e4eaf5" font-size="12">début ou fin</text>
  <text x="672" y="130" fill="#9bbefc" font-size="11">une seule fois, en haut et en bas</text>

  <rect x="552" y="152" width="96" height="34" rx="5" fill="#0d2347" stroke="#81fba1" stroke-width="2"/>
  <text x="600" y="174" fill="#81fba1" font-size="11.5" text-anchor="middle">rectangle</text>
  <text x="672" y="167" fill="#e4eaf5" font-size="12">action ou traitement</text>
  <text x="672" y="184" fill="#9bbefc" font-size="11">UNE seule sortie</text>

  <polygon points="600,206 648,230 600,254 552,230" fill="#0d2347" stroke="#c68ef2" stroke-width="2"/>
  <text x="600" y="234" fill="#c68ef2" font-size="11.5" text-anchor="middle">losange</text>
  <text x="672" y="224" fill="#e4eaf5" font-size="12">décision</text>
  <text x="672" y="241" fill="#9bbefc" font-size="11">TOUJOURS deux sorties : OUI et NON</text>

  <!-- ── le même en Python ── -->
  <rect x="524" y="306" width="392" height="232" rx="12" fill="#0a1b3d" stroke="#274a8a" stroke-width="2"/>
  <text x="720" y="332" fill="#81aaff" font-size="13.5" font-weight="bold" text-anchor="middle">Le losange, écrit en Python</text>
  <rect x="548" y="350" width="344" height="132" rx="8" fill="#08132c" stroke="#274a8a" stroke-width="2"/>
  <g font-family="monospace" font-size="14">
    <text x="570" y="378" fill="#e4eaf5">occupee = <tspan fill="#81fba1">True</tspan></text>
    <text x="570" y="402" fill="#c68ef2">if<tspan fill="#e4eaf5"> occupee:</tspan></text>
    <text x="602" y="426" fill="#e4eaf5">print(<tspan fill="#ffd66b">"ROUGE"</tspan>)</text>
    <text x="570" y="450" fill="#c68ef2">else<tspan fill="#e4eaf5">:</tspan></text>
    <text x="602" y="474" fill="#e4eaf5">print(<tspan fill="#ffd66b">"VERT"</tspan>)</text>
  </g>
  <text x="720" y="506" fill="#9bbefc" font-size="11.5" text-anchor="middle">une question, deux chemins — exactement le losange</text>
  <text x="720" y="524" fill="#5b7bb8" font-size="11" text-anchor="middle">les deux points, puis le décalage : ils disent où va chaque chemin</text>
</svg>
