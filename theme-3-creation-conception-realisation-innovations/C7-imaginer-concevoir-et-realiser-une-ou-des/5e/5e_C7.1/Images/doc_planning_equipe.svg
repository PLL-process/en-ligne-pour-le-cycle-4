<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 344" width="350" height="344" role="img" aria-labelledby="t_planning_equipe d_planning_equipe" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_planning_equipe">Le planning de l'équipe</title>
<desc id="d_planning_equipe">Le planning de l'équipe, quatre tâches dans l'ordre, chacune avec sa durée prévue et ses minutes de début et de fin, comptées depuis le début du projet. Tâche 1, le besoin : 20 minutes, de la minute 0 à la minute 20. Tâche 2, deux solutions : 25 minutes, de la minute 20 à la minute 45. Tâche 3, le matériau : 20 minutes, de la minute 45 à la minute 65. Tâche 4, le prototype : 40 minutes, de la minute 65 à la minute 105.</desc>
<rect width="350" height="344" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le planning de l'équipe</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Les quatre tâches du mini-projet,</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">dans l'ordre, avec leur durée prévue.</text>
<rect x="14.0" y="87.4" width="322.0" height="170.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">N°</text>
<text x="114.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Tâche</text>
<text x="213.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Durée</text>
<text x="292.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Minutes</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">1</text>
<text x="114.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Le besoin</text>
<text x="213.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">20 min</text>
<text x="292.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0 → 20</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">2</text>
<text x="114.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Deux solutions</text>
<text x="213.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">25 min</text>
<text x="292.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">20 → 45</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">3</text>
<text x="114.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Le matériau</text>
<text x="213.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">20 min</text>
<text x="292.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">45 → 65</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">4</text>
<text x="114.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Le prototype</text>
<text x="213.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">40 min</text>
<text x="292.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">65 → 105</text>
<text x="14.0" y="287.6" font-size="13.5" fill="#9bbefc">min : minute · « 20 → 45 » : la tâche commence à la</text>
<text x="14.0" y="305.8" font-size="13.5" fill="#9bbefc">minute 20 et finit à la minute 45, comptées depuis</text>
<text x="14.0" y="324.0" font-size="13.5" fill="#9bbefc">le début du projet.</text>
</svg>
