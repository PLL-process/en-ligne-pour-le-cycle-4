<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 522" width="350" height="522" role="img" aria-labelledby="t_releve_hall d_releve_hall" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_releve_hall">Ce que M. Alvarez a relevé</title>
<desc id="d_releve_hall">Ce que M. Alvarez, qui s'occupe du bâtiment, a relevé dans le hall : deux cents élèves entrent en huit minutes ; vingt casiers ouverts, sans porte, contre le mur ; trois chutes en un mois, sur des sacs posés par terre ; le hall est un grand espace ouvert.</desc>
<rect width="350" height="522" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Ce que M. Alvarez a relevé</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le hall de la Brooklyn Middle</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">School, le matin, avant la sonnerie.</text>
<rect x="14.0" y="87.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Les élèves</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">200 élèves entrent en 8 minutes.</text>
<rect x="14.0" y="172.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="202.4" font-size="16" fill="#61dafb" font-weight="700">Les casiers</text>
<text x="26.0" y="229.4" font-size="15" fill="#e4eaf5">20 casiers ouverts, sans porte, contre</text>
<text x="26.0" y="250.4" font-size="15" fill="#e4eaf5">le mur.</text>
<rect x="14.0" y="278.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="308.4" font-size="16" fill="#61dafb" font-weight="700">Les sacs</text>
<text x="26.0" y="335.4" font-size="15" fill="#e4eaf5">3 chutes en un mois, sur des sacs posés</text>
<text x="26.0" y="356.4" font-size="15" fill="#e4eaf5">par terre.</text>
<rect x="14.0" y="384.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="414.4" font-size="16" fill="#61dafb" font-weight="700">Le hall</text>
<text x="26.0" y="441.4" font-size="15" fill="#e4eaf5">Un grand espace ouvert.</text>
<text x="14.0" y="483.6" font-size="13.5" fill="#9bbefc">Relevé tel que M. Alvarez le donne : chaque ligne</text>
<text x="14.0" y="501.8" font-size="13.5" fill="#9bbefc">est un fait, aucune n'est un avis.</text>
</svg>
