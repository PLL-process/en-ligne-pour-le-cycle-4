<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 345" width="350" height="345" role="img" aria-labelledby="t_programme_preau d_programme_preau" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_programme_preau">Le programme de la carte</title>
<desc id="d_programme_preau">Le programme téléversé dans la carte, ligne par ligne : lumiere = analogRead(A0) ; si lumiere &lt; 300 alors ; digitalWrite(5, HAUT) ; sinon ; digitalWrite(5, BAS).</desc>
<rect width="350" height="345" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le programme de la carte</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Celui qui est téléversé dans la carte du préau.</text>
<rect x="14.0" y="69.2" width="322.0" height="153.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="99.2" font-size="16" fill="#61dafb" font-weight="700">Programme</text>
<text x="26.0" y="126.2" font-size="15" fill="#e4eaf5">lumiere = analogRead(A0)</text>
<text x="26.0" y="147.2" font-size="15" fill="#e4eaf5">si lumiere &lt; 300 alors</text>
<text x="26.0" y="168.2" font-size="15" fill="#e4eaf5">→ digitalWrite(5, HAUT)</text>
<text x="26.0" y="189.2" font-size="15" fill="#e4eaf5">sinon</text>
<text x="26.0" y="210.2" font-size="15" fill="#e4eaf5">→ digitalWrite(5, BAS)</text>
<text x="14.0" y="252.4" font-size="13.5" fill="#9bbefc">→ : ligne qui dépend de la ligne « si » ou « sinon »</text>
<text x="14.0" y="270.6" font-size="13.5" fill="#9bbefc">au-dessus · analogRead(A0) : lire le port</text>
<text x="14.0" y="288.8" font-size="13.5" fill="#9bbefc">analogique A0 · digitalWrite(5, HAUT) : mettre la</text>
<text x="14.0" y="307.0" font-size="13.5" fill="#9bbefc">sortie D5 à l'état haut, la DEL s'allume · BAS : à</text>
<text x="14.0" y="325.3" font-size="13.5" fill="#9bbefc">l'état bas, elle s'éteint.</text>
</svg>
