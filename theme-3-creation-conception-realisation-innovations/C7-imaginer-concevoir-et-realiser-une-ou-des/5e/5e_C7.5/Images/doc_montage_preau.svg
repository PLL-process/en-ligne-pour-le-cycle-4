<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 360" width="350" height="360" role="img" aria-labelledby="t_montage_preau d_montage_preau" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_montage_preau">Le prototype de l'éclairage du préau</title>
<desc id="d_montage_preau">Le prototype de l'éclairage du préau, cinq constituants. Carte Arduino UNO : sur l'établi, 45 milliampères. Base Shield V2 : sur la carte, 0 milliampères. Capteur de luminosité Grove : port A0, 3 milliampères. Module DEL Grove : port D5, 20 milliampères. Câble USB : sur la carte, il fournit jusqu'à 500 milliampères.</desc>
<rect width="350" height="360" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le prototype de l'éclairage du préau</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Les cinq constituants montés, et</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">le courant que chacun demande.</text>
<rect x="14.0" y="87.4" width="322.0" height="204.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Constituant</text>
<text x="214.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Branché sur</text>
<text x="300.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Courant</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Carte UNO</text>
<text x="214.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">sur l'établi</text>
<text x="300.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">45 mA</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">Base Shield</text>
<text x="214.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">sur la carte</text>
<text x="300.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0 mA</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Capteur de lumière</text>
<text x="214.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">A0</text>
<text x="300.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">3 mA</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Module DEL</text>
<text x="214.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">D5</text>
<text x="300.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">20 mA</text>
<line x1="14" y1="257.4" x2="336" y2="257.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="279.4" font-size="15" fill="#e4eaf5" font-weight="700">Câble USB</text>
<text x="214.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">sur la carte</text>
<text x="300.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">—</text>
<text x="14.0" y="321.6" font-size="13.5" fill="#9bbefc">mA : milliampère · le câble USB fournit jusqu'à</text>
<text x="14.0" y="339.8" font-size="13.5" fill="#9bbefc">500 mA à tout le montage.</text>
</svg>
