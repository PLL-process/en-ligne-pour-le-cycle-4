<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 435" width="350" height="435" role="img" aria-labelledby="t_conso_station d_conso_station" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_conso_station">Ce que consomme la station, un jour d'alerte</title>
<desc id="d_conso_station">Ce que consomme la station d'alerte un jour d'alerte, sous 5 volts. Carte Arduino UNO : 45 milliampères pendant 24 heures, 5,40 wattheures. Buzzer d'alerte : 30 milliampères pendant 2 heures, 0,30 wattheures. Anémomètre à impulsions : 1 milliampères pendant 24 heures, 0,12 wattheures. Girouette : 1 milliampères pendant 24 heures, 0,12 wattheures. DEL indicatrice : 10 milliampères pendant 2 heures, 0,10 wattheures. Total : 6,04 wattheures par jour. Le buzzer et la DEL ne fonctionnent qu'un jour d'alerte.</desc>
<rect width="350" height="435" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Ce que consomme la</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">station, un jour d'alerte</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Cinq composants, sous 5 V</text>
<text x="14.0" y="94.3" font-size="13.5" fill="#9bbefc">(volts), pendant 24 heures.</text>
<rect x="14.0" y="110.3" width="322.0" height="238.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700">Composant</text>
<text x="155.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Courant</text>
<text x="220.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Durée</text>
<text x="293.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Énergie</text>
<line x1="14" y1="144.3" x2="336" y2="144.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="166.3" font-size="15" fill="#e4eaf5" font-weight="700">Carte UNO</text>
<text x="155.0" y="166.3" font-size="15" fill="#e4eaf5" text-anchor="middle">45 mA</text>
<text x="220.0" y="166.3" font-size="15" fill="#e4eaf5" text-anchor="middle">24 h</text>
<text x="293.0" y="166.3" font-size="15" fill="#e4eaf5" text-anchor="middle">5,40 Wh</text>
<line x1="14" y1="178.3" x2="336" y2="178.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="200.3" font-size="15" fill="#e4eaf5" font-weight="700">Buzzer</text>
<text x="155.0" y="200.3" font-size="15" fill="#e4eaf5" text-anchor="middle">30 mA</text>
<text x="220.0" y="200.3" font-size="15" fill="#e4eaf5" text-anchor="middle">2 h</text>
<text x="293.0" y="200.3" font-size="15" fill="#e4eaf5" text-anchor="middle">0,30 Wh</text>
<line x1="14" y1="212.3" x2="336" y2="212.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="234.3" font-size="15" fill="#e4eaf5" font-weight="700">Anémomètre</text>
<text x="155.0" y="234.3" font-size="15" fill="#e4eaf5" text-anchor="middle">1 mA</text>
<text x="220.0" y="234.3" font-size="15" fill="#e4eaf5" text-anchor="middle">24 h</text>
<text x="293.0" y="234.3" font-size="15" fill="#e4eaf5" text-anchor="middle">0,12 Wh</text>
<line x1="14" y1="246.3" x2="336" y2="246.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="268.4" font-size="15" fill="#e4eaf5" font-weight="700">Girouette</text>
<text x="155.0" y="268.4" font-size="15" fill="#e4eaf5" text-anchor="middle">1 mA</text>
<text x="220.0" y="268.4" font-size="15" fill="#e4eaf5" text-anchor="middle">24 h</text>
<text x="293.0" y="268.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,12 Wh</text>
<line x1="14" y1="280.4" x2="336" y2="280.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="302.4" font-size="15" fill="#e4eaf5" font-weight="700">DEL</text>
<text x="155.0" y="302.4" font-size="15" fill="#e4eaf5" text-anchor="middle">10 mA</text>
<text x="220.0" y="302.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2 h</text>
<text x="293.0" y="302.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,10 Wh</text>
<line x1="14" y1="314.4" x2="336" y2="314.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="336.4" font-size="15" fill="#e4eaf5" font-weight="700">Total</text>
<text x="155.0" y="336.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<text x="220.0" y="336.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<text x="293.0" y="336.4" font-size="15" fill="#e4eaf5" text-anchor="middle">6,04 Wh</text>
<text x="14.0" y="378.5" font-size="13.5" fill="#9bbefc">Le buzzer et la DEL ne fonctionnent qu'un jour</text>
<text x="14.0" y="396.8" font-size="13.5" fill="#9bbefc">d'alerte · mA : milliampère · h : heure · Wh :</text>
<text x="14.0" y="415.0" font-size="13.5" fill="#9bbefc">wattheure · énergie = courant × 5 V × durée.</text>
</svg>
