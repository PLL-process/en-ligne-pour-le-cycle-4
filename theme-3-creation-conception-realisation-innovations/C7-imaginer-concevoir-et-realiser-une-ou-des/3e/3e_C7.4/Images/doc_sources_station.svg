<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 434" width="350" height="434" role="img" aria-labelledby="t_sources_station d_sources_station" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_sources_station">Les sources de la station</title>
<desc id="d_sources_station">Les sources d'énergie de la station d'alerte. Pile 9 volts alcaline : 4,95 wattheures stockés, rendement 56 pour cent, 2,8 wattheures utiles. 4 piles AA alcalines : 15,00 wattheures stockés, rendement 83 pour cent, 12,5 wattheures utiles. Accu Li-ion 18650 rechargeable : 11,10 wattheures stockés, rendement 85 pour cent, 9,4 wattheures utiles. Le panneau solaire de 1 watt crête, avec son accumulateur : 3,7 wattheures par jour en Martinique, en moyenne.</desc>
<rect width="350" height="434" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Les sources de la station</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Ce que chacune stocke, et ce qui arrive</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">vraiment au montage, sous 5 V (volts).</text>
<rect x="14.0" y="87.4" width="322.0" height="136.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Source</text>
<text x="160.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Stockée</text>
<text x="232.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Rendement</text>
<text x="302.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Utile</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Pile 9 V</text>
<text x="160.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">4,95 Wh</text>
<text x="232.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">56 %</text>
<text x="302.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2,8 Wh</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">4 piles AA</text>
<text x="160.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">15,00 Wh</text>
<text x="232.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">83 %</text>
<text x="302.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">12,5 Wh</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Accu 18650</text>
<text x="160.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">11,10 Wh</text>
<text x="232.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">85 %</text>
<text x="302.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">9,4 Wh</text>
<rect x="14.0" y="239.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="269.4" font-size="16" fill="#61dafb" font-weight="700">Panneau 1 W crête + accu</text>
<text x="26.0" y="296.4" font-size="15" fill="#e4eaf5">3,7 Wh par jour en Martinique, en</text>
<text x="26.0" y="317.4" font-size="15" fill="#e4eaf5">moyenne.</text>
<text x="14.0" y="359.6" font-size="13.5" fill="#9bbefc">Wh : wattheure · Stockée : l'énergie dans la</text>
<text x="14.0" y="377.8" font-size="13.5" fill="#9bbefc">source · Utile : ce qui arrive au montage, sous 5 V</text>
<text x="14.0" y="396.0" font-size="13.5" fill="#9bbefc">· W crête : watt crête, la puissance du panneau</text>
<text x="14.0" y="414.3" font-size="13.5" fill="#9bbefc">en plein soleil.</text>
</svg>
