<text x="231.0" y="394.3" font-size="15" fill="#e4eaf5" text-anchor="middle">5 ans</text>
<text x="301.0" y="394.3" font-size="15" fill="#e4eaf5" text-anchor="middle">5 / 5</text>
<line x1="14" y1="406.3" x2="336" y2="406.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="428.3" font-size="15" fill="#e4eaf5" font-weight="700">PVC</text>
<text x="155.0" y="428.3" font-size="15" fill="#e4eaf5" text-anchor="middle">45 MPa</text>
<text x="231.0" y="428.3" font-size="15" fill="#e4eaf5" text-anchor="middle">8 ans</text>
<text x="301.0" y="428.3" font-size="15" fill="#e4eaf5" text-anchor="middle">5 / 5</text>
<line x1="14" y1="440.3" x2="336" y2="440.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="462.3" font-size="15" fill="#e4eaf5" font-weight="700">Aluminium</text>
<text x="155.0" y="462.3" font-size="15" fill="#e4eaf5" text-anchor="middle">160 MPa</text>
<text x="231.0" y="462.3" font-size="15" fill="#e4eaf5" text-anchor="middle">25 ans</text>
<text x="301.0" y="462.3" font-size="15" fill="#e4eaf5" text-anchor="middle">4 / 5</text>
<line x1="14" y1="474.3" x2="336" y2="474.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="496.3" font-size="15" fill="#e4eaf5" font-weight="700">Inox 316</text>
<text x="155.0" y="496.3" font-size="15" fill="#e4eaf5" text-anchor="middle">250 MPa</text>
<text x="231.0" y="496.3" font-size="15" fill="#e4eaf5" text-anchor="middle">30 ans</text>
<text x="301.0" y="496.3" font-size="15" fill="#e4eaf5" text-anchor="middle">5 / 5</text>
<line x1="14" y1="508.3" x2="336" y2="508.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="530.3" font-size="15" fill="#e4eaf5" font-weight="700">PP recyclé</text>
<text x="155.0" y="530.3" font-size="15" fill="#e4eaf5" text-anchor="middle">30 MPa</text>
<text x="231.0" y="530.3" font-size="15" fill="#e4eaf5" text-anchor="middle">6 ans</text>
<text x="301.0" y="530.3" font-size="15" fill="#e4eaf5" text-anchor="middle">5 / 5</text>
<text x="14.0" y="584.6" font-size="15.5" fill="#61dafb" font-weight="700">Sa paroi, sa chaleur, sa masse</text>
<rect x="14.0" y="591.2" width="322.0" height="238.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="613.2" font-size="13.5" fill="#61dafb" font-weight="700">Matériau</text>
