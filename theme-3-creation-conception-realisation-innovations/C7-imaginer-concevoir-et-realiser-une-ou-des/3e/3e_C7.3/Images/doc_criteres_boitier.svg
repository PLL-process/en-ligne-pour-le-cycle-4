<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 971" width="350" height="971" role="img" aria-labelledby="t_criteres_boitier d_criteres_boitier" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_criteres_boitier">Six matériaux pour le boîtier</title>
<desc id="d_criteres_boitier">Le cahier des charges du boîtier de la station d'alerte : résistance d'au moins 30 mégapascals, au moins 10 ans au soleil, 5 sur 5 au sel, au plus 60 degrés au soleil, au plus 1,2 kilogramme. Puis les six matériaux candidats, avec l'épaisseur de paroi que demande chacun et la masse du boîtier qui en résulte. Le PLA : 50 mégapascals, 1 an(s) au soleil, 4 sur 5 au sel, paroi de 3,00 millimètres, 52 degrés au soleil, 0,458 kilogramme. Le PETG : 53 mégapascals, 5 an(s) au soleil, 5 sur 5 au sel, paroi de 2,91 millimètres, 54 degrés au soleil, 0,455 kilogramme. Le PVC : 45 mégapascals, 8 an(s) au soleil, 5 sur 5 au sel, paroi de 3,16 millimètres, 58 degrés au soleil, 0,545 kilogramme. L'aluminium anodisé : 160 mégapascals, 25 an(s) au soleil, 4 sur 5 au sel, paroi de 1,68 millimètres, 57 degrés au soleil, 0,557 kilogramme. L'inox 316 : 250 mégapascals, 30 an(s) au soleil, 5 sur 5 au sel, paroi de 1,34 millimètres, 59 degrés au soleil, 1,320 kilogramme. Le polypropylène recyclé : 30 mégapascals, 6 an(s) au soleil, 5 sur 5 au sel, paroi de 3,87 millimètres, 55 degrés au soleil, 0,453 kilogramme.</desc>
<rect width="350" height="971" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Six matériaux pour le boîtier</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le cahier des charges du boîtier,</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">puis ce que donne chaque matériau.</text>
<rect x="14.0" y="87.4" width="322.0" height="168.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="117.4" font-size="16" fill="#ffb454" font-weight="700">Ce que le boîtier exige</text>
<text x="26.0" y="145.4" font-size="13.5" fill="#9bbefc">Résistance</text>
<text x="26.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">au moins 30 MPa</text>
<text x="175.0" y="145.4" font-size="13.5" fill="#9bbefc">Soleil</text>
<text x="175.0" y="164.4" font-size="16" fill="#e4eaf5" font-weight="700">au moins 10 ans</text>
<text x="26.0" y="185.4" font-size="13.5" fill="#9bbefc">Sel</text>
<text x="26.0" y="204.4" font-size="16" fill="#e4eaf5" font-weight="700">au moins 5 / 5</text>
<text x="175.0" y="185.4" font-size="13.5" fill="#9bbefc">Chaleur</text>
<text x="175.0" y="204.4" font-size="16" fill="#e4eaf5" font-weight="700">au plus 60 °C</text>
<text x="26.0" y="225.4" font-size="13.5" fill="#9bbefc">Masse</text>
<text x="26.0" y="244.4" font-size="16" fill="#e4eaf5" font-weight="700">au plus 1,2 kg</text>
<text x="14.0" y="297.7" font-size="15.5" fill="#61dafb" font-weight="700">Ce que tient chaque matériau</text>
<rect x="14.0" y="304.3" width="322.0" height="238.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="326.3" font-size="13.5" fill="#61dafb" font-weight="700">Matériau</text>
<text x="155.0" y="326.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Résistance</text>
<text x="231.0" y="326.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Soleil</text>
<text x="301.0" y="326.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Sel</text>
