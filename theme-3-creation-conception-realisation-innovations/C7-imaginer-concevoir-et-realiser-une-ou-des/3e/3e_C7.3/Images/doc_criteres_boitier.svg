<text x="295.0" y="715.2" font-size="15" fill="#e4eaf5" text-anchor="middle">0,545 kg</text>
<line x1="14" y1="727.2" x2="336" y2="727.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="749.2" font-size="15" fill="#e4eaf5" font-weight="700">Aluminium</text>
<text x="151.0" y="749.2" font-size="15" fill="#e4eaf5" text-anchor="middle">1,68 mm</text>
<text x="221.0" y="749.2" font-size="15" fill="#e4eaf5" text-anchor="middle">57 °C</text>
<text x="295.0" y="749.2" font-size="15" fill="#e4eaf5" text-anchor="middle">0,557 kg</text>
<line x1="14" y1="761.2" x2="336" y2="761.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="783.2" font-size="15" fill="#e4eaf5" font-weight="700">Inox 316</text>
<text x="151.0" y="783.2" font-size="15" fill="#e4eaf5" text-anchor="middle">1,34 mm</text>
<text x="221.0" y="783.2" font-size="15" fill="#e4eaf5" text-anchor="middle">59 °C</text>
<text x="295.0" y="783.2" font-size="15" fill="#e4eaf5" text-anchor="middle">1,320 kg</text>
<line x1="14" y1="795.2" x2="336" y2="795.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="817.2" font-size="15" fill="#e4eaf5" font-weight="700">PP recyclé</text>
<text x="151.0" y="817.2" font-size="15" fill="#e4eaf5" text-anchor="middle">3,87 mm</text>
<text x="221.0" y="817.2" font-size="15" fill="#e4eaf5" text-anchor="middle">55 °C</text>
<text x="295.0" y="817.2" font-size="15" fill="#e4eaf5" text-anchor="middle">0,453 kg</text>
<text x="14.0" y="859.4" font-size="13.5" fill="#9bbefc">MPa : mégapascal (résistance) · Soleil : années</text>
<text x="14.0" y="877.7" font-size="13.5" fill="#9bbefc">avant de se dégrader · Sel : tenue à l'air marin,</text>
<text x="14.0" y="895.9" font-size="13.5" fill="#9bbefc">de 1 à 5 · Paroi : épaisseur calculée pour la même</text>
<text x="14.0" y="914.1" font-size="13.5" fill="#9bbefc">rigidité · Chaleur : température du boîtier au</text>
<text x="14.0" y="932.3" font-size="13.5" fill="#9bbefc">soleil · kg : kilogramme · PLA, PETG, PVC, PP : des</text>
<text x="14.0" y="950.6" font-size="13.5" fill="#9bbefc">plastiques.</text>
</svg>
