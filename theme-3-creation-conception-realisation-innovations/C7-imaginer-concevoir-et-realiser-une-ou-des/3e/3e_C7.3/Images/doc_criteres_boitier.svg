<text x="231.0" y="360.3" font-size="15" fill="#e4eaf5" text-anchor="middle">1 an</text>
<text x="301.0" y="360.3" font-size="15" fill="#e4eaf5" text-anchor="middle">4 / 5</text>
<line x1="14" y1="372.3" x2="336" y2="372.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="394.3" font-size="15" fill="#e4eaf5" font-weight="700">PETG</text>
