<text x="221.0" y="613.2" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Chaleur</text>
<text x="295.0" y="613.2" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Masse</text>
<line x1="14" y1="625.2" x2="336" y2="625.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="647.2" font-size="15" fill="#e4eaf5" font-weight="700">PLA</text>
<text x="151.0" y="647.2" font-size="15" fill="#e4eaf5" text-anchor="middle">3,00 mm</text>
<text x="221.0" y="647.2" font-size="15" fill="#e4eaf5" text-anchor="middle">52 °C</text>
<text x="295.0" y="647.2" font-size="15" fill="#e4eaf5" text-anchor="middle">0,458 kg</text>
<line x1="14" y1="659.2" x2="336" y2="659.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="681.2" font-size="15" fill="#e4eaf5" font-weight="700">PETG</text>
<text x="151.0" y="681.2" font-size="15" fill="#e4eaf5" text-anchor="middle">2,91 mm</text>
<text x="221.0" y="681.2" font-size="15" fill="#e4eaf5" text-anchor="middle">54 °C</text>
<text x="295.0" y="681.2" font-size="15" fill="#e4eaf5" text-anchor="middle">0,455 kg</text>
<line x1="14" y1="693.2" x2="336" y2="693.2" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="715.2" font-size="15" fill="#e4eaf5" font-weight="700">PVC</text>
<text x="151.0" y="715.2" font-size="15" fill="#e4eaf5" text-anchor="middle">3,16 mm</text>
