<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 450" width="350" height="450" role="img" aria-labelledby="t_protocole_seuil d_protocole_seuil" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_protocole_seuil">Le protocole d'essai du capteur</title>
<desc id="d_protocole_seuil">Le protocole d'essai du capteur de confort. La règle : alerte si la température est strictement supérieure à 28 degrés Celsius. Quatre scénarios, dans l'ordre, avec leur température : Salle fraîche : 22 degrés. Seuil exact : 28 degrés. Surchauffe : 32 degrés. Retour au frais : 24 degrés. Le tableau a quatre colonnes, dans cet ordre : scénario, température, prédiction, observé ; les deux dernières sont vides.</desc>
<rect width="350" height="450" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le protocole d'essai du capteur</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Quatre scénarios, joués au</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">simulateur, dans cet ordre.</text>
<rect x="14.0" y="87.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="117.4" font-size="16" fill="#ffb454" font-weight="700">La règle du capteur</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">Alerte si T est strictement supérieure à</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">28 °C.</text>
<rect x="14.0" y="193.4" width="322.0" height="170.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="215.4" font-size="13.5" fill="#61dafb" font-weight="700">Scénario</text>
<text x="157.0" y="215.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">T</text>
<text x="222.0" y="215.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Prédiction</text>
<text x="299.0" y="215.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Observé</text>
<line x1="14" y1="227.4" x2="336" y2="227.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="249.4" font-size="15" fill="#e4eaf5" font-weight="700">Salle fraîche</text>
<text x="157.0" y="249.4" font-size="15" fill="#e4eaf5" text-anchor="middle">22 °C</text>
<text x="222.0" y="249.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<text x="299.0" y="249.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<line x1="14" y1="261.4" x2="336" y2="261.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="283.4" font-size="15" fill="#e4eaf5" font-weight="700">Seuil exact</text>
<text x="157.0" y="283.4" font-size="15" fill="#e4eaf5" text-anchor="middle">28 °C</text>
<text x="222.0" y="283.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<text x="299.0" y="283.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<line x1="14" y1="295.4" x2="336" y2="295.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="317.4" font-size="15" fill="#e4eaf5" font-weight="700">Surchauffe</text>
<text x="157.0" y="317.4" font-size="15" fill="#e4eaf5" text-anchor="middle">32 °C</text>
<text x="222.0" y="317.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<text x="299.0" y="317.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<line x1="14" y1="329.4" x2="336" y2="329.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="351.4" font-size="15" fill="#e4eaf5" font-weight="700">Retour au frais</text>
<text x="157.0" y="351.4" font-size="15" fill="#e4eaf5" text-anchor="middle">24 °C</text>
<text x="222.0" y="351.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<text x="299.0" y="351.4" font-size="15" fill="#e4eaf5" text-anchor="middle"></text>
<text x="14.0" y="393.6" font-size="13.5" fill="#9bbefc">T : la température de la salle · °C : degré Celsius</text>
<text x="14.0" y="411.8" font-size="13.5" fill="#9bbefc">· les deux dernières colonnes se remplissent</text>
<text x="14.0" y="430.0" font-size="13.5" fill="#9bbefc">pendant l'essai.</text>
</svg>
