<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Pourquoi la LED clignote sur le seuil, et comment l'hystérésis l'en empêche</title>
  <desc id="d">Un graphique de la température de la salle en fonction du temps. La courbe monte lentement de 27,2 à 29,8 degrés, avec de petites oscillations dues au bruit de mesure, et reste longtemps juste autour de 28 degrés. Une ligne horizontale marque le seuil unique de 28 degrés. Sous le graphique, deux pistes montrent l'état de la LED. Première piste, avec un seuil unique à 28 : la LED bascule 31 fois, car chaque oscillation de la mesure fait repasser la valeur d'un côté puis de l'autre du seuil ; c'est le clignotement. Deuxième piste, avec deux seuils, allumer au-dessus de 29 et éteindre en dessous de 27 : la LED ne bascule qu'une seule fois, quand la salle chauffe vraiment. Entre 27 et 29 se trouve une zone morte où l'état ne change pas. Conclusion écrite en bas : l'écart entre les deux seuils doit être plus grand que le bruit de la mesure.</desc>
  <rect width="940" height="540" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Sur le seuil, c'est le bruit de mesure qui décide — sauf si on l'en empêche</text>

  <rect x="30" y="52" width="880" height="222" rx="12" fill="#0a1b3d" stroke="#274a8a" stroke-width="2"/>
