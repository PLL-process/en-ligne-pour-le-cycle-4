<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">L'algorigramme de l'alerte de surchauffe, et le piège du cas frontière</title>
  <desc id="d">À gauche, l'algorigramme de l'alerte lu de haut en bas. Bloc 1, terminal arrondi : DÉBUT, au démarrage du capteur. Bloc 2, rectangle : mesurer la température T de la salle. Bloc 3, losange : T strictement supérieur à 28, point d'interrogation, avec deux sorties. Sortie OUI, bloc 4, rectangle : allumer la LED d'alerte. Sortie NON, bloc 5, rectangle : éteindre la LED. Les deux chemins se rejoignent et une flèche remonte vers le bloc 2 : le capteur surveille en continu. À droite, un tableau de quatre scénarios avec la température, le comportement attendu et l'observation : 22 degrés, éteint ; 28 degrés exactement, éteint, car 28 n'est pas strictement supérieur à 28, c'est le cas frontière ; 32 degrés, allumé ; retour à 24 degrés, éteint. En dessous, l'avertissement : remplacer le signe strictement supérieur par supérieur ou égal changerait le comportement au seuil exact, et seul le cas frontière permettrait de s'en apercevoir.</desc>
  <rect width="940" height="520" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">L'alerte de surchauffe : le schéma, et le scénario qui compte le plus</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#61dafb"/></marker></defs>

  <rect x="24" y="52" width="452" height="446" rx="12" fill="#0a1b3d" stroke="#274a8a" stroke-width="2"/>

  <rect x="170" y="74" width="160" height="42" rx="21" fill="#0d2347" stroke="#61dafb" stroke-width="2.5"/>
  <text x="250" y="100" fill="#61dafb" font-size="13" text-anchor="middle" font-weight="bold">DÉBUT</text>
  <text x="250" y="134" fill="#5b7bb8" font-size="11" text-anchor="middle">1</text>
  <path d="M250 116 L250 142" stroke="#61dafb" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="128" y="144" width="244" height="44" rx="6" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
  <text x="250" y="171" fill="#e4eaf5" font-size="12.5" text-anchor="middle">Mesurer la température T</text>
  <text x="250" y="206" fill="#5b7bb8" font-size="11" text-anchor="middle">2</text>
  <path d="M250 190 L250 216" stroke="#61dafb" stroke-width="2.5" marker-end="url(#a)"/>

  <polygon points="250,218 366,272 250,326 134,272" fill="#0d2347" stroke="#c68ef2" stroke-width="2.5"/>
  <text x="250" y="270" fill="#c68ef2" font-size="13" text-anchor="middle" font-weight="bold">T &gt; 28 ?</text>
  <text x="250" y="290" fill="#9bbefc" font-size="10.5" text-anchor="middle">strictement</text>
  <text x="250" y="240" fill="#5b7bb8" font-size="11" text-anchor="middle">3</text>

  <path d="M366 272 L410 272 L410 356" stroke="#61dafb" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="388" y="262" fill="#ff7b88" font-size="12" text-anchor="middle">OUI</text>
  <path d="M134 272 L90 272 L90 356" stroke="#61dafb" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="112" y="262" fill="#81fba1" font-size="12" text-anchor="middle">NON</text>

  <rect x="330" y="358" width="132" height="44" rx="6" fill="#0d2347" stroke="#ff7b88" stroke-width="2.5"/>
  <text x="396" y="385" fill="#ff7b88" font-size="12.5" text-anchor="middle" font-weight="bold">LED allumée</text>
  <text x="470" y="382" fill="#5b7bb8" font-size="11" text-anchor="middle">4</text>

  <rect x="38" y="358" width="132" height="44" rx="6" fill="#0d2347" stroke="#81fba1" stroke-width="2.5"/>
  <text x="104" y="385" fill="#81fba1" font-size="12.5" text-anchor="middle" font-weight="bold">LED éteinte</text>
  <text x="30" y="382" fill="#5b7bb8" font-size="11" text-anchor="middle">5</text>

  <path d="M396 404 L396 434 L104 434 L104 404" stroke="#5b7bb8" stroke-width="2" fill="none"/>
  <path d="M250 434 L250 456 L56 456 L56 166 L124 166" stroke="#5b7bb8" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="272" y="478" fill="#5b7bb8" font-size="11.5" text-anchor="middle">la boucle : on retourne mesurer — surveillance continue</text>

  <!-- tableau des scénarios -->
  <rect x="496" y="52" width="420" height="300" rx="12" fill="#0a1b3d" stroke="#274a8a" stroke-width="2"/>
  <text x="706" y="78" fill="#81aaff" font-size="13.5" font-weight="bold" text-anchor="middle">Les quatre scénarios du banc d'essai</text>

  <rect x="516" y="94" width="380" height="30" rx="6" fill="#173666"/>
  <text x="576" y="114" fill="#9bbefc" font-size="11.5" text-anchor="middle">scénario</text>
  <text x="716" y="114" fill="#9bbefc" font-size="11.5" text-anchor="middle">T (°C)</text>
  <text x="846" y="114" fill="#9bbefc" font-size="11.5" text-anchor="middle">alerte</text>

  <text x="576" y="150" fill="#e4eaf5" font-size="11.5" text-anchor="middle">salle fraîche</text>
  <text x="716" y="150" fill="#e4eaf5" font-size="12" text-anchor="middle" font-family="monospace">22</text>
  <text x="846" y="150" fill="#81fba1" font-size="11.5" text-anchor="middle">éteinte</text>
  <line x1="516" y1="162" x2="896" y2="162" stroke="#274a8a"/>

  <rect x="516" y="166" width="380" height="52" rx="6" fill="#1a1230" stroke="#c68ef2" stroke-width="2"/>
  <text x="576" y="188" fill="#c68ef2" font-size="11.5" text-anchor="middle" font-weight="bold">seuil exact</text>
  <text x="576" y="205" fill="#9bbefc" font-size="10" text-anchor="middle">le cas frontière</text>
  <text x="716" y="197" fill="#c68ef2" font-size="12" text-anchor="middle" font-family="monospace">28</text>
  <text x="846" y="190" fill="#81fba1" font-size="11.5" text-anchor="middle">éteinte</text>
  <text x="846" y="207" fill="#9bbefc" font-size="10" text-anchor="middle">28 &gt; 28 est faux</text>

  <text x="576" y="246" fill="#e4eaf5" font-size="11.5" text-anchor="middle">surchauffe</text>
  <text x="716" y="246" fill="#e4eaf5" font-size="12" text-anchor="middle" font-family="monospace">32</text>
  <text x="846" y="246" fill="#ff7b88" font-size="11.5" text-anchor="middle">allumée</text>
  <line x1="516" y1="258" x2="896" y2="258" stroke="#274a8a"/>

  <text x="576" y="286" fill="#e4eaf5" font-size="11.5" text-anchor="middle">retour au frais</text>
  <text x="716" y="286" fill="#e4eaf5" font-size="12" text-anchor="middle" font-family="monospace">24</text>
  <text x="846" y="286" fill="#81fba1" font-size="11.5" text-anchor="middle">éteinte</text>
  <line x1="516" y1="298" x2="896" y2="298" stroke="#274a8a"/>
  <text x="706" y="326" fill="#81fba1" font-size="12.5" text-anchor="middle" font-weight="bold">Conforme partout → décision : VALIDÉE</text>

  <rect x="496" y="368" width="420" height="130" rx="12" fill="#1a1230" stroke="#ffd66b" stroke-width="2"/>
  <text x="706" y="394" fill="#ffd66b" font-size="13" font-weight="bold" text-anchor="middle">Le piège d'un seul caractère</text>
  <text x="706" y="422" fill="#e4eaf5" font-size="12" text-anchor="middle" font-family="monospace">T &gt; 28   au lieu de   T &gt;= 28</text>
  <text x="706" y="450" fill="#e4eaf5" font-size="11.5" text-anchor="middle">Les scénarios à 22, 32 et 24 donnent le MÊME résultat</text>
  <text x="706" y="468" fill="#e4eaf5" font-size="11.5" text-anchor="middle">dans les deux cas. Seul le scénario à 28 les sépare.</text>
  <text x="706" y="490" fill="#ffd66b" font-size="11.5" text-anchor="middle" font-weight="bold">Sans cas frontière, l'erreur passe inaperçue.</text>
</svg>
