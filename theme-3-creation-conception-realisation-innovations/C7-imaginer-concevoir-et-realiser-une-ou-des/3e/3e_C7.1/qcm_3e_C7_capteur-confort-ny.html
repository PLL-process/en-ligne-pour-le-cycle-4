<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM — Capteur confort 3e NY</title>
<style>
:root{--bg:#050f24;--panel:#0d2347;--border:#274a8a;--text:#e4eaf5;--accent:#61dafb;--ok:#81fba1;--err:#ff7b88}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;margin:0;padding:14px;line-height:1.45}
.container{max-width:820px;margin:0 auto}h1{color:var(--accent);text-align:center;font-size:1.25em}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin:10px 0}
.progress{height:8px;background:#0a1b3d;border-radius:4px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#61dafb,#c68ef2);width:0%}
.btn{background:#1d4e89;color:#fff;border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;margin:3px}
.q{display:none}.q.active{display:block}.options label{display:block;padding:7px 10px;margin:4px 0;background:#0a1b3d;border-radius:8px;cursor:pointer}
.feedback{margin-top:8px;padding:8px;border-radius:8px;display:none}.feedback.show{display:block}.feedback.ok{background:rgba(129,251,161,.12)}.feedback.err{background:rgba(255,123,136,.12)}
#navharm{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0}#navharm a{padding:5px 11px;border:1.5px solid #b9cbe4;border-radius:999px;background:#f0f7ff;color:#1d4e89;font-size:.88em;text-decoration:none;line-height:1.2}#navharm a:hover{border-color:#1d4e89}@media print{#navharm{display:none}}</style>
</head>
<body>
<nav id="navharm" aria-label="Navigation du site">
  <a href="../../../../index.html">&#8962; Accueil</a>
  <a href="sequence_3e_C7_capteur-confort-ny.html">&#8592; La séquence</a>
</nav>

<div class="container">
<h1>🧠 QCM — Capteur de confort scolaire (3e)</h1>
<p style="text-align:center;color:#9bbefc">C7 · C8 · CRCN 3.4 / 1.3 / 5.1 · New York · 26 questions</p>
<div class="card"><span id="answered">0</span>/26 · Score <span id="score">0</span> · /20 <span id="note">—</span>
<div class="progress"><div class="bar" id="bar"></div></div></div>
<div id="questions"></div>
<div class="card">
<button class="btn" onclick="prevQ()">←</button>
<button class="btn" onclick="nextUnanswered()">Non répondue</button>
<button class="btn" onclick="nextQ()">→</button>
<button class="btn" onclick="showResult()">Bilan</button>
</div>
<div class="card" id="result" style="display:none">
<div id="finalScore" style="text-align:center;font-size:1.15em"></div>
<p id="bilan"></p>
<button class="btn" onclick="retryErrors()">Erreurs</button>
<a class="btn" href="sequence_3e_C7_capteur-confort-ny.html">← Séquence</a>
</div>
</div>
<script>
const questions=[
{q:"Une compétence CRCN doit toujours inclure :",opts:["Rien d'écrit","Seulement le nom de l'outil","Compétence + niveau + repère + action observable + trace","Un logo PIX"],ok:2,exp:"Règle d'or n°7 : pas de CRCN décoratif."},
{q:"CRCN 3.4 Programmer — repère niveau 2 :",opts:["Réaliser un programme simple","Gérer un cloud d'entreprise","Imprimer en 3D","Allumer un PC"],ok:0,exp:"Repère PIX / CRCN : réaliser un programme simple."},
{q:"Trace acceptable pour CRCN 3.4 dans cette séquence :",opts:["Un like","Ouvrir Scratch sans produire","Avoir regardé un tutoriel","Pseudo-code + tableau de tests renseigné"],ok:3,exp:"Trace = production observable."},
{q:"Par quoi commence la conception (C7) ?",opts:["Fabriquer tout de suite","Clarifier le besoin","Choisir la couleur de la LED","Ignorer le climat"],ok:1,exp:"Besoin d'abord."},
{q:"Pourquoi deux solutions ?",opts:["Comparer et choisir avec des critères","Interdit d'en faire une","Décorer","Perdre du temps"],ok:0,exp:"Choix justifié."},
{q:"Valider (C8) exige :",opts:["Rien","Un seul essai sans noter","Dire que c'est joli","Protocole avec résultats attendus et observés"],ok:3,exp:"Test = preuve."},
{q:"Îlot de chaleur à New York justifie :",opts:["Rien","Un seuil de confort et une alerte en salle exposée","Supprimer les fenêtres","Interdire les LED"],ok:1,exp:"Ancrage territorial réel."},
{q:"SI T > 28 ALORS alerte ; T = 22 →",opts:["Indéterminé sans SINON explicite souvent OFF","Alerte ON","Alerte OFF","Court-circuit"],ok:2,exp:"Condition fausse → pas d'alerte."},
{q:"LED qui clignote près du seuil :",opts:["Preuve que le gel est parfait","Rien à faire","Succès","Souvent seuil unique trop sensible → hystérésis"],ok:3,exp:"Mise au point classique."},
{q:"CRCN 1.3 dans le protocole de test :",opts:["Aucun lien","Saisir et exploiter des données (T, attendu, observé)","Uniquement dessiner","Envoyer un SMS"],ok:1,exp:"Traiter des données."},
{q:"CRCN 5.1 face à LED éteinte alors T=33 :",opts:["Hypothèse de cause + test discriminant","Valider quand même","Changer d'école","Abandonner"],ok:0,exp:"Résoudre un problème technique simple."},
{q:"« Utiliser un ordinateur » est :",opts:["Interdit","Une compétence CRCN complète","Insuffisant / décoratif sans action ni trace","Le niveau 5 obligatoire"],ok:2,exp:"Règle 7."},
{q:"Versions A/B/C :",opts:["Trois notes","Matériel TBT / simulation / papier","Trois langues","Trois professeurs"],ok:1,exp:"Différenciation."},
{q:"Sécurité collège :",opts:["Outils sans consigne","Secteur 230 V","Très basse tension ou simulation","Rien"],ok:2,exp:"TBT uniquement."},
{q:"Production évaluable C7 :",opts:["2 solutions + choix justifié","Écouter seulement","Photo du mur","Silence"],ok:0,exp:"Preuve écrite."},
{q:"Sans résultat attendu écrit :",opts:["C'est mieux","Inutile","On valide","On ne peut pas juger objectivement"],ok:3,exp:"Protocole incomplet."},
{q:"Réinvestir sur un seuil d'humidité :",opts:["Abandonner","Impossible","Transfert de la même structure SI","Changer de matière"],ok:2,exp:"Transfert."},
{q:"Niveau PIX global attendu en 3e (BO 2026) :",opts:["Niveau 8 obligatoire partout","Aucun","Niveau 0","Niveau 3"],ok:3,exp:"Cahier PIX : niveau 3 en 3e."},
{q:"Hystérésis 27/29 sert à :",opts:["Rien","Stabiliser l'alerte autour du seuil","Arroser","Mesurer une seule fois"],ok:1,exp:"Mise au point."},
{q:"Le bouton QCM dans la séquence :",opts:["Une seule fois (bloc Prêt·e)","Jamais","À chaque ligne","Dix fois"],ok:0,exp:"Règle d'or n°4."},
{q:"Ancrage New York dans le projet :",opts:["Contrainte réelle (îlot de chaleur / salles chaudes)","Interdit","Sans lien avec C7","Décoratif seulement"],ok:0,exp:"Situation déclenchante ancrée."},
{q:"Trace CRCN ≠",opts:["Fiche diagnostic","Tableau de tests","Avoir ouvert le navigateur","Pseudo-code"],ok:2,exp:"Ouvrir ≠ produire."},
{q:"C7 → C8 sur ce projet :",opts:["Valider sans idée","Programmer sans besoin","Aucun ordre","Concevoir puis valider"],ok:3,exp:"Chaîne Thème 3."},
{q:"3e_C9.1 existant dans le dépôt :",opts:["À écraser","Ressource complémentaire (non modifiée ici)","Inutile","Interdit de le citer"],ok:1,exp:"Gouvernance : ne pas écraser l'existant."},
{q:"Critère de réussite minimal du lot :",opts:["Aucun fichier","Séquence + QCM + traces CRCN explicites","Une image seule","Un README vide"],ok:1,exp:"Lot indivisible."},
{q:"Objectif final :",opts:["Solution conçue et validée pour alerte de confort scolaire NY","Ignorer les tests","Remplacer le professeur","Décorer"],ok:0,exp:"Projet complet C7-C8."}
];
let current=0,answers={};
try{answers=JSON.parse(localStorage.getItem('t3e_cc_q')||'{}')}catch(e){}
function render(){
 var c=document.getElementById('questions');c.innerHTML='';
 questions.forEach(function(qu,i){
  var d=document.createElement('div');d.className='card q'+(i===current?' active':'');
  d.innerHTML='<h3>Q'+(i+1)+'/26</h3><p>'+qu.q+'</p><div class="options">'+qu.opts.map(function(o,j){return '<label><input type="radio" name="q'+i+'" value="'+j+'" '+(answers[i]===j?'checked':'')+' onchange="answer('+i+','+j+')"> '+o+'</label>'}).join('')+'</div><div class="feedback" id="fb'+i+'"></div><button class="btn" onclick="showCorr('+i+')">Correction</button>';
  c.appendChild(d);
 });
 updateStats();
}
function answer(i,j){answers[i]=j;localStorage.setItem('t3e_cc_q',JSON.stringify(answers));updateStats()}
function showCorr(i){var fb=document.getElementById('fb'+i),ok=answers[i]===questions[i].ok;fb.className='feedback show '+(ok?'ok':'err');fb.innerHTML=(ok?'✅ ':'❌ <strong>'+questions[i].opts[questions[i].ok]+'</strong><br>')+questions[i].exp}
function updateStats(){var a=Object.keys(answers).length,c=Object.entries(answers).filter(function(e){return +e[1]===questions[e[0]].ok}).length;answered.textContent=a;score.textContent=c;note.textContent=a?((c/26*20).toFixed(1)):'—';bar.style.width=(a/26*100)+'%'}
function nextQ(){if(current<25){current++;render()}}function prevQ(){if(current>0){current--;render()}}
function nextUnanswered(){for(var i=0;i<26;i++)if(answers[i]===undefined){current=i;render();return}showResult()}
function showResult(){result.style.display='block';var c=Object.entries(answers).filter(function(e){return +e[1]===questions[e[0]].ok}).length;finalScore.textContent=c+'/26 — '+(c/26*20).toFixed(1)+'/20';bilan.textContent=c>=20?'Excellent (CRCN compris).':c>=14?'Revois règle 7 et protocoles.':'Relis la séquence CRCN.'}
function retryErrors(){var e=Object.entries(answers).filter(function(x){return +x[1]!==questions[x[0]].ok}).map(function(x){return +x[0]});if(!e.length){alert('Aucune erreur');return}current=e[0];render();result.style.display='none'}
render();
</script>
</body>
</html>
