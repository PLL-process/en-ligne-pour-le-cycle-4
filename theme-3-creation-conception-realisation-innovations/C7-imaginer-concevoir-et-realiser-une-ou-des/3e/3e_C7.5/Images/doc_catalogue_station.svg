<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 584" width="350" height="584" role="img" aria-labelledby="t_catalogue_station d_catalogue_station" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_catalogue_station">Le carton de la station</title>
<desc id="d_catalogue_station">Le catalogue des constituants proposés pour la station d'alerte, avec le courant que demande chacun. Carte UNO : 45 milliampères. Base Shield : 0 milliampères. Anémomètre : 15 milliampères. Capteur de pluie : 8 milliampères. Écran LCD : 20 milliampères. Bandeau de 8 DEL : 480 milliampères. Buzzer : 30 milliampères. Module carte SD : 40 milliampères. Le câble USB fournit jusqu'à 500 milliampères ; la batterie 5 volts et son panneau solaire, jusqu'à 2 000 milliampères.</desc>
<rect width="350" height="584" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le carton de la station</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Les constituants proposés, et</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">le courant que demande chacun.</text>
<rect x="14.0" y="87.4" width="322.0" height="306.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Constituant</text>
<text x="284.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Demande</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">Carte UNO</text>
<text x="284.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">45 mA</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">Base Shield</text>
<text x="284.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0 mA</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">Anémomètre</text>
<text x="284.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">15 mA</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">Capteur de pluie</text>
<text x="284.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">8 mA</text>
<line x1="14" y1="257.4" x2="336" y2="257.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="279.4" font-size="15" fill="#e4eaf5" font-weight="700">Écran LCD</text>
<text x="284.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">20 mA</text>
<line x1="14" y1="291.4" x2="336" y2="291.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="313.4" font-size="15" fill="#e4eaf5" font-weight="700">Bandeau de 8 DEL</text>
<text x="284.0" y="313.4" font-size="15" fill="#e4eaf5" text-anchor="middle">480 mA</text>
<line x1="14" y1="325.4" x2="336" y2="325.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="347.4" font-size="15" fill="#e4eaf5" font-weight="700">Buzzer</text>
<text x="284.0" y="347.4" font-size="15" fill="#e4eaf5" text-anchor="middle">30 mA</text>
<line x1="14" y1="359.4" x2="336" y2="359.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="381.4" font-size="15" fill="#e4eaf5" font-weight="700">Module carte SD</text>
<text x="284.0" y="381.4" font-size="15" fill="#e4eaf5" text-anchor="middle">40 mA</text>
<rect x="14.0" y="409.4" width="322.0" height="88.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="439.4" font-size="16" fill="#ffb454" font-weight="700">Ce que fournissent les sources</text>
<text x="26.0" y="467.4" font-size="13.5" fill="#9bbefc">Câble USB</text>
<text x="26.0" y="486.4" font-size="16" fill="#e4eaf5" font-weight="700">jusqu'à 500 mA</text>
<text x="175.0" y="467.4" font-size="13.5" fill="#9bbefc">Batterie + panneau</text>
<text x="175.0" y="486.4" font-size="16" fill="#e4eaf5" font-weight="700">jusqu'à 2 000 mA</text>
<text x="14.0" y="527.6" font-size="13.5" fill="#9bbefc">mA : milliampère · la batterie est une très basse</text>
<text x="14.0" y="545.8" font-size="13.5" fill="#9bbefc">tension, 5 V (volts) · SD : la carte mémoire · DEL :</text>
<text x="14.0" y="564.0" font-size="13.5" fill="#9bbefc">diode électroluminescente.</text>
</svg>
