<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 366" width="350" height="366" role="img" aria-labelledby="t_programme_station d_programme_station" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_programme_station">Le programme de la station</title>
<desc id="d_programme_station">Le programme téléversé dans la carte de la station, ligne par ligne : vent = analogRead(A0) ; enregistrer(vent, heure) ; si vent &gt; 90 alors ; digitalWrite(6, HAUT) ; sinon ; digitalWrite(6, BAS).</desc>
<rect width="350" height="366" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le programme de la station</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Celui qui est téléversé dans la carte.</text>
<rect x="14.0" y="69.2" width="322.0" height="174.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="99.2" font-size="16" fill="#61dafb" font-weight="700">Programme</text>
<text x="26.0" y="126.2" font-size="15" fill="#e4eaf5">vent = analogRead(A0)</text>
<text x="26.0" y="147.2" font-size="15" fill="#e4eaf5">enregistrer(vent, heure)</text>
<text x="26.0" y="168.2" font-size="15" fill="#e4eaf5">si vent &gt; 90 alors</text>
<text x="26.0" y="189.2" font-size="15" fill="#e4eaf5">→ digitalWrite(6, HAUT)</text>
<text x="26.0" y="210.2" font-size="15" fill="#e4eaf5">sinon</text>
<text x="26.0" y="231.2" font-size="15" fill="#e4eaf5">→ digitalWrite(6, BAS)</text>
<text x="14.0" y="273.4" font-size="13.5" fill="#9bbefc">→ : ligne qui dépend du « si » ou du « sinon »</text>
<text x="14.0" y="291.6" font-size="13.5" fill="#9bbefc">au-dessus · analogRead(A0) : lire le port</text>
<text x="14.0" y="309.8" font-size="13.5" fill="#9bbefc">analogique A0 · enregistrer : écrire sur la carte</text>
<text x="14.0" y="328.0" font-size="13.5" fill="#9bbefc">SD · digitalWrite(6, HAUT) : mettre la sortie D6 à</text>
<text x="14.0" y="346.3" font-size="13.5" fill="#9bbefc">l'état haut, le bandeau passe au rouge.</text>
</svg>
