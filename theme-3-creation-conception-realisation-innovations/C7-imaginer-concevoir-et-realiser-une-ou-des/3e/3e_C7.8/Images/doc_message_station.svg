<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 757" width="350" height="757" role="img" aria-labelledby="t_message_station d_message_station" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_message_station">Ce qu'une station pourrait envoyer</title>
<desc id="d_message_station">Les 8 champs qu'un message d'une station d'alerte pourrait porter, chacun avec une valeur d'exemple et ce qu'il dit. id, exemple robert : l'identifiant de la station qui parle. v, exemple 124 : la vitesse du vent mesurée. u, exemple km/h : l'unité de cette vitesse. t, exemple 14:07 : l'heure de la mesure. niv, exemple 2 : le niveau d'alerte que CETTE station a calculé. seq, exemple 417 : le numéro d'ordre du message. hist, exemple …2 000 valeurs… : les 2 000 mesures des dernières 24 heures. cle, exemple Cle-Wifi-Mairie : la clé du réseau, « pour que l'autre se connecte ».</desc>
<rect width="350" height="757" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Ce qu'une station pourrait envoyer</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Les 8 champs possibles d'un</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">message, avec une valeur d'exemple.</text>
<rect x="14.0" y="87.4" width="322.0" height="306.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700">Champ</text>
<text x="223.0" y="109.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Exemple</text>
<line x1="14" y1="121.4" x2="336" y2="121.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="143.4" font-size="15" fill="#e4eaf5" font-weight="700">id</text>
<text x="223.0" y="143.4" font-size="15" fill="#e4eaf5" text-anchor="middle">robert</text>
<line x1="14" y1="155.4" x2="336" y2="155.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="177.4" font-size="15" fill="#e4eaf5" font-weight="700">v</text>
<text x="223.0" y="177.4" font-size="15" fill="#e4eaf5" text-anchor="middle">124</text>
<line x1="14" y1="189.4" x2="336" y2="189.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="211.4" font-size="15" fill="#e4eaf5" font-weight="700">u</text>
<text x="223.0" y="211.4" font-size="15" fill="#e4eaf5" text-anchor="middle">km/h</text>
<line x1="14" y1="223.4" x2="336" y2="223.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="245.4" font-size="15" fill="#e4eaf5" font-weight="700">t</text>
<text x="223.0" y="245.4" font-size="15" fill="#e4eaf5" text-anchor="middle">14:07</text>
<line x1="14" y1="257.4" x2="336" y2="257.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="279.4" font-size="15" fill="#e4eaf5" font-weight="700">niv</text>
<text x="223.0" y="279.4" font-size="15" fill="#e4eaf5" text-anchor="middle">2</text>
<line x1="14" y1="291.4" x2="336" y2="291.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="313.4" font-size="15" fill="#e4eaf5" font-weight="700">seq</text>
<text x="223.0" y="313.4" font-size="15" fill="#e4eaf5" text-anchor="middle">417</text>
<line x1="14" y1="325.4" x2="336" y2="325.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="347.4" font-size="15" fill="#e4eaf5" font-weight="700">hist</text>
<text x="223.0" y="347.4" font-size="15" fill="#e4eaf5" text-anchor="middle">…2 000 valeurs…</text>
<line x1="14" y1="359.4" x2="336" y2="359.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="381.4" font-size="15" fill="#e4eaf5" font-weight="700">cle</text>
<text x="223.0" y="381.4" font-size="15" fill="#e4eaf5" text-anchor="middle">Cle-Wifi-Mairie</text>
<rect x="14.0" y="409.4" width="322.0" height="279.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="439.4" font-size="16" fill="#61dafb" font-weight="700">Ce que dit chaque champ</text>
<text x="26.0" y="466.4" font-size="15" fill="#e4eaf5">id : l'identifiant de la station qui parle.</text>
<text x="26.0" y="487.4" font-size="15" fill="#e4eaf5">v : la vitesse du vent mesurée.</text>
<text x="26.0" y="508.4" font-size="15" fill="#e4eaf5">u : l'unité de cette vitesse.</text>
<text x="26.0" y="529.4" font-size="15" fill="#e4eaf5">t : l'heure de la mesure.</text>
<text x="26.0" y="550.4" font-size="15" fill="#e4eaf5">niv : le niveau d'alerte que CETTE station</text>
<text x="26.0" y="571.4" font-size="15" fill="#e4eaf5">a calculé.</text>
<text x="26.0" y="592.4" font-size="15" fill="#e4eaf5">seq : le numéro d'ordre du message.</text>
<text x="26.0" y="613.4" font-size="15" fill="#e4eaf5">hist : les 2 000 mesures des dernières</text>
<text x="26.0" y="634.4" font-size="15" fill="#e4eaf5">24 heures.</text>
<text x="26.0" y="655.4" font-size="15" fill="#e4eaf5">cle : la clé du réseau, « pour que l'autre</text>
<text x="26.0" y="676.4" font-size="15" fill="#e4eaf5">se connecte ».</text>
<text x="14.0" y="718.6" font-size="13.5" fill="#9bbefc">Le document ne dit pas lesquels envoyer : c'est la</text>
<text x="14.0" y="736.8" font-size="13.5" fill="#9bbefc">question · km/h : kilomètre par heure.</text>
</svg>
