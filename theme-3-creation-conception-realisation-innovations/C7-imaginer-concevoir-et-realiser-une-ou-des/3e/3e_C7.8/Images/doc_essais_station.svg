<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 812" width="350" height="812" role="img" aria-labelledby="t_essais_station d_essais_station" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_essais_station">Les six essais de la recette</title>
<desc id="d_essais_station">Les six essais de la recette de la liaison entre les stations du Robert et de Sainte-Anne. Essai 1 : Les deux stations annoncent le niveau 2, à l'instant. Essai 2 : Le Robert annonce 2, Sainte-Anne annonce 1. Essai 3 : Les deux annoncent 2, mais le message du Robert a trois heures. Essai 4 : Sainte-Anne cesse d'émettre pendant vingt minutes. Essai 5 : Sainte-Anne se tait ET Le Robert mesure 124 km/h. Essai 6 : Le message 417 arrive deux fois, puis le 419 arrive sans le 418.</desc>
<rect width="350" height="812" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Les six essais de la recette</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Deux stations, Le Robert et</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">Sainte-Anne, et la règle : alerte si les</text>
<text x="14.0" y="89.6" font-size="13.5" fill="#9bbefc">deux annoncent au moins le niveau 2.</text>
<rect x="14.0" y="105.6" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="135.6" font-size="16" fill="#61dafb" font-weight="700">Essai 1</text>
<text x="26.0" y="162.6" font-size="15" fill="#e4eaf5">Les deux stations annoncent le niveau</text>
<text x="26.0" y="183.6" font-size="15" fill="#e4eaf5">2, à l'instant.</text>
<rect x="14.0" y="211.6" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="241.6" font-size="16" fill="#61dafb" font-weight="700">Essai 2</text>
<text x="26.0" y="268.6" font-size="15" fill="#e4eaf5">Le Robert annonce 2, Sainte-Anne</text>
<text x="26.0" y="289.6" font-size="15" fill="#e4eaf5">annonce 1.</text>
<rect x="14.0" y="317.6" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="347.6" font-size="16" fill="#61dafb" font-weight="700">Essai 3</text>
<text x="26.0" y="374.6" font-size="15" fill="#e4eaf5">Les deux annoncent 2, mais le message du</text>
<text x="26.0" y="395.6" font-size="15" fill="#e4eaf5">Robert a trois heures.</text>
<rect x="14.0" y="423.6" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="453.6" font-size="16" fill="#61dafb" font-weight="700">Essai 4</text>
<text x="26.0" y="480.6" font-size="15" fill="#e4eaf5">Sainte-Anne cesse d'émettre pendant</text>
<text x="26.0" y="501.6" font-size="15" fill="#e4eaf5">vingt minutes.</text>
<rect x="14.0" y="529.6" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="559.6" font-size="16" fill="#61dafb" font-weight="700">Essai 5</text>
<text x="26.0" y="586.6" font-size="15" fill="#e4eaf5">Sainte-Anne se tait ET Le Robert mesure</text>
<text x="26.0" y="607.6" font-size="15" fill="#e4eaf5">124 km/h.</text>
<rect x="14.0" y="635.6" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="665.6" font-size="16" fill="#61dafb" font-weight="700">Essai 6</text>
<text x="26.0" y="692.6" font-size="15" fill="#e4eaf5">Le message 417 arrive deux fois, puis le</text>
<text x="26.0" y="713.6" font-size="15" fill="#e4eaf5">419 arrive sans le 418.</text>
<text x="14.0" y="755.8" font-size="13.5" fill="#9bbefc">Le document ne dit pas ce que prouve chaque</text>
<text x="14.0" y="774.0" font-size="13.5" fill="#9bbefc">essai : c'est la question · km/h : kilomètre par</text>
<text x="14.0" y="792.3" font-size="13.5" fill="#9bbefc">heure.</text>
</svg>
