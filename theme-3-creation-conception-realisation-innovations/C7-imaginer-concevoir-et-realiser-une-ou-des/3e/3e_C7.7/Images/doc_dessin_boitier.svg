<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 456" width="350" height="456" role="img" aria-labelledby="t_dessin_boitier d_dessin_boitier" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_dessin_boitier">Le dessin du boîtier, face à l'imprimante</title>
<desc id="d_dessin_boitier">Le dessin du boîtier de la station, en PETG, face à ce que tient l'imprimante 3D (buse de 0,4 millimètre, couches de 0,2 millimètre). Paroi étanche : dessin, 2,9 millimètres ; l'imprimante tient au moins 1,6 millimètre. Casquette : dessin, 70 degrés ; l'imprimante tient au plus 45 degrés. Rainure du joint : dessin, 0,3 millimètre ; l'imprimante tient au moins 0,4 millimètre. Jeu couvercle : dessin, 0,1 millimètre ; l'imprimante tient à 0,3 millimètre près. Angles internes : dessin, des angles vifs ; l'imprimante tient des angles vifs.</desc>
<rect width="350" height="456" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le dessin du boîtier,</text>
<text x="14.0" y="54.8" font-size="17" fill="#e4eaf5" font-weight="700">face à l'imprimante</text>
<text x="14.0" y="76.1" font-size="13.5" fill="#9bbefc">Cinq cotes du dessin, et ce que</text>
<text x="14.0" y="94.3" font-size="13.5" fill="#9bbefc">tient l'imprimante 3D en PETG.</text>
<rect x="14.0" y="110.3" width="322.0" height="204.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700">Cote</text>
<text x="180.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Dessin</text>
<text x="278.0" y="132.3" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Imprimante</text>
<line x1="14" y1="144.3" x2="336" y2="144.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="166.3" font-size="15" fill="#e4eaf5" font-weight="700">Paroi étanche</text>
<text x="180.0" y="166.3" font-size="15" fill="#e4eaf5" text-anchor="middle">2,9 mm</text>
<text x="278.0" y="166.3" font-size="15" fill="#e4eaf5" text-anchor="middle">1,6 mm min.</text>
<line x1="14" y1="178.3" x2="336" y2="178.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="200.3" font-size="15" fill="#e4eaf5" font-weight="700">Casquette</text>
<text x="180.0" y="200.3" font-size="15" fill="#e4eaf5" text-anchor="middle">70°</text>
<text x="278.0" y="200.3" font-size="15" fill="#e4eaf5" text-anchor="middle">45° max.</text>
<line x1="14" y1="212.3" x2="336" y2="212.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="234.3" font-size="15" fill="#e4eaf5" font-weight="700">Rainure du joint</text>
<text x="180.0" y="234.3" font-size="15" fill="#e4eaf5" text-anchor="middle">0,3 mm</text>
<text x="278.0" y="234.3" font-size="15" fill="#e4eaf5" text-anchor="middle">0,4 mm min.</text>
<line x1="14" y1="246.3" x2="336" y2="246.3" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="268.4" font-size="15" fill="#e4eaf5" font-weight="700">Jeu couvercle</text>
<text x="180.0" y="268.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0,1 mm</text>
<text x="278.0" y="268.4" font-size="15" fill="#e4eaf5" text-anchor="middle">± 0,3 mm</text>
<line x1="14" y1="280.4" x2="336" y2="280.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="302.4" font-size="15" fill="#e4eaf5" font-weight="700">Angles internes</text>
<text x="180.0" y="302.4" font-size="15" fill="#e4eaf5" text-anchor="middle">vifs</text>
<text x="278.0" y="302.4" font-size="15" fill="#e4eaf5" text-anchor="middle">vifs</text>
<text x="14.0" y="344.5" font-size="13.5" fill="#9bbefc">min. : au moins · max. : au plus · ± : à … près · mm :</text>
<text x="14.0" y="362.8" font-size="13.5" fill="#9bbefc">millimètre · ° : degré, l'inclinaison par rapport à</text>
<text x="14.0" y="381.0" font-size="13.5" fill="#9bbefc">la verticale · l'imprimante dépose des couches de</text>
<text x="14.0" y="399.2" font-size="13.5" fill="#9bbefc">0,2 mm avec une buse de 0,4 mm · au-delà de son</text>
<text x="14.0" y="417.4" font-size="13.5" fill="#9bbefc">surplomb, il lui faut un support · PETG : un</text>
<text x="14.0" y="435.7" font-size="13.5" fill="#9bbefc">plastique d'impression.</text>
</svg>
