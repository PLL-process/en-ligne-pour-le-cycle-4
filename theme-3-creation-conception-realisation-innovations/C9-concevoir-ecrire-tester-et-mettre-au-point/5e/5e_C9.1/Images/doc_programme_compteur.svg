<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 582" width="350" height="582" role="img" aria-labelledby="t_programme_compteur d_programme_compteur" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_programme_compteur">Le programme du compteur</title>
<desc id="d_programme_compteur">Le programme du compteur, ligne par ligne : ligne 1, places = 24 ; ligne 2, montes = 3 ; ligne 3, descendus = 2 ; ligne 4, places = places - montes ; ligne 5, places = places - descendus ; ligne 6, print("Places libres :", places). Son banc de trois tests, où montes et descendus remplacent les lignes 2 et 3 : T1, personne ne bouge : montes 0, descendus 0, attendu 24. T2, 3 montent, 0 descend : montes 3, descendus 0, attendu 21. T3, 3 montent, 2 descendent : montes 3, descendus 2, attendu 23. Le document ne dit pas ce que le programme affiche.</desc>
<rect width="350" height="582" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le programme du compteur</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le programme envoyé par le responsable du</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">Cyclone, et son banc de trois tests. Le besoin :</text>
<text x="14.0" y="89.6" font-size="13.5" fill="#9bbefc">afficher le bon nombre de places libres.</text>
<rect x="14.0" y="105.6" width="322.0" height="238.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="127.6" font-size="13.5" fill="#61dafb" font-weight="700">Ligne</text>
<text x="207.0" y="127.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">Instruction</text>
<line x1="14" y1="139.6" x2="336" y2="139.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="161.6" font-size="15" fill="#e4eaf5" font-weight="700">1</text>
<text x="207.0" y="161.6" font-size="15" fill="#e4eaf5" text-anchor="middle">places = 24</text>
<line x1="14" y1="173.6" x2="336" y2="173.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="195.6" font-size="15" fill="#e4eaf5" font-weight="700">2</text>
<text x="207.0" y="195.6" font-size="15" fill="#e4eaf5" text-anchor="middle">montes = 3</text>
<line x1="14" y1="207.6" x2="336" y2="207.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="229.6" font-size="15" fill="#e4eaf5" font-weight="700">3</text>
<text x="207.0" y="229.6" font-size="15" fill="#e4eaf5" text-anchor="middle">descendus = 2</text>
<line x1="14" y1="241.6" x2="336" y2="241.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="263.6" font-size="15" fill="#e4eaf5" font-weight="700">4</text>
<text x="207.0" y="263.6" font-size="15" fill="#e4eaf5" text-anchor="middle">places = places - montes</text>
<line x1="14" y1="275.6" x2="336" y2="275.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="297.6" font-size="15" fill="#e4eaf5" font-weight="700">5</text>
<text x="207.0" y="297.6" font-size="15" fill="#e4eaf5" text-anchor="middle">places = places - descendus</text>
<line x1="14" y1="309.6" x2="336" y2="309.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="331.6" font-size="15" fill="#e4eaf5" font-weight="700">6</text>
<text x="207.0" y="331.6" font-size="15" fill="#e4eaf5" text-anchor="middle">print("Places libres :", places)</text>
<rect x="14.0" y="359.6" width="322.0" height="136.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="381.6" font-size="13.5" fill="#61dafb" font-weight="700">Test</text>
<text x="119.0" y="381.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">montes</text>
<text x="210.0" y="381.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">descendus</text>
<text x="298.0" y="381.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">attendu</text>
<line x1="14" y1="393.6" x2="336" y2="393.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="415.6" font-size="15" fill="#e4eaf5" font-weight="700">T1</text>
<text x="119.0" y="415.6" font-size="15" fill="#e4eaf5" text-anchor="middle">0</text>
<text x="210.0" y="415.6" font-size="15" fill="#e4eaf5" text-anchor="middle">0</text>
<text x="298.0" y="415.6" font-size="15" fill="#e4eaf5" text-anchor="middle">24</text>
<line x1="14" y1="427.6" x2="336" y2="427.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="449.6" font-size="15" fill="#e4eaf5" font-weight="700">T2</text>
<text x="119.0" y="449.6" font-size="15" fill="#e4eaf5" text-anchor="middle">3</text>
<text x="210.0" y="449.6" font-size="15" fill="#e4eaf5" text-anchor="middle">0</text>
<text x="298.0" y="449.6" font-size="15" fill="#e4eaf5" text-anchor="middle">21</text>
<line x1="14" y1="461.6" x2="336" y2="461.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="483.6" font-size="15" fill="#e4eaf5" font-weight="700">T3</text>
<text x="119.0" y="483.6" font-size="15" fill="#e4eaf5" text-anchor="middle">3</text>
<text x="210.0" y="483.6" font-size="15" fill="#e4eaf5" text-anchor="middle">2</text>
<text x="298.0" y="483.6" font-size="15" fill="#e4eaf5" text-anchor="middle">23</text>
<text x="14.0" y="525.8" font-size="13.5" fill="#9bbefc">Au banc, montes et descendus remplacent les</text>
<text x="14.0" y="544.0" font-size="13.5" fill="#9bbefc">valeurs des lignes 2 et 3 · Le document ne dit pas</text>
<text x="14.0" y="562.3" font-size="13.5" fill="#9bbefc">ce que le programme affiche : c'est la question.</text>
</svg>
