<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Le compteur du Cyclone : deux boîtes étiquetées dans la mémoire</title>
  <desc id="d">Schéma en trois parties. À gauche, le programme Python du compteur de places du grand-huit : ligne 1, places égale 24 ; ligne 2, montes égale 3 ; ligne 3, places égale places moins montes ; ligne 4, print places. Au centre, la mémoire représentée par deux boîtes étiquetées : la boîte places contient 24 puis son contenu est remplacé par 21 ; la boîte montes contient 3. À droite, le panneau du manège affiche : Places libres 21. En bas, trois règles simples : une variable est une boîte avec un nom et UNE valeur ; le signe égal veut dire range dans la boîte ; quand on range une nouvelle valeur, l'ancienne est remplacée.</desc>
  <rect width="940" height="500" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">Le compteur du Cyclone — chaque variable est une BOÎTE ÉTIQUETÉE</text>

  <text x="40" y="66" fill="#61dafb" font-size="13" font-weight="bold">1️⃣ LE PROGRAMME (fourni)</text>
  <rect x="30" y="78" width="280" height="126" rx="10" fill="#08132c" stroke="#274a8a" stroke-width="2"/>
  <g font-family="monospace" font-size="14">
    <text x="46" y="106" fill="#5b7bb8">1</text><text x="66" y="106" fill="#e4eaf5">places = <tspan fill="#81fba1">24</tspan></text>
    <text x="46" y="132" fill="#5b7bb8">2</text><text x="66" y="132" fill="#e4eaf5">montes = <tspan fill="#81fba1">3</tspan></text>
    <text x="46" y="158" fill="#5b7bb8">3</text><text x="66" y="158" fill="#e4eaf5">places = places - montes</text>
    <text x="46" y="184" fill="#5b7bb8">4</text><text x="66" y="184" fill="#e4eaf5">print(places)</text>
  </g>

  <text x="360" y="66" fill="#c68ef2" font-size="13" font-weight="bold">2️⃣ LA MÉMOIRE : des boîtes</text>
  <rect x="350" y="78" width="290" height="180" rx="12" fill="#0d2347" stroke="#c68ef2" stroke-width="2"/>
  <rect x="378" y="104" width="110" height="78" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2.5"/>
  <rect x="388" y="92" width="90" height="24" rx="6" fill="#173666" stroke="#81fba1"/>
  <text x="433" y="109" fill="#81fba1" font-size="12" font-weight="bold" text-anchor="middle">places</text>
  <text x="410" y="158" fill="#5b7bb8" font-size="19" text-anchor="middle" font-family="monospace" text-decoration="line-through">24</text>
  <text x="458" y="158" fill="#81fba1" font-size="22" font-weight="bold" text-anchor="middle" font-family="monospace">21</text>
  <rect x="512" y="104" width="104" height="78" rx="8" fill="#0a1b3d" stroke="#61dafb" stroke-width="2.5"/>
  <rect x="520" y="92" width="88" height="24" rx="6" fill="#173666" stroke="#61dafb"/>
  <text x="564" y="109" fill="#61dafb" font-size="12" font-weight="bold" text-anchor="middle">montes</text>
  <text x="564" y="158" fill="#ffd66b" font-size="22" font-weight="bold" text-anchor="middle" font-family="monospace">3</text>
  <text x="495" y="222" fill="#ff7b88" font-size="10.5" text-anchor="middle">ligne 3 : le 24 est REMPLACÉ par 21</text>
  <text x="495" y="240" fill="#9bbefc" font-size="10.5" text-anchor="middle">(24 − 3 = 21, rangé dans la boîte « places »)</text>

  <text x="700" y="66" fill="#ffd66b" font-size="13" font-weight="bold">3️⃣ LE PANNEAU DU MANÈGE</text>
  <rect x="690" y="78" width="220" height="110" rx="10" fill="#111" stroke="#ffd66b" stroke-width="3"/>
  <text x="800" y="118" fill="#ffb454" font-size="15" text-anchor="middle">🎢 PLACES LIBRES</text>
  <text x="800" y="164" fill="#ffd66b" font-size="34" font-weight="bold" text-anchor="middle" font-family="monospace">21</text>

  <g stroke="#61dafb" stroke-width="3" fill="#61dafb">
    <line x1="310" y1="140" x2="342" y2="140"/><path d="M342 135 l12 5 l-12 5 z"/>
    <line x1="640" y1="140" x2="682" y2="140"/><path d="M682 135 l12 5 l-12 5 z"/>
  </g>

  <rect x="30" y="288" width="880" height="150" rx="12" fill="#173666" stroke="#274a8a"/>
  <text x="50" y="318" fill="#e4eaf5" font-size="13"><tspan fill="#61dafb" font-weight="bold">Règle 1 :</tspan> une variable = une boîte avec une ÉTIQUETTE (son nom) et UNE SEULE valeur dedans.</text>
  <text x="50" y="348" fill="#e4eaf5" font-size="13"><tspan fill="#81fba1" font-weight="bold">Règle 2 :</tspan> le signe <tspan font-family="monospace" fill="#ffd66b">=</tspan> ne veut pas dire « égal » : il veut dire <tspan font-weight="bold">« RANGE ça dans la boîte »</tspan>.</text>
  <text x="50" y="378" fill="#e4eaf5" font-size="13"><tspan fill="#ff7b88" font-weight="bold">Règle 3 :</tspan> quand on range une nouvelle valeur, l'ancienne est REMPLACÉE — la boîte ne garde jamais les deux.</text>
  <text x="50" y="416" fill="#ffd66b" font-size="12.5" font-weight="bold">La méthode pour lire un programme : suivre les boîtes ligne par ligne, avec le doigt.</text>
  <text x="470" y="478" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">À toi de lire : si montes valait 5 au lieu de 3, qu'afficherait le panneau ?</text>
</svg>
