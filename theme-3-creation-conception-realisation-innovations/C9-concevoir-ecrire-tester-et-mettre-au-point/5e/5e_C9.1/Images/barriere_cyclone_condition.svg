<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">La barrière du Cyclone : une variable qui commande un objet réel</title>
  <desc id="d">Schéma-bloc dans la convention de la technologie, information en haut, énergie en bas. En haut, la chaîne d'information : le compteur de places (la variable places) est lu par le programme de la barrière, qui applique la règle : SI places est supérieur à 0, ouvrir la barrière, SINON la fermer et allumer le panneau COMPLET. Une flèche d'ordre verte descend du programme vers le moteur de la barrière : l'information commande l'énergie. En bas, la chaîne d'énergie du moteur qui ouvre la barrière d'accès. À droite, le banc de trois tests : places égale 10, la barrière doit être ouverte ; places égale 0 exactement, la barrière doit être fermée, c'est le cas limite ; places égale 24, ouverte. Message clé : le programme n'est réglé que quand les trois tests passent, y compris le cas limite zéro.</desc>
  <rect width="940" height="520" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="18" font-weight="bold" text-anchor="middle">La barrière du Cyclone — ta variable COMMANDE un objet réel</text>

  <!-- chaîne info (haut) -->
  <text x="40" y="64" fill="#61dafb" font-size="13" font-weight="bold">🧠 CHAÎNE D'INFORMATION</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="78" width="170" height="70" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
    <text x="115" y="102" fill="#61dafb" font-weight="bold">📊 COMPTEUR</text>
    <text x="115" y="120" fill="#e4eaf5">la variable</text>
    <text x="115" y="138" fill="#ffd66b" font-family="monospace">places</text>
    <rect x="250" y="78" width="290" height="70" rx="10" fill="#0d2347" stroke="#c68ef2" stroke-width="2"/>
    <text x="395" y="100" fill="#c68ef2" font-weight="bold">🧠 LE PROGRAMME DÉCIDE</text>
    <rect x="264" y="110" width="262" height="28" rx="6" fill="#08132c"/>
    <text x="395" y="128" fill="#ffd66b" font-size="10.5" font-family="monospace">SI places &gt; 0 → OUVRIR sinon FERMER</text>
    <rect x="590" y="78" width="160" height="70" rx="10" fill="#0d2347" stroke="#ff7b88" stroke-width="2"/>
    <text x="670" y="102" fill="#ff7b88" font-weight="bold">🟥 PANNEAU</text>
    <text x="670" y="122" fill="#e4eaf5">« COMPLET »</text>
    <text x="670" y="138" fill="#9bbefc" font-size="9.5">s'allume si fermé</text>
  </g>
  <g stroke="#61dafb" stroke-width="3" fill="#61dafb">
    <line x1="200" y1="113" x2="242" y2="113"/><path d="M242 108 l12 5 l-12 5 z"/>
    <line x1="540" y1="113" x2="582" y2="113"/><path d="M582 108 l12 5 l-12 5 z"/>
  </g>

  <!-- ordre descend -->
  <line x1="395" y1="148" x2="395" y2="252" stroke="#81fba1" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M390 252 l5 12 l5 -12 z" fill="#81fba1"/>
  <text x="408" y="200" fill="#81fba1" font-size="11" font-weight="bold">l'ORDRE descend :</text>
  <text x="408" y="216" fill="#81fba1" font-size="11" font-weight="bold">l'information COMMANDE l'énergie</text>

  <!-- chaîne énergie (bas) -->
  <text x="40" y="252" fill="#ffb454" font-size="13" font-weight="bold">⚡ CHAÎNE D'ÉNERGIE</text>
  <g font-size="11" text-anchor="middle">
    <rect x="120" y="266" width="170" height="66" rx="10" fill="#0d2347" stroke="#ffb454" stroke-width="2"/>
    <text x="205" y="290" fill="#ffb454" font-weight="bold">🔋 ALIMENTER</text>
    <text x="205" y="310" fill="#9bbefc" font-size="10">très basse tension</text>
    <rect x="330" y="266" width="150" height="66" rx="10" fill="#0d2347" stroke="#ffb454" stroke-width="2"/>
    <text x="405" y="290" fill="#ffb454" font-weight="bold">⚙ MOTEUR</text>
    <text x="405" y="310" fill="#e4eaf5" font-size="10">convertir</text>
    <rect x="520" y="266" width="180" height="66" rx="10" fill="#0d2347" stroke="#ffd66b" stroke-width="2"/>
    <text x="610" y="290" fill="#ffd66b" font-weight="bold">🚧 BARRIÈRE</text>
    <text x="610" y="310" fill="#e4eaf5" font-size="10">s'ouvre ou se ferme</text>
  </g>
  <g stroke="#ffb454" stroke-width="3" fill="#ffb454">
    <line x1="290" y1="299" x2="322" y2="299"/><path d="M322 294 l12 5 l-12 5 z"/>
    <line x1="480" y1="299" x2="512" y2="299"/><path d="M512 294 l12 5 l-12 5 z"/>
  </g>

  <!-- banc de tests -->
  <rect x="740" y="180" width="180" height="200" rx="12" fill="#0e2e18" stroke="#81fba1" stroke-width="2"/>
  <text x="830" y="206" fill="#81fba1" font-size="12" font-weight="bold" text-anchor="middle">🧪 LE BANC DE TESTS</text>
  <g font-size="10.5">
    <text x="756" y="232" fill="#e4eaf5">places = 10 → <tspan fill="#81fba1" font-weight="bold">ouverte ✔</tspan></text>
    <text x="756" y="262" fill="#ffd66b" font-weight="bold">places = 0 → fermée ⚠</text>
    <text x="756" y="280" fill="#ffd66b" font-size="9.5">LE CAS LIMITE : zéro pile !</text>
    <text x="756" y="304" fill="#e4eaf5">places = 24 → <tspan fill="#81fba1" font-weight="bold">ouverte ✔</tspan></text>
    <text x="756" y="336" fill="#9bbefc" font-size="9.5">Réglé = les 3 tests passent,</text>
    <text x="756" y="352" fill="#9bbefc" font-size="9.5">le cas limite compris.</text>
  </g>

  <rect x="30" y="400" width="880" height="70" rx="12" fill="#173666" stroke="#274a8a"/>
  <text x="50" y="428" fill="#e4eaf5" font-size="13"><tspan fill="#61dafb" font-weight="bold">📐 Règle d'or du schéma :</tspan> l'INFORMATION en haut, l'ÉNERGIE en bas, la flèche d'ORDRE qui descend —</text>
  <text x="50" y="452" fill="#e4eaf5" font-size="13">le cerveau au-dessus des muscles. Ta variable <tspan font-family="monospace" fill="#ffd66b">places</tspan> est le cerveau de cette barrière.</text>
  <text x="470" y="500" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">À toi de lire : que fait la barrière si places vaut exactement 0 ? Et pourquoi ce test-là est-il le plus important ?</text>
<style><![CDATA[
/* — impression : fond blanc, couleurs conservées (décision de Pascal, 02/09/2026) —
   Un objet embarqué applique le media print de la page qui l'appelle : ce
   bloc ne change RIEN à l'écran, et blanchit le fond du schéma sur le papier
   en fonçant ses couleurs claires, teinte gardée. Mesuré le 02/09 : une image
   appelée par la balise img ne le fait pas — ces schémas-là ne sont pas ici. */
@media print{
  *:not(text):not(tspan)[fill="#050f24"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#08132c"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0d2347"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#0e2e18"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#173666"]{fill:#ffffff}
  *:not(text):not(tspan)[fill="#5b7bb8"]{fill:#ffffff}
  text[fill="#5b7bb8"],tspan[fill="#5b7bb8"]{fill:#5475b5}
  text[fill="#61dafb"],tspan[fill="#61dafb"],[fill="#61dafb"] text,[fill="#61dafb"] tspan{fill:#047fa0}
  [stroke="#61dafb"]{stroke:#047fa0}
  text[fill="#81aaff"],tspan[fill="#81aaff"],[fill="#81aaff"] text,[fill="#81aaff"] tspan{fill:#2069ff}
  text[fill="#81fba1"],tspan[fill="#81fba1"],[fill="#81fba1"] text,[fill="#81fba1"] tspan{fill:#048827}
  [stroke="#81fba1"]{stroke:#048827}
  text[fill="#9bbefc"],tspan[fill="#9bbefc"],[fill="#9bbefc"] text,[fill="#9bbefc"] tspan{fill:#1a6af8}
  text[fill="#c68ef2"],tspan[fill="#c68ef2"],[fill="#c68ef2"] text,[fill="#c68ef2"] tspan{fill:#a145ea}
  [stroke="#c68ef2"]{stroke:#a145ea}
  text[fill="#e4eaf5"],tspan[fill="#e4eaf5"],[fill="#e4eaf5"] text,[fill="#e4eaf5"] tspan{fill:#4b73bc}
  text[fill="#ff7b88"],tspan[fill="#ff7b88"],[fill="#ff7b88"] text,[fill="#ff7b88"] tspan{fill:#eb0017}
  [stroke="#ff7b88"]{stroke:#eb0017}
  text[fill="#ffb454"],tspan[fill="#ffb454"],[fill="#ffb454"] text,[fill="#ffb454"] tspan{fill:#b06300}
  [stroke="#ffb454"]{stroke:#b06300}
  text[fill="#ffd66b"],tspan[fill="#ffd66b"],[fill="#ffd66b"] text,[fill="#ffd66b"] tspan{fill:#996f00}
  [stroke="#ffd66b"]{stroke:#996f00}
}
]]></style>
</svg>
