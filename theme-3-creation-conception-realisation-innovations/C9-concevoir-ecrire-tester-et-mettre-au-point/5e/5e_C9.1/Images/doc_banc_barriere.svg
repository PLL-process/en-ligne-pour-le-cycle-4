<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 525" width="350" height="525" role="img" aria-labelledby="t_banc_barriere d_banc_barriere" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_banc_barriere">Le banc de la barrière</title>
<desc id="d_banc_barriere">La barrière du Cyclone obéit à la règle : SI places &gt; 0 → OUVRIR, SINON → FERMER. Son banc de trois tests : B1, il reste 10 places : places 10, attendu OUVERTE. B2, train tout neuf : places 32, attendu OUVERTE. B3, complet : places 0, attendu FERMÉE. Le document ne dit pas quel test est le plus important.</desc>
<rect width="350" height="525" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le banc de la barrière</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">La règle qui commande la barrière du</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">Cyclone, et son banc de trois tests.</text>
<rect x="14.0" y="87.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">La règle</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">SI places &gt; 0 → OUVRIR</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">SINON → FERMER</text>
<rect x="14.0" y="193.4" width="322.0" height="136.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="215.4" font-size="13.5" fill="#61dafb" font-weight="700">Test</text>
<text x="133.0" y="215.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">places</text>
<text x="262.0" y="215.4" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">attendu</text>
<line x1="14" y1="227.4" x2="336" y2="227.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="249.4" font-size="15" fill="#e4eaf5" font-weight="700">B1</text>
<text x="133.0" y="249.4" font-size="15" fill="#e4eaf5" text-anchor="middle">10</text>
<text x="262.0" y="249.4" font-size="15" fill="#e4eaf5" text-anchor="middle">OUVERTE</text>
<line x1="14" y1="261.4" x2="336" y2="261.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="283.4" font-size="15" fill="#e4eaf5" font-weight="700">B2</text>
<text x="133.0" y="283.4" font-size="15" fill="#e4eaf5" text-anchor="middle">32</text>
<text x="262.0" y="283.4" font-size="15" fill="#e4eaf5" text-anchor="middle">OUVERTE</text>
<line x1="14" y1="295.4" x2="336" y2="295.4" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="317.4" font-size="15" fill="#e4eaf5" font-weight="700">B3</text>
<text x="133.0" y="317.4" font-size="15" fill="#e4eaf5" text-anchor="middle">0</text>
<text x="262.0" y="317.4" font-size="15" fill="#e4eaf5" text-anchor="middle">FERMÉE</text>
<rect x="14.0" y="345.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="375.4" font-size="16" fill="#61dafb" font-weight="700">Ce que vise chaque test</text>
<text x="26.0" y="402.4" font-size="15" fill="#e4eaf5">B1 : il reste 10 places.</text>
<text x="26.0" y="423.4" font-size="15" fill="#e4eaf5">B2 : train tout neuf.</text>
<text x="26.0" y="444.4" font-size="15" fill="#e4eaf5">B3 : complet.</text>
<text x="14.0" y="486.6" font-size="13.5" fill="#9bbefc">Le document ne dit pas quel test est le plus</text>
<text x="14.0" y="504.8" font-size="13.5" fill="#9bbefc">important : c'est la question.</text>
</svg>
