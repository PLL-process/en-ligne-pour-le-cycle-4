<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t-p3 d-p3">
<title id="t-p3">Palier 3 dans Vittascience — trois sous-programmes de mode et la cascade qui les appelle</title>
<desc id="d-p3">Reconstitution schématique de l'écran Vittascience (interface Arduino, mode blocs) pour le palier 3 de la station d'alerte cyclonique. Les sorties sont : voyant vert sur D2, voyant orange sur D3, voyant rouge sur D4, buzzer sur D5.

À gauche, trois sous-programmes. Chacun impose l'état des QUATRE sorties, sans en oublier aucune.
Sous-programme « définir mode_veille » : voyant vert D2 allumé ; voyant orange D3 éteint ; voyant rouge D4 éteint ; buzzer D5 arrêté.
Sous-programme « définir mode_vigilance » : voyant vert D2 éteint ; voyant orange D3 allumé ; voyant rouge D4 éteint ; buzzer D5 arrêté.
Sous-programme « définir mode_alerte » : voyant vert D2 éteint ; voyant orange D3 éteint ; voyant rouge D4 allumé ; buzzer D5 activé.

À droite, la cascade du palier 2, placée dans le bloc répéter indéfiniment, où chaque branche ne contient plus qu'un seul bloc, l'appel du sous-programme correspondant.
« si niveau_vent ≥ seuil_alerte alors » : appeler mode_alerte.
« sinon si niveau_vent ≥ seuil_vigilance alors » : appeler mode_vigilance.
« sinon » : appeler mode_veille.

Un encart à contour jaune rappelle que chaque mode impose l'état des QUATRE sorties — éteindre est aussi important qu'allumer : si un mode oublie d'éteindre le voyant du mode précédent, deux voyants restent allumés en même temps et la station ment.

Un dernier encart rappelle le brochage : capteur rotatif sur A0, voyant vert sur D2, voyant orange sur D3, voyant rouge sur D4, buzzer sur D5. Les seuils restent seuil_vigilance égal 40 et seuil_alerte égal 70, sur l'échelle scolaire de 0 à 100 sans unité.</desc>
<rect width="900" height="530" fill="#050f24"/>
