  <rect x="40" y="90" width="170" height="64" rx="8" fill="#0d2347" stroke="#274a8a"/>
  <text x="125" y="112" text-anchor="middle" fill="#e4eaf5" font-size="12" font-weight="700">🌬 Vent (grandeur physique)</text>
