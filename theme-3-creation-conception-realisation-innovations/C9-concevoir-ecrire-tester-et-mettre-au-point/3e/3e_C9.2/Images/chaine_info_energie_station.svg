<rect x="20" y="48" width="960" height="216" rx="12" fill="rgba(97,218,251,.05)" stroke="#61dafb" stroke-dasharray="6 4"/>
<text x="40" y="72" fill="#61dafb" font-size="14" font-weight="700">CHAÎNE D'INFORMATION — en HAUT (elle décide)</text>

<!-- Entrées -->
