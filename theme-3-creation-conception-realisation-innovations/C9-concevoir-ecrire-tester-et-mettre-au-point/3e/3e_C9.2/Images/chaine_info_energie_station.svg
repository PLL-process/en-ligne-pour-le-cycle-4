  <text x="125" y="143" text-anchor="middle" fill="#9bbefc" font-size="11">signal analogique 0-5 V</text>
  <rect x="40" y="176" width="170" height="64" rx="8" fill="#0d2347" stroke="#274a8a"/>
  <text x="125" y="198" text-anchor="middle" fill="#e4eaf5" font-size="12" font-weight="700">👤 Appui de l'agent</text>
  <text x="125" y="214" text-anchor="middle" fill="#9bbefc" font-size="11">bouton d'acquittement — D2</text>
  <text x="125" y="229" text-anchor="middle" fill="#9bbefc" font-size="11">signal logique 0 / 1</text>
</g>

<!-- Acquérir -->
<rect x="265" y="120" width="135" height="90" rx="10" fill="#123322" stroke="#81fba1" stroke-width="2"/>
<text x="332" y="155" text-anchor="middle" fill="#81fba1" font-size="15" font-weight="700">ACQUÉRIR</text>
<text x="332" y="175" text-anchor="middle" fill="#e4eaf5" font-size="11">entrées A1 et D2</text>
<text x="332" y="191" text-anchor="middle" fill="#e4eaf5" font-size="11">CAN 10 bits (0-1023)</text>
<line x1="212" y1="122" x2="263" y2="142" stroke="#61dafb" stroke-width="2.5" marker-end="url(#fl)"/>
<line x1="212" y1="208" x2="263" y2="188" stroke="#61dafb" stroke-width="2.5" marker-end="url(#fl)"/>

<!-- flèche données : longue, étiquette bien au-dessus du trait -->
<line x1="402" y1="165" x2="483" y2="165" stroke="#61dafb" stroke-width="2.5" marker-end="url(#fl)"/>
<text x="442" y="146" text-anchor="middle" fill="#9bbefc" font-size="11" font-weight="700">données</text>

<!-- Traiter -->
<rect x="485" y="120" width="175" height="90" rx="10" fill="#173666" stroke="#61dafb" stroke-width="2"/>
<text x="572" y="148" text-anchor="middle" fill="#61dafb" font-size="15" font-weight="700">TRAITER</text>
<text x="572" y="167" text-anchor="middle" fill="#e4eaf5" font-size="11">microcontrôleur + programme</text>
<text x="572" y="183" text-anchor="middle" fill="#ffd66b" font-size="11">seuils : 63 · 118 · 178 km/h</text>
<text x="572" y="199" text-anchor="middle" fill="#e4eaf5" font-size="11">+ mémoire de l'acquittement</text>

<!-- flèche décisions -->
<line x1="662" y1="165" x2="743" y2="165" stroke="#61dafb" stroke-width="2.5" marker-end="url(#fl)"/>
<text x="702" y="146" text-anchor="middle" fill="#9bbefc" font-size="11" font-weight="700">décisions</text>

<!-- Communiquer -->
<rect x="745" y="120" width="165" height="90" rx="10" fill="#2b1a3f" stroke="#c68ef2" stroke-width="2"/>
<text x="827" y="148" text-anchor="middle" fill="#c68ef2" font-size="14" font-weight="700">COMMUNIQUER</text>
<text x="827" y="167" text-anchor="middle" fill="#e4eaf5" font-size="11">LCD : niveau + vitesse</text>
<text x="827" y="183" text-anchor="middle" fill="#e4eaf5" font-size="11">4 voyants · buzzer</text>
<text x="827" y="199" text-anchor="middle" fill="#e4eaf5" font-size="11">vers l'agent d'accueil</text>
<path d="M912 165 L 940 165" stroke="#c68ef2" stroke-width="2.5" marker-end="url(#flv)"/>
<text x="948" y="158" fill="#e4eaf5" font-size="20">👤</text>
<text x="958" y="190" text-anchor="middle" fill="#9bbefc" font-size="10">agent</text>

<!-- ══ Flèche d'ORDRE : elle atterrit sur CONVERTIR ══ -->
<path d="M572 212 L 572 300 L 605 300 L 605 368" stroke="#ffd66b" stroke-width="6" fill="none" marker-end="url(#flo)"/>
<rect x="632" y="236" width="290" height="76" rx="8" fill="rgba(255,214,107,.1)" stroke="#ffd66b"/>
<text x="777" y="257" text-anchor="middle" fill="#ffd66b" font-size="13" font-weight="700">l'ORDRE descend — et il arrive sur CONVERTIR</text>
<text x="777" y="276" text-anchor="middle" fill="#e4eaf5" font-size="11">ici, pas de préactionneur séparé : la broche du</text>
<text x="777" y="292" text-anchor="middle" fill="#e4eaf5" font-size="11">microcontrôleur alimente elle-même le voyant.</text>
<text x="777" y="307" text-anchor="middle" fill="#9bbefc" font-size="10.5">Possible seulement parce que la puissance est minuscule.</text>

<!-- ══ Bandeau énergie ══ -->
<rect x="20" y="330" width="960" height="180" rx="12" fill="rgba(255,180,84,.05)" stroke="#ffb454" stroke-dasharray="6 4"/>
<text x="40" y="354" fill="#ffb454" font-size="14" font-weight="700">CHAÎNE D'ÉNERGIE — en BAS (elle obéit)</text>

<g>
  <rect x="45" y="370" width="160" height="80" rx="10" fill="#3a2412" stroke="#ffb454" stroke-width="2"/>
  <text x="125" y="400" text-anchor="middle" fill="#ffb454" font-size="14" font-weight="700">ALIMENTER</text>
  <text x="125" y="420" text-anchor="middle" fill="#e4eaf5" font-size="11">USB de l'ordinateur</text>
  <text x="125" y="436" text-anchor="middle" fill="#e4eaf5" font-size="11">5 V — très basse tension</text>

  <rect x="275" y="370" width="160" height="80" rx="10" fill="#3a2412" stroke="#ffb454" stroke-width="2"/>
  <text x="355" y="400" text-anchor="middle" fill="#ffb454" font-size="14" font-weight="700">DISTRIBUER</text>
  <text x="355" y="420" text-anchor="middle" fill="#e4eaf5" font-size="11">le shield Grove répartit</text>
  <text x="355" y="436" text-anchor="middle" fill="#e4eaf5" font-size="11">le 5 V vers chaque module</text>

  <rect x="520" y="370" width="170" height="80" rx="10" fill="#3a2412" stroke="#ffb454" stroke-width="2"/>
  <text x="605" y="400" text-anchor="middle" fill="#ffb454" font-size="14" font-weight="700">CONVERTIR</text>
  <text x="605" y="420" text-anchor="middle" fill="#e4eaf5" font-size="11">électricité → lumière (voyants)</text>
  <text x="605" y="436" text-anchor="middle" fill="#e4eaf5" font-size="11">électricité → son (buzzer)</text>

  <!-- TRANSMETTRE : bloc fantôme, ABSENT -->
  <rect x="760" y="370" width="170" height="80" rx="10" fill="none" stroke="#5c6b8a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="845" y="398" text-anchor="middle" fill="#5c6b8a" font-size="14" font-weight="700">TRANSMETTRE</text>
  <text x="845" y="418" text-anchor="middle" fill="#5c6b8a" font-size="11">— ABSENT de cette station —</text>
  <text x="845" y="434" text-anchor="middle" fill="#5c6b8a" font-size="11">rien ne bouge : rien à transmettre</text>

  <line x1="207" y1="410" x2="273" y2="410" stroke="#ffb454" stroke-width="3" marker-end="url(#fle)"/>
  <line x1="437" y1="410" x2="518" y2="410" stroke="#ffb454" stroke-width="3" marker-end="url(#fle)"/>
  <line x1="692" y1="410" x2="758" y2="410" stroke="#5c6b8a" stroke-width="3" stroke-dasharray="7 5"/>
</g>

<rect x="330" y="462" width="600" height="38" rx="8" fill="rgba(92,107,138,.12)" stroke="#5c6b8a"/>
<text x="630" y="479" text-anchor="middle" fill="#9bbefc" font-size="11.5" font-weight="700">Pourquoi pas de TRANSMETTRE ? Transmettre, c'est acheminer un MOUVEMENT (engrenage, courroie, axe).</text>
<text x="630" y="494" text-anchor="middle" fill="#9bbefc" font-size="11.5">Notre station allume et sonne : elle ne déplace rien. Une station qui ouvrirait un volet, si.</text>

<text x="500" y="545" text-anchor="middle" fill="#9bbefc" font-size="12" font-style="italic">📐 L'INFORMATION en haut, l'ÉNERGIE en bas, la flèche d'ORDRE qui descend : la disposition montre qui commande.</text>

