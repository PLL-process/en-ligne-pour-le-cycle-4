<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t-chaine d-chaine">
<title id="t-chaine">Chaînes d'information et d'énergie de la station d'alerte : l'information en haut, l'énergie en bas, la flèche d'ordre qui descend</title>
<desc id="d-chaine">Schéma bloc à lire, disposé selon la convention du dépôt. En haut, la chaîne d'information : le bloc Acquérir reçoit la vitesse du vent (anémomètre simulé sur A1) et l'appui du bouton d'acquittement (D2) ; il envoie des signaux au bloc Traiter (microcontrôleur et programme, avec les seuils 100 et 150 kilomètres par heure) ; le bloc Communiquer regroupe l'afficheur LCD, la DEL rouge et le buzzer, tournés vers l'agent d'accueil. En bas, la chaîne d'énergie : Alimenter (USB 5 volts), Distribuer, Convertir jusqu'aux actionneurs. Entre les deux, une grande flèche verticale descend du bloc Traiter vers la chaîne d'énergie : c'est l'ORDRE, la commande. La disposition montre qui commande : le cerveau au-dessus des muscles.</desc>
<rect width="900" height="520" fill="#050f24"/>
<text x="450" y="30" text-anchor="middle" fill="#81aaff" font-size="20" font-weight="700">La station d'alerte : deux chaînes, une convention</text>

<!-- Bandeau info -->
<rect x="20" y="48" width="860" height="216" rx="12" fill="rgba(97,218,251,.05)" stroke="#61dafb" stroke-dasharray="6 4"/>
<text x="40" y="72" fill="#61dafb" font-size="14" font-weight="700">CHAÎNE D'INFORMATION — en HAUT (elle décide)</text>

<!-- Entrées -->
<g>
  <rect x="40" y="90" width="180" height="64" rx="8" fill="#0d2347" stroke="#274a8a"/>
  <text x="130" y="112" text-anchor="middle" fill="#e4eaf5" font-size="12" font-weight="700">🌬 Vent (grandeur physique)</text>
  <text x="130" y="128" text-anchor="middle" fill="#9bbefc" font-size="11">anémomètre simulé — A1</text>
  <text x="130" y="143" text-anchor="middle" fill="#9bbefc" font-size="11">signal analogique 0-5 V</text>
  <rect x="40" y="176" width="180" height="64" rx="8" fill="#0d2347" stroke="#274a8a"/>
  <text x="130" y="198" text-anchor="middle" fill="#e4eaf5" font-size="12" font-weight="700">👤 Appui de l'agent</text>
  <text x="130" y="214" text-anchor="middle" fill="#9bbefc" font-size="11">bouton d'acquittement — D2</text>
  <text x="130" y="229" text-anchor="middle" fill="#9bbefc" font-size="11">signal logique 0 / 1</text>
</g>

<!-- Acquérir -->
<rect x="250" y="120" width="140" height="90" rx="10" fill="#123322" stroke="#81fba1" stroke-width="2"/>
<text x="320" y="155" text-anchor="middle" fill="#81fba1" font-size="15" font-weight="700">ACQUÉRIR</text>
<text x="320" y="175" text-anchor="middle" fill="#e4eaf5" font-size="11">entrées A1 et D2</text>
<text x="320" y="191" text-anchor="middle" fill="#e4eaf5" font-size="11">CAN 10 bits (0-1023)</text>
<line x1="220" y1="122" x2="250" y2="140" stroke="#61dafb" stroke-width="2.5" marker-end="url(#fl)"/>
<line x1="220" y1="208" x2="250" y2="190" stroke="#61dafb" stroke-width="2.5" marker-end="url(#fl)"/>

<!-- Traiter -->
<rect x="430" y="120" width="160" height="90" rx="10" fill="#173666" stroke="#61dafb" stroke-width="2"/>
<text x="510" y="150" text-anchor="middle" fill="#61dafb" font-size="15" font-weight="700">TRAITER</text>
<text x="510" y="169" text-anchor="middle" fill="#e4eaf5" font-size="11">microcontrôleur + programme</text>
<text x="510" y="185" text-anchor="middle" fill="#ffd66b" font-size="11">seuils : 100 et 150 km/h</text>
<text x="510" y="201" text-anchor="middle" fill="#e4eaf5" font-size="11">+ mémoire de l'acquittement</text>
<line x1="390" y1="165" x2="430" y2="165" stroke="#61dafb" stroke-width="2.5" marker-end="url(#fl)"/>
<text x="410" y="156" text-anchor="middle" fill="#9bbefc" font-size="10">données</text>

<!-- Communiquer -->
<rect x="630" y="120" width="160" height="90" rx="10" fill="#2b1a3f" stroke="#c68ef2" stroke-width="2"/>
<text x="710" y="150" text-anchor="middle" fill="#c68ef2" font-size="15" font-weight="700">COMMUNIQUER</text>
<text x="710" y="169" text-anchor="middle" fill="#e4eaf5" font-size="11">LCD : niveau + vitesse</text>
<text x="710" y="185" text-anchor="middle" fill="#e4eaf5" font-size="11">DEL rouge · buzzer</text>
<text x="710" y="201" text-anchor="middle" fill="#e4eaf5" font-size="11">vers l'agent d'accueil</text>
<line x1="590" y1="165" x2="630" y2="165" stroke="#61dafb" stroke-width="2.5" marker-end="url(#fl)"/>
<text x="610" y="156" text-anchor="middle" fill="#9bbefc" font-size="10">décision</text>
<path d="M790 165 L 830 165" stroke="#c68ef2" stroke-width="2.5" marker-end="url(#flv)"/>
<text x="838" y="150" fill="#e4eaf5" font-size="22">👤</text>
<text x="845" y="185" text-anchor="middle" fill="#9bbefc" font-size="10">agent</text>

<!-- Flèche d'ORDRE -->
<path d="M510 210 L 510 330" stroke="#ffd66b" stroke-width="6" marker-end="url(#flo)"/>
<rect x="524" y="240" width="180" height="58" rx="8" fill="rgba(255,214,107,.1)" stroke="#ffd66b"/>
<text x="614" y="263" text-anchor="middle" fill="#ffd66b" font-size="13" font-weight="700">l'ORDRE descend</text>
<text x="614" y="281" text-anchor="middle" fill="#e4eaf5" font-size="11">la commande pilote la puissance</text>

<!-- Bandeau énergie -->
<rect x="20" y="330" width="860" height="150" rx="12" fill="rgba(255,180,84,.05)" stroke="#ffb454" stroke-dasharray="6 4"/>
<text x="40" y="354" fill="#ffb454" font-size="14" font-weight="700">CHAÎNE D'ÉNERGIE — en BAS (elle obéit)</text>

<g>
  <rect x="60" y="372" width="160" height="80" rx="10" fill="#3a2412" stroke="#ffb454" stroke-width="2"/>
  <text x="140" y="402" text-anchor="middle" fill="#ffb454" font-size="14" font-weight="700">ALIMENTER</text>
  <text x="140" y="422" text-anchor="middle" fill="#e4eaf5" font-size="11">USB de l'ordinateur</text>
  <text x="140" y="438" text-anchor="middle" fill="#e4eaf5" font-size="11">5 V — très basse tension</text>

  <rect x="290" y="372" width="160" height="80" rx="10" fill="#3a2412" stroke="#ffb454" stroke-width="2"/>
  <text x="370" y="402" text-anchor="middle" fill="#ffb454" font-size="14" font-weight="700">DISTRIBUER</text>
  <text x="370" y="422" text-anchor="middle" fill="#e4eaf5" font-size="11">le shield Grove répartit</text>
  <text x="370" y="438" text-anchor="middle" fill="#e4eaf5" font-size="11">le 5 V vers chaque module</text>

  <rect x="520" y="372" width="180" height="80" rx="10" fill="#3a2412" stroke="#ffb454" stroke-width="2"/>
  <text x="610" y="402" text-anchor="middle" fill="#ffb454" font-size="14" font-weight="700">CONVERTIR</text>
  <text x="610" y="422" text-anchor="middle" fill="#e4eaf5" font-size="11">électricité → lumière (DEL)</text>
  <text x="610" y="438" text-anchor="middle" fill="#e4eaf5" font-size="11">électricité → son (buzzer)</text>

  <line x1="220" y1="412" x2="290" y2="412" stroke="#ffb454" stroke-width="3" marker-end="url(#fle)"/>
  <line x1="450" y1="412" x2="520" y2="412" stroke="#ffb454" stroke-width="3" marker-end="url(#fle)"/>
  <path d="M700 412 L 760 412" stroke="#ffb454" stroke-width="3" marker-end="url(#fle)"/>
  <text x="800" y="405" text-anchor="middle" fill="#e4eaf5" font-size="12" font-weight="700">action :</text>
  <text x="800" y="422" text-anchor="middle" fill="#e4eaf5" font-size="11">lumière + son</text>
  <text x="800" y="438" text-anchor="middle" fill="#e4eaf5" font-size="11">d'alerte</text>
</g>

<text x="450" y="505" text-anchor="middle" fill="#9bbefc" font-size="12" font-style="italic">📐 L'INFORMATION en haut, l'ÉNERGIE en bas, la flèche d'ORDRE qui descend : la disposition montre qui commande.</text>

<defs>
  <marker id="fl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#61dafb"/></marker>
  <marker id="flv" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#c68ef2"/></marker>
  <marker id="flo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#ffd66b"/></marker>
  <marker id="fle" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#ffb454"/></marker>
</defs>
</svg>
