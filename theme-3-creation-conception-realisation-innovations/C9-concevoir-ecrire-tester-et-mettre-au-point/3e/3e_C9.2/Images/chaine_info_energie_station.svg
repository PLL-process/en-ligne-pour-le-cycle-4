<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t-chaine d-chaine">
<title id="t-chaine">Chaînes d'information et d'énergie de la station d'alerte : l'information en haut, l'énergie en bas, la flèche d'ordre qui descend sur CONVERTIR</title>
<desc id="d-chaine">Schéma bloc à lire, disposé selon la convention du dépôt.

En haut, la chaîne d'information. Deux entrées à gauche : le vent, grandeur physique lue par l'anémomètre simulé sur A1 sous forme de signal analogique 0-5 V ; et l'appui de l'agent sur le bouton d'acquittement D2, signal logique 0 ou 1. Ces deux entrées arrivent au bloc ACQUÉRIR (entrées A1 et D2, convertisseur analogique-numérique 10 bits, 0 à 1023). Une flèche portant l'étiquette « données » mène au bloc TRAITER (microcontrôleur et programme, seuils 63, 118 et 178 kilomètres par heure, plus la mémoire de l'acquittement). Une flèche portant l'étiquette « décisions » mène au bloc COMMUNIQUER (écran LCD affichant le niveau et la vitesse, quatre voyants vert, jaune, orange et rouge, buzzer), lui-même tourné vers l'agent d'accueil.

Entre les deux chaînes, une grande flèche jaune descend du bloc TRAITER et vient se poser précisément sur le bloc CONVERTIR : c'est l'ORDRE, la commande. Une note explique pourquoi elle atterrit là : dans cette station, il n'y a pas de préactionneur séparé — la broche du microcontrôleur alimente directement le voyant et le buzzer. La commande et la puissance passent par le même fil, ce qui n'est possible que parce que la puissance en jeu est minuscule.

En bas, la chaîne d'énergie, de gauche à droite : ALIMENTER (USB de l'ordinateur, 5 V, très basse tension) ; DISTRIBUER (le shield Grove répartit le 5 V vers chaque module) ; CONVERTIR (électricité vers lumière pour les voyants, électricité vers son pour le buzzer). Un quatrième bloc, TRANSMETTRE, est dessiné en pointillés et grisé : il est ABSENT de cette station. Une note l'explique : transmettre, c'est acheminer un mouvement — engrenages, courroie, axe — et ici rien ne bouge. Une station qui ouvrirait un volet anticyclonique, elle, aurait besoin de ce bloc.

Une phrase conclut : l'information en haut, l'énergie en bas, la flèche d'ordre qui descend — la disposition montre qui commande.</desc>
<rect width="1000" height="570" fill="#050f24"/>
<text x="500" y="30" text-anchor="middle" fill="#81aaff" font-size="20" font-weight="700">La station d'alerte : deux chaînes, une convention</text>

