<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 812" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t-montage d-montage">
<title id="t-montage">Montage de la station d'alerte cyclonique : Arduino UNO avec shield Grove, deux entrées, l'écran LCD, le buzzer et quatre voyants</title>
<desc id="d-montage">Schéma de câblage à lire, de haut en bas. En haut, les deux entrées : le potentiomètre qui simule l'anémomètre, branché sur A1 (entrée analogique, 0 à 1023), et le bouton d'acquittement, branché sur D2 (entrée logique, 0 ou 1). Au centre, la carte Arduino UNO surmontée de son shield Grove, sélecteur sur 5 V ; à sa gauche, le câble USB vers l'ordinateur apporte l'énergie en 5 volts et le programme. Sous la carte, deux sorties : l'écran LCD RGB, branché sur un connecteur I2C, qui affiche le niveau et la vitesse, et le buzzer, branché sur D5, qui sonne en ouragan majeur seulement et s'acquitte par le bouton. En bas, les quatre voyants, un seul allumé à la fois : vert sur D6 pour la veille, fixe ; jaune sur D7 pour la tempête tropicale ; orange sur D3 pour l'ouragan ; rouge sur D4 pour l'ouragan majeur ; les trois derniers pulsent. Une légende distingue les câbles de signal, le câble I2C et le câble USB d'énergie. Un encadré rappelle : très basse tension 5 volts uniquement, jamais de secteur 230 volts, câblage vérifié avant de brancher l'USB.</desc>
<rect width="600" height="812" fill="#050f24"/>
<text x="300" y="36" text-anchor="middle" fill="#81aaff" font-size="23" font-weight="700">Le montage de la station — qui se branche où ?</text>

