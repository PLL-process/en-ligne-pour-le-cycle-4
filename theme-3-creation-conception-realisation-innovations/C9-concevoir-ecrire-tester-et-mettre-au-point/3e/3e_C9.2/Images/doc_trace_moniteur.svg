<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 433" width="350" height="433" role="img" aria-labelledby="t_trace_moniteur d_trace_moniteur" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_trace_moniteur">La trace du moniteur série</title>
<desc id="d_trace_moniteur">La trace du moniteur série, trois lignes écrites par la station pendant que le potentiomètre tourne : vent 71 kilomètres par heure, niveau 0 ; vent 95 kilomètres par heure, niveau 0 ; vent 131 kilomètres par heure, niveau 2. Le cahier des charges : niveau 0 veille en dessous de 63 kilomètres par heure, niveau 1 tempête tropicale à partir de 63, niveau 2 ouragan à partir de 118, niveau 3 ouragan majeur à partir de 178.</desc>
<rect width="350" height="433" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">La trace du moniteur série</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Le potentiomètre tourne lentement :</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">trois lignes écrites par la station.</text>
<rect x="14.0" y="87.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Ce qu'affiche le moniteur</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">vent(km/h)=71 niveau=0</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">vent(km/h)=95 niveau=0</text>
<text x="26.0" y="186.4" font-size="15" fill="#e4eaf5">vent(km/h)=131 niveau=2</text>
<rect x="14.0" y="214.4" width="322.0" height="132.0" rx="12" fill="#0d2347" stroke="#ffb454" stroke-width="1.8"/>
<text x="26.0" y="244.4" font-size="16" fill="#ffb454" font-weight="700">Ce que veut le cahier des charges</text>
<text x="26.0" y="271.4" font-size="15" fill="#e4eaf5">niveau 0 : veille, sous 63 km/h</text>
<text x="26.0" y="292.4" font-size="15" fill="#e4eaf5">niveau 1 : tempête tropicale, dès 63 km/h</text>
<text x="26.0" y="313.4" font-size="15" fill="#e4eaf5">niveau 2 : ouragan, dès 118 km/h</text>
<text x="26.0" y="334.4" font-size="15" fill="#e4eaf5">niveau 3 : ouragan majeur, dès 178 km/h</text>
<text x="14.0" y="376.6" font-size="13.5" fill="#9bbefc">km/h : kilomètre par heure · moniteur série : la</text>
<text x="14.0" y="394.8" font-size="13.5" fill="#9bbefc">fenêtre où le programme écrit ce qu'il mesure, et</text>
<text x="14.0" y="413.0" font-size="13.5" fill="#9bbefc">le niveau qu'il choisit.</text>
</svg>
