<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 650" width="350" height="650" role="img" aria-labelledby="t_recette_groupe d_recette_groupe" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_recette_groupe">La recette d'un groupe</title>
<desc id="d_recette_groupe">La recette d'un groupe, treize essais au banc, avec pour chacun l'attendu écrit avant et l'observé pendant l'essai. Niveaux : 0 : veille · 1 : tempête tropicale · 2 : ouragan · 3 : ouragan majeur. Essai 1, 40 kilomètres par heure : attendu niveau 0, observé niveau 0. Essai 2, 90 kilomètres par heure : attendu niveau 1, observé niveau 1. Essai 3, 150 kilomètres par heure : attendu niveau 2, observé niveau 2. Essai 4, 200 kilomètres par heure : attendu niveau 3, observé niveau 3. Essai 5, 62 kilomètres par heure : attendu niveau 0, observé niveau 0. Essai 6, 63 kilomètres par heure : attendu niveau 1, observé niveau 1. Essai 7, 117 kilomètres par heure : attendu niveau 1, observé niveau 1. Essai 8, 118 kilomètres par heure : attendu niveau 2, observé niveau 1. Essai 9, 177 kilomètres par heure : attendu niveau 2, observé niveau 2. Essai 10, 178 kilomètres par heure : attendu niveau 3, observé niveau 3. Essai 11, chrono : attendu moins d'une seconde, observé 0,4 seconde. Essai 12, appui en alarme : attendu son coupé, observé son coupé. Essai 13, nouvelle alerte : attendu son repart, observé son repart.</desc>
<rect width="350" height="650" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">La recette d'un groupe</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Les treize essais du protocole, au banc :</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">l'attendu écrit avant, l'observé pendant.</text>
<rect x="14.0" y="87.4" width="322.0" height="476.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
