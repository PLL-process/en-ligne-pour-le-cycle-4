<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 585" width="350" height="585" role="img" aria-labelledby="t_familles_valeurs d_familles_valeurs" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_familles_valeurs">Les quatre familles de valeurs</title>
<desc id="d_familles_valeurs">Les quatre types de valeurs de Python. int : le type des nombres entiers, sans virgule. float : le type des nombres à virgule, qu'on écrit avec un point. str : le type des textes. Un texte s'écrit entre guillemets, même s'il ne contient que des chiffres. bool : le type « vrai ou faux » : il n'a que deux valeurs, True (vrai) et False (faux).</desc>
<rect width="350" height="585" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Les quatre familles de valeurs</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Ce que dit chaque type de Python :</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">comment sa valeur s'écrit.</text>
<rect x="14.0" y="87.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">int</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">Le type des nombres entiers, sans</text>
<text x="26.0" y="165.4" font-size="15" fill="#e4eaf5">virgule.</text>
<rect x="14.0" y="193.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="223.4" font-size="16" fill="#61dafb" font-weight="700">float</text>
<text x="26.0" y="250.4" font-size="15" fill="#e4eaf5">Le type des nombres à virgule, qu'on</text>
<text x="26.0" y="271.4" font-size="15" fill="#e4eaf5">écrit avec un point.</text>
<rect x="14.0" y="299.4" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="329.4" font-size="16" fill="#61dafb" font-weight="700">str</text>
<text x="26.0" y="356.4" font-size="15" fill="#e4eaf5">Le type des textes. Un texte s'écrit</text>
<text x="26.0" y="377.4" font-size="15" fill="#e4eaf5">entre guillemets, même s'il ne contient</text>
<text x="26.0" y="398.4" font-size="15" fill="#e4eaf5">que des chiffres.</text>
<rect x="14.0" y="426.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="456.4" font-size="16" fill="#61dafb" font-weight="700">bool</text>
<text x="26.0" y="483.4" font-size="15" fill="#e4eaf5">Le type « vrai ou faux » : il n'a que deux</text>
<text x="26.0" y="504.4" font-size="15" fill="#e4eaf5">valeurs, True (vrai) et False (faux).</text>
<text x="14.0" y="546.6" font-size="13.5" fill="#9bbefc">Le document ne range aucune valeur : c'est la</text>
<text x="14.0" y="564.8" font-size="13.5" fill="#9bbefc">question.</text>
</svg>
