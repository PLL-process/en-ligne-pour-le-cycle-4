<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 671" width="350" height="671" role="img" aria-labelledby="t_commandes_mbot2 d_commandes_mbot2" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_commandes_mbot2">Six commandes du robot mBot2</title>
<desc id="d_commandes_mbot2">Six commandes du robot mBot2, dont le boîtier à écran s'appelle CyberPi. Écrire, puis passer à la ligne : cyberpi.console.println(x). Allumer ses lumières : cyberpi.led.on(r, v, b, "all"). Avancer : cyberpi.mbot2.forward(speed=V, run_time=T). Tourner sur place : cyberpi.mbot2.turn(angle, speed=V). Arrêter les moteurs : cyberpi.mbot2.EM_stop(port="all"). Mesurer la distance devant lui : cyberpi.ultrasonic2.get(index=1).</desc>
<rect width="350" height="671" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Six commandes du robot mBot2</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">Extrait de l'aide-mémoire du TP : ce que</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">fait le robot, et la commande Python.</text>
<rect x="14.0" y="87.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="117.4" font-size="16" fill="#61dafb" font-weight="700">Écrire, puis passer à la ligne</text>
<text x="26.0" y="144.4" font-size="15" fill="#e4eaf5">cyberpi.console.println(x)</text>
<rect x="14.0" y="172.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="202.4" font-size="16" fill="#61dafb" font-weight="700">Allumer ses lumières</text>
<text x="26.0" y="229.4" font-size="15" fill="#e4eaf5">cyberpi.led.on(r, v, b, "all")</text>
<rect x="14.0" y="257.4" width="322.0" height="90.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="287.4" font-size="16" fill="#61dafb" font-weight="700">Avancer</text>
<text x="26.0" y="314.4" font-size="15" fill="#e4eaf5">cyberpi.mbot2.forward(speed=V,</text>
<text x="26.0" y="335.4" font-size="15" fill="#e4eaf5">run_time=T)</text>
<rect x="14.0" y="363.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="393.4" font-size="16" fill="#61dafb" font-weight="700">Tourner sur place</text>
<text x="26.0" y="420.4" font-size="15" fill="#e4eaf5">cyberpi.mbot2.turn(angle, speed=V)</text>
<rect x="14.0" y="448.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="478.4" font-size="16" fill="#61dafb" font-weight="700">Arrêter les moteurs</text>
<text x="26.0" y="505.4" font-size="15" fill="#e4eaf5">cyberpi.mbot2.EM_stop(port="all")</text>
<rect x="14.0" y="533.4" width="322.0" height="69.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="563.4" font-size="16" fill="#61dafb" font-weight="700">Mesurer la distance devant lui</text>
<text x="26.0" y="590.4" font-size="15" fill="#e4eaf5">cyberpi.ultrasonic2.get(index=1)</text>
<text x="14.0" y="632.6" font-size="13.5" fill="#9bbefc">Le document ne dit pas quel élément du robot est</text>
<text x="14.0" y="650.8" font-size="13.5" fill="#9bbefc">un capteur ou un actionneur : c'est la question.</text>
</svg>
