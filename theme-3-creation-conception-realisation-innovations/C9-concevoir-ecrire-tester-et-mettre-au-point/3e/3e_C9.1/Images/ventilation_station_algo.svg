<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">De l'algorithme au programme structuré : la ventilation de la station de métro</title>
  <desc id="d">À gauche, l'algorithme en français de la ventilation d'une station de métro new-yorkaise : lire la qualité de l'air ; si l'air est mauvais (indice supérieur à 100), ventiler à fond ; sinon si un train arrive, ventiler moyen ; sinon ventiler doucement. Au centre, le programme Python structuré correspondant, avec une fonction vitesse_ventilation qui reçoit la variable air et la variable train_arrive et renvoie la vitesse : def vitesse_ventilation(air, train_arrive) : si air supérieur à 100, renvoyer 3 ; sinon si train_arrive, renvoyer 2 ; sinon renvoyer 1. À droite, le banc de mise au point : quatre tests couvrent les cas air pollué, train qui arrive, nuit calme, et le cas limite air exactement égal à 100 — chaque test compare le résultat obtenu au résultat attendu. Message clé : un programme n'est pas fini quand il « marche une fois », il est fini quand il passe TOUS les tests, y compris les cas limites.</desc>
  <rect width="940" height="560" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="18" font-weight="bold" text-anchor="middle">Du besoin au programme TESTÉ — la ventilation de la station 96 St</text>

  <!-- algorithme -->
  <text x="40" y="64" fill="#61dafb" font-size="13" font-weight="bold">1️⃣ L'ALGORITHME (en français)</text>
  <rect x="30" y="76" width="260" height="200" rx="10" fill="#0d2347" stroke="#61dafb" stroke-width="2"/>
  <g font-size="11.5" fill="#e4eaf5">
    <text x="46" y="102">Lire la qualité de l'air (indice)</text>
    <text x="46" y="128"><tspan fill="#ffd66b" font-weight="bold">SI</tspan> air &gt; 100 (pollué) :</text>
    <text x="62" y="146">→ ventiler À FOND (3)</text>
    <text x="46" y="172"><tspan fill="#ffd66b" font-weight="bold">SINON SI</tspan> un train arrive :</text>
    <text x="62" y="190">→ ventiler MOYEN (2)</text>
    <text x="46" y="216"><tspan fill="#ffd66b" font-weight="bold">SINON</tspan> :</text>
    <text x="62" y="234">→ ventiler DOUCEMENT (1)</text>
    <text x="46" y="262" fill="#9bbefc" font-size="10">…et on recommence, sans fin.</text>
  </g>

  <!-- programme -->
  <text x="330" y="64" fill="#c68ef2" font-size="13" font-weight="bold">2️⃣ LE PROGRAMME STRUCTURÉ (une fonction)</text>
  <rect x="320" y="76" width="300" height="200" rx="10" fill="#08132c" stroke="#c68ef2" stroke-width="2"/>
  <g font-family="monospace" font-size="12.5">
    <text x="336" y="104" fill="#c68ef2">def <tspan fill="#61dafb">vitesse_ventilation</tspan><tspan fill="#e4eaf5">(air, train_arrive):</tspan></text>
    <text x="356" y="130" fill="#ffd66b">if <tspan fill="#e4eaf5">air &gt; 100:</tspan></text>
    <text x="376" y="152" fill="#e4eaf5">return 3</text>
    <text x="356" y="178" fill="#ffd66b">elif <tspan fill="#e4eaf5">train_arrive:</tspan></text>
    <text x="376" y="200" fill="#e4eaf5">return 2</text>
    <text x="356" y="226" fill="#ffd66b">else<tspan fill="#e4eaf5">:</tspan></text>
    <text x="376" y="248" fill="#e4eaf5">return 1</text>
  </g>
  <text x="470" y="296" fill="#9bbefc" font-size="10.5" text-anchor="middle">la fonction reçoit des variables, RENVOIE un résultat — on peut l'appeler mille fois</text>

  <!-- banc de tests -->
  <text x="660" y="64" fill="#81fba1" font-size="13" font-weight="bold">3️⃣ LE BANC DE MISE AU POINT</text>
  <rect x="650" y="76" width="260" height="230" rx="10" fill="#0d2347" stroke="#81fba1" stroke-width="2"/>
  <g font-size="10.5">
    <text x="666" y="100" fill="#61dafb" font-weight="bold">air</text><text x="726" y="100" fill="#61dafb" font-weight="bold">train</text><text x="786" y="100" fill="#61dafb" font-weight="bold">attendu</text><text x="860" y="100" fill="#61dafb" font-weight="bold">obtenu</text>
    <line x1="660" y1="108" x2="900" y2="108" stroke="#274a8a"/>
    <text x="666" y="128" fill="#e4eaf5">150</text><text x="726" y="128" fill="#e4eaf5">non</text><text x="786" y="128" fill="#e4eaf5">3</text><text x="860" y="128" fill="#81fba1" font-weight="bold">3 ✔</text>
    <text x="666" y="152" fill="#e4eaf5">60</text><text x="726" y="152" fill="#e4eaf5">oui</text><text x="786" y="152" fill="#e4eaf5">2</text><text x="860" y="152" fill="#81fba1" font-weight="bold">2 ✔</text>
    <text x="666" y="176" fill="#e4eaf5">40</text><text x="726" y="176" fill="#e4eaf5">non</text><text x="786" y="176" fill="#e4eaf5">1</text><text x="860" y="176" fill="#81fba1" font-weight="bold">1 ✔</text>
    <text x="666" y="200" fill="#ffd66b" font-weight="bold">100</text><text x="726" y="200" fill="#e4eaf5">non</text><text x="786" y="200" fill="#ffd66b" font-weight="bold">?</text><text x="860" y="200" fill="#ff7b88" font-weight="bold">1 ⚠</text>
    <text x="666" y="230" fill="#ffd66b" font-size="10">⚠ le CAS LIMITE : 100, c'est pollué</text>
    <text x="666" y="246" fill="#ffd66b" font-size="10">ou pas ? air &gt; 100 dit NON…</text>
    <text x="666" y="262" fill="#9bbefc" font-size="10">C'est le CAHIER DES CHARGES qui</text>
    <text x="666" y="278" fill="#9bbefc" font-size="10">tranche — puis on corrige (&gt;=) et</text>
    <text x="666" y="294" fill="#9bbefc" font-size="10">on REJOUE TOUS les tests.</text>
  </g>

  <!-- flèches -->
  <g stroke="#61dafb" stroke-width="3" fill="#61dafb">
    <line x1="290" y1="176" x2="312" y2="176"/><path d="M312 171 l12 5 l-12 5 z"/>
    <line x1="620" y1="176" x2="642" y2="176"/><path d="M642 171 l12 5 l-12 5 z"/>
  </g>

  <!-- règle -->
  <rect x="30" y="340" width="880" height="150" rx="12" fill="#173666" stroke="#274a8a"/>
  <text x="50" y="370" fill="#e4eaf5" font-size="13"><tspan fill="#61dafb" font-weight="bold">Élaborer :</tspan> j'écris d'abord l'ALGORITHME en français — les variables dont j'ai besoin, les conditions, dans le bon ordre.</text>
  <text x="50" y="398" fill="#e4eaf5" font-size="13"><tspan fill="#c68ef2" font-weight="bold">Traduire :</tspan> je transforme en programme STRUCTURÉ — une fonction par tâche, qui reçoit des variables et renvoie un résultat.</text>
  <text x="50" y="426" fill="#e4eaf5" font-size="13"><tspan fill="#81fba1" font-weight="bold">Mettre au point :</tspan> je TESTE avec un banc de tests écrit À L'AVANCE — cas normaux ET cas limites.</text>
  <text x="50" y="462" fill="#ffd66b" font-size="12.5" font-weight="bold">Un programme n'est pas fini quand il « marche une fois » : il est fini quand il passe TOUS les tests.</text>
  <text x="470" y="528" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">La vraie ventilation du métro de New York brasse l'air de 472 stations — et son programme a, lui aussi, commencé par un algorithme.</text>
