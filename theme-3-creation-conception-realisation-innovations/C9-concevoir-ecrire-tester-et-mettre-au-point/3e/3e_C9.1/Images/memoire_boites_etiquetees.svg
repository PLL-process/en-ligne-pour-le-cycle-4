<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Une variable est une boîte étiquetée dans la mémoire de l'ordinateur</title>
  <desc id="d">Schéma en trois temps. À gauche, le programme Python : ligne 1, train égale "Q" ; ligne 2, minutes égale 4 ; ligne 3, minutes égale minutes moins 1. Au centre, la mémoire de l'ordinateur représentée comme une armoire de boîtes étiquetées : une boîte porte l'étiquette train et contient le texte "Q" entre guillemets ; une boîte porte l'étiquette minutes et contient d'abord le nombre 4, puis son contenu est remplacé par 3 après la ligne 3 — l'ancienne valeur est perdue. À droite, le panneau d'affichage du quai utilise les boîtes : il affiche Q — 3 min. Règle clé en bas : affecter, c'est REMPLACER le contenu de la boîte ; l'étiquette ne change jamais, le contenu si.</desc>
  <rect width="940" height="540" fill="#050f24"/>
  <text x="470" y="32" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">La variable : une BOÎTE ÉTIQUETÉE dans la mémoire</text>

  <!-- programme -->
  <text x="40" y="70" fill="#61dafb" font-size="14" font-weight="bold">1️⃣ LE PROGRAMME</text>
  <rect x="30" y="84" width="270" height="130" rx="10" fill="#08132c" stroke="#274a8a" stroke-width="2"/>
  <g font-family="monospace" font-size="14">
    <text x="46" y="112" fill="#5b7bb8">1</text><text x="66" y="112" fill="#e4eaf5">train = <tspan fill="#ffd66b">"Q"</tspan></text>
    <text x="46" y="140" fill="#5b7bb8">2</text><text x="66" y="140" fill="#e4eaf5">minutes = <tspan fill="#81fba1">4</tspan></text>
    <text x="46" y="168" fill="#5b7bb8">3</text><text x="66" y="168" fill="#e4eaf5">minutes = minutes - 1</text>
    <text x="46" y="196" fill="#5b7bb8">4</text><text x="66" y="196" fill="#e4eaf5">print(train, minutes)</text>
  </g>

  <!-- mémoire -->
  <text x="360" y="70" fill="#c68ef2" font-size="14" font-weight="bold">2️⃣ LA MÉMOIRE = des boîtes étiquetées</text>
  <rect x="350" y="84" width="300" height="240" rx="12" fill="#0d2347" stroke="#c68ef2" stroke-width="2"/>
  <!-- boîte train -->
  <rect x="380" y="110" width="110" height="80" rx="8" fill="#0a1b3d" stroke="#61dafb" stroke-width="2.5"/>
  <rect x="392" y="98" width="86" height="24" rx="6" fill="#173666" stroke="#61dafb"/>
  <text x="435" y="115" fill="#61dafb" font-size="12" font-weight="bold" text-anchor="middle">train</text>
  <text x="435" y="165" fill="#ffd66b" font-size="20" font-weight="bold" text-anchor="middle" font-family="monospace">"Q"</text>
  <!-- boîte minutes -->
  <rect x="510" y="110" width="110" height="80" rx="8" fill="#0a1b3d" stroke="#81fba1" stroke-width="2.5"/>
  <rect x="516" y="98" width="98" height="24" rx="6" fill="#173666" stroke="#81fba1"/>
  <text x="565" y="115" fill="#81fba1" font-size="12" font-weight="bold" text-anchor="middle">minutes</text>
  <text x="540" y="165" fill="#5b7bb8" font-size="20" text-anchor="middle" font-family="monospace" text-decoration="line-through">4</text>
  <text x="590" y="165" fill="#81fba1" font-size="22" font-weight="bold" text-anchor="middle" font-family="monospace">3</text>
  <text x="565" y="215" fill="#ff7b88" font-size="10.5" text-anchor="middle">ligne 3 : le 4 est REMPLACÉ par 3</text>
  <text x="565" y="231" fill="#ff7b88" font-size="10.5" text-anchor="middle">(l'ancienne valeur est perdue)</text>
  <text x="500" y="290" fill="#9bbefc" font-size="11" text-anchor="middle">l'ÉTIQUETTE ne change jamais —</text>
  <text x="500" y="306" fill="#9bbefc" font-size="11" text-anchor="middle">le CONTENU, si</text>

  <!-- panneau -->
  <text x="710" y="70" fill="#ffd66b" font-size="14" font-weight="bold">3️⃣ LE PANNEAU DU QUAI</text>
  <rect x="700" y="84" width="210" height="130" rx="10" fill="#111" stroke="#ffd66b" stroke-width="3"/>
  <circle cx="740" cy="130" r="22" fill="#ffd66b"/>
  <text x="740" y="139" fill="#111" font-size="24" font-weight="bold" text-anchor="middle">Q</text>
  <text x="800" y="140" fill="#ffb454" font-size="26" font-weight="bold" font-family="monospace">3 min</text>
  <text x="805" y="188" fill="#9bbefc" font-size="11" text-anchor="middle">96 St — direction Manhattan</text>

  <!-- flèches -->
  <g stroke="#61dafb" stroke-width="3" fill="#61dafb">
    <line x1="300" y1="150" x2="342" y2="150"/><path d="M342 145 l12 5 l-12 5 z"/>
    <line x1="650" y1="150" x2="692" y2="150"/><path d="M692 145 l12 5 l-12 5 z"/>
  </g>
  <text x="322" y="140" fill="#61dafb" font-size="9">écrit</text>
  <text x="668" y="140" fill="#61dafb" font-size="9">lit</text>

  <!-- règle -->
  <rect x="30" y="360" width="880" height="120" rx="12" fill="#173666" stroke="#274a8a"/>
  <text x="50" y="390" fill="#e4eaf5" font-size="13"><tspan fill="#61dafb" font-weight="bold">Règle n°1 :</tspan> une variable = une boîte avec une ÉTIQUETTE (son nom) et un CONTENU (sa valeur).</text>
  <text x="50" y="418" fill="#e4eaf5" font-size="13"><tspan fill="#81fba1" font-weight="bold">Règle n°2 :</tspan> le signe <tspan font-family="monospace" fill="#ffd66b">=</tspan> ne veut pas dire « égal » : il veut dire « METS ÇA DANS LA BOÎTE » (affecter = remplacer le contenu).</text>
  <text x="50" y="446" fill="#e4eaf5" font-size="13"><tspan fill="#ff7b88" font-weight="bold">Règle n°3 :</tspan> <tspan font-family="monospace" fill="#e4eaf5">minutes = minutes - 1</tspan> se lit DE DROITE À GAUCHE : je calcule d'abord (3), puis je range le résultat dans la boîte.</text>
  <text x="470" y="516" fill="#5b7bb8" font-size="11.5" text-anchor="middle" font-style="italic">À toi de lire : après la ligne 3, que contient chaque boîte ? Et que va afficher la ligne 4 ?</text>
</svg>
