<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="Verdana, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Plan simplifié de la ligne Q du métro de New York — la station 96 St, c'est ici</title>
  <desc id="d">Plan schématique, non à l'échelle, de la ligne Q du métro de New York (couleur jaune, comme sur le vrai plan MTA). Le trajet descend Manhattan du nord au sud puis traverse l'East River par le pont de Manhattan et continue dans Brooklyn jusqu'à la mer. En haut, un grand repère « TU ES ICI » marque la station 96 St, sur la Deuxième Avenue, tout près du Museum Mile et de Central Park : c'est là que le panneau affiche « 412 min ». La ligne dessert ensuite 86 St et 72 St, passe par Lexington Av-63 St, 57 St-7 Av, Times Square-42 St (la place aux écrans géants), 34 St-Herald Square (les grands magasins), 14 St-Union Square (le marché), Canal St (Chinatown), traverse le pont de Manhattan avec vue sur les gratte-ciel, puis dessert Brooklyn : DeKalb Av, Atlantic Av-Barclays Center (la salle de basket), Prospect Park (le grand parc), la ligne Brighton et ses quartiers, Brighton Beach et enfin Coney Island-Stillwell Av : la plage, la fête foraine et l'aquarium. Un encart précise : environ 29 stations, express dans Manhattan, local dans Brooklyn — et une question de lecture : combien de stations séparent 96 St de Times Square ?</desc>
  <rect width="940" height="640" fill="#050f24"/>
  <text x="470" y="30" fill="#81aaff" font-size="19" font-weight="bold" text-anchor="middle">La ligne Q — de la 96e Rue à la plage de Coney Island</text>
  <text x="470" y="50" fill="#5b7bb8" font-size="11" text-anchor="middle" font-style="italic">Plan SIMPLIFIÉ, non à l'échelle — comme tous les plans de métro du monde (règle n°8 : le bon outil pour la bonne question)</text>

  <!-- zones géographiques -->
  <rect x="60" y="66" width="330" height="330" rx="16" fill="#0a1b3d" stroke="#274a8a" stroke-dasharray="7 5"/>
  <text x="286" y="90" fill="#9bbefc" font-size="13" font-weight="bold">MANHATTAN</text>
  <rect x="60" y="428" width="330" height="186" rx="16" fill="#0a1b3d" stroke="#274a8a" stroke-dasharray="7 5"/>
  <text x="80" y="452" fill="#9bbefc" font-size="13" font-weight="bold">BROOKLYN</text>
  <!-- East River -->
  <rect x="60" y="396" width="330" height="32" fill="#0d2f4d"/>
  <text x="80" y="416" fill="#61dafb" font-size="10.5" font-style="italic">🌊 East River — traversée sur le PONT DE MANHATTAN (vue sur les gratte-ciel !)</text>

  <!-- tracé de la ligne Q (jaune MTA) -->
  <path d="M150 108 L150 236 Q150 258 172 264 L268 288 Q290 294 290 316 L290 560 Q290 584 314 584 L352 584"
        stroke="#FCCC0A" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- stations Manhattan -->
  <g font-size="11.5" fill="#e4eaf5">
    <circle cx="150" cy="108" r="9" fill="#050f24" stroke="#FCCC0A" stroke-width="4"/>
    <text x="172" y="105" font-weight="bold" fill="#ffd66b">96 St · 2e Avenue</text>
    <text x="172" y="120" font-size="9.5" fill="#9bbefc">Museum Mile · Central Park à 3 rues</text>
    <circle cx="150" cy="150" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="172" y="154">86 St</text>
    <circle cx="150" cy="186" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="172" y="190">72 St</text>
    <circle cx="150" cy="222" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="172" y="226">Lexington Av–63 St</text>
    <circle cx="188" cy="268" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="204" y="262">57 St–7 Av</text>
    <circle cx="238" cy="281" r="7" fill="#050f24" stroke="#FCCC0A" stroke-width="4"/>
    <text x="212" y="304" font-weight="bold">Times Sq–42 St</text>
    <text x="212" y="318" font-size="9.5" fill="#9bbefc">les écrans géants 🌃</text>
    <circle cx="290" cy="330" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="308" y="330">34 St–Herald Sq <tspan fill="#9bbefc" font-size="9.5">(grands magasins)</tspan></text>
    <circle cx="290" cy="358" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="308" y="358">14 St–Union Sq <tspan fill="#9bbefc" font-size="9.5">(le marché)</tspan></text>
    <circle cx="290" cy="386" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="308" y="386">Canal St <tspan fill="#9bbefc" font-size="9.5">(Chinatown)</tspan></text>
  </g>

  <!-- stations Brooklyn -->
  <g font-size="11.5" fill="#e4eaf5">
    <circle cx="290" cy="444" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="308" y="448">DeKalb Av</text>
    <circle cx="290" cy="474" r="7" fill="#050f24" stroke="#FCCC0A" stroke-width="4"/>
    <text x="308" y="478">Atlantic Av–Barclays Ctr <tspan fill="#9bbefc" font-size="9.5">🏀</tspan></text>
    <circle cx="290" cy="504" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="308" y="508">Prospect Park <tspan fill="#9bbefc" font-size="9.5">🌳</tspan></text>
    <circle cx="290" cy="534" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="308" y="538">Kings Highway <tspan fill="#9bbefc" font-size="9.5">(… la ligne Brighton)</tspan></text>
    <circle cx="290" cy="562" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="308" y="566">Brighton Beach</text>
    <circle cx="352" cy="584" r="9" fill="#050f24" stroke="#FCCC0A" stroke-width="4"/>
    <text x="368" y="580" font-weight="bold" fill="#ffd66b">Coney Island–Stillwell Av</text>
    <text x="368" y="595" font-size="9.5" fill="#9bbefc">🎡 fête foraine · plage · aquarium</text>
  </g>

  <!-- TU ES ICI -->
  <g>
    <path d="M96 78 q10 -26 34 -16 q20 8 12 30 q-6 16 -28 24 l-8 -14 q14 -6 18 -14 q4 -10 -6 -14 q-12 -4 -16 8 z" fill="none"/>
    <circle cx="150" cy="108" r="17" fill="none" stroke="#ff7b88" stroke-width="3">
      <animate attributeName="r" values="14;20;14" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="30" y="60" width="104" height="34" rx="8" fill="#ff7b88"/>
    <text x="82" y="75" fill="#111" font-size="11" font-weight="bold" text-anchor="middle">📍 TU ES ICI</text>
    <text x="82" y="88" fill="#111" font-size="8.5" text-anchor="middle">le panneau « 412 min »</text>
  </g>

  <!-- encart : ce que dessert la ligne -->
  <g font-size="11">
    <rect x="560" y="80" width="350" height="258" rx="12" fill="#0d2347" stroke="#FCCC0A" stroke-width="2"/>
    <text x="580" y="106" fill="#FCCC0A" font-size="13" font-weight="bold">🚇 La ligne Q en bref</text>
    <text x="580" y="132" fill="#e4eaf5">• <tspan fill="#ffd66b">≈ 29 stations</tspan> entre la 96e Rue et l'océan</text>
    <text x="580" y="156" fill="#e4eaf5">• <tspan font-weight="bold">EXPRESS</tspan> dans Manhattan (elle saute des stations),</text>
    <text x="592" y="172" fill="#e4eaf5"><tspan font-weight="bold">LOCAL</tspan> dans Brooklyn (elle les dessert toutes)</text>
    <text x="580" y="196" fill="#e4eaf5">• Elle dessert : les musées de la 5e Avenue</text>
    <text x="592" y="212" fill="#e4eaf5">(le Guggenheim, le Met…), Times Square,</text>
    <text x="592" y="228" fill="#e4eaf5">les grands magasins, Union Square, Chinatown,</text>
    <text x="592" y="244" fill="#e4eaf5">le Barclays Center, Prospect Park…</text>
    <text x="592" y="260" fill="#e4eaf5">et la plage de Coney Island au terminus 🎢</text>
    <text x="580" y="282" fill="#9bbefc" font-size="10">• Le tronçon 96–72 St (2e Avenue) est le plus récent</text>
    <text x="592" y="297" fill="#9bbefc" font-size="10">du métro new-yorkais : ouvert en 2017, après</text>
    <text x="592" y="312" fill="#9bbefc" font-size="10">presque un siècle de projets — la technologie</text>
    <text x="592" y="327" fill="#9bbefc" font-size="10">aussi, ça se planifie, se teste et se met au point !</text>
  </g>

  <!-- légende + question de lecture -->
  <g font-size="11">
    <rect x="560" y="352" width="350" height="120" rx="12" fill="#173666" stroke="#274a8a"/>
    <text x="580" y="378" fill="#61dafb" font-weight="bold">Légende</text>
    <line x1="580" y1="394" x2="620" y2="394" stroke="#FCCC0A" stroke-width="7" stroke-linecap="round"/>
    <text x="630" y="398" fill="#e4eaf5">ligne Q (jaune, comme sur le plan officiel)</text>
    <circle cx="597" cy="418" r="6" fill="#050f24" stroke="#FCCC0A" stroke-width="3.5"/>
    <text x="630" y="422" fill="#e4eaf5">station desservie</text>
    <circle cx="597" cy="444" r="8" fill="none" stroke="#ff7b88" stroke-width="3"/>
    <text x="630" y="448" fill="#e4eaf5">notre station : 96 St, celle du panneau bugué</text>
  </g>
  <g font-size="11.5">
    <rect x="560" y="486" width="350" height="106" rx="12" fill="#0e2e18" stroke="#81fba1" stroke-width="2"/>
    <text x="580" y="508" fill="#81fba1" font-weight="bold">🔎 À toi de lire le plan :</text>
    <text x="580" y="528" fill="#e4eaf5">combien de stations entre 96 St et Times Square ?</text>
    <text x="580" y="548" fill="#e4eaf5">Et si le panneau dit « Q — 3 min », dans combien</text>
    <text x="580" y="564" fill="#e4eaf5">de temps peux-tu être à la plage ?</text>
    <text x="580" y="580" fill="#9bbefc">(indice : ≈ 50 min de trajet)</text>
  </g>

  <text x="470" y="628" fill="#5b7bb8" font-size="10.5" text-anchor="middle" font-style="italic">Schéma original CC0 inspiré des conventions des plans de transport — le vrai plan interactif : mta.info (métro de New York).</text>
</svg>
