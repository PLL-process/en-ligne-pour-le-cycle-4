<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 637" width="350" height="637" role="img" aria-labelledby="t_banc_ventilation d_banc_ventilation" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_banc_ventilation">Le banc de la ventilation</title>
<desc id="d_banc_ventilation">La fonction vitesse_ventilation : si air &gt; 100, elle renvoie 3 ; sinon, si un train arrive, elle renvoie 2 ; sinon, elle renvoie 1. Le banc de quatre tests, écrit avant d'exécuter : T1, heure de pointe polluée : air 150, train_arrive False, attendu 3. T2, un train approche : air 60, train_arrive True, attendu 2. T3, nuit calme : air 40, train_arrive False, attendu 1. T4, le cas limite : air 100, train_arrive False, attendu ?. Le banc ne dit pas ce que la fonction renvoie.</desc>
<rect width="350" height="637" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">Le banc de la ventilation</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">La fonction vitesse_ventilation(air,</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">train_arrive), et les quatre tests</text>
<text x="14.0" y="89.6" font-size="13.5" fill="#9bbefc">écrits avant de l'exécuter.</text>
<rect x="14.0" y="105.6" width="322.0" height="111.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="135.6" font-size="16" fill="#61dafb" font-weight="700">La fonction, dans l'ordre</text>
<text x="26.0" y="162.6" font-size="15" fill="#e4eaf5">Si air &gt; 100, elle renvoie 3.</text>
<text x="26.0" y="183.6" font-size="15" fill="#e4eaf5">Sinon, si un train arrive, elle renvoie 2.</text>
<text x="26.0" y="204.6" font-size="15" fill="#e4eaf5">Sinon, elle renvoie 1.</text>
<rect x="14.0" y="232.6" width="322.0" height="170.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="254.6" font-size="13.5" fill="#61dafb" font-weight="700">Test</text>
<text x="119.0" y="254.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">air</text>
<text x="210.0" y="254.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">train_arrive</text>
<text x="301.0" y="254.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">attendu</text>
<line x1="14" y1="266.6" x2="336" y2="266.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="288.6" font-size="15" fill="#e4eaf5" font-weight="700">T1</text>
<text x="119.0" y="288.6" font-size="15" fill="#e4eaf5" text-anchor="middle">150</text>
<text x="210.0" y="288.6" font-size="15" fill="#e4eaf5" text-anchor="middle">False</text>
<text x="301.0" y="288.6" font-size="15" fill="#e4eaf5" text-anchor="middle">3</text>
<line x1="14" y1="300.6" x2="336" y2="300.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="322.6" font-size="15" fill="#e4eaf5" font-weight="700">T2</text>
<text x="119.0" y="322.6" font-size="15" fill="#e4eaf5" text-anchor="middle">60</text>
<text x="210.0" y="322.6" font-size="15" fill="#e4eaf5" text-anchor="middle">True</text>
<text x="301.0" y="322.6" font-size="15" fill="#e4eaf5" text-anchor="middle">2</text>
<line x1="14" y1="334.6" x2="336" y2="334.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="356.6" font-size="15" fill="#e4eaf5" font-weight="700">T3</text>
<text x="119.0" y="356.6" font-size="15" fill="#e4eaf5" text-anchor="middle">40</text>
<text x="210.0" y="356.6" font-size="15" fill="#e4eaf5" text-anchor="middle">False</text>
<text x="301.0" y="356.6" font-size="15" fill="#e4eaf5" text-anchor="middle">1</text>
<line x1="14" y1="368.6" x2="336" y2="368.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="390.6" font-size="15" fill="#e4eaf5" font-weight="700">T4</text>
<text x="119.0" y="390.6" font-size="15" fill="#e4eaf5" text-anchor="middle">100</text>
<text x="210.0" y="390.6" font-size="15" fill="#e4eaf5" text-anchor="middle">False</text>
<text x="301.0" y="390.6" font-size="15" fill="#e4eaf5" text-anchor="middle">?</text>
<rect x="14.0" y="418.6" width="322.0" height="132.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="448.6" font-size="16" fill="#61dafb" font-weight="700">Ce que vise chaque test</text>
<text x="26.0" y="475.6" font-size="15" fill="#e4eaf5">T1 : heure de pointe polluée.</text>
<text x="26.0" y="496.6" font-size="15" fill="#e4eaf5">T2 : un train approche.</text>
<text x="26.0" y="517.6" font-size="15" fill="#e4eaf5">T3 : nuit calme.</text>
<text x="26.0" y="538.6" font-size="15" fill="#e4eaf5">T4 : le cas limite, air = 100 pile.</text>
<text x="14.0" y="580.8" font-size="13.5" fill="#9bbefc">air : un indice de qualité de l'air, de simulation ·</text>
<text x="14.0" y="599.0" font-size="13.5" fill="#9bbefc">Le document ne dit pas ce que la fonction</text>
<text x="14.0" y="617.3" font-size="13.5" fill="#9bbefc">renvoie : c'est la question.</text>
</svg>
