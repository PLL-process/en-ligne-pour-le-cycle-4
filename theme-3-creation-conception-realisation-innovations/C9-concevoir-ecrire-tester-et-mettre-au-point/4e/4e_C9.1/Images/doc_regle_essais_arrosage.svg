<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 894" width="350" height="894" role="img" aria-labelledby="t_regle_essais_arrosage d_regle_essais_arrosage" font-family="Segoe UI, system-ui, sans-serif">
<title id="t_regle_essais_arrosage">La règle et ses six essais</title>
<desc id="d_regle_essais_arrosage">La règle d'arrosage, ligne par ligne : SEUIL = 40 ; lire humidité → H ; lire heure → heure ; SI H &lt; SEUIL ET heure &gt;= 6 ET heure &lt;= 10 ALORS ; allumer pompe ; SINON ; éteindre pompe ; FIN SI. Le tableau de six essais : Essai 1, sol sec, le matin : H = 25, 8 h. Essai 2, sol humide, le matin : H = 55, 8 h. Essai 3, sol sec, mais la nuit : H = 25, 23 h. Essai 4, frontière — juste sous le seuil : H = 39, 7 h. Essai 5, frontière — sur le seuil pile : H = 40, 7 h. Essai 6, absurde — capteur débranché : H = 250, 8 h. Le document ne dit pas ce que fait la pompe.</desc>
<rect width="350" height="894" rx="14" fill="#0a1b3d"/>
<text x="14.0" y="31.9" font-size="17" fill="#e4eaf5" font-weight="700">La règle et ses six essais</text>
<text x="14.0" y="53.1" font-size="13.5" fill="#9bbefc">La règle d'arrosage du jardin, avec sa</text>
<text x="14.0" y="71.4" font-size="13.5" fill="#9bbefc">plage horaire, et le tableau d'essais</text>
<text x="14.0" y="89.6" font-size="13.5" fill="#9bbefc">écrit avant de lancer le programme.</text>
<rect x="14.0" y="105.6" width="322.0" height="258.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="135.6" font-size="16" fill="#61dafb" font-weight="700">La règle</text>
<text x="26.0" y="162.6" font-size="15" fill="#e4eaf5">SEUIL = 40</text>
<text x="26.0" y="183.6" font-size="15" fill="#e4eaf5">lire humidité → H</text>
<text x="26.0" y="204.6" font-size="15" fill="#e4eaf5">lire heure → heure</text>
<text x="26.0" y="225.6" font-size="15" fill="#e4eaf5">SI H &lt; SEUIL</text>
<text x="26.0" y="246.6" font-size="15" fill="#e4eaf5">ET heure &gt;= 6</text>
<text x="26.0" y="267.6" font-size="15" fill="#e4eaf5">ET heure &lt;= 10 ALORS</text>
<text x="26.0" y="288.6" font-size="15" fill="#e4eaf5">allumer pompe</text>
<text x="26.0" y="309.6" font-size="15" fill="#e4eaf5">SINON</text>
<text x="26.0" y="330.6" font-size="15" fill="#e4eaf5">éteindre pompe</text>
<text x="26.0" y="351.6" font-size="15" fill="#e4eaf5">FIN SI</text>
<rect x="14.0" y="379.6" width="322.0" height="238.0" rx="10" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="24.0" y="401.6" font-size="13.5" fill="#61dafb" font-weight="700">Essai</text>
<text x="149.0" y="401.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">H</text>
<text x="270.0" y="401.6" font-size="13.5" fill="#61dafb" font-weight="700" text-anchor="middle">heure</text>
<line x1="14" y1="413.6" x2="336" y2="413.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="435.6" font-size="15" fill="#e4eaf5" font-weight="700">1</text>
<text x="149.0" y="435.6" font-size="15" fill="#e4eaf5" text-anchor="middle">25</text>
<text x="270.0" y="435.6" font-size="15" fill="#e4eaf5" text-anchor="middle">8 h</text>
<line x1="14" y1="447.6" x2="336" y2="447.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="469.6" font-size="15" fill="#e4eaf5" font-weight="700">2</text>
<text x="149.0" y="469.6" font-size="15" fill="#e4eaf5" text-anchor="middle">55</text>
<text x="270.0" y="469.6" font-size="15" fill="#e4eaf5" text-anchor="middle">8 h</text>
<line x1="14" y1="481.6" x2="336" y2="481.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="503.6" font-size="15" fill="#e4eaf5" font-weight="700">3</text>
<text x="149.0" y="503.6" font-size="15" fill="#e4eaf5" text-anchor="middle">25</text>
<text x="270.0" y="503.6" font-size="15" fill="#e4eaf5" text-anchor="middle">23 h</text>
<line x1="14" y1="515.6" x2="336" y2="515.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="537.6" font-size="15" fill="#e4eaf5" font-weight="700">4</text>
<text x="149.0" y="537.6" font-size="15" fill="#e4eaf5" text-anchor="middle">39</text>
<text x="270.0" y="537.6" font-size="15" fill="#e4eaf5" text-anchor="middle">7 h</text>
<line x1="14" y1="549.6" x2="336" y2="549.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="571.6" font-size="15" fill="#e4eaf5" font-weight="700">5</text>
<text x="149.0" y="571.6" font-size="15" fill="#e4eaf5" text-anchor="middle">40</text>
<text x="270.0" y="571.6" font-size="15" fill="#e4eaf5" text-anchor="middle">7 h</text>
<line x1="14" y1="583.6" x2="336" y2="583.6" stroke="#274a8a" stroke-width="1"/>
<text x="24.0" y="605.6" font-size="15" fill="#e4eaf5" font-weight="700">6</text>
<text x="149.0" y="605.6" font-size="15" fill="#e4eaf5" text-anchor="middle">250</text>
<text x="270.0" y="605.6" font-size="15" fill="#e4eaf5" text-anchor="middle">8 h</text>
<rect x="14.0" y="633.6" width="322.0" height="174.0" rx="12" fill="#0d2347" stroke="#274a8a" stroke-width="1.2"/>
<text x="26.0" y="663.6" font-size="16" fill="#61dafb" font-weight="700">Ce que vise chaque essai</text>
<text x="26.0" y="690.6" font-size="15" fill="#e4eaf5">1 : Sol sec, le matin.</text>
<text x="26.0" y="711.6" font-size="15" fill="#e4eaf5">2 : Sol humide, le matin.</text>
<text x="26.0" y="732.6" font-size="15" fill="#e4eaf5">3 : Sol sec, mais la NUIT.</text>
<text x="26.0" y="753.6" font-size="15" fill="#e4eaf5">4 : Frontière — juste sous le seuil.</text>
<text x="26.0" y="774.6" font-size="15" fill="#e4eaf5">5 : Frontière — sur le seuil pile.</text>
<text x="26.0" y="795.6" font-size="15" fill="#e4eaf5">6 : Absurde — capteur débranché.</text>
<text x="14.0" y="837.8" font-size="13.5" fill="#9bbefc">H : l'humidité du sol, en % (pour cent) · h : heure ·</text>
<text x="14.0" y="856.0" font-size="13.5" fill="#9bbefc">Le document ne dit pas ce que fait la pompe :</text>
<text x="14.0" y="874.3" font-size="13.5" fill="#9bbefc">c'est la question.</text>
</svg>
