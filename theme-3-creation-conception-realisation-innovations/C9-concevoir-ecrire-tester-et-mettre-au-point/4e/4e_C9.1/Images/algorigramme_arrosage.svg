<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t-ar d-ar">
<title id="t-ar">Algorigramme de l'arrosage du jardin connecté : mesurer, décider, agir, recommencer</title>
<desc id="d-ar">Algorigramme normalisé, à lire de haut en bas, cinq blocs numérotés.

Bloc 1, en haut, un TERMINAL (rectangle aux bouts arrondis) : DÉBUT — au démarrage du système.

Une flèche descend vers le bloc 2, un RECTANGLE de traitement : « Mesurer l'humidité H et lire l'heure ». C'est l'entrée : deux informations entrent dans le programme, l'une venant d'un capteur, l'autre de l'horloge.

Une flèche descend vers le bloc 3, un LOSANGE de décision, la seule forme qui pose une question : « H inférieur à 40 ET heure comprise entre 6 et 10 ? ». Le losange a deux sorties et deux seulement, OUI et NON. Une bulle de commentaire en pointillés violets, rattachée au losange, précise que le ET vit À L'INTÉRIEUR de la question : ce n'est pas un deuxième losange, c'est une seule décision portant sur deux conditions à la fois. Les deux doivent être vraies.

La sortie OUI, à gauche, mène au bloc 4, un rectangle : « allumer la pompe ». La sortie NON, à droite, mène au bloc 5, un rectangle : « éteindre la pompe ».

Les deux chemins se rejoignent en bas, et une flèche remonte le long du bord gauche jusqu'au-dessus du bloc 2 : c'est la BOUCLE de surveillance. Un commentaire l'accompagne : un jardin ne se surveille pas une fois, il se surveille en continu — l'algorigramme n'a pas de bloc FIN, et c'est voulu.

Un encart en bas rappelle les trois formes et leur rôle : le terminal commence ou finit, le rectangle FAIT quelque chose, le losange DEMANDE quelque chose. Un losange ne fait jamais rien : il oriente.</desc>
<rect width="820" height="700" fill="#050f24"/>
<text x="410" y="30" text-anchor="middle" fill="#81aaff" font-size="19" font-weight="700">L'arrosage du jardin, dessiné avant d'être écrit</text>

<defs>
  <marker id="fa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#9bbefc"/></marker>
  <marker id="fo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#81fba1"/></marker>
  <marker id="fn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#ffb454"/></marker>
</defs>

<!-- 1 DÉBUT -->
<rect x="310" y="56" width="200" height="46" rx="23" fill="#123322" stroke="#81fba1" stroke-width="2.5"/>
<text x="410" y="85" text-anchor="middle" fill="#81fba1" font-size="15" font-weight="700">DÉBUT</text>
<circle cx="290" cy="79" r="13" fill="#173666" stroke="#61dafb"/><text x="290" y="84" text-anchor="middle" fill="#61dafb" font-size="13" font-weight="700">1</text>
<line x1="410" y1="102" x2="410" y2="140" stroke="#9bbefc" stroke-width="2.5" marker-end="url(#fa)"/>

<!-- 2 mesurer -->
<rect x="270" y="146" width="280" height="62" rx="6" fill="#173666" stroke="#61dafb" stroke-width="2.5"/>
<text x="410" y="172" text-anchor="middle" fill="#e4eaf5" font-size="13.5" font-weight="700">Mesurer l'humidité H</text>
<text x="410" y="192" text-anchor="middle" fill="#e4eaf5" font-size="13.5" font-weight="700">et lire l'heure</text>
<circle cx="250" cy="177" r="13" fill="#173666" stroke="#61dafb"/><text x="250" y="182" text-anchor="middle" fill="#61dafb" font-size="13" font-weight="700">2</text>
<line x1="410" y1="208" x2="410" y2="248" stroke="#9bbefc" stroke-width="2.5" marker-end="url(#fa)"/>

<!-- 3 losange -->
<path d="M410 254 L 610 344 L 410 434 L 210 344 Z" fill="#2a1b45" stroke="#c68ef2" stroke-width="2.5"/>
<text x="410" y="332" text-anchor="middle" fill="#e4eaf5" font-size="13.5" font-weight="700">H &lt; 40</text>
<text x="410" y="352" text-anchor="middle" fill="#ffd66b" font-size="13.5" font-weight="700">ET</text>
<text x="410" y="372" text-anchor="middle" fill="#e4eaf5" font-size="13.5" font-weight="700">6 ≤ heure ≤ 10 ?</text>
<circle cx="190" cy="344" r="13" fill="#173666" stroke="#61dafb"/><text x="190" y="349" text-anchor="middle" fill="#61dafb" font-size="13" font-weight="700">3</text>

<!-- bulle de commentaire -->
<rect x="626" y="252" width="182" height="94" rx="10" fill="rgba(198,142,242,.1)" stroke="#c68ef2" stroke-dasharray="6 4"/>
<text x="717" y="274" text-anchor="middle" fill="#c68ef2" font-size="11.5" font-weight="700">le ET vit DANS la question</text>
<text x="717" y="294" text-anchor="middle" fill="#e4eaf5" font-size="11">ce n'est pas un deuxième</text>
<text x="717" y="310" text-anchor="middle" fill="#e4eaf5" font-size="11">losange : c'est UNE décision</text>
<text x="717" y="326" text-anchor="middle" fill="#e4eaf5" font-size="11">portant sur DEUX conditions.</text>
<text x="717" y="340" text-anchor="middle" fill="#ffd66b" font-size="11" font-weight="700">Les deux doivent être vraies.</text>
<line x1="624" y1="299" x2="606" y2="330" stroke="#c68ef2" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- OUI à gauche -->
<line x1="210" y1="344" x2="130" y2="344" stroke="#81fba1" stroke-width="2.5"/>
<line x1="130" y1="344" x2="130" y2="470" stroke="#81fba1" stroke-width="2.5" marker-end="url(#fo)"/>
<text x="168" y="334" text-anchor="middle" fill="#81fba1" font-size="12.5" font-weight="700">OUI</text>
<rect x="36" y="476" width="188" height="56" rx="6" fill="#123322" stroke="#81fba1" stroke-width="2.5"/>
<text x="130" y="510" text-anchor="middle" fill="#81fba1" font-size="13.5" font-weight="700">allumer la pompe</text>
<circle cx="36" cy="460" r="13" fill="#173666" stroke="#61dafb"/><text x="36" y="465" text-anchor="middle" fill="#61dafb" font-size="13" font-weight="700">4</text>

<!-- NON à droite -->
<line x1="610" y1="344" x2="690" y2="344" stroke="#ffb454" stroke-width="2.5"/>
<line x1="690" y1="344" x2="690" y2="470" stroke="#ffb454" stroke-width="2.5" marker-end="url(#fn)"/>
<text x="652" y="334" text-anchor="middle" fill="#ffb454" font-size="12.5" font-weight="700">NON</text>
<rect x="596" y="476" width="188" height="56" rx="6" fill="#3a2412" stroke="#ffb454" stroke-width="2.5"/>
<text x="690" y="510" text-anchor="middle" fill="#ffb454" font-size="13.5" font-weight="700">éteindre la pompe</text>
<circle cx="784" cy="460" r="13" fill="#173666" stroke="#61dafb"/><text x="784" y="465" text-anchor="middle" fill="#61dafb" font-size="13" font-weight="700">5</text>

<!-- jonction -->
<line x1="130" y1="532" x2="130" y2="566" stroke="#9bbefc" stroke-width="2.5"/>
<line x1="690" y1="532" x2="690" y2="566" stroke="#9bbefc" stroke-width="2.5"/>
<line x1="130" y1="566" x2="690" y2="566" stroke="#9bbefc" stroke-width="2.5"/>

<!-- boucle de retour -->
<line x1="410" y1="566" x2="410" y2="592" stroke="#ffd66b" stroke-width="3"/>
<line x1="410" y1="592" x2="24" y2="592" stroke="#ffd66b" stroke-width="3"/>
<line x1="24" y1="592" x2="24" y2="177" stroke="#ffd66b" stroke-width="3"/>
<line x1="24" y1="177" x2="268" y2="177" stroke="#ffd66b" stroke-width="3" marker-end="url(#fa)"/>
<text x="410" y="612" text-anchor="middle" fill="#ffd66b" font-size="12.5" font-weight="700">↺ LA BOUCLE — on recommence, indéfiniment</text>
<text x="410" y="630" text-anchor="middle" fill="#9bbefc" font-size="11">Un jardin ne se surveille pas une fois. Il n'y a pas de bloc FIN, et c'est voulu.</text>

<!-- légende des formes -->
<rect x="150" y="648" width="520" height="40" rx="8" fill="#0d2347" stroke="#274a8a"/>
<rect x="166" y="660" width="44" height="16" rx="8" fill="#123322" stroke="#81fba1"/>
<text x="216" y="673" fill="#e4eaf5" font-size="11">commence ou finit</text>
<rect x="336" y="660" width="44" height="16" rx="3" fill="#173666" stroke="#61dafb"/>
<text x="386" y="673" fill="#e4eaf5" font-size="11">FAIT quelque chose</text>
<path d="M528 668 L 550 660 L 572 668 L 550 676 Z" fill="#2a1b45" stroke="#c68ef2"/>
<text x="580" y="673" fill="#e4eaf5" font-size="11">DEMANDE — il ne fait rien</text>
</svg>
