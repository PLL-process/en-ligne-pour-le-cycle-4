<text x="420" y="435" text-anchor="middle" fill="#ffd66b" font-size="10.5" font-weight="700">le RELAIS = préactionneur</text>
<text x="420" y="452" text-anchor="middle" fill="#e4eaf5" font-size="10.5">il ouvre ou ferme le passage</text>

<rect x="588" y="392" width="150" height="76" rx="10" fill="#3a2412" stroke="#ffb454" stroke-width="2"/>
