<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t-cj d-cj">
<title id="t-cj">Les deux chaînes du jardin connecté : l'information décide, l'énergie pompe — et ici, la flèche d'ordre atterrit sur un relais</title>
<desc id="d-cj">Schéma bloc à lire selon la convention du dépôt : l'information en haut, l'énergie en bas, la flèche d'ordre qui descend.

En haut, la chaîne d'information. Deux entrées à gauche : l'HUMIDITÉ DU SOL, grandeur physique lue par le capteur d'humidité, et l'HEURE, donnée par l'horloge de la carte — deux entrées de natures différentes, l'une venue du monde, l'autre du temps. Elles arrivent au bloc ACQUÉRIR (capteur d'humidité et horloge, conversion en un nombre de 0 à 100). Une flèche étiquetée « données » mène au bloc TRAITER : la carte et le programme, avec les deux seuils 35 et 45 et la mémoire de l'état courant de la pompe. Une flèche étiquetée « décision » mène au bloc COMMUNIQUER : l'écran ou la console qui affiche POMPE ON ou POMPE OFF, plus le voyant — c'est ce qui permet à l'humain de savoir ce que la machine a décidé.

Entre les deux chaînes, une grande flèche jaune descend de TRAITER et vient se poser sur le RELAIS. Une note explique pourquoi elle atterrit là et non sur le moteur : la pompe fonctionne en 12 volts et consomme bien plus qu'une broche ne peut fournir. Le relais est le préactionneur : il reçoit un petit signal de commande et laisse passer une grosse énergie. Un rappel signale que dans la station d'alerte cyclonique de 3e, où la sortie était un simple voyant, cette même flèche atterrissait directement sur CONVERTIR — la règle est la même, c'est la puissance qui change.

En bas, la chaîne d'énergie, de gauche à droite : ALIMENTER, une alimentation 12 volts séparée — surtout pas l'USB de la carte ; DISTRIBUER, le relais qui ouvre ou ferme le passage ; CONVERTIR, le moteur de la pompe qui transforme l'électricité en rotation ; TRANSMETTRE, l'arbre du moteur qui entraîne la turbine. Enfin l'eau part vers le sol.

Un encart de comparaison souligne la différence avec la station de 3e : ici, quelque chose se DÉPLACE — l'eau — donc la fonction TRANSMETTRE existe vraiment. Une station qui allume et qui sonne n'en avait pas.</desc>
<rect width="1000" height="600" fill="#050f24"/>
<text x="500" y="30" text-anchor="middle" fill="#81aaff" font-size="20" font-weight="700">Le jardin connecté : deux chaînes, et un relais entre les deux</text>

<defs>
