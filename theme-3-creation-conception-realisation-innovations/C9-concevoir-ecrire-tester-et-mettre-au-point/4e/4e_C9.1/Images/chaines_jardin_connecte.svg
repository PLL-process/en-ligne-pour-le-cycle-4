<text x="946" y="155" fill="#e4eaf5" font-size="18">👤</text>

<!-- ══ flèche d'ORDRE, vers le RELAIS ══ -->
<path d="M570 206 L 570 288 L 420 288 L 420 364" stroke="#ffd66b" stroke-width="6" fill="none" marker-end="url(#jo)"/>
<rect x="598" y="270" width="382" height="76" rx="8" fill="rgba(255,214,107,.1)" stroke="#ffd66b"/>
<text x="789" y="291" text-anchor="middle" fill="#ffd66b" font-size="13" font-weight="700">l'ORDRE descend — et il s'arrête sur le RELAIS</text>
<text x="789" y="310" text-anchor="middle" fill="#e4eaf5" font-size="11.5">La pompe est en 12 V et consomme cent fois ce qu'une broche</text>
<text x="789" y="326" text-anchor="middle" fill="#e4eaf5" font-size="11.5">peut donner. Le relais reçoit le petit signal, et laisse passer la grosse énergie.</text>
<text x="789" y="341" text-anchor="middle" fill="#9bbefc" font-size="10.5">En 3e, sur la station d'alerte, la sortie était un voyant : la flèche allait droit sur CONVERTIR.</text>

<!-- ══ énergie ══ -->
<rect x="20" y="356" width="960" height="150" rx="12" fill="rgba(255,180,84,.05)" stroke="#ffb454" stroke-dasharray="6 4"/>
<text x="40" y="380" fill="#ffb454" font-size="14" font-weight="700">CHAÎNE D'ÉNERGIE — en BAS (elle obéit)</text>

<rect x="40" y="392" width="150" height="76" rx="10" fill="#3a2412" stroke="#ffb454" stroke-width="2"/>
