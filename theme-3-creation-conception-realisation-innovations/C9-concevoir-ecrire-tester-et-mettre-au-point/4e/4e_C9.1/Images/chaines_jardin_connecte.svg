<text x="663" y="453" text-anchor="middle" fill="#e4eaf5" font-size="11">électricité → rotation</text>

<rect x="790" y="392" width="150" height="76" rx="10" fill="#123322" stroke="#81fba1" stroke-width="2.5"/>
<text x="865" y="418" text-anchor="middle" fill="#81fba1" font-size="13" font-weight="700">TRANSMETTRE</text>
<text x="865" y="437" text-anchor="middle" fill="#e4eaf5" font-size="11">l'arbre entraîne</text>
<text x="865" y="453" text-anchor="middle" fill="#e4eaf5" font-size="11">la turbine → l'eau part</text>

<line x1="192" y1="430" x2="343" y2="430" stroke="#ffb454" stroke-width="3" marker-end="url(#je)"/>
<line x1="497" y1="430" x2="586" y2="430" stroke="#ffb454" stroke-width="3" marker-end="url(#je)"/>
<line x1="740" y1="430" x2="788" y2="430" stroke="#81fba1" stroke-width="3" marker-end="url(#je)"/>

<rect x="130" y="480" width="740" height="20" rx="6" fill="none" stroke="none"/>
<text x="500" y="494" text-anchor="middle" fill="#81fba1" font-size="12" font-weight="700">Ici, quelque chose SE DÉPLACE — l'eau. C'est pour cela que TRANSMETTRE existe vraiment dans cette chaîne.</text>

<text x="500" y="534" text-anchor="middle" fill="#9bbefc" font-size="12" font-style="italic">📐 L'INFORMATION en haut, l'ÉNERGIE en bas, la flèche d'ORDRE qui descend : la disposition montre qui commande.</text>
<text x="500" y="562" text-anchor="middle" fill="#c68ef2" font-size="11.5" font-weight="700">La règle : la flèche d'ORDRE atterrit sur le PREMIER bloc de la chaîne d'énergie qu'elle commande.</text>
<text x="500" y="580" text-anchor="middle" fill="#e4eaf5" font-size="11">Le convertisseur quand la puissance est minuscule (un voyant) ; le préactionneur dès qu'elle ne l'est plus (une pompe).</text>
