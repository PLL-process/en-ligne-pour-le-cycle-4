<text x="115" y="439" text-anchor="middle" fill="#e4eaf5" font-size="11">alimentation 12 V</text>
<text x="115" y="455" text-anchor="middle" fill="#ff7b88" font-size="10.5">séparée — PAS l'USB</text>

<rect x="345" y="392" width="150" height="76" rx="10" fill="#2a1b45" stroke="#c68ef2" stroke-width="2.5"/>
