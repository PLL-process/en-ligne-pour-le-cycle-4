<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Chaîne d'énergie du Book Train de la New York Public Library</title>
<desc id="d">Schéma fonctionnel horizontal en quatre blocs : Alimenter (réseau électrique urbain 13,2 kilovolts alternatif, avec batterie rechargeable 48 volts en source auxiliaire), Distribuer (transformateur abaisseur 480 volts alternatif, redresseur alternatif-continu 48 volts continu, puis barre d'alimentation du rail), Convertir (moteur électrique 48 volts continu du wagonnet), Transmettre (réducteur et entraînement par galets sur le rail). La sortie est l'action : déplacer le wagonnet et sa nacelle dans le tunnel puis la montée verticale. Une flèche d'ordre descend depuis la chaîne d'information (automate PLC et capteurs) vers le bloc Convertir, conformément à la convention : l'information en haut, l'énergie en bas, la flèche d'ordre qui descend.</desc>

<style>
  .flux-anime{animation:flux 1.1s linear infinite}
  @keyframes flux{to{stroke-dashoffset:-32}}
  @media (prefers-reduced-motion:reduce){.flux-anime{animation:none}}
</style>

<!-- fond -->
<rect x="0" y="0" width="1060" height="560" fill="#fdfcf8"/>
<text x="30" y="42" font-size="26" font-weight="bold" font-family="Georgia, serif" fill="#2d3a46">⚡ Chaîne d'énergie du Book Train</text>
<text x="30" y="66" font-size="15" fill="#5a6068" font-style="italic">Bryant Park → Rose Main Reading Room · alimentation et motorisation des 24 wagonnets</text>

<!-- ============ Zone INFORMATION (en haut, rappel) ============ -->
<rect x="330" y="88" width="400" height="66" rx="10" fill="#eef3f7" stroke="#2d3a46" stroke-width="2" stroke-dasharray="8 5"/>
<text x="530" y="114" font-size="15" font-weight="bold" fill="#2d3a46" text-anchor="middle">CHAÎNE D'INFORMATION (rappel)</text>
<text x="530" y="136" font-size="13.5" fill="#2d3a46" text-anchor="middle">Automate (PLC) + capteurs de station + destination programmée</text>

<!-- Flèche d'ORDRE qui descend -->
<defs>
  <marker id="fleche" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#20242e"/>
  </marker>
  <marker id="fleche-ordre" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#8f221d"/>
  </marker>
</defs>
<line x1="530" y1="154" x2="530" y2="300" stroke="#8f221d" stroke-width="3.5" class="flux-anime" stroke-dasharray="10 6" marker-end="url(#fleche-ordre)"/>
<text x="544" y="230" font-size="14" font-weight="bold" fill="#8f221d">ORDRE</text>
<text x="544" y="248" font-size="12.5" fill="#8f221d">« démarre / accélère /</text>
<text x="544" y="264" font-size="12.5" fill="#8f221d">ralentis / stoppe »</text>

<!-- séparation info / énergie -->
<line x1="20" y1="176" x2="470" y2="176" stroke="#a8823c" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="600" y1="176" x2="1040" y2="176" stroke="#a8823c" stroke-width="1.5" stroke-dasharray="4 6"/>
<text x="30" y="196" font-size="12.5" fill="#a8823c" font-style="italic">— au-dessus : l'information décide · en dessous : l'énergie exécute —</text>

<!-- ============ CHAÎNE D'ÉNERGIE ============ -->
<!-- Bloc ALIMENTER -->
<g>
  <rect x="30" y="300" width="210" height="120" rx="10" fill="#fff" stroke="#c0322b" stroke-width="3"/>
  <rect x="30" y="300" width="210" height="34" rx="10" fill="#c0322b"/>
  <text x="135" y="323" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">ALIMENTER</text>
  <text x="135" y="356" font-size="14" text-anchor="middle" fill="#20242e">Réseau électrique urbain</text>
  <text x="135" y="375" font-size="14" font-weight="bold" text-anchor="middle" fill="#20242e">13,2 kV ~ (AC)</text>
  <text x="135" y="398" font-size="12.5" text-anchor="middle" fill="#5a6068">énergie électrique de la ville</text>
</g>
<!-- source auxiliaire -->
<g>
  <rect x="30" y="448" width="210" height="72" rx="10" fill="#faf6ec" stroke="#a8823c" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="135" y="474" font-size="13.5" font-weight="bold" fill="#7a5e28" text-anchor="middle">🔋 Source auxiliaire</text>
  <text x="135" y="493" font-size="13" fill="#7a5e28" text-anchor="middle">Batterie rechargeable 24 V ⎓</text>
  <text x="135" y="510" font-size="12" fill="#7a5e28" text-anchor="middle">embarquée dans chaque wagonnet</text>
  <line x1="240" y1="484" x2="290" y2="484" stroke="#a8823c" stroke-width="2.5" stroke-dasharray="7 4"/>
  <path d="M290 484 V 420" stroke="#a8823c" stroke-width="2.5" class="flux-anime" stroke-dasharray="7 4" fill="none" marker-end="url(#fleche)"/>
  <text x="298" y="470" font-size="11.5" fill="#7a5e28">secours /</text>
  <text x="298" y="484" font-size="11.5" fill="#7a5e28">appoint</text>
</g>

<line x1="240" y1="360" x2="278" y2="360" stroke="#20242e" stroke-width="3" marker-end="url(#fleche)"/>

<!-- Bloc DISTRIBUER -->
<g>
  <rect x="282" y="286" width="248" height="148" rx="10" fill="#fff" stroke="#c0322b" stroke-width="3"/>
  <rect x="282" y="286" width="248" height="34" rx="10" fill="#c0322b"/>
  <text x="406" y="309" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">DISTRIBUER</text>
  <text x="406" y="342" font-size="13.5" text-anchor="middle" fill="#20242e">① Transformateur abaisseur</text>
  <text x="406" y="359" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#20242e">13,2 kV → 480 V ~ (AC)</text>
  <text x="406" y="381" font-size="13.5" text-anchor="middle" fill="#20242e">② Redresseur AC/DC</text>
  <text x="406" y="398" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#20242e">480 V ~ → 24 V ⎓ (DC)</text>
  <text x="406" y="420" font-size="13.5" text-anchor="middle" fill="#20242e">③ Barre d'alimentation du rail</text>
</g>

<line x1="530" y1="360" x2="568" y2="360" stroke="#20242e" stroke-width="3" marker-end="url(#fleche)"/>
<text x="549" y="348" font-size="12" fill="#5a6068" text-anchor="middle">24 V ⎓</text>

<!-- Bloc CONVERTIR -->
<g>
  <rect x="572" y="300" width="200" height="120" rx="10" fill="#fff" stroke="#c0322b" stroke-width="3"/>
  <rect x="572" y="300" width="200" height="34" rx="10" fill="#c0322b"/>
  <text x="672" y="323" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">CONVERTIR</text>
  <text x="672" y="356" font-size="14" text-anchor="middle" fill="#20242e">Moteur électrique</text>
  <text x="672" y="375" font-size="14" font-weight="bold" text-anchor="middle" fill="#20242e">24 V ⎓ (DC)</text>
  <text x="672" y="398" font-size="12.5" text-anchor="middle" fill="#5a6068">électricité → rotation</text>
</g>

<line x1="772" y1="360" x2="810" y2="360" stroke="#20242e" stroke-width="3" marker-end="url(#fleche)"/>
<text x="791" y="348" font-size="12" fill="#5a6068" text-anchor="middle">rotation</text>

<!-- Bloc TRANSMETTRE -->
<g>
  <rect x="814" y="300" width="216" height="120" rx="10" fill="#fff" stroke="#c0322b" stroke-width="3"/>
  <rect x="814" y="300" width="216" height="34" rx="10" fill="#c0322b"/>
  <text x="922" y="323" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">TRANSMETTRE</text>
  <text x="922" y="356" font-size="14" text-anchor="middle" fill="#20242e">Réducteur (gearbox)</text>
  <text x="922" y="375" font-size="14" text-anchor="middle" fill="#20242e">+ galets d'entraînement</text>
  <text x="922" y="398" font-size="12.5" text-anchor="middle" fill="#5a6068">adapte vitesse et effort sur le rail</text>
</g>

<!-- Sortie : ACTION -->
<line x1="922" y1="420" x2="922" y2="462" stroke="#20242e" stroke-width="3" marker-end="url(#fleche)"/>
<g>
  <rect x="700" y="466" width="330" height="72" rx="36" fill="#e7f5ed" stroke="#1e7d4f" stroke-width="3"/>
  <text x="865" y="496" font-size="15.5" font-weight="bold" fill="#1e7d4f" text-anchor="middle">🚃 ACTION : déplacer le wagonnet + nacelle</text>
  <text x="865" y="518" font-size="13" fill="#1e7d4f" text-anchor="middle">tunnel horizontal puis montée verticale · ≈ 23 m/min (1,4 km/h)</text>
</g>

<!-- légende -->
<g font-size="12.5" fill="#20242e">
  <line x1="330" y1="470" x2="370" y2="470" stroke="#20242e" stroke-width="3" marker-end="url(#fleche)"/>
  <text x="378" y="475">flux d'énergie</text>
  <line x1="330" y1="496" x2="370" y2="496" stroke="#8f221d" stroke-width="3" class="flux-anime" stroke-dasharray="9 5" marker-end="url(#fleche-ordre)"/>
  <text x="378" y="501">ordre (information → énergie)</text>
  <line x1="330" y1="522" x2="370" y2="522" stroke="#a8823c" stroke-width="2.5" class="flux-anime" stroke-dasharray="7 4" marker-end="url(#fleche)"/>
  <text x="378" y="527">source auxiliaire (secours)</text>
</g>

<text x="30" y="548" font-size="11" fill="#8a929c">Schéma original CC0 — séquence « Book Train » · convention du dépôt : information en haut, énergie en bas, la flèche d'ordre descend.</text>
</svg>
