<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Chaîne d'énergie du Book Train de la New York Public Library</title>
<desc id="d">Schéma fonctionnel horizontal en quatre blocs : Alimenter (réseau électrique urbain 13,2 kilovolts alternatif, avec batterie rechargeable 24 volts en source auxiliaire), Distribuer (transformateur abaisseur 480 volts alternatif, redresseur alternatif-continu 24 volts continu, puis barre d'alimentation du rail), Convertir (moteur électrique 24 volts continu du wagonnet), Transmettre (réducteur et entraînement par galets sur le rail). La sortie est l'action : déplacer le wagonnet et sa nacelle dans le tunnel puis la montée verticale. Une flèche d'ordre descend depuis la chaîne d'information (automate PLC et capteurs) vers le bloc Distribuer, conformément à la convention : l'information en haut, l'énergie en bas, la flèche d'ordre qui descend.</desc>

<style>
  .flux-anime{animation:flux 1.1s linear infinite}
  @keyframes flux{to{stroke-dashoffset:-32}}
  @media (prefers-reduced-motion:reduce){.flux-anime{animation:none}}
  .pulse{filter:drop-shadow(0 0 2px rgba(232,161,58,.8))}
  @media (prefers-reduced-motion:reduce){.pulse{display:none}}
</style>

<defs>
  <linearGradient id="g-rouge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d64541"/><stop offset="1" stop-color="#a8281f"/>
  </linearGradient>
  <linearGradient id="g-bloc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf7f0"/>
  </linearGradient>
  <linearGradient id="g-vert" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eef9f2"/><stop offset="1" stop-color="#d6efe0"/>
  </linearGradient>
  <linearGradient id="g-acier" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2f6fa"/><stop offset="1" stop-color="#e2eaf1"/>
  </linearGradient>
  <linearGradient id="g-or" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf9ee"/><stop offset="1" stop-color="#f5ecd6"/>
  </linearGradient>
  <filter id="ombre" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2d3a46" flood-opacity="0.22"/>
  </filter>
  <filter id="ombre-l" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#2d3a46" flood-opacity="0.15"/>
  </filter>
  <marker id="fleche" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L11,5.5 L0,11 z" fill="#2b2f38"/>
  </marker>
  <marker id="fleche-ordre" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L11,5.5 L0,11 z" fill="#8f221d"/>
  </marker>
  <marker id="fleche-or" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a8823c"/>
  </marker>
</defs>

<!-- fond + zones pédagogiques teintées -->
<rect x="0" y="0" width="1060" height="560" fill="#fdfcf8"/>
<rect x="14" y="80" width="1032" height="106" rx="16" fill="#eef3f7" opacity="0.45"/>
<rect x="14" y="270" width="1032" height="276" rx="16" fill="#fbf0ef" opacity="0.5"/>
<text x="1032" y="102" font-size="12" font-weight="bold" fill="#7d94a8" text-anchor="end" letter-spacing="2">INFORMATION</text>
<text x="1032" y="292" font-size="12" font-weight="bold" fill="#c9948f" text-anchor="end" letter-spacing="2">ÉNERGIE</text>

<!-- titre -->
<text x="30" y="42" font-size="26" font-weight="bold" font-family="Georgia, serif" fill="#2d3a46">⚡ Chaîne d'énergie du Book Train</text>
<rect x="30" y="50" width="330" height="3" rx="1.5" fill="#a8823c"/>
<text x="30" y="70" font-size="15" fill="#5a6068" font-style="italic">Bryant Park → Rose Main Reading Room · alimentation et motorisation des 24 wagonnets</text>

<!-- ============ Zone INFORMATION (rappel) ============ -->
<g filter="url(#ombre-l)">
  <rect x="206" y="92" width="400" height="66" rx="14" fill="url(#g-acier)" stroke="#2d3a46" stroke-width="2" stroke-dasharray="8 5"/>
</g>
<text x="406" y="118" font-size="15" font-weight="bold" fill="#2d3a46" text-anchor="middle" letter-spacing="0.5">CHAÎNE D'INFORMATION (rappel)</text>
<text x="406" y="140" font-size="13.5" fill="#2d3a46" text-anchor="middle">Automate (PLC) + capteurs de station + destination programmée</text>

<!-- Flèche d'ORDRE : axe de DISTRIBUER (x=406), elle descend -->
<line x1="406" y1="158" x2="406" y2="282" stroke="#8f221d" stroke-width="4" class="flux-anime" stroke-dasharray="10 6" marker-end="url(#fleche-ordre)"/>
<g filter="url(#ombre-l)">
  <rect x="418" y="210" width="164" height="62" rx="10" fill="#fff" stroke="#e4c8c5" stroke-width="1.5"/>
</g>
<text x="430" y="230" font-size="14" font-weight="bold" fill="#8f221d">ORDRE</text>
<text x="430" y="248" font-size="12.5" fill="#8f221d">« démarre / accélère /</text>
<text x="430" y="264" font-size="12.5" fill="#8f221d">ralentis / stoppe »</text>

<!-- séparation info / énergie -->
<line x1="20" y1="192" x2="470" y2="192" stroke="#a8823c" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="600" y1="192" x2="1040" y2="192" stroke="#a8823c" stroke-width="1.5" stroke-dasharray="4 6"/>
<text x="30" y="212" font-size="12.5" fill="#a8823c" font-style="italic">— au-dessus : l'information décide · en dessous : l'énergie exécute —</text>

<!-- ============ CHAÎNE D'ÉNERGIE ============ -->
<!-- ALIMENTER -->
<g filter="url(#ombre)">
  <rect x="30" y="300" width="210" height="120" rx="14" fill="url(#g-bloc)" stroke="#c0322b" stroke-width="3"/>
  <path d="M30 314 a14 14 0 0 1 14 -14 h182 a14 14 0 0 1 14 14 v20 h-210 z" fill="url(#g-rouge)"/>
</g>
<text x="135" y="323" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="1">ALIMENTER</text>
<text x="135" y="356" font-size="14" text-anchor="middle" fill="#20242e">Réseau électrique urbain</text>
<text x="135" y="375" font-size="14" font-weight="bold" text-anchor="middle" fill="#20242e">13,2 kV ~ (AC)</text>
<text x="135" y="398" font-size="12.5" text-anchor="middle" fill="#5a6068">énergie électrique de la ville</text>

<!-- source auxiliaire -->
<g filter="url(#ombre-l)">
  <rect x="30" y="448" width="210" height="72" rx="12" fill="url(#g-or)" stroke="#a8823c" stroke-width="2" stroke-dasharray="7 4"/>
</g>
<text x="135" y="474" font-size="13.5" font-weight="bold" fill="#7a5e28" text-anchor="middle">🔋 Source auxiliaire</text>
<text x="135" y="493" font-size="13" fill="#7a5e28" text-anchor="middle">Batterie rechargeable 24 V ⎓</text>
<text x="135" y="510" font-size="12" fill="#7a5e28" text-anchor="middle">embarquée dans chaque wagonnet</text>
<line x1="240" y1="484" x2="290" y2="484" stroke="#a8823c" stroke-width="2.5" stroke-dasharray="7 4"/>
<path d="M290 484 V 420" stroke="#a8823c" stroke-width="2.5" class="flux-anime" stroke-dasharray="7 4" fill="none" marker-end="url(#fleche-or)"/>
<text x="298" y="470" font-size="11.5" fill="#7a5e28">secours /</text>
<text x="298" y="484" font-size="11.5" fill="#7a5e28">appoint</text>

<line x1="240" y1="360" x2="278" y2="360" stroke="#2b2f38" stroke-width="3.5" marker-end="url(#fleche)"/>

<!-- DISTRIBUER -->
<g filter="url(#ombre)">
  <rect x="282" y="286" width="248" height="148" rx="14" fill="url(#g-bloc)" stroke="#c0322b" stroke-width="3"/>
  <path d="M282 300 a14 14 0 0 1 14 -14 h220 a14 14 0 0 1 14 14 v20 h-248 z" fill="url(#g-rouge)"/>
</g>
<text x="406" y="309" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="1">DISTRIBUER</text>
<text x="406" y="342" font-size="13.5" text-anchor="middle" fill="#20242e">① Transformateur abaisseur</text>
<text x="406" y="359" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#20242e">13,2 kV → 480 V ~ (AC)</text>
<text x="406" y="381" font-size="13.5" text-anchor="middle" fill="#20242e">② Redresseur AC/DC</text>
<text x="406" y="398" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#20242e">480 V ~ → 24 V ⎓ (DC)</text>
<text x="406" y="420" font-size="13.5" text-anchor="middle" fill="#20242e">③ Barre d'alimentation du rail</text>

<line x1="530" y1="360" x2="568" y2="360" stroke="#2b2f38" stroke-width="3.5" marker-end="url(#fleche)"/>
<g filter="url(#ombre-l)"><rect x="524" y="330" width="52" height="20" rx="10" fill="#fff" stroke="#d9d2c0"/></g>
<text x="550" y="344" font-size="11.5" font-weight="bold" fill="#5a6068" text-anchor="middle">24 V ⎓</text>

<!-- CONVERTIR -->
<g filter="url(#ombre)">
  <rect x="572" y="300" width="200" height="120" rx="14" fill="url(#g-bloc)" stroke="#c0322b" stroke-width="3"/>
  <path d="M572 314 a14 14 0 0 1 14 -14 h172 a14 14 0 0 1 14 14 v20 h-200 z" fill="url(#g-rouge)"/>
</g>
<text x="672" y="323" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="1">CONVERTIR</text>
<text x="672" y="356" font-size="14" text-anchor="middle" fill="#20242e">Moteur électrique</text>
<text x="672" y="375" font-size="14" font-weight="bold" text-anchor="middle" fill="#20242e">24 V ⎓ (DC)</text>
<text x="672" y="398" font-size="12.5" text-anchor="middle" fill="#5a6068">électricité → rotation</text>

<line x1="772" y1="360" x2="810" y2="360" stroke="#2b2f38" stroke-width="3.5" marker-end="url(#fleche)"/>
<g filter="url(#ombre-l)"><rect x="762" y="330" width="58" height="20" rx="10" fill="#fff" stroke="#d9d2c0"/></g>
<text x="791" y="344" font-size="11.5" font-weight="bold" fill="#5a6068" text-anchor="middle">rotation</text>

<!-- TRANSMETTRE -->
<g filter="url(#ombre)">
  <rect x="814" y="300" width="216" height="120" rx="14" fill="url(#g-bloc)" stroke="#c0322b" stroke-width="3"/>
  <path d="M814 314 a14 14 0 0 1 14 -14 h188 a14 14 0 0 1 14 14 v20 h-216 z" fill="url(#g-rouge)"/>
</g>
<text x="922" y="323" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="1">TRANSMETTRE</text>
<text x="922" y="356" font-size="14" text-anchor="middle" fill="#20242e">Réducteur (gearbox)</text>
<text x="922" y="375" font-size="14" text-anchor="middle" fill="#20242e">+ galets d'entraînement</text>
<text x="922" y="398" font-size="12.5" text-anchor="middle" fill="#5a6068">adapte vitesse et effort sur le rail</text>

<!-- Sortie : ACTION -->
<line x1="922" y1="420" x2="922" y2="462" stroke="#2b2f38" stroke-width="3.5" marker-end="url(#fleche)"/>
<g filter="url(#ombre)">
  <rect x="700" y="466" width="330" height="72" rx="36" fill="url(#g-vert)" stroke="#1e7d4f" stroke-width="3"/>
</g>
<text x="865" y="496" font-size="15.5" font-weight="bold" fill="#1e7d4f" text-anchor="middle">🚃 ACTION : déplacer le wagonnet + nacelle</text>
<text x="865" y="518" font-size="13" fill="#1e7d4f" text-anchor="middle">tunnel horizontal puis montée verticale · ≈ 23 m/min (1,4 km/h)</text>

<!-- légende (panneau) -->
<g filter="url(#ombre-l)">
  <rect x="318" y="448" width="300" height="92" rx="12" fill="#fff" stroke="#d9d2c0" stroke-width="1.5"/>
</g>
<text x="334" y="468" font-size="12" font-weight="bold" fill="#5a6068" letter-spacing="1">LÉGENDE</text>
<g font-size="12.5" fill="#20242e">
  <line x1="334" y1="484" x2="374" y2="484" stroke="#2b2f38" stroke-width="3" marker-end="url(#fleche)"/>
  <text x="382" y="489">flux d'énergie</text>
  <line x1="334" y1="506" x2="374" y2="506" stroke="#8f221d" stroke-width="3" class="flux-anime" stroke-dasharray="9 5" marker-end="url(#fleche-ordre)"/>
  <text x="382" y="511">ordre (information → énergie)</text>
  <line x1="334" y1="528" x2="374" y2="528" stroke="#a8823c" stroke-width="2.5" class="flux-anime" stroke-dasharray="7 4" marker-end="url(#fleche-or)"/>
  <text x="382" y="533">source auxiliaire (secours)</text>
</g>

<!-- impulsions : le flux d'énergie voyage (trait plein = continu, la bille montre le sens) -->
<circle r="3.5" fill="#e8a13a" class="pulse" opacity="0.9"><animateMotion dur="1.1s" begin="0s" repeatCount="indefinite" path="M240,360 L278,360"/></circle>
<circle r="3.5" fill="#e8a13a" class="pulse" opacity="0.9"><animateMotion dur="1.1s" begin="0.35s" repeatCount="indefinite" path="M530,360 L568,360"/></circle>
<circle r="3.5" fill="#e8a13a" class="pulse" opacity="0.9"><animateMotion dur="1.1s" begin="0.7s" repeatCount="indefinite" path="M772,360 L810,360"/></circle>
<circle r="3.5" fill="#e8a13a" class="pulse" opacity="0.9"><animateMotion dur="1.2s" begin="0.2s" repeatCount="indefinite" path="M922,420 L922,462"/></circle>
<circle r="3" fill="#e8a13a" class="pulse" opacity="0.9"><animateMotion dur="1.3s" begin="0s" repeatCount="indefinite" path="M334,484 L374,484"/></circle>

<text x="30" y="552" font-size="11" fill="#8a929c">Schéma original CC0 — séquence « Book Train » · convention du dépôt : information en haut, énergie en bas, la flèche d'ordre descend.</text>
</svg>
